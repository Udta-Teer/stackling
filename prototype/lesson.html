const UNIT19 = {"unitId":"consistency-models","title":"Consistency Models","subtitle":"Not one dial from weak to strong — a menu of promises about what a read can return","lessons":[{"id":"cm-1","title":"A promise about reads","exercises":[{"id":"cm-1-0","type":"concept","title":"A consistency model is a contract about what a read may return — not a quality setting","viz":{"nodes":[{"id":"r","label":"Your read","col":0,"kind":"client"},{"id":"a","label":"Replica A","sub":"has the write","col":1,"kind":"db"},{"id":"b","label":"Replica B","sub":"not yet","col":1,"kind":"db"}],"edges":[{"from":"r","to":"a","dash":true},{"from":"r","to":"b","dash":true}]},"body":"Put data on more than one machine and the copies disagree for a while. Your read lands on one of them. A consistency model is the rulebook for that gap: it states exactly which values a read is *allowed* to come back with. *Strong* forbids nearly every surprise. *Eventual* forbids almost nothing. Both are contracts, not quality levels.","note":"So \"stronger\" never means \"more correct\" — it means fewer legal surprises. And every surprise a model forbids has to be prevented by some machinery, which is why nothing on the menu is free."},{"id":"cm-1-1","type":"multiple_choice","prompt":"What is a consistency model, at bottom?","choices":["A measure of how reliable a database is","A contract stating which values a read is allowed to return — and therefore which surprises are legal","A setting that makes data more accurate","The number of replicas you keep"],"answer":1,"why":"A consistency model isn't a quality level, it's a specification: it enumerates what a read may legally return, which means it defines exactly which weird outcomes you've agreed to. Reading it as 'stronger is better' misses the point — the model tells you which bugs are impossible and which are your job to handle."},{"id":"cm-1-2","type":"multiple_choice","prompt":"Strong consistency: a write completes, and a read immediately after returns the new value. What does that require?","choices":["Fast disks","Coordination — someone must confirm the write is visible before the read can be answered, and that confirmation costs a round trip","More replicas","A single-threaded database"],"answer":1,"why":"To promise a read reflects the latest write, the system must know what the latest write IS — and with more than one machine that means asking, which costs a round trip you cannot optimize away. Strong consistency is therefore not a feature you enable; it's coordination you purchase, on every operation, at the price of the network's physics."},{"id":"cm-1-3","type":"multiple_choice","prompt":"Eventual consistency guarantees what, exactly?","choices":["Reads are usually correct","If writes stop, all replicas will converge to the same value — with no promise about how long that takes or what you see meanwhile","Reads are correct within one second","Writes are never lost"],"answer":1,"why":"Read the guarantee carefully: it says only that replicas agree in the end, given a pause in writes — it makes no claim at all about the interval you actually live in. That's why it's such a weak promise dressed in a reassuring word: 'eventually' is unbounded, and in a system that never stops writing, the precondition never arrives."},{"id":"cm-1-4","type":"fill_blank","prompt":"______ consistency promises replicas converge if writes stop, but says nothing about what you read in the meantime.","choices":["Eventual","Strong","Causal","Linearizable"],"answer":0,"why":"It's a promise about the destination and not the journey — which is fine when the journey is milliseconds and alarming when it's a partition lasting an hour."},{"id":"cm-1-5","type":"multiple_choice","prompt":"Why isn't 'just use strong consistency everywhere' the obvious answer?","choices":["It's not supported by most databases","It costs a coordination round trip on every operation, and during a partition it means refusing to answer — you'd pay latency always and availability sometimes, for data that often doesn't need it","It uses too much storage","It's harder to program"],"answer":1,"why":"Strong consistency has a price on the happy path (unit 18's latency-vs-consistency) and a price on the bad path (refusing service during a partition), and both are charged whether the data needed the guarantee or not. Buying it for a like counter means every like waits on a quorum — you've paid for a promise nobody would have missed."},{"id":"cm-1-6","type":"multiple_choice","prompt":"So what's the design question?","choices":["How strong can we afford to be?","What's the weakest model that still keeps the product honest — because the weakest adequate model is the cheapest and most available one","Which model does our database support?","Which is most popular?"],"answer":1,"why":"Every step toward stronger consistency buys you fewer legal surprises and costs latency and availability, so the goal is the least you can get away with rather than the most you can afford. 'Honest' is the bar: the model is adequate when no anomaly it permits would mislead a user into a decision they'd regret."}]},{"id":"cm-2","title":"The useful middle","exercises":[{"id":"cm-2-0","type":"concept","title":"Between strong and eventual sits a menu of narrow promises, each forbidding one specific insult","body":"Strong and eventual are only the two ends. The useful guarantees live between them — *read-your-writes*, *monotonic reads*, *consistent prefix*, *causal consistency* — and each one bans exactly one anomaly and leaves every other one legal. That narrowness is the whole point: it's why they cost so little. The names are literal, so read them closely.","note":"Users never ask for these by name. They describe a symptom and leave you to work out which promise went missing — so the skill is turning a complaint into the one guarantee that would have prevented it."},{"id":"cm-2-1","type":"multiple_choice","prompt":"A user posts a comment, then refreshes — and their own comment is gone. Which guarantee were they expecting?","choices":["Strong consistency","Read-your-writes: you always see your own writes, even if others see them later","Eventual consistency","Monotonic reads"],"answer":1,"why":"They don't need to see everyone's comments instantly — they need to see THEIR OWN, because they know they wrote it and its absence looks like data loss. Read-your-writes is exactly that narrow promise, and it's much cheaper than strong consistency: route that user's reads to a replica that has their write, and everyone else can lag freely."},{"id":"cm-2-2","type":"match_pairs","prompt":"Match each guarantee to the anomaly it forbids.","pairs":[{"left":"Read-your-writes","right":"Your own write vanishing after you make it"},{"left":"Monotonic reads","right":"Time appearing to run backwards on refresh"},{"left":"Consistent prefix","right":"Seeing an answer before the question"},{"left":"Strong consistency","right":"Every anomaly above, at coordination cost"}],"why":"Each middle guarantee names one specific way reality can look broken and forbids just that one — which is why they're useful. You buy the narrow promise your product actually needs instead of the total order you can't afford, and you get most of the felt correctness for a fraction of the cost."},{"id":"cm-2-3","type":"multiple_choice","prompt":"Two refreshes: the first shows a new message, the second doesn't. Which guarantee is missing?","choices":["Read-your-writes","Monotonic reads — successive reads should never move backwards in time for one user","Consistent prefix","Strong consistency"],"answer":1,"why":"Two reads landed on replicas with different lag, so the second answered from an older state — the data was never corrupt, the user just time-travelled. Monotonic reads forbids that specific insult, and the usual mechanism is routing each user's reads to a consistent replica so their view only ever advances (with the caveat from unit 10 that re-pinning can break it)."},{"id":"cm-2-4","type":"multiple_choice","prompt":"A chat shows a reply before the message it replies to. Which guarantee is missing?","choices":["Monotonic reads","Consistent prefix / causal consistency — writes that caused each other must appear in that order","Read-your-writes","Eventual consistency"],"answer":1,"why":"Nobody needs a global order of every message in the world — they need effects to follow their causes, because a reply arriving before its question isn't stale, it's nonsense. Causal consistency preserves exactly the ordering that carries meaning and leaves genuinely unrelated writes free to arrive in any order, which is why it's often the sweet spot for anything conversational."},{"id":"cm-2-5","type":"multiple_choice","prompt":"Why is causal consistency so much cheaper than strong consistency?","choices":["It uses fewer replicas","It only orders writes that are actually related, leaving unrelated writes to be applied in any order — so most operations need no global agreement","It's approximate","It skips durability"],"answer":1,"why":"Strong consistency insists every write take a place in one global sequence, which means everyone agreeing about everything, all the time. Causal only insists that a write which depended on another comes after it — and in a system with millions of unrelated users, almost nothing is causally related, so almost nothing needs coordinating."},{"id":"cm-2-6","type":"multiple_choice","prompt":"Your product needs users to see their own edits instantly, but is fine if other users see them a second later. What should you buy?","choices":["Strong consistency everywhere","Read-your-writes for the author, eventual for everyone else — that's the actual requirement, precisely stated","Causal consistency","No guarantees"],"answer":1,"why":"Stating the requirement exactly reveals how narrow it is: one person needs to see one thing immediately, and the entire rest of the world can lag. Strong consistency would satisfy that requirement and charge everyone a quorum for it. Most 'we need strong consistency' claims dissolve like this once someone writes down who actually needs to see what, and when."}]},{"id":"cm-3","title":"Reading the complaint","exercises":[{"id":"cm-3-0","type":"concept","title":"Users report symptoms, and the clue that names the bug is usually *whose* read it was","body":"Nobody files a ticket naming a guarantee. They report a symptom — and it's the details *around* the symptom that identify which promise went missing. So interrogate every complaint the same way: whose read was it, what had they done just before, what did everybody *else* see at that moment, and did it fix itself. The bug is usually named by who, not by what.","note":"Misdiagnosis is expensive because the fixes don't overlap: what cures one of these complaints does nothing at all for the next. Guess wrong and you ship real work, the ticket stays open, and you've learned nothing."},{"id":"cm-3-1","type":"multiple_choice","prompt":"A user says 'I changed my profile photo and it still shows the old one, but my friend can see the new one.' Diagnosis?","choices":["The upload failed","Read-your-writes is missing for this user — their read is hitting a replica that lags behind their own write","The cache is broken","Strong consistency is needed"],"answer":1,"why":"The detail that identifies it is that the friend CAN see it — the write clearly succeeded and propagated, so nothing is broken except which replica the author's own read landed on. Notice the bug is defined by whose read it is rather than by the data, which is exactly why the fix is routing rather than a stronger database."},{"id":"cm-3-2","type":"multiple_choice","prompt":"A user deletes a photo, gets confirmation, and it reappears in their feed ten minutes later. What likely happened?","choices":["The delete failed","The delete and a stale cached copy raced — or a replica that never learned about the delete served it back","The photo was restored from backup","The user misremembers"],"answer":1,"why":"The resurrection of deleted data is a classic and it's usually a copy that never heard the news — a cache entry, a lagging replica, or a search index that indexed before the delete and was never told. Deletes are the nastiest case for derived copies because absence propagates badly: a copy holding stale data looks identical to a copy holding data that's supposed to exist."},{"id":"cm-3-3","type":"multi_select","prompt":"A user reports 'the site shows me old data sometimes.' Which could cause it? Select all.","choices":["Replication lag on a read replica","A CDN or browser cache serving a stale copy","A search index that hasn't been updated yet","A slow database query"],"answer":[0,1,2],"why":"Every copy is a chance to be behind — replicas, caches, and derived indexes are all the same shape of problem wearing different names, which is why 'stale data' incidents so often involve hunting the layer responsible. A slow query is different: it returns the RIGHT answer, late. Stale means wrong-but-fast; slow means right-but-late, and they need opposite fixes."},{"id":"cm-3-4","type":"multiple_choice","prompt":"Why is 'eventually consistent' a bad answer to give a user or a product manager?","choices":["It's too technical","Because it names the mechanism, not the promise — the honest version states a bound: 'usually under a second, and here's what you'll see meanwhile'","It's inaccurate","It sounds negative"],"answer":1,"why":"'Eventually' describes what the database guarantees and answers nothing anyone actually asked — how long, and what does it look like in the gap? Users and product owners can reason about 'up to two seconds, and you always see your own changes immediately'. Turning the mechanism into a stated bound with an observable behaviour is what makes the tradeoff decidable rather than mystical."},{"id":"cm-3-5","type":"multiple_choice","prompt":"Your team says 'we need strong consistency.' What's the first question to ask?","choices":["Which database supports it?","Which read, by whom, must reflect which write — and what would actually go wrong if it were two seconds late?","How many replicas do we need?","What's our budget?"],"answer":1,"why":"'We need strong consistency' is almost always a feeling standing in for a specific fear, and naming the fear usually shrinks it — often to read-your-writes for one user on one screen. And if the honest answer to 'what goes wrong?' is a real, irreversible loss, then you've justified the coordination cost with evidence instead of anxiety."},{"id":"cm-3-6","type":"multiple_choice","prompt":"Which of these complaints is NOT a consistency problem?","choices":["'My comment disappeared after posting'","'The page took 8 seconds to load'","'The like count went down when I refreshed'","'I see a reply to a message I can't see'"],"answer":1,"why":"A slow page is a latency problem — the answer would have been correct, it just took too long, which is unit 4's territory and needs completely different tools. The other three are all correct-data-arriving-in-a-surprising-order: read-your-writes, monotonic reads, and causal consistency respectively. Diagnosing which family you're in is the whole first move."}]},{"id":"cm-4","title":"Choosing a model","exercises":[{"id":"cm-4-0","type":"concept","title":"Quorum arithmetic is real, and it buys far less than almost everyone assumes","body":"A key lives on `N` replicas. A write waits for `W` of them to acknowledge it; a read asks `R` of them. Now do the counting. If `W + R > N`, the write set and the read set are too big to fit inside `N` replicas without colliding — pigeonhole forces them to share a member. Work out what that shared member gives you and you have the entire quorum guarantee.","note":"And it stops there. The arithmetic won't tell you *which* of the values is newest, won't resolve a write still in flight, won't order concurrent writes. That's linearizability: it needs a leader or consensus — unit 20."},{"id":"cm-4-1","type":"multiple_choice","prompt":"Quorum reads and writes: N=3 replicas, W=2, R=2. What does W + R > N actually guarantee?","choices":["That every read returns the latest value, always","Overlap: the read set and the write set must share at least one replica, so at least one node you read has seen the newest completed write","Nothing — the arithmetic is a coincidence","That writes are applied in order"],"answer":1,"why":"It's pigeonhole arithmetic: write to 2 of 3 and read from 2 of 3, and the sets cannot be disjoint, so at least one replica you asked holds the newest completed write. Read that guarantee narrowly, though — overlap is necessary for a fresh read and NOT sufficient for strong consistency. A read racing an in-flight write can legitimately come back with either value; concurrent writes still have to be merged by some rule; and a 'sloppy' quorum that accepts writes onto substitute nodes can overlap with a set that never held the write at all. Real linearizability needs coordination — a leader, or consensus — which is what unit 20 is about. Arithmetic alone doesn't buy it."},{"id":"cm-4-2","type":"multiple_choice","prompt":"Same 3 replicas, but W=1 and R=1. What did you buy and lose?","choices":["Nothing changes","Fast writes and fast reads that stay available if replicas are down — and no overlap guarantee, so a read can easily miss the newest write","Stronger consistency","Better durability"],"answer":1,"why":"W+R = 2, which isn't greater than 3, so the sets can miss each other entirely and you're squarely in eventual consistency. What you got in exchange is real: one replica is enough to serve, so writes and reads are fast and survive two nodes being down. That dial is the CAP tradeoff exposed as a config knob, and it's per-query in some systems — strict for a payment, loose for a feed."},{"id":"cm-4-3","type":"tradeoff_slider","prompt":"You're designing 'items remaining in stock' shown during checkout for a limited product drop. Slide toward your model.","leftLabel":"Strong (coordinate; slower, can refuse)","rightLabel":"Eventual (fast, may oversell)","answerRange":[0,35],"why":"Overselling a limited drop is a real-world commitment you cannot take back — you take money for something that doesn't exist and then apologize to strangers. Coordination on the decrement is worth the latency here, precisely because the wrong answer creates an obligation. Contrast the same number on a browsing page, where stale stock costs nothing: the data is identical and the cost of being wrong is not."},{"id":"cm-4-4","type":"multiple_choice","prompt":"Someone proposes 'use timestamps — the newest write wins.' What's the flaw?","choices":["Timestamps are too large","Different machines' clocks disagree, so 'newest' depends on whose clock you believe — and a skewed clock can silently discard a genuinely later write","Timestamps are slow to compare","It's actually fine"],"answer":1,"why":"Last-write-wins quietly assumes a shared global clock, and there isn't one — clocks drift, get corrected, and disagree by more than the interval between two writes. A machine running slightly fast can stamp a write far in the future and win every conflict for hours. This is why serious systems use logical clocks or version vectors, which order events by causality instead of trusting a wall clock nobody agrees on."},{"id":"cm-4-5","type":"multiple_choice","prompt":"Can one product use several consistency models at once?","choices":["No — it must pick one","Yes, and it should: payments strong, profile edits read-your-writes, feeds eventual — each dataset gets the weakest model that keeps it honest","Only with multiple databases","Only at very large scale"],"answer":1,"why":"Consistency is a property of an operation on a piece of data, not a badge worn by a company — so forcing one model everywhere means either overpaying for your feed or under-protecting your money. Mixing deliberately is the mature position, and the work is knowing which data is which, which is a product question rather than a database one."},{"id":"cm-4-6","type":"multiple_choice","prompt":"What's the honest summary of consistency models?","choices":["Stronger is better; use the strongest you can afford","They're contracts about what a read may return: stronger forbids more surprises and costs coordination, so pick the weakest model that keeps the product honest — per dataset, not per company","Eventual consistency is always sufficient","It's the database's decision"],"answer":1,"why":"Every model is a deal — fewer legal surprises in exchange for latency and availability — and 'strongest affordable' is the wrong instinct because it pays for guarantees nobody would have missed. This is the same question the course has asked since unit 5, now with formal names: you have copies, copies can disagree, and the model is you deciding exactly how much disagreement is allowed to reach a user."}]}]};

const UNIT20 = {"unitId":"consensus","title":"Consensus & Leader Election","subtitle":"How machines that can't trust the network agree on one answer","lessons":[{"id":"cons-1","title":"Why agreeing is hard","exercises":[{"id":"cons-1-0","type":"concept","title":"You cannot tell a dead machine from a slow one — every hard part of consensus grows from that","body":"You send a message and hear nothing back. Is the peer dead? Slow? Was your message lost, or was its reply? From the outside these are *identical*, and no cleverness makes silence speak: a reply you're still waiting for and a reply that will never come look exactly the same — right up until one of them arrives, or doesn't.","note":"Consensus squeezes one decision out of that fog anyway. Before you read a single algorithm, ask what it could honestly promise — and what nothing could promise while a message is still allowed to vanish."},{"id":"cons-1-1","type":"multiple_choice","prompt":"Five servers must agree on one value: who is the leader. Why can't they just vote and be done?","choices":["Voting is slow","Messages can be lost, delayed, or arrive out of order — so a node that hears nothing can't tell whether a vote was never sent, or sent and lost, or is still in flight","Servers can't send messages","They'd need a database"],"answer":1,"why":"Voting is trivial when everyone reliably hears everyone; the difficulty is that the network gives you no such promise, and silence is ambiguous. A node observing nothing cannot distinguish a dead peer from a slow one from a lost message — which is unit 10's 'dead or just slow?' being the fundamental obstacle rather than an annoyance."},{"id":"cons-1-2","type":"multiple_choice","prompt":"Why does 'just add a timeout' not solve it?","choices":["Timeouts are unreliable code","A timeout converts 'I don't know' into a guess: too short and you declare a healthy node dead, too long and you stay stuck — the uncertainty doesn't go away, you just pick which way to be wrong","Timeouts are too slow","It does solve it"],"answer":1,"why":"A timeout is a decision procedure for an undecidable question, so it doesn't remove the ambiguity — it converts it into a configurable error. This is the same shape as the failover timeout from unit 10 and the health check interval from unit 12, which is the point: these aren't three problems, they're one problem you keep meeting."},{"id":"cons-1-3","type":"fill_blank","prompt":"______ is the problem of getting multiple machines to agree on a single value despite failures.","choices":["Consensus","Replication","Sharding","Partitioning"],"answer":0,"why":"One value, many machines, an unreliable network — and everyone must end up believing the same thing, or the disagreement becomes corruption."},{"id":"cons-1-4","type":"multiple_choice","prompt":"What goes wrong if two nodes both believe they're the leader?","choices":["Nothing — more leaders means more capacity","Both accept writes, producing two divergent histories with no principled way to merge them — split brain","They negotiate automatically","The slower one gives up"],"answer":1,"why":"This is unit 10's split brain, and it's the failure consensus exists to prevent: two authorities means two truths, and truths that diverged independently can't be reconciled by any rule you invent afterwards. Note it's worse than an outage — an outage stops and recovers, whereas divergence silently corrupts and you find out later."},{"id":"cons-1-5","type":"multi_select","prompt":"What must a consensus algorithm guarantee? Select all.","choices":["Agreement — no two nodes decide different values","Validity — the decided value was actually proposed by someone","Termination — it eventually decides, provided enough nodes are up and can communicate","That it always decides quickly, no matter what"],"answer":[0,1,2],"why":"Agreement, validity, and eventual termination are what these algorithms actually promise. Speed is not on the list, and can't be: the FLP result says that with even one possible failure and no timing assumptions, no algorithm can guarantee it always terminates — which is why real systems lean on timeouts and accept 'usually fast, occasionally stalls' as the honest deal."},{"id":"cons-1-6","type":"multiple_choice","prompt":"So why is 'agreement' the property worth paying for?","choices":["It makes the system faster","Because disagreement isn't a delay — it's divergent state that no later process can repair, so preventing it is worth waiting for","It reduces storage","It simplifies the code"],"answer":1,"why":"A stalled decision costs you time and resolves; a wrong decision costs you your data's integrity and doesn't. That asymmetry justifies the entire expense of consensus — you're buying the impossibility of a failure that has no cleanup, using a currency (latency) that you can recover from."}]},{"id":"cons-2","title":"Majorities","exercises":[{"id":"cons-2-0","type":"concept","title":"A majority cannot happen twice at once — that's arithmetic, not policy","body":"Require more than half the nodes to agree before anything counts. That one rule does something stronger than it looks. Split the cluster any way you like, and split brain doesn't become *unlikely*. It becomes impossible. Not by policy, not by trust, not by anyone behaving well. By counting. Do the arithmetic yourself and you have the whole idea.","note":"A trap in the counting: a majority means a majority of the *configured* members, not of the nodes still alive. Lowering the bar means a config change — which itself needs a quorum you no longer have."},{"id":"cons-2-1","type":"multiple_choice","prompt":"5 nodes. A rule says a decision needs 3 votes. A partition splits them 3 and 2. Why can't both sides decide?","choices":["They coordinate across the partition","Only one side can hold 3 of 5 — two disjoint groups cannot both contain a majority, so at most one side can ever proceed","The bigger side is faster","The rule is enforced by a coordinator"],"answer":1,"why":"It's arithmetic doing the safety work: two groups that don't overlap can't both have more than half, so the majority rule makes two simultaneous leaders impossible rather than unlikely. That's the crucial word — impossible. The 2-node side isn't trusted to behave; it's mathematically unable to gather the votes."},{"id":"cons-2-2","type":"multiple_choice","prompt":"Why do consensus clusters use odd numbers of nodes — 3, 5, 7?","choices":["Odd numbers are faster","4 nodes need 3 for a majority, exactly like 3 nodes do — so the 4th node adds cost and tolerates no additional failure","Even numbers can't form a majority","It's a convention"],"answer":1,"why":"Majority of 3 is 2, so 3 nodes survive 1 failure; majority of 4 is 3, so 4 nodes also survive only 1. You paid for another machine and bought exactly nothing in fault tolerance — and gave yourself one more thing that can break. Going 3 → 5 is what buys the second failure, which is why cluster sizes step by twos."},{"id":"cons-2-3","type":"estimate","prompt":"A consensus cluster has 7 nodes. How many can fail while the cluster still makes progress?","answer":3,"tolerance":0,"unit":"nodes","why":"Majority of 7 is 4, so as long as 4 remain you have a quorum — meaning 3 can fail. The general rule is that 2f+1 nodes tolerate f failures, which is why 3 tolerates 1 and 5 tolerates 2."},{"id":"cons-2-4","type":"multiple_choice","prompt":"A write is committed once a majority stored it, and a leader needs a majority to be elected. Is quorum overlap ALONE enough to guarantee the new leader has every committed write?","choices":["Yes — the two majorities must overlap, so it's proven","No — overlap only proves some VOTER has the write; you also need the rule that a voter refuses to vote for a candidate whose log is behind its own","Yes, because writes are broadcast to every node","No — committed writes are always lost during a failover"],"answer":1,"why":"Overlap gets you halfway. Two majorities of the same set always share a member, so the electing group definitely contains someone holding every committed write — but that's a fact about the VOTERS, not the candidate. Without more, a node with a stale log could still collect a majority and be elected while missing committed entries. Raft closes the gap with an election restriction: a voter grants its vote only if the candidate's log is at least as up to date as its own, so the only candidate who can win is one that already has those writes. Overlap plus that rule is what makes committed data survive a leader dying — and the gap between them is exactly the kind of subtlety that makes hand-rolled consensus lose data."},{"id":"cons-2-5","type":"multiple_choice","prompt":"Your 5-node cluster is split into 2 and 2 and 1 by a network fault. What happens?","choices":["The largest group leads","Nobody has a majority, so the cluster makes no progress at all — it stays consistent by being entirely unavailable","The nodes merge automatically","A random group is elected"],"answer":1,"why":"No group of 2 or 1 can reach 3, so nobody can be elected and nothing can be committed — the cluster is fully down while every node is perfectly healthy. That is CP behaving exactly as designed: it chose consistency, and this is what choosing consistency costs on a bad day. A system that stayed up here would be a system willing to fork its own history."},{"id":"cons-2-6","type":"multiple_choice","prompt":"Is a majority quorum protecting you from nodes that lie or send corrupted messages?","choices":["Yes — that's what voting does","No — algorithms like Raft assume nodes may crash or be unreachable, but not that they actively lie; surviving liars is Byzantine fault tolerance, which is far more expensive","Yes, if you use enough nodes","Only with encryption"],"answer":1,"why":"The failure model matters as much as the algorithm: Raft and Paxos handle crash-stop faults, where a node either works correctly or stops, and that assumption is what makes them affordable. Tolerating malicious or arbitrarily buggy nodes needs Byzantine protocols with more nodes and more rounds — which is why they show up in blockchains, where participants genuinely aren't trusted, and almost never inside your own datacenter."}]},{"id":"cons-3","title":"Electing a leader","exercises":[{"id":"cons-3-0","type":"concept","title":"Consensus buys you an order-giver, not an escape from the majority","viz":{"nodes":[{"id":"w","label":"Writes","col":0,"kind":"client"},{"id":"lead","label":"Leader","sub":"orders them","col":1,"kind":"server"},{"id":"f1","label":"Follower","sub":"must ack","col":2,"kind":"server"},{"id":"f2","label":"Follower","sub":"must ack","col":2,"kind":"server"}],"edges":[{"from":"w","to":"lead"},{"from":"lead","to":"f1"},{"from":"lead","to":"f2"}]},"body":"Without a leader, every write needs its own negotiation — several round trips spent settling whose write goes first. Notice what's expensive there: not the storing, the arguing. And notice exactly what a leader does and doesn't remove. It ends the argument about order. It does not excuse one write from reaching a majority. You still pay that, every time.","note":"And an order-giver comes with a ceiling: every write funnels through one machine, so the leader's capacity is the cluster's write capacity. More nodes buy durability and fault tolerance — never write throughput."},{"id":"cons-3-1","type":"multiple_choice","prompt":"Why elect a single leader at all, if consensus can decide any value?","choices":["Leaders are faster machines","Because running full consensus for every operation is expensive — elect once, and then one node can sequence writes cheaply until it fails","It's required by the network","To reduce storage"],"answer":1,"why":"Consensus is the expensive part, so you spend it rarely — on 'who decides?' — and then the leader orders operations by itself, turning per-write agreement into per-write replication. This is unit 10's single-leader design earning its keep: one writer removes conflicts by construction, and now you know how the leader gets chosen safely."},{"id":"cons-3-2","type":"order_steps","prompt":"Order a Raft-style leader election.","steps":["Followers hear nothing from the leader for a timeout","One follower becomes a candidate and increments the term","It requests votes from every other node","Nodes grant a vote if they haven't already voted in that term","With a majority, the candidate becomes leader and starts sending heartbeats"],"why":"Silence starts it, a term number labels the attempt, and a majority ends it. The heartbeat is what keeps the peace: as long as followers hear from the leader they never start an election, so the leader's continued existence is asserted continuously rather than assumed."},{"id":"cons-3-3","type":"multiple_choice","prompt":"What is the 'term' number actually doing?","choices":["Counting how long the leader has served","Acting as a logical clock: each election gets a higher term, so any message from an older term is recognisably stale and rejected","Measuring network latency","Numbering the log entries"],"answer":1,"why":"Terms give you an ordering of leadership epochs without needing a wall clock anyone agrees on — the exact problem unit 19 flagged with last-write-wins. A deposed leader that wakes up still believing it's in charge is carrying an old term number, so every node it contacts can tell instantly that it's behind and refuse it."},{"id":"cons-3-4","type":"multiple_choice","prompt":"Two candidates start elections simultaneously and split the vote — nobody gets a majority. What stops this repeating forever?","choices":["The cluster restarts","Randomized election timeouts — each node waits a different random interval, so one almost always starts first next round and wins uncontested","The lowest node id wins","They take turns"],"answer":1,"why":"Identical timeouts make nodes act in unison, which is exactly what causes repeated split votes — the same synchronization trap as unit 17's clients all obeying one `Retry-After`. Randomizing breaks the symmetry cheaply: someone times out first, requests votes while everyone else is still waiting, and the round resolves."},{"id":"cons-3-5","type":"multiple_choice","prompt":"A leader is deposed while paused, but doesn't know it. It wakes up and writes to shared storage. How do you stop it corrupting data?","choices":["Trust its heartbeat","Fencing tokens: every leader gets a monotonically increasing number, storage remembers the highest it has seen, and a write carrying an older token is rejected","Kill the process first","Use a longer timeout"],"answer":1,"why":"You can't prevent a paused leader from waking up and acting, so the protection must live at the resource rather than rely on the leader behaving. Fencing makes the storage itself the arbiter: it has seen token 6, so a write stamped 5 is provably from a deposed leader and gets refused. This is unit 10's fencing made concrete — and note the resource must participate, since a lock service alone cannot stop a client that's stopped listening."},{"id":"cons-3-6","type":"multiple_choice","prompt":"During an election, what happens to writes?","choices":["They're served by followers","They stop — there's no leader to sequence them, so the system is unavailable for writes until one is elected","They queue on the old leader","They're rejected permanently"],"answer":1,"why":"No leader means nobody may order writes, so an election is a small planned outage measured in the election timeout — typically hundreds of milliseconds to seconds. That's the price of single-leader safety, and it's why timeout tuning is a real tradeoff: shorter means faster recovery and more spurious elections during blips, longer means fewer false alarms and a longer write outage when a leader genuinely dies."}]},{"id":"cons-4","title":"When you actually need it","exercises":[{"id":"cons-4-0","type":"concept","title":"The right amount of consensus to implement yourself is none","body":"Raft reads like something you could build in a weekend. It isn't. The bugs live in interleavings you'd never think to test — a node pausing at exactly the wrong instant, a message arriving after you assumed it couldn't. And they don't crash anything, which is the horror. They quietly fork your data, and you find out months later, from a customer.","note":"So the real decision was never \"which algorithm\". It's \"does this even need agreement?\" — and the test is what two different answers would actually cost you. Most data fails that test, which is the good news."},{"id":"cons-4-1","type":"multiple_choice","prompt":"Your team proposes implementing Raft in-house for a service that needs leader election. Reaction?","choices":["Good — it's a well-documented algorithm","Don't: consensus is notoriously hard to get right, and the failure mode is silent corruption discovered later. Use etcd, ZooKeeper, or your database's built-in election","Only if you have 5 nodes","Fine, if you write tests"],"answer":1,"why":"Raft is understandable to read and brutal to implement correctly, because the bugs live in rare interleavings — a node pausing at exactly the wrong moment, a message arriving after you assumed it couldn't. Those don't show up in tests; they show up as divergent data in production months later. Mature implementations have absorbed years of exactly those, which is what you're actually buying."},{"id":"cons-4-2","type":"multi_select","prompt":"Which genuinely need consensus? Select all.","choices":["Deciding which database replica is the leader","Distributed locks that must never be held twice","Cluster membership and configuration","Counting page views"],"answer":[0,1,2],"why":"Leadership, locks, and membership share one property: two different answers is a catastrophe, so paying for agreement is worth it. Page views are the opposite — a count that's briefly off by three costs nothing, so coordinating every increment would buy a guarantee nobody needed. The test is simply whether disagreement corrupts something or merely annoys someone."},{"id":"cons-4-3","type":"multiple_choice","prompt":"Why is running consensus across regions usually a bad idea?","choices":["Regions can't communicate","Every decision needs a majority to reply, so a cross-region quorum means every write waits on a round trip of ~100ms or more — the speed of light becomes your write latency","It's not supported","Regions have different clocks"],"answer":1,"why":"Consensus is round trips, and a round trip across the planet is unit 4's physics rather than a tuning problem — a cross-continent quorum makes every write cost hundreds of milliseconds, forever. That's why most systems keep the consensus group inside one region and replicate asynchronously across them, accepting the failure modes of unit 10 in exchange for writes that don't wait on an ocean."},{"id":"cons-4-4","type":"tradeoff_slider","prompt":"You need a distributed lock so only one worker runs a nightly job. Slide toward your approach.","leftLabel":"Real consensus service (etcd/ZooKeeper)","rightLabel":"A row in your existing database","answerRange":[55,100],"why":"For one nightly job, a conditional insert or update in the database you already run gives you mutual exclusion with a component you already operate — and if two workers ever both ran, you'd rerun a job rather than lose money. Reach for a dedicated consensus service when the lock protects something where double-execution is genuinely unacceptable, and you're willing to run and understand another distributed system to get it."},{"id":"cons-4-5","type":"multiple_choice","prompt":"You use a lock service, and it says you hold the lock. Is it safe to write?","choices":["Yes — that's what the lock means","Not by itself: you might be paused and the lease expired without you noticing, so safety needs a fencing token the storage checks — the lock alone can't stop a client that's stopped listening","Yes, if the lock is fresh","Only if the lock service is CP"],"answer":1,"why":"A lock is a lease, and a lease expires on the service's clock rather than yours — so a long garbage-collection pause can leave you holding an expired lock while feeling certain. This is the famous gap: correctness has to be enforced where the write lands, via a fencing token, because no amount of asking the lock service can tell you whether you were frozen since you last asked."},{"id":"cons-4-6","type":"multiple_choice","prompt":"What's the honest summary of consensus?","choices":["It's how distributed systems stay fast","It's the expensive machinery that makes disagreement impossible rather than unlikely — so use it for the few decisions where two answers is a catastrophe, run it inside one region, and don't implement it yourself","It's only needed for blockchains","It removes the need for replication"],"answer":1,"why":"Consensus buys you the one thing nothing else can — a decision that cannot fork — and charges round trips and unavailability when a majority is unreachable. Everything in this unit followed from the same fact you met in unit 10 and again in 18: you cannot tell dead from slow, so agreement must be constructed from majorities rather than assumed from silence."}]}]};
/* ---- 21-idempotency.json ---- */
const UNIT21 = {"unitId":"idempotency","title":"Idempotency","subtitle":"Doing it twice must equal doing it once — because it will happen twice","lessons":[{"id":"idem-1","title":"The timeout you can't interpret","exercises":[{"id":"idem-1-0","type":"concept","title":"A timeout tells you that you stopped waiting — nothing about what the server did","body":"A timeout is a fact about your patience, not about the server. You gave up at three seconds. Behind that silence the request may be queued, halfway done, finished with its reply lost on the road home, or never delivered at all — and every one of those looks *identical* from where you stand. Silence isn't information. It's the absence of it.","note":"Notice the shape of the trap: you're stuck because you need an answer you cannot get. There are only two ways out of a bind like that — get the answer, or arrange for it not to matter. One of those is impossible here."},{"id":"idem-1-1","type":"multiple_choice","prompt":"You POST a payment. The request times out. Did the charge happen?","choices":["No — a timeout means it failed","You cannot tell: the request may never have arrived, or it may have succeeded and the response was lost on the way back","Yes — timeouts happen after processing","Only if you get a 500"],"answer":1,"why":"A timeout tells you that you stopped waiting, and nothing whatsoever about what the server did — the failure could be on the way there, during processing, or on the way back with a completed charge behind it. This ambiguity is not a bug in your HTTP client; it's a permanent property of asking anything over a network, and it's the reason this entire unit exists."},{"id":"idem-1-2","type":"multiple_choice","prompt":"So what are your two options after that timeout?","choices":["Wait longer, then decide","Retry and risk charging twice, or don't retry and risk the payment never happening — with no way to know which mistake you're making","Check the logs and retry safely","Cancel the request"],"answer":1,"why":"Both options are guesses about a fact you can't observe, so you're choosing which failure to inflict rather than avoiding failure — double-charge a customer, or silently drop their order. Idempotency is what dissolves the dilemma: make the retry harmless, and you can always retry, which turns an unanswerable question into a non-question."},{"id":"idem-1-3","type":"fill_blank","prompt":"An operation is ______ if performing it many times has the same effect as performing it once.","choices":["idempotent","atomic","durable","consistent"],"answer":0,"why":"The word says the outcome is unchanged by repetition — not that the operation refuses to run twice, but that running it twice lands you in the same state as running it once."},{"id":"idem-1-4","type":"multi_select","prompt":"Where do duplicate requests come from? Select all.","choices":["A client retrying after a timeout","A load balancer or proxy retrying a request it thinks failed","An at-least-once message queue redelivering","A user double-clicking the button"],"answer":[0,1,2,3],"why":"All four are routine, and notice how little control you have over most of them — a proxy may retry without telling you, a queue redelivers by design (unit 16), and users click twice because your button didn't respond fast enough. Duplicates aren't an edge case you might hit; they're a standing condition of running a service on a network."},{"id":"idem-1-5","type":"multiple_choice","prompt":"Why is 'we'll just be careful not to retry' not a strategy?","choices":["It works if the team is disciplined","Because you don't control every retry: browsers, proxies, SDKs, queues, and users all retry independently of your intentions","Retries are configured centrally","It is a valid strategy"],"answer":1,"why":"Your discipline governs your code and nothing else in the path — the mobile SDK, the corporate proxy, and the customer's finger all retry on their own schedules. Since you cannot make duplicates not arrive, the only durable answer is to make arriving twice harmless, which puts the responsibility where you actually have authority: the server."},{"id":"idem-1-6","type":"multiple_choice","prompt":"Your service is idempotent. What does that let you do that you couldn't before?","choices":["Serve more traffic","Retry freely — every ambiguous failure becomes safe to resolve by simply trying again","Skip error handling","Remove your queue"],"answer":1,"why":"Idempotency converts the unanswerable 'did it happen?' into an irrelevant question: try again and find out, because the retry cannot do harm. That's why it's foundational rather than defensive — reliable distributed systems are built out of retries, and retries are only safe on idempotent operations."}]},{"id":"idem-2","title":"What's already safe","exercises":[{"id":"idem-2-0","type":"concept","title":"An operation that names a final state repeats harmlessly; one that names a change does not","body":"Some writes name the end state they want: *make it so*. They don't care what came before, so running one again re-asserts it and nothing moves. Other writes name a *change* — shift it by this much, make me a new one — relative to what already exists, so every repeat pushes the world on. The HTTP methods sort themselves this way, if you read what each says.","note":"And *atomic* is not *idempotent* — different words, different properties, and an operation can be one without the other. Which is how a write nothing can interleave with still does the wrong thing arriving twice."},{"id":"idem-2-1","type":"match_pairs","prompt":"Match each operation to whether repeating it is safe.","pairs":[{"left":"`GET /users/42`","right":"Safe — reads change nothing"},{"left":"`DELETE /users/42`","right":"Safe — still deleted the second time"},{"left":"PUT balance = 100","right":"Safe — the value is absolute"},{"left":"`POST /payments`","right":"Not safe — creates something new each time"}],"why":"The pattern is that operations naming a final state are repeatable, while operations describing an increment or a creation are not. This is unit 2's methods with the reasoning made explicit: GET, PUT, and DELETE are idempotent by their semantics, and POST is the one that isn't."},{"id":"idem-2-2","type":"multiple_choice","prompt":"Why is 'set balance to 100' idempotent but 'add 50 to balance' isn't?","choices":["Addition is slower","'Set' names an absolute end state, so repeating it lands in the same place; 'add' is relative to whatever is there, so each repeat moves you further","'Set' is atomic and 'add' isn't","They're both idempotent"],"answer":1,"why":"Absolute operations are self-correcting under repetition because they don't care what came before — run 'set 100' five times and it's 100. Relative operations compound, so five retries of 'add 50' is 250. That's a genuine design lever: expressing an intent absolutely rather than relatively can make it idempotent for free, before any keys or bookkeeping."},{"id":"idem-2-3","type":"multiple_choice","prompt":"Is `DELETE /users/42` returning 404 on the second call a problem?","choices":["Yes — it should return 200 every time","No — the end state is identical (the user is gone), which is what idempotency means; but a retrying client may read 404 as failure, so returning 204 for both is kinder","Yes — it means the delete failed","No, and the status code doesn't matter at all"],"answer":1,"why":"Idempotency is a claim about state, not about status codes, and the user is equally gone either way — so DELETE is idempotent regardless. But a client can't tell 'already deleted' from 'never existed' if you say 404, and it may escalate a successful retry as an error. Returning 204 for both keeps the state guarantee and makes the retry legible."},{"id":"idem-2-4","type":"multiple_choice","prompt":"Your endpoint is `POST /orders`. How could you make it naturally idempotent without any extra bookkeeping?","choices":["You can't — POST is never idempotent","Let the client supply the order's id, so a repeat is a create-if-absent on a known key rather than a new row each time","Add a timestamp","Return 200 instead of 201"],"answer":1,"why":"The reason POST isn't idempotent is that the server invents the identity, so every call creates something new — hand identity to the client and the operation becomes 'ensure this specific thing exists', which repeats harmlessly. Note this is the same move as PUT, and a unique constraint on that id makes the database enforce it, which unit 6 taught is the only enforcement that can't be bypassed."},{"id":"idem-2-5","type":"multi_select","prompt":"Which are naturally idempotent as written? Select all.","choices":["UPDATE users SET email='x' WHERE id=42","`UPDATE counters SET n = n + 1` WHERE id=42","INSERT ... ON CONFLICT DO NOTHING","DELETE FROM sessions WHERE id='abc'"],"answer":[0,2,3],"why":"Setting an absolute value, inserting-if-absent, and deleting a specific row all land in the same state however many times they run. The increment is the odd one out and it's worth noticing why: unit 6 recommended 'n = n + 1' as the fix for lost updates, and it's atomic — but atomic and idempotent are different properties, and a retried increment counts twice."},{"id":"idem-2-6","type":"multiple_choice","prompt":"So what's the first question to ask about any write?","choices":["Is it fast?","If this ran twice, would the end state differ — and can I express the intent absolutely instead of relatively?","Is it atomic?","Does it need a transaction?"],"answer":1,"why":"Asking it early is cheap and often free: a lot of operations can be made idempotent purely by how you phrase them, before you build any machinery. Only when the intent is genuinely creative or relative — charge this card, send this email — do you need keys and stored results, which is the next lesson and the expensive path."}]},{"id":"idem-3","title":"Idempotency keys","exercises":[{"id":"idem-3-0","type":"concept","title":"An idempotency key names the *intent*, so every retry of one charge arrives under the same name","body":"The client mints a unique key before its first attempt and sends the same one on every retry of that intent. Now the server has something it never had: a name for *this act*, stable across attempts that are otherwise indistinguishable. What the server does with that name is the whole design — and the order it does it in is where implementations go wrong.","note":"A key names one specific act, so the same key with a *different* body is a client bug, not a retry. Serious APIs reject it rather than returning the first result — otherwise a collision silently swallows a real request."},{"id":"idem-3-1","type":"multiple_choice","prompt":"`POST /payments` genuinely creates a charge. How do you make retrying it safe?","choices":["Check whether a similar payment exists recently","The client generates a unique key per intended payment and sends it; the server records that key with its result and returns the original result if the key reappears","Add a timestamp and reject duplicates within a second","Use a database transaction"],"answer":1,"why":"The key names the INTENT rather than the request, so all retries of one intended charge carry the same key and the server can recognise them as the same act. 'Similar payment recently' is a heuristic that fails both ways — it blocks a customer legitimately buying the same coffee twice, and it misses a retry that arrives late."},{"id":"idem-3-2","type":"order_steps","prompt":"Order the server's handling of a request with an idempotency key.","steps":["Receive the request with key K","Atomically insert K as in-progress — the store's unique constraint picks the winner","If that insert conflicts, K was already claimed: return the stored result, or wait if it's still in progress","If the insert won, do the work","Update K with the result before responding"],"why":"The trick is step 2. Reserving the key atomically BEFORE doing the work is what makes two simultaneous retries resolve to exactly one winner — the store's uniqueness constraint arbitrates, and the loser is told K already exists rather than finding nothing. Looking the key up and then acting on what you found is check-then-act, the same race from unit 6, and under concurrency it double-charges: both retries look, both find nothing, both proceed. That matters because a timeout typically triggers the client's retry AND a proxy's retry at once, so the concurrent case is the normal case rather than the exotic one."},{"id":"idem-3-3","type":"multiple_choice","prompt":"Why must the key be generated by the CLIENT, not the server?","choices":["Clients have better random number generators","Because the key must be identical across retries — a server-generated key would be new on each attempt, which is exactly what you're trying to prevent","It reduces server load","For security"],"answer":1,"why":"The key's only job is to be the same on every retry of one intent, and only the client knows that two attempts are the same intent — the server sees two indistinguishable requests. So the client mints the key once, before the first attempt, and reuses it for every retry of that attempt. A key generated per-request would make every retry look brand new."},{"id":"idem-3-4","type":"multiple_choice","prompt":"Two retries of the same key arrive simultaneously and both find no existing record. What happens?","choices":["Nothing — they're identical","Both proceed and you charge twice: your idempotency check is check-then-act, which is a race unless the key store enforces uniqueness atomically","The second one waits","The database prevents it automatically"],"answer":1,"why":"This is unit 6's check-then-act race living inside the very mechanism meant to prevent duplicates — and it's the bug that makes an idempotency implementation look correct until traffic is concurrent. The fix is the same: let the store enforce uniqueness on the key with an atomic insert, so one attempt wins and the other sees the conflict rather than an empty result."},{"id":"idem-3-5","type":"multiple_choice","prompt":"The idempotency store is itself state. What does it demand?","choices":["Nothing — it's just a cache","Durability (surviving a crash mid-payment), sharing across all servers (any one may get the retry), and expiry (or it grows forever)","Only speed","It must be in memory for performance"],"answer":1,"why":"Unit 5's question applied to the key store gives brutal answers: lose it and you lose the record of what you already did, so it must be durable; the retry may hit any server, so it must be shared; and it accumulates a row per intent forever, so it needs a retention policy. This is why idempotency isn't free — 'make it reliable' meant 'add state, in the right place', and here the state is as critical as the payments themselves."},{"id":"idem-3-6","type":"multiple_choice","prompt":"You expire idempotency keys after 24 hours. A client retries after 25. What happens?","choices":["The retry is rejected","The key is gone, so it looks like a brand-new request and you charge again — your guarantee has a time limit you chose","The key is restored from backup","Nothing — keys never expire"],"answer":1,"why":"Retention length IS the length of your guarantee, so 'idempotent' silently means 'idempotent for 24 hours' — and that's a real window someone's dead-letter replay can walk right through. The window has to outlive your longest plausible retry path, including a human rerunning a failed batch on Monday morning, or the promise quietly stops holding exactly when it's most needed."}]},{"id":"idem-4","title":"The boundaries","exercises":[{"id":"idem-4-0","type":"concept","title":"Idempotency covers exactly what the key covers, and not one thing more","viz":{"nodes":[{"id":"s","label":"Payment API","col":0,"kind":"server"},{"id":"k","label":"Key + result","sub":"covered","col":1,"kind":"db"},{"id":"e","label":"Everything else it did","sub":"outside the deal","col":1}],"edges":[{"from":"s","to":"k"},{"from":"s","to":"e"}]},"body":"The key covers exactly one thing: the record it guards. Everything the request *also* did — every effect that left your process on the way through — was never in the deal, and a retry runs it again. Which makes for the nastiest kind of incident: a database that reconciles perfectly, books that balance, and customers who can see that something went wrong.","note":"And the fix is per-effect, not per-endpoint. Each one is a separate promise and each needs deciding on purpose: fire it from the stored result exactly once, or give it a key of its own."},{"id":"idem-4-1","type":"multiple_choice","prompt":"Your payment endpoint is idempotent. It also sends a confirmation email. A retry arrives. What does the customer get?","choices":["One email","Possibly two — the charge was deduplicated, but the email was a side effect that may have fired on both attempts unless it's covered by the same key","No email","The email is always deduplicated"],"answer":1,"why":"Idempotency protects whatever the key covers and nothing else, so a side effect performed outside that record happily runs again. The fix is to make the stored result the boundary — record the outcome and fire effects from it once, or hand the email its own key. Every side effect is a separate promise, and each needs deciding."},{"id":"idem-4-2","type":"multi_select","prompt":"Which are side effects that need their own idempotency thought? Select all.","choices":["Sending an email or SMS","Calling a third-party payment API","Publishing an event other services consume","Reading a row to build the response"],"answer":[0,1,2],"why":"Emails, external calls, and published events all reach outside your database and can't be rolled back — a retry that re-fires them is visible to customers or triggers downstream work twice. The read is harmless because it changes nothing, which is the whole distinction: side effects are the things the world remembers."},{"id":"idem-4-3","type":"multiple_choice","prompt":"Your idempotency store is in your database; the payment goes to Stripe. You record the key, then call Stripe, then crash. What state are you in?","choices":["Clean — the key was recorded","Ambiguous: the key says you started, but you don't know whether Stripe charged — so the retry sees the key and may return a result you never actually confirmed","The charge is rolled back","Stripe handles it"],"answer":1,"why":"This is unit 9's boundary again — your database and Stripe cannot commit together — so recording the key and doing the work are two steps with a crash-shaped hole between them. Which is why the mature pattern stores the key as in-progress first, then reconciles: on retry you see 'started but unconfirmed' and go ask Stripe what actually happened, using YOUR key as the identifier you gave them."},{"id":"idem-4-4","type":"multiple_choice","prompt":"Why does Stripe accept an `Idempotency-Key` header from you?","choices":["For their own analytics","Because they know your retries are unavoidable, so they let you name the intent and guarantee that one key charges once — pushing the guarantee to where the side effect actually happens","To rate limit you","For audit logging"],"answer":1,"why":"The only place a charge can truly be deduplicated is at the system that performs it, so Stripe offers the guarantee at the boundary where it's enforceable. The general principle is worth taking: an API that performs irreversible side effects should accept an idempotency key, because its callers will retry whether it's safe or not."},{"id":"idem-4-5","type":"tradeoff_slider","prompt":"You're designing a public API that creates resources. Slide toward your approach to duplicate protection.","leftLabel":"Accept a client-supplied idempotency key","rightLabel":"Detect duplicates heuristically (same fields, recent)","answerRange":[0,35],"why":"Heuristics guess at intent and are wrong in both directions — they block a customer genuinely ordering the same thing twice, and they miss a retry that arrives outside the window. A key is unambiguous because the client states 'this is the same intent as before', which is the one fact only the client knows. Explicit intent beats inferred intent every time you can get it."},{"id":"idem-4-6","type":"multiple_choice","prompt":"What's the honest summary of idempotency?","choices":["It's a nice-to-have for payment systems","It's what makes retries safe — and since retries are unavoidable, it's what makes reliability possible at all. It costs you durable, shared, expiring state, and it only covers what the key covers","It means an operation runs only once","It's provided by HTTP automatically"],"answer":1,"why":"You cannot tell whether a timed-out request happened, so either retries are safe or your system is guessing about money — that's why this is foundational rather than defensive. And it's bounded in three ways worth naming out loud: it lasts as long as your retention, it covers only the operations you keyed, and it stops at every system boundary you don't control."}]}]};
