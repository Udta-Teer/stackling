const UNIT21 = {"unitId":"idempotency","title":"Idempotency","lessons":[{"id":"idem-1","title":"The timeout you can't interpret","exercises":[{"type":"multiple_choice","prompt":"You POST a payment. The request times out. Did the charge happen?","choices":["No — a timeout means it failed","You cannot tell: the request may never have arrived, or it may have succeeded and the response was lost on the way back","Yes — timeouts happen after processing","Only if you get a 500"],"answer":1,"why":"A timeout tells you that you stopped waiting, and nothing whatsoever about what the server did — the failure could be on the way there, during processing, or on the way back with a completed charge behind it. This ambiguity is not a bug in your HTTP client; it's a permanent property of asking anything over a network, and it's the reason this entire unit exists."},{"type":"multiple_choice","prompt":"So what are your two options after that timeout?","choices":["Wait longer, then decide","Retry and risk charging twice, or don't retry and risk the payment never happening — with no way to know which mistake you're making","Check the logs and retry safely","Cancel the request"],"answer":1,"why":"Both options are guesses about a fact you can't observe, so you're choosing which failure to inflict rather than avoiding failure — double-charge a customer, or silently drop their order. Idempotency is what dissolves the dilemma: make the retry harmless, and you can always retry, which turns an unanswerable question into a non-question."},{"type":"fill_blank","prompt":"An operation is ______ if performing it many times has the same effect as performing it once.","choices":["idempotent","atomic","durable","consistent"],"answer":0,"why":"The word says the outcome is unchanged by repetition — not that the operation refuses to run twice, but that running it twice lands you in the same state as running it once."},{"type":"multi_select","prompt":"Where do duplicate requests come from? Select all.","choices":["A client retrying after a timeout","A load balancer or proxy retrying a request it thinks failed","An at-least-once message queue redelivering","A user double-clicking the button"],"answer":[0,1,2,3],"why":"All four are routine, and notice how little control you have over most of them — a proxy may retry without telling you, a queue redelivers by design (unit 16), and users click twice because your button didn't respond fast enough. Duplicates aren't an edge case you might hit; they're a standing condition of running a service on a network."},{"type":"multiple_choice","prompt":"Why is 'we'll just be careful not to retry' not a strategy?","choices":["It works if the team is disciplined","Because you don't control every retry: browsers, proxies, SDKs, queues, and users all retry independently of your intentions","Retries are configured centrally","It is a valid strategy"],"answer":1,"why":"Your discipline governs your code and nothing else in the path — the mobile SDK, the corporate proxy, and the customer's finger all retry on their own schedules. Since you cannot make duplicates not arrive, the only durable answer is to make arriving twice harmless, which puts the responsibility where you actually have authority: the server."},{"type":"multiple_choice","prompt":"Your service is idempotent. What does that let you do that you couldn't before?","choices":["Serve more traffic","Retry freely — every ambiguous failure becomes safe to resolve by simply trying again","Skip error handling","Remove your queue"],"answer":1,"why":"Idempotency converts the unanswerable 'did it happen?' into an irrelevant question: try again and find out, because the retry cannot do harm. That's why it's foundational rather than defensive — reliable distributed systems are built out of retries, and retries are only safe on idempotent operations."}]},{"id":"idem-2","title":"What's already safe","exercises":[{"type":"match_pairs","prompt":"Match each operation to whether repeating it is safe.","pairs":[{"left":"GET /users/42","right":"Safe — reads change nothing"},{"left":"DELETE /users/42","right":"Safe — still deleted the second time"},{"left":"PUT balance = 100","right":"Safe — the value is absolute"},{"left":"POST /payments","right":"Not safe — creates something new each time"}],"why":"The pattern is that operations naming a final state are repeatable, while operations describing an increment or a creation are not. This is unit 2's methods with the reasoning made explicit: GET, PUT, and DELETE are idempotent by their semantics, and POST is the one that isn't."},{"type":"multiple_choice","prompt":"Why is 'set balance to 100' idempotent but 'add 50 to balance' isn't?","choices":["Addition is slower","'Set' names an absolute end state, so repeating it lands in the same place; 'add' is relative to whatever is there, so each repeat moves you further","'Set' is atomic and 'add' isn't","They're both idempotent"],"answer":1,"why":"Absolute operations are self-correcting under repetition because they don't care what came before — run 'set 100' five times and it's 100. Relative operations compound, so five retries of 'add 50' is 250. That's a genuine design lever: expressing an intent absolutely rather than relatively can make it idempotent for free, before any keys or bookkeeping."},{"type":"multiple_choice","prompt":"Is DELETE /users/42 returning 404 on the second call a problem?","choices":["Yes — it should return 200 every time","No — the end state is identical (the user is gone), which is what idempotency means; but a retrying client may read 404 as failure, so returning 204 for both is kinder","Yes — it means the delete failed","No, and the status code doesn't matter at all"],"answer":1,"why":"Idempotency is a claim about state, not about status codes, and the user is equally gone either way — so DELETE is idempotent regardless. But a client can't tell 'already deleted' from 'never existed' if you say 404, and it may escalate a successful retry as an error. Returning 204 for both keeps the state guarantee and makes the retry legible."},{"type":"multiple_choice","prompt":"Your endpoint is POST /orders. How could you make it naturally idempotent without any extra bookkeeping?","choices":["You can't — POST is never idempotent","Let the client supply the order's id, so a repeat is a create-if-absent on a known key rather than a new row each time","Add a timestamp","Return 200 instead of 201"],"answer":1,"why":"The reason POST isn't idempotent is that the server invents the identity, so every call creates something new — hand identity to the client and the operation becomes 'ensure this specific thing exists', which repeats harmlessly. Note this is the same move as PUT, and a unique constraint on that id makes the database enforce it, which unit 6 taught is the only enforcement that can't be bypassed."},{"type":"multi_select","prompt":"Which are naturally idempotent as written? Select all.","choices":["UPDATE users SET email='x' WHERE id=42","UPDATE counters SET n = n + 1 WHERE id=42","INSERT ... ON CONFLICT DO NOTHING","DELETE FROM sessions WHERE id='abc'"],"answer":[0,2,3],"why":"Setting an absolute value, inserting-if-absent, and deleting a specific row all land in the same state however many times they run. The increment is the odd one out and it's worth noticing why: unit 6 recommended 'n = n + 1' as the fix for lost updates, and it's atomic — but atomic and idempotent are different properties, and a retried increment counts twice."},{"type":"multiple_choice","prompt":"So what's the first question to ask about any write?","choices":["Is it fast?","If this ran twice, would the end state differ — and can I express the intent absolutely instead of relatively?","Is it atomic?","Does it need a transaction?"],"answer":1,"why":"Asking it early is cheap and often free: a lot of operations can be made idempotent purely by how you phrase them, before you build any machinery. Only when the intent is genuinely creative or relative — charge this card, send this email — do you need keys and stored results, which is the next lesson and the expensive path."}]},{"id":"idem-3","title":"Idempotency keys","exercises":[{"type":"multiple_choice","prompt":"POST /payments genuinely creates a charge. How do you make retrying it safe?","choices":["Check whether a similar payment exists recently","The client generates a unique key per intended payment and sends it; the server records that key with its result and returns the original result if the key reappears","Add a timestamp and reject duplicates within a second","Use a database transaction"],"answer":1,"why":"The key names the INTENT rather than the request, so all retries of one intended charge carry the same key and the server can recognise them as the same act. 'Similar payment recently' is a heuristic that fails both ways — it blocks a customer legitimately buying the same coffee twice, and it misses a retry that arrives late."},{"type":"order_steps","prompt":"Order the server's handling of a request with an idempotency key.","steps":["Receive the request with key K","Look up K in the idempotency store","If K exists, return the stored result without redoing the work","If K is new, do the work","Store K with the result before responding"],"why":"Check first, work only if new, and record the outcome against the key. The ordering of the last step is the whole trick — storing the result before responding is what makes the NEXT retry able to find it, and getting that order wrong is how systems 'have idempotency keys' and still double-charge."},{"type":"multiple_choice","prompt":"Why must the key be generated by the CLIENT, not the server?","choices":["Clients have better random number generators","Because the key must be identical across retries — a server-generated key would be new on each attempt, which is exactly what you're trying to prevent","It reduces server load","For security"],"answer":1,"why":"The key's only job is to be the same on every retry of one intent, and only the client knows that two attempts are the same intent — the server sees two indistinguishable requests. So the client mints the key once, before the first attempt, and reuses it for every retry of that attempt. A key generated per-request would make every retry look brand new."},{"type":"multiple_choice","prompt":"Two retries of the same key arrive simultaneously and both find no existing record. What happens?","choices":["Nothing — they're identical","Both proceed and you charge twice: your idempotency check is check-then-act, which is a race unless the key store enforces uniqueness atomically","The second one waits","The database prevents it automatically"],"answer":1,"why":"This is unit 6's check-then-act race living inside the very mechanism meant to prevent duplicates — and it's the bug that makes an idempotency implementation look correct until traffic is concurrent. The fix is the same: let the store enforce uniqueness on the key with an atomic insert, so one attempt wins and the other sees the conflict rather than an empty result."},{"type":"multiple_choice","prompt":"The idempotency store is itself state. What does it demand?","choices":["Nothing — it's just a cache","Durability (surviving a crash mid-payment), sharing across all servers (any one may get the retry), and expiry (or it grows forever)","Only speed","It must be in memory for performance"],"answer":1,"why":"Unit 5's question applied to the key store gives brutal answers: lose it and you lose the record of what you already did, so it must be durable; the retry may hit any server, so it must be shared; and it accumulates a row per intent forever, so it needs a retention policy. This is why idempotency isn't free — 'make it reliable' meant 'add state, in the right place', and here the state is as critical as the payments themselves."},{"type":"multiple_choice","prompt":"You expire idempotency keys after 24 hours. A client retries after 25. What happens?","choices":["The retry is rejected","The key is gone, so it looks like a brand-new request and you charge again — your guarantee has a time limit you chose","The key is restored from backup","Nothing — keys never expire"],"answer":1,"why":"Retention length IS the length of your guarantee, so 'idempotent' silently means 'idempotent for 24 hours' — and that's a real window someone's dead-letter replay can walk right through. The window has to outlive your longest plausible retry path, including a human rerunning a failed batch on Monday morning, or the promise quietly stops holding exactly when it's most needed."}]},{"id":"idem-4","title":"The boundaries","exercises":[{"type":"multiple_choice","prompt":"Your payment endpoint is idempotent. It also sends a confirmation email. A retry arrives. What does the customer get?","choices":["One email","Possibly two — the charge was deduplicated, but the email was a side effect that may have fired on both attempts unless it's covered by the same key","No email","The email is always deduplicated"],"answer":1,"why":"Idempotency protects whatever the key covers and nothing else, so a side effect performed outside that record happily runs again. The fix is to make the stored result the boundary — record the outcome and fire effects from it once, or hand the email its own key. Every side effect is a separate promise, and each needs deciding."},{"type":"multi_select","prompt":"Which are side effects that need their own idempotency thought? Select all.","choices":["Sending an email or SMS","Calling a third-party payment API","Publishing an event other services consume","Reading a row to build the response"],"answer":[0,1,2],"why":"Emails, external calls, and published events all reach outside your database and can't be rolled back — a retry that re-fires them is visible to customers or triggers downstream work twice. The read is harmless because it changes nothing, which is the whole distinction: side effects are the things the world remembers."},{"type":"multiple_choice","prompt":"Your idempotency store is in your database; the payment goes to Stripe. You record the key, then call Stripe, then crash. What state are you in?","choices":["Clean — the key was recorded","Ambiguous: the key says you started, but you don't know whether Stripe charged — so the retry sees the key and may return a result you never actually confirmed","The charge is rolled back","Stripe handles it"],"answer":1,"why":"This is unit 9's boundary again — your database and Stripe cannot commit together — so recording the key and doing the work are two steps with a crash-shaped hole between them. Which is why the mature pattern stores the key as in-progress first, then reconciles: on retry you see 'started but unconfirmed' and go ask Stripe what actually happened, using YOUR key as the identifier you gave them."},{"type":"multiple_choice","prompt":"Why does Stripe accept an Idempotency-Key header from you?","choices":["For their own analytics","Because they know your retries are unavoidable, so they let you name the intent and guarantee that one key charges once — pushing the guarantee to where the side effect actually happens","To rate limit you","For audit logging"],"answer":1,"why":"The only place a charge can truly be deduplicated is at the system that performs it, so Stripe offers the guarantee at the boundary where it's enforceable. The general principle is worth taking: an API that performs irreversible side effects should accept an idempotency key, because its callers will retry whether it's safe or not."},{"type":"tradeoff_slider","prompt":"You're designing a public API that creates resources. Slide toward your approach to duplicate protection.","leftLabel":"Accept a client-supplied idempotency key","rightLabel":"Detect duplicates heuristically (same fields, recent)","answerRange":[0,35],"why":"Heuristics guess at intent and are wrong in both directions — they block a customer genuinely ordering the same thing twice, and they miss a retry that arrives outside the window. A key is unambiguous because the client states 'this is the same intent as before', which is the one fact only the client knows. Explicit intent beats inferred intent every time you can get it."},{"type":"multiple_choice","prompt":"What's the honest summary of idempotency?","choices":["It's a nice-to-have for payment systems","It's what makes retries safe — and since retries are unavoidable, it's what makes reliability possible at all. It costs you durable, shared, expiring state, and it only covers what the key covers","It means an operation runs only once","It's provided by HTTP automatically"],"answer":1,"why":"You cannot tell whether a timed-out request happened, so either retries are safe or your system is guessing about money — that's why this is foundational rather than defensive. And it's bounded in three ways worth naming out loud: it lasts as long as your retention, it covers only the operations you keyed, and it stops at every system boundary you don't control."}]}]};

const UNIT22 = {"unitId":"observability","title":"Observability","lessons":[{"id":"obs-1","title":"Three different questions","exercises":[{"type":"multiple_choice","prompt":"Your service is slow. Your CPU graph looks fine. What does that actually tell you?","choices":["The service isn't slow","Only that CPU isn't the constraint — you're waiting on something you haven't instrumented, and you can't see it","The problem is the database","The metric is broken"],"answer":1,"why":"A healthy graph tells you what ISN'T wrong, which is progress and not an answer — the slowness lives in whatever you never measured, whether that's a lock, a dependency, or a queue. This is the whole premise of observability: your system is only as debuggable as your instrumentation, and unmeasured things are invisible rather than absent."},{"type":"match_pairs","prompt":"Match each signal to the question it answers.","pairs":[{"left":"Metrics","right":"Is something wrong, and how much?"},{"left":"Logs","right":"What exactly happened in this one case?"},{"left":"Traces","right":"Where did the time go across services?"},{"left":"All three together","right":"Alert, then investigate, then locate"}],"why":"They aren't three formats of the same thing, they're three different questions — metrics are cheap aggregates that tell you something changed, logs are expensive detail about individual events, and traces show one request's journey across services. The workflow is the point: a metric wakes you, a trace narrows it to a service, a log tells you what that service actually did."},{"type":"multiple_choice","prompt":"Why can't you just log everything and skip metrics?","choices":["Logs are less accurate","Logs cost roughly per event, so at high traffic the volume and bill explode — and answering 'what's my error rate?' means scanning them, while a metric already knows","Logs can't record errors","Metrics are more detailed"],"answer":1,"why":"A metric is a pre-aggregated number that costs about the same whether you serve ten requests or ten million, whereas logs scale linearly with traffic in both storage and money. So they trade off exactly opposite ways: metrics are cheap and lose the detail, logs keep everything and get expensive precisely when traffic is high — which is when you need them."},{"type":"multiple_choice","prompt":"A request passes through 6 microservices and takes 3 seconds. Which signal finds the slow one?","choices":["Logs from each service","A trace — one request id followed across all six, showing how long each span took","CPU metrics","The load balancer's access log"],"answer":1,"why":"Each service's own logs show it was fine, because each service WAS fine — the time is in the gaps and the waiting, which nobody sees locally. A trace stitches the request together with one id so you can look at the whole journey at once, which is the only view where 'service D waited 2.8s on service E' is visible."},{"type":"multiple_choice","prompt":"Why does distributed tracing require every service to cooperate?","choices":["For security","Because the trace id must be passed along in every call — one service that drops it breaks the chain, and everything downstream becomes invisible","To reduce overhead","Because traces are stored locally"],"answer":1,"why":"A trace is only a chain of spans sharing an id, so propagation is the whole mechanism — a service that receives the id and doesn't forward it silently orphans everything it calls. That's why tracing tends to be all-or-nothing infrastructure: partial adoption produces traces that end abruptly at exactly the boundary you were trying to see across."},{"type":"multiple_choice","prompt":"What's the actual difference between 'monitoring' and 'observability'?","choices":["They're the same thing","Monitoring answers questions you thought of in advance; observability is having enough signal to answer questions you didn't","Observability is just monitoring with more dashboards","Monitoring is for infrastructure, observability for apps"],"answer":1,"why":"A dashboard shows the failures you predicted, which are the ones you've usually already fixed — real incidents are the ones nobody anticipated, so the question is whether your data can answer something you're inventing at 3am. That's the practical test: can you ask a new question of yesterday's data without shipping code first?"}]},{"id":"obs-2","title":"What the dashboard hides","exercises":[{"type":"multiple_choice","prompt":"Your dashboard shows average latency: a healthy 90ms. Users are complaining. What are you missing?","choices":["Nothing — check their connection","The average is hiding the tail: p99 could be 6 seconds and the mean would barely move","The dashboard is broken","You need more replicas"],"answer":1,"why":"Averages compress a distribution into one number and lose exactly the part that hurts — this is unit 4's lesson, now as an instrumentation failure rather than a reasoning one. Nobody experiences your average; they experience one request. A dashboard showing only means is a dashboard that structurally cannot show you an outage that affects 1% of traffic."},{"type":"multiple_choice","prompt":"Your service returns 200 OK for every request, including ones where the internal work failed. What did that cost you?","choices":["Nothing — the errors are in the logs","Your error rate metric reads 0% during a real outage, so monitoring, alerting, and every retry policy all believe you're healthy","Slightly less accurate metrics","Only a logging problem"],"answer":1,"why":"Unit 3 warned that lying with status codes breaks caches and clients; here it also blinds your own instrumentation, because the error rate is computed from what you reported rather than what happened. Honest signals are load-bearing infrastructure — everything downstream, including the human deciding whether to page someone, is reasoning from numbers you generated."},{"type":"multi_select","prompt":"Which make an incident harder to diagnose? Select all.","choices":["Only recording averages, not percentiles","Logs without a request id to correlate them","Reporting 200 for failed operations","Recording p50, p95, and p99"],"answer":[0,1,2],"why":"Averages hide the tail, uncorrelated logs can't be assembled into a story, and dishonest status codes corrupt every derived signal. Percentiles are the fix rather than a problem — and the request id is the humblest and most valuable item on the list, because logs you can't join are a pile of sentences rather than an account of what happened."},{"type":"multiple_choice","prompt":"What are the four 'golden signals' worth measuring on any service?","choices":["CPU, memory, disk, network","Latency, traffic, errors, and saturation — how slow, how much, how broken, how full","Uptime, downtime, deploys, rollbacks","Requests, users, revenue, cost"],"answer":1,"why":"Those four describe the service as its users experience it, whereas CPU and memory describe the machine — and unit 4 showed a machine can look fine while queueing destroys the tail. Saturation is the one people skip and the one that predicts: it's how close you are to the cliff, which is the difference between noticing at 70% and discovering at 100%."},{"type":"multiple_choice","prompt":"Why is saturation the signal that warns you EARLY?","choices":["It's measured more often","Because latency and errors only degrade once you're near the limit, while saturation is rising the whole way there — it tells you you're heading for the cliff before you're on it","It's easier to alert on","It's more accurate"],"answer":1,"why":"Unit 4's queueing curve is flat and then vertical, so latency stays fine at 60% and 70% and then explodes — by the time latency tells you, you're already over. Saturation moves smoothly and gives you the warning that the outcome metrics can't, which is why 'we're at 78% of connection pool' is worth an alert and 'latency is up' is worth a page."},{"type":"multiple_choice","prompt":"Your metrics say the service is healthy. Users say it's broken. Who's right?","choices":["The metrics — they're objective","The users, always — if they're suffering and your graphs are green, your instrumentation is measuring the wrong thing","It depends on how many users","Neither; check the logs"],"answer":1,"why":"Metrics are a model of reality and users ARE reality, so a disagreement is a defect in the model rather than in the customers. Treat the gap as the most valuable signal you'll get all quarter: it names precisely which question your instrumentation can't answer, and closing it is worth more than any dashboard you'd have built otherwise."}]},{"id":"obs-3","title":"What it costs","exercises":[{"type":"multiple_choice","prompt":"You add user_id as a label on your latency metric. You have 10 million users. What just happened?","choices":["Better visibility per user","A cardinality explosion: your metric system now stores a separate time series per user, which can be orders of magnitude more expensive than the service it monitors","Nothing — labels are cheap","The metric becomes more accurate"],"answer":1,"why":"A metric's cost scales with the number of distinct label combinations, so a high-cardinality label like user_id multiplies one series into millions — teams have genuinely taken down their monitoring, or their budget, with a single well-intentioned label. The rule is that metrics want low-cardinality dimensions like endpoint or status; per-user detail belongs in logs or traces, which are built for it."},{"type":"multiple_choice","prompt":"So where does high-cardinality detail like user_id belong?","choices":["Nowhere — don't record it","In logs and traces, which are per-event by nature and priced accordingly — you look them up when investigating rather than aggregating them continuously","In a separate metrics system","In the database"],"answer":1,"why":"The split follows from how each is stored: metrics pre-aggregate, so every dimension multiplies the series count, while logs and traces record events you query on demand and never pay for combinations you don't ask about. That's the division of labour — metrics tell you 1% of requests are slow, traces tell you which ones, logs tell you what happened inside them."},{"type":"multiple_choice","prompt":"Tracing every request at high volume is too expensive. You sample 1%. What did you lose?","choices":["Nothing meaningful","The rare event — a 1-in-10,000 failure is now almost certainly not in your sample, which is precisely the request you needed","Only some latency data","The ability to alert"],"answer":1,"why":"Uniform sampling keeps a representative picture of the typical and systematically discards the exceptional, so it's optimized against the thing you actually investigate. Tail-based sampling inverts it: buffer the trace, and keep it if it was slow or errored — you keep 100% of the interesting traces and 0.1% of the boring ones, which is the same information for a fraction of the bill."},{"type":"multi_select","prompt":"Which are real costs of observability? Select all.","choices":["Storage and ingest bills that can rival the service's own cost","Instrumentation overhead in the request path","Engineer time maintaining dashboards and alerts nobody reads","Slower database queries"],"answer":[0,1,2],"why":"The bill, the overhead, and the maintenance are all real, and the third is the one nobody budgets for — dashboards rot, alerts accumulate, and a wall of graphs nobody trusts is worse than none because it looks like coverage. Observability doesn't slow your queries; it's an operating cost you pay for the ability to understand your own system."},{"type":"tradeoff_slider","prompt":"You're deciding log retention for a service handling a billion requests a day. Slide toward your policy.","leftLabel":"Log everything, keep 90 days","rightLabel":"Sample + structured events, keep 7 days hot","answerRange":[55,100],"why":"At a billion requests a day, full logs for 90 days is a bill that can exceed the service's own infrastructure, spent mostly on lines nobody will ever read. Keeping a short hot window plus retained samples and structured events covers the investigations you actually run — most incidents are debugged with data from the last few hours — while compliance data, which is a genuinely different requirement, goes to cheap cold storage."},{"type":"multiple_choice","prompt":"Why are structured logs worth more than free-text ones?","choices":["They're smaller","Because they're queryable: 'all errors for user 42 on checkout in the last hour' is a filter over fields, not a regex over prose","They're easier to read","They compress better"],"answer":1,"why":"A log line's value is realized when you search it under pressure, and free text forces you to write regexes against sentences that different engineers phrased differently. Structured events with consistent fields turn logs into a queryable dataset — which is what makes answering a question you didn't anticipate possible at all, and that was the definition of observability."}]},{"id":"obs-4","title":"Alerting without going mad","exercises":[{"type":"multiple_choice","prompt":"You alert on 'CPU above 80%'. It fires at 2am. The service is serving users perfectly. What did you do wrong?","choices":["The threshold was too low","You alerted on a cause rather than a symptom — high CPU isn't a problem unless users feel it, so you woke someone for a number","You should alert at 90%","CPU shouldn't be monitored"],"answer":1,"why":"CPU is a possible cause of problems, not a problem, so alerting on it pages you for every busy-but-fine moment — and each false page teaches the on-call that alerts are noise. Alert on what users experience: latency, errors, and failed requests. If CPU is high and nobody is suffering, the correct response is genuinely nothing."},{"type":"multiple_choice","prompt":"What's the test for whether something deserves to page a human at 3am?","choices":["Whether it's unusual","Whether a human must act NOW to stop users being harmed — if it can wait until morning, it's a ticket, not a page","Whether it's in the runbook","Whether it happened before"],"answer":1,"why":"A page is an interrupt on someone's life, and it's only justified by urgent, actionable harm — everything else is a ticket or a dashboard. The failure mode is alerting on anything interesting: the on-call learns to ignore the pager, and the one real alert arrives among fifty that weren't. Alert fatigue isn't a personal weakness, it's what any rational human does with a noisy signal."},{"type":"multi_select","prompt":"Which are good pages? Select all.","choices":["Error rate above 5% for 5 minutes","p99 latency above the SLO for 10 minutes","Disk will be full in 4 hours","A single request returned 500"],"answer":[0,1,2],"why":"Sustained errors and sustained latency are users being harmed right now, and imminent disk exhaustion is urgent and actionable with a deadline — all three need a human tonight. One 500 is noise: at any real traffic level, individual errors happen constantly and they're what error-rate metrics are for. Pages need a duration, or you're paging on jitter."},{"type":"multiple_choice","prompt":"Why do good alerts have a duration — '5% errors for 5 minutes' rather than '5% errors'?","choices":["To reduce alerting costs","Because a momentary spike is normal and self-correcting: requiring it to persist filters out the noise that would otherwise page you constantly","Because metrics are delayed","To give the system time to fix itself"],"answer":1,"why":"Any metric sampled finely enough crosses any threshold sometimes — a deploy, a GC pause, one bad client — and paging on the instant means paging on jitter. The duration encodes what you actually meant: not 'errors touched 5%' but 'errors are STAYING at 5%', which is a real condition rather than a blip that resolved before anyone opened a laptop."},{"type":"multiple_choice","prompt":"One database goes down, and 40 alerts fire across 12 services. What's the problem?","choices":["Not enough alerts","Every service alerted on its own symptom, so the on-call must reconstruct one root cause from 40 messages — alerting on causes at the source would have said it once","The database needs monitoring","The alerts are too slow"],"answer":1,"why":"Forty alerts is one incident wearing forty costumes, and the human's first ten minutes go to realising that instead of fixing anything. This is the honest counterweight to 'alert on symptoms': symptoms are right for detection, and when one dependency fails everything downstream is a symptom — so you also want dependency-aware grouping, so the page says 'the database is down' rather than reading out its consequences."},{"type":"multiple_choice","prompt":"What's the honest summary of observability?","choices":["More dashboards and more alerts mean more reliability","It's the ability to answer questions you didn't anticipate — metrics to know something's wrong, traces to find where, logs to see what — bought with real money and real engineer time, and ruined by dishonest signals and noisy alerts","It's a monitoring tool you install","It's only needed for microservices"],"answer":1,"why":"Observability isn't a product you buy but a property you build, and the whole unit came down to two things: your system is only as visible as you instrumented it, and every signal you emit dishonestly — a 200 on a failure, an average hiding a tail — corrupts every decision made downstream of it, including yours at 3am."}]}]};

const UNIT23 = {"unitId":"design-url-shortener","title":"Design a URL Shortener","lessons":[{"id":"urls-1","title":"Requirements and numbers","exercises":[{"type":"multiple_choice","prompt":"'Design a URL shortener.' What's the first move?","choices":["Choose a database","Pin down requirements and scale: what must it do, how many writes, how many reads, and what's the read:write ratio","Draw the architecture","Pick a hashing algorithm"],"answer":1,"why":"Every later decision is downstream of those numbers — a shortener at 100 links a day and one at 100 million are different systems, and you can't defend a cache or a shard without knowing the shape of the load. The read:write ratio in particular decides almost everything here, which is why it's worth extracting before you name a single technology."},{"type":"multi_select","prompt":"Which are the core functional requirements? Select all.","choices":["Given a long URL, return a short one","Given a short URL, redirect to the long one","Links may expire","Real-time collaborative editing of links"],"answer":[0,1,2],"why":"Shorten, redirect, and optionally expire — that's the product. Collaborative editing is invented scope, and noticing what's NOT required is as valuable as listing what is: every requirement you accept has to be defended in the design, so smuggling in extras costs you real complexity for imaginary users."},{"type":"estimate","prompt":"100 million new links per day. Roughly how many writes per second on average?","answer":1160,"tolerance":400,"unit":"writes/sec","why":"There are ~86,400 seconds in a day, so 100M ÷ 86,400 ≈ 1,160/sec. That's a modest number — well within one well-tuned database — which is the first genuinely useful finding: the write path is not where the difficulty lives, and peaks will run several times the average, so size for maybe 3–5× this."},{"type":"multiple_choice","prompt":"Reads are 100× writes. So ~116,000 redirects/second. What does that ratio tell you about the design?","choices":["You need to shard immediately","It's overwhelmingly a read system — so caching and replicas carry the design, and the write path can stay simple","You need a NoSQL database","You need multiple regions"],"answer":1,"why":"A 100:1 ratio means the redirect is the product and everything else is bookkeeping, so your effort belongs in serving reads cheaply — cache, replicas, and a CDN-friendly redirect. It also means unit 7's rule applies directly: put the work where the traffic isn't, and the traffic is reads."},{"type":"estimate","prompt":"Each link record is roughly 500 bytes. Storing 100 million links per day for 5 years — roughly how many terabytes?","answer":91,"tolerance":30,"unit":"TB","why":"100M × 500 bytes = 50GB/day; × 365 × 5 ≈ 91TB. Big enough that one machine's disk is a real question, small enough that it isn't frightening — which is exactly the kind of finding that decides whether unit 15's sharding is on the table or premature."},{"type":"multiple_choice","prompt":"Your estimates say ~1,200 writes/sec and ~91TB over five years. What have you learned?","choices":["You need a massive distributed system","Writes are easy and storage is the growth problem — so the design questions are the read path and how the data is partitioned over time, not write throughput","One server is enough","You need to shard by user"],"answer":1,"why":"The arithmetic just told you which problems are real: 1,200 writes/sec doesn't justify exotic machinery, while 91TB means you'll be splitting data eventually and should choose a key that doesn't fight you. This is why estimation comes first — thirty seconds of division stopped you from designing for a bottleneck you don't have."}]},{"id":"urls-2","title":"Generating the key","exercises":[{"type":"multiple_choice","prompt":"Your short code is 7 characters from [a-zA-Z0-9] — 62 possibilities per character. How many links can that address?","choices":["About 62 million","62^7 ≈ 3.5 trillion","About 7 billion","About 500 million"],"answer":1,"why":"62^7 ≈ 3.5 trillion, which at 100M links/day is roughly 95 years of headroom — so 7 characters is a defensible choice you can justify with arithmetic rather than taste. That's the useful move: the length of the code is a capacity decision, and 6 characters (~57 billion) would run out in under two years at this rate."},{"type":"multiple_choice","prompt":"Approach A: hash the long URL (say MD5) and take the first 7 characters. What's the problem?","choices":["Hashing is too slow","Truncating a hash produces collisions — two different URLs can map to the same 7 characters, so you must detect that and handle it on every write","MD5 is insecure for this","The output isn't URL-safe"],"answer":1,"why":"Any function mapping unlimited inputs into 3.5 trillion outputs must collide eventually, and by the birthday paradox it starts happening far earlier than intuition suggests. So hashing doesn't remove the problem, it just means every insert needs a uniqueness check and a retry strategy — which is workable, and it's real complexity on the write path."},{"type":"multiple_choice","prompt":"Approach B: use an auto-incrementing counter and encode the number in base62. What does that buy?","choices":["Nothing over hashing","No collisions ever, by construction — each number is used once, and base62 just changes how you write it down","Shorter codes","Better security"],"answer":1,"why":"Uniqueness comes free from the counter rather than being checked for, so the write path has no collision logic at all — and base62 is purely a rendering of the same integer, not a hash. Codes also stay short early on, since link one is 'b' rather than seven random characters."},{"type":"multi_select","prompt":"What are the real downsides of the counter approach? Select all.","choices":["Codes are sequential, so anyone can enumerate every link ever created","It reveals roughly how many links you've made — a business metric you may not want public","A single global counter is a coordination point that must be unique across all servers","It produces collisions"],"answer":[0,1,2],"why":"Guessability is the serious one: sequential codes mean a scraper can walk your entire corpus, and 'unlisted' links stop being unlisted. It also leaks your growth rate, and the counter itself becomes something every server must agree on. What it never does is collide — that was the whole point."},{"type":"multiple_choice","prompt":"So how do you get a counter without every write hitting one coordination point?","choices":["Use a random number instead","Hand each server a pre-allocated range — server A gets 1–10,000, B gets 10,001–20,000 — so servers only coordinate once per block, not once per link","Use a timestamp","Let each server keep its own counter"],"answer":1,"why":"Range allocation amortizes the coordination: one agreement buys ten thousand IDs, so the shared counter is touched once per block instead of 1,200 times a second. This is a genuinely reusable trick — batch the coordination rather than eliminating it — and the cost is gaps in the sequence when a server dies holding an unused block, which nobody cares about."},{"type":"tradeoff_slider","prompt":"Your product promises that unlisted links can't be discovered by strangers. Slide toward your key scheme.","leftLabel":"Sequential counter (no collisions, enumerable)","rightLabel":"Random key + uniqueness check (unguessable, must retry)","answerRange":[60,100],"why":"You just promised unguessability, and a sequential code makes enumeration trivial — so the counter's elegance is disqualified by the requirement rather than by engineering. Random keys with a unique constraint cost you a retry on the rare collision, which at 3.5 trillion possibilities is rare enough that the write path stays cheap. The requirement chose, not the algorithm."}]},{"id":"urls-3","title":"Serving the redirect","exercises":[{"type":"build_diagram","prompt":"116,000 redirects/sec, and the same popular links are requested constantly. Add the piece that absorbs that read load.","slots":["Redirect Service","?","Database (source of truth)"],"palette":["Cache","Message Queue","A second load balancer"],"answer":"Cache","why":"Link mappings are perfect cache material: immutable once created, tiny, and massively skewed — a small number of links take most of the traffic. A cache in front of the database turns 116,000 database reads/sec into a few thousand, and the database keeps being the source of truth for everything that misses."},{"type":"multiple_choice","prompt":"Why are these mappings unusually good cache candidates?","choices":["They're small","They never change: a short code maps to one long URL forever, so a cached entry can't go stale — which deletes unit 5's invalidation problem entirely","They're requested rarely","They're stored as text"],"answer":1,"why":"Cache invalidation is hard because copies drift from a truth that keeps moving — and here the truth never moves, so the whole category of problem evaporates. Immutable data is the easiest thing in system design, which is worth noticing as a design lever: making data immutable, where you can, buys you caching for free."},{"type":"multiple_choice","prompt":"Should the redirect return 301 (permanent) or 302 (temporary)?","choices":["301 always — the mapping is permanent","It's a real tradeoff: 301 lets browsers cache the redirect so subsequent clicks never reach you at all, which is great for load and destroys your click analytics","302 always — it's safer","It doesn't matter"],"answer":1,"why":"A 301 is the best possible caching outcome and the worst possible analytics outcome, because a browser that remembers the redirect stops telling you the click happened. So the choice is decided by the product: if click counts are the business, you take 302 and eat the traffic; if they're decoration, 301 makes most of your load disappear."},{"type":"multiple_choice","prompt":"Your cache holds the hot links. A brand-new viral link is created and instantly gets 50,000 requests/second. What happens?","choices":["The cache serves it","The first requests all miss simultaneously and stampede the database for the same key — a thundering herd on one row","The database rejects them","The link is rate limited"],"answer":1,"why":"A cold key under sudden load means thousands of concurrent misses each dutifully going to the database for the identical value, which is unit 14's stampede at the row level. The fix is request coalescing: let one miss fetch while the rest wait for its result, so the database sees one query rather than fifty thousand."},{"type":"multiple_choice","prompt":"Which database fits this workload?","choices":["It must be relational for the transactions","Almost anything: the access pattern is a key-value lookup by short code, so a KV store fits perfectly — and it's the access pattern, not fashion, that says so","It must be NoSQL for the scale","A graph database"],"answer":1,"why":"The system does exactly one read: give me the long URL for this code. That's a hashmap, which is unit 7's cleanest case — no joins, no transactions, no ad-hoc queries. Postgres would serve this happily too; what makes the KV store defensible is that the workload genuinely has one access pattern, and that's the honest reasoning rather than 'NoSQL scales'."},{"type":"multiple_choice","prompt":"How would you shard 91TB of links?","choices":["By creation date","By hash of the short code — it's the only thing every read has, and hashing spreads the hot codes across shards","By long URL","By user id"],"answer":1,"why":"Unit 15's rule is to shard by what your hot query filters on, and every redirect arrives knowing exactly one thing: the short code. Sharding by date would send all of today's traffic to today's shard — the sequential-key hotspot — and sharding by user would mean the redirect, which has no user, can't find its row without a scan."}]},{"id":"urls-4","title":"The edges","exercises":[{"type":"multiple_choice","prompt":"A user wants the custom alias /launch. How does that interact with your generated keys?","choices":["Keep them in separate systems","They share one namespace, so a custom alias can collide with a generated one — you need a uniqueness constraint over both, and generated keys ideally shouldn't land on nice words","Custom aliases can't be supported","Generate the custom alias by hashing it"],"answer":1,"why":"Both are just keys in the same map, so /launch is only free if nothing generated it first — and a unique constraint in the database is the only enforcement that can't be raced (unit 6). Real systems often generate from a reduced alphabet or reserve a prefix space, so generated codes and human-chosen words rarely compete for the same string."},{"type":"multiple_choice","prompt":"Links can expire. How do you delete 100 million expired links a day?","choices":["A nightly DELETE query across the table","Don't delete on read paths — either let the store expire them by TTL, or sweep in small batches, because one enormous DELETE will lock and lag everything","Delete them as they're requested","Never delete them"],"answer":1,"why":"A single mass DELETE is a long-running transaction touching millions of rows, which is unit 9's advice violated at scale — it holds locks, bloats storage, and lags your replicas exactly when it runs. A TTL that the store enforces, or small idempotent batches, keeps the work bounded and interruptible, which is what makes it safe to run on a live system."},{"type":"multiple_choice","prompt":"You want click analytics, but writing a row per click means 116,000 writes/sec — 100× your link writes. What do you do?","choices":["Write each click synchronously","Fire the click onto a queue and aggregate asynchronously — the redirect must not wait for analytics, and approximate counts are fine","Skip analytics","Store clicks in the cache"],"answer":1,"why":"Analytics would be the single largest write load in the system, and it's the least important data — so it must never sit on the redirect's critical path (unit 16). Queue the event, batch the aggregation, and accept that a few lost clicks change no decision anyone will ever make, which is exactly the durability tradeoff unit 6 described."},{"type":"multi_select","prompt":"Which parts of this system genuinely need strong consistency? Select all.","choices":["The uniqueness of a short code","The click counter","The mapping visible immediately after creation, to the creator","Analytics dashboards"],"answer":[0,2],"why":"Uniqueness is non-negotiable — two long URLs behind one code is corruption you can't undo — and the creator seeing their own new link immediately is unit 19's read-your-writes, which is what they'd notice. The counter and the dashboards can be seconds or minutes stale and nobody is harmed, so paying for coordination there buys a guarantee nobody would miss."},{"type":"multiple_choice","prompt":"Someone shortens a malicious URL and it spreads. What have you built without meaning to?","choices":["Nothing — you just store strings","An anonymizer: your trusted domain now launders links whose destination nobody can see before clicking","A caching problem","A rate limiting problem"],"answer":1,"why":"The product's core feature — hiding the destination behind your domain — is exactly what makes it useful for phishing, so abuse isn't a bolt-on concern but a direct consequence of the design. That's why real shorteners check destinations against blocklists, rate limit creation, and offer a preview: the mitigation belongs in the design, because the vulnerability came from the requirements."},{"type":"multiple_choice","prompt":"Summarize the design in one line.","choices":["A distributed database with complex sharding","A key-value lookup that's overwhelmingly read-heavy and immutable — so the design is a cache in front of a KV store, and the interesting decisions are key generation, analytics, and abuse","A microservices architecture with a message bus","A relational database with heavy indexing"],"answer":1,"why":"The arithmetic said writes were easy and reads were everything, and immutability said caching is free — so the core is genuinely simple, and pretending otherwise is how people over-engineer this in interviews. All the real difficulty sits at the edges: how you mint keys, how you count clicks without drowning, and what happens when people misuse it."}]}]};
/* ---- 24-design-news-feed.json ---- */
const UNIT24 = {"unitId":"design-news-feed","title":"Design a News Feed","lessons":[{"id":"feed-1","title":"The shape of the problem","exercises":[{"type":"multiple_choice","prompt":"'Design a news feed.' What's the defining characteristic of this workload?","choices":["Writes are enormous","It's brutally read-heavy and personalized: everyone's feed is different, and people refresh far more than they post","It needs strong consistency","It's a graph problem"],"answer":1,"why":"Two facts drive the entire design: reads massively outnumber writes, and every read is unique to one person — so you can't just cache 'the feed' the way you'd cache a homepage. Personalization is what makes this harder than the URL shortener, where one cached answer served everybody."},{"type":"estimate","prompt":"300 million daily users each open the feed about 10 times a day. Roughly how many feed reads per second on average?","answer":34700,"tolerance":12000,"unit":"reads/sec","why":"300M × 10 = 3 billion reads/day ÷ 86,400 ≈ 34,700/sec on average, and peaks will run several times that. That's the number that disqualifies the naive design: whatever a feed read costs, you're paying it tens of thousands of times a second, so it must be close to a single cheap lookup."},{"type":"multiple_choice","prompt":"The obvious approach: when a user opens the feed, query for all posts by everyone they follow, sorted by time. Why won't that survive?","choices":["It returns the wrong posts","You'd run a huge multi-follow query, sort it, and paginate it — tens of thousands of times a second, and the cost scales with how many people each user follows","The database can't sort","It's not personalized enough"],"answer":1,"why":"The query is correct and impossibly expensive: a user following 500 accounts makes the database gather and sort across 500 sources for every refresh. Multiply by 34,700/sec and no amount of indexing saves you — the work per read is the problem, not the speed of any one step."},{"type":"fill_blank","prompt":"Building each feed at read time is called fan-out on ______.","choices":["read","write","demand","query"],"answer":0,"why":"You fan out across everyone the user follows at the moment they ask — the work happens when the read arrives, which is exactly when you have the least time to spend."},{"type":"multiple_choice","prompt":"Given the 100:1-ish read:write ratio, what does unit 7's rule tell you to do?","choices":["Optimize the read query harder","Put the work where the traffic isn't — do it at write time, so a read becomes one cheap lookup","Add read replicas","Cache the query results"],"answer":1,"why":"When reads outnumber writes 100:1, doing work once per post beats doing it 100 times per post — that's the whole logic of precomputation. So the move is to build feeds when someone posts rather than when someone looks, converting an expensive read into an expensive-but-rare write."},{"type":"multiple_choice","prompt":"So what does 'fan-out on write' actually do?","choices":["It writes the post to a queue","When you post, it immediately inserts that post's id into the precomputed feed list of every one of your followers","It replicates the post to every server","It caches the post"],"answer":1,"why":"The feed is materialized in advance: each user has a ready-made list, and posting means pushing your post id into everyone else's list. A read then becomes 'fetch my list', which is a single lookup — precisely the cheap read you need at 34,700/sec."}]},{"id":"feed-2","title":"Fan-out on write","exercises":[{"type":"order_steps","prompt":"Order what happens when a user with 200 followers posts, using fan-out on write.","steps":["User submits the post","Post is stored once, in the posts table","Server responds — the user's post is live","A worker looks up the author's 200 followers","The post id is appended to each of those 200 feed lists"],"why":"The post is stored once and referenced 200 times, and the response goes out before the fan-out finishes — the user isn't waiting on 200 list writes. That's unit 16 doing its job: the fan-out is real work that nobody is watching, so it belongs behind a queue."},{"type":"multiple_choice","prompt":"Why store the post ONCE and push only its id into follower feeds, rather than copying the post itself?","choices":["Ids are faster to sort","Copying the post 200 times means 200 places to update when it's edited or deleted — the id keeps one source of truth and makes the feed a list of pointers","It saves nothing","Ids compress better"],"answer":1,"why":"This is unit 5's source-of-truth discipline applied under pressure: the feed lists are derived, rebuildable pointers, while the post itself has exactly one home. Denormalizing the post body into every feed would buy one fewer lookup and cost you the edit-and-delete problem across millions of copies."},{"type":"multiple_choice","prompt":"A user with 200 million followers posts. What does fan-out on write do?","choices":["Handles it the same way","Attempts 200 million list writes for one post — a single action becomes hours of work and a massive write storm","Rejects the post","Fans out only to active followers"],"answer":1,"why":"The cost of a post is proportional to the author's follower count, so the model that made ordinary posting cheap makes celebrity posting catastrophic — one tap generating 200 million writes. This is unit 15's celebrity problem in its most famous form, and it's exactly where fan-out on write breaks."},{"type":"multiple_choice","prompt":"Beyond the write storm, what's the second-order damage from a celebrity fan-out?","choices":["Nothing else","It's not instant — followers at the end of the queue see the post minutes after followers at the front, so the feed becomes visibly unfair","The post is duplicated","The database runs out of space"],"answer":1,"why":"Fan-out takes as long as it takes, so 'who sees it first' is decided by queue position rather than anything meaningful — and for a live event, minutes of skew is a product failure people notice and complain about. The write storm is the technical problem; the skew is the one users feel."},{"type":"multi_select","prompt":"What does fan-out on write cost you? Select all.","choices":["Write amplification proportional to follower count","Storage for every user's materialized feed list","Wasted work for inactive users who never read their feed","Slow feed reads"],"answer":[0,1,2],"why":"You pay in amplified writes, in storage for millions of lists, and in work done for accounts that haven't logged in for a year. Reads are the one thing that got FASTER — that was the entire trade, and it's unit 7's exchange rate: cheap reads bought with expensive writes."},{"type":"multiple_choice","prompt":"How do you stop fanning out to users who never read their feed?","choices":["Delete inactive accounts","Only fan out to recently-active users, and build the feed on demand for anyone who returns after a long absence","Fan out more slowly","You can't"],"answer":1,"why":"Most of a large platform's registered users aren't active, so most fan-out work is materializing feeds nobody will ever open — skipping them removes a huge fraction of the write load for free. The returning user pays a one-off expensive read, which is a fine trade because they're rare and they've just spent time away anyway."}]},{"id":"feed-3","title":"The hybrid","exercises":[{"type":"multiple_choice","prompt":"Fan-out on write breaks for celebrities. Fan-out on read breaks for everyone. What's the actual answer?","choices":["Pick the lesser evil","Both: fan out on write for ordinary accounts, and fan out on read for the handful of celebrities — merging the two at read time","Fan-out on read with a bigger cache","Shard the feed"],"answer":1,"why":"The two approaches fail at opposite ends — write fan-out dies on huge follower counts, read fan-out dies on ordinary read volume — so you route each account to the model that suits it. A user's feed becomes their precomputed list merged with a live query for the few celebrities they follow, which is cheap because that number is small."},{"type":"order_steps","prompt":"Order how a hybrid feed read assembles.","steps":["Fetch the user's precomputed feed list","Fetch recent posts from the few celebrities they follow","Merge the two sets","Rank the merged set","Return one page of results"],"why":"One cheap lookup plus a small live query, merged and ranked — the live part stays affordable because almost nobody follows more than a handful of accounts big enough to be excluded from fan-out. The threshold is a tuning knob: too low and you do too many live queries, too high and you're back to write storms."},{"type":"multiple_choice","prompt":"Where do you set the celebrity threshold — the follower count above which you stop fanning out?","choices":["Exactly 1 million","Wherever the fan-out cost stops being worth it, judged from your own distribution — it's an operational number you tune, not a constant","It should be dynamic per post","There shouldn't be a threshold"],"answer":1,"why":"The right value depends on your follower distribution, write capacity, and how much read-time merging you'll tolerate — so it's a dial you set from measurements rather than a number anyone can hand you. What matters in a design discussion is knowing that the threshold exists and what it trades: write amplification against read-time work."},{"type":"multiple_choice","prompt":"Where should each user's precomputed feed list actually live?","choices":["In the main database","In a fast store like Redis, capped at a few hundred entries — it's derived data, rebuildable from posts and follows, so it doesn't need the durability of the source of truth","In the CDN","In each app server's memory"],"answer":1,"why":"The list is exactly unit 5's derived state: lose it and you can rebuild it, so it belongs somewhere fast rather than somewhere durable. Capping it matters too — nobody scrolls to post 5,000, so storing an unbounded list per user is paying to materialize something nobody reads."},{"type":"multiple_choice","prompt":"Your feed lists are in Redis. Redis restarts and loses everything. How bad?","choices":["Catastrophic — the feeds are gone","Recoverable but painful: feeds rebuild from posts and follows, so nothing is truly lost — but every read now falls through to expensive rebuilds at once","No impact","Only new users are affected"],"answer":1,"why":"This is why derived-versus-authoritative was worth being religious about: no data was destroyed, so it's a bad afternoon rather than a company-ending event. But 34,700 reads/sec all missing simultaneously is unit 13's thundering herd at full scale, so the recovery plan matters as much as the fact that recovery is possible."},{"type":"multiple_choice","prompt":"A user follows someone new. What has to happen to their feed?","choices":["Nothing — new posts will fan out to them","New posts arrive naturally, but the new followee's EXISTING posts aren't in the list — so you either backfill them or accept the feed only fills in going forward","The whole feed must be rebuilt","The follow is queued"],"answer":1,"why":"Fan-out only pushes at post time, so a follow made afterwards inherits nothing historical — the list has a start date. Backfilling means merging that account's recent posts into the list, which is a small job for one follow and a large one when someone imports a thousand. Most products just let the feed fill forward, which users barely notice."}]},{"id":"feed-4","title":"Ranking, paging, and lies","exercises":[{"type":"multiple_choice","prompt":"Your feed is ranked by relevance, not time. What does that break about fan-out on write?","choices":["Nothing","The precomputed list was ordered at write time, but relevance depends on the reader and the moment — so you can no longer bake the final order in advance","It makes fan-out cheaper","It requires a graph database"],"answer":1,"why":"Chronological order is a property of the posts, so it can be materialized; relevance is a property of the reader right now, so it can't. The usual resolution is to keep fan-out as a candidate-generation step — it decides WHICH posts you might see — and rank those candidates at read time, which is affordable because the candidate set is a few hundred rather than millions."},{"type":"multiple_choice","prompt":"Your feed uses ?offset=40&limit=20 for the third page. New posts arrive while the user scrolls. What do they see?","choices":["The next 20 posts correctly","Duplicates: new posts shifted everything down, so items they already saw are pushed into the next page","Nothing changes","An error"],"answer":1,"why":"Offset counts from the top of a list that keeps growing at the top, so every new post shifts the window and re-serves items the user already read. This is exactly unit 3's offset-pagination flaw, and a feed is its worst case: the insert rate is high and the insertions are precisely at the boundary offset depends on."},{"type":"multiple_choice","prompt":"So how do feeds paginate correctly?","choices":["Cache the first page","Cursor pagination — 'give me 20 items after this specific post' — so new arrivals at the top can't shift the window","Freeze the feed while scrolling","Use bigger pages"],"answer":1,"why":"A cursor names a position in the data rather than a count from a moving edge, so inserts above it are irrelevant to what comes next. That's why every real feed hands you an opaque cursor instead of a page number — and it's the same reasoning that made cursors right for the API unit, arriving here with much higher stakes."},{"type":"multi_select","prompt":"Which parts of a feed can be eventually consistent? Select all.","choices":["A followee's post appearing in your feed a few seconds late","The like count on a post","Your own post appearing in your own profile immediately after posting","A blocked user's posts continuing to appear"],"answer":[0,1],"why":"Nobody can tell whether a friend's post arrived instantly or three seconds ago, and an approximate like count harms nobody. Your own post is unit 19's read-your-writes — its absence looks like data loss and you'll be told about it. And a block that doesn't take effect isn't staleness, it's a safety failure that can put someone in danger, so it needs to be correct immediately."},{"type":"tradeoff_slider","prompt":"A user deletes a post that's already been fanned out to 200,000 feed lists. Slide toward your approach.","leftLabel":"Purge it from all 200,000 lists now","rightLabel":"Leave the ids; filter deleted posts at read time","answerRange":[55,100],"why":"The lists hold ids rather than content, so a deleted post is already just a dangling pointer — you're hydrating posts at read time anyway, and skipping a missing one is nearly free. Chasing 200,000 lists is a huge write storm to save a filter. The caveat that decides the other direction: if deletion is a safety or legal matter, 'filtered at read time' isn't good enough, because a missed filter is a leak."},{"type":"multiple_choice","prompt":"Summarize the news feed design.","choices":["Query posts from followees at read time, cached","Precompute feeds on write for ordinary users, query live for celebrities, merge and rank at read time — with cursor pagination and derived lists you can rebuild","A graph database traversal per read","Fan out everything to everyone"],"answer":1,"why":"The whole design is one tradeoff resolved twice: reads dominate, so precompute — except where precomputing explodes, so query live there instead. Everything else follows from that hybrid: the lists are derived and rebuildable, ranking has to happen at read time because it depends on the reader, and cursors exist because the list you're paging through keeps growing at the top."}]}]};
