 {"type":"match_pairs","prompt":"Match each concurrency anomaly to what goes wrong.","pairs":[{"left":"Dirty read","right":"You read data another transaction hasn't committed"},{"left":"Non-repeatable read","right":"You read the same row twice and get different values"},{"left":"Phantom read","right":"You re-run a range query and new rows appear"},{"left":"Lost update","right":"Two read-modify-writes; one is silently overwritten"}],"why":"Each isolation level is defined by which of these it forbids. Knowing the anomalies is how you read the levels.","goDeeper":"You already met lost update in unit 6 — the counter that went from 10 to 11 instead of 12. It wasn't a database bug; it was an isolation level doing exactly what it promised, which was less than you assumed."},
 {"type":"order_steps","prompt":"Order the isolation levels from weakest to strongest.","steps":["Read Uncommitted","Read Committed","Repeatable Read","Serializable"],"why":"Each rung forbids more anomalies and costs more coordination. Read Uncommitted allows dirty reads; Read Committed stops them; Repeatable Read stops non-repeatable reads; Serializable stops everything.","goDeeper":"Read Uncommitted is almost never worth using — you get dirty reads for a performance win that modern engines barely deliver. The real decision in practice is between Read Committed, Repeatable Read, and Serializable."},
 {"type":"multiple_choice","prompt":"What does Serializable actually guarantee?","choices":["Transactions literally run one at a time, so it's very slow","The RESULT is as if they'd run one at a time in some order — even though they ran concurrently","That no transaction ever fails","That reads are always fast"],"answer":1,"why":"It's a promise about the outcome, not the schedule. The database may run everything concurrently, as long as the final state matches SOME serial order.","goDeeper":"That 'as if' does enormous work. The engine may let transactions run in parallel and then ABORT one when it spots a conflict that couldn't have arisen serially. Which means under Serializable your transaction can fail through no fault of its own — and your code must be ready to retry. Correctness didn't become free; it moved into your error handling."},
 {"type":"multiple_choice","prompt":"Two doctors are on call. Each opens a transaction, checks 'is at least one OTHER doctor on call?', sees yes, and books themselves off. Both commit. Now nobody is on call — though each transaction was individually valid. What is this?","choices":["A dirty read","Write skew — they read overlapping data but wrote to different rows, so nothing conflicted","A phantom read","A deadlock"],"answer":1,"why":"No two transactions touched the same row, so most isolation levels see no conflict at all. Yet together they broke an invariant that neither broke alone.","goDeeper":"This is the anomaly that snapshot isolation — which is what Postgres's 'Repeatable Read' actually is — still permits, and that Serializable prevents. It's subtle precisely BECAUSE nothing overlapped: the bug lives in a rule spanning rows, not in any single row. If your correctness depends on an invariant across multiple rows, Read Committed and Repeatable Read will not save you."},
 {"type":"multiple_choice","prompt":"Your correctness depends on an invariant spanning multiple rows that must never break. What do you do?","choices":["Hope — it's rare","Use Serializable and handle retries, take an explicit lock, or restructure so the invariant lives in a single row","Add an index","Switch to NoSQL"],"answer":1,"why":"Three real options: pay for Serializable (and be ready to retry), lock explicitly so conflicts are visible, or reshape the data so the rule is enforceable in one place.","goDeeper":"That third option is underrated. If the invariant can be expressed as a single row — a counter, a constraint, a unique key — the database can enforce it cheaply and unconditionally. Often the best fix for a hard concurrency problem is a better data model, not a stronger isolation level."}
]},
{"id":"txn-4","title":"Transactions in the real world","exercises":[
 {"type":"multiple_choice","prompt":"Transaction 1 locks row A and then wants row B. Transaction 2 locks row B and then wants row A. What happens?","choices":["They both wait forever, silently","Deadlock — the database detects the cycle, kills one, and that one gets an error and must retry","They merge into one transaction","The database crashes"],"answer":1,"why":"Each holds what the other needs. Real databases detect the cycle and abort a victim rather than hanging forever — so one transaction gets an error out of nowhere.","goDeeper":"The classic prevention is to always acquire locks in a consistent order — e.g. always lock the lower account id first, so a cycle can't form. Deadlocks aren't a database defect; they're an emergent property of concurrent code, and your app must be prepared to retry."},
 {"type":"multiple_choice","prompt":"You open a transaction and hold it for 10 minutes while calling an external payment API inside it. What's the damage?","choices":["None — the transaction just waits","You hold locks the whole time, block other transactions, and force the database to retain old row versions — bloating storage and slowing everything","It makes the payment faster","The database ignores idle transactions"],"answer":1,"why":"A held transaction holds locks and pins old versions of rows. Everyone who needs those rows queues behind you — for as long as a third party takes to answer.","goDeeper":"The rule: never do network I/O inside a transaction. This is one of the most common real production outages there is — the slow API call holds locks, waiting transactions pile up (unit 4's queueing), the connection pool exhausts, and a payments hiccup becomes a total site outage. Do the I/O first, then open a short transaction to record the result."},
 {"type":"match_pairs","prompt":"Match each concurrency strategy to what it is.","pairs":[{"left":"Pessimistic locking","right":"Lock up front — assume conflict is likely"},{"left":"Optimistic concurrency","right":"Proceed, detect conflict at commit, retry"},{"left":"Version number check","right":"How optimistic concurrency spots a conflict"},{"left":"Deadlock","right":"Two transactions each holding what the other wants"}],"why":"Two philosophies: prevent conflicts by excluding others, or allow them and detect collisions at the end.","goDeeper":"Optimistic concurrency is usually a version column: read version 7, write only if it's still 7. If someone else got there first it's now 8, your update matches nothing, and you retry. It's just compare-and-set, applied to a row."},
 {"type":"multiple_choice","prompt":"Your workload has rare conflicts — users almost never edit the same row simultaneously. Which strategy usually wins?","choices":["Pessimistic locking — safety first","Optimistic concurrency — conflicts are rare, so occasionally retrying beats making everyone wait","Neither works","It makes no difference"],"answer":1,"why":"If collisions are rare, locking everyone up front taxes the 99% of transactions that would never have conflicted. Let them run and pay only when you actually collide.","goDeeper":"And the inverse matters just as much: under HIGH contention, optimistic degenerates — everyone retries, collides again, and you burn capacity making no progress. Pessimistic is calmer there. Choose from how often you actually collide, not from which sounds more sophisticated."},
 {"type":"multiple_choice","prompt":"You must charge a credit card (an external service) AND create an order (your database) atomically. Can a database transaction do this?","choices":["Yes — wrap both in BEGIN/COMMIT","No — a database transaction only covers its own database; the card charge is a separate system that knows nothing about your COMMIT or ROLLBACK","Yes, if you use Serializable","Yes, with the right driver"],"answer":1,"why":"Atomicity stops at the database boundary. Your ROLLBACK can rewind your rows — it cannot un-charge someone's card.","goDeeper":"This is where people get badly burned, because the code LOOKS atomic. The real patterns are: two-phase commit (a coordinator asks every participant to prepare, then commit — correct, but slow, and it blocks if the coordinator dies mid-flight), or a saga (do the steps, and if a later one fails, run compensating actions — issue a refund). Most modern systems choose sagas plus idempotency (unit 2) over 2PC."},
 {"type":"tradeoff_slider","prompt":"Microservices: an order service and a payment service, each with its own database. Slide toward your approach for keeping them consistent.","leftLabel":"Two-phase commit (strict atomicity)","rightLabel":"Saga (compensating actions, eventual)","answerRange":[55,100],"why":"Across services, 2PC's blocking behaviour and coordinator failure modes are usually worse than the complexity of writing compensating actions. Most real distributed systems choose sagas.","goDeeper":"But be honest about what you just gave up: there's now a window where the payment succeeded and the order doesn't exist yet. You accepted a temporarily inconsistent state plus a compensation path — because the alternative, a distributed lock spanning services, is worse. That acceptance is the road to eventual consistency, and it's where Tier 3 begins."},
 {"type":"multiple_choice","prompt":"What's the honest summary of transactions?","choices":["Always use Serializable and never think about it again","A transaction buys atomicity and a chosen isolation level within ONE database — so know your level, keep transactions short, and remember the guarantee stops at the database boundary","Transactions are legacy; use eventual consistency everywhere","Transactions make concurrency bugs impossible"],"answer":1,"why":"Powerful, bounded, and configurable. The power is real; the boundary and the dial are what people forget.","goDeeper":"Three things most engineers get wrong, in order of damage: (1) they don't know their isolation level, (2) they hold transactions open across network calls, (3) they assume atomicity extends across services. Fix those three and you're ahead of most working engineers — and you're ready for what happens when the copies can't talk to each other."}
]}
]};

const COURSE = [UNIT1, UNIT2, UNIT3, UNIT4, UNIT5, UNIT6, UNIT7, UNIT8, UNIT9];
const TIERLABEL = ["Foundations","Foundations","Foundations","Foundations","Foundations","Storing Data","Storing Data","Storing Data","Storing Data"];

/* ---- engine ---- */
let uidx=0, UNIT=COURSE[0];
let hearts=5, xp=0, correct=0, total=0, idx=0, ex=null, lesson=null, checked=false, current=null;
const $=id=>document.getElementById(id);

function shuffle(a){ // deterministic-ish shuffle without Math.random dependency issues
  const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=(i*7+3)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];} return arr;
}

function bootUnits(){
  const t=$('unittabs'); t.innerHTML='';
  COURSE.forEach((u,i)=>{
    const b=document.createElement('button'); b.className='utab'+(i===uidx?' on':'');
    b.textContent=`${i+1}. ${u.title}`;
    b.onclick=()=>{ uidx=i; UNIT=COURSE[i]; bootUnits(); boot(); };
    t.appendChild(b);
  });
}
function boot(){
  $('pk-kicker').textContent=`${TIERLABEL[uidx]} · Unit ${uidx+1}`;
  $('pk-title').textContent=UNIT.title;
  const lp=$('lessonpick'); lp.innerHTML='';
  UNIT.lessons.forEach((l,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<span class="k">${i+1}</span> ${l.title}`;
    b.onclick=()=>startLesson(i); lp.appendChild(b);
  });
}
function startLesson(i){
  lesson=UNIT.lessons[i]; idx=0; correct=0; total=0; hearts=5; xp=0;
  $('hearts').textContent=hearts;
  $('picker').classList.add('hidden'); $('complete').classList.add('hidden');
  $('stage').classList.remove('hidden'); $('foot').classList.remove('hidden');
  render();
}
function progress(){ $('bar').style.width=(idx/lesson.exercises.length*100)+'%'; }

function render(){
  checked=false; ex=lesson.exercises[idx]; progress();
  $('feedback').innerHTML=''; $('feedback').className='';
  const a=$('action'); a.className='btn'; a.textContent='Check'; a.disabled=true; a.onclick=check;
  const s=$('stage'); s.className='stage';
  s.innerHTML=`<div class="kicker">${lesson.title} · ${idx+1}/${lesson.exercises.length}</div><p class="prompt">${ex.prompt}</p><div id="body"></div>`;
  ({multiple_choice:mc,fill_blank:mc,multi_select:ms,match_pairs:match,order_steps:order,build_diagram:diagram,estimate:estimate,tradeoff_slider:slider})[ex.type]();
}
function enable(){ $('action').disabled=false; }

/* single-select (mc + fill_blank) */
function mc(){
  const opts=ex.type==='fill_blank'?ex.choices:ex.choices; current=null;
  const w=$('body'); const c=document.createElement('div'); c.className='choices';
  opts.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<span class="k">${String.fromCharCode(65+i)}</span> ${t}`;
    b.onclick=()=>{ if(checked)return; current=i; [...c.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); enable(); };
    c.appendChild(b);
  });
  w.appendChild(c);
}
/* multi-select */
function ms(){
  current=new Set(); const w=$('body'); const c=document.createElement('div'); c.className='choices';
  ex.choices.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<span class="k">${String.fromCharCode(65+i)}</span> ${t}`;
    b.onclick=()=>{ if(checked)return; if(current.has(i)){current.delete(i);b.classList.remove('sel');}else{current.add(i);b.classList.add('sel');} $('action').disabled=current.size===0; };
    c.appendChild(b);
  });
  w.appendChild(c);
}
/* match pairs */
function match(){
  const w=$('body'); current={sel:null,map:{}};
  const lefts=ex.pairs.map(p=>p.left), rights=shuffle(ex.pairs.map(p=>p.right));
  const grid=document.createElement('div'); grid.className='match';
  const cl=document.createElement('div'); cl.className='col'; const cr=document.createElement('div'); cr.className='col';
  const lb={},rb={};
  lefts.forEach(l=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.style.textAlign='left';lb[l]=b;
    b.onclick=()=>{if(checked)return;current.sel={side:'l',v:l};highlight();};cl.appendChild(b);});
  rights.forEach(r=>{const b=document.createElement('button');b.className='chip';b.textContent=r;b.style.textAlign='left';rb[r]=b;
    b.onclick=()=>{if(checked)return;current.sel={side:'r',v:r};highlight();};cr.appendChild(b);});
  function highlight(){
    Object.values(lb).forEach(b=>b.classList.remove('sel'));Object.values(rb).forEach(b=>b.classList.remove('sel'));
    const s=current.sel; if(!s)return;
    (s.side==='l'?lb[s.v]:rb[s.v]).classList.add('sel');
    // try pairing: if one of each selected across clicks
    if(current._pending && current._pending.side!==s.side){
      const l=s.side==='l'?s.v:current._pending.v, r=s.side==='r'?s.v:current._pending.v;
      current.map[l]=r; lb[l].classList.add('used'); rb[r].classList.add('used'); current._pending=null; current.sel=null;
      Object.values(lb).forEach(b=>b.classList.remove('sel'));Object.values(rb).forEach(b=>b.classList.remove('sel'));
      if(Object.keys(current.map).length===lefts.length) enable();
    } else { current._pending=s; }
  }
  grid.appendChild(cl); grid.appendChild(cr); w.appendChild(grid);
}
/* order steps */
function order(){
  const w=$('body'); current=shuffle(ex.steps.map((s,i)=>({s,i}))); enable();
  function draw(){
    const list=document.createElement('div'); list.className='order';
    current.forEach((it,pos)=>{
      const r=document.createElement('div'); r.className='row';
      r.innerHTML=`<span class="num">${pos+1}</span> <span>${it.s}</span>`;
      const ar=document.createElement('div'); ar.className='arrows';
      const up=document.createElement('button'); up.textContent='↑'; up.onclick=()=>{if(checked||pos===0)return;[current[pos-1],current[pos]]=[current[pos],current[pos-1]];refresh();};
      const dn=document.createElement('button'); dn.textContent='↓'; dn.onclick=()=>{if(checked||pos===current.length-1)return;[current[pos+1],current[pos]]=[current[pos],current[pos+1]];refresh();};
      ar.appendChild(up);ar.appendChild(dn); r.appendChild(ar); list.appendChild(r);
    });
    w.innerHTML=''; w.appendChild(list);
  }
  function refresh(){draw();}
  draw();
}
/* build diagram */
function diagram(){
  const w=$('body'); current=null;
  const d=document.createElement('div'); d.className='diagram';
  ex.slots.forEach((sl,i)=>{
    if(i>0) d.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');
    if(sl==='?'){ const slot=document.createElement('div'); slot.className='slot'; slot.id='slot'; slot.textContent='?'; d.appendChild(slot); }
    else { const n=document.createElement('div'); n.className='node fixed'; n.textContent=sl; d.appendChild(n); }
  });
  w.appendChild(d);
  const chips=document.createElement('div'); chips.className='chips'; chips.style.justifyContent='center';
  shuffle(ex.palette).forEach(p=>{
    const c=document.createElement('button'); c.className='chip'; c.textContent=p;
    c.onclick=()=>{ if(checked)return; current=p; const slot=$('slot'); slot.textContent=p; slot.classList.add('filled');
      [...chips.children].forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); enable(); };
    chips.appendChild(c);
  });
  w.appendChild(chips);
}
/* estimate */
function estimate(){
  const w=$('body'); current=null;
  const box=document.createElement('div'); box.className='est';
  const inp=document.createElement('input'); inp.type='number'; inp.placeholder='?';
  inp.oninput=()=>{ current=parseFloat(inp.value); $('action').disabled=isNaN(current); };
  box.appendChild(inp); const u=document.createElement('span'); u.className='unit'; u.textContent=ex.unit||''; box.appendChild(u);
  w.appendChild(box);
}
/* tradeoff slider */
function slider(){
  const w=$('body'); current=50;
  const wrap=document.createElement('div'); wrap.className='slider-wrap';
  wrap.innerHTML=`<div class="slider-labels"><span>◀ ${ex.leftLabel}</span><span>${ex.rightLabel} ▶</span></div>`;
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=100; r.value=50;
  const val=document.createElement('div'); val.className='slider-val'; val.textContent='50 / 50';
  r.oninput=()=>{ current=+r.value; val.textContent=`${100-current} / ${current}`; };
  wrap.appendChild(r); wrap.appendChild(val); w.appendChild(wrap); enable();
}

/* ---- checking ---- */
function check(){
  checked=true; total++;
  let ok=false;
  const body=$('body');
  if(ex.type==='multiple_choice'||ex.type==='fill_blank'){
    ok=current===ex.answer;
    const btns=body.querySelectorAll('.choice');
    btns[ex.answer].classList.add('ok'); if(!ok&&current!=null) btns[current].classList.add('bad');
  } else if(ex.type==='multi_select'){
    const want=new Set(ex.answer); ok=current.size===want.size&&[...current].every(x=>want.has(x));
    const btns=body.querySelectorAll('.choice');
    ex.answer.forEach(i=>btns[i].classList.add('ok'));
    [...current].forEach(i=>{if(!want.has(i))btns[i].classList.add('bad');});
  } else if(ex.type==='order_steps'){
    ok=current.every((it,pos)=>it.i===pos);
  } else if(ex.type==='match_pairs'){
    ok=ex.pairs.every(p=>current.map[p.left]===p.right);
  } else if(ex.type==='build_diagram'){
    ok=current===ex.answer; const slot=$('slot'); slot.classList.remove('filled'); slot.classList.add(ok?'filled':'');
    slot.style.borderColor=ok?'var(--green)':'var(--red)'; slot.style.background=ok?'var(--green-soft)':'var(--red-soft)';
  } else if(ex.type==='estimate'){
    ok=Math.abs(current-ex.answer)<=(ex.tolerance||0);
  } else if(ex.type==='tradeoff_slider'){
    ok=current>=ex.answerRange[0]&&current<=ex.answerRange[1];
  }
  if(ok){correct++; xp+=10;} else {hearts=Math.max(0,hearts-1); $('hearts').textContent=hearts;}
  showFeedback(ok);
}
function showFeedback(ok){
  const f=$('feedback'); f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=`<h4>${ok?'✓ Nice!':'✗ Not quite'}</h4><p>${ex.why}</p>`+
    (ex.goDeeper?`<div class="deeper"><b>Go deeper:</b> ${ex.goDeeper}</div>`:'');
  const a=$('action'); a.textContent = idx+1<lesson.exercises.length?'Continue':'Finish'; a.disabled=false;
  a.className='btn'+(ok?'':' '); a.onclick=next;
  if(hearts===0){ a.textContent='Out of hearts — Finish'; }
}
function next(){
  if(hearts===0){ return finish(); }
  idx++;
  if(idx>=lesson.exercises.length) return finish();
  render();
}
function finish(){
  $('bar').style.width='100%';
  $('stage').classList.add('hidden'); $('foot').classList.add('hidden');
  $('complete').classList.remove('hidden');
  $('xp').textContent=xp; $('acc').textContent=Math.round(correct/Math.max(1,total)*100)+'%'; $('hleft').textContent=hearts;
}
bootUnits(); boot();
</script>
</body>
</html>
