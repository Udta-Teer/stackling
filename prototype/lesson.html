const UNIT17 = {"unitId":"rate-limiting","title":"Rate Limiting","lessons":[{"id":"rl-1","title":"Saying no on purpose","exercises":[{"type":"multiple_choice","prompt":"Your API can serve 1,000 requests/second. One client starts sending 50,000/second. With no limit, what happens?","choices":["The extra requests are ignored harmlessly","Everything queues, latency explodes, and every OTHER client's requests get slow or fail too","Only that client is slow","The server rejects them automatically"],"answer":1,"why":"Without a limit there's no such thing as 'that client's problem' — the flood consumes shared capacity, so unit 4's queueing arrives and everybody's latency explodes together. The blast radius is what makes this urgent: one misbehaving script degrades every well-behaved customer you have, and none of them did anything wrong."},{"type":"fill_blank","prompt":"______ limiting caps how many requests a client may make in a given period.","choices":["Rate","Load","Bandwidth","Session"],"answer":0,"why":"You define a budget per client per period, and requests beyond it are refused rather than served — which is what stops one caller consuming everyone's capacity."},{"type":"multiple_choice","prompt":"Why is rejecting a request instantly better than accepting it and being slow?","choices":["It isn't — serving something is always better","A fast rejection costs almost nothing and leaves capacity for everyone else, while a slow acceptance consumes resources and often ends in a timeout anyway","Rejections are cached","It's easier to implement"],"answer":1,"why":"An overloaded system that keeps accepting work does the work badly and then times out, having spent the resources and delivered nothing — you paid full price for a failure. Rejecting early spends microseconds and protects the requests you can still serve, which is why load shedding is a feature rather than an admission of defeat: a system that refuses 10% cleanly beats one that fails 100% slowly."},{"type":"multiple_choice","prompt":"Which status code says 'you're over your limit'?","choices":["503 Service Unavailable","429 Too Many Requests","403 Forbidden","500 Internal Server Error"],"answer":1,"why":"429 is the specific, machine-readable signal that the request was fine but you've sent too many — and it matters that it's distinct from 503, because 429 tells the client the fix is to slow down while 503 says the service itself is unwell. Pair it with a Retry-After header and a well-behaved client knows exactly how long to wait rather than guessing."},{"type":"multi_select","prompt":"What does rate limiting protect you from? Select all.","choices":["A buggy client stuck in a retry loop","One customer's traffic degrading everyone else's","Deliberate abuse and scraping","A slow database query"],"answer":[0,1,2],"why":"Runaway loops, noisy neighbours, and abuse are all the same shape — too many requests from one source — and a limit is the tool for exactly that shape. A slow query is a different problem entirely: it's one request doing too much work, which limits won't touch. In practice the accidental cases dominate: most floods are somebody's retry loop, not an attacker."},{"type":"multiple_choice","prompt":"Your limit is 100 requests/minute per user. A user hits 101. What should you NOT do?","choices":["Return 429 with Retry-After","Silently drop the request and leave the client hanging until it times out","Log it for monitoring","Let them through if you have spare capacity"],"answer":1,"why":"Silently dropping gives the client no information, so it waits out a full timeout and then very likely retries — you've spent a connection, taught them nothing, and probably invited the flood back. An explicit 429 costs almost nothing and lets a well-behaved client back off correctly, which is the entire point: you want limits that make good clients behave, not limits that punish them ambiguously."}]},{"id":"rl-2","title":"How to count","exercises":[{"type":"multiple_choice","prompt":"Simplest approach: count requests per user per minute, reset to zero at the top of each minute. Limit is 100. What can a client do?","choices":["Nothing — they're capped at 100/minute","Send 100 at 10:00:59 and 100 more at 10:01:00 — 200 requests in one second, while never breaking the rule","Only exceed it by a few requests","Bypass the limit entirely"],"answer":1,"why":"A fixed window counts within a bucket and doesn't care where in the bucket the requests land, so traffic at a boundary lets a client legally sustain double the rate across it. That's the fixed-window boundary problem, and it's why the simplest counter can permit exactly the burst you were trying to prevent — the rule was honoured and the intent wasn't."},{"type":"match_pairs","prompt":"Match each algorithm to how it behaves.","pairs":[{"left":"Fixed window","right":"Simple counter per period — allows 2× bursts at boundaries"},{"left":"Sliding window","right":"Counts the last 60 seconds continuously — no boundary trick"},{"left":"Token bucket","right":"Tokens refill steadily; spend them in bursts if you've saved up"},{"left":"Leaky bucket","right":"Drains at a fixed rate — smooths output completely"}],"why":"They differ mainly in how they treat bursts: fixed window permits them accidentally, sliding window forbids them, token bucket permits them deliberately up to the bucket size, and leaky bucket refuses to emit them at all. Choosing between them is really deciding how much burstiness you want to tolerate."},{"type":"multiple_choice","prompt":"Token bucket: tokens refill at 10/second, bucket holds 100. A client idle for a minute suddenly needs 80 requests at once. What happens?","choices":["They're limited to 10 requests","They have a full bucket from being idle, so all 80 go through immediately — and then they're back to 10/second","They're rejected","The bucket overflows"],"answer":1,"why":"Unused capacity accumulates as tokens up to the bucket's size, so an idle client can spend that saving in one burst and then falls back to the refill rate. This is why token bucket is so popular for APIs: it matches how real clients behave — mostly quiet, occasionally busy — and the bucket size lets you say exactly how big a burst you'll forgive while the refill rate still caps the long-run average."},{"type":"multiple_choice","prompt":"When would you choose leaky bucket over token bucket?","choices":["When you want to allow bursts","When the thing downstream cannot handle bursts at all and you need a perfectly smooth output rate","When you need it to be simpler","When clients are trusted"],"answer":1,"why":"Leaky bucket emits at a constant rate no matter how spiky the arrivals, which is what you want when the downstream is fragile — a legacy system or a device that falls over on a spike. You're trading responsiveness for smoothness: a burst that token bucket would pass instantly gets stretched out instead, so callers wait even when capacity was momentarily free."},{"type":"multiple_choice","prompt":"Why is a true sliding window log — storing a timestamp for every request — often impractical?","choices":["It's inaccurate","It's exact but costs memory proportional to your request volume: every request from every client must be stored and expired","It can't handle bursts","It only works on one server"],"answer":1,"why":"Keeping every timestamp gives a perfectly precise window, and it makes your memory bill scale with traffic — at millions of requests a second you're storing millions of timestamps just to count. Which is why the common compromise is a sliding window counter that approximates by weighting the previous window: it's slightly wrong at the edges, and it's a fixed small cost per client rather than a growing one."},{"type":"multiple_choice","prompt":"So which algorithm should you reach for by default on a public API?","choices":["Fixed window — it's simplest","Token bucket — it forgives the bursts real clients naturally produce while still capping the sustained rate","Leaky bucket — it's the smoothest","Sliding window log — it's the most accurate"],"answer":1,"why":"Real clients are bursty in harmless ways — a page loads and fires eight requests — and a limiter that punishes that generates support tickets rather than protection. Token bucket handles it by design: bucket size forgives the burst, refill rate governs the average, and both are numbers you can explain to a customer, which matters more than theoretical precision."}]},{"id":"rl-3","title":"Where the counter lives","exercises":[{"type":"multiple_choice","prompt":"You run 10 servers. Each keeps its own in-memory counter with a limit of 100/minute per user. What's the client's real limit?","choices":["100 per minute","Up to 1,000 per minute — each server only counts what it personally saw, and the load balancer spreads the client across all ten","10 per minute","It depends on the algorithm"],"answer":1,"why":"A local counter can only count local traffic, so with N servers your effective limit is roughly N × the configured value — you wrote 100 and shipped 1,000. This is unit 5's lesson arriving again: the counter is state, and state kept locally on interchangeable machines means each machine holds a different fragment of the truth."},{"type":"multiple_choice","prompt":"So you move the counter to a shared store like Redis. What did that cost you?","choices":["Nothing","A network round trip on every single request, plus a dependency that can fail — and if it's down, you must decide whether to allow everything or block everything","Only memory","Accuracy"],"answer":1,"why":"Exactness requires one place to count, and one place means a network hop in front of every request plus a component whose failure is now your failure. That last decision deserves thought before the incident: fail-open lets a flood through when Redis dies, fail-closed takes your API down to protect it — and 'we never decided' means you'll discover your default at 3am."},{"type":"multiple_choice","prompt":"Why do many real systems combine a local counter with a shared one?","choices":["For redundancy","A local check sheds obvious abuse with no network hop, while the shared store does the exact accounting for everything that gets past it","It's cheaper","It's simpler to build"],"answer":1,"why":"A client sending 50,000/second doesn't need precise accounting — the local counter can reject it instantly for free, so the flood never reaches Redis at all. The shared store then handles the borderline cases where precision actually matters, which is a nice general pattern: put a cheap approximate filter in front of an expensive exact one, and the expensive one only sees what's worth being exact about."},{"type":"tradeoff_slider","prompt":"You're rate-limiting a free tier where the limit is generous and being slightly over costs you nothing. Slide toward where the counter lives.","leftLabel":"Local per-server (fast, approximate)","rightLabel":"Shared store (exact, adds a hop)","answerRange":[0,40],"why":"If a user occasionally getting 3× a generous free limit costs you nothing, paying a Redis round trip on every request to prevent it is a bad trade — you've added latency and a failure mode to enforce a number that was arbitrary anyway. Contrast a paid quota that maps to real money, where exactness is the product and the hop is worth it. The counter's home follows the cost of being wrong."},{"type":"multiple_choice","prompt":"Where should the rate limiter sit in your stack?","choices":["Deep in the application, after auth and database lookups","As early as possible — at the edge or gateway — so rejected requests consume almost nothing","In the database","In the client"],"answer":1,"why":"The value of a rejection is proportional to how little it cost you, so a limiter that runs after you've parsed a body, authenticated, and hit the database has already spent everything you were trying to save. Push it to the edge and a 429 costs a lookup and a header. Client-side limiting is a courtesy, not a control — anything the client enforces, a hostile or broken client simply won't."},{"type":"multiple_choice","prompt":"What should you limit on — what's the key?","choices":["Always the IP address","It depends: API key or user id when you can identify the caller, IP as a fallback — but IP punishes everyone behind one office NAT","Always the user id","The URL path"],"answer":1,"why":"The key defines who shares a budget, so getting it wrong means either collective punishment or trivial evasion. An authenticated identity is precise — the account is the thing you have a relationship with. IP is the fallback for anonymous traffic and it's blunt: a whole company behind one NAT looks like one abusive client, while a distributed attack looks like thousands of innocent ones."}]},{"id":"rl-4","title":"The hard parts","exercises":[{"type":"multiple_choice","prompt":"You start returning 429s. Clients retry immediately on every 429. What happens?","choices":["The limit works fine","You've created a tighter loop: rejected clients retry instantly, so you now handle MORE requests than before — all of them rejections","The clients give up","Traffic halves"],"answer":1,"why":"Rejecting is cheap but not free, and a client that retries the instant it's refused converts your limit into a busy-loop generator — you're spending real capacity manufacturing 429s. That's why Retry-After and backoff matter: the limit only works if the answer changes the client's behaviour, otherwise you've just made refusing people your main workload."},{"type":"multiple_choice","prompt":"A thousand clients all get rate-limited at 10:00:00 and all obey 'Retry-After: 60'. What happens at 10:01:00?","choices":["Traffic resumes smoothly","All thousand retry in the same instant — a synchronized thundering herd, caused by every client following the rules perfectly","They're rejected again","The limit prevents it"],"answer":1,"why":"Telling everyone the same number makes them agree on the same moment, so obedience produces a spike — the clients did exactly what you asked and that's what hurt you. The fix is jitter: randomize the wait so retries spread across an interval instead of stacking on a boundary. Any time you give many clients an identical instruction about time, you're scheduling a stampede."},{"type":"multi_select","prompt":"Which make a rate limit friendlier to legitimate clients? Select all.","choices":["Returning Retry-After so they know exactly how long to wait","Headers showing limit, remaining, and reset time","Allowing a burst above the sustained rate","Rejecting silently to save bandwidth"],"answer":[0,1,2],"why":"Retry-After, quota headers, and a burst allowance all let a well-built client self-regulate before it ever gets refused — which is what you actually want, since a client that never trips the limit costs you nothing. Silence does the reverse: it forces clients to discover your limit by hitting it, which means guessing, and guessing means retry storms."},{"type":"multiple_choice","prompt":"Your limits are per-endpoint at 1,000/minute each. A client calls 20 endpoints. What did you actually authorize?","choices":["1,000 requests/minute","20,000 requests/minute — per-endpoint limits multiply, so the total was never bounded","It depends on the endpoints","Nothing changes"],"answer":1,"why":"Limits compose by adding up, so a set of individually reasonable per-endpoint budgets can sum to something absurd — you bounded each door and left the building open. If total load is what you care about, you need a limit on the total, and per-endpoint caps then exist for a different purpose: protecting one expensive endpoint from consuming the budget that cheap ones could have shared."},{"type":"multiple_choice","prompt":"One endpoint runs a 30-second report; another returns a cached string in 2ms. Should they share one 'requests per minute' limit?","choices":["Yes — a request is a request","No — counting requests treats those as equal when one costs 15,000× more, so you should weight by cost or limit expensive endpoints separately","Yes, but with a higher limit","No, remove the limit on the fast one"],"answer":1,"why":"A request-count limit is a proxy for load, and it's a good proxy only while requests cost roughly the same — the moment they don't, the number stops describing anything real. A client burning your fleet on reports looks identical to one fetching cached strings. Either weight requests by cost (charging more tokens for expensive ones) or give the expensive endpoint its own much lower limit."},{"type":"multiple_choice","prompt":"A customer complains your limits are 'hostile'. What's the honest counter-argument?","choices":["Limits exist to save us money","Limits are what keep the API available for them: without one, any other client's runaway loop degrades their experience too","Everyone has limits","They should upgrade their plan"],"answer":1,"why":"A limit isn't a restriction on a good client so much as a guarantee to them — it's the mechanism ensuring nobody else's mistake becomes their outage. That's genuinely true and worth saying plainly, provided your limits are actually set to protect capacity rather than to sell upgrades. Which is the real design question: is this number derived from what you can serve, or from what you'd like to charge?"},{"type":"multiple_choice","prompt":"What's the honest summary of rate limiting?","choices":["It's a security feature that stops attacks","It's how you refuse work cheaply so the work you accept stays fast — and it costs you a counter that must live somewhere, a key choice that decides who shares a budget, and clients whose retry behaviour you can influence but not control","It's only needed for public APIs","It slows everyone down equally"],"answer":1,"why":"Rate limiting is admission control: capacity is finite, so something must decide what gets in, and doing it early and explicitly beats discovering it through collapse. Every hard part in this unit came from that counter being state — where it lives, who shares it, what it counts — which is unit 5's question one more time, now standing at your front door."}]}]};

const UNIT18 = {"unitId":"cap-theorem","title":"CAP Theorem","lessons":[{"id":"cap-1","title":"The forced choice","exercises":[{"type":"multiple_choice","prompt":"Two datacenters hold copies of your data. The network link between them fails, but both are alive and users are hitting both. A user writes to datacenter A. What can datacenter B do about it?","choices":["Apply the write immediately","Nothing — it cannot hear about the write, so it must either serve data it knows might be stale, or refuse to answer","Reject the user's write","Ask the user to wait"],"answer":1,"why":"B has no way to learn about A's write while the link is down, so it faces two options and only two: answer with what it has and risk being wrong, or refuse to answer until it can be sure. That fork is the entire content of CAP — it isn't a theory about database vendors, it's what physically remains possible when two machines cannot talk."},{"type":"match_pairs","prompt":"Match each letter of CAP to what it means.","pairs":[{"left":"Consistency","right":"Every read sees the most recent write"},{"left":"Availability","right":"Every request gets a non-error response"},{"left":"Partition tolerance","right":"The system keeps working when the network splits"},{"left":"A partition","right":"Nodes alive, but unable to reach each other"}],"why":"Note that CAP's Consistency is a stricter thing than ACID's C from unit 9 — here it means reads reflect the latest write, not 'your constraints hold'. Same letter, different promise, and conflating them has confused engineers for two decades."},{"type":"multiple_choice","prompt":"CAP is usually taught as 'pick two of three'. Why is that misleading?","choices":["Because you can actually have all three","Because partitions aren't a design choice — networks fail whether you like it or not, so P isn't something you can decline","Because there are really four properties","Because it only applies to NoSQL"],"answer":1,"why":"You can't opt out of the network failing any more than you can opt out of weather, so 'choosing CA' really means 'choosing to have no plan for a partition' — which isn't a design, it's an omission. The honest statement is narrower and more useful: WHEN a partition happens, you must choose between consistency and availability. The rest of the time the question isn't being asked."},{"type":"multiple_choice","prompt":"So what does a 'CA system' actually describe?","choices":["A well-designed distributed system","A single node — no partition is possible when there's nothing to partition from. Distributed systems don't get this option","A system with perfect networking","A system using two-phase commit"],"answer":1,"why":"Partitions are a property of having more than one machine, so the only genuine CA system is one that isn't distributed at all — which is a real and often excellent choice, and it's exactly the single box unit 11 defended. The moment you add a second machine you've bought into P, and with it the choice you now have to make deliberately."},{"type":"fill_blank","prompt":"A network ______ is when nodes are alive but can't reach each other.","choices":["partition","outage","failure","timeout"],"answer":0,"why":"The nodes are healthy and doing their jobs — it's the path between them that's broken, which is what makes it so much nastier than a clean crash. A dead node stops answering; a partitioned node keeps happily answering, with a view of the world that's drifting away from its peers."},{"type":"multiple_choice","prompt":"During a partition, why can't a node just tell whether it's the one that's cut off?","choices":["It can — it checks its network card","It can't: from inside, 'the other node is dead', 'the other node is slow', and 'I am the one who's isolated' all look identical","It asks the load balancer","It checks a timestamp"],"answer":1,"why":"All a node observes is silence, and silence has many causes it cannot distinguish — this is the same undecidable 'dead or just slow?' from units 10 and 12, which is why it keeps reappearing. A partition doesn't announce itself; both sides just notice the other has gone quiet, and each may conclude it's the survivor."}]},{"id":"cap-2","title":"CP: refusing to be wrong","exercises":[{"type":"multiple_choice","prompt":"A partition splits your cluster. You choose consistency. What does a user on the minority side experience?","choices":["Slightly stale data","Errors or timeouts — the system refuses to serve rather than risk answering with data it can't verify","Normal service","Their writes queue up and apply later"],"answer":1,"why":"Choosing consistency means choosing to fail rather than to guess, so a node that can't confirm it has the latest data must decline — and 'decline' is what the user sees as an error. That's the honest shape of CP: the system stays correct by becoming partly unavailable, and the unavailability is the mechanism, not a bug in it."},{"type":"multiple_choice","prompt":"How does a CP system decide which side of a partition may keep serving?","choices":["The bigger machine wins","A quorum — the side holding a majority of nodes can proceed, and the minority steps back, because only one side can hold a majority","Both sides serve","The side with the newest data"],"answer":1,"why":"Majority is the trick that makes it safe: with an odd number of nodes, at most one side of any split can have more than half, so a quorum rule guarantees the two sides can never both believe they're in charge. That's precisely the split-brain from unit 10 being prevented by arithmetic instead of hope — and it's why cluster sizes are odd, since 3 tolerates one failure while 4 tolerates exactly the same one and costs more."},{"type":"multiple_choice","prompt":"5-node cluster, quorum of 3. A partition leaves 3 nodes on one side and 2 on the other. What happens?","choices":["Both sides keep serving","The 3-node side has a majority and continues; the 2-node side must stop accepting writes even though those nodes are perfectly healthy","The whole cluster stops","The 2-node side becomes read-only automatically"],"answer":1,"why":"The minority nodes aren't broken — they're working fine and simply can't prove they aren't missing writes, so they must stand down. This is CP's bargain stated plainly: you deliberately give up capacity that physically exists in order to guarantee no one is served a wrong answer. Users on the minority side are down, and that's the design working."},{"type":"multi_select","prompt":"Which systems should lean CP? Select all.","choices":["A bank ledger","An inventory count during checkout","A distributed lock service","A view counter on a video"],"answer":[0,1,2],"why":"Money, stock, and locks share a property: a wrong answer creates a real-world commitment you can't take back — you've double-spent, oversold, or handed the same lock to two owners. Refusing to answer is recoverable; answering wrongly isn't. A view counter is the opposite, where being briefly wrong costs nothing at all."},{"type":"multiple_choice","prompt":"A distributed lock service goes AP — both sides of a partition keep granting locks. What breaks?","choices":["Nothing significant","Two clients hold 'the same' lock simultaneously, which destroys the only property a lock exists to provide","Locks become slow","Locks expire early"],"answer":1,"why":"A lock's entire value is that exactly one holder exists, so a lock service that stays available during a partition by granting both sides isn't a degraded lock — it's not a lock. This is the clearest case where availability is worthless: an always-available service that doesn't do its job has no reason to exist, which is why lock services are firmly CP and simply go down rather than lie."},{"type":"multiple_choice","prompt":"What's the real cost of choosing CP?","choices":["Slower reads","Downtime for anyone who can't reach a quorum — you've converted a network problem into a visible outage, on purpose","More storage","Data loss"],"answer":1,"why":"CP doesn't make the partition go away, it decides who suffers from it: instead of quiet wrong answers you get loud errors, which are far easier to notice and reason about. That's a genuine feature — a system that fails visibly is one you can respond to — but be clear that you chose an outage, and a user staring at an error doesn't care that it was principled."}]},{"id":"cap-3","title":"AP: answering anyway","exercises":[{"type":"multiple_choice","prompt":"Same partition, but you choose availability. What does the user on the minority side experience?","choices":["An error","A normal response — served from that node's own copy, which may be missing writes that happened on the other side","A long wait, then success","Read-only access"],"answer":1,"why":"AP keeps answering with local knowledge, so nobody sees an error and some people see the past — the failure moves from visible to invisible. That's often exactly right: for a social feed, a comment appearing a few seconds late is nothing, while an error page is a real problem the user will actually notice and resent."},{"type":"multiple_choice","prompt":"During an AP partition, users on both sides edit the same record. The network heals. What now?","choices":["The system picks the correct one automatically","You have two divergent versions and must reconcile them — and there's no universally right answer for which edit should win","Both edits are lost","The later timestamp is always correct"],"answer":1,"why":"AP's bill comes due at healing time: both sides accepted writes in good faith, so you now hold two histories and must merge them with rules you invented. 'Last write wins' is the common choice and it silently discards someone's work — and it leans on clocks from different machines agreeing, which is its own well-known trap."},{"type":"match_pairs","prompt":"Match each conflict resolution strategy.","pairs":[{"left":"Last write wins","right":"Simple — and silently destroys one edit"},{"left":"Keep both versions","right":"Push the choice to the user or app"},{"left":"CRDTs","right":"Structure the data so merges can't conflict"},{"left":"Domain rules","right":"'Add to cart' merges; 'set quantity' doesn't"}],"why":"The choice depends entirely on what the data means, which is why no database can solve it for you. Notice the last row: an operation expressed as 'add this item' merges cleanly from both sides, while the same intent expressed as 'the cart now contains N' cannot — so how you model the write decides whether conflicts are resolvable at all."},{"type":"multiple_choice","prompt":"Why is a shopping cart the classic AP example?","choices":["Carts are small","Amazon reasoned that a customer being unable to add to cart is a lost sale, while a rare merge oddity is a recoverable annoyance — availability was worth more than perfect consistency","Carts don't need consistency","Carts are read-only"],"answer":1,"why":"The reasoning is about business cost rather than technology: refusing an add-to-cart is revenue that vanishes, and a resurrected item is something the customer can just remove at checkout. Notice they didn't abandon consistency everywhere — the actual purchase and payment are far stricter. Different data in the same system gets different answers, because different data has a different cost of being wrong."},{"type":"multi_select","prompt":"Which systems reasonably lean AP? Select all.","choices":["A social media feed","DNS","A 'likes' counter","An account balance shown before a transfer"],"answer":[0,1,2],"why":"Feeds, DNS, and like counts all tolerate being briefly behind — DNS is aggressively AP by design, which is why a record change takes time to propagate and nobody considers that a bug. A balance is different: showing a stale number right before someone commits to a transfer invites a decision they'd not have made, so staleness there has a real cost."},{"type":"multiple_choice","prompt":"What's the real cost of choosing AP?","choices":["Slower writes","Some users act on stale data, and after the partition heals you own a reconciliation problem that no library can decide for you","More servers","Nothing — AP is strictly better for user experience"],"answer":1,"why":"AP trades a visible failure now for a silent divergence you must resolve later, which is genuinely the better trade for a lot of data — and the cost is real and lands somewhere quieter. Nobody gets paged, so the wrongness lives in your data rather than your dashboard, and the merge rules are a design decision you'll be making with tired hands after the incident if you don't make them now."}]},{"id":"cap-4","title":"CAP in the real world","exercises":[{"type":"multiple_choice","prompt":"Your network is healthy — no partition at all. Does CAP say anything about your system right now?","choices":["Yes — you must still pick two","No — CAP only constrains you DURING a partition. With a healthy network you can have both consistency and availability","Yes — consistency is always impossible","It depends on your database"],"answer":1,"why":"CAP is a statement about one specific failure mode, and outside it the theorem is simply silent — which is why 'we're an AP system' as a permanent identity is a category error. The right reading is conditional: when a partition happens, here's what we do. The other 99.9% of the time, that choice isn't being exercised at all."},{"type":"multiple_choice","prompt":"So if CAP is silent when the network is fine, what tradeoff still exists during normal operation?","choices":["None","Latency versus consistency: to be strongly consistent you must coordinate with other nodes, and coordination costs a round trip on every operation","Storage versus speed","Cost versus reliability"],"answer":1,"why":"Confirming you have the latest data means asking someone else, and asking someone else takes time — so strong consistency is bought with latency on the happy path, every single day. This is what PACELC adds to CAP: else (no partition), you're trading Latency against Consistency, which is the tradeoff you actually live with continuously rather than during rare failures."},{"type":"multiple_choice","prompt":"Why does that latency-vs-consistency tradeoff matter more day to day than CAP itself?","choices":["It doesn't — partitions are common","Because partitions are rare while every request pays the coordination cost, so the everyday tradeoff shapes your system far more than the rare one","Because latency is easier to measure","Because consistency is optional"],"answer":1,"why":"You'll meet a partition a handful of times a year and the coordination cost on every request today — so a design chosen entirely around CAP optimizes for the rare case while ignoring the constant one. That's also unit 4's physics reasserting itself: a cross-region quorum means waiting for a machine 150ms away, and no protocol negotiates with the speed of light."},{"type":"tradeoff_slider","prompt":"You're designing 'number of people currently viewing this page'. A partition splits your cluster. Slide toward your choice.","leftLabel":"CP — refuse rather than show a wrong count","rightLabel":"AP — show a possibly-stale count","answerRange":[65,100],"why":"The count is decorative: nobody makes a decision from it, and being off by a few during a partition costs precisely nothing, while an error where a number should be looks broken. This is the whole method — ask what a wrong answer actually costs, and here it costs less than no answer. Run the same question on a bank balance and you'll slide to the opposite end."},{"type":"multiple_choice","prompt":"A vendor says their database is 'CA — no compromises'. What should you conclude?","choices":["It's a breakthrough","It's marketing: either it's a single node, or it silently picks CP or AP during a partition and isn't telling you which","It uses a better algorithm","It's the right choice for everything"],"answer":1,"why":"Nobody has repealed the theorem, so a distributed 'CA' system is one that hasn't told you its behaviour during a partition — and that behaviour exists whether documented or not. The question worth asking a vendor is concrete: during a partition, does the minority side serve reads, and what happens to writes? A good answer is specific; a bad one repeats the marketing."},{"type":"multiple_choice","prompt":"Should one system pick CP or AP for all its data?","choices":["Yes — mixing them is incoherent","No — different data has different costs of being wrong, so the same product can be CP for payments and AP for the activity feed","Yes — the database decides for you","Only large systems can mix"],"answer":1,"why":"CAP applies per operation and per dataset rather than per company, and treating it as an identity forces every piece of data to inherit the strictness that only your money needed. Real systems mix deliberately: strict where a wrong answer creates an irreversible commitment, relaxed where staleness is a shrug — which is the same 'what does being wrong cost?' question that has run through every unit since state."},{"type":"multiple_choice","prompt":"What's the honest summary of CAP?","choices":["Pick two of three","During a partition you must choose between refusing to answer and risking a stale answer — and the rest of the time, the live tradeoff is consistency against latency","Distributed systems can't be consistent","Availability always wins"],"answer":1,"why":"CAP isn't a menu, it's a constraint that activates during a specific failure and forces a choice you'd rather not make — with PACELC's 'else' clause covering the far more common case where you're paying coordination latency instead. What both really say is that the network is a real, physical thing, and any design pretending otherwise is choosing its failure mode by accident."}]}]};

const UNIT19 = {"unitId":"consistency-models","title":"Consistency Models","lessons":[{"id":"cm-1","title":"A promise about reads","exercises":[{"type":"multiple_choice","prompt":"What is a consistency model, at bottom?","choices":["A measure of how reliable a database is","A contract stating which values a read is allowed to return — and therefore which surprises are legal","A setting that makes data more accurate","The number of replicas you keep"],"answer":1,"why":"A consistency model isn't a quality level, it's a specification: it enumerates what a read may legally return, which means it defines exactly which weird outcomes you've agreed to. Reading it as 'stronger is better' misses the point — the model tells you which bugs are impossible and which are your job to handle."},{"type":"multiple_choice","prompt":"Strong consistency: a write completes, and a read immediately after returns the new value. What does that require?","choices":["Fast disks","Coordination — someone must confirm the write is visible before the read can be answered, and that confirmation costs a round trip","More replicas","A single-threaded database"],"answer":1,"why":"To promise a read reflects the latest write, the system must know what the latest write IS — and with more than one machine that means asking, which costs a round trip you cannot optimize away. Strong consistency is therefore not a feature you enable; it's coordination you purchase, on every operation, at the price of the network's physics."},{"type":"multiple_choice","prompt":"Eventual consistency guarantees what, exactly?","choices":["Reads are usually correct","If writes stop, all replicas will converge to the same value — with no promise about how long that takes or what you see meanwhile","Reads are correct within one second","Writes are never lost"],"answer":1,"why":"Read the guarantee carefully: it says only that replicas agree in the end, given a pause in writes — it makes no claim at all about the interval you actually live in. That's why it's such a weak promise dressed in a reassuring word: 'eventually' is unbounded, and in a system that never stops writing, the precondition never arrives."},{"type":"fill_blank","prompt":"______ consistency promises replicas converge if writes stop, but says nothing about what you read in the meantime.","choices":["Eventual","Strong","Causal","Linearizable"],"answer":0,"why":"It's a promise about the destination and not the journey — which is fine when the journey is milliseconds and alarming when it's a partition lasting an hour."},{"type":"multiple_choice","prompt":"Why isn't 'just use strong consistency everywhere' the obvious answer?","choices":["It's not supported by most databases","It costs a coordination round trip on every operation, and during a partition it means refusing to answer — you'd pay latency always and availability sometimes, for data that often doesn't need it","It uses too much storage","It's harder to program"],"answer":1,"why":"Strong consistency has a price on the happy path (unit 18's latency-vs-consistency) and a price on the bad path (refusing service during a partition), and both are charged whether the data needed the guarantee or not. Buying it for a like counter means every like waits on a quorum — you've paid for a promise nobody would have missed."},{"type":"multiple_choice","prompt":"So what's the design question?","choices":["How strong can we afford to be?","What's the weakest model that still keeps the product honest — because the weakest adequate model is the cheapest and most available one","Which model does our database support?","Which is most popular?"],"answer":1,"why":"Every step toward stronger consistency buys you fewer legal surprises and costs latency and availability, so the goal is the least you can get away with rather than the most you can afford. 'Honest' is the bar: the model is adequate when no anomaly it permits would mislead a user into a decision they'd regret."}]},{"id":"cm-2","title":"The useful middle","exercises":[{"type":"multiple_choice","prompt":"A user posts a comment, then refreshes — and their own comment is gone. Which guarantee were they expecting?","choices":["Strong consistency","Read-your-writes: you always see your own writes, even if others see them later","Eventual consistency","Monotonic reads"],"answer":1,"why":"They don't need to see everyone's comments instantly — they need to see THEIR OWN, because they know they wrote it and its absence looks like data loss. Read-your-writes is exactly that narrow promise, and it's much cheaper than strong consistency: route that user's reads to a replica that has their write, and everyone else can lag freely."},{"type":"match_pairs","prompt":"Match each guarantee to the anomaly it forbids.","pairs":[{"left":"Read-your-writes","right":"Your own write vanishing after you make it"},{"left":"Monotonic reads","right":"Time appearing to run backwards on refresh"},{"left":"Consistent prefix","right":"Seeing an answer before the question"},{"left":"Strong consistency","right":"Every anomaly above, at coordination cost"}],"why":"Each middle guarantee names one specific way reality can look broken and forbids just that one — which is why they're useful. You buy the narrow promise your product actually needs instead of the total order you can't afford, and you get most of the felt correctness for a fraction of the cost."},{"type":"multiple_choice","prompt":"Two refreshes: the first shows a new message, the second doesn't. Which guarantee is missing?","choices":["Read-your-writes","Monotonic reads — successive reads should never move backwards in time for one user","Consistent prefix","Strong consistency"],"answer":1,"why":"Two reads landed on replicas with different lag, so the second answered from an older state — the data was never corrupt, the user just time-travelled. Monotonic reads forbids that specific insult, and the usual mechanism is routing each user's reads to a consistent replica so their view only ever advances (with the caveat from unit 10 that re-pinning can break it)."},{"type":"multiple_choice","prompt":"A chat shows a reply before the message it replies to. Which guarantee is missing?","choices":["Monotonic reads","Consistent prefix / causal consistency — writes that caused each other must appear in that order","Read-your-writes","Eventual consistency"],"answer":1,"why":"Nobody needs a global order of every message in the world — they need effects to follow their causes, because a reply arriving before its question isn't stale, it's nonsense. Causal consistency preserves exactly the ordering that carries meaning and leaves genuinely unrelated writes free to arrive in any order, which is why it's often the sweet spot for anything conversational."},{"type":"multiple_choice","prompt":"Why is causal consistency so much cheaper than strong consistency?","choices":["It uses fewer replicas","It only orders writes that are actually related, leaving unrelated writes to be applied in any order — so most operations need no global agreement","It's approximate","It skips durability"],"answer":1,"why":"Strong consistency insists every write take a place in one global sequence, which means everyone agreeing about everything, all the time. Causal only insists that a write which depended on another comes after it — and in a system with millions of unrelated users, almost nothing is causally related, so almost nothing needs coordinating."},{"type":"multiple_choice","prompt":"Your product needs users to see their own edits instantly, but is fine if other users see them a second later. What should you buy?","choices":["Strong consistency everywhere","Read-your-writes for the author, eventual for everyone else — that's the actual requirement, precisely stated","Causal consistency","No guarantees"],"answer":1,"why":"Stating the requirement exactly reveals how narrow it is: one person needs to see one thing immediately, and the entire rest of the world can lag. Strong consistency would satisfy that requirement and charge everyone a quorum for it. Most 'we need strong consistency' claims dissolve like this once someone writes down who actually needs to see what, and when."}]},{"id":"cm-3","title":"Reading the complaint","exercises":[{"type":"multiple_choice","prompt":"A user says 'I changed my profile photo and it still shows the old one, but my friend can see the new one.' Diagnosis?","choices":["The upload failed","Read-your-writes is missing for this user — their read is hitting a replica that lags behind their own write","The cache is broken","Strong consistency is needed"],"answer":1,"why":"The detail that identifies it is that the friend CAN see it — the write clearly succeeded and propagated, so nothing is broken except which replica the author's own read landed on. Notice the bug is defined by whose read it is rather than by the data, which is exactly why the fix is routing rather than a stronger database."},{"type":"multiple_choice","prompt":"A user deletes a photo, gets confirmation, and it reappears in their feed ten minutes later. What likely happened?","choices":["The delete failed","The delete and a stale cached copy raced — or a replica that never learned about the delete served it back","The photo was restored from backup","The user misremembers"],"answer":1,"why":"The resurrection of deleted data is a classic and it's usually a copy that never heard the news — a cache entry, a lagging replica, or a search index that indexed before the delete and was never told. Deletes are the nastiest case for derived copies because absence propagates badly: a copy holding stale data looks identical to a copy holding data that's supposed to exist."},{"type":"multi_select","prompt":"A user reports 'the site shows me old data sometimes.' Which could cause it? Select all.","choices":["Replication lag on a read replica","A CDN or browser cache serving a stale copy","A search index that hasn't been updated yet","A slow database query"],"answer":[0,1,2],"why":"Every copy is a chance to be behind — replicas, caches, and derived indexes are all the same shape of problem wearing different names, which is why 'stale data' incidents so often involve hunting the layer responsible. A slow query is different: it returns the RIGHT answer, late. Stale means wrong-but-fast; slow means right-but-late, and they need opposite fixes."},{"type":"multiple_choice","prompt":"Why is 'eventually consistent' a bad answer to give a user or a product manager?","choices":["It's too technical","Because it names the mechanism, not the promise — the honest version states a bound: 'usually under a second, and here's what you'll see meanwhile'","It's inaccurate","It sounds negative"],"answer":1,"why":"'Eventually' describes what the database guarantees and answers nothing anyone actually asked — how long, and what does it look like in the gap? Users and product owners can reason about 'up to two seconds, and you always see your own changes immediately'. Turning the mechanism into a stated bound with an observable behaviour is what makes the tradeoff decidable rather than mystical."},{"type":"multiple_choice","prompt":"Your team says 'we need strong consistency.' What's the first question to ask?","choices":["Which database supports it?","Which read, by whom, must reflect which write — and what would actually go wrong if it were two seconds late?","How many replicas do we need?","What's our budget?"],"answer":1,"why":"'We need strong consistency' is almost always a feeling standing in for a specific fear, and naming the fear usually shrinks it — often to read-your-writes for one user on one screen. And if the honest answer to 'what goes wrong?' is a real, irreversible loss, then you've justified the coordination cost with evidence instead of anxiety."},{"type":"multiple_choice","prompt":"Which of these complaints is NOT a consistency problem?","choices":["'My comment disappeared after posting'","'The page took 8 seconds to load'","'The like count went down when I refreshed'","'I see a reply to a message I can't see'"],"answer":1,"why":"A slow page is a latency problem — the answer would have been correct, it just took too long, which is unit 4's territory and needs completely different tools. The other three are all correct-data-arriving-in-a-surprising-order: read-your-writes, monotonic reads, and causal consistency respectively. Diagnosing which family you're in is the whole first move."}]},{"id":"cm-4","title":"Choosing a model","exercises":[{"type":"multiple_choice","prompt":"Quorum reads and writes: N=3 replicas, W=2, R=2. Why does that give you the latest value?","choices":["Because 2 is a majority","Because W + R > N forces the read set and the write set to overlap by at least one replica — so at least one node you read from saw the write","Because writes are ordered","Because replicas sync in the background"],"answer":1,"why":"It's pigeonhole arithmetic rather than magic: if you wrote to 2 of 3 and read from 2 of 3, the two sets cannot be disjoint, so at least one replica you asked holds the newest value. That's the whole trick behind tunable consistency — W+R>N buys strong reads, and dropping below it trades that guarantee for lower latency and better availability, on purpose."},{"type":"multiple_choice","prompt":"Same 3 replicas, but W=1 and R=1. What did you buy and lose?","choices":["Nothing changes","Fast writes and fast reads that stay available if replicas are down — and no overlap guarantee, so a read can easily miss the newest write","Stronger consistency","Better durability"],"answer":1,"why":"W+R = 2, which isn't greater than 3, so the sets can miss each other entirely and you're squarely in eventual consistency. What you got in exchange is real: one replica is enough to serve, so writes and reads are fast and survive two nodes being down. That dial is the CAP tradeoff exposed as a config knob, and it's per-query in some systems — strict for a payment, loose for a feed."},{"type":"tradeoff_slider","prompt":"You're designing 'items remaining in stock' shown during checkout for a limited product drop. Slide toward your model.","leftLabel":"Strong (coordinate; slower, can refuse)","rightLabel":"Eventual (fast, may oversell)","answerRange":[0,35],"why":"Overselling a limited drop is a real-world commitment you cannot take back — you take money for something that doesn't exist and then apologize to strangers. Coordination on the decrement is worth the latency here, precisely because the wrong answer creates an obligation. Contrast the same number on a browsing page, where stale stock costs nothing: the data is identical and the cost of being wrong is not."},{"type":"multiple_choice","prompt":"Someone proposes 'use timestamps — the newest write wins.' What's the flaw?","choices":["Timestamps are too large","Different machines' clocks disagree, so 'newest' depends on whose clock you believe — and a skewed clock can silently discard a genuinely later write","Timestamps are slow to compare","It's actually fine"],"answer":1,"why":"Last-write-wins quietly assumes a shared global clock, and there isn't one — clocks drift, get corrected, and disagree by more than the interval between two writes. A machine running slightly fast can stamp a write far in the future and win every conflict for hours. This is why serious systems use logical clocks or version vectors, which order events by causality instead of trusting a wall clock nobody agrees on."},{"type":"multiple_choice","prompt":"Can one product use several consistency models at once?","choices":["No — it must pick one","Yes, and it should: payments strong, profile edits read-your-writes, feeds eventual — each dataset gets the weakest model that keeps it honest","Only with multiple databases","Only at very large scale"],"answer":1,"why":"Consistency is a property of an operation on a piece of data, not a badge worn by a company — so forcing one model everywhere means either overpaying for your feed or under-protecting your money. Mixing deliberately is the mature position, and the work is knowing which data is which, which is a product question rather than a database one."},{"type":"multiple_choice","prompt":"What's the honest summary of consistency models?","choices":["Stronger is better; use the strongest you can afford","They're contracts about what a read may return: stronger forbids more surprises and costs coordination, so pick the weakest model that keeps the product honest — per dataset, not per company","Eventual consistency is always sufficient","It's the database's decision"],"answer":1,"why":"Every model is a deal — fewer legal surprises in exchange for latency and availability — and 'strongest affordable' is the wrong instinct because it pays for guarantees nobody would have missed. This is the same question the course has asked since unit 5, now with formal names: you have copies, copies can disagree, and the model is you deciding exactly how much disagreement is allowed to reach a user."}]}]};

const UNIT20 = {"unitId":"consensus","title":"Consensus & Leader Election","lessons":[{"id":"cons-1","title":"Why agreeing is hard","exercises":[{"type":"multiple_choice","prompt":"Five servers must agree on one value: who is the leader. Why can't they just vote and be done?","choices":["Voting is slow","Messages can be lost, delayed, or arrive out of order — so a node that hears nothing can't tell whether a vote was never sent, or sent and lost, or is still in flight","Servers can't send messages","They'd need a database"],"answer":1,"why":"Voting is trivial when everyone reliably hears everyone; the difficulty is that the network gives you no such promise, and silence is ambiguous. A node observing nothing cannot distinguish a dead peer from a slow one from a lost message — which is unit 10's 'dead or just slow?' being the fundamental obstacle rather than an annoyance."},{"type":"multiple_choice","prompt":"Why does 'just add a timeout' not solve it?","choices":["Timeouts are unreliable code","A timeout converts 'I don't know' into a guess: too short and you declare a healthy node dead, too long and you stay stuck — the uncertainty doesn't go away, you just pick which way to be wrong","Timeouts are too slow","It does solve it"],"answer":1,"why":"A timeout is a decision procedure for an undecidable question, so it doesn't remove the ambiguity — it converts it into a configurable error. This is the same shape as the failover timeout from unit 10 and the health check interval from unit 12, which is the point: these aren't three problems, they're one problem you keep meeting."},{"type":"fill_blank","prompt":"______ is the problem of getting multiple machines to agree on a single value despite failures.","choices":["Consensus","Replication","Sharding","Partitioning"],"answer":0,"why":"One value, many machines, an unreliable network — and everyone must end up believing the same thing, or the disagreement becomes corruption."},{"type":"multiple_choice","prompt":"What goes wrong if two nodes both believe they're the leader?","choices":["Nothing — more leaders means more capacity","Both accept writes, producing two divergent histories with no principled way to merge them — split brain","They negotiate automatically","The slower one gives up"],"answer":1,"why":"This is unit 10's split brain, and it's the failure consensus exists to prevent: two authorities means two truths, and truths that diverged independently can't be reconciled by any rule you invent afterwards. Note it's worse than an outage — an outage stops and recovers, whereas divergence silently corrupts and you find out later."},{"type":"multi_select","prompt":"What must a consensus algorithm guarantee? Select all.","choices":["Agreement — no two nodes decide different values","Validity — the decided value was actually proposed by someone","Termination — it eventually decides, provided enough nodes are up and can communicate","That it always decides quickly, no matter what"],"answer":[0,1,2],"why":"Agreement, validity, and eventual termination are what these algorithms actually promise. Speed is not on the list, and can't be: the FLP result says that with even one possible failure and no timing assumptions, no algorithm can guarantee it always terminates — which is why real systems lean on timeouts and accept 'usually fast, occasionally stalls' as the honest deal."},{"type":"multiple_choice","prompt":"So why is 'agreement' the property worth paying for?","choices":["It makes the system faster","Because disagreement isn't a delay — it's divergent state that no later process can repair, so preventing it is worth waiting for","It reduces storage","It simplifies the code"],"answer":1,"why":"A stalled decision costs you time and resolves; a wrong decision costs you your data's integrity and doesn't. That asymmetry justifies the entire expense of consensus — you're buying the impossibility of a failure that has no cleanup, using a currency (latency) that you can recover from."}]},{"id":"cons-2","title":"Majorities","exercises":[{"type":"multiple_choice","prompt":"5 nodes. A rule says a decision needs 3 votes. A partition splits them 3 and 2. Why can't both sides decide?","choices":["They coordinate across the partition","Only one side can hold 3 of 5 — two disjoint groups cannot both contain a majority, so at most one side can ever proceed","The bigger side is faster","The rule is enforced by a coordinator"],"answer":1,"why":"It's arithmetic doing the safety work: two groups that don't overlap can't both have more than half, so the majority rule makes two simultaneous leaders impossible rather than unlikely. That's the crucial word — impossible. The 2-node side isn't trusted to behave; it's mathematically unable to gather the votes."},{"type":"multiple_choice","prompt":"Why do consensus clusters use odd numbers of nodes — 3, 5, 7?","choices":["Odd numbers are faster","4 nodes need 3 for a majority, exactly like 3 nodes do — so the 4th node adds cost and tolerates no additional failure","Even numbers can't form a majority","It's a convention"],"answer":1,"why":"Majority of 3 is 2, so 3 nodes survive 1 failure; majority of 4 is 3, so 4 nodes also survive only 1. You paid for another machine and bought exactly nothing in fault tolerance — and gave yourself one more thing that can break. Going 3 → 5 is what buys the second failure, which is why cluster sizes step by twos."},{"type":"estimate","prompt":"A consensus cluster has 7 nodes. How many can fail while the cluster still makes progress?","answer":3,"tolerance":0,"unit":"nodes","why":"Majority of 7 is 4, so as long as 4 remain you have a quorum — meaning 3 can fail. The general rule is that 2f+1 nodes tolerate f failures, which is why 3 tolerates 1 and 5 tolerates 2."},{"type":"multiple_choice","prompt":"Why does a majority quorum guarantee the new leader has all committed writes?","choices":["The leader keeps a backup","A write is only committed once a majority stored it, and any new leader must be elected by a majority — those two majorities must overlap, so someone in the electing group has the write","Writes are broadcast to everyone","The old leader hands over its log"],"answer":1,"why":"It's the same pigeonhole argument as unit 19's W+R>N: two majorities of the same set always share at least one member, so the electing quorum necessarily contains a node that saw every committed write. That's why committed data survives a leader dying — not because anyone hands it over, but because it was impossible for a majority to have missed it."},{"type":"multiple_choice","prompt":"Your 5-node cluster is split into 2 and 2 and 1 by a network fault. What happens?","choices":["The largest group leads","Nobody has a majority, so the cluster makes no progress at all — it stays consistent by being entirely unavailable","The nodes merge automatically","A random group is elected"],"answer":1,"why":"No group of 2 or 1 can reach 3, so nobody can be elected and nothing can be committed — the cluster is fully down while every node is perfectly healthy. That is CP behaving exactly as designed: it chose consistency, and this is what choosing consistency costs on a bad day. A system that stayed up here would be a system willing to fork its own history."},{"type":"multiple_choice","prompt":"Is a majority quorum protecting you from nodes that lie or send corrupted messages?","choices":["Yes — that's what voting does","No — algorithms like Raft assume nodes may crash or be unreachable, but not that they actively lie; surviving liars is Byzantine fault tolerance, which is far more expensive","Yes, if you use enough nodes","Only with encryption"],"answer":1,"why":"The failure model matters as much as the algorithm: Raft and Paxos handle crash-stop faults, where a node either works correctly or stops, and that assumption is what makes them affordable. Tolerating malicious or arbitrarily buggy nodes needs Byzantine protocols with more nodes and more rounds — which is why they show up in blockchains, where participants genuinely aren't trusted, and almost never inside your own datacenter."}]},{"id":"cons-3","title":"Electing a leader","exercises":[{"type":"multiple_choice","prompt":"Why elect a single leader at all, if consensus can decide any value?","choices":["Leaders are faster machines","Because running full consensus for every operation is expensive — elect once, and then one node can sequence writes cheaply until it fails","It's required by the network","To reduce storage"],"answer":1,"why":"Consensus is the expensive part, so you spend it rarely — on 'who decides?' — and then the leader orders operations by itself, turning per-write agreement into per-write replication. This is unit 10's single-leader design earning its keep: one writer removes conflicts by construction, and now you know how the leader gets chosen safely."},{"type":"order_steps","prompt":"Order a Raft-style leader election.","steps":["Followers hear nothing from the leader for a timeout","One follower becomes a candidate and increments the term","It requests votes from every other node","Nodes grant a vote if they haven't already voted in that term","With a majority, the candidate becomes leader and starts sending heartbeats"],"why":"Silence starts it, a term number labels the attempt, and a majority ends it. The heartbeat is what keeps the peace: as long as followers hear from the leader they never start an election, so the leader's continued existence is asserted continuously rather than assumed."},{"type":"multiple_choice","prompt":"What is the 'term' number actually doing?","choices":["Counting how long the leader has served","Acting as a logical clock: each election gets a higher term, so any message from an older term is recognisably stale and rejected","Measuring network latency","Numbering the log entries"],"answer":1,"why":"Terms give you an ordering of leadership epochs without needing a wall clock anyone agrees on — the exact problem unit 19 flagged with last-write-wins. A deposed leader that wakes up still believing it's in charge is carrying an old term number, so every node it contacts can tell instantly that it's behind and refuse it."},{"type":"multiple_choice","prompt":"Two candidates start elections simultaneously and split the vote — nobody gets a majority. What stops this repeating forever?","choices":["The cluster restarts","Randomized election timeouts — each node waits a different random interval, so one almost always starts first next round and wins uncontested","The lowest node id wins","They take turns"],"answer":1,"why":"Identical timeouts make nodes act in unison, which is exactly what causes repeated split votes — the same synchronization trap as unit 17's clients all obeying one Retry-After. Randomizing breaks the symmetry cheaply: someone times out first, requests votes while everyone else is still waiting, and the round resolves."},{"type":"multiple_choice","prompt":"A leader is deposed while paused, but doesn't know it. It wakes up and writes to shared storage. How do you stop it corrupting data?","choices":["Trust its heartbeat","Fencing tokens: every leader gets a monotonically increasing number, storage remembers the highest it has seen, and a write carrying an older token is rejected","Kill the process first","Use a longer timeout"],"answer":1,"why":"You can't prevent a paused leader from waking up and acting, so the protection must live at the resource rather than rely on the leader behaving. Fencing makes the storage itself the arbiter: it has seen token 6, so a write stamped 5 is provably from a deposed leader and gets refused. This is unit 10's fencing made concrete — and note the resource must participate, since a lock service alone cannot stop a client that's stopped listening."},{"type":"multiple_choice","prompt":"During an election, what happens to writes?","choices":["They're served by followers","They stop — there's no leader to sequence them, so the system is unavailable for writes until one is elected","They queue on the old leader","They're rejected permanently"],"answer":1,"why":"No leader means nobody may order writes, so an election is a small planned outage measured in the election timeout — typically hundreds of milliseconds to seconds. That's the price of single-leader safety, and it's why timeout tuning is a real tradeoff: shorter means faster recovery and more spurious elections during blips, longer means fewer false alarms and a longer write outage when a leader genuinely dies."}]},{"id":"cons-4","title":"When you actually need it","exercises":[{"type":"multiple_choice","prompt":"Your team proposes implementing Raft in-house for a service that needs leader election. Reaction?","choices":["Good — it's a well-documented algorithm","Don't: consensus is notoriously hard to get right, and the failure mode is silent corruption discovered later. Use etcd, ZooKeeper, or your database's built-in election","Only if you have 5 nodes","Fine, if you write tests"],"answer":1,"why":"Raft is understandable to read and brutal to implement correctly, because the bugs live in rare interleavings — a node pausing at exactly the wrong moment, a message arriving after you assumed it couldn't. Those don't show up in tests; they show up as divergent data in production months later. Mature implementations have absorbed years of exactly those, which is what you're actually buying."},{"type":"multi_select","prompt":"Which genuinely need consensus? Select all.","choices":["Deciding which database replica is the leader","Distributed locks that must never be held twice","Cluster membership and configuration","Counting page views"],"answer":[0,1,2],"why":"Leadership, locks, and membership share one property: two different answers is a catastrophe, so paying for agreement is worth it. Page views are the opposite — a count that's briefly off by three costs nothing, so coordinating every increment would buy a guarantee nobody needed. The test is simply whether disagreement corrupts something or merely annoys someone."},{"type":"multiple_choice","prompt":"Why is running consensus across regions usually a bad idea?","choices":["Regions can't communicate","Every decision needs a majority to reply, so a cross-region quorum means every write waits on a round trip of ~100ms or more — the speed of light becomes your write latency","It's not supported","Regions have different clocks"],"answer":1,"why":"Consensus is round trips, and a round trip across the planet is unit 4's physics rather than a tuning problem — a cross-continent quorum makes every write cost hundreds of milliseconds, forever. That's why most systems keep the consensus group inside one region and replicate asynchronously across them, accepting the failure modes of unit 10 in exchange for writes that don't wait on an ocean."},{"type":"tradeoff_slider","prompt":"You need a distributed lock so only one worker runs a nightly job. Slide toward your approach.","leftLabel":"Real consensus service (etcd/ZooKeeper)","rightLabel":"A row in your existing database","answerRange":[55,100],"why":"For one nightly job, a conditional insert or update in the database you already run gives you mutual exclusion with a component you already operate — and if two workers ever both ran, you'd rerun a job rather than lose money. Reach for a dedicated consensus service when the lock protects something where double-execution is genuinely unacceptable, and you're willing to run and understand another distributed system to get it."},{"type":"multiple_choice","prompt":"You use a lock service, and it says you hold the lock. Is it safe to write?","choices":["Yes — that's what the lock means","Not by itself: you might be paused and the lease expired without you noticing, so safety needs a fencing token the storage checks — the lock alone can't stop a client that's stopped listening","Yes, if the lock is fresh","Only if the lock service is CP"],"answer":1,"why":"A lock is a lease, and a lease expires on the service's clock rather than yours — so a long garbage-collection pause can leave you holding an expired lock while feeling certain. This is the famous gap: correctness has to be enforced where the write lands, via a fencing token, because no amount of asking the lock service can tell you whether you were frozen since you last asked."},{"type":"multiple_choice","prompt":"What's the honest summary of consensus?","choices":["It's how distributed systems stay fast","It's the expensive machinery that makes disagreement impossible rather than unlikely — so use it for the few decisions where two answers is a catastrophe, run it inside one region, and don't implement it yourself","It's only needed for blockchains","It removes the need for replication"],"answer":1,"why":"Consensus buys you the one thing nothing else can — a decision that cannot fork — and charges round trips and unavailability when a majority is unreachable. Everything in this unit followed from the same fact you met in unit 10 and again in 18: you cannot tell dead from slow, so agreement must be constructed from majorities rather than assumed from silence."}]}]};
