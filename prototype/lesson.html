const UNIT7 = {"unitId":"sql-vs-nosql","title":"SQL vs NoSQL","subtitle":"Not a war — a set of tradeoffs, and what each one gave up","lessons":[{"id":"nosql-1","title":"What NoSQL actually means","exercises":[{"id":"nosql-1-0","type":"concept","title":"\"NoSQL\" names what these databases aren't, which is why it explains nothing","body":"It expands to *not only SQL* — a label defined by absence. The name came from a 2009 meetup, not a design principle, and it was stretched over four unrelated families: key-value, document, wide-column, graph. They share no data model, no query language, no guarantees. Each gave up part of the relational model to buy something else.","note":"Several then added SQL back once users missed it — Cassandra's query language is called `CQL` and reads almost exactly like SQL. The name outlived the claim."},{"id":"nosql-1-1","type":"multiple_choice","prompt":"What does 'NoSQL' actually mean?","choices":["Databases with no query language at all","'Not only SQL' — an umbrella for non-relational databases that made different tradeoffs","Databases that are always faster than SQL ones","Databases that have no schema"],"answer":1,"why":"NoSQL isn't an anti-SQL movement — it's a loose family of stores that gave up parts of the relational model to get something else, usually easier horizontal scaling or a more natural data shape. The name is genuinely terrible and has fuelled a decade of confused arguments: plenty of 'NoSQL' databases have rich query languages, and some now literally speak SQL. The useful question is never 'SQL or NoSQL' — it's *what did this database give up, and what did it buy with it?*"},{"id":"nosql-1-2","type":"multiple_choice","prompt":"Is NoSQL inherently faster than a relational database?","choices":["Yes — it's newer and better engineered","No — it's faster at certain access patterns because it does less: no joins, no cross-node transactions, fewer guarantees","No — it's actually always slower","They're identical in performance"],"answer":1,"why":"Speed here isn't magic, it's subtraction: a key-value store is blisteringly fast at 'give me the value at this key' precisely because that's all it promises to do. Generalize the instinct — whenever one system is dramatically faster than another at a similar task, ask what it stopped promising. Performance almost always comes from removing a guarantee rather than writing better code, and that question will serve you for your whole career."},{"id":"nosql-1-3","type":"multiple_choice","prompt":"A document database is often called 'schemaless'. So where did the schema go?","choices":["There genuinely isn't one — the data has no shape","Into your application code — every reader must now handle every historical shape of the data","Into the operating system","It's generated automatically at runtime"],"answer":1,"why":"Your data always has a shape — 'schemaless' only means the database stopped enforcing it, so the enforcement moved into your code where it's optional and easy to forget. The real terms are *schema-on-write* (SQL: the database rejects malformed data at insert) versus *schema-on-read* (accept anything; readers cope). Schema-on-read feels liberating in month one and painful in year three, when one collection holds five generations of shape and every reader needs branches for all of them."},{"id":"nosql-1-4","type":"fill_blank","prompt":"SQL enforces the shape of data when you ______; many NoSQL stores leave it to be interpreted when you read.","choices":["write","delete","connect","backup"],"answer":0,"why":"Schema-on-write catches bad data at the door, before it's stored. Schema-on-read lets it in and makes every future reader deal with it."},{"id":"nosql-1-5","type":"multi_select","prompt":"Which of these are TRUE of relational databases? Select all.","choices":["They enforce structure and relationships for you","They're built around joining normalized tables","They cannot handle large scale under any circumstances","They give strong transactional guarantees"],"answer":[0,1,3],"why":"Structure, joins, and strong transactions are real; 'can't handle scale' is the myth — a single well-tuned Postgres routinely serves workloads far beyond what most companies ever reach. This myth has cost the industry enormous pain: teams adopt a distributed NoSQL store at 5,000 users to prepare for a scale they never hit, and pay the cost of losing joins and transactions every single day in between."},{"id":"nosql-1-6","type":"multiple_choice","prompt":"So what's the genuinely useful question when picking a database?","choices":["Is it SQL or NoSQL?","What will I ask of this data, what must never be wrong, and what does this database give up?","Which one is newest?","Which one does my favourite company use?"],"answer":1,"why":"Access patterns and required guarantees decide the answer — the SQL/NoSQL label is a category, not a decision. Notice the question doesn't mention a single product name: if you can't answer it, no amount of benchmarking will save you, because you'll just pick fast software that's wrong for your problem."}]},{"id":"nosql-2","title":"The four families","exercises":[{"id":"nosql-2-0","type":"concept","title":"Pick the family by how you'll ask for the data, not by what the data is","viz":{"nodes":[{"id":"q","label":"How will you ask?","col":0},{"id":"kv","label":"Key-value","sub":"by one key","col":1,"kind":"db"},{"id":"doc","label":"Document","sub":"whole record","col":1,"kind":"db"},{"id":"wc","label":"Wide-column","sub":"by partition","col":1,"kind":"db"},{"id":"g","label":"Graph","sub":"by hops","col":1,"kind":"db"}],"edges":[{"from":"q","to":"kv"},{"from":"q","to":"doc"},{"from":"q","to":"wc"},{"from":"q","to":"g"}]},"body":"Four families, four questions they're fast at. *Key-value*: you know the exact key and will never ask anything else. *Document*: you want one whole self-contained record, and records needn't match each other. *Wide-column*: colossal tables, always entered through a partition key. *Graph*: your question is about the connections themselves.","note":"Each family is fast at one access pattern and clumsy at every other. Ask a key-value store which of its values mention Berlin and it has nothing to offer but reading every key it holds. The narrowness *is* the speed."},{"id":"nosql-2-1","type":"match_pairs","prompt":"Match each NoSQL family to the shape it's built for.","pairs":[{"left":"Key-value (Redis, DynamoDB)","right":"Get/put a value by one key"},{"left":"Document (MongoDB)","right":"Self-contained JSON documents"},{"left":"Wide-column (Cassandra)","right":"Huge tables, queried by partition key"},{"left":"Graph (Neo4j)","right":"The relationships ARE the data"}],"why":"'NoSQL' isn't one thing — it's four very different answers to four very different problems, and lumping them together is most of why the debate is so muddled. These families have less in common with each other than any of them has with Postgres: a graph database and a key-value store are about as similar as a spreadsheet and a hammer, sharing a name only because of a marketing accident."},{"id":"nosql-2-2","type":"multiple_choice","prompt":"You need to store user sessions: looked up only by session id, never queried any other way. Which shape fits?","choices":["Key-value","Graph","Wide-column","Relational with 6 tables"],"answer":0,"why":"One access pattern, one key — a key-value store does exactly this and nothing else, which is why it's so fast at it. Don't buy a relational engine to do a hashmap's job: this is the cleanest, least controversial NoSQL win there is, because when your access pattern really is 'get the thing at this key', everything else is overhead."},{"id":"nosql-2-3","type":"build_diagram","prompt":"Sessions are read millions of times a second by one key, and can be rebuilt if lost. Add the right store, keeping Postgres as the source of truth.","viz":{"nodes":[{"id":"a","label":"App Servers","col":0,"kind":"server"},{"id":"h","col":1,"hole":true},{"id":"p","label":"Postgres","sub":"source of truth","col":2,"kind":"db"}],"edges":[{"from":"a","to":"h"},{"from":"h","to":"p"}]},"palette":["Redis (key-value)","Neo4j (graph)","A second Postgres"],"answer":{"h":"Redis (key-value)"},"why":"Sessions are a single-key, rebuildable, extremely hot access pattern — exactly a key-value store's job — so Postgres keeps the durable truth while Redis absorbs the volume. Notice you didn't choose SQL OR NoSQL; you used both, each for what it's good at. That's polyglot persistence, and it's what most real systems actually look like: the question was never either/or."},{"id":"nosql-2-4","type":"multiple_choice","prompt":"You're storing a product catalog where every type has wildly different attributes — a book has an author, a shirt has a size, a laptop has RAM. Which fits most naturally?","choices":["Key-value","Document","Graph","One relational table with 200 mostly-null columns"],"answer":1,"why":"Documents are self-contained and can legitimately differ in shape from each other, which is exactly what a heterogeneous catalog is. This is the strongest honest case for document stores: varied, self-contained entities you fetch whole. But be clear-eyed about the cost you just accepted — nothing now guarantees that shirts have sizes, and that check moved into your code, forever."},{"id":"nosql-2-5","type":"multiple_choice","prompt":"You need 'friends of friends who like X, within 3 hops.' In SQL that's a self-join per hop. What's built for this?","choices":["Key-value","Document","Graph","Wide-column"],"answer":2,"why":"Graph databases store relationships as first-class citizens, so traversals don't explode into ever-deeper joins as you add hops. The tell for a graph problem: your queries are about the CONNECTIONS rather than the entities. If you find yourself joining a table to itself repeatedly and adding a level each time the product team asks for one more hop, you may have a graph problem wearing a relational costume."},{"id":"nosql-2-6","type":"multiple_choice","prompt":"Cassandra can absorb enormous write volume across many nodes. What's the catch?","choices":["There isn't one — it's strictly better","You must know your query patterns up front: tables are designed around the partition key, and ad-hoc queries are painful or impossible","It can't actually write quickly","It only works on one machine"],"answer":1,"why":"Wide-column stores buy their scale by making you commit to your access patterns in advance — the table is shaped around the query, so a new question can mean a new table. This is the trade in its purest form: Cassandra will happily take a million writes a second across a hundred nodes, but the day a product manager asks a question you didn't design for, the answer may genuinely be 'we'd have to rewrite how the data is stored'."}]},{"id":"nosql-3","title":"Model the data vs model the queries","exercises":[{"id":"nosql-3-0","type":"concept","title":"The join is an escape hatch, and most NoSQL stores don't have one","body":"A relational database normalizes: each fact once, and a `JOIN` assembles it into whatever answer you ask for — including answers to questions nobody has thought of yet. The join is the escape hatch. Most NoSQL stores don't have one. Take away the ability to assemble at read time and something has to happen at write time instead.","note":"Storing a fact in more than one place, on purpose, has a name: *denormalization*. It isn't sloppiness — it's the only way to answer a question you can't assemble at read time. The design turns on doing it deliberately."},{"id":"nosql-3-1","type":"multiple_choice","prompt":"What's the deepest difference between relational and most NoSQL modeling?","choices":["The syntax you type","SQL: model the data correctly, then query it however you like later. NoSQL: model your queries first, then shape the storage to serve them","How fast they read from disk","One uses JSON and one doesn't"],"answer":1,"why":"This is the actual mental shift and the thing people get wrong: relational lets you decide the questions later, while most NoSQL requires you to decide them first. In relational, normalize now and you can still answer questions you haven't thought of yet — the join is your escape hatch. In NoSQL you often can't join, so you must know the questions in advance and physically store the answers in the shape you'll read them."},{"id":"nosql-3-2","type":"multiple_choice","prompt":"In DynamoDB you can't join. To show an order together with its customer's name, what do you typically do?","choices":["Run two queries and join in your app","Duplicate the customer's name into the order record itself","Give up and use SQL","Store a pointer and follow it"],"answer":1,"why":"You store the answer, not the ingredients: the order record carries the customer name so one read returns everything the screen needs. That's denormalization — it makes reads a single fast lookup, but the name now lives in two places, which is exactly unit 5's copies problem. You've traded a consistency guarantee for read speed, on purpose."},{"id":"nosql-3-3","type":"multiple_choice","prompt":"You denormalized a user's display name into all 10,000 of their posts. They change their name. What now?","choices":["One update — the database handles the rest","You must update 10,000 records, and until you finish, the system displays two different names","Nothing — old posts keep the old name and that's correct","The database refuses the change"],"answer":1,"why":"You moved the work from read-time to write-time: reads became one fast lookup, and that single rename became an enormous, slow, partially-visible operation. Here's the fundamental exchange rate of data modeling — normalized = cheap writes, expensive reads (you join); denormalized = cheap reads, expensive writes plus a consistency risk. Neither side is free; you are only ever choosing which side pays."},{"id":"nosql-3-4","type":"tradeoff_slider","prompt":"A social feed: 99% reads, 1% writes. Slide toward your modeling choice.","leftLabel":"Normalize (join at read time)","rightLabel":"Denormalize (store the answer, pay at write time)","answerRange":[60,100],"why":"With a 99:1 read-to-write ratio, paying at write time is obviously right: do the work once when someone posts, so that millions of reads are single cheap lookups. The rule to carry: put the work where the traffic isn't — read-heavy means precompute and denormalize, write-heavy means normalize and compute at read time. You'll meet this exact reasoning again by a different name in the news feed capstone: fan-out on write vs fan-out on read."},{"id":"nosql-3-5","type":"multi_select","prompt":"What are the real costs of denormalizing? Select all.","choices":["Copies can disagree with each other","Writes get more expensive","Reads get slower","You must know your access patterns in advance"],"answer":[0,1,3],"why":"Reads get FASTER — that's the entire point of doing it — so the costs are drifting copies, heavier writes, and committing to your query patterns early. Notice that two of those three are the same cost wearing different hats: once data lives in many places, both writing it and trusting it get harder. Duplication is never just a storage decision."},{"id":"nosql-3-6","type":"multiple_choice","prompt":"Your NoSQL data model can answer every question your product asks today. What's the risk?","choices":["There's no risk — it works","Tomorrow's question may not fit the shape you committed to, and reshaping stored data is far harder than writing a new query","It will run out of disk","It can't be backed up"],"answer":1,"why":"Modeling for your queries means your storage encodes today's questions, so a new question can require reshaping the data itself rather than just writing new SQL. This is the asymmetry that decides most real arguments: in relational, a new question costs you a query; in query-modeled NoSQL, a new question can cost you a migration. Early products change their questions constantly, which is a strong hint about what to default to."}]},{"id":"nosql-4","title":"Choosing, honestly","exercises":[{"id":"nosql-4-0","type":"concept","title":"What makes a join cheap is that nothing has to cross a network","body":"Matching two rows is nearly free when they sit on one machine and brutal when they sit on two, because every match becomes a network round trip. Agreeing on a commit across machines is worse: someone must ask every participant, wait for every participant, and hold everything still until the slowest one answers. Distance isn't a detail here. It's the cost.","note":"When a store advertises spreading across 50 machines, that's the *result* of a decision, not the decision. Ask what got dropped to make it possible — people notice the achievement immediately and the loss a year later."},{"id":"nosql-4-1","type":"multiple_choice","prompt":"Why is a relational database genuinely hard to scale across many machines?","choices":["The software is old and poorly written","Joins and ACID transactions across machines require network coordination — which is slow and complex. Many NoSQL stores scale easily precisely because they dropped those","Because it writes to disk","Licensing restrictions"],"answer":1,"why":"This is the honest technical reason rather than marketing: a join is cheap when both tables sit on one machine and brutal when the rows live on different servers across a network. So 'NoSQL scales better' really means *we removed the features that are hard to distribute* — a genuine engineering achievement AND a genuine loss. Just be certain you know which half you're buying, because people usually notice the achievement and discover the loss later."},{"id":"nosql-4-2","type":"multi_select","prompt":"Which are legitimate reasons to reach for NoSQL? Select all.","choices":["One well-known access pattern at massive scale","Data that's naturally self-contained documents","Relational feels old-fashioned","You need writes distributed across many nodes and don't need cross-node transactions"],"answer":[0,1,3],"why":"Known access patterns at scale, document-shaped data, and distributed writes without cross-node transactions are all real reasons; fashion is not. Note what the three real reasons have in common: they're statements about your workload rather than about the technology. Every good database decision is really a description of your problem."},{"id":"nosql-4-3","type":"multiple_choice","prompt":"New product. You don't yet know what queries you'll need, and you have 1,000 users. Sane default?","choices":["Cassandra, to be ready for scale later","A relational database — flexible about questions you haven't thought of, constraints for free, and far more headroom than you need","MongoDB, because JSON is convenient","A graph database, since everything is connected"],"answer":1,"why":"At 1,000 users your bottleneck isn't the database — it's not yet knowing what you're building, and relational lets you change your questions cheaply, which is precisely what early products do constantly. 'You're not Google' isn't an insult, it's an engineering fact: a single well-tuned Postgres routinely handles tens of thousands of transactions per second and terabytes of data. Most teams who chose NoSQL 'for scale' hit the pain of losing joins years before they'd have hit Postgres's ceiling."},{"id":"nosql-4-4","type":"multiple_choice","prompt":"Which statement is TRUE about the SQL/NoSQL landscape today?","choices":["NoSQL databases never support transactions","The lines have blurred: Postgres stores and indexes JSON, MongoDB added transactions, and NewSQL systems aim for relational semantics with horizontal scale","SQL databases cannot store JSON","The two worlds remain completely separate"],"answer":1,"why":"The clean 2010s dichotomy has largely dissolved — both sides absorbed the other's best ideas, and NewSQL (Spanner, CockroachDB) explicitly chases both at once. Which is why the honest modern answer is rarely 'SQL or NoSQL': it's what access patterns, what guarantees, what scale, and can my boring default already handle it? Most real systems end up polyglot anyway — Postgres for truth, Redis for hot reads, S3 for blobs. It's a toolbox, not a religion."},{"id":"nosql-4-5","type":"multiple_choice","prompt":"A team picked NoSQL 'for scale.' A year later they need a report that requires joining across two collections. What happens?","choices":["It's trivial — they just write the query","They must denormalize (taking on the update burden), join in application code (slow, N+1), or migrate — the flexibility they gave up is exactly what they now need","The database adds joins automatically","Nothing changes"],"answer":1,"why":"This is the most common real-world regret in database choice: they optimized for a scale problem they might have, and gave up flexibility for a problem they definitely had. Joining in application code is the worst of all worlds — you get unit 3's N+1 problem, over a network, with no query optimizer helping you, and you rebuild badly the exact feature you chose to give up."},{"id":"nosql-4-6","type":"tradeoff_slider","prompt":"You're storing financial transactions for a bank. Slide toward your choice.","leftLabel":"Relational (constraints + ACID)","rightLabel":"NoSQL (flexible + horizontal scale)","answerRange":[0,35],"why":"Money needs invariants the database itself enforces and multi-row transactions that genuinely hold — correctness dwarfs scale here, and being wrong isn't a bug, it's a regulator. Contrast with the social feed slider two lessons ago, which went the opposite way: same question, opposite answers, because the cost of being wrong is completely different. That cost, not the technology, is what's actually choosing."},{"id":"nosql-4-7","type":"multiple_choice","prompt":"What's the honest way to choose a database?","choices":["Pick whatever's trending this year","Start from access patterns and required guarantees; default to relational unless a specific need pushes you off it — and know exactly what you're giving up","Always NoSQL — it's the future","Always SQL — NoSQL is a fad"],"answer":1,"why":"Start from the problem — what will you ask, and what must never be wrong — then pick the boring default unless something concrete (scale profile, data shape, write distribution) forces you off it, consciously. Look back at this whole unit: every answer reduced to those same two questions, and technology names came last every single time. That ordering is the actual skill; everything else is trivia."}]}]};

const UNIT8 = {"unitId":"indexes","title":"Indexes","subtitle":"How the database jumps instead of scanning — and what it charges you","lessons":[{"id":"idx-1","title":"The book index","exercises":[{"id":"idx-1-0","type":"concept","title":"Sorted data can be searched; unsorted data can only be read","viz":{"nodes":[{"id":"q","label":"`WHERE email = …`","col":0},{"id":"i","label":"Index on `email`","sub":"sorted","col":1},{"id":"t","label":"`users` table","sub":"10M rows","col":2,"kind":"db"}],"edges":[{"from":"q","to":"i"},{"from":"i","to":"t"}]},"body":"Ten million rows in no order hide everything: to know whether your value is in there, you must look at all of them. Sortedness changes the question. Check the middle of a sorted list and whichever half you aren't in stops existing. Check the middle of what's left. Every step deletes half the candidates.","note":"Keeping values sorted is what makes them searchable, and nothing keeps itself sorted. Every row you insert has to be threaded into the right place in that order — by someone, at some cost. Lesson 3 is the invoice."},{"id":"idx-1-1","type":"multiple_choice","prompt":"A 1,000-page book. You want every page mentioning 'sharding.' You could read all 1,000 pages — or flip to the index at the back. What does that index give you?","choices":["A summary of the book","A sorted list of terms, each with page numbers — so you jump straight there","A faster way to read every page","Nothing you couldn't get by reading"],"answer":1,"why":"That's literally what a database index is: a sorted structure mapping values to locations, so you go straight to what you want instead of reading everything. Notice three properties of that book index, because all three matter — it's SEPARATE from the content, it's SORTED (the content isn't), and it's SMALLER than the book. Those are exactly the properties that make a database index work."},{"id":"idx-1-2","type":"multiple_choice","prompt":"So what IS a database index?","choices":["A faster copy of the whole table","A separate, sorted data structure mapping column values to row locations","A cache of recent query results","A compressed version of the table"],"answer":1,"why":"It's a separate structure holding one (or a few) columns, kept sorted, with pointers to where the full rows live — maintained automatically by the database. Redundant and derived should ring a bell from unit 5: an index is rebuildable state containing nothing that isn't already in the table, which is precisely why you can `DROP` an index and rebuild it without losing a single byte of data."},{"id":"idx-1-3","type":"multiple_choice","prompt":"Finding a value among 1 million unsorted rows takes up to 1 million checks. Using a sorted index structure, roughly how many steps?","choices":["1 million","About 1,000","About 20","Exactly 1"],"answer":2,"why":"Each step halves the remaining search space, so it's log₂(1,000,000) ≈ 20 steps — twenty, versus a million. And it gets better as you grow, which is the genuinely magical part: a BILLION rows is only ~30 steps, so doubling your data adds exactly ONE step. That's why indexed lookups stay fast forever while scans fall off a cliff — they scale completely differently."},{"id":"idx-1-4","type":"estimate","prompt":"Roughly how many steps does an index need to find one row among 1 billion? (It's log₂ of a billion.)","answer":30,"tolerance":5,"unit":"steps","why":"2³⁰ ≈ 1.07 billion, so about 30 steps — a billion rows, thirty comparisons. Sit with the gap: 30 versus 1,000,000,000. This isn't an optimization, it's a different category of thing, and almost every 'the database got slow' story is really 'we started scanning where we used to jump'."},{"id":"idx-1-5","type":"fill_blank","prompt":"Without a useful index, the database performs a full table ______; with one, it jumps straight to the rows.","choices":["scan","backup","commit","join"],"answer":0,"why":"Full table scan = read every row and check it. That's the default when no index can serve your query."},{"id":"idx-1-6","type":"multiple_choice","prompt":"An index is derived data — everything in it also exists in the table. What follows from that?","choices":["You can drop and rebuild an index without losing any data","Dropping an index deletes the underlying rows","The index is the source of truth","Indexes must be backed up separately or data is lost"],"answer":0,"why":"No data lives only in an index, so you can drop one and rebuild it without losing a byte. One caveat to carry, though: a `UNIQUE` index isn't pure optimization, because it also enforces a rule — drop it and you lose no data but you do lose the guarantee, which is how a duplicate-signup race gets back in. Postgres will simply refuse if a constraint depends on it. Operationally that's liberating — you can tune performance by adding and removing indexes without risking data — and it's also exactly why teams add too many of them. They feel free. The next lesson is about the bill."}]},{"id":"idx-2","title":"How it actually works","exercises":[{"id":"idx-2-0","type":"concept","title":"The B-tree's shape was dictated by the disk, not by your data","viz":{"nodes":[{"id":"r","label":"Root page","sub":"~400 keys","col":0},{"id":"a","label":"Internal","sub":"~400 keys","col":1},{"id":"b","label":"Internal","sub":"~400 keys","col":1},{"id":"w","label":"Leaf","sub":"row ptrs","col":2},{"id":"x","label":"Leaf","sub":"row ptrs","col":2},{"id":"y","label":"Leaf","sub":"row ptrs","col":2},{"id":"z","label":"Leaf","sub":"row ptrs","col":2}],"edges":[{"from":"r","to":"a"},{"from":"r","to":"b"},{"from":"a","to":"w"},{"from":"a","to":"x"},{"from":"b","to":"y"},{"from":"b","to":"z"}]},"body":"A disk hands you a whole page — say 8KB — however little of it you asked for. So on disk, the thing you're spending isn't comparisons, it's *reads*, and a read costs the same whether you use one byte of the page or all 8,192. Any structure that spends a read to learn a single fact is throwing away a whole page of answers it already paid for.","note":"In RAM none of this would matter: a binary tree is perfectly good there, because a comparison is the only thing you spend. Move the same structure onto a disk and the arithmetic changes completely."},{"id":"idx-2-1","type":"multiple_choice","prompt":"Databases use B-trees for indexes rather than simple binary trees. Why?","choices":["Tradition — binary trees came later","A B-tree node holds hundreds of keys, matching how disks read in big blocks — so one disk read gets you hundreds of keys instead of one","B-trees use less memory","Binary trees can't stay sorted"],"answer":1,"why":"Disks read in pages (say 8KB), so a binary tree would cost one disk read per comparison — brutal. A B-tree is wide and shallow: each node is a page holding hundreds of keys, so even a billion rows is only ~3–4 disk reads deep. This is a gorgeous example of a data structure shaped by hardware: in RAM a binary tree is perfectly fine, but on disk — where a read costs ~100µs (unit 4's ladder) — you must minimize READS rather than comparisons. The B-tree exists because disks read blocks, not bytes."},{"id":"idx-2-2","type":"multiple_choice","prompt":"You create an index on the `email` column. What does the index actually store?","choices":["A complete copy of every row","The email values, kept sorted, each with a pointer to where the full row lives","Only a list of emails, with no way back to the row","A hash of the entire row"],"answer":1,"why":"Sorted values plus pointers — that's why it's small (one column, not the whole row) and why it can find you the row once it locates the value. That pointer matters more than it looks: finding the value in the index is fast, but then fetching the actual row is a separate, random read. Hold that thought, because it explains the planner's behaviour in the next lesson."},{"id":"idx-2-3","type":"multiple_choice","prompt":"Why can an index on `created_at` efficiently answer 'all rows from last week'?","choices":["It can't — indexes only do exact matches","Because the index is SORTED: once you find the start of the range, the rest sit right next to each other","Because dates are small","It scans, but quickly"],"answer":1,"why":"Sortedness is what gives you ranges: find the start, then read sequentially, and you never search again. This is why sorted beats hashed for most database work — a hash index is O(1) for `= value` but completely useless for `> value` or `ORDER BY`, because hashing deliberately destroys order. B-trees give you equality AND ranges AND sorting from one structure, which is why they're the default everywhere."},{"id":"idx-2-4","type":"match_pairs","prompt":"Match each approach to what it gives you.","pairs":[{"left":"B-tree index","right":"Sorted: equality, ranges, and `ORDER BY`"},{"left":"Hash index","right":"Equality only — order is destroyed"},{"left":"Full table scan","right":"Read every row and check it"},{"left":"Index lookup","right":"Jump via a sorted structure"}],"why":"Different structures make different promises, and the B-tree's sortedness is what makes it the versatile default. Hash indexes aren't useless — for pure key-value equality lookups they're faster and smaller — they're just too narrow to be a default, because real queries want ranges and ordering sooner or later."},{"id":"idx-2-5","type":"multiple_choice","prompt":"Your query ends with `ORDER BY created_at`, and there's an index on `created_at`. What's the bonus?","choices":["Nothing — indexes only help filtering","The index is already in sorted order, so the database can skip the sort step entirely","It makes the sort slower","The rows come back in random order"],"answer":1,"why":"An index doesn't just find rows — it can hand them over already in order, eliminating an expensive sort. Sorting a large result set can dominate a query's cost, and if it doesn't fit in memory it spills to disk and collapses; a surprising share of 'nothing changed, but it got slow' incidents are a query that quietly started sorting on disk as the data grew."},{"id":"idx-2-6","type":"multiple_choice","prompt":"What's the essential property that makes an index fast?","choices":["It's stored in RAM","It's sorted, so the database can eliminate most of the data with each step instead of checking rows one by one","It's compressed","It's written in C"],"answer":1,"why":"Order is the whole trick: sortedness lets you discard half — or in a B-tree, the vast majority — of the remaining candidates at every step. Which is also the clue to every index's limitation: an index can only help when your query aligns with the order it's stored in, so ask it a question that doesn't match its ordering and it may as well not exist. That's the theme of lesson 4."}]},{"id":"idx-3","title":"Indexes aren't free","exercises":[{"id":"idx-3-0","type":"concept","title":"An index is a copy, and copies don't keep themselves true","viz":{"nodes":[{"id":"w","label":"One `INSERT`","sub":"reaches all of them","col":0},{"id":"t","label":"`users` table","col":1,"kind":"db"},{"id":"i1","label":"idx `email`","col":1},{"id":"i2","label":"idx `created_at`","col":1},{"id":"i3","label":"idx `status`","col":1}],"edges":[{"from":"w","to":"t"},{"from":"w","to":"i1"},{"from":"w","to":"i2"},{"from":"w","to":"i3"}]},"body":"An index is a copy of a column, kept in sorted order. Nothing about that is free after you create it: the order has to stay true through every `INSERT`, `UPDATE`, and `DELETE`, which means threading each new entry into exactly the right place — sometimes splitting a full page to make room. The database does this silently, on every write.","note":"Nobody notices this bill, because the query you sped up is the one you were watching. The index you added has a name and a ticket; the writes it taxed are spread thinly across everything else you do."},{"id":"idx-3-1","type":"multiple_choice","prompt":"You add 5 indexes to a table to make reads fast. What happens to writes?","choices":["Nothing — indexes only affect reads","Every `INSERT`, `UPDATE`, and `DELETE` must now update all 5 indexes too, so writes get slower","Writes get faster too","Only `INSERT`s are affected"],"answer":1,"why":"An index is a copy that must be kept in sync, so every write to the table pays to maintain every index on it. This is the central tradeoff of the unit: indexes buy read speed with write speed and disk, and a table with 15 indexes can be several times slower to write than the same table with two. There is no free lookup — you're moving the cost, not removing it."},{"id":"idx-3-2","type":"multi_select","prompt":"What does each additional index cost you? Select all.","choices":["Slower writes","More disk space","More memory — indexes compete for cache","Slower reads on the indexed column"],"answer":[0,1,2],"why":"Writes, disk, and memory pressure — reads on that column get FASTER, which is the entire point of paying the other three. The memory one is quietly important: your indexes compete with your data for the database's cache, so enough unnecessary indexes and you evict the hot data you actually needed. A pile of 'harmless' indexes can slow down reads they have nothing to do with."},{"id":"idx-3-3","type":"multiple_choice","prompt":"A team adds an index on every column, 'just in case.' Result?","choices":["Every query is now fast","Writes crawl, disk balloons, the planner has more ways to choose wrong — and most of those indexes are never used at all","No measurable effect","The database refuses"],"answer":1,"why":"Unused indexes are pure cost: maintained on every single write, read by nobody — 'just in case' is a bill you pay forever for a benefit you never collect. Real databases track index usage statistics, so finding and dropping dead indexes is a classic, high-value, low-risk cleanup. It's common to find tables where half the indexes have never been used since the day they were created."},{"id":"idx-3-4","type":"multiple_choice","prompt":"You have an index on `country`. For `WHERE country = 'US'`, where 90% of rows are US, the planner does a full scan anyway. Why?","choices":["It's a bug in the planner","Reading 90% of the table via an index means randomly jumping to nearly every row — streaming the whole table sequentially is genuinely faster","The index is corrupt","Indexes don't work on text columns"],"answer":1,"why":"The index gives you a pointer, then you pay a random read to fetch each row — doing that for 90% of the table is far slower than just reading the table straight through. It's sequential-vs-random again, the same physics behind unit 6's write-ahead log, and the planner is right while your intuition is wrong. It also reveals the rule governing lesson 4: an index only helps when it's SELECTIVE — when it narrows to a small fraction of the table."},{"id":"idx-3-5","type":"multiple_choice","prompt":"Which is cheaper to use as an indexed primary key: an auto-incrementing id, or a random UUID?","choices":["They're identical","The auto-incrementing id — new values always append at the end of the index, while random UUIDs scatter writes across the whole structure","The random UUID — randomness spreads load evenly","Neither can be indexed"],"answer":1,"why":"Sequential ids append to one hot spot at the end of the index; random UUIDs land anywhere, forcing the B-tree to split pages all over and destroying cache locality. This is a famous, real performance problem — random UUID primary keys can dramatically slow inserts on large tables — and it's exactly why UUIDv7 (time-ordered) was standardized: you keep global uniqueness but restore write locality. A great example of a 'neutral' id choice quietly being a storage decision."},{"id":"idx-3-6","type":"tradeoff_slider","prompt":"A write-heavy audit log: billions of appends, queried only during rare investigations. Slide toward how many indexes you'd add.","leftLabel":"Few or none (fast writes)","rightLabel":"Many (fast reads)","answerRange":[0,35],"why":"Write-heavy and read-rarely means indexes are almost pure cost — you'd pay on every one of billions of writes to speed up a query someone runs twice a year. Same rule as the social feed, pointed the other way: put the work where the traffic isn't. Here the traffic is writes, so keep the write path lean and accept that the rare investigation takes a slow scan. That's the correct trade, not a compromise."}]},{"id":"idx-4","title":"Designing indexes","exercises":[{"id":"idx-4-0","type":"concept","title":"An index is only worth using when it eliminates almost everything","body":"*Selectivity* is the fraction of rows a lookup matches, and low is what you want. One row in ten million is superb. Matching most of the table is worse than useless: the index gives you a pointer per matching row, and following nearly all of them means jumping randomly around the disk — when the planner could read the whole table straight through, faster.","note":"Selectivity belongs to the query, not the column. The same index can be brilliant for one value in a column and worthless for another — so \"should I index this?\" has no answer until you say what you'll ask of it."},{"id":"idx-4-1","type":"multiple_choice","prompt":"You index a boolean `is_active` column where 95% of rows are true. Does it help `WHERE is_active = true`?","choices":["Yes — indexes always help","Barely — it matches 95% of rows, so it isn't selective, and the planner will likely scan anyway","Yes, because booleans are small","It makes the query fail"],"answer":1,"why":"An index earns its keep by NARROWING, and matching 95% of the table narrows nothing — so you pay the write cost for essentially no read benefit. Rule of thumb: index high-cardinality columns (many distinct values — `email`, `user_id`), because indexing a boolean is usually cargo cult. But note the subtlety: the SAME column can be worth indexing for the opposite query, since `WHERE is_active = false` matches only 5% of rows and is highly selective. Selectivity is a property of the QUERY, not just the column — and if that rare case is all you ever query, a partial index (one defined with its own `WHERE` clause so it physically contains only those 5% of rows) is smaller still."},{"id":"idx-4-2","type":"multiple_choice","prompt":"You have a composite index on `(last_name, first_name)`. Which query can use it?","choices":["`WHERE first_name = 'Ada'`","`WHERE last_name = 'Lovelace'`","Both work equally well","Neither"],"answer":1,"why":"A composite index sorts by the first column, then the second — exactly like a phone book sorted by last name, then first. You can find all the Lovelaces instantly; you cannot find all the Adas, because they're scattered across every last name. This is the leftmost prefix rule, one of the most misunderstood things in databases: an index on `(a, b, c)` serves queries on `a`, on `(a, b)`, and on `(a, b, c)` — but NOT on `b` alone, `c` alone, or `(b, c)`. Column ORDER is a real design decision, not a formality."},{"id":"idx-4-3","type":"multi_select","prompt":"Given an index on `(a, b, c)`, which queries can use it? Select all.","choices":["`WHERE a = 1`","`WHERE a = 1 AND b = 2`","`WHERE b = 2`","`WHERE a = 1 AND b = 2 AND c = 3`"],"answer":[0,1,3],"why":"Leftmost prefix: you must start at `a`. Anything beginning with `a` can use the index; `b` on its own can't, because the index isn't sorted by `b` — it's sorted by `b` only within each `a`. The practical consequence: one well-ordered composite index on `(a, b, c)` can replace separate indexes on `a` and on `(a, b)` — three queries served, one index maintained, which is how you get fast reads without drowning your writes."},{"id":"idx-4-4","type":"multiple_choice","prompt":"Query: `SELECT email FROM users WHERE email = 'x@y.com'`, with an index on `email`. Why might the database answer this without reading the table at all?","choices":["Because the query is short","Because the index already contains every column the query asks for","Because email values are unique","It can't — it always has to read the row"],"answer":1,"why":"The index holds email values, and an email is all the query wants — so when every column a query needs is already in the index, the database can answer from the index alone and skip fetching the row. That's a covering index (an index-only scan), and it's a bigger deal than it sounds: you skip the random read to fetch the row, which is often the expensive half. It's why engineers sometimes add a column to an index purely so it can answer a whole query alone, without ever filtering on that column. One caveat worth carrying: Postgres still consults its visibility map and will fetch the row anyway if the page isn't marked all-visible, so 'index-only' is a best case rather than a promise."},{"id":"idx-4-5","type":"multiple_choice","prompt":"How do you find out whether your query is actually using an index?","choices":["Time it and compare","Run `EXPLAIN` — the database shows you the plan it chose","Read the database source code","You can't know for sure"],"answer":1,"why":"Don't guess — ask. `EXPLAIN` shows the plan: whether you got a sequential scan or an index lookup, and what it estimates the cost to be. This is arguably the highest-leverage database skill for an average engineer, because a huge share of 'the database is slow' turns out to be one missing index and `EXPLAIN` finds it in about ten seconds. Learning to read a query plan pays for itself in a week."},{"id":"idx-4-6","type":"multiple_choice","prompt":"A query filters `WHERE user_id = 42 AND status = 'open'`, then sorts `ORDER BY created_at`. Which single composite index best serves it?","choices":["`(created_at)`","`(user_id, status, created_at)`","`(status)`","`(created_at, user_id, status)`"],"answer":1,"why":"Equality columns first (`user_id`, `status`) to narrow hard, then the sort column (`created_at`) — the index jumps to user 42's open rows, and they're already in `created_at` order, so the sort step disappears too. The general recipe: equality columns first, then your range/sort column. Get it backwards — `(created_at, user_id, status)` — and it's nearly useless here, because you'd have to scan every date to find user 42. Same columns, opposite outcome."},{"id":"idx-4-7","type":"multiple_choice","prompt":"What's the honest one-sentence summary of indexing?","choices":["Index every column so every query is fast","An index is a derived, sorted copy that trades write speed and disk for read speed — so index deliberately: for real queries, on selective columns, in the right order, and verify with `EXPLAIN`","Avoid indexes; they slow down writes","Let the database figure it out automatically"],"answer":1,"why":"Both extremes are wrong: indexes are a deliberate purchase, spending write throughput and disk to buy read latency, and it's only a good deal when the index actually serves a query you really run. Step back and notice this is unit 5's lesson wearing new clothes — an index is a derived copy that buys speed and costs consistency work. The only difference is the database does the syncing for you, and bills you on every write."}]}]};

const UNIT9 = {"unitId":"transactions-and-acid","title":"Transactions & ACID","subtitle":"All or nothing — and the dial most engineers don't know they're turning","lessons":[{"id":"txn-1","title":"All or nothing","exercises":[{"id":"txn-1-0","type":"concept","title":"Some pairs of writes have no valid halfway point","body":"Take one seat off the flight's remaining count. Insert the booking row. Two writes with no valid state between them: stop after the first and a seat is gone that nobody is sitting in — no error, nothing looking wrong on its own. A *transaction* removes the between: wrap both in `BEGIN` … `COMMIT` and there is no point where one landed and the other didn't.","note":"That all-or-nothing property is *atomicity*, the A in ACID, and it's the one with no middle setting. There is no \"partly atomic\" — either the whole unit landed, or the database acts as though you never asked."},{"id":"txn-1-1","type":"multiple_choice","prompt":"Transfer $100: subtract from account A, then add to account B. The server crashes between the two steps. What happened?","choices":["Nothing — the crash undid both","$100 vanished — it left A and never arrived at B","The money doubled","The database retries automatically"],"answer":1,"why":"Two writes that must both happen or neither — crash in the middle and you've destroyed money, with no error, and no way for either account to know. This is the canonical example for a reason: it's the clearest case where *half done* is strictly worse than *not done at all*. A failed transfer is an inconvenience; a half transfer is a corrupted ledger, and nobody can tell by looking at it."},{"id":"txn-1-2","type":"fill_blank","prompt":"A ______ groups multiple operations so they all succeed together or all fail together.","choices":["transaction","migration","query","connection"],"answer":0,"why":"A transaction turns many operations into one indivisible unit — the database's answer to 'half done'."},{"id":"txn-1-3","type":"multiple_choice","prompt":"What does `COMMIT` actually mean?","choices":["Save the data to memory","Apply every change in the transaction — all of them, together","Close the connection","Write to a log file for later"],"answer":1,"why":"`COMMIT` applies your whole transaction as one unit: either the whole thing takes effect, or none of it does. `ROLLBACK` is the opposite — discard everything since `BEGIN`, as though it never happened."},{"id":"txn-1-4","type":"multiple_choice","prompt":"You're 5 of 10 writes into a transaction when it hits an error and rolls back. What happens to those 5 writes?","choices":["They stay — they already succeeded","All 5 are undone: the database rewinds to the state at `BEGIN`","Only the most recent one is undone","The database pauses and asks you what to do"],"answer":1,"why":"That's atomicity: the transaction is indivisible, so a failure anywhere undoes everything since `BEGIN` and you can never be left with a half-finished transfer sitting in the data. Be careful with a related-but-different question: could OTHER transactions have seen those 5 writes before you committed? That is NOT atomicity — it's isolation, and the answer depends on the isolation level you're running (at Read Uncommitted they genuinely could — a *dirty read*). Atomicity is only about whether you can be left half-done; lesson 3 takes isolation apart properly."},{"id":"txn-1-5","type":"order_steps","prompt":"Order the life of a transaction.","steps":["`BEGIN`","Debit account A","Credit account B","`COMMIT`","All the changes take effect together"],"why":"Open it, do the work, commit — and only at `COMMIT` do all the changes take effect, as one unit, with anything before that point still undoable. If anything fails between `BEGIN` and `COMMIT` — an error, a crash, a `ROLLBACK` — the database rewinds to the state at `BEGIN`, and that rewind is exactly what the write-ahead log from unit 6 makes possible."},{"id":"txn-1-6","type":"multiple_choice","prompt":"Why is a transaction the right tool for a bank transfer, but overkill for logging one analytics event?","choices":["Transactions only work on money","A transfer has an invariant spanning two rows that must never break; a lone analytics insert has nothing to be atomic with","Analytics data is too large","Transactions are always the right tool"],"answer":1,"why":"Atomicity matters when several changes must hold together; a single independent insert is already all-or-nothing by itself, so wrapping it in a transaction buys you nothing. Good instinct to build: reach for a transaction when there's an invariant across multiple writes. The question is never 'is this important data?' — it's 'is there a rule that would break if only some of this landed?'"}]},{"id":"txn-2","title":"ACID, honestly","exercises":[{"id":"txn-2-0","type":"concept","title":"ACID is four unrelated promises wearing one acronym","body":"*Atomicity*: the whole unit lands or none of it does. *Consistency*: the constraints you declared — `UNIQUE`, foreign keys, checks — still hold. *Isolation*: what concurrent transactions can see of each other's unfinished work. *Durability*: once committed, it survives a crash. Four separate promises. The acronym flatters them into a set.","note":"Coined in 1983 to describe what a transaction *is*, not to certify a product — which is why \"we're ACID\" settles fewer arguments than people assume. The four letters have very different characters."},{"id":"txn-2-1","type":"match_pairs","prompt":"Match each letter of ACID to what it promises.","pairs":[{"left":"Atomicity","right":"All or nothing"},{"left":"Consistency","right":"Your declared rules are never violated"},{"left":"Isolation","right":"Concurrent transactions don't corrupt each other"},{"left":"Durability","right":"Committed means it survives a crash"}],"why":"Four promises: indivisible, rule-abiding, non-interfering, and permanent. They're not equally interesting, which the acronym hides — one is barely the database's doing, only one is a flat promise you simply get, and two are dials you're probably turning without realising. The rest of this lesson sorts out which is which."},{"id":"txn-2-2","type":"multiple_choice","prompt":"Durability: you commit, and a microsecond later the power dies. Your data?","choices":["Lost — it was still in memory","There — commit meant it was durably recorded before the database answered you","Partially there","Recovered only if you had a backup"],"answer":1,"why":"That's the D, and it's the promise you met in unit 6: by default the write-ahead log is forced to disk before `COMMIT` returns. Which is why `COMMIT` isn't instant — it's waiting on physics, and every 'why are my writes slow?' question eventually arrives here: you asked for a guarantee that requires the disk to confirm."},{"id":"txn-2-3","type":"multiple_choice","prompt":"Which letter of ACID is really about YOUR rules rather than the database's own machinery?","choices":["Atomicity","Consistency — it just means the constraints you declared (`UNIQUE`, foreign keys, checks) hold before and after","Isolation","Durability"],"answer":1,"why":"A, I, and D are properties the engine provides; C only says the database won't let you violate the constraints you defined — so if you declared no constraints, C promises approximately nothing. Plenty of practitioners argue the C is a bit of a cheat, since it's really 'the database enforces your declared invariants', which is just... constraints. And watch out: the C in CAP means something completely different, a collision of names that has confused engineers for twenty years."},{"id":"txn-2-4","type":"multi_select","prompt":"Which ACID properties are dials you configure, rather than guarantees you simply get? Select all.","choices":["Atomicity — you pick how atomic a transaction is","Isolation — several levels, each trading correctness for speed","Durability — you pick how much of a crash an already-acknowledged write survives","Consistency — you tune it per query"],"answer":[1,2],"why":"Two of the four are dials, and the acronym hides it. Isolation is the famous one: several levels, and the level decides which concurrency bugs remain possible in your code. Durability is the one that catches people — `synchronous_commit = off` in Postgres, `innodb_flush_log_at_trx_commit = 0` in MySQL, and MongoDB's `w`/`j` write concern each let a write the database already told you it accepted vanish in a crash, in exchange for speed. Not knowing that dial exists is how a team ships a database quietly configured to lose acknowledged writes. Atomicity is not a dial — there is no 'partly atomic' — and ACID's Consistency is mostly your declared constraints doing the work, not the engine's. The uncomfortable part: most engineers can't tell you which isolation level their production database runs at, so they're relying on guarantees they've never looked up, and the defaults are not the strongest ones."},{"id":"txn-2-5","type":"multi_select","prompt":"Which of these statements are TRUE? Select all.","choices":["Atomicity is about all-or-nothing","Durability is about surviving crashes","Isolation is a single fixed guarantee every database provides identically","The C in ACID means something different from the C in CAP"],"answer":[0,1,3],"why":"Isolation is the dial you'll actually reason about, and databases differ in both their defaults and what their level names even mean. That last point is a genuine trap: two databases can both say 'Repeatable Read' and give you materially different guarantees, so the label is not the specification."},{"id":"txn-2-6","type":"multiple_choice","prompt":"A colleague says 'we use Postgres, so we're ACID — concurrency bugs are impossible.' What's wrong?","choices":["Nothing — that's correct","ACID doesn't mean 'maximum isolation.' The default level still permits real anomalies; you have to opt into stronger guarantees","Postgres isn't ACID","ACID only applies to reads"],"answer":1,"why":"'ACID compliant' is not a force field: the I in ACID is whatever level you're running, and the default is not serializable. This misconception causes real bugs — teams assume the database is protecting an invariant it was never asked to protect, then find corrupted data months later with no error in any log. Concurrency bugs don't crash, they quietly lie."}]},{"id":"txn-3","title":"Isolation is a dial","exercises":[{"id":"txn-3-0","type":"concept","title":"Your database is running a weaker isolation level than you think it is","body":"Isolation decides what one transaction may see of another's unfinished work. Forbidding more of it means doing more: holding locks for longer, or watching for conflicts and aborting whoever loses. Postgres defaults to Read Committed, a fresh snapshot per *statement*; MySQL's InnoDB to Repeatable Read. Neither is the strongest available.","note":"And the names lie across engines: Postgres's \"Repeatable Read\" is really snapshot isolation, and Postgres quietly treats Read Uncommitted as Read Committed — you cannot get a dirty read out of it however hard you ask."},{"id":"txn-3-1","type":"multiple_choice","prompt":"Why don't databases just always use the strictest isolation?","choices":["They do","Stricter isolation costs performance — more locking or coordination and more aborted transactions — so you get to choose","Strict isolation is less correct","It's a licensing restriction"],"answer":1,"why":"Isolation is bought with throughput: the stricter you go, the more the database must coordinate or abort, so it lets you pick your point on the curve. And the defaults are NOT the strictest — Postgres defaults to Read Committed, MySQL's InnoDB to Repeatable Read, neither of which is serializable. So unless you changed it deliberately, you are running with known anomalies permitted, right now, in production."},{"id":"txn-3-2","type":"match_pairs","prompt":"Match each concurrency anomaly to what goes wrong.","pairs":[{"left":"Dirty read","right":"You read data another transaction hasn't committed"},{"left":"Non-repeatable read","right":"You read the same row twice and get different values"},{"left":"Phantom read","right":"You re-run a range query and new rows appear"},{"left":"Lost update","right":"Two read-modify-writes; one is silently overwritten"}],"why":"Each isolation level is defined by which of these it forbids, so knowing the anomalies is how you read the levels. You already met lost update in unit 6 — the counter that went from 10 to 11 instead of 12 — and it wasn't a database bug: it was an isolation level doing exactly what it promised, which was less than you assumed."},{"id":"txn-3-3","type":"order_steps","prompt":"Order the isolation levels from weakest to strongest.","steps":["Read Uncommitted","Read Committed","Repeatable Read","Serializable"],"why":"Each rung forbids more anomalies and costs more coordination: Read Uncommitted allows dirty reads, Read Committed stops them, Repeatable Read stops non-repeatable reads, and Serializable stops everything. Read Uncommitted is almost never worth using — you get dirty reads for a performance win modern engines barely deliver — so the real decision in practice is between the other three."},{"id":"txn-3-4","type":"multiple_choice","prompt":"What does Serializable actually guarantee?","choices":["Transactions literally run one at a time, so it's very slow","The RESULT is as if they'd run one at a time in some order — even though they ran concurrently","That no transaction ever fails","That reads are always fast"],"answer":1,"why":"It's a promise about the outcome rather than the schedule: the database may run everything concurrently, as long as the final state matches SOME serial order. That 'as if' does enormous work — the engine may let transactions run in parallel and then ABORT one when it spots a conflict that couldn't have arisen serially, which means under Serializable your transaction can fail through no fault of its own and your code must be ready to retry. Correctness didn't become free; it moved into your error handling."},{"id":"txn-3-5","type":"multiple_choice","prompt":"Two doctors are on call. Each opens a transaction, checks 'is at least one OTHER doctor on call?', sees yes, and books themselves off. Both commit. Now nobody is on call — though each transaction was individually valid. What is this?","choices":["A dirty read","Write skew — they read overlapping data but wrote to different rows, so nothing conflicted","A phantom read","A deadlock"],"answer":1,"why":"No two transactions touched the same row, so most isolation levels see no conflict at all — yet together they broke an invariant that neither broke alone. This is the anomaly that snapshot isolation (which is what Postgres's 'Repeatable Read' actually is) still permits, and that Serializable prevents. It's subtle precisely BECAUSE nothing overlapped: the bug lives in a rule spanning rows rather than in any single row, so if your correctness depends on an invariant across multiple rows, Read Committed and Repeatable Read will not save you."},{"id":"txn-3-6","type":"multiple_choice","prompt":"Your correctness depends on an invariant spanning multiple rows that must never break. What do you do?","choices":["Hope — it's rare","Use Serializable and handle retries, take an explicit lock, or restructure so the invariant lives in a single row","Add an index","Switch to NoSQL"],"answer":1,"why":"Three real options: pay for Serializable and be ready to retry, lock explicitly so conflicts are visible, or reshape the data so the rule is enforceable in one place. That third one is underrated — if the invariant can be expressed as a single row (a counter, a constraint, a unique key), the database can enforce it cheaply and unconditionally. Often the best fix for a hard concurrency problem is a better data model rather than a stronger isolation level."}]},{"id":"txn-4","title":"Transactions in the real world","exercises":[{"id":"txn-4-0","type":"concept","title":"A lock is held until you commit, not until you're done with it","body":"Locks are one way a database keeps transactions apart: touch a row and you hold it until you commit, whether you're still using it or not. So a transaction wanting two rows takes one and waits for the other — still holding the first. Databases know this can knot into a *deadlock*, so they watch for a cycle of waiters and abort somebody when they find one.","note":"It's a cycle, so you prevent it by never letting one form: take every lock in a fixed order — always the lower id first — and two transactions can't end up waiting on each other's tail."},{"id":"txn-4-1","type":"multiple_choice","prompt":"Transaction 1 locks row A and then wants row B. Transaction 2 locks row B and then wants row A. What happens?","choices":["They both wait forever, silently","Deadlock — the database detects the cycle, kills one, and that one gets an error and must retry","They merge into one transaction","The database crashes"],"answer":1,"why":"Each holds what the other needs, and real databases detect the cycle and abort a victim rather than hanging forever — so one transaction gets an error out of nowhere. The classic prevention is to always acquire locks in a consistent order (e.g. always lock the lower account id first) so a cycle can't form. Deadlocks aren't a database defect; they're an emergent property of concurrent code, and your app must be prepared to retry."},{"id":"txn-4-2","type":"multiple_choice","prompt":"You open a transaction and hold it for 10 minutes while calling an external payment API inside it. What's the damage?","choices":["None — the transaction just waits","You hold locks the whole time, block other transactions, and force the database to retain old row versions — bloating storage and slowing everything","It makes the payment faster","The database ignores idle transactions"],"answer":1,"why":"A held transaction holds locks and pins old versions of rows, so everyone who needs those rows queues behind you — for as long as a third party takes to answer. The rule: never do network I/O inside a transaction. This is one of the most common real production outages there is — the slow API call holds locks, waiting transactions pile up (unit 4's queueing), the connection pool exhausts, and a payments hiccup becomes a total site outage. Do the I/O first, then open a short transaction to record the result."},{"id":"txn-4-3","type":"match_pairs","prompt":"Match each concurrency strategy to what it is.","pairs":[{"left":"Pessimistic locking","right":"Lock up front — assume conflict is likely"},{"left":"Optimistic concurrency","right":"Proceed, detect conflict at commit, retry"},{"left":"Version number check","right":"How optimistic concurrency spots a conflict"},{"left":"Deadlock","right":"Two transactions each holding what the other wants"}],"why":"Two philosophies: prevent conflicts by excluding others, or allow them and detect collisions at the end. Optimistic concurrency is usually a version column — read version 7, write only if it's still 7; if someone else got there first it's now 8, your update matches nothing, and you retry. It's just compare-and-set, applied to a row."},{"id":"txn-4-4","type":"multiple_choice","prompt":"Your workload has rare conflicts — users almost never edit the same row simultaneously. Which strategy usually wins?","choices":["Pessimistic locking — safety first","Optimistic concurrency — conflicts are rare, so occasionally retrying beats making everyone wait","Neither works","It makes no difference"],"answer":1,"why":"If collisions are rare, locking everyone up front taxes the 99% of transactions that would never have conflicted — let them run and pay only when you actually collide. The inverse matters just as much: under HIGH contention, optimistic degenerates as everyone retries, collides again, and you burn capacity making no progress, so pessimistic is calmer there. Choose from how often you actually collide, not from which sounds more sophisticated."},{"id":"txn-4-5","type":"multiple_choice","prompt":"You must charge a credit card (an external service) AND create an order (your database) atomically. Can a database transaction do this?","choices":["Yes — wrap both in `BEGIN`/`COMMIT`","No — a database transaction only covers its own database; the card charge is a separate system that knows nothing about your `COMMIT` or `ROLLBACK`","Yes, if you use Serializable","Yes, with the right driver"],"answer":1,"why":"Atomicity stops at the database boundary: your `ROLLBACK` can rewind your rows, but it cannot un-charge someone's card. This is where people get badly burned, because the code LOOKS atomic. The real patterns are two-phase commit (a coordinator asks every participant to prepare, then commit — correct, but slow, and it blocks if the coordinator dies mid-flight) or a saga (do the steps, and if a later one fails, run compensating actions like a refund). Most modern systems choose sagas plus idempotency over 2PC."},{"id":"txn-4-6","type":"tradeoff_slider","prompt":"Microservices: an order service and a payment service, each with its own database. Slide toward your approach for keeping them consistent.","leftLabel":"Two-phase commit (strict atomicity)","rightLabel":"Saga (compensating actions, eventual)","answerRange":[55,100],"why":"Across services, 2PC's blocking behaviour and coordinator failure modes are usually worse than the complexity of writing compensating actions, so most real distributed systems choose sagas. But be honest about what you gave up: there's now a window where the payment succeeded and the order doesn't exist yet — you accepted a temporarily inconsistent state plus a compensation path, because the alternative (a distributed lock spanning services) is worse. That acceptance is the road to eventual consistency, and it's where Tier 3 begins."},{"id":"txn-4-7","type":"multiple_choice","prompt":"What's the honest summary of transactions?","choices":["Always use Serializable and never think about it again","A transaction buys atomicity and a chosen isolation level within ONE database — so know your level, keep transactions short, and remember the guarantee stops at the database boundary","Transactions are legacy; use eventual consistency everywhere","Transactions make concurrency bugs impossible"],"answer":1,"why":"Powerful, bounded, and configurable — the power is real; the boundary and the dial are what people forget. Three things most engineers get wrong, in order of damage: they don't know their isolation level, they hold transactions open across network calls, and they assume atomicity extends across services. Fix those three and you're ahead of most working engineers — and ready for what happens when the copies can't talk to each other."}]}]};
