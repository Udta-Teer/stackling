const UNIT16 = {"unitId":"message-queues","title":"Message Queues & Async","subtitle":"Stop making the user wait for work they don't need to watch","lessons":[{"id":"mq-1","title":"Work the user shouldn't wait for","exercises":[{"id":"mq-1-0","type":"concept","title":"Anything your handler does before it responds is time the user spends watching a spinner","viz":{"nodes":[{"id":"u","label":"User","col":0,"kind":"client"},{"id":"s","label":"API Server","col":1,"kind":"server","sub":"responds now"},{"id":"q","label":"Queue","col":2,"kind":"queue","sub":"send email"},{"id":"w","label":"Worker","col":3,"kind":"server","sub":"on its own clock"},{"id":"e","label":"Email API","col":4,"kind":"server","sub":"3rd party"}],"edges":[{"from":"u","to":"s"},{"from":"s","to":"q"},{"from":"q","to":"w"},{"from":"w","to":"e"}]},"body":"A handler runs top to bottom, and every line of it finishes before the response is sent. So if one of those lines calls something slow — a third-party API, say — that call is sitting in the user's path, and they are paying for work they will never look at. A queue breaks the chain: write down *send this email*, respond now, let a separate worker do it later.","note":"The test for what can move isn't how slow the work is. It's whether the user needs the result in order to continue. Slow work they're waiting on has to stay. Slow work nobody is watching can go."},{"id":"mq-1-1","type":"multiple_choice","prompt":"A user signs up. Your handler creates the account (20ms), then sends a welcome email via a third-party API (2 seconds). How long do they stare at a spinner?","choices":["20ms","Over 2 seconds — they're waiting on an email they aren't even looking at","2 seconds, but only sometimes","It happens in the background automatically"],"answer":1,"why":"The response can't return until the handler finishes, so the user waits for every line of it — including a slow call to a service they'll never see the result of. Worse, you've coupled signup's availability to the email provider's: if that API is down, your handler fails and nobody can sign up at all, over an email."},{"id":"mq-1-2","type":"fill_blank","prompt":"A message ______ lets you hand off work now and have it performed later by a separate process.","choices":["queue","cache","index","replica"],"answer":0,"why":"You write the job down somewhere durable and return immediately; something else picks it up and does it. The user's request stops being 'do the work' and becomes 'record that the work is needed'."},{"id":"mq-1-3","type":"order_steps","prompt":"Order what happens when signup sends the welcome email asynchronously.","steps":["User submits signup","Server creates the account","Server puts a 'send welcome email' message on the queue","Server responds — user is done in ~25ms","A worker picks the message up and calls the email API"],"why":"The user's request now ends the moment the job is recorded, and the slow part happens on someone else's clock. Note the ordering that matters: the response goes out BEFORE the email is sent, which is precisely the trade — the user gets 25ms, and in exchange the email is a promise rather than a fact."},{"id":"mq-1-4","type":"multi_select","prompt":"Which of these belong behind a queue? Select all.","choices":["Sending a welcome email","Generating a monthly PDF report","Checking the password on login","Encoding an uploaded video"],"answer":[0,1,3],"why":"Emails, reports, and video encoding are slow, the user isn't watching the result, and a few seconds' delay costs nothing. The password check is the opposite on every count: the user is waiting on that exact answer, and deferring it is meaningless because there's nothing to return without it. The test is simply whether the user needs the result to continue."},{"id":"mq-1-5","type":"multiple_choice","prompt":"What have you given up by moving the email to a queue?","choices":["Nothing at all","Certainty at response time: you told the user 'done' when the email is merely scheduled, so if it later fails, they've already been told it worked","The ability to send email","Account creation reliability"],"answer":1,"why":"Async converts a synchronous fact into a promise — at the moment you respond, the work has not happened, and you're asserting it will. That's fine for a welcome email and unacceptable for 'your payment succeeded', so the question is always what happens if this promise is broken and nobody's watching. Answer it before you defer the work, not during the incident."},{"id":"mq-1-6","type":"multiple_choice","prompt":"Beyond speed, what does the queue give you when the email provider goes down for an hour?","choices":["Nothing — the emails are lost","Signups keep working, and the messages wait in the queue until the provider returns","The queue sends the emails itself","Users get an error"],"answer":1,"why":"The queue is a buffer between two systems that no longer have to be healthy at the same moment — a dead provider stops emails from being SENT without stopping them from being ACCEPTED. That decoupling is often worth more than the latency win: the failure of a non-essential dependency stops taking down an essential path."}]},{"id":"mq-2","title":"Decoupling and buffering","exercises":[{"id":"mq-2-0","type":"concept","title":"The message belongs to the queue until a worker says it's done","viz":{"nodes":[{"id":"p","label":"Producer","col":0,"kind":"server","sub":"API server"},{"id":"q","label":"Queue","col":1,"kind":"queue","sub":"durable"},{"id":"w1","label":"Worker 1","col":2,"kind":"server"},{"id":"w2","label":"Worker 2","col":2,"kind":"server"},{"id":"w3","label":"Worker 3","col":2,"kind":"server"}],"edges":[{"from":"p","to":"q"},{"from":"q","to":"w1"},{"from":"q","to":"w2"},{"from":"q","to":"w3"}]},"body":"The *producer* puts a message on the queue and moves on. The queue stores it durably. A *consumer* — a worker — pulls it off, does the work, then sends an *acknowledgement*: done, delete it. Look closely at that last step. The queue learns nothing about the work itself, only that one signal — and only ever from a worker that lived long enough to send it.","note":"That buffer is what makes a spike survivable: arrivals may exceed the workers for a while, because a while ends. Everything here rests on that last clause, and the queue will never tell you when it stopped being true."},{"id":"mq-2-1","type":"match_pairs","prompt":"Match each part of a queue system.","pairs":[{"left":"Producer","right":"Puts messages on the queue"},{"left":"Consumer / worker","right":"Takes messages off and does the work"},{"left":"The queue","right":"Durable storage for work not yet done"},{"left":"Acknowledgement","right":"The worker confirming it finished"}],"why":"Producers and consumers never speak to each other — they only touch the queue, which is what lets them be deployed, scaled, and broken independently. The acknowledgement is the load-bearing piece: without it the queue can't distinguish 'done' from 'the worker died holding it'."},{"id":"mq-2-2","type":"multiple_choice","prompt":"Black Friday: uploads spike to 10× normal, far beyond what your video encoders can handle. With a queue in front, what happens?","choices":["The system falls over","Uploads are accepted quickly and the queue grows; workers keep chewing through at their own pace, so the backlog absorbs the spike instead of the users feeling it","Requests are rejected","The workers speed up automatically"],"answer":1,"why":"A queue turns a spike in arrival rate into a spike in queue DEPTH rather than a spike in failures, which is the whole reason to buffer: the users' side stays fast and the backlog just gets longer for a while. That only works if the average rate is sustainable, though — a buffer smooths bursts, and nothing can smooth a permanent excess."},{"id":"mq-2-3","type":"multiple_choice","prompt":"Your queue depth has been growing steadily for six hours. What does that mean?","choices":["The buffer is working as intended","Arrivals are outpacing your workers — this isn't a burst being absorbed, it's a deficit compounding, and it will never recover on its own","The queue is too small","Messages are being lost"],"answer":1,"why":"A queue absorbing a burst rises and then falls; a queue that only rises means arrival rate exceeds service rate, and no amount of waiting fixes that — the gap compounds every second. Depth is therefore your key signal, and its DERIVATIVE is what matters: rising and returning is healthy, monotonically rising means add workers or shed load, now."},{"id":"mq-2-4","type":"multiple_choice","prompt":"How do you make the backlog drain faster?","choices":["Make the queue bigger","Add more consumers — they pull from the same queue independently, and that's exactly the workload that scales horizontally","Restart the queue","Reduce the message size"],"answer":1,"why":"Queued work is usually the ideal horizontal case from unit 11: each message is independent, so two workers never coordinate and ten workers do ten times the work. A bigger queue just gives you more room to fall behind — it changes when you notice the problem, not whether you have one."},{"id":"mq-2-5","type":"multiple_choice","prompt":"A worker crashes halfway through processing a message. What should the queue do?","choices":["Delete the message — it was delivered","Give it to another worker, since it was never acknowledged and therefore was never completed","Retry only if the worker asks","Log an error and move on"],"answer":1,"why":"This is exactly why acknowledgement exists: the queue holds the message as in-flight and only deletes it when a worker confirms success, so a crash means the ack never arrives and the message becomes available again. That in-flight message is state the system must not lose — the same point unit 5 made about work-in-progress — and it's why real queues persist messages to disk rather than holding them in memory."},{"id":"mq-2-6","type":"multiple_choice","prompt":"Does adding a queue make the overall work finish sooner?","choices":["Yes — queues are faster","No — the same work still happens, and the total takes slightly longer with the extra hop. What changed is who waits: the user doesn't","Yes, because workers are optimized","Only for small messages"],"answer":1,"why":"The encoding still takes its two minutes; you've moved it off the user's clock, not shortened it. This is unit 4's split, sharpened: async improves perceived latency and throughput under bursts while slightly worsening end-to-end latency for the task itself — which is a superb trade exactly when nobody is watching the task."}]},{"id":"mq-3","title":"Delivery guarantees","exercises":[{"id":"mq-3-0","type":"concept","title":"The queue can't tell 'the work is done' apart from 'the ack got lost'","body":"A worker acks to say *done, delete it*. When no ack arrives, the queue is left holding a question it has no way to answer: did that worker die before doing the work, or after? From the outside those are identical. So it has to pick an assumption — and whichever one it picks, a particular kind of accident becomes possible forever, by design.","note":"Whatever a queue guarantees, it guarantees about *delivery* — the message arriving. Your worker's side effects are elsewhere, on another machine, with their own idea of 'happened'. No queue has an opinion on those."},{"id":"mq-3-1","type":"multiple_choice","prompt":"A worker finishes the job, then crashes before sending its acknowledgement. What happens to that message?","choices":["It's gone — the work was done","The queue never heard 'done', so it redelivers — and the job runs a second time","The queue detects the work completed","It goes to an error log"],"answer":1,"why":"The queue can only observe acknowledgements, not outcomes, so 'work done but unacked' and 'worker died before starting' look identical from outside — and it must assume the pessimistic one. That gap is unavoidable rather than a bug in any particular queue: there's no way to make finishing the work and confirming it a single atomic act across two machines."},{"id":"mq-3-2","type":"match_pairs","prompt":"Match each delivery guarantee to what it means.","pairs":[{"left":"At-most-once","right":"May be lost, never repeated"},{"left":"At-least-once","right":"Never lost, may be repeated"},{"left":"Exactly-once","right":"The one everyone wants"},{"left":"The common default","right":"At-least-once"}],"why":"You're choosing which failure to accept: ack before working risks losing the job, ack after working risks doing it twice. Almost every real queue defaults to at-least-once because losing work is usually worse than repeating it — which quietly makes duplicate handling your problem."},{"id":"mq-3-3","type":"multiple_choice","prompt":"Your queue is at-least-once. Your worker charges a credit card. What must be true?","choices":["Nothing — duplicates are rare","The worker must be idempotent: processing the same message twice must charge the customer once","The queue must guarantee exactly-once","Retries must be disabled"],"answer":1,"why":"At-least-once means the duplicate isn't a rare accident, it's a documented behaviour that will happen — so a non-idempotent worker on a durable queue is a billing incident waiting for a network blip. For a charge specifically, the fix has to reach the payment provider: derive a stable idempotency key from the message id and pass it in the API call, so the provider collapses the duplicate. A local 'already processed' table isn't enough here — your record and the charge are two different systems, so a crash after the charge but before the record leaves redelivery seeing nothing and charging again. That's the dual-write problem lesson 4 is about, and it's why a local dedup table only works when the record and the effect land in the same transaction, which a third-party charge never does."},{"id":"mq-3-4","type":"multiple_choice","prompt":"Vendors advertise 'exactly-once delivery'. What's actually going on?","choices":["They solved distributed systems","Delivery can't truly be exactly-once across a network, so what's offered is at-least-once delivery plus deduplication — exactly-once EFFECTS, not exactly-once delivery","It only works for small messages","It's a straightforward feature"],"answer":1,"why":"The message may genuinely arrive twice; the system just remembers it saw that id and discards the repeat, which is deduplication wearing a better name. That's a real and useful feature, with real limits — the dedup window is finite, and it only covers the queue's own boundary, so a side effect your worker performs on a third party is still yours to make idempotent."},{"id":"mq-3-5","type":"multiple_choice","prompt":"A message fails, gets retried, fails again — forever. It's blocking the queue and filling your logs. What's it called and what's the fix?","choices":["A slow message; add workers","A poison message: after N attempts, move it to a dead-letter queue so it stops consuming capacity and can be inspected","A duplicate; deduplicate it","A backlog; scale up"],"answer":1,"why":"Some messages can never succeed — malformed payloads, a referenced row that's been deleted — and retrying them forever burns capacity while hiding the failure in noise. A dead-letter queue bounds the damage by giving up after N attempts and setting the message aside intact, which turns an infinite loop into a queue you can actually go and look at."},{"id":"mq-3-6","type":"multiple_choice","prompt":"Your worker retries a failed message immediately, in a tight loop. The downstream service is already struggling. What have you built?","choices":["A resilient retry system","A hammer: your retries add load to the exact service that's failing, so the retries are now part of why it can't recover","Nothing harmful","A rate limiter"],"answer":1,"why":"Immediate retries mean a struggling dependency gets MORE traffic precisely when it needs less, and every retry makes recovery less likely — the classic retry storm. Exponential backoff with jitter is the fix: wait longer after each failure, and randomize so a thousand workers don't retry in perfect unison, which was the 429 lesson from unit 2 now applied on your own side of the wire."}]},{"id":"mq-4","title":"The hard parts","exercises":[{"id":"mq-4-0","type":"concept","title":"The queue is ordered; your workers are not","viz":{"nodes":[{"id":"q","label":"Queue","col":0,"kind":"queue","sub":"in order"},{"id":"w1","label":"Worker 1","col":1,"kind":"server","sub":"takes the 1st"},{"id":"w2","label":"Worker 2","col":1,"kind":"server","sub":"takes the 2nd"},{"id":"d","label":"Database","col":2,"kind":"db","sub":"whichever lands last"}],"edges":[{"from":"q","to":"w1"},{"from":"q","to":"w2"},{"from":"w1","to":"d"},{"from":"w2","to":"d"}]},"body":"Even a queue that hands messages out in order loses that order the instant two workers run at once. Two updates to the same row get pulled a millisecond apart by different workers, and each one finishes when it finishes. *Last write wins* means the last write to *land* — which need not be the last one you sent.","note":"And nothing anywhere reports it. No error, no retry, no alert: the row simply holds a value, the pipeline is 'healthy', and your only evidence that anything went wrong is a user insisting they changed it."},{"id":"mq-4-1","type":"multiple_choice","prompt":"Two messages for the same user: 'update email to A', then 'update email to B'. Your five workers process them in parallel. What can happen?","choices":["They always apply in order","B can land before A, leaving the email as A — the older value wins, permanently","The queue rejects one","Both are applied, ending at B"],"answer":1,"why":"Parallel workers give you no ordering: two messages in flight at once finish whenever they finish, and 'last write wins' means whichever finishes last, not whichever was sent last. Concurrency bought throughput and spent ordering — and the corruption is silent, since nothing errors and the row just holds a stale value forever."},{"id":"mq-4-2","type":"multiple_choice","prompt":"You need those two updates to stay in order. What's the standard approach?","choices":["Use one worker for everything","Partition by a key — route all messages for a given user to the same partition, so that user's messages are ordered while different users still process in parallel","Add timestamps and hope","Disable retries"],"answer":1,"why":"Global ordering means one consumer and no parallelism at all, which throws away the reason you queued the work. Per-key ordering is the useful compromise: order is only guaranteed where you actually need it, and unrelated users remain fully parallel. Note this is unit 15's shard key wearing another hat — you're choosing what must be co-located to stay consistent."},{"id":"mq-4-3","type":"multiple_choice","prompt":"Your worker updates the database, then publishes a message. It crashes in between. What's broken?","choices":["Nothing — the database is correct","The database change happened but the message never went out, so every downstream system is permanently unaware — and there's no error anywhere","The message is queued automatically","The database rolls back"],"answer":1,"why":"A database transaction and a queue publish are two systems, so unit 9's boundary applies: you cannot make both happen atomically by wrapping them in a `BEGIN`. This is the dual-write problem, and the usual answer is the transactional outbox — write the message into a table inside the same transaction as your data change, then have a separate process read that table and publish. One atomic write, and publishing becomes at-least-once delivery from a durable record."},{"id":"mq-4-4","type":"multi_select","prompt":"Which are real costs of moving work behind a queue? Select all.","choices":["You must handle duplicate processing","Ordering is no longer free","Debugging spans two systems and a time gap","The user's request gets slower"],"answer":[0,1,2],"why":"Duplicates come from at-least-once, ordering is surrendered to parallelism, and failures now happen minutes later in a different process with no user waiting to notice — you have to go looking. The user's request gets FASTER, which is the whole point; you paid for it in complexity that lives entirely on your side."},{"id":"mq-4-5","type":"tradeoff_slider","prompt":"A user clicks 'export my data'. Generating it takes about 90 seconds. Slide toward your design.","leftLabel":"Synchronous (simple, user waits 90s)","rightLabel":"Queue it and notify when ready (async, more moving parts)","answerRange":[60,100],"why":"Ninety seconds is far past where a request should live: the browser or a proxy will likely time out, a retry starts the whole job again, and one slow export holds a connection and a worker hostage. Queue it, return 'we'll email you', and the work runs where nothing is waiting on it — the extra machinery is worth it the moment the task outlives a reasonable request."},{"id":"mq-4-6","type":"multiple_choice","prompt":"Your queue backlog is 4 million messages and workers are at max. Adding workers hits the database's write limit. What now?","choices":["Add more workers anyway","The bottleneck moved downstream — the queue was never the constraint, so you must shed load, batch the writes, or scale the database","Purge the queue","Increase the retry interval"],"answer":1,"why":"The queue faithfully absorbed everything and handed the problem to the next stage: your real limit is the database's write rate, and unit 4's rule says capacity added anywhere but the bottleneck buys nothing. That's the queue's dark side — it hides a capacity deficit behind a growing number instead of failing loudly, so you discover the true constraint with four million messages of debt already accrued."},{"id":"mq-4-7","type":"multiple_choice","prompt":"What's the honest summary of queues?","choices":["They make systems faster and more reliable automatically","They take work off the user's clock and decouple systems that shouldn't fail together — and charge you in duplicates, lost ordering, delayed failures, and backlogs that hide a deficit","They're only for very large systems","They guarantee work is never lost"],"answer":1,"why":"A queue converts a synchronous fact into a durable promise, which is exactly what buys the speed and the decoupling — and exactly what creates every cost. The promise can be fulfilled twice, out of order, much later, or pile up unfulfilled, and none of those failures has a user watching to report them. That's the trade: the user stops waiting, and you take on the job of making sure the promise is kept."}]}]};

const UNIT17 = {"unitId":"rate-limiting","title":"Rate Limiting","subtitle":"Saying no early, so you can keep saying yes","lessons":[{"id":"rl-1","title":"Saying no on purpose","exercises":[{"id":"rl-1-0","type":"concept","title":"A server with no limit doesn't refuse the extra work — it queues it, in a line everybody is standing in","body":"A server has a fixed capacity — some number of requests it can actually serve each second. Send more and it doesn't bounce the excess; it queues it. And the queue is shared: one client's flood joins the same line as everyone else's requests, ahead of some of them, and a line that can't drain ends in timeouts. A limit decides *who* gets refused, before that.","note":"A limit doesn't create capacity — it decides how the capacity you already have gets handed out. That's admission control, and every hard question in this unit is a version of the same one: who gets the yes?"},{"id":"rl-1-1","type":"multiple_choice","prompt":"Your API can serve 1,000 requests/second. One client starts sending 50,000/second. With no limit, what happens?","choices":["The extra requests are ignored harmlessly","Everything queues, latency explodes, and every OTHER client's requests get slow or fail too","Only that client is slow","The server rejects them automatically"],"answer":1,"why":"Without a limit there's no such thing as 'that client's problem' — the flood consumes shared capacity, so unit 4's queueing arrives and everybody's latency explodes together. The blast radius is what makes this urgent: one misbehaving script degrades every well-behaved customer you have, and none of them did anything wrong."},{"id":"rl-1-2","type":"fill_blank","prompt":"______ limiting caps how many requests a client may make in a given period.","choices":["Rate","Load","Bandwidth","Session"],"answer":0,"why":"You define a budget per client per period, and requests beyond it are refused rather than served — which is what stops one caller consuming everyone's capacity."},{"id":"rl-1-3","type":"multiple_choice","prompt":"Why is rejecting a request instantly better than accepting it and being slow?","choices":["It isn't — serving something is always better","A fast rejection costs almost nothing and leaves capacity for everyone else, while a slow acceptance consumes resources and often ends in a timeout anyway","Rejections are cached","It's easier to implement"],"answer":1,"why":"An overloaded system that keeps accepting work does the work badly and then times out, having spent the resources and delivered nothing — you paid full price for a failure. Rejecting early spends microseconds and protects the requests you can still serve, which is why load shedding is a feature rather than an admission of defeat: a system that refuses 10% cleanly beats one that fails 100% slowly."},{"id":"rl-1-4","type":"multiple_choice","prompt":"Which status code says 'you're over your limit'?","choices":["`503 Service Unavailable`","`429 Too Many Requests`","`403 Forbidden`","`500 Internal Server Error`"],"answer":1,"why":"429 is the specific, machine-readable signal that the request was fine but you've sent too many — and it matters that it's distinct from 503, because 429 tells the client the fix is to slow down while 503 says the service itself is unwell. Pair it with a `Retry-After` header and a well-behaved client knows exactly how long to wait rather than guessing."},{"id":"rl-1-5","type":"multi_select","prompt":"What does rate limiting protect you from? Select all.","choices":["A buggy client stuck in a retry loop","One customer's traffic degrading everyone else's","Deliberate abuse and scraping","A slow database query"],"answer":[0,1,2],"why":"Runaway loops, noisy neighbours, and abuse are all the same shape — too many requests from one source — and a limit is the tool for exactly that shape. A slow query is a different problem entirely: it's one request doing too much work, which limits won't touch. In practice the accidental cases dominate: most floods are somebody's retry loop, not an attacker."},{"id":"rl-1-6","type":"multiple_choice","prompt":"Your limit is 100 requests/minute per user. A user hits 101. What should you NOT do?","choices":["Return 429 with `Retry-After`","Silently drop the request and leave the client hanging until it times out","Log it for monitoring","Let them through if you have spare capacity"],"answer":1,"why":"Silently dropping gives the client no information, so it waits out a full timeout and then very likely retries — you've spent a connection, taught them nothing, and probably invited the flood back. An explicit 429 costs almost nothing and lets a well-behaved client back off correctly, which is the entire point: you want limits that make good clients behave, not limits that punish them ambiguously."}]},{"id":"rl-2","title":"How to count","exercises":[{"id":"rl-2-0","type":"concept","title":"'100 per minute' means nothing until you say *which* minute","body":"The simplest counter resets at the top of each minute: count, reject past 100, zero it at `:00`. It tracks *how many* landed in the bucket and never *where* in the bucket they landed — and at `:00` it hands out a fresh allowance regardless of what happened a second earlier. The rule is never broken. The window's edge is the hole.","note":"Every alternative is a different answer to one question: how much burst will you tolerate? Some refuse bursts, some permit them deliberately, some flatten them away entirely. Naming that axis is most of the choice."},{"id":"rl-2-1","type":"multiple_choice","prompt":"Simplest approach: count requests per user per minute, reset to zero at the top of each minute. Limit is 100. What can a client do?","choices":["Nothing — they're capped at 100/minute","Send 100 at 10:00:59 and 100 more at 10:01:00 — 200 requests in one second, while never breaking the rule","Only exceed it by a few requests","Bypass the limit entirely"],"answer":1,"why":"A fixed window counts within a bucket and doesn't care where in the bucket the requests land, so traffic at a boundary lets a client legally sustain double the rate across it. That's the fixed-window boundary problem, and it's why the simplest counter can permit exactly the burst you were trying to prevent — the rule was honoured and the intent wasn't."},{"id":"rl-2-2","type":"match_pairs","prompt":"Match each algorithm to how it behaves.","pairs":[{"left":"Fixed window","right":"Simple counter per period — allows 2× bursts at boundaries"},{"left":"Sliding window","right":"Counts the last 60 seconds continuously — no boundary trick"},{"left":"Token bucket","right":"Tokens refill steadily; spend them in bursts if you've saved up"},{"left":"Leaky bucket","right":"Drains at a fixed rate — smooths output completely"}],"why":"They differ mainly in how they treat bursts: fixed window permits them accidentally, sliding window forbids them, token bucket permits them deliberately up to the bucket size, and leaky bucket refuses to emit them at all. Choosing between them is really deciding how much burstiness you want to tolerate."},{"id":"rl-2-3","type":"multiple_choice","prompt":"Token bucket: tokens refill at 10/second, bucket holds 100. A client idle for a minute suddenly needs 80 requests at once. What happens?","choices":["They're limited to 10 requests","They have a full bucket from being idle, so all 80 go through immediately — and then they're back to 10/second","They're rejected","The bucket overflows"],"answer":1,"why":"Unused capacity accumulates as tokens up to the bucket's size, so an idle client can spend that saving in one burst and then falls back to the refill rate. This is why token bucket is so popular for APIs: it matches how real clients behave — mostly quiet, occasionally busy — and the bucket size lets you say exactly how big a burst you'll forgive while the refill rate still caps the long-run average."},{"id":"rl-2-4","type":"multiple_choice","prompt":"When would you choose leaky bucket over token bucket?","choices":["When you want to allow bursts","When the thing downstream cannot handle bursts at all and you need a perfectly smooth output rate","When you need it to be simpler","When clients are trusted"],"answer":1,"why":"Leaky bucket emits at a constant rate no matter how spiky the arrivals, which is what you want when the downstream is fragile — a legacy system or a device that falls over on a spike. You're trading responsiveness for smoothness: a burst that token bucket would pass instantly gets stretched out instead, so callers wait even when capacity was momentarily free."},{"id":"rl-2-5","type":"multiple_choice","prompt":"Why is a true sliding window log — storing a timestamp for every request — often impractical?","choices":["It's inaccurate","It's exact but costs memory proportional to your request volume: every request from every client must be stored and expired","It can't handle bursts","It only works on one server"],"answer":1,"why":"Keeping every timestamp gives a perfectly precise window, and it makes your memory bill scale with traffic — at millions of requests a second you're storing millions of timestamps just to count. Which is why the common compromise is a sliding window counter that approximates by weighting the previous window: it's slightly wrong at the edges, and it's a fixed small cost per client rather than a growing one."},{"id":"rl-2-6","type":"multiple_choice","prompt":"So which algorithm should you reach for by default on a public API?","choices":["Fixed window — it's simplest","Token bucket — it forgives the bursts real clients naturally produce while still capping the sustained rate","Leaky bucket — it's the smoothest","Sliding window log — it's the most accurate"],"answer":1,"why":"Real clients are bursty in harmless ways — a page loads and fires eight requests — and a limiter that punishes that generates support tickets rather than protection. Token bucket handles it by design: bucket size forgives the burst, refill rate governs the average, and both are numbers you can explain to a customer, which matters more than theoretical precision."}]},{"id":"rl-3","title":"Where the counter lives","exercises":[{"id":"rl-3-0","type":"concept","title":"A counter in one server's memory doesn't limit your client — it limits your client *per server*","viz":{"nodes":[{"id":"c","label":"One client","col":0,"kind":"client","sub":"300/min"},{"id":"lb","label":"Load Balancer","col":1,"kind":"lb"},{"id":"s1","label":"Server 1","col":2,"kind":"server","sub":"saw 100"},{"id":"s2","label":"Server 2","col":2,"kind":"server","sub":"saw 100"},{"id":"s3","label":"Server 3","col":2,"kind":"server","sub":"saw 100"}],"edges":[{"from":"c","to":"lb"},{"from":"lb","to":"s1"},{"from":"lb","to":"s2"},{"from":"lb","to":"s3"}]},"body":"Each server counts what it personally saw, and the load balancer sprays one client across all of them. Three servers each enforcing '100 per minute' let that client send 300 a minute while not one of them ever sees a violation. The counters multiply by your server count: 50 servers at 1,000 rps each is a real limit of 50,000 rps.","note":"The fix follows from the diagnosis: exactness needs one place to count, so the counter has to leave the servers and move somewhere they all share. Nothing in this unit is free, and that move is no exception."},{"id":"rl-3-1","type":"multiple_choice","prompt":"You run 10 servers. Each keeps its own in-memory counter with a limit of 100/minute per user. What's the client's real limit?","choices":["100 per minute","Up to 1,000 per minute — each server only counts what it personally saw, and the load balancer spreads the client across all ten","10 per minute","It depends on the algorithm"],"answer":1,"why":"A local counter can only count local traffic, so with N servers your effective limit is roughly N × the configured value — you wrote 100 and shipped 1,000. This is unit 5's lesson arriving again: the counter is state, and state kept locally on interchangeable machines means each machine holds a different fragment of the truth."},{"id":"rl-3-2","type":"multiple_choice","prompt":"So you move the counter to a shared store like Redis. What did that cost you?","choices":["Nothing","A network round trip on every single request, plus a dependency that can fail — and if it's down, you must decide whether to allow everything or block everything","Only memory","Accuracy"],"answer":1,"why":"Exactness requires one place to count, and one place means a network hop in front of every request plus a component whose failure is now your failure. That last decision deserves thought before the incident: fail-open lets a flood through when Redis dies, fail-closed takes your API down to protect it — and 'we never decided' means you'll discover your default at 3am."},{"id":"rl-3-3","type":"multiple_choice","prompt":"Why do many real systems combine a local counter with a shared one?","choices":["For redundancy","A local check sheds obvious abuse with no network hop, while the shared store does the exact accounting for everything that gets past it","It's cheaper","It's simpler to build"],"answer":1,"why":"A client sending 50,000/second doesn't need precise accounting — the local counter can reject it instantly for free, so the flood never reaches Redis at all. The shared store then handles the borderline cases where precision actually matters, which is a nice general pattern: put a cheap approximate filter in front of an expensive exact one, and the expensive one only sees what's worth being exact about."},{"id":"rl-3-4","type":"tradeoff_slider","prompt":"You're rate-limiting a free tier where the limit is generous and being slightly over costs you nothing. Slide toward where the counter lives.","leftLabel":"Local per-server (fast, approximate)","rightLabel":"Shared store (exact, adds a hop)","answerRange":[0,40],"why":"If a user occasionally getting 3× a generous free limit costs you nothing, paying a Redis round trip on every request to prevent it is a bad trade — you've added latency and a failure mode to enforce a number that was arbitrary anyway. Contrast a paid quota that maps to real money, where exactness is the product and the hop is worth it. The counter's home follows the cost of being wrong."},{"id":"rl-3-5","type":"multiple_choice","prompt":"Where should the rate limiter sit in your stack?","choices":["Deep in the application, after auth and database lookups","As early as possible — at the edge or gateway — so rejected requests consume almost nothing","In the database","In the client"],"answer":1,"why":"The value of a rejection is proportional to how little it cost you, so a limiter that runs after you've parsed a body, authenticated, and hit the database has already spent everything you were trying to save. Push it to the edge and a 429 costs a lookup and a header. Client-side limiting is a courtesy, not a control — anything the client enforces, a hostile or broken client simply won't."},{"id":"rl-3-6","type":"multiple_choice","prompt":"What should you limit on — what's the key?","choices":["Always the IP address","It depends: API key or user id when you can identify the caller, IP as a fallback — but IP punishes everyone behind one office NAT","Always the user id","The URL path"],"answer":1,"why":"The key defines who shares a budget, so getting it wrong means either collective punishment or trivial evasion. An authenticated identity is precise — the account is the thing you have a relationship with. IP is the fallback for anonymous traffic and it's blunt: a whole company behind one NAT looks like one abusive client, while a distributed attack looks like thousands of innocent ones."}]},{"id":"rl-4","title":"The hard parts","exercises":[{"id":"rl-4-0","type":"concept","title":"A rejection is cheap — unless it comes straight back","body":"A `429` costs almost nothing to send: no auth, no database, just a header. That is the entire economics of rate limiting. But cheap is not free, the cost is charged once per rejection, and the one thing you don't control is how soon a refused client comes back. Your limit governs what you accept. It never governed what arrives.","note":"`Retry-After` is how you try to influence that: it tells a refused client exactly when to come back. Notice what it is — an instruction about *time*, given to all of them at once. Obedience isn't automatically good news."},{"id":"rl-4-1","type":"multiple_choice","prompt":"You start returning 429s. Clients retry immediately on every 429. What happens?","choices":["The limit works fine","You've created a tighter loop: rejected clients retry instantly, so you now handle MORE requests than before — all of them rejections","The clients give up","Traffic halves"],"answer":1,"why":"Rejecting is cheap but not free, and a client that retries the instant it's refused converts your limit into a busy-loop generator — you're spending real capacity manufacturing 429s. That's why `Retry-After` and backoff matter: the limit only works if the answer changes the client's behaviour, otherwise you've just made refusing people your main workload."},{"id":"rl-4-2","type":"multiple_choice","prompt":"A thousand clients all get rate-limited at 10:00:00 and all obey '`Retry-After`: 60'. What happens at 10:01:00?","choices":["Traffic resumes smoothly","All thousand retry in the same instant — a synchronized thundering herd, caused by every client following the rules perfectly","They're rejected again","The limit prevents it"],"answer":1,"why":"Telling everyone the same number makes them agree on the same moment, so obedience produces a spike — the clients did exactly what you asked and that's what hurt you. The fix is jitter: randomize the wait so retries spread across an interval instead of stacking on a boundary. Any time you give many clients an identical instruction about time, you're scheduling a stampede."},{"id":"rl-4-3","type":"multi_select","prompt":"Which make a rate limit friendlier to legitimate clients? Select all.","choices":["Returning `Retry-After` so they know exactly how long to wait","Headers showing limit, remaining, and reset time","Allowing a burst above the sustained rate","Rejecting silently to save bandwidth"],"answer":[0,1,2],"why":"`Retry-After`, quota headers, and a burst allowance all let a well-built client self-regulate before it ever gets refused — which is what you actually want, since a client that never trips the limit costs you nothing. Silence does the reverse: it forces clients to discover your limit by hitting it, which means guessing, and guessing means retry storms."},{"id":"rl-4-4","type":"multiple_choice","prompt":"Your limits are per-endpoint at 1,000/minute each. A client calls 20 endpoints. What did you actually authorize?","choices":["1,000 requests/minute","20,000 requests/minute — per-endpoint limits multiply, so the total was never bounded","It depends on the endpoints","Nothing changes"],"answer":1,"why":"Limits compose by adding up, so a set of individually reasonable per-endpoint budgets can sum to something absurd — you bounded each door and left the building open. If total load is what you care about, you need a limit on the total, and per-endpoint caps then exist for a different purpose: protecting one expensive endpoint from consuming the budget that cheap ones could have shared."},{"id":"rl-4-5","type":"multiple_choice","prompt":"One endpoint runs a 30-second report; another returns a cached string in 2ms. Should they share one 'requests per minute' limit?","choices":["Yes — a request is a request","No — counting requests treats those as equal when one costs 15,000× more, so you should weight by cost or limit expensive endpoints separately","Yes, but with a higher limit","No, remove the limit on the fast one"],"answer":1,"why":"A request-count limit is a proxy for load, and it's a good proxy only while requests cost roughly the same — the moment they don't, the number stops describing anything real. A client burning your fleet on reports looks identical to one fetching cached strings. Either weight requests by cost (charging more tokens for expensive ones) or give the expensive endpoint its own much lower limit."},{"id":"rl-4-6","type":"multiple_choice","prompt":"A customer complains your limits are 'hostile'. What's the honest counter-argument?","choices":["Limits exist to save us money","Limits are what keep the API available for them: without one, any other client's runaway loop degrades their experience too","Everyone has limits","They should upgrade their plan"],"answer":1,"why":"A limit isn't a restriction on a good client so much as a guarantee to them — it's the mechanism ensuring nobody else's mistake becomes their outage. That's genuinely true and worth saying plainly, provided your limits are actually set to protect capacity rather than to sell upgrades. Which is the real design question: is this number derived from what you can serve, or from what you'd like to charge?"},{"id":"rl-4-7","type":"multiple_choice","prompt":"What's the honest summary of rate limiting?","choices":["It's a security feature that stops attacks","It's how you refuse work cheaply so the work you accept stays fast — and it costs you a counter that must live somewhere, a key choice that decides who shares a budget, and clients whose retry behaviour you can influence but not control","It's only needed for public APIs","It slows everyone down equally"],"answer":1,"why":"Rate limiting is admission control: capacity is finite, so something must decide what gets in, and doing it early and explicitly beats discovering it through collapse. Every hard part in this unit came from that counter being state — where it lives, who shares it, what it counts — which is unit 5's question one more time, now standing at your front door."}]}]};

const UNIT18 = {"unitId":"cap-theorem","title":"CAP Theorem","subtitle":"When the network splits, you must choose — and you don't get to choose whether to choose","lessons":[{"id":"cap-1","title":"The forced choice","exercises":[{"id":"cap-1-0","type":"concept","title":"A partition leaves a node exactly two options, and both of them are bad","body":"The link between two datacenters drops. Every machine is up; every user still reaches one side or the other. That's a *partition*, and it puts a node in a strange position: its own copy is now the only evidence it has, and it cannot tell whether the world has moved on without it. Then a read arrives. It has two possible answers, and only two.","note":"So the theorem is narrower than the slogan. It isn't offering three properties to shop among — it describes one node's options at a moment when the network has already decided something for you."},{"id":"cap-1-1","type":"multiple_choice","prompt":"Two datacenters hold copies of your data. The network link between them fails, but both are alive and users are hitting both. A user writes to datacenter A. What can datacenter B do about it?","choices":["Apply the write immediately","Nothing — it cannot hear about the write, so it must either serve data it knows might be stale, or refuse to answer","Reject the user's write","Ask the user to wait"],"answer":1,"why":"B has no way to learn about A's write while the link is down, so it faces two options and only two: answer with what it has and risk being wrong, or refuse to answer until it can be sure. That fork is the entire content of CAP — it isn't a theory about database vendors, it's what physically remains possible when two machines cannot talk."},{"id":"cap-1-2","type":"match_pairs","prompt":"Match each letter of CAP to what it means.","pairs":[{"left":"Consistency","right":"Every read sees the most recent write"},{"left":"Availability","right":"Every request gets a non-error response"},{"left":"Partition tolerance","right":"The system keeps working when the network splits"},{"left":"A partition","right":"Nodes alive, but unable to reach each other"}],"why":"Note that CAP's Consistency is a stricter thing than ACID's C from unit 9 — here it means reads reflect the latest write, not 'your constraints hold'. Same letter, different promise, and conflating them has confused engineers for two decades."},{"id":"cap-1-3","type":"multiple_choice","prompt":"CAP is usually taught as 'pick two of three'. Why is that misleading?","choices":["Because you can actually have all three","Because partitions aren't a design choice — networks fail whether you like it or not, so P isn't something you can decline","Because there are really four properties","Because it only applies to NoSQL"],"answer":1,"why":"You can't opt out of the network failing any more than you can opt out of weather, so 'choosing CA' really means 'choosing to have no plan for a partition' — which isn't a design, it's an omission. The honest statement is narrower and more useful: WHEN a partition happens, you must choose between consistency and availability. The rest of the time the question isn't being asked."},{"id":"cap-1-4","type":"multiple_choice","prompt":"So what does a 'CA system' actually describe?","choices":["A well-designed distributed system","A single node — no partition is possible when there's nothing to partition from. Distributed systems don't get this option","A system with perfect networking","A system using two-phase commit"],"answer":1,"why":"Partitions are a property of having more than one machine, so the only genuine CA system is one that isn't distributed at all — which is a real and often excellent choice, and it's exactly the single box unit 11 defended. The moment you add a second machine you've bought into P, and with it the choice you now have to make deliberately."},{"id":"cap-1-5","type":"fill_blank","prompt":"A network ______ is when nodes are alive but can't reach each other.","choices":["partition","outage","failure","timeout"],"answer":0,"why":"The nodes are healthy and doing their jobs — it's the path between them that's broken, which is what makes it so much nastier than a clean crash. A dead node stops answering; a partitioned node keeps happily answering, with a view of the world that's drifting away from its peers."},{"id":"cap-1-6","type":"multiple_choice","prompt":"During a partition, why can't a node just tell whether it's the one that's cut off?","choices":["It can — it checks its network card","It can't: from inside, 'the other node is dead', 'the other node is slow', and 'I am the one who's isolated' all look identical","It asks the load balancer","It checks a timestamp"],"answer":1,"why":"All a node observes is silence, and silence has many causes it cannot distinguish — this is the same undecidable 'dead or just slow?' from units 10 and 12, which is why it keeps reappearing. A partition doesn't announce itself; both sides just notice the other has gone quiet, and each may conclude it's the survivor."}]},{"id":"cap-2","title":"CP: refusing to be wrong","exercises":[{"id":"cap-2-0","type":"concept","title":"A CP system would rather be down than be wrong","body":"Choosing consistency means choosing to refuse. When the network splits, a node that cannot confirm it holds the latest data has exactly one honest move left, and it is not to guess. So perfectly healthy machines stop serving. Nobody reads a wrong value there because nobody reads at all. That isn't the design failing; it *is* the design.","note":"But *which* side stops? Both look identical from the inside, so the rule can't rely on either one knowing it's the odd one out. It has to be a test that only one side of any split can pass — arithmetic, not judgement."},{"id":"cap-2-1","type":"multiple_choice","prompt":"A partition splits your cluster. You choose consistency. What does a user on the minority side experience?","choices":["Slightly stale data","Errors or timeouts — the system refuses to serve rather than risk answering with data it can't verify","Normal service","Their writes queue up and apply later"],"answer":1,"why":"Choosing consistency means choosing to fail rather than to guess, so a node that can't confirm it has the latest data must decline — and 'decline' is what the user sees as an error. That's the honest shape of CP: the system stays correct by becoming partly unavailable, and the unavailability is the mechanism, not a bug in it."},{"id":"cap-2-2","type":"multiple_choice","prompt":"How does a CP system decide which side of a partition may keep serving?","choices":["The bigger machine wins","A quorum — the side holding a majority of nodes can proceed, and the minority steps back, because only one side can hold a majority","Both sides serve","The side with the newest data"],"answer":1,"why":"Majority is the trick that makes it safe: with an odd number of nodes, at most one side of any split can have more than half, so a quorum rule guarantees the two sides can never both believe they're in charge. That's precisely the split-brain from unit 10 being prevented by arithmetic instead of hope — and it's why cluster sizes are odd, since 3 tolerates one failure while 4 tolerates exactly the same one and costs more."},{"id":"cap-2-3","type":"multiple_choice","prompt":"5-node cluster, quorum of 3. A partition leaves 3 nodes on one side and 2 on the other. What happens?","choices":["Both sides keep serving","The 3-node side has a majority and continues; the 2-node side must stop accepting writes even though those nodes are perfectly healthy","The whole cluster stops","The 2-node side becomes read-only automatically"],"answer":1,"why":"The minority nodes aren't broken — they're working fine and simply can't prove they aren't missing writes, so they must stand down. This is CP's bargain stated plainly: you deliberately give up capacity that physically exists in order to guarantee no one is served a wrong answer. Users on the minority side are down, and that's the design working."},{"id":"cap-2-4","type":"multi_select","prompt":"Which systems should lean CP? Select all.","choices":["A bank ledger","An inventory count during checkout","A distributed lock service","A view counter on a video"],"answer":[0,1,2],"why":"Money, stock, and locks share a property: a wrong answer creates a real-world commitment you can't take back — you've double-spent, oversold, or handed the same lock to two owners. Refusing to answer is recoverable; answering wrongly isn't. A view counter is the opposite, where being briefly wrong costs nothing at all."},{"id":"cap-2-5","type":"multiple_choice","prompt":"A distributed lock service goes AP — both sides of a partition keep granting locks. What breaks?","choices":["Nothing significant","Two clients hold 'the same' lock simultaneously, which destroys the only property a lock exists to provide","Locks become slow","Locks expire early"],"answer":1,"why":"A lock's entire value is that exactly one holder exists, so a lock service that stays available during a partition by granting both sides isn't a degraded lock — it's not a lock. This is the clearest case where availability is worthless: an always-available service that doesn't do its job has no reason to exist, which is why lock services are firmly CP and simply go down rather than lie."},{"id":"cap-2-6","type":"multiple_choice","prompt":"What's the real cost of choosing CP?","choices":["Slower reads","Downtime for anyone who can't reach a quorum — you've converted a network problem into a visible outage, on purpose","More storage","Data loss"],"answer":1,"why":"CP doesn't make the partition go away, it decides who suffers from it: instead of quiet wrong answers you get loud errors, which are far easier to notice and reason about. That's a genuine feature — a system that fails visibly is one you can respond to — but be clear that you chose an outage, and a user staring at an error doesn't care that it was principled."}]},{"id":"cap-3","title":"AP: answering anyway","exercises":[{"id":"cap-3-0","type":"concept","title":"An AP system always has an answer — it just might not be *the* answer","body":"Choosing availability means choosing to answer anyway. Both sides of a split keep serving from their own copies, so nobody gets an error and some people get data missing the other side's writes. The real cost isn't the stale read, though. It's whatever the two sides have quietly accumulated by the time the network comes back.","note":"And you will have a merge rule whether you write one or not. Every system has a default — and defaults are chosen by whoever wrote the library, never by whoever understands what your data actually means."},{"id":"cap-3-1","type":"multiple_choice","prompt":"Same partition, but you choose availability. What does the user on the minority side experience?","choices":["An error","A normal response — served from that node's own copy, which may be missing writes that happened on the other side","A long wait, then success","Read-only access"],"answer":1,"why":"AP keeps answering with local knowledge, so nobody sees an error and some people see the past — the failure moves from visible to invisible. That's often exactly right: for a social feed, a comment appearing a few seconds late is nothing, while an error page is a real problem the user will actually notice and resent."},{"id":"cap-3-2","type":"multiple_choice","prompt":"During an AP partition, users on both sides edit the same record. The network heals. What now?","choices":["The system picks the correct one automatically","You have two divergent versions and must reconcile them — and there's no universally right answer for which edit should win","Both edits are lost","The later timestamp is always correct"],"answer":1,"why":"AP's bill comes due at healing time: both sides accepted writes in good faith, so you now hold two histories and must merge them with rules you invented. 'Last write wins' is the common choice and it silently discards someone's work — and it leans on clocks from different machines agreeing, which is its own well-known trap."},{"id":"cap-3-3","type":"match_pairs","prompt":"Match each conflict resolution strategy.","pairs":[{"left":"Last write wins","right":"Simple — and silently destroys one edit"},{"left":"Keep both versions","right":"Push the choice to the user or app"},{"left":"CRDTs","right":"Structure the data so merges can't conflict"},{"left":"Domain rules","right":"'Add to cart' merges; 'set quantity' doesn't"}],"why":"The choice depends entirely on what the data means, which is why no database can solve it for you. Notice the last row: an operation expressed as 'add this item' merges cleanly from both sides, while the same intent expressed as 'the cart now contains N' cannot — so how you model the write decides whether conflicts are resolvable at all."},{"id":"cap-3-4","type":"multiple_choice","prompt":"Why is a shopping cart the classic AP example?","choices":["Carts are small","Amazon reasoned that a customer being unable to add to cart is a lost sale, while a rare merge oddity is a recoverable annoyance — availability was worth more than perfect consistency","Carts don't need consistency","Carts are read-only"],"answer":1,"why":"The reasoning is about business cost rather than technology: refusing an add-to-cart is revenue that vanishes, and a resurrected item is something the customer can just remove at checkout. Notice they didn't abandon consistency everywhere — the actual purchase and payment are far stricter. Different data in the same system gets different answers, because different data has a different cost of being wrong."},{"id":"cap-3-5","type":"multi_select","prompt":"Which systems reasonably lean AP? Select all.","choices":["A social media feed","DNS","A 'likes' counter","An account balance shown before a transfer"],"answer":[0,1,2],"why":"Feeds, DNS, and like counts all tolerate being briefly behind — DNS is aggressively AP by design, which is why a record change takes time to propagate and nobody considers that a bug. A balance is different: showing a stale number right before someone commits to a transfer invites a decision they'd not have made, so staleness there has a real cost."},{"id":"cap-3-6","type":"multiple_choice","prompt":"What's the real cost of choosing AP?","choices":["Slower writes","Some users act on stale data, and after the partition heals you own a reconciliation problem that no library can decide for you","More servers","Nothing — AP is strictly better for user experience"],"answer":1,"why":"AP trades a visible failure now for a silent divergence you must resolve later, which is genuinely the better trade for a lot of data — and the cost is real and lands somewhere quieter. Nobody gets paged, so the wrongness lives in your data rather than your dashboard, and the merge rules are a design decision you'll be making with tired hands after the incident if you don't make them now."}]},{"id":"cap-4","title":"CAP in the real world","exercises":[{"id":"cap-4-0","type":"concept","title":"The theorem describes a rare emergency, not the system you run every day","body":"CAP is a statement about partitions, and only about partitions. That should bother you more than it does: your network is fine almost all of the time, so for almost your system's whole life the theorem is silent. So what constrains you the rest of the time? Something has to make a node's answer *correct*, and that something has a price.","note":"That something is coordination: a node can't know it holds the latest write without asking someone who might. How far the ask goes, how many it waits for — that's the design you operate. CAP is what you rehearse for."},{"id":"cap-4-1","type":"multiple_choice","prompt":"Your network is healthy — no partition at all. Does CAP say anything about your system right now?","choices":["Yes — you must still pick two","No — CAP only constrains you DURING a partition. With a healthy network you can have both consistency and availability","Yes — consistency is always impossible","It depends on your database"],"answer":1,"why":"CAP is a statement about one specific failure mode, and outside it the theorem is simply silent — which is why 'we're an AP system' as a permanent identity is a category error. The right reading is conditional: when a partition happens, here's what we do. The other 99.9% of the time, that choice isn't being exercised at all."},{"id":"cap-4-2","type":"multiple_choice","prompt":"So if CAP is silent when the network is fine, what tradeoff still exists during normal operation?","choices":["None","Latency versus consistency: to be strongly consistent you must coordinate with other nodes, and coordination costs a round trip on every operation","Storage versus speed","Cost versus reliability"],"answer":1,"why":"Confirming you have the latest data means asking someone else, and asking someone else takes time — so strong consistency is bought with latency on the happy path, every single day. This is what PACELC adds to CAP: else (no partition), you're trading Latency against Consistency, which is the tradeoff you actually live with continuously rather than during rare failures."},{"id":"cap-4-3","type":"multiple_choice","prompt":"Why does that latency-vs-consistency tradeoff matter more day to day than CAP itself?","choices":["It doesn't — partitions are common","Because partitions are rare while every request pays the coordination cost, so the everyday tradeoff shapes your system far more than the rare one","Because latency is easier to measure","Because consistency is optional"],"answer":1,"why":"You'll meet a partition a handful of times a year and the coordination cost on every request today — so a design chosen entirely around CAP optimizes for the rare case while ignoring the constant one. That's also unit 4's physics reasserting itself: a cross-region quorum means waiting for a machine 150ms away, and no protocol negotiates with the speed of light."},{"id":"cap-4-4","type":"tradeoff_slider","prompt":"You're designing 'number of people currently viewing this page'. A partition splits your cluster. Slide toward your choice.","leftLabel":"CP — refuse rather than show a wrong count","rightLabel":"AP — show a possibly-stale count","answerRange":[65,100],"why":"The count is decorative: nobody makes a decision from it, and being off by a few during a partition costs precisely nothing, while an error where a number should be looks broken. This is the whole method — ask what a wrong answer actually costs, and here it costs less than no answer. Run the same question on a bank balance and you'll slide to the opposite end."},{"id":"cap-4-5","type":"multiple_choice","prompt":"A vendor says their database is 'CA — no compromises'. What should you conclude?","choices":["It's a breakthrough","It's marketing: either it's a single node, or it silently picks CP or AP during a partition and isn't telling you which","It uses a better algorithm","It's the right choice for everything"],"answer":1,"why":"Nobody has repealed the theorem, so a distributed 'CA' system is one that hasn't told you its behaviour during a partition — and that behaviour exists whether documented or not. The question worth asking a vendor is concrete: during a partition, does the minority side serve reads, and what happens to writes? A good answer is specific; a bad one repeats the marketing."},{"id":"cap-4-6","type":"multiple_choice","prompt":"Should one system pick CP or AP for all its data?","choices":["Yes — mixing them is incoherent","No — different data has different costs of being wrong, so the same product can be CP for payments and AP for the activity feed","Yes — the database decides for you","Only large systems can mix"],"answer":1,"why":"CAP applies per operation and per dataset rather than per company, and treating it as an identity forces every piece of data to inherit the strictness that only your money needed. Real systems mix deliberately: strict where a wrong answer creates an irreversible commitment, relaxed where staleness is a shrug — which is the same 'what does being wrong cost?' question that has run through every unit since state."},{"id":"cap-4-7","type":"multiple_choice","prompt":"What's the honest summary of CAP?","choices":["Pick two of three","During a partition you must choose between refusing to answer and risking a stale answer — and the rest of the time, the live tradeoff is consistency against latency","Distributed systems can't be consistent","Availability always wins"],"answer":1,"why":"CAP isn't a menu, it's a constraint that activates during a specific failure and forces a choice you'd rather not make — with PACELC's 'else' clause covering the far more common case where you're paying coordination latency instead. What both really say is that the network is a real, physical thing, and any design pretending otherwise is choosing its failure mode by accident."}]}]};
