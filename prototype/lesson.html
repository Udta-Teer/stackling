<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackling — How the Internet Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Stackling brand — "blueprint at night" */
  :root{
    --disp:'Bricolage Grotesque',-apple-system,system-ui,sans-serif;
    --body:'Inter',-apple-system,system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --bg:#071522; --card:#0d2438; --card2:#12314b;
    --ink:#eaf1f8; --muted:#9db4cc; --line:rgba(76,176,255,.16);
    --blueprint:#1e5aa8; --blueprint-dk:#12406f; --blue:#4cb0ff;
    --signal:#ffb020;
    --green:#35d0a5; --green-dark:#35d0a5; --green-soft:rgba(53,208,165,.15);
    --red:#ff5c7a; --red-soft:rgba(255,92,122,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(76,176,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(76,176,255,.05) 1px,transparent 1px);background-size:28px 28px;}
  .mark{width:var(--s,32px);height:var(--s,32px);flex:none}
  .brand{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink);}
  .app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px;}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
  .close{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;}
  .bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .3s ease;}
  .hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-size:18px;}
  /* body */
  .stage{flex:1;display:flex;flex-direction:column;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:400;margin-bottom:8px;}
  .prompt{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1.3;letter-spacing:-.01em;margin:0 0 22px;}
  /* choices */
  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:2px solid var(--line);
    border-bottom-width:4px;border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:700;
    cursor:pointer;transition:.08s;}
  .choice:hover{background:rgba(28,176,246,.06);}
  .choice.sel{border-color:var(--blue);background:rgba(28,176,246,.1);}
  .choice.ok{border-color:var(--green);background:var(--green-soft);}
  .choice.bad{border-color:var(--red);background:var(--red-soft);}
  .choice .k{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:13px;color:var(--muted);}
  .choice.sel .k{border-color:var(--blue);color:var(--blue);}
  /* generic tiles / chips */
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:12px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);
    color:var(--ink);font-weight:700;cursor:pointer;transition:.08s;}
  .chip:hover{border-color:var(--blue);}
  .chip.used{opacity:.35;pointer-events:none;}
  .bank{min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;margin-bottom:16px;}
  /* order list */
  .order{display:flex;flex-direction:column;gap:10px;}
  .order .row{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);font-weight:700;}
  .order .row .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;}
  .order .arrows{margin-left:auto;display:flex;gap:6px;}
  .order .arrows button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:800;}
  /* match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .match .col{display:flex;flex-direction:column;gap:10px;}
  /* diagram slots */
  .diagram{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
  .node{padding:14px 16px;border-radius:12px;font-weight:800;border:2px solid var(--line);background:var(--card);}
  .node.fixed{background:rgba(28,176,246,.12);border-color:var(--blue);}
  .slot{min-width:90px;text-align:center;padding:14px 12px;border:2px dashed var(--muted);border-radius:12px;font-weight:800;color:var(--muted);}
  .slot.filled{border-style:solid;border-color:var(--green);color:var(--ink);background:var(--green-soft);}
  .arrow{color:var(--muted);font-size:20px;font-weight:900;}
  /* estimate */
  .est{display:flex;align-items:center;gap:10px;}
  .est input{font-size:22px;font-weight:800;padding:12px;width:130px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);}
  .est .unit{font-weight:800;color:var(--muted);}
  /* slider */
  .slider-wrap{margin:10px 0 4px;}
  .slider-labels{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:10px;gap:10px;}
  input[type=range]{width:100%;accent-color:var(--blue);height:8px;}
  .slider-val{text-align:center;font-weight:800;margin-top:8px;color:var(--blue);}
  /* footer */
  .foot{position:sticky;bottom:0;padding-top:16px;background:var(--bg);}
  .btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.02em;
    text-transform:uppercase;cursor:pointer;color:#fff;background:var(--blueprint);border-bottom:4px solid var(--blueprint-dk);transition:.08s;}
  .btn:disabled{background:var(--line);color:var(--muted);border-bottom-color:var(--line);cursor:not-allowed;}
  .btn.grey{background:var(--line);color:var(--muted);border-bottom-color:var(--line);}
  .feedback{border-radius:16px 16px 0 0;margin:16px -16px -16px;padding:18px 16px 22px;}
  .feedback.ok{background:var(--green-soft);}
  .feedback.bad{background:var(--red-soft);}
  .feedback h4{margin:0 0 6px;font-family:var(--disp);font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .feedback.ok h4{color:var(--green-dark);}
  .feedback.bad h4{color:var(--red);}
  .feedback p{margin:0 0 10px;font-weight:600;line-height:1.45;}
  .deeper{background:rgba(28,176,246,.14);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.45;}
  .deeper b{color:var(--blue);}
  /* complete */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .done .big{font-size:64px;}
  .done h2{margin:0;font-family:var(--disp);font-size:28px;font-weight:800;}
  .stat{display:flex;gap:12px;margin-top:10px;}
  .stat .box{border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-family:var(--disp);font-weight:800;font-size:20px;background:var(--card);}
  .stat .box.xp{color:var(--signal);}
  .stat .box small{display:block;color:var(--muted);font-family:var(--mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
  .lessonpick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .utabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .utab{font-family:var(--mono);font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);cursor:pointer;transition:.08s;}
  .utab.on{border-color:var(--blue);color:var(--blue);background:rgba(76,176,255,.12);}
  .hidden{display:none!important;}
</style>
</head>
<body>

<!-- Stackling mark: two base layers + a big-faced amber head (logo = mascot) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="stack" viewBox="0 0 100 100">
    <rect x="16" y="66" width="68" height="15" rx="5" fill="#1e5aa8"/>
    <rect x="25" y="47" width="50" height="15" rx="5" fill="#4cb0ff"/>
    <rect x="30" y="12" width="40" height="30" rx="9" fill="#ffb020"/>
    <circle cx="43" cy="27" r="4.4" fill="#071522"/>
    <circle cx="57" cy="27" r="4.4" fill="#071522"/>
    <circle cx="44.4" cy="25.6" r="1.4" fill="#fff"/>
    <circle cx="58.4" cy="25.6" r="1.4" fill="#fff"/>
  </symbol>
</svg>

<div class="app">
  <div class="top">
    <button class="close" onclick="location.reload()">✕</button>
    <svg class="mark" style="--s:26px"><use href="#stack"/></svg>
    <div class="bar"><i id="bar"></i></div>
    <div class="hearts">♥ <span id="hearts">5</span></div>
  </div>

  <!-- lesson picker -->
  <div id="picker" class="stage">
    <svg class="mark" style="--s:76px;margin-bottom:14px"><use href="#stack"/></svg>
    <div class="utabs" id="unittabs"></div>
    <div class="kicker" id="pk-kicker">Foundations · Unit 1</div>
    <h1 class="prompt" id="pk-title">How the Internet Works</h1>
    <p style="margin-top:-12px;color:var(--muted);font-weight:500;">Pick a lesson to play the prototype.</p>
    <div class="lessonpick" id="lessonpick"></div>
  </div>

  <!-- exercise -->
  <div id="stage" class="stage hidden"></div>

  <!-- complete -->
  <div id="complete" class="stage hidden">
    <div class="done">
      <div class="big"><svg class="mark" style="--s:104px"><use href="#stack"/></svg></div>
      <h2>Lesson complete!</h2>
      <div class="stat">
        <div class="box xp"><small>XP</small><span id="xp">0</span></div>
        <div class="box"><small>Accuracy</small><span id="acc">0%</span></div>
        <div class="box"><small>Hearts left</small><span id="hleft">5</span></div>
      </div>
      <button class="btn" style="max-width:260px;margin-top:18px" onclick="location.reload()">Back to lessons</button>
    </div>
  </div>

  <div id="foot" class="foot hidden">
    <div id="feedback"></div>
    <button id="action" class="btn" disabled>Check</button>
  </div>
</div>

<script>
/* ---- content (from content/01-how-the-internet-works.json) ---- */
const UNIT1 = {"unitId":"how-internet-works","title":"How the Internet Works","lessons":[
{"id":"hiw-1","title":"It's just computers passing notes","exercises":[
 {"type":"multiple_choice","prompt":"You open a website. Roughly how many separate computers might your request pass through before it reaches the server?","choices":["Just 1 — mine and theirs","About 3","Often 10–20","Exactly 100"],"answer":2,"why":"Your data hops through many routers along the way — often 10 to 20 — each one passing it one step closer to the destination.","goDeeper":"Run traceroute google.com (or tracert on Windows) and you'll literally see every hop your packets take across the internet."},
 {"type":"fill_blank","prompt":"Data doesn't travel as one big blob. It's broken into small chunks called ______.","choices":["packets","pixels","cookies","threads"],"answer":0,"why":"The internet splits your data into small packets, sends them independently, and reassembles them at the other end.","goDeeper":"Packets can take different routes and arrive out of order. Something has to put them back in order — that's TCP's job, coming up in lesson 4."},
 {"type":"multiple_choice","prompt":"Every device on the internet needs one of these to be found. What is it?","choices":["A username","An IP address","A password","A phone number"],"answer":1,"why":"An IP address (like 142.250.72.14) is a device's location on the internet — data can't be delivered without one.","goDeeper":"There aren't enough old IPv4 addresses (~4.3 billion) for the world, which is why IPv6 exists with 340 undecillion addresses."},
 {"type":"match_pairs","prompt":"Match each piece to what it does.","pairs":[{"left":"Packet","right":"A small chunk of your data"},{"left":"IP address","right":"A device's location on the internet"},{"left":"Router","right":"Passes packets toward their destination"}],"why":"Packets carry the data, IP addresses say where it's going, and routers move it hop by hop.","goDeeper":"Routers don't know the whole path — each just knows the next best hop. The internet has no central map."},
 {"type":"multiple_choice","prompt":"There's no master computer running the internet. So how do packets find their way?","choices":["A central server in the US decides every route","Each router just forwards to the next-best hop toward the target","Packets are sent to every computer until one matches","Your ISP pre-computes the full path"],"answer":1,"why":"The internet is decentralized. Each router makes a local decision — 'who gets me closer?' — and no single machine is in charge.","goDeeper":"This decentralization is why the internet is resilient: knock out a router and traffic just routes around it."}
]},
{"id":"hiw-2","title":"DNS: the internet's phonebook","exercises":[
 {"type":"multiple_choice","prompt":"You type google.com, but computers route by IP address. Who turns the name into the number?","choices":["Your keyboard","DNS","The CPU","Your Wi-Fi router alone"],"answer":1,"why":"DNS (Domain Name System) is the internet's phonebook — it looks up 'google.com' and returns its IP address.","goDeeper":"Humans remember names; machines need numbers. DNS is the translation layer that lets us live in a world of words."},
 {"type":"fill_blank","prompt":"DNS translates a human-friendly ______ into a machine-friendly IP address.","choices":["domain name","password","packet","port"],"answer":0,"why":"A domain name like 'netflix.com' is for humans; DNS converts it to the IP address machines actually use.","goDeeper":null},
 {"type":"order_steps","prompt":"Put a DNS lookup in order (simplified).","steps":["Browser asks: what's the IP for example.com?","Check the local cache — seen it recently?","If not cached, ask a DNS resolver","Resolver returns the IP address","Browser connects to that IP"],"why":"DNS checks the fastest sources first (local cache) before asking a resolver, then hands the browser an IP to connect to.","goDeeper":"Results are cached at many levels with a 'TTL' — time to live. That's why a DNS change can take hours to reach everyone."},
 {"type":"multiple_choice","prompt":"In Oct 2016, a DNS company called Dyn was attacked. Twitter, Spotify, Reddit and Netflix all went dark at once — though those companies were fine. What had been knocked out?","choices":["A single giant server","A major DNS provider","The undersea cables","Everyone's Wi-Fi"],"answer":1,"why":"Dyn was a big DNS provider. Take out DNS and users can't translate names to IPs — so sites become unreachable even while running perfectly.","goDeeper":"DNS is a quiet single point of failure for huge chunks of the web. Serious systems use multiple DNS providers."},
 {"type":"multi_select","prompt":"Why does DNS cache results instead of looking up every time? Select all that apply.","choices":["Lookups take time — caching makes pages load faster","It reduces load on DNS servers","It makes the answer more accurate","The same names are requested over and over"],"answer":[0,1,3],"why":"Caching is about speed and load. It does NOT make answers more accurate — stale caches can serve outdated IPs.","goDeeper":"This is your first taste of caching — keep the hot answer close. You'll see it everywhere in system design."}
]},
{"id":"hiw-3","title":"The journey of a request","exercises":[
 {"type":"multiple_choice","prompt":"Before your browser can send an HTTP request to a server, what does it need first?","choices":["The server's IP address","The server's password","A faster CPU","More RAM"],"answer":0,"why":"You can't send data anywhere without a destination address. DNS supplies the server's IP first — then the request can travel.","goDeeper":null},
 {"type":"order_steps","prompt":"Order what happens when you visit example.com.","steps":["DNS resolves example.com to an IP address","Browser opens a connection to that IP","Browser sends an HTTP request","Server processes the request","Server sends back an HTTP response","Browser renders the page"],"why":"Every page load is this dance: name → IP → connect → ask → process → answer → render.","goDeeper":"On HTTPS there's also a TLS handshake after connecting, which encrypts everything. That's the 's' in https — secure."},
 {"type":"build_diagram","prompt":"Place the missing piece: your browser needs to turn 'example.com' into an IP before reaching the server.","slots":["Browser","?","Web Server"],"palette":["DNS","Database","Cache"],"answer":"DNS","why":"DNS sits between you and the server on that first step, translating the name so your browser knows where to connect.","goDeeper":null},
 {"type":"estimate","prompt":"A round trip from New York to a server in London and back is roughly how many milliseconds — at the physical minimum?","answer":70,"tolerance":30,"unit":"ms","why":"Even at light speed through fiber, NY↔London round-trips take ~70ms. Physics sets a floor on latency no engineering can beat.","goDeeper":"This is why companies put servers close to users (CDNs, a later unit). You can't outrun light — so you shorten the distance."},
 {"type":"multiple_choice","prompt":"Your page felt slow. The server responded in 5ms, but the total was 300ms. Where did the time most likely go?","choices":["The server was slow","Network round-trips across distance","The database was down","Your CPU was busy"],"answer":1,"why":"If the server itself took 5ms, the other 295ms was the network — the round-trips of getting data there and back.","goDeeper":"Rule of thumb: often the network, not the server, is your latency bottleneck. Measure before you optimize."}
]},
{"id":"hiw-4","title":"TCP vs UDP: reliable vs fast","exercises":[
 {"type":"multiple_choice","prompt":"You're loading a bank statement. Every byte must arrive, in order, no errors. Which protocol fits?","choices":["UDP","TCP","Neither","Both equally"],"answer":1,"why":"TCP guarantees delivery and order — it re-sends lost packets and reassembles them correctly. Perfect for data you can't lose.","goDeeper":"TCP uses acknowledgements: the receiver confirms each chunk, and anything unconfirmed gets re-sent. Reliability costs round-trips."},
 {"type":"multiple_choice","prompt":"You're on a live video call. A dropped frame is fine, but a 2-second delay to re-send it is not. Which protocol fits?","choices":["TCP","UDP","Neither","Always TCP for video"],"answer":1,"why":"UDP just fires packets and doesn't wait. For live audio/video, a missing frame beats a laggy one — speed over perfection.","goDeeper":"A classic tradeoff: reliability vs latency. You'll make this call again and again in system design."},
 {"type":"match_pairs","prompt":"Match the use case to the better protocol.","pairs":[{"left":"Downloading a file","right":"TCP"},{"left":"Live game / video call","right":"UDP"},{"left":"Loading a web page","right":"TCP"},{"left":"DNS lookup (small, fast)","right":"UDP"}],"why":"TCP for anything that must be complete and correct; UDP for small or real-time traffic where speed wins.","goDeeper":"DNS traditionally uses UDP because a lookup is tiny — if lost, just ask again. Modern DNS-over-HTTPS uses TCP for privacy."},
 {"type":"tradeoff_slider","prompt":"You're designing a multiplayer game's networking. Slide toward what you'd prioritize for player-movement updates.","leftLabel":"Guaranteed delivery (TCP)","rightLabel":"Lowest latency (UDP)","answerRange":[65,100],"why":"For fast-moving positions, low latency wins — a slightly stale position NOW beats a perfect one that arrives late. Games lean UDP.","goDeeper":"Games send newer position updates constantly, so a lost one is instantly replaced. Re-sending old ones (TCP) would feel worse."},
 {"type":"fill_blank","prompt":"The core tradeoff: TCP gives you reliability, UDP gives you ______.","choices":["speed","security","storage","encryption"],"answer":0,"why":"TCP trades speed for guaranteed, ordered delivery. UDP trades those guarantees for raw speed and low latency.","goDeeper":"Neither is 'better' — the right choice depends on what your system values most. That judgment IS system design."},
 {"type":"multiple_choice","prompt":"You've traced a request end to end. Which statement best captures how the internet moves your data?","choices":["One connection sends the whole file at once with no addressing","Data is split into packets, addressed by IP, routed hop-by-hop, and reassembled","A central server copies data directly to your screen","The browser stores everything locally and never contacts a server"],"answer":1,"why":"That's the whole picture: split into packets, addressed by IP (found via DNS), routed hop-by-hop, reassembled — reliably (TCP) or fast (UDP).","goDeeper":"Everything else in this course — caching, load balancing, databases — is built on this foundation."}
]}
]};

/* ---- content (from content/02-client-server-http.json) ---- */
const UNIT2 = {"unitId":"client-server-http","title":"Client–Server & HTTP","lessons":[
{"id":"csh-1","title":"Ask and answer","exercises":[
 {"type":"multiple_choice","prompt":"You open a social app and your feed appears. Where did that data physically come from the instant you opened it?","choices":["It was already fully stored on your phone","Your phone asked a server, and the server answered","Another user's phone sent it straight to you","The app store pushed it"],"answer":1,"why":"This is the client–server model: your phone (the client) sends a request, and a server sends back a response. Your phone stores almost none of the data — it just knows how to ask.","goDeeper":"One server answers millions of clients. That asymmetry — few servers, many clients — is the shape of almost every system you'll design."},
 {"type":"fill_blank","prompt":"The machine that asks is the ______; the machine that answers is the server.","choices":["client","router","cache","proxy"],"answer":0,"why":"Client = asks, server = answers. They're roles, not fixed machines.","goDeeper":"A 'server' can itself be a 'client' of another server — your API server calling Stripe's payments API is a client in that conversation. The roles nest."},
 {"type":"match_pairs","prompt":"Match each part of an HTTP request to its job.","pairs":[{"left":"Method","right":"What you want to do (GET, POST)"},{"left":"Path","right":"Which resource (/users/42)"},{"left":"Headers","right":"Metadata about the request"},{"left":"Body","right":"The data you're sending"}],"why":"Every request is: a method (the verb), a path (the noun), headers (context), and an optional body (the payload).","goDeeper":"A GET usually has no body — it just names what it wants. A POST carries its data in the body. HTTP is plain text under the hood; you could type a request by hand."},
 {"type":"order_steps","prompt":"Order one request/response round trip.","steps":["Client builds an HTTP request","Client sends it to the server","Server processes the request","Server builds a response","Client receives and renders it"],"why":"Ask, travel, process, answer, render — the loop behind every screen you've ever loaded.","goDeeper":"The 'travel' step includes the network round-trips you met in Unit 1. On HTTPS, a TLS handshake happens first to encrypt everything."},
 {"type":"multiple_choice","prompt":"You send one request, then another. By default, does the server remember your first request when handling the second?","choices":["Yes — servers always remember","No — each HTTP request is independent (stateless)","Only if both are GET requests","Only if they're within one second"],"answer":1,"why":"HTTP is stateless: by default each request stands entirely on its own. The server doesn't inherently remember the last one.","goDeeper":"So how does 'staying logged in' work? The client re-sends proof — a cookie or token — on every single request. State lives with the client or in a shared store, NOT in one server's memory. Hold onto this: it's the boss lesson of this unit."},
 {"type":"multiple_choice","prompt":"Which statement best captures what HTTP is?","choices":["A database that stores your data","A stateless request/response protocol for clients and servers to talk","A programming language for servers","A type of physical cable"],"answer":1,"why":"HTTP is the agreed language of the web: a stateless protocol where clients make requests and servers return responses.","goDeeper":null}
]},
{"id":"csh-2","title":"The verbs: HTTP methods","exercises":[
 {"type":"multiple_choice","prompt":"You want to fetch a user's profile without changing anything. Which method?","choices":["GET","POST","DELETE","PUT"],"answer":0,"why":"GET reads data and shouldn't change anything on the server. It's the default 'just show me' verb.","goDeeper":"GET is 'safe' — crawlers and browser prefetchers fire GETs freely. So never hide a state-changing action (like /delete?id=42) behind a GET, or a crawler could wipe your data just by following links. This has happened to real companies."},
 {"type":"match_pairs","prompt":"Match each method to its intent.","pairs":[{"left":"GET","right":"Read a resource"},{"left":"POST","right":"Create a new resource"},{"left":"PUT","right":"Replace a resource"},{"left":"DELETE","right":"Remove a resource"}],"why":"GET reads, POST creates, PUT replaces, DELETE removes. The method tells the server your intent.","goDeeper":"PUT replaces the whole resource; PATCH updates just part of it. Choosing precisely is what makes an API predictable."},
 {"type":"multi_select","prompt":"Which of these methods are expected to change state on the server? Select all.","choices":["GET","POST","PUT","DELETE"],"answer":[1,2,3],"why":"POST, PUT, and DELETE modify server state. GET (and HEAD, OPTIONS) are 'safe' — they only read.","goDeeper":"Because GET is safe, it's cacheable and retryable with zero risk. That single property is why the web can cache so aggressively."},
 {"type":"multiple_choice","prompt":"Your DELETE /users/42 request times out and you don't know if it worked. Is it safe to just send it again?","choices":["Yes — deleting twice leaves the same result as deleting once","No — you might delete two different users","No — DELETE can never be retried","Only if you switch to GET first"],"answer":0,"why":"DELETE is idempotent: DELETE /users/42 twice still leaves user 42 gone. Same end state, so retrying is safe.","goDeeper":"Idempotent = doing it again lands you in the same state. GET, PUT, and DELETE are idempotent; POST is not. This is the backbone of reliable distributed systems, because networks fail mid-request constantly and retries are unavoidable."},
 {"type":"multiple_choice","prompt":"A POST /payments request times out. You don't know if the charge went through. Retrying blindly risks charging the customer twice. What's the fix?","choices":["Just retry — it's probably fine","Send an idempotency key so the server recognizes the retry and doesn't repeat the charge","Never retry payments, ever","Change it to a GET request"],"answer":1,"why":"An idempotency key is a unique id the client attaches to the request. If the server sees the same key twice, it returns the original result instead of charging again — making an unsafe POST safe to retry.","goDeeper":"This is exactly how Stripe works: you send an 'Idempotency-Key' header, and Stripe dedupes retries. Any system with money or side effects needs this pattern."},
 {"type":"fill_blank","prompt":"An operation is ______ if performing it many times has the same effect as performing it once.","choices":["idempotent","stateless","asynchronous","encrypted"],"answer":0,"why":"Idempotent operations are safe to retry — critical, because in a distributed system retries are not optional.","goDeeper":null}
]},
{"id":"csh-3","title":"Reading status codes","exercises":[
 {"type":"multiple_choice","prompt":"A server replies with 200. At a glance, what does that number tell you?","choices":["The response size","The request succeeded","The user's id","The latency in ms"],"answer":1,"why":"Status codes are the server's one-glance verdict on your request. 200 = OK, it worked.","goDeeper":"The first digit is everything: 2xx success, 3xx redirect, 4xx you (the client) messed up, 5xx I (the server) messed up. Learn the classes and you can read any code you've never seen."},
 {"type":"match_pairs","prompt":"Match each status code to its meaning.","pairs":[{"left":"200 OK","right":"Success"},{"left":"301 Moved Permanently","right":"Redirect to a new URL"},{"left":"404 Not Found","right":"That resource doesn't exist"},{"left":"500 Internal Server Error","right":"The server broke"}],"why":"One code from each class: 2xx worked, 3xx go elsewhere, 4xx your request was wrong, 5xx the server failed.","goDeeper":"Two you'll use constantly: 201 Created (a POST made something new) and 204 No Content (success, but nothing to return — perfect for a DELETE)."},
 {"type":"multi_select","prompt":"Which of these are CLIENT errors (the caller's fault)? Select all.","choices":["400 Bad Request","401 Unauthorized","404 Not Found","503 Service Unavailable"],"answer":[0,1,2],"why":"4xx codes blame the request; 5xx codes blame the server. 503 is a server-side 'I can't handle this right now.'","goDeeper":"Don't confuse 401 and 403. 401 Unauthorized really means 'I don't know who you are' (not authenticated). 403 Forbidden means 'I know who you are, and you're not allowed' (authenticated but no permission)."},
 {"type":"multiple_choice","prompt":"Your service is getting hammered with more traffic than it can handle. Which status code politely tells clients to slow down?","choices":["404 Not Found","429 Too Many Requests","200 OK","301 Moved Permanently"],"answer":1,"why":"429 Too Many Requests is the rate-limiting signal. Well-behaved clients back off when they see it, often honoring a 'Retry-After' header the server sends.","goDeeper":"Pair 429 with exponential backoff on the client (wait 1s, then 2s, then 4s...). Without backoff, clients retry instantly in unison and create a 'thundering herd' that keeps the service down."},
 {"type":"multiple_choice","prompt":"Your app sits behind a load balancer. Users start seeing 502 and 504 errors. Where is the problem most likely?","choices":["In the users' browsers","Downstream of the load balancer — the app servers are failing or too slow","In DNS","In the users' wifi"],"answer":1,"why":"502 Bad Gateway means the load balancer got a broken response from the app behind it; 504 Gateway Timeout means the app didn't respond in time. Both point downstream — the app or database, not the balancer or the client.","goDeeper":"This is why status codes are gold during an incident: 502/504 → look at the app tier; 503 → the service is shedding load; 500 → an unhandled crash in your code. The code tells you which layer to open first."},
 {"type":"multiple_choice","prompt":"A user requests GET /orders/99999, but no such order exists. What should the server return?","choices":["200 OK with an empty body","404 Not Found","500 Internal Server Error","403 Forbidden"],"answer":1,"why":"The resource genuinely doesn't exist and the client's request was well-formed — that's a textbook 404. Returning 200 for a missing resource lies to the client and breaks caching and error handling.","goDeeper":"Returning the honest code matters: monitoring, retries, and caches all make decisions based on it. A 500 here would page an engineer for a non-bug; a 200 would hide a real 'not found.'"}
]},
{"id":"csh-4","title":"Stateless HTTP at scale","exercises":[
 {"type":"multiple_choice","prompt":"A big service runs thousands of identical web servers behind one load balancer, and each of your requests may hit a different server — yet everything works. Why is that possible?","choices":["The servers share one block of memory","HTTP is stateless, so any server can handle any request","Your requests secretly always hit the same server","The load balancer copies your data to every server"],"answer":1,"why":"Because each request carries everything needed to serve it (like an auth token), any interchangeable server can handle any request. Statelessness is what makes horizontal scaling possible.","goDeeper":"The moment a server stores your session in its own local memory, servers stop being interchangeable — now the load balancer must pin you to that one machine ('sticky sessions'), and if it dies, your session dies with it."},
 {"type":"multiple_choice","prompt":"If servers remember nothing between requests, where does your logged-in session actually live?","choices":["Nowhere — you re-login every request","In the client (a cookie/token it re-sends), or in a shared store like Redis","Inside the load balancer","In DNS"],"answer":1,"why":"State moves out of the server: either the client carries it (a token sent on every request) or it lives in a shared store all servers can read. Never in one server's local RAM.","goDeeper":"Two common patterns: a self-contained token (JWT) the client carries, or a session id the client carries that servers look up in a shared cache (Redis). Both keep the servers stateless and interchangeable."},
 {"type":"build_diagram","prompt":"Place the missing piece so any app server can serve any request without losing the user's session.","slots":["App Server 1","App Server 2","?"],"palette":["Shared Cache (Redis)","A bigger CPU","A second load balancer"],"answer":"Shared Cache (Redis)","why":"A shared store that every app server reads from keeps sessions out of local memory, so the servers stay stateless and interchangeable.","goDeeper":"This is the standard fix for 'randomly logged out' bugs: move session state to a shared cache, and it no longer matters which server you land on."},
 {"type":"multi_select","prompt":"Opening a fresh TCP + TLS connection for every single request is expensive. Which of these reduce that cost? Select all.","choices":["Keep-alive: reuse one connection for many requests","HTTP/2 multiplexing: many requests in flight on one connection","Opening a brand-new connection for every image","HTTP/3 over QUIC: avoids TCP-level head-of-line blocking"],"answer":[0,1,3],"why":"Reusing connections (keep-alive) and multiplexing (HTTP/2, HTTP/3) amortize the handshake cost across many requests. Opening a fresh connection each time is the problem, not a fix.","goDeeper":"HTTP/1.1 could only handle one request at a time per connection — a slow response blocked everything behind it (head-of-line blocking). HTTP/2 multiplexes many requests over one connection; HTTP/3 moves to QUIC over UDP to fix blocking that still happened at the TCP layer."},
 {"type":"multiple_choice","prompt":"Your API serves a user avatar that rarely changes. How do you avoid re-sending the same bytes on every request?","choices":["You can't — you must resend it each time","Use Cache-Control + an ETag: the client asks 'still current?' and the server can reply 304 Not Modified with no body","Make the image smaller each time","Serve it over POST"],"answer":1,"why":"With an ETag (a fingerprint of the content), the client sends 'I have version X — changed?' and the server can answer 304 Not Modified with an empty body. Same-bytes are never re-sent.","goDeeper":"304 responses are a huge part of why repeat page loads feel instant — the browser revalidates cheaply and skips the download entirely."},
 {"type":"tradeoff_slider","prompt":"Auth for a high-security banking app. Self-contained JWTs let any server validate locally (great for scale) but are hard to revoke before they expire. Redis-backed sessions are instantly revocable but every request hits the store. Slide toward your default here.","leftLabel":"JWT (scales, hard to revoke)","rightLabel":"Redis sessions (revocable, central)","answerRange":[55,100],"why":"For high-security, instant revocation usually wins — if a token is stolen, you must be able to kill it NOW. A central session store gives you that, at the cost of a lookup per request. JWTs trade that away for statelessness.","goDeeper":"Many real systems combine both: short-lived JWTs (minutes) plus a revocation check, getting most of JWT's scale while limiting how long a stolen token stays valid."},
 {"type":"multiple_choice","prompt":"Users randomly get logged out, but only during high traffic. The setup: app servers store sessions in their own local memory, behind a round-robin load balancer. What's happening, and what's the fix?","choices":["DNS is misconfigured — flush the cache","Round-robin sends you to servers that don't have your in-memory session → move sessions to a shared store so servers are stateless","The database ran out of disk — add storage","The users' tokens expired — shorten the timeout"],"answer":1,"why":"Under load the balancer spreads you across many servers; whenever you land on one that doesn't hold your in-memory session, you appear logged out. Making the servers stateless — sessions in a shared store — fixes it permanently.","goDeeper":"The band-aid is 'sticky sessions' (pin each user to one server), but that undermines load balancing and fails when a server dies. Stateless servers + a shared session store is the scalable cure — it ties this whole unit together."}
]}
]};

/* ---- content (from content/03-apis.json) ---- */
const UNIT3 = {"unitId":"apis","title":"APIs","lessons":[
{"id":"api-1","title":"The contract","exercises":[
 {"type":"multiple_choice","prompt":"Your weather app shows tomorrow's forecast. It doesn't own any weather satellites. How does it get the data?","choices":["It guesses from your location","It calls someone else's API and asks for it","The data ships inside the app","It reads the weather company's database directly"],"answer":1,"why":"An API (Application Programming Interface) is a defined way for one program to ask another for data or actions. The weather app asks; a weather service answers.","goDeeper":"You use dozens of APIs a day without noticing. Every app showing a map, taking a payment, or offering 'Sign in with Google' is calling someone else's API behind the scenes."},
 {"type":"fill_blank","prompt":"An API is essentially a ______ between two programs: ask me this way, and I'll answer that way.","choices":["contract","database","cable","password"],"answer":0,"why":"An API is a contract. It defines what you can ask, how to ask it, and what you'll get back.","goDeeper":"The contract IS the product. The moment other people build on it, changing it breaks them — which is why API design decisions haunt you for years."},
 {"type":"multiple_choice","prompt":"Why doesn't the weather company just let your app read their database directly?","choices":["Direct database access would be faster and better","An API hides their internals, enforces rules, and lets them change their database without breaking you","Databases physically can't be read by other programs","There's no real reason — it's just tradition"],"answer":1,"why":"The API is a boundary: it exposes what you may do and hides how it's done. That freedom to change internals without breaking callers is the entire point.","goDeeper":"This is encapsulation at system scale. If clients touched the database directly, the provider could never change their schema, add authentication, or throttle abuse. The API is both the contract and the control point — it's where you enforce auth, limits, and validation."},
 {"type":"match_pairs","prompt":"Match each piece of an API to its job.","pairs":[{"left":"Endpoint","right":"A specific address you can call"},{"left":"JSON","right":"How the data is formatted"},{"left":"API key","right":"Proves who is calling"},{"left":"Documentation","right":"The contract, written down"}],"why":"An endpoint is where you ask, JSON is the shape of the answer, the key says who you are, and the docs are the contract made readable.","goDeeper":"Undocumented APIs get used wrong and then can never be changed, because nobody knows who depends on what. Docs aren't a nicety — they're how the contract stays enforceable."},
 {"type":"order_steps","prompt":"Order what happens in one API call.","steps":["App calls GET /v1/weather?city=Pune","Server checks the API key and validates the request","Server fetches the data it needs","Server returns JSON","App renders the forecast"],"why":"Ask at an endpoint → get authenticated and validated → the work happens → JSON comes back → the screen updates.","goDeeper":"Notice auth and validation happen before any real work. Rejecting a bad or unauthorized request cheaply — before it touches your database — is a load-shedding tactic you'll reuse constantly."},
 {"type":"multiple_choice","prompt":"Why did JSON become the default format for web APIs, beating XML?","choices":["It's a compact binary format","It's human-readable and maps directly onto data structures most languages already have","It's encrypted by default","It's much older and more established"],"answer":1,"why":"JSON is readable by humans and parses straight into objects/dicts/maps in nearly every language. Low friction beat XML's ceremony.","goDeeper":"But JSON is text, so it's easy — not efficient. High-performance internal APIs often use binary formats like Protocol Buffers: far smaller and faster to parse, at the cost of being unreadable to humans. You'll meet that tradeoff in lesson 4."}
]},
{"id":"api-2","title":"REST: designing around resources","exercises":[
 {"type":"multiple_choice","prompt":"Which URL is the better-designed way to fetch user 42?","choices":["/getUser?id=42","/users/42","/api/doGetUserData/42","/user/get/42"],"answer":1,"why":"REST models nouns (resources), not verbs. The HTTP method already says what you're doing — GET /users/42 reads it. Putting 'get' in the URL duplicates what GET already told us.","goDeeper":"The rule of thumb: URLs are nouns, methods are verbs. If your URL contains a verb, you're probably reinventing HTTP."},
 {"type":"match_pairs","prompt":"Match each request to what it should do.","pairs":[{"left":"GET /users","right":"List users"},{"left":"POST /users","right":"Create a user"},{"left":"GET /users/42","right":"Fetch one user"},{"left":"DELETE /users/42","right":"Delete that user"}],"why":"One resource, four operations — separated purely by the HTTP method. That's REST in a nutshell.","goDeeper":"This is why REST scales as a mental model: a small fixed set of verbs applied to unlimited nouns. Learn the pattern once, and you can guess any well-designed REST API."},
 {"type":"multiple_choice","prompt":"You want to list the orders belonging to user 42. Which is the RESTful design?","choices":["/getOrdersForUser?user=42","/users/42/orders","/orders/user/42/list","/fetchOrders?u=42"],"answer":1,"why":"Nesting expresses the relationship: the orders that belong to user 42. It reads like the data model.","goDeeper":"But don't over-nest. /users/42/orders/7/items/3/reviews is a maintenance nightmare and couples your URLs to a rigid hierarchy. Two levels is a good ceiling — past that, expose the resource at its own top-level path and link by id."},
 {"type":"multi_select","prompt":"Which of these are good REST practices? Select all.","choices":["Use plural nouns for collections (/users)","Put the action verb in the URL (/createUser)","Use HTTP methods to express the action","Return accurate HTTP status codes"],"answer":[0,2,3],"why":"Plural nouns, methods-as-verbs, and honest status codes are the core conventions. Verbs in URLs are the anti-pattern — they duplicate the method.","goDeeper":"Conventions matter more than cleverness here. A predictable API is one a stranger can guess without reading docs — and guessability is a real feature."},
 {"type":"multiple_choice","prompt":"REST APIs are stateless. What does that demand of every single request?","choices":["Nothing in particular","Each request must carry everything needed to serve it — the server remembers nothing from prior calls","Every request must be a GET","Requests must stay under 1KB"],"answer":1,"why":"Statelessness means each request stands alone: it carries its own auth and parameters, and the server holds no memory of your last call.","goDeeper":"This is the same property from the HTTP unit, and it's why you can drop a REST API behind a load balancer with 500 interchangeable servers. Statelessness isn't a REST nicety — it's what makes REST scale."},
 {"type":"fill_blank","prompt":"In REST, URLs name ______, and HTTP methods express the action.","choices":["resources","functions","servers","errors"],"answer":0,"why":"Resources (nouns) live at URLs; methods (verbs) act on them. Separating the two is the whole design.","goDeeper":null}
]},
{"id":"api-3","title":"Pagination, versioning, and errors","exercises":[
 {"type":"multiple_choice","prompt":"GET /users tries to return all 50 million users in one response. What breaks?","choices":["Nothing — it's just a big response","Almost everything: a huge payload, a brutal database query, timeouts, and memory blowups on both ends","Only the client's screen","Only DNS"],"answer":1,"why":"Unbounded collections are a production landmine. The query is slow, the payload is enormous, the request times out, and both server and client can run out of memory.","goDeeper":"This is a classic incident shape: the endpoint was fine with 100 rows in dev and fell over at 10M in production. Rule: never expose an endpoint whose response size grows with your data. Bound everything."},
 {"type":"multiple_choice","prompt":"So how do you return a large list safely?","choices":["Return it all but compress it","Paginate: return a bounded page plus a way to ask for the next one","Ask clients to be patient","Only allow admins to call it"],"answer":1,"why":"Pagination bounds the work per request: a fixed-size page, plus a pointer to get the next one. Cost per call stays predictable no matter how big the dataset grows.","goDeeper":"Always enforce a maximum page size on the server. If a client can send ?limit=1000000, you haven't actually bounded anything — you've just asked nicely."},
 {"type":"multiple_choice","prompt":"Your feed paginates with ?offset=1000000&limit=20. Two real problems appear at scale. Which describes them?","choices":["Offset pagination is always faster but uses more memory","Deep offsets get slow (the database must walk past every skipped row), and new inserts shift rows so users see duplicates or miss items","Offsets break encryption","There are no problems — offset is the standard"],"answer":1,"why":"OFFSET isn't free: to skip 1,000,000 rows the database generally has to traverse them, so deep pages get progressively slower. Worse, if rows are inserted while you're paging, everything shifts — you re-see items or skip them entirely.","goDeeper":"The fix is cursor (keyset) pagination: instead of 'skip a million,' you say 'give me 20 items after id=X.' The database jumps straight there using an index, so page 50,000 costs the same as page 1 — and inserts don't shift your position. This is why every large feed (Twitter, Slack, Stripe) hands you an opaque cursor instead of a page number."},
 {"type":"multiple_choice","prompt":"You need to change what a field means in your public API. Third-party apps depend on it. What do you do?","choices":["Change it — clients will adapt","Version the API (/v2) or add a new field, while keeping the old behavior working","Delete the endpoint and start over","Change it, but email everyone first"],"answer":1,"why":"Once strangers depend on your contract, mutating it breaks their software with no warning. You add alongside — a new field or a new version — and migrate people over time.","goDeeper":"The governing rule: you can add, you can't take away. Additive changes (a new optional field) are safe because old clients ignore what they don't know about. That asymmetry drives almost every real API evolution strategy."},
 {"type":"multi_select","prompt":"Which of these changes would BREAK existing clients? Select all.","choices":["Adding a new optional field to the response","Removing a field","Renaming a field","Changing a field's type from string to number"],"answer":[1,2,3],"why":"Adding an optional field is safe — old clients simply ignore it. Removing, renaming, or retyping a field breaks anyone parsing it, instantly and silently.","goDeeper":"This is why the 'expand, migrate, contract' pattern exists: first ADD the new field (expand), then move clients over (migrate), and only remove the old one much later once nobody reads it (contract). The contract step is the one teams forget to ever finish."},
 {"type":"multiple_choice","prompt":"Your API returns 200 OK, with {\"error\": \"user not found\"} in the body. Why is that a bad idea?","choices":["It isn't — the error is right there in the body","It lies: caches, monitoring, retries, and client error handling all key off the status code, so a 200 hides the failure","JSON can't represent errors","It's slower to parse"],"answer":1,"why":"The status code is the machine-readable verdict. Saying 200 means 'success,' so caches may store it, dashboards show healthy, and clients take the success path — while the request actually failed.","goDeeper":"Do both: return the honest status (404) AND a consistent error body like {code, message}. Consistency matters as much as correctness — if every endpoint shapes errors differently, clients must write custom handling for each one."}
]},
{"id":"api-4","title":"APIs at scale","exercises":[
 {"type":"multiple_choice","prompt":"A mobile screen shows 20 posts, each with its author's name. The app calls GET /posts, then GET /users/{id} for each post. How many requests is that?","choices":["1","2","21","20"],"answer":2,"why":"One request for the list, plus one per post = 21. This is the N+1 problem, and it's everywhere.","goDeeper":"On a mobile network with ~100ms round-trips, 21 sequential calls is over two seconds of pure waiting — before rendering anything. Chattiness is the number one killer of mobile API performance. The fix: let the server do the joining and return posts WITH their authors in one response."},
 {"type":"multiple_choice","prompt":"Your /users endpoint returns a 40-field object, but the mobile list screen only needs name and avatar. What's the problem called?","choices":["Under-fetching","Over-fetching — you're burning bandwidth and battery shipping fields nobody uses","Caching","Sharding"],"answer":1,"why":"Over-fetching means the response carries far more than the caller needs. On mobile that's wasted bandwidth, slower parsing, and real battery cost.","goDeeper":"REST endpoints have fixed shapes, so the same endpoint is simultaneously too big for one screen and too small for another (forcing extra calls — under-fetching). That exact tension is precisely why GraphQL was invented."},
 {"type":"match_pairs","prompt":"Match each API style to what it's best at.","pairs":[{"left":"REST","right":"Simple, cacheable, fixed response shapes"},{"left":"GraphQL","right":"Client asks for exactly the fields it needs"},{"left":"gRPC","right":"Fast binary protocol for service-to-service calls"}],"why":"REST is the simple, cacheable default; GraphQL solves over/under-fetching by letting clients specify the shape; gRPC trades human-readability for speed between your own services.","goDeeper":"None is 'best' — they're answers to different questions. REST for public APIs, GraphQL when different clients need wildly different slices of data, gRPC for internal microservice hops where nobody's reading the payload and latency is the whole game."},
 {"type":"tradeoff_slider","prompt":"You're designing a PUBLIC API for third-party developers you've never met. Slide toward the style you'd default to.","leftLabel":"REST (simple, cacheable)","rightLabel":"GraphQL (flexible queries)","answerRange":[0,40],"why":"For a public API consumed by strangers, REST usually wins: trivial to learn, works with HTTP caching and CDNs, and easy to rate-limit per endpoint. GraphQL's flexibility becomes a liability — arbitrary nested queries are hard to cache, hard to rate-limit, and easy to weaponize into an expensive query.","goDeeper":"GitHub famously offers both, and the split is instructive: GraphQL shines for FIRST-party clients you control (your own mobile app), where flexibility pays for itself. The more you trust and know the caller, the more GraphQL's tradeoffs make sense."},
 {"type":"multi_select","prompt":"Your public API has to survive third-party developers. Which of these protect you? Select all.","choices":["Rate limiting per client","Pagination on every collection","Versioning the contract","Letting clients request unlimited nested data"],"answer":[0,1,2],"why":"Limits, bounded pages, and a versioned contract are your seatbelts. Unlimited nested queries are the opposite — they hand callers a way to make you do unbounded work.","goDeeper":"An API is a promise made to strangers. Every unbounded thing you expose will eventually be abused — usually by accident, via someone's runaway retry loop, long before any malice shows up."},
 {"type":"build_diagram","prompt":"Your mobile app makes 21 chatty calls per screen. Add the piece that lets it make ONE call and get a tailored response.","slots":["Mobile App","?","[ Posts svc, Users svc ]"],"palette":["API Gateway / BFF","Another database","A second mobile app"],"answer":"API Gateway / BFF","why":"A gateway (or Backend-for-Frontend) sits in front, makes the many internal calls server-side, and returns one response shaped for that screen — turning 21 phone round-trips into 1.","goDeeper":"The internal calls still happen — but over a fast datacenter network (sub-millisecond) instead of a phone's 100ms hops. This is the BFF pattern: a thin server-side layer shaped for one specific client. It's how you get GraphQL-like tailoring while keeping plain REST services underneath."},
 {"type":"multiple_choice","prompt":"Your public REST API is slow for mobile and partners complain payloads are huge — but you cannot break the thousands of existing integrations. What's the best move?","choices":["Change the response shape to be leaner — clients will adapt","Add a new tailored endpoint (new version, or a BFF for mobile) while leaving the existing contract untouched","Remove the unused fields to slim it down","Migrate every client to GraphQL immediately"],"answer":1,"why":"You can't mutate a contract that strangers depend on — slimming fields or reshaping responses is a breaking change no matter how much better the new shape is. You add alongside: a versioned endpoint or a BFF tailored for mobile, and migrate people gradually.","goDeeper":"This is the whole unit in one decision. An API is a contract, the contract outlives your opinions about it, and evolving it without breaking anyone is the actual senior skill. Add, migrate, and only then contract — that sequence is the difference between an API that grows and one that fossilizes."}
]}
]};

/* ---- content (from content/04-latency-vs-throughput.json) ---- */
const UNIT4 = {"unitId":"latency-vs-throughput","title":"Latency vs Throughput","lessons":[
{"id":"lat-1","title":"Two different speeds","exercises":[
 {"type":"multiple_choice","prompt":"Think of a pipe carrying water. Latency is how long one drop takes to travel it; throughput is how much water flows per second. Which change raises throughput but does NOT improve latency?","choices":["Making the pipe shorter","Making the pipe wider","Both do both","Neither changes anything"],"answer":1,"why":"A wider pipe carries more water per second (throughput), but a single drop still takes exactly as long to travel end to end (latency). Only shortening the pipe cuts latency.","goDeeper":"This is the whole unit in one image. It's also why 'we added more servers but my page is still slow' is such a common and painful surprise — more servers widened the pipe; they didn't shorten it."},
 {"type":"fill_blank","prompt":"______ is the time for one request to complete; throughput is how many complete per second.","choices":["Latency","Bandwidth","Uptime","Concurrency"],"answer":0,"why":"Latency = time per operation. Throughput = operations per unit time. They're different axes, and improving one can even hurt the other.","goDeeper":null},
 {"type":"match_pairs","prompt":"Match each term to its meaning.","pairs":[{"left":"Latency","right":"Time for one request (ms)"},{"left":"Throughput","right":"Requests handled per second"},{"left":"Bandwidth","right":"Max data per second the link can carry"},{"left":"Round trip (RTT)","right":"There and back again"}],"why":"Latency is per-request time; throughput is completed work per second; bandwidth is the ceiling the physical link imposes; RTT is the there-and-back time that dominates network latency.","goDeeper":"Bandwidth and throughput get confused constantly. Bandwidth is the pipe's capacity; throughput is what you actually achieve through it. You can have a fat pipe and terrible throughput if something else is the bottleneck."},
 {"type":"multi_select","prompt":"Which of these actually reduce LATENCY for a single request? Select all.","choices":["Caching the result so the work is already done","Adding more servers","Moving the server geographically closer to the user","Optimizing the slow database query"],"answer":[0,2,3],"why":"Latency falls when you shorten the work or the distance: cache it, move closer, make the query faster. Adding servers adds capacity to run more requests at once — it doesn't make any single request's work finish sooner.","goDeeper":"Internalize this split and you'll diagnose faster than most engineers: latency problems are solved by doing less work or travelling less distance; throughput problems are solved by adding parallel capacity. Reaching for the wrong lever is the classic wasted quarter."},
 {"type":"multiple_choice","prompt":"You double your server count. Users still say each page takes 2 seconds. Why didn't it get faster?","choices":["The new servers need a restart","More servers add throughput (capacity to serve more users), not lower per-request latency","Servers always fix latency — something is misconfigured","DNS is caching the old servers"],"answer":1,"why":"Scaling out lets you handle MORE simultaneous requests. It does nothing to shorten the work inside any one request — so each user still waits 2 seconds.","goDeeper":"Scaling out only helps a user's latency indirectly: if servers were overloaded and queueing, adding capacity removes the waiting. That's the exception that proves the rule — and it's exactly what the boss lesson of this unit is about."},
 {"type":"multiple_choice","prompt":"Your API serves 10,000 requests per second, and each one takes 200ms. Which is the throughput?","choices":["200ms","10,000 requests/second","2,000","50 requests"],"answer":1,"why":"Throughput is the rate of completed work: 10,000 requests/second. The 200ms is the latency of one request.","goDeeper":"Notice these two numbers coexist happily. A system can be high-throughput AND high-latency at the same time (a huge batch pipeline), or low-throughput and low-latency (a tiny, snappy service)."}
]},
{"id":"lat-2","title":"The numbers worth memorizing","exercises":[
 {"type":"multiple_choice","prompt":"Roughly how much slower is reading from main memory (RAM) than from the CPU's L1 cache?","choices":["About 2× slower","About 10× slower","About 100× slower","They're the same speed"],"answer":2,"why":"L1 cache is roughly 1 nanosecond; RAM is roughly 100 nanoseconds. That's about 100× — and RAM is the thing we usually call 'fast.'","goDeeper":"The memory hierarchy is a ladder of ~100× cliffs: cache → RAM → SSD → network → disk seek → cross-continent. Every step down costs orders of magnitude. Knowing roughly where each rung sits is what lets you reason about performance without measuring."},
 {"type":"estimate","prompt":"Reading from main memory (RAM) takes roughly how many nanoseconds?","answer":100,"tolerance":90,"unit":"ns","why":"A main-memory reference is on the order of 100 nanoseconds. These figures are order-of-magnitude, not precise — the point is the scale, not the digits.","goDeeper":"Compare: L1 cache ≈ 1 ns. So even a RAM hit — which feels instant — is ~100 cache misses' worth of time. This is why cache-friendly data layouts can make code several times faster without changing the algorithm."},
 {"type":"estimate","prompt":"A network round trip between two servers in the SAME datacenter takes roughly how many microseconds?","answer":500,"tolerance":400,"unit":"µs","why":"A same-datacenter round trip is on the order of 500 microseconds (about half a millisecond). Fast by human standards — enormously slow by CPU standards.","goDeeper":"Note it's already ~5,000× slower than a RAM read, and you haven't even left the building. Leaving the building (cross-continent) costs another ~300×, landing around 150ms."},
 {"type":"match_pairs","prompt":"Match each operation to its rough order of magnitude.","pairs":[{"left":"L1 cache reference","right":"~1 nanosecond"},{"left":"Main memory (RAM) read","right":"~100 nanoseconds"},{"left":"SSD random read","right":"~100 microseconds"},{"left":"Cross-continent round trip","right":"~150 milliseconds"}],"why":"The ladder: 1 ns → 100 ns → 100 µs → 150 ms. From cache to a cross-continent hop is roughly 100 million times slower.","goDeeper":"Worth noticing: an SSD read (~100 µs) is FASTER than a same-datacenter network round trip (~500 µs). Reading from your own disk can beat asking a neighbouring server. That inverts a lot of people's intuitions about 'just put it in another service.'"},
 {"type":"multiple_choice","prompt":"A RAM read is ~100ns. A same-datacenter network call is ~0.5ms. Roughly how many RAM reads fit inside ONE network call?","choices":["About 5","About 500","About 5,000","About 5,000,000"],"answer":2,"why":"0.5ms = 500,000ns. Divided by 100ns per RAM read = about 5,000. One 'cheap' internal network hop costs roughly five thousand memory reads.","goDeeper":"This is the number that should haunt every microservice design. Adding one service hop to a request path isn't a rounding error — it's thousands of times more expensive than doing the work locally. Chatty service meshes die of exactly this, one innocent-looking call at a time."},
 {"type":"multiple_choice","prompt":"Why bother memorizing these order-of-magnitude numbers at all?","choices":["To impress people in code review","To do back-of-envelope math and reject a bad design in seconds — without building it","They're required by the HTTP spec","They're only useful for embedded programming"],"answer":1,"why":"Rough numbers let you kill a bad design with arithmetic instead of a three-month build. 'That's 10,000 serial network calls at 0.5ms — five seconds. No.' That takes 30 seconds and saves a quarter.","goDeeper":"This is the single most transferable skill in system design, and the reason estimation questions show up in every interview. You're not being tested on the digits — you're being tested on whether you can reason about scale before committing to it."}
]},
{"id":"lat-3","title":"The average is a lie","exercises":[
 {"type":"multiple_choice","prompt":"Your dashboard says average latency is 100ms — healthy. Users are furious that the app is slow. How can both be true?","choices":["The users are exaggerating","The average hides the tail: a small share of requests could be taking 5+ seconds","The dashboard is broken","Averages can't be wrong"],"answer":1,"why":"Averages smear outliers away. If 95% of requests take 50ms and 5% take 2 seconds, the average still looks fine — while 1 in 20 users has a terrible time.","goDeeper":"Average latency is arguably the most misleading metric in all of systems. Nobody experiences the average. Every user experiences one specific request — and the unhappy ones are living in your tail."},
 {"type":"match_pairs","prompt":"Match each metric to what it actually tells you.","pairs":[{"left":"p50 (median)","right":"Half of requests are faster than this"},{"left":"p95","right":"95% are faster; the slowest 5% are worse"},{"left":"p99","right":"The worst 1% — your unhappiest users"},{"left":"Average","right":"Easily skewed by outliers"}],"why":"Percentiles describe the distribution instead of collapsing it. p50 is the typical experience; p99 is the bad one you promised not to inflict.","goDeeper":"Teams often watch p50 and feel great. Your most valuable users — the ones with the most data, the biggest carts, the longest histories — usually live in the p99. The tail isn't random; it's often systematically your heaviest users."},
 {"type":"multiple_choice","prompt":"Your p99 latency is 2 seconds. What does that mean?","choices":["Every request takes 2 seconds","99% of requests are faster than 2 seconds; the slowest 1% are worse","99 requests took 2 seconds","The average is 2 seconds"],"answer":1,"why":"p99 = the value 99% of requests come in under. The remaining 1% are slower — and 2s is the floor of their pain, not the ceiling.","goDeeper":"1% sounds negligible until you multiply. At 10,000 requests/second, that's 100 bad experiences every second — roughly 8.6 million a day. 'Rare' at scale is a full-time disaster."},
 {"type":"estimate","prompt":"At 10,000 requests/second, how many requests per second land in your p99 tail (the slowest 1%)?","answer":100,"tolerance":10,"unit":"req/sec","why":"1% of 10,000 = 100 requests every second hitting your worst-case latency. Percentages feel small; rates feel real.","goDeeper":"Always convert percentages into absolute rates before deciding something is acceptable. '99.9% success' at 10k rps is still 10 failures per second — 864,000 a day."},
 {"type":"multiple_choice","prompt":"A page makes 100 parallel calls to internal services. Each has p99 = 100ms (so each has a 1% chance of being slow). Roughly what fraction of page loads hit AT LEAST ONE slow call?","choices":["About 1%","About 10%","About 63%","100%"],"answer":2,"why":"Each call is fast 99% of the time. All 100 being fast = 0.99^100 ≈ 37%. So about 63% of page loads hit at least one slow call. A 1-in-100 event becomes the majority experience.","goDeeper":"This is Google's famous 'tail at scale.' When you fan out, your dependencies' p99 becomes your page's p50. It's the mathematical reason microservice architectures feel mysteriously slow — nobody's service is broken, yet the page is always waiting on someone."},
 {"type":"multi_select","prompt":"Which of these genuinely help tame tail latency? Select all.","choices":["Hedged requests: send a duplicate and take whichever answers first","Timeouts with a sensible fallback","Reducing fan-out (make fewer calls)","Running servers at 100% CPU utilization"],"answer":[0,1,2],"why":"Hedging routes around a straggler, timeouts stop one slow dependency from holding the whole page hostage, and less fan-out means fewer chances to draw a slow call. Running at 100% utilization does the opposite — it's a tail-latency generator.","goDeeper":"Hedged requests feel wasteful (you're deliberately duplicating work) but they're a real technique at Google-scale: a few percent extra load can cut p99 dramatically. Trading a little throughput for a lot of tail is often a superb deal."},
 {"type":"multiple_choice","prompt":"You're writing a latency SLA for your service. Which metric should it be written against?","choices":["The average — it's the most representative","A high percentile like p95 or p99 — it bounds the worst experience users actually hit","The minimum — it shows what's possible","The maximum — the absolute worst case"],"answer":1,"why":"An SLA is a promise about the bad case, not the typical one. Percentiles bound real user pain; averages hide it, and the max is one pathological outlier you can't control.","goDeeper":"The max is usually useless — a single GC pause or network blip owns it forever. p99 (or p99.9 at big scale) is the honest, actionable promise."}
]},
{"id":"lat-4","title":"When the system gets busy","exercises":[
 {"type":"multiple_choice","prompt":"Your server handles requests comfortably at 50ms when it's half busy. You push it to 99% utilization. What happens to latency?","choices":["It stays around 50ms — the work per request didn't change","It drops, because the CPU is warmed up","It explodes: requests queue behind each other, and wait time grows non-linearly","It becomes zero"],"answer":2,"why":"The work per request didn't change, but now requests WAIT. As utilization approaches 100%, queueing delay grows non-linearly — at 99% busy, latency can be tens of times worse than at 50% busy.","goDeeper":"This is queueing theory, and it's the bridge between throughput and latency. Rule of thumb: keep utilization meaningfully below 100% — often around 70%. That 'wasted' headroom is not waste; it's what you're buying low latency with. A server at 100% utilization isn't efficient — it's one hiccup from a meltdown."},
 {"type":"multiple_choice","prompt":"Little's Law says: concurrency = throughput × latency. Your service handles 500 requests/second, each taking 0.2 seconds. How many requests are in flight at any moment?","choices":["100","500","2,500","0.4"],"answer":0,"why":"500 requests/sec × 0.2 sec = 100 requests in flight. That's how many are being worked on simultaneously.","goDeeper":"This tiny formula tells you how many threads, connections, or workers you need. And it has teeth: if latency doubles (a dependency slows down), in-flight requests double — with zero change in traffic. That's how you exhaust a connection pool and turn one slow dependency into a full outage."},
 {"type":"estimate","prompt":"Little's Law again: 200 requests/second, each taking 0.5 seconds. How many requests are in flight?","answer":100,"tolerance":5,"unit":"requests","why":"200 × 0.5 = 100 in flight. Throughput × latency = concurrency, every time.","goDeeper":"Run it backwards to size a pool: if you want 1,000 rps at 50ms latency, you need 1,000 × 0.05 = 50 concurrent workers. Capacity planning in one multiplication."},
 {"type":"multiple_choice","prompt":"You batch 100 database writes together instead of writing them one at a time. What happens?","choices":["Both latency and throughput improve","Throughput goes up, but an individual write's latency goes up — it waits for the batch to fill","Both get worse","Nothing measurable changes"],"answer":1,"why":"Batching spreads fixed per-operation costs across many items, so total throughput rises. But each individual write now waits for the batch to assemble — so its own latency gets worse. You trade the individual's speed for the system's capacity.","goDeeper":"This tradeoff is everywhere once you see it: Kafka batching, database group commit, Nagle's algorithm in TCP. It's the purest example that latency and throughput aren't just different — they're often in direct opposition."},
 {"type":"tradeoff_slider","prompt":"You're designing 'send message' in a real-time chat app. Slide toward what you'd optimize.","leftLabel":"Low latency (send immediately)","rightLabel":"High throughput (batch aggressively)","answerRange":[0,35],"why":"A human is staring at the screen waiting for their message to appear. Latency wins decisively — batching would add delay to the one thing the user is watching.","goDeeper":"The question to always ask: is a human waiting? If yes, optimize latency. If no — logs, analytics, nightly ETL, ingestion pipelines — optimize throughput and batch hard. Same system, opposite answers, decided entirely by who's on the other end."},
 {"type":"multiple_choice","prompt":"Your pipeline: Load Balancer (10k rps) → App servers (2k rps) → Cache (50k rps) → Database (5k rps). What's the maximum throughput of the whole system?","choices":["50k rps","10k rps","5k rps","2k rps"],"answer":3,"why":"A chain is limited by its slowest stage — the app servers at 2k rps. Everything downstream is idle capacity you're paying for and can't use.","goDeeper":"The corollary is brutal and constantly ignored: optimizing a NON-bottleneck yields exactly zero improvement. Making the cache twice as fast here changes nothing. Measure first, find the actual constraint, then fix that — anything else is theatre."},
 {"type":"multiple_choice","prompt":"Users report the site is slow. Average latency looks fine at 80ms. CPU sits at 95%. p99 latency is 4 seconds. Diagnosis?","choices":["Nothing's wrong — the average is healthy","The servers are near saturation, so queueing is exploding the tail: most requests are fine, but the p99 is brutal. Add headroom or cut work per request","It's a DNS problem","The users have bad wifi"],"answer":1,"why":"95% CPU puts you deep in the queueing danger zone. The average hides it because most requests still sail through — but the ones that arrive during a burst wait behind a queue, and that's your 4-second p99. The fix is headroom (capacity) or less work per request, not a micro-optimization.","goDeeper":"This ties the whole unit together: latency and throughput are different (lesson 1), you need the numbers to reason (lesson 2), averages lie so you watch percentiles (lesson 3), and utilization is the hidden variable connecting them all. High utilization looks like efficiency on a cost dashboard and feels like a broken product to users."}
]}
]};

/* ---- content (from content/05-where-state-lives.json) ---- */
const UNIT5 = {"unitId":"where-state-lives","title":"Where State Lives","lessons":[
{"id":"state-1","title":"State is the hard part","exercises":[
 {"type":"multiple_choice","prompt":"You have two services: one resizes images (input in, output out, remembers nothing) and one stores user profiles. Which is trivially easy to run as 100 copies?","choices":["The profile store","The image resizer — it remembers nothing, so any copy can do any job","Both are equally easy","Neither can be copied"],"answer":1,"why":"The resizer is stateless: every copy is interchangeable, you can add or kill them freely, and no copy needs to agree with any other. The profile store holds data — so its copies must somehow agree on the truth.","goDeeper":"Here's the thesis of the whole unit: almost every hard problem in system design is a state problem. Scaling stateless compute is boring — you add machines. Scaling state is where replication, sharding, consistency, and CAP all come from. Whenever a design feels hard, ask: 'what's the state here?'"},
 {"type":"fill_blank","prompt":"A component is ______ if it keeps no memory between requests — so any copy can handle any request.","choices":["stateless","idempotent","cached","sharded"],"answer":0,"why":"Stateless = no memory between requests = interchangeable copies. That interchangeability is what makes horizontal scaling easy.","goDeeper":null},
 {"type":"multi_select","prompt":"Which of these are STATE (something the system must remember)? Select all.","choices":["A user's shopping cart","A function that adds two numbers","An uploaded profile photo","The number of likes on a post"],"answer":[0,2,3],"why":"Carts, photos, and like counts are all data the system must remember. Pure computation isn't state — the same inputs always give the same output, and nothing is retained.","goDeeper":"The practical test: if you restarted every server in your fleet right this second, what would be lost? That is your state. Everything else is just compute, and compute is the easy part."},
 {"type":"match_pairs","prompt":"Match each term to its meaning.","pairs":[{"left":"Stateless","right":"Any copy can serve any request"},{"left":"Stateful","right":"Copies must agree on the data"},{"left":"Source of truth","right":"The one authoritative copy"},{"left":"Derived copy","right":"Can be rebuilt from the truth"}],"why":"These four words carry most of the unit. Stateless scales freely; stateful needs coordination; the source of truth is authoritative; derived copies are rebuildable.","goDeeper":"'Can it be rebuilt?' is the question that separates a bad afternoon from a company-ending event. Hold onto it — lesson 3 is built on it."},
 {"type":"multiple_choice","prompt":"Architects often say 'push state to the edges.' What does that mean?","choices":["Put servers physically near users","Keep the middle tier stateless and interchangeable, concentrating state in a few systems built to handle it","State should be avoided entirely","Move all data to the client"],"answer":1,"why":"You want a thin, stateless middle you can scale at will, with state concentrated in a small number of specialists (databases, caches) that are designed for the hard parts.","goDeeper":"This is why the classic 3-tier architecture exists at all: a stateless web/app tier you can scale by adding boxes, plus a stateful data tier that's difficult, expensive, and carefully managed. The entire shape of the architecture is organized around quarantining state."},
 {"type":"multiple_choice","prompt":"Why is a stateless app tier so much easier to operate than a stateful one?","choices":["It uses less memory","Any instance can be added, killed, restarted, or replaced at any time with no coordination and nothing lost","It doesn't need a network","It's written in a different language"],"answer":1,"why":"Disposability is the superpower. Deploys, autoscaling, crashes, and rolling restarts all become non-events when no instance holds anything anyone needs.","goDeeper":"Every ops practice you like — blue/green deploys, autoscaling, chaos testing, spot instances — quietly depends on instances being disposable. The moment state sneaks into an instance, all of it gets harder at once."}
]},
{"id":"state-2","title":"The places state can live","exercises":[
 {"type":"multiple_choice","prompt":"You restart every server in your fleet. Which survives?","choices":["Data held in server RAM","Data written to a database on disk","Both survive","Neither survives"],"answer":1,"why":"RAM is volatile — a restart wipes it instantly. Disk is durable, so the database still has the data. This is the very first question to ask about any state: does it need to survive a crash?","goDeeper":"Durability is a spectrum you pay for in latency and money. RAM: fastest, dies on restart. Local disk: survives a process crash, not a dead machine. Replicated disk: survives a machine. Cross-region replication: survives a whole datacenter. Every rung costs you."},
 {"type":"match_pairs","prompt":"Match each place state can live to its defining property.","pairs":[{"left":"Client (cookie/token)","right":"Travels with the user, can't be trusted"},{"left":"Server RAM","right":"Fastest, lost on restart"},{"left":"Shared cache (Redis)","right":"Fast, shared by all servers, usually volatile"},{"left":"Database (disk)","right":"Durable source of truth, slowest"}],"why":"Four places, four personalities. The whole design skill is matching the state to the place whose tradeoffs you can live with.","goDeeper":"Notice the ladder running through it: speed, durability, shared-ness, trust — and no option gives you all four. There is no place that is fast, durable, shared, and free. Choosing means giving something up on purpose."},
