const UNIT4 = {"unitId":"latency-vs-throughput","title":"Latency vs Throughput","subtitle":"Two different speeds — and the numbers that let you reject a bad design in 30 seconds","lessons":[{"id":"lat-1","title":"Two different speeds","exercises":[{"id":"lat-1-0","type":"concept","title":"Two different speeds hide inside the word 'fast'","body":"*Latency* is how long one request takes — a duration, in milliseconds. *Throughput* is how many requests finish per second — a rate. Picture a pipe: latency is how long one drop takes to travel it end to end; throughput is how much water pours out of the end each second. They are separate axes, and you can move one without touching the other.","note":"They can even point opposite ways. A nightly job chewing through a billion rows has huge throughput and dreadful latency; a tiny service answering in 2ms may handle almost no traffic. Neither number implies the other."},{"id":"lat-1-1","type":"multiple_choice","prompt":"Think of a pipe carrying water. Latency is how long one drop takes to travel it; throughput is how much water flows per second. Which change raises throughput but does NOT improve latency?","choices":["Making the pipe shorter","Making the pipe wider","Both do both","Neither changes anything"],"answer":1,"why":"A wider pipe carries more water per second (throughput), but a single drop still takes exactly as long to travel end to end (latency) — only shortening the pipe cuts that. This is the whole unit in one image, and it's why 'we added more servers but my page is still slow' is such a common surprise: more servers widened the pipe, they didn't shorten it."},{"id":"lat-1-2","type":"fill_blank","prompt":"______ is the time for one request to complete; throughput is how many complete per second.","choices":["Latency","Bandwidth","Uptime","Concurrency"],"answer":0,"why":"Latency = time per operation. Throughput = operations per unit time. They're different axes, and improving one can even hurt the other."},{"id":"lat-1-3","type":"match_pairs","prompt":"Match each term to its meaning.","pairs":[{"left":"Latency","right":"Time for one request (ms)"},{"left":"Throughput","right":"Requests handled per second"},{"left":"Bandwidth","right":"Max data per second the link can carry"},{"left":"Round trip (RTT)","right":"There and back again"}],"why":"Latency is per-request time, throughput is completed work per second, bandwidth is the ceiling the physical link imposes, and RTT is the there-and-back time that dominates network latency. Bandwidth and throughput get confused constantly: bandwidth is the pipe's capacity, throughput is what you actually achieve through it — you can have a fat pipe and terrible throughput if something else is the bottleneck."},{"id":"lat-1-4","type":"multi_select","prompt":"Your servers have plenty of headroom — nothing is queueing. Which of these actually reduce LATENCY for a single request? Select all.","choices":["Caching the result so the work is already done","Adding more servers","Moving the server geographically closer to the user","Optimizing the slow database query"],"answer":[0,2,3],"why":"Latency falls when you shorten the work or the distance: cache it, move closer, make the query faster. Adding servers adds capacity to run more requests at once — it doesn't make any single request's work finish sooner. That depends on the condition in the prompt, though: if the servers *were* saturated and requests were queueing, adding capacity would cut latency outright, because then you'd be removing waiting rather than work. Internalize this split and you'll diagnose faster than most engineers: latency problems are solved by doing less work or travelling less distance, throughput problems by adding parallel capacity, and reaching for the wrong lever is the classic wasted quarter."},{"id":"lat-1-5","type":"multiple_choice","prompt":"You double your server count. Users still say each page takes 2 seconds. Why didn't it get faster?","choices":["The new servers need a restart","More servers add throughput (capacity to serve more users), not lower per-request latency","Servers always fix latency — something is misconfigured","DNS is caching the old servers"],"answer":1,"why":"Scaling out lets you handle MORE simultaneous requests; it does nothing to shorten the work inside any one request, so each user still waits 2 seconds. There's one exception that proves the rule: if servers were overloaded and queueing, adding capacity removes the waiting — which is exactly what this unit's boss lesson is about."},{"id":"lat-1-6","type":"multiple_choice","prompt":"Your API serves 10,000 requests per second, and each one takes 200ms. Which is the throughput?","choices":["200ms","10,000 requests/second","2,000","50 requests"],"answer":1,"why":"Throughput is the rate of completed work: 10,000 requests/second. The 200ms is the latency of one request. Notice these two numbers coexist happily — a system can be high-throughput AND high-latency at once (a huge batch pipeline), or low-throughput and low-latency (a tiny, snappy service)."}]},{"id":"lat-2","title":"The numbers worth memorizing","exercises":[{"id":"lat-2-0","type":"concept","title":"The gaps between fast and slow aren't percentages — they're orders of magnitude","viz":{"nodes":[{"id":"cpu","label":"CPU","col":0},{"id":"l1","label":"L1 cache","sub":"~1ns","col":1,"kind":"cache"},{"id":"ram","label":"RAM","sub":"~100ns","col":2}],"edges":[{"from":"cpu","to":"l1"},{"from":"l1","to":"ram"}]},"body":"Your CPU's L1 cache answers in roughly 1 nanosecond. Main memory — RAM, the thing we all call fast — takes roughly 100. Put those two numbers side by side and count the zeros: that isn't 'a bit slower', it's a different scale. And the ladder keeps descending: SSD, then the network, then another continent. Each step down is a cliff rather than a slope.","note":"Treat these as orders of magnitude, not measurements — hardware moves, the ratios barely do. Nobody cares whether RAM is 80ns or 120ns. Everybody should care how many L1 hits it's worth."},{"id":"lat-2-1","type":"multiple_choice","prompt":"Roughly how much slower is reading from main memory (RAM) than from the CPU's L1 cache?","choices":["About 2× slower","About 10× slower","About 100× slower","They're the same speed"],"answer":2,"why":"L1 cache is roughly 1 nanosecond; RAM is roughly 100 nanoseconds — about 100×, and RAM is the thing we usually call 'fast'. The memory hierarchy is a ladder of ~100× cliffs: cache → RAM → SSD → network → cross-continent. Knowing roughly where each rung sits is what lets you reason about performance without measuring."},{"id":"lat-2-2","type":"estimate","prompt":"Reading from main memory (RAM) takes roughly how many nanoseconds?","answer":100,"tolerance":90,"unit":"ns","why":"A main-memory reference is on the order of 100 nanoseconds. These figures are order-of-magnitude rather than precise — the point is the scale, not the digits. Compare L1 cache at ~1ns: even a RAM hit, which feels instant, is ~100 cache misses' worth of time, which is why cache-friendly data layouts can make code several times faster without changing the algorithm."},{"id":"lat-2-3","type":"estimate","prompt":"A network round trip between two servers in the SAME datacenter takes roughly how many microseconds?","answer":500,"tolerance":400,"unit":"µs","why":"A same-datacenter round trip is on the order of 500 microseconds — about half a millisecond. Fast by human standards, enormously slow by CPU standards: it's already ~5,000× slower than a RAM read, and you haven't even left the building. Going California-to-Europe costs another ~300×, landing around 150ms."},{"id":"lat-2-4","type":"match_pairs","prompt":"Match each operation to its rough order of magnitude.","pairs":[{"left":"L1 cache reference","right":"~1 nanosecond"},{"left":"Main memory (RAM) read","right":"~100 nanoseconds"},{"left":"SSD random read","right":"~100 microseconds"},{"left":"California ↔ Europe round trip","right":"~150 milliseconds"}],"why":"The ladder: 1 ns → 100 ns → 100 µs → 150 ms. From an L1 hit to a California-Europe hop is roughly 100 million times slower. Note the ladder needs a *named route*, not a vague 'far away': New York to London is also intercontinental and only ~70ms, because it's barely half the distance. Worth noticing: an SSD read (~100 µs) is FASTER than a same-datacenter network round trip (~500 µs) — reading from your own disk can beat asking a neighbouring server, which inverts a lot of people's intuitions about 'just put it in another service'."},{"id":"lat-2-5","type":"multiple_choice","prompt":"A RAM read is ~100ns. A same-datacenter network call is ~0.5ms. Roughly how many RAM reads fit inside ONE network call?","choices":["About 5","About 500","About 5,000","About 5,000,000"],"answer":2,"why":"0.5ms = 500,000ns, divided by 100ns per RAM read = about 5,000. One 'cheap' internal network hop costs roughly five thousand memory reads. This is the number that should haunt every microservice design: adding one service hop to a request path isn't a rounding error, it's thousands of times more expensive than doing the work locally — and chatty service meshes die of exactly this, one innocent-looking call at a time."},{"id":"lat-2-6","type":"multiple_choice","prompt":"Why bother memorizing these order-of-magnitude numbers at all?","choices":["To impress people in code review","To do back-of-envelope math and reject a bad design in seconds — without building it","They're required by the HTTP spec","They're only useful for embedded programming"],"answer":1,"why":"Rough numbers let you kill a bad design with arithmetic instead of a three-month build: 'that's 10,000 serial network calls at 0.5ms — five seconds. No.' That takes 30 seconds and saves a quarter. It's the single most transferable skill in system design, and the reason estimation questions appear in every interview — you're not being tested on digits, but on whether you can reason about scale before committing to it."}],"fieldTask":{"where":"Terminal","seconds":30,"do":"ping google.com   then   ping www.aeroflot.ru","alt":"Ctrl+C to stop each one. Any far-away site works — pick one on another continent.","notice":"Compare the two `time=` numbers. The gap isn't slow servers — it's distance, at the speed of light through fibre. You're measuring physics from your kitchen, and no engineering removes it."}},{"id":"lat-3","title":"The average is a lie","exercises":[{"id":"lat-3-0","type":"concept","title":"An average is a number that describes nobody","body":"An average answers 'what happened overall'. Nobody experiences overall. If most requests are quick and a few are dreadful, the arithmetic quietly buries the dreadful ones — divide one horrible request across thousands of fast ones and it vanishes. So measure *percentiles* instead: p50 is the middle request, p99 is the one slower than 99% of the rest.","note":"And the tail isn't random. Your p99 usually belongs to your heaviest users — most data, longest history, most friends — so the worst of your system lands on the people most invested in it."},{"id":"lat-3-1","type":"multiple_choice","prompt":"Your dashboard says average latency is 100ms — healthy. Users are furious that the app is slow. How can both be true?","choices":["The users are exaggerating","The average hides the tail: a small share of requests could be taking 5+ seconds","The dashboard is broken","Averages can't be wrong"],"answer":1,"why":"Averages smear outliers away. Make it concrete: 99% of requests at 50ms and 1% at 5 seconds averages to 99.5ms — precisely the 'healthy' 100ms on the dashboard — while one user in a hundred sits and waits five seconds. Average latency is arguably the most misleading metric in all of systems — nobody experiences the average, everybody experiences one specific request, and the unhappy ones are living in your tail."},{"id":"lat-3-2","type":"match_pairs","prompt":"Match each metric to what it actually tells you.","pairs":[{"left":"p50 (median)","right":"Half of requests are faster than this"},{"left":"p95","right":"95% are faster; the slowest 5% are worse"},{"left":"p99","right":"The worst 1% — your unhappiest users"},{"left":"Average","right":"Easily skewed by outliers"}],"why":"Percentiles describe the distribution instead of collapsing it: p50 is the typical experience, p99 is the bad one you promised not to inflict. Teams often watch p50 and feel great — but your most valuable users, the ones with the most data and the longest histories, usually live in the p99. The tail isn't random; it's often systematically your heaviest users."},{"id":"lat-3-3","type":"multiple_choice","prompt":"Your p99 latency is 2 seconds. What does that mean?","choices":["Every request takes 2 seconds","99% of requests are faster than 2 seconds; the slowest 1% are worse","99 requests took 2 seconds","The average is 2 seconds"],"answer":1,"why":"p99 is the value 99% of requests come in under — the remaining 1% are slower, and 2s is the floor of their pain rather than the ceiling. 1% sounds negligible until you multiply: at 10,000 requests/second that's 100 bad experiences every second, roughly 8.6 million a day. 'Rare' at scale is a full-time disaster."},{"id":"lat-3-4","type":"estimate","prompt":"At 10,000 requests/second, how many requests per second land in your p99 tail (the slowest 1%)?","answer":100,"tolerance":10,"unit":"req/sec","why":"1% of 10,000 = 100 requests every second hitting your worst-case latency. Percentages feel small; rates feel real. Always convert percentages into absolute rates before deciding something is acceptable — '99.9% success' at 10k rps is still 10 failures per second, or 864,000 a day."},{"id":"lat-3-5","type":"multiple_choice","prompt":"A page makes 100 parallel calls to internal services. Each has p99 = 100ms (so each has a 1% chance of being slow). Roughly what fraction of page loads hit AT LEAST ONE slow call?","choices":["About 1%","About 10%","About 63%","100%"],"answer":2,"why":"Each call is fast 99% of the time, so all 100 being fast = 0.99^100 ≈ 37% — meaning about 63% of page loads hit at least one slow call. A 1-in-100 event becomes the majority experience. This is Google's famous *tail at scale*: when you fan out, your dependencies' p99 becomes your page's p50, and it's the mathematical reason microservice architectures feel mysteriously slow while nobody's service is broken."},{"id":"lat-3-6","type":"multi_select","prompt":"Which of these genuinely help tame tail latency? Select all.","choices":["Hedged requests: send a duplicate and take whichever answers first","Timeouts with a sensible fallback","Reducing fan-out (make fewer calls)","Running servers at 100% CPU utilization"],"answer":[0,1,2],"why":"Hedging routes around a straggler, timeouts stop one slow dependency holding the page hostage, and less fan-out means fewer chances to draw a slow call — while 100% utilization is a tail-latency generator. Hedged requests feel wasteful since you're deliberately duplicating work, but a few percent extra load can cut p99 dramatically: trading a little throughput for a lot of tail is often a superb deal."},{"id":"lat-3-7","type":"multiple_choice","prompt":"You're writing a latency SLA for your service. Which metric should it be written against?","choices":["The average — it's the most representative","A high percentile like p95 or p99 — it bounds the worst experience users actually hit","The minimum — it shows what's possible","The maximum — the absolute worst case"],"answer":1,"why":"An SLA is a promise about the bad case, not the typical one: percentiles bound real user pain while averages hide it. The max is usually useless — a single GC pause or network blip owns it forever — so p99 (or p99.9 at big scale) is the honest, actionable promise."}]},{"id":"lat-4","title":"When the system gets busy","exercises":[{"id":"lat-4-0","type":"concept","title":"A busy server doesn't work slower — you just wait longer for your turn","viz":{"nodes":[{"id":"r","label":"Requests","sub":"arriving","col":0,"kind":"client"},{"id":"q","label":"The queue","sub":"wait time","col":1,"kind":"queue"},{"id":"s","label":"Server","sub":"work time","col":2,"kind":"server"}],"edges":[{"from":"r","to":"q"},{"from":"q","to":"s"}]},"body":"Latency is two things added together: the time a request spends *working*, and the time it spends *waiting in line*. A supermarket till doesn't scan groceries any slower at 6pm — the queue is just longer. Servers are tills. So when a system is nearly saturated, the work per request hasn't changed at all; the extra time your users feel is queue.","note":"Which is why nobody sane runs a server at 100% utilization. That spare capacity isn't waste — it's what keeps the line short. Headroom you never use is what you buy instead of waiting."},{"id":"lat-4-1","type":"multiple_choice","prompt":"Your server handles requests comfortably at 50ms when it's half busy. You push it to 99% utilization. What happens to latency?","choices":["It stays around 50ms — the work per request didn't change","It drops, because the CPU is warmed up","It explodes: requests queue behind each other, and wait time grows non-linearly","It becomes zero"],"answer":2,"why":"The work per request didn't change, but now requests WAIT — and as utilization approaches 100%, queueing delay grows non-linearly, so at 99% busy latency can be tens of times worse than at 50%. This is queueing theory, and it's the bridge between throughput and latency. Rule of thumb: keep utilization meaningfully below 100%, often around 70% — that 'wasted' headroom is what you're buying low latency with. A server at 100% utilization isn't efficient, it's one hiccup from a meltdown."},{"id":"lat-4-2","type":"multiple_choice","prompt":"Little's Law says: concurrency = throughput × latency. Your service handles 500 requests/second, each taking 0.2 seconds. How many requests are in flight at any moment?","choices":["100","500","2,500","0.4"],"answer":0,"why":"500 requests/sec × 0.2 sec = 100 requests in flight — that's how many are being worked on simultaneously. This tiny formula tells you how many threads, connections, or workers you need, and it has teeth: if latency doubles because a dependency slowed down, in-flight requests double with zero change in traffic. That's how you exhaust a connection pool and turn one slow dependency into a full outage."},{"id":"lat-4-3","type":"estimate","prompt":"Little's Law again: 200 requests/second, each taking 0.5 seconds. How many requests are in flight?","answer":100,"tolerance":5,"unit":"requests","why":"200 × 0.5 = 100 in flight. Throughput × latency = concurrency, every time. Run it backwards to size a pool: if you want 1,000 rps at 50ms latency, you need 1,000 × 0.05 = 50 concurrent workers — capacity planning in one multiplication."},{"id":"lat-4-4","type":"multiple_choice","prompt":"You batch 100 database writes together instead of writing them one at a time. What happens?","choices":["Both latency and throughput improve","Throughput goes up, but an individual write's latency goes up — it waits for the batch to fill","Both get worse","Nothing measurable changes"],"answer":1,"why":"Batching spreads fixed per-operation costs across many items, so total throughput rises — but each individual write now waits for the batch to assemble, so its own latency gets worse. You trade the individual's speed for the system's capacity. This tradeoff is everywhere once you see it: Kafka batching, database group commit, Nagle's algorithm in TCP. It's the purest example that latency and throughput aren't just different — they're often in direct opposition."},{"id":"lat-4-5","type":"tradeoff_slider","prompt":"You're designing 'send message' in a real-time chat app. Slide toward what you'd optimize.","leftLabel":"Low latency (send immediately)","rightLabel":"High throughput (batch aggressively)","answerRange":[0,35],"why":"A human is staring at the screen waiting for their message to appear, so latency wins decisively — batching would add delay to the one thing the user is watching. The question to always ask: *is a human waiting?* If yes, optimize latency. If no — logs, analytics, nightly ETL, ingestion pipelines — optimize throughput and batch hard. Same system, opposite answers, decided entirely by who's on the other end."},{"id":"lat-4-6","type":"multiple_choice","prompt":"Your pipeline: Load Balancer (10k rps) → App servers (2k rps) → Cache (50k rps) → Database (5k rps). What's the maximum throughput of the whole system?","choices":["50k rps","10k rps","5k rps","2k rps"],"answer":3,"why":"A chain is limited by its slowest stage — the app servers at 2k rps — and everything downstream is idle capacity you're paying for and can't use. The corollary is brutal and constantly ignored: optimizing a NON-bottleneck yields exactly zero improvement, so making the cache twice as fast here changes nothing. Measure first, find the actual constraint, then fix that; anything else is theatre."},{"id":"lat-4-7","type":"multiple_choice","prompt":"Users report the site is slow. Average latency looks fine at 80ms. CPU sits at 95%. p99 latency is 4 seconds. Diagnosis?","choices":["Nothing's wrong — the average is healthy","The servers are near saturation, so queueing is exploding the tail: most requests are fine, but the p99 is brutal. Add headroom or cut work per request","It's a DNS problem","The users have bad wifi"],"answer":1,"why":"95% CPU puts you deep in the queueing danger zone: the average hides it because most requests still sail through, but the ones arriving during a burst wait behind a queue — and that's your 4-second p99. The fix is headroom or less work per request, not a micro-optimization. This ties the whole unit together: latency and throughput are different, you need the numbers to reason, averages lie so you watch percentiles, and utilization is the hidden variable connecting them all."}]}]};
/* ---- 05-where-state-lives.json ---- */
const UNIT5 = {"unitId":"where-state-lives","title":"Where State Lives","subtitle":"State is the hard part — everything else is just compute","lessons":[{"id":"state-1","title":"State is the hard part","exercises":[{"id":"state-1-0","type":"concept","title":"State is what your system must remember; compute is everything you could kill and restart","viz":{"nodes":[{"id":"a","label":"Your app","col":0,"kind":"client"},{"id":"r","label":"Markdown renderer","sub":"no memory","col":1,"kind":"server"},{"id":"p","label":"Comment store","sub":"holds data","col":1,"kind":"db"}],"edges":[{"from":"a","to":"r"},{"from":"a","to":"p"}]},"body":"Some code only transforms: same input tomorrow, same answer, nothing kept in between. That's compute, the easy kind — run as many copies as you like, kill any of them, nobody notices, because no copy has to agree with any other. *State* is the opposite: data the system must remember. Copies of it have to agree, and that's where the hard problems live.","note":"Remembering nothing doesn't mean touching nothing — a renderer can chew through a 50MB file. It means nothing is *kept*: when the request ends, that copy is exactly as it was before it started."},{"id":"state-1-1","type":"multiple_choice","prompt":"You have two services: one resizes images (input in, output out, remembers nothing) and one stores user profiles. Which is trivially easy to run as 100 copies?","choices":["The profile store","The image resizer — it remembers nothing, so any copy can do any job","Both are equally easy","Neither can be copied"],"answer":1,"why":"The resizer is stateless: every copy is interchangeable, you can add or kill them freely, and no copy needs to agree with any other — while the profile store holds data, so its copies must somehow agree on the truth. Here's the thesis of the whole unit: almost every hard problem in system design is a state problem. Scaling stateless compute is boring — you add machines. Scaling state is where replication, sharding, consistency, and CAP all come from."},{"id":"state-1-2","type":"fill_blank","prompt":"A component is ______ if it keeps no memory between requests — so any copy can handle any request.","choices":["stateless","idempotent","cached","sharded"],"answer":0,"why":"Stateless = no memory between requests = interchangeable copies, and that interchangeability is what makes horizontal scaling easy."},{"id":"state-1-3","type":"multi_select","prompt":"Which of these are STATE (something the system must remember)? Select all.","choices":["A user's shopping cart","A function that adds two numbers","An uploaded profile photo","The number of likes on a post"],"answer":[0,2,3],"why":"Carts, photos, and like counts are all data the system must remember; pure computation isn't state, since the same inputs always give the same output and nothing is retained. The practical test: if you restarted every server in your fleet right this second, what would be lost? That is your state — everything else is just compute, and compute is the easy part."},{"id":"state-1-4","type":"match_pairs","prompt":"Match each term to its meaning.","pairs":[{"left":"Stateless","right":"Any copy can serve any request"},{"left":"Stateful","right":"Copies must agree on the data"},{"left":"Source of truth","right":"The one authoritative copy"},{"left":"Derived copy","right":"Can be rebuilt from the truth"}],"why":"These four words carry most of the unit: stateless scales freely, stateful needs coordination, the source of truth is authoritative, and derived copies are rebuildable. *Can it be rebuilt?* is the question separating a bad afternoon from a company-ending event — hold onto it, because lesson 3 is built on it."},{"id":"state-1-5","type":"multiple_choice","prompt":"Architects often say 'push state to the edges.' What does that mean?","choices":["Put servers physically near users","Keep the middle tier stateless and interchangeable, concentrating state in a few systems built to handle it","State should be avoided entirely","Move all data to the client"],"answer":1,"why":"You want a thin, stateless middle you can scale at will, with state concentrated in a small number of specialists (databases, caches) designed for the hard parts. This is why the classic 3-tier architecture exists at all: a stateless web/app tier you scale by adding boxes, plus a stateful data tier that's difficult, expensive, and carefully managed. The entire shape of the architecture is organized around quarantining state."},{"id":"state-1-6","type":"multiple_choice","prompt":"Why is a stateless app tier so much easier to operate than a stateful one?","choices":["It uses less memory","Any instance can be added, killed, restarted, or replaced at any time with no coordination and nothing lost","It doesn't need a network","It's written in a different language"],"answer":1,"why":"Disposability is the superpower: deploys, autoscaling, crashes, and rolling restarts all become non-events when no instance holds anything anyone needs. Every ops practice you like — blue/green deploys, autoscaling, chaos testing, spot instances — quietly depends on instances being disposable, and the moment state sneaks into an instance, all of it gets harder at once."}]},{"id":"state-2","title":"The places state can live","exercises":[{"id":"state-2-0","type":"concept","title":"State has to live somewhere, and every somewhere charges a different price","viz":{"nodes":[{"id":"c","label":"Client","sub":"the user's device","col":0,"kind":"client"},{"id":"s","label":"App server","sub":"its own RAM","col":1,"kind":"server"},{"id":"ca","label":"Shared cache","sub":"RAM, one hop away","col":2,"kind":"cache"},{"id":"db","label":"Database","sub":"on disk","col":2,"kind":"db"}],"edges":[{"from":"c","to":"s"},{"from":"s","to":"ca"},{"from":"s","to":"db"}]},"body":"State has to live somewhere, and there are only about four places: the client, a server's own RAM, a shared cache, a database on disk. Judge each on four axes: how fast, how durable (what survives a restart), who else can see it, and whether you can trust what comes back. Those four answers *are* the place's personality.","note":"Read those four axes again and notice what's missing: no single place is fast *and* durable *and* shared *and* trustworthy. Choosing where state lives always means deciding which of those you can do without."},{"id":"state-2-1","type":"multiple_choice","prompt":"You restart every server in your fleet. Which survives?","choices":["Data held in server RAM","Data written to a database on disk","Both survive","Neither survives"],"answer":1,"why":"RAM is volatile — a restart wipes it instantly — while disk is durable, so the database still has the data. This is the very first question to ask about any state: does it need to survive a crash? Durability is a spectrum you pay for: RAM is fastest and dies on restart; local disk survives a process crash but not a dead machine; replicated disk survives a machine; cross-region replication survives a whole datacenter. Every rung costs you."},{"id":"state-2-2","type":"match_pairs","prompt":"Match each place state can live to its defining property.","pairs":[{"left":"Client (cookie/token)","right":"Travels with the user, can't be trusted"},{"left":"Server RAM","right":"Fastest, lost on restart"},{"left":"Shared cache (Redis)","right":"Fast, shared by all servers, usually volatile"},{"left":"Database (disk)","right":"Durable source of truth, slowest"}],"why":"Four places, four personalities — and the whole design skill is matching the state to the place whose tradeoffs you can live with. Notice the ladder running through it: speed, durability, shared-ness, trust, and no option gives you all four. There is no place that is fast, durable, shared, and free, so choosing means giving something up on purpose."},{"id":"state-2-3","type":"multiple_choice","prompt":"You store the shopping cart's total price in a cookie on the client. What's the danger?","choices":["Cookies are too slow","The client controls it and can edit it — so a user could set their total to $0","Cookies expire too quickly","There's no danger; it saves a database call"],"answer":1,"why":"Anything living on the client is under the user's control — they can open dev tools and change it — so client state is never trustworthy for anything involving money, permissions, or security. The rule: client-held state is a convenience or a cache, never the source of truth for anything that matters. If you must put something sensitive there, sign it so tampering is detectable, which is precisely what a JWT's signature is for: the client carries the data but can't forge it."},{"id":"state-2-4","type":"multi_select","prompt":"Which are good reasons to put state in a shared cache like Redis instead of the database? Select all.","choices":["It's far faster — memory instead of disk","It takes read load off the database","It's the safest place for the only copy of critical data","It's shared, so every app server sees the same value"],"answer":[0,1,3],"why":"Redis is fast and shared — excellent reasons — but it's typically volatile, so it is emphatically not the place for the only copy of data you can't afford to lose. Caches should hold derived state, rebuildable from the source of truth: the moment data exists ONLY in your cache, you've turned your cache into a database without any of a database's durability guarantees, and teams discover this during the first unplanned Redis restart."},{"id":"state-2-5","type":"multiple_choice","prompt":"A message sitting in a queue waiting to be processed — is that state?","choices":["No, it's just a message in transit","Yes — it's in-flight state the system must not lose","Only if the message is large","Only if it's been there over a minute"],"answer":1,"why":"Work-in-progress is state: if the queue loses that message, the work simply vanishes — an order never ships, an email never sends, and nothing errors. This is exactly why real queues persist messages to disk and wait for an explicit acknowledgement before deleting them. At-least-once delivery exists because in-flight state is state, and it's why consumers must be idempotent, the property you met in unit 2."},{"id":"state-2-6","type":"multiple_choice","prompt":"What's the first question to ask about any new piece of state?","choices":["What programming language will read it?","If we lost it, what breaks — and who else needs to read it?","How many bytes is it?","Is it JSON or binary?"],"answer":1,"why":"Those two questions — what's lost, and who must read it — decide durability and sharing, and those two decide the place; everything else is detail. Run it on examples: a rebuildable computed value nobody else needs? Local memory is perfect. A payment record? Durable, replicated, shared. Same question, opposite answers, and you got there without a single technology name."}]},{"id":"state-3","title":"Copies and the truth","exercises":[{"id":"state-3-0","type":"concept","title":"Every copy is a copy of something allowed to change without telling it","viz":{"nodes":[{"id":"a","label":"App","col":0,"kind":"client"},{"id":"c","label":"Cache","sub":"may be stale","col":1,"kind":"cache"},{"id":"d","label":"Database","sub":"the truth","col":1,"kind":"db"}],"edges":[{"from":"a","to":"c"},{"from":"a","to":"d"}]},"body":"Give one piece of data two homes and they stop being the same thing. One is the *source of truth* — the copy that wins any argument, by definition. Everything else is derived: a cache, a replica, a search index. Derived copies exist to be fast, and they can be rebuilt from the truth. What they can't do is notice, unaided, that the truth moved on.","note":"In a design review the sharpest question you can ask is 'which of these is the source of truth?' Surprisingly often nobody knows — and that ambiguity is precisely where the worst bugs live."},{"id":"state-3-1","type":"multiple_choice","prompt":"The moment you cache a value so it exists in two places, what problem have you created?","choices":["None — you just made it faster","The two copies can disagree — you now own a consistency problem","Only extra storage cost","Only extra latency"],"answer":1,"why":"One copy can't disagree with itself; two copies can drift apart, and now you must decide what happens when they do and who wins. Generalize it: every performance optimization built on copies — caches, read replicas, CDNs, denormalization — buys speed with consistency. There is no copy without a consistency question attached, so when someone proposes a cache, they're proposing a consistency policy whether they've noticed or not."},{"id":"state-3-2","type":"fill_blank","prompt":"The one authoritative copy of a piece of data is called the source of ______.","choices":["truth","record","data","origin"],"answer":0,"why":"The source of truth is the copy that wins any argument: if two places disagree, it's right by definition and everything else is derived from it."},{"id":"state-3-3","type":"match_pairs","prompt":"Match each kind of copy to what it is.","pairs":[{"left":"Source of truth","right":"The authoritative copy — if in doubt, ask it"},{"left":"Cache","right":"A fast copy that may be stale"},{"left":"Replica","right":"A copy kept in sync, for reads or failover"},{"left":"Stale","right":"A copy that no longer matches the truth"}],"why":"Each copy has a job and a failure mode, and being explicit about which is which keeps a design honest. In a design discussion, the sharpest question you can ask is 'which of these is the source of truth?' — surprisingly often nobody knows, and that ambiguity is where the worst bugs live."},{"id":"state-3-4","type":"multiple_choice","prompt":"There's a famous joke: 'There are only two hard things in Computer Science: cache invalidation and naming things.' Why is cache invalidation genuinely hard?","choices":["Deleting keys is computationally expensive","Knowing WHEN a cached copy became wrong requires knowing every possible thing that could have changed it","Caches don't support deletion","It isn't hard — it's just a joke"],"answer":1,"why":"The cache has no idea the truth changed — someone has to tell it, or it has to guess, and both are imperfect while the knowledge of 'what invalidates this?' is scattered across every write path in your system. The two strategies: TTL (expire after N seconds — dead simple, but you knowingly serve stale data for up to N seconds) or explicit invalidation (delete the key when the data changes — precise, but you must find every write path forever, including the one a teammate adds next year without knowing your cache exists). Most real systems use both, because both are inadequate alone."},{"id":"state-3-5","type":"multiple_choice","prompt":"Your entire cache is accidentally wiped. Is that an outage?","choices":["Always a catastrophe — the data is gone","It depends: if it held derived state, it rebuilds from the source of truth — painful but recoverable. If it held the only copy, the data is gone","Never a problem — caches don't matter","Only if it was more than 1GB"],"answer":1,"why":"The question for any copy is: can I rebuild this? Derived state can be recomputed from the truth; if the cache was the only home, there's nothing to rebuild from. Be religious about this distinction — a wiped cache of derived state is a bad afternoon (every request stampedes the database at once until it refills, the *thundering herd*), while a wiped source of truth is a company-ending event. You should always know, without thinking, which one each store is."},{"id":"state-3-6","type":"tradeoff_slider","prompt":"You're displaying a user's account balance in a banking app. Slide toward how aggressively you'd cache it.","leftLabel":"Read the source of truth (correct, slower)","rightLabel":"Cache aggressively (fast, may be stale)","answerRange":[0,35],"why":"Showing someone the wrong balance is unacceptable — it's the one number they came to see, and being stale here looks like a bug or a theft, so pay the latency and read the truth. The governing question is always *what does staleness cost?* For a like count, essentially nothing — cache it hard. For a balance, or inventory during checkout, staleness is a real defect: you just oversold an item. Same technique, opposite decision, decided entirely by the cost of being wrong."}]},{"id":"state-4","title":"Deciding where state goes","exercises":[{"id":"state-4-0","type":"concept","title":"Where state lives is decided by what you promised, not by what's fastest","body":"Two questions settle nearly every placement. *If we lost this right now, what breaks?* — that sets how durable it has to be. *Who else needs to read it?* — that sets how shared it has to be. Answer both and the place picks itself. Notice that neither question is technical: they're about the promise you made, and the technology is just what keeps it.","note":"The two answers are the design; everything after them — which database, which cache — is shopping. Get them wrong in the cheap direction and you don't find out from a test. You find out from a user, mid-incident."},{"id":"state-4-1","type":"multiple_choice","prompt":"Where should an e-commerce shopping cart live?","choices":["Server RAM — it's the fastest option","It depends on the promise: if users expect their cart on their phone AND laptop, it must be in a database tied to their account","Always in a cookie — it saves database load","In the load balancer"],"answer":1,"why":"The answer flows from the product promise rather than from technology: cart on every device means a database keyed to the account, because nothing else can deliver that guarantee. Notice the decisive question wasn't technical at all — it was *what did we promise?* Where state lives is chosen by the guarantee you need first, and the performance you can afford second; reversing that order is how teams end up with fast systems that break their own promises."},{"id":"state-4-2","type":"build_diagram","prompt":"Uploaded photos are saved on one app server's local disk — so only that server can serve them, and they die with it. Where should they live?","viz":{"nodes":[{"id":"a1","label":"App Server 1","col":0,"kind":"server"},{"id":"a2","label":"App Server 2","col":0,"kind":"server"},{"id":"h","col":1,"hole":true}],"edges":[{"from":"a1","to":"h"},{"from":"a2","to":"h"}]},"palette":["Object storage (S3)","A bigger local disk","A cookie"],"answer":{"h":"Object storage (S3)"},"why":"Files on local disk are state trapped inside one server: peers can't serve them, and the machine can't be safely replaced — move them to shared object storage and your app servers become disposable again. This is one of the most common real-world migrations there is: 'it works on one server' quietly means state is hiding in the filesystem, and the day you add a second server, uploads mysteriously 404 half the time because the load balancer sent the read to the machine that doesn't have the file."},{"id":"state-4-3","type":"multi_select","prompt":"Your app servers must be disposable — any one can die at any moment. Which of these violate that? Select all.","choices":["Storing uploaded files on local disk","Keeping user sessions in local memory","Writing logs to stdout to be collected elsewhere","Caching a computed value in local memory that can be recomputed"],"answer":[0,1],"why":"Local files and local sessions die with the server and can't be served by peers — lost data and broken users. Logs to stdout are shipped away, and a rebuildable local cache costs only a recompute if lost. The test isn't 'is there anything in memory?' — plenty of state in memory is fine. It's 'if this server vanished right now, would anything be LOST or become unavailable?' A local cache fails safe; a local session fails the user."},{"id":"state-4-4","type":"multiple_choice","prompt":"To make `POST /payments` safely retryable, the server stores each idempotency key and its result. What have you just created?","choices":["Nothing — it's just a lookup","New state: the server must now durably remember keys, share them across servers, and eventually expire them","A cache, which needs no thought","A queue"],"answer":1,"why":"Idempotency isn't free — it's implemented WITH state: that key store must be durable (survive a crash mid-payment), shared (any server might receive the retry), and garbage-collected, or it grows forever. It's a lovely illustration of a general truth: 'make it reliable' almost always means 'add state, in exactly the right place'. Nothing is free — you're always moving the difficulty somewhere, and the skill is choosing somewhere that can handle it."},{"id":"state-4-5","type":"tradeoff_slider","prompt":"You're rate-limiting a paid API where exceeding the limit costs you real money. Slide toward where the counter should live.","leftLabel":"Local memory per server (fast, approximate)","rightLabel":"Shared store (exact, adds a network hop)","answerRange":[55,100],"why":"With per-server counters and 10 servers, a user can get roughly 10× the intended limit — each server only counts what it personally saw. That's tolerable for crude abuse protection and unacceptable when the limit is a billing boundary. Real systems often do both: a fast local pre-filter that sheds obvious abuse without a network hop, plus a shared store for exact accounting. Note what just happened — 'where does this counter live?' turned into a correctness-vs-latency decision, which is this unit's lens."},{"id":"state-4-6","type":"multiple_choice","prompt":"Which state placement is still SERVING you while an entire datacenter sits dark?","choices":["Redis running in that datacenter","A database on disk in that datacenter","Data replicated to a database in another region","Server RAM"],"answer":2,"why":"Watch that word *serving*. A database on disk in that datacenter does not lose your data when the power dies — it replays its write-ahead log and every committed row is still there, exactly as the durability lesson promised. What it loses is *availability*, for as long as the building is dark; and it loses everything only if the building is destroyed rather than merely unplugged. Being intact and being reachable are different properties, and conflating them is how people mis-scope disaster recovery. Only a copy in another region is both. You pay for it: an acknowledged cross-region write can put that ~150ms from the latency unit inside your write path. This is where 'where does state live' collides with physics, and it's the road that leads to CAP."},{"id":"state-4-7","type":"multiple_choice","prompt":"A teammate says: 'let's just keep it in memory for now — it's faster.' What single question should decide it?","choices":["Is memory cheap enough?","'If this server died right now, what would we lose — and who else needs to read this?'","How large is the object?","Which library are we using?"],"answer":1,"why":"Those two halves — what's lost, and who must read it — determine every state placement decision in this unit: local memory is perfect for rebuildable private data and catastrophic for durable shared data, from the same sentence. And the lens scales further than you'd think: replication is 'who else needs to read it?' at scale, sharding is 'it no longer fits in one place', and CAP is 'what happens when the copies can't talk?' Every hard thing ahead of you is this one question, asked louder."}]}]};

const UNIT6 = {"unitId":"what-a-database-is","title":"What a Database Is","subtitle":"Why you can't just use a file — and what a database actually promises","lessons":[{"id":"db-1","title":"Why not just use a file?","exercises":[{"id":"db-1-0","type":"concept","title":"A file stores your bytes and promises you nothing else","viz":{"nodes":[{"id":"s1","label":"Signup A","col":0,"kind":"server"},{"id":"s2","label":"Signup B","col":0,"kind":"server"},{"id":"f","label":"`users.txt`","sub":"no lock","col":1,"kind":"storage"}],"edges":[{"from":"s1","to":"f"},{"from":"s2","to":"f"}]},"body":"`users.txt`, one line per signup, works flawlessly — with one user. But a file is not a program. It's a region of bytes and an offset. It doesn't know what a record is, doesn't know what's inside it, and doesn't coordinate the processes writing to it. Ask what it *guarantees* and the honest answer is: it will hold whatever bytes reached the disk.","note":"A database is the program someone already wrote so you don't have to. Every feature it has is there because a file left a hole in exactly that shape."},{"id":"db-1-1","type":"multiple_choice","prompt":"You store users in `users.txt`. Two people sign up at the exact same instant and both write to the file. What happens?","choices":["Both are saved correctly — the OS handles it","The writes can interleave or overwrite each other, and one signup is silently lost","The file locks itself automatically","The second write is queued perfectly"],"answer":1,"why":"A plain file has no concurrency control: two writers can clobber each other and you lose data with no error at all, which is why handling concurrent writers safely is one of the main reasons databases exist. This is the first thing everyone rediscovers when they 'just use a file' — it works flawlessly with one user and breaks the moment there are two, and the silence is the dangerous part. Nothing crashes, nothing logs, a signup simply never happened."},{"id":"db-1-2","type":"multi_select","prompt":"What does a database give you that a plain file does not? Select all.","choices":["Safe concurrent access for many readers and writers","Finding one record without reading the whole file","Surviving a crash in the middle of a write","Storing bytes on a disk"],"answer":[0,1,2],"why":"Storing bytes is the one thing a file already does perfectly well — everything else (concurrency, querying, crash safety) is what you're actually buying. Worth stating plainly: a database is not 'a fancy file'. It's a concurrency system, a query engine, and a crash-recovery system that happens to keep bytes on a disk, and those three problems are why it's the most complex component you'll run."},{"id":"db-1-3","type":"multiple_choice","prompt":"Your process is killed halfway through writing a record to a file. What state is the file in?","choices":["Clean — the OS finishes the write for you","Possibly half-written and corrupt, with no record of what was in progress","It automatically rolls back to the previous version","Completely unchanged"],"answer":1,"why":"Nothing protects a partial write, so you can be left with half a record and no way to know what was meant to happen — corrupt data that looks like real data. A database refuses to leave you there: it keeps a log of intended changes so that after a crash it can recover to a clean state, where the change either fully happened or fully didn't. You'll see exactly how in this unit's last lesson."},{"id":"db-1-4","type":"multiple_choice","prompt":"`users.txt` has 10 million lines. You need the user with email `x@y.com`. What must you do?","choices":["Jump directly to that line","Read lines one by one until you find it — up to 10 million reads","Ask the operating system to find it instantly","Nothing — files are searchable by default"],"answer":1,"why":"A file has no idea what's inside it, so finding anything means scanning everything — while a database can jump straight to a record, and that difference is the entire game at scale. How it jumps is the subject of the Indexes unit; for now hold the shape of the problem: 'scan everything' versus 'go straight there' is a difference of a million times, not a few percent."},{"id":"db-1-5","type":"fill_blank","prompt":"A ______ is a program built to store data safely and let many users query and change it at once.","choices":["database","filesystem","cache","compiler"],"answer":0,"why":"Storage is the least interesting part of the definition — safety under concurrency and the ability to query are the point."},{"id":"db-1-6","type":"multiple_choice","prompt":"So what's the honest one-sentence reason databases exist?","choices":["Disks are hard to write to directly","Because storing data is easy, but querying it, sharing it between many concurrent users, and not losing it in a crash are all hard","They compress data better","They're required by web frameworks"],"answer":1,"why":"Every feature of a database traces back to one of those three hard problems: find it fast, share it safely, never lose it. Keep this frame — when you later evaluate any storage technology (SQL, NoSQL, a cache, object storage), you're really asking which of those three it does well and which it quietly gives up."}]},{"id":"db-2","title":"Tables, rows, and keys","exercises":[{"id":"db-2-0","type":"concept","title":"In the relational model, every fact has exactly one home","body":"Put every book and its author's details in one table and the author's name is stored once per book — one fact in twenty places, each free to disagree with the others. The relational model splits them. `authors` holds each author exactly once, under an id: its *primary key*. `books` stores only that id — a *foreign key*. A pointer, not a copy.","note":"The id should be meaningless — a number, not the author's name. Everything else about a row is allowed to change; identity isn't, and every table pointing at it would have to change too."},{"id":"db-2-1","type":"multiple_choice","prompt":"You're storing users and their orders. Why put them in two separate tables instead of one big table?","choices":["Two tables are always faster","So each fact lives in exactly one place — a user's email is stored once, not repeated on every order","There's no real reason; it's convention","To use less disk space overall"],"answer":1,"why":"If you repeat a user's email on all 500 of their orders, you now have 500 places to update when it changes — and 500 opportunities for them to disagree. This is normalization, the core idea of the relational model: every fact lives in exactly one place. Later you'll learn when to deliberately break the rule (denormalization) to buy speed, but you break it knowingly, accepting the update problem you just re-created."},{"id":"db-2-2","type":"match_pairs","prompt":"Match each piece of the relational model to what it is.","pairs":[{"left":"Table","right":"A collection of rows of the same shape"},{"left":"Row","right":"One record — one user"},{"left":"Column","right":"One field — `email`"},{"left":"Schema","right":"The agreed shape of the data"}],"why":"Tables hold rows, rows have columns, and the schema is the contract describing what shape every row must take. Notice 'schema' is the same idea as an API contract from unit 3 — an agreement about shape that many parties depend on — and it has the same property: changing it once people depend on it is the hard part."},{"id":"db-2-3","type":"multiple_choice","prompt":"What is a primary key?","choices":["The first column in the table","A value that uniquely identifies one row — no two rows can share it","The password protecting the table","The largest column"],"answer":1,"why":"The primary key is a row's identity — the handle you use to find, reference, and link that exact row. Which is why using an email as a primary key is a trap: everything else about a row can change, but identity shouldn't, and people change emails, so every table that referenced them must change too. Prefer a meaningless, stable id."},{"id":"db-2-4","type":"multiple_choice","prompt":"The orders table has a `user_id` column pointing at `users.id` — a foreign key. What does that buy you?","choices":["Nothing beyond documentation","It links the order to its user AND lets the database refuse to create an order for a user who doesn't exist","Faster queries only","Automatic encryption of the column"],"answer":1,"why":"A foreign key is a relationship and a guarantee at once: the database itself refuses to create orphan rows — orders belonging to nobody. That's a constraint, a rule the database enforces no matter who writes to it — your API, a migration script, a colleague's one-off query at 2am, an intern with `psql`. Rules in application code get bypassed by the next writer; rules in the database cannot be."},{"id":"db-2-5","type":"multi_select","prompt":"Why is having a schema useful? Select all.","choices":["The database rejects malformed data before it's ever stored","Anyone reading the table knows exactly what to expect","It lets the database store and read the data efficiently","It makes changing the shape of your data effortless"],"answer":[0,1,2],"why":"A schema buys you enforcement, shared understanding, and efficient storage — what it emphatically does not buy is easy change, since altering a schema on a huge live table is genuinely hard. That's the real tradeoff rather than a footnote: schema gives you guarantees today and friction tomorrow, and that exact tension is the seed of the SQL vs NoSQL argument in the very next unit."},{"id":"db-2-6","type":"fill_blank","prompt":"The ______ key uniquely identifies a row; a foreign key points at another table's row.","choices":["primary","secondary","index","search"],"answer":0,"why":"Primary key = this row's identity. Foreign key = a reference to some other row's identity. Together they're how the relational model links data without duplicating it."}]},{"id":"db-3","title":"How the database finds your data","exercises":[{"id":"db-3-0","type":"concept","title":"The query is a request, not a plan — and only the plan has a cost","viz":{"nodes":[{"id":"q","label":"Your `SELECT`","col":0},{"id":"p","label":"Query planner","sub":"picks one","col":1},{"id":"i","label":"Index lookup","sub":"~1ms","col":2},{"id":"s","label":"Full table scan","sub":"reads every row","col":2}],"edges":[{"from":"q","to":"p"},{"from":"p","to":"i"},{"from":"p","to":"s"}]},"body":"`SELECT * FROM users WHERE email = 'x@y.com'` describes a result. It contains no instructions — nothing about what to read, or whether to use an index. Between that text and the disk sits the *query planner*, which picks the strategy. Two runs of that identical text can differ in cost by a factor of a million, and the text never says which you got.","note":"The planner picks by guessing, from statistics it gathered about your data earlier. Which is why a query can get slow with no code change at all: the data shifted, the guess changed, and the plan changed underneath you."},{"id":"db-3-1","type":"multiple_choice","prompt":"You run `SELECT * FROM users WHERE email = 'x@y.com'` — on 10 million rows, with no index on `email`. What does the database do?","choices":["Jumps straight to the matching row","Reads all 10 million rows, checking each one — a full table scan","Asks the operating system to find it","Refuses to run the query"],"answer":1,"why":"Without an index the database does exactly what your text file did: reads everything. Writing SQL doesn't make something fast — it just makes it possible. Critical mental model: SQL is a request, not a promise about speed, and the same query can take 1ms or 10 seconds depending entirely on whether a suitable index exists. People are shocked by this because the query text looks identical either way."},{"id":"db-3-2","type":"multiple_choice","prompt":"Now: `SELECT * FROM users WHERE id = 42`, where `id` is the primary key. Fast or slow?","choices":["Slow — same as scanning every row","Fast — the primary key is automatically indexed, so the database jumps straight there","Slow, because it uses the disk","It depends on the table's size, always"],"answer":1,"why":"Primary keys come with an index for free, which is why looking up by id is instant while looking up by an unindexed email is a scan. This is why so many systems feel fine in development: everyone looks things up by id at first, and that's always fast. The scans arrive later, with the features that search by email, by name, by status."},{"id":"db-3-3","type":"match_pairs","prompt":"Match each concept to what it means.","pairs":[{"left":"Query","right":"A question you ask of the data"},{"left":"Full table scan","right":"Reading every row to find matches"},{"left":"Join","right":"Combining rows from two tables via a link"},{"left":"Query planner","right":"The database's decision about HOW to run your query"}],"why":"You ask a question, the planner decides the strategy, a scan is the brute-force one, and a join reassembles data you deliberately split apart. Joins are the payoff for normalizing — store each fact once, reassemble views of it on demand — but reassembly isn't free, and joining huge tables is precisely where the relational model starts to hurt at scale. That pain is a major reason NoSQL and denormalization exist."},{"id":"db-3-4","type":"multiple_choice","prompt":"Why is SQL called a 'declarative' language?","choices":["Because it's verbose and hard to read","You declare WHAT data you want; the database decides HOW to fetch it","Because you declare variables before using them","It's just a historical name"],"answer":1,"why":"You describe the result you want, and the query planner chooses the strategy — which index to use, which table to read first, how to join. This is both a superpower and a landmine: the planner has statistics about your data and can optimize better than you'd hand-code, but a small change in the data distribution can make it pick a different plan and your query falls off a performance cliff with zero code changes. 'Nothing changed, but it got slow' is usually this."},{"id":"db-3-5","type":"estimate","prompt":"A full scan must check 10 million rows. If the database can check roughly 1 million rows per second, about how many seconds does that one query take?","answer":10,"tolerance":2,"unit":"seconds","why":"10 million ÷ 1 million per second = about 10 seconds, for a single query — now picture 100 users running it at once. This is why 'scan vs indexed lookup' isn't a nice-to-have optimization but the difference between a product and an outage: those 100 concurrent scans saturate your database, queue up (remember unit 4), and take down every other query too, including the fast ones."},{"id":"db-3-6","type":"multi_select","prompt":"Which of these actually make a query faster? Select all.","choices":["An index on the column you filter by","Fetching only the columns you actually need","Using `SELECT *` on a huge table","Filtering in the database instead of in your application code"],"answer":[0,1,3],"why":"Index the column you filter on, ask for less data, and let the database do the filtering — `SELECT *` on a wide table is the opposite, dragging columns you'll never read across the network. 'Filter in the database, not in the app' deserves special emphasis: pulling a million rows over the network to filter them down to ten in Python is the single most common performance sin in web development. Move the work to the data, because the data is heavy and the answer is light."}]},{"id":"db-4","title":"What a database actually promises","exercises":[{"id":"db-4-0","type":"concept","title":"The database makes you wait for a disk, and gives you a promise in exchange","viz":{"nodes":[{"id":"c","label":"Client","col":0,"kind":"client"},{"id":"d","label":"Database","col":1,"kind":"db"},{"id":"w","label":"Write-ahead log","sub":"flushed","col":2,"kind":"storage"},{"id":"p","label":"Data pages","sub":"later","col":2,"kind":"storage"}],"edges":[{"from":"c","to":"d"},{"from":"d","to":"w"},{"from":"d","to":"p","dash":true}]},"body":"A database that answered `INSERT` before the change reached a disk would be fast, and would quietly lose work it had already accepted. Writing it into the huge data file first would be honest and far too slow. So: append a note of what it's about to do to one sequential log — the *write-ahead log* — force that down, then answer.","note":"The data pages can lag as far behind as they like, because the log is the authority: whatever it holds, the database can redo after a crash. Durability isn't the data being written — it's the *intention*, written first."},{"id":"db-4-1","type":"multiple_choice","prompt":"You `INSERT` a row and the database returns success. Then the power dies. Is your row there when it comes back up?","choices":["No — it was still in memory","Yes — 'success' means the database durably recorded it before answering","Only if it was small","Only if you waited a few seconds"],"answer":1,"why":"That's the promise, and it's the whole point of the word *committed*: it survives a crash, or the word would mean nothing. The trick is the write-ahead log (WAL): before touching the real data, the database appends a record of what it's about to do to a sequential log and forces THAT to disk, then replays it after a crash. That's how you get durability without paying for a slow random disk write on every single change."},{"id":"db-4-2","type":"multiple_choice","prompt":"Why is the write-ahead log fast, even though it forces data onto disk before returning?","choices":["It's kept in memory only","It's a sequential append — and appending is dramatically faster than writing randomly across the disk","It's compressed","It isn't fast; it's just a necessary cost"],"answer":1,"why":"The log is append-only, so the disk writes one continuous stream instead of hopping around to update scattered data pages — and sequential beats random by a huge margin. Sequential vs random access is one of the largest performance facts in all of storage, and databases are engineered around it rather than pretending disk behaves like RAM. Once you notice it, you see it everywhere: log-structured storage, Kafka, SSD write patterns."},{"id":"db-4-3","type":"multiple_choice","prompt":"Two requests read a counter (value 10), each adds 1 in application code, and each writes back 11. What just happened?","choices":["The counter is 12 — correct","The counter is 11 — one increment vanished silently","The database throws an error","The counter stays at 10"],"answer":1,"why":"This is a lost update: both read 10, both computed 11, both wrote 11, and one user's increment simply disappeared with no error anywhere. It's the `users.txt` problem again wearing a database costume. The fix is to stop doing read-modify-write in your app and let the database do it atomically (`UPDATE counters SET n = n + 1`), or use a transaction with proper isolation — the subject of the Transactions unit. The lesson that matters right now: concurrency bugs don't crash, they quietly corrupt."},{"id":"db-4-4","type":"multi_select","prompt":"Which of these are guarantees the DATABASE should enforce, rather than your application code? Select all.","choices":["Uniqueness — no two users with the same email","Referential integrity — no order without a real user","Crash-safe durability of committed data","Business rules like 'premium users get 20% off'"],"answer":[0,1,2],"why":"Constraints and durability belong in the database — it enforces them for every writer, forever — while business policy changes with the product and belongs in the app. The test: *would this rule still be true no matter which app, script, or human writes to this table?* If yes, it's a data invariant, so put it where it can't be bypassed. If it's policy marketing might change next quarter, keep it in the application."},{"id":"db-4-5","type":"multiple_choice","prompt":"Your signup code checks 'does this email already exist?' and then `INSERT`s if not. Two signups for the same email race each other. What breaks?","choices":["Nothing — the check handles it","Both checks pass before either insert runs, so you get two users with the same email","The database deadlocks","The second request is automatically rejected"],"answer":1,"why":"Check-then-act is a race, always: between your check and your insert, the other request slips through, and both believe they're the first. The only reliable fix is a `UNIQUE` constraint in the database, letting one insert fail and handling that error. This is why the database is the last line of defense — it's the single point every writer must pass through, so application checks are advisory while database constraints are law."},{"id":"db-4-6","type":"tradeoff_slider","prompt":"You're recording analytics events at enormous volume — billions per day. Slide toward how strictly each write must be durable.","leftLabel":"Every event durably committed (safe, slow)","rightLabel":"Batched / fire-and-forget (fast, may lose a few)","answerRange":[55,100],"why":"Losing a handful of events out of billions changes no decision anyone will ever make, so throughput matters vastly more here than perfect durability — batch hard and accept a little loss. This is unit 5's *what does it cost to be wrong?* applied to durability: a payment must never vanish, an analytics ping can. Paying for guarantees you don't need is exactly how you build a system that's slow AND expensive."},{"id":"db-4-7","type":"multiple_choice","prompt":"Why is the database usually the hardest part of a system to scale?","choices":["It's written in a low-level language","It's the stateful source of truth — app servers are disposable clones, but copies of data must agree with each other","Because it uses a disk","Because the software is old"],"answer":1,"why":"Your app servers are interchangeable and you scale them by adding boxes; the database holds the truth, and the moment you want a second copy of the truth for scale, you inherit replication, consistency, and conflict. This is unit 5's lens at its sharpest: you deliberately concentrated your state here, which makes the database simultaneously your most valuable component and your bottleneck — and everything ahead (indexes, replication, sharding, CAP) is a consequence of that one decision."}]}]};
