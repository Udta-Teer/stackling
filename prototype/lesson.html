const UNIT29 = {"unitId":"checkpoint-storing-data","title":"Checkpoint: Storing Data","subtitle":"Mixing units 6–10 — the promises a database makes, and the ones it quietly doesn't","lessons":[{"id":"cp2-1","title":"Mixed recall","exercises":[{"id":"cp2-1-1","type":"multiple_choice","prompt":"You add an index to speed up a slow `SELECT`. Your `INSERT`s get slower. Why?","choices":["The index locks the table on every write","Every `INSERT` must now write the row *and* update the index — a second structure to keep sorted","Indexes force a full table scan on write","It doesn't — that's a coincidence"],"answer":1,"why":"An index is a second copy of some columns, kept in order. Every write to the table is now a write to the table *and* a write to each index on it, sometimes splitting a B-tree page to make room. That's the bill for the read speedup, and it's why 'add an index' isn't free and 'add twelve indexes' is a write-throughput problem you built on purpose. The rule of thumb worth carrying: indexes make reads faster and writes slower, so index the columns you filter on, not the columns you have.","hint":"What else has to stay correct when a row appears?"},{"id":"cp2-1-2","type":"fill_blank","prompt":"Before touching the real data, the database appends a record of what it's about to do to a sequential ______ and forces *that* to disk.","choices":["write-ahead log","index","replica","cache"],"answer":0,"why":"The write-ahead log is how durability gets to be fast. A random write to a data page scattered somewhere on disk is expensive; an append to the end of one sequential file is cheap. So the database makes the cheap durable write first, acknowledges you, and updates the real pages at its leisure — and if the power dies in between, it replays the log on startup. Notice that this same log is what replication ships to followers in Postgres: one mechanism, two jobs.","hint":"It's how a crash doesn't cost you an acknowledged write."},{"id":"cp2-1-3","type":"multi_select","prompt":"Your signup endpoint creates duplicate accounts under load. Which of these actually fix it? Select all.","choices":["A `UNIQUE` constraint on `email`","`SELECT` to check the email is free, then `INSERT` if nothing came back","Wrapping that check-then-insert in a transaction at Read Committed","Running that check-then-insert at Serializable isolation"],"answer":[0,3],"why":"This is check-then-act, and a transaction alone doesn't save you. At Read Committed two requests can both run the `SELECT`, both see nothing, and both `INSERT` — neither ever saw the other's uncommitted row, so nothing conflicted and you have two accounts. Serializable *does* catch it: Postgres takes a predicate lock on what you searched for, spots the read-write conflict, and aborts one transaction with a serialization error you must retry. The `UNIQUE` constraint is the cheaper answer, and the better one — it turns a race you have to reason about into an error the database hands you. Note it's an index doing that work, which is why 'indexes are just optimization' isn't quite true.","hint":"Two requests, both looking before they leap, at exactly the same moment."},{"id":"cp2-1-4","type":"multiple_choice","prompt":"Your code runs the same `SELECT` twice inside one transaction and assumes it gets the same rows back. On Postgres, which isolation level are you assuming — and which do you get by default?","choices":["Assuming Repeatable Read; you get Repeatable Read by default","Assuming Repeatable Read; but Postgres defaults to Read Committed, where each *statement* takes a fresh snapshot","Assuming Serializable; you get Serializable by default","Assuming Read Uncommitted; you get Read Uncommitted by default"],"answer":1,"why":"Postgres defaults to Read Committed, and at that level every *statement* gets its own snapshot — so the same `SELECT`, run twice in one transaction, can legitimately return different rows if someone committed in between. That's a non-repeatable read, and it's the default. Repeatable Read gives you one snapshot for the whole transaction. The transferable lesson isn't the level names, it's the gap: your code carries an assumption, the database ships a default, and almost nobody checks whether the two agree. MySQL's InnoDB defaults to Repeatable Read, so the same code changes behaviour when you change engine.","hint":"The default is weaker than the thing you're assuming."},{"id":"cp2-1-5","type":"match_pairs","prompt":"Match each replication term to what it means.","pairs":[{"left":"Synchronous replication","right":"The leader waits for a follower before acknowledging"},{"left":"Asynchronous replication","right":"The leader acknowledges immediately; followers catch up after"},{"left":"Replication lag","right":"How far behind the leader a follower currently is"},{"left":"Failover","right":"Promoting a follower when the leader is gone"}],"why":"The whole of replication is one trade, made twice. Synchronous means an acknowledged write is already on two machines, so failover loses nothing — and every write now pays the round trip to the follower, plus you're down if the follower is. Asynchronous means writes stay fast and a failover can lose whatever hadn't shipped yet. Lag is the visible size of that gap, and failover is the moment it stops being theoretical: promote a follower that's 200ms behind and 200ms of acknowledged writes are simply gone.","hint":"Two of these are settings, one is a measurement, one is an event."},{"id":"cp2-1-6","type":"multiple_choice","prompt":"A read replica is 200ms behind. A user saves their profile, and the page reloads immediately. What can they see?","choices":["Their new profile — the write already committed","Possibly their OLD profile, because the reload can land on a replica that hasn't applied the change yet","An error","The replica blocks the read until it catches up"],"answer":1,"why":"This is read-your-writes, and it's the first place replication stops being an ops detail and becomes a bug your users report. The write is committed and durable on the leader — nothing is broken — but the read went somewhere that hasn't heard about it yet, so the user watches their own change vanish. It's a nasty class of bug precisely because it's invisible in testing, where there's no lag. The usual fixes: send a user's reads to the leader for a few seconds after they write, or track the write position and require the replica to have reached it.","hint":"Committed on the leader is not the same as visible where you're reading."}]},{"id":"cp2-2","title":"Connecting the units","exercises":[{"id":"cp2-2-1","type":"build_diagram","prompt":"Wire a leader–follower setup: writes must land in one place, and that place ships its log onward.","viz":{"nodes":[{"id":"a","label":"App Servers","col":0,"kind":"server"},{"id":"h1","col":1,"hole":true},{"id":"h2","col":2,"hole":true}],"edges":[{"from":"a","to":"h1"},{"from":"h1","to":"h2"}]},"palette":["Leader","Follower","Cache","Load Balancer"],"answer":{"h1":"Leader","h2":"Follower"},"why":"Every write goes to exactly one leader — that's what makes the ordering unambiguous and the conflicts impossible. The leader then streams its write-ahead log to followers, which replay it. Reads can come from either, and *that* is the whole bargain: you got read capacity, and you paid for it with a window where a follower's answer is out of date. Notice the shape is one-directional. The moment you let writes into both boxes you've invented multi-leader replication and inherited conflict resolution, which is a genuinely harder problem than the one you were trying to solve.","hint":"Which box can never be wrong about the order of writes?"},{"id":"cp2-2-2","type":"simulate","prompt":"Your leader tops out at 5,000 req/s. Read traffic is 30,000 req/s. Drag reads onto replicas until the leader survives — using the *smallest* share you can.","viz":{"nodes":[{"id":"app","label":"App Servers","col":0,"kind":"server"},{"id":"router","label":"Read Router","col":1,"kind":"lb"},{"id":"leader","label":"Leader","col":2,"kind":"db"},{"id":"replicas","label":"Replicas","sub":"stale by ~200ms","col":2,"kind":"db"}],"edges":[{"from":"app","to":"router"},{"from":"router","to":"leader"},{"from":"router","to":"replicas","dash":true}]},"sim":{"input":30000,"inputLabel":"Read traffic","chain":["router","leader"],"capacity":{"router":100000,"leader":5000},"watch":"leader","watchLabel":"Hitting the leader","absorb":{"node":"router","label":"Share of reads sent to replicas","min":0,"max":100,"start":0,"unit":"%"}},"answerRange":[84,88],"why":"84% and the leader lives: 30,000 × 16% = 4,800. Now read what you actually just did. You didn't buy read capacity — you bought read capacity *in exchange for correctness*, and the slider told you the exchange rate. At 84% you have decided that roughly five out of every six reads in your product may be served from a copy that is 200ms out of date, and you have decided it globally, for every read, whether or not that read could tolerate it. That's the real skill: notice that a capacity dial and a consistency dial are the same dial, and that the interesting engineering is choosing *which* reads go left — a stale product listing is fine, a stale bank balance is a support ticket.","hint":"The leader's limit is fixed. The only free variable is what fraction never reaches it."},{"id":"cp2-2-3","type":"multiple_choice","prompt":"Your code does: `BEGIN` · `SELECT balance` (100) · your app computes `100 - 10` · `UPDATE balance = 90` · `COMMIT`. Two of these run at once at Read Committed. What happens?","choices":["The database serializes them; the balance ends at 80","Lost update: both read 100, both write 90, and one withdrawal silently vanishes","One transaction gets a deadlock error","Read Committed prevents this"],"answer":1,"why":"Both transactions read 100 before either wrote, both computed 90, both wrote 90. The balance ends at 90 after two withdrawals of 10, and no error was raised anywhere — the money is just gone. This is a lost update, and it happens because the *decision* was made in your application, outside the database's view. Read Committed doesn't stop it: neither transaction ever read uncommitted data or re-read a changed row, so nothing it protects against occurred. Three real fixes, in increasing order of cost: do the arithmetic in the database (`UPDATE ... SET balance = balance - 10`, atomic), take the row lock up front (`SELECT ... FOR UPDATE`), or move to Repeatable Read, where Postgres aborts the second `UPDATE` with a serialization failure you have to retry.","hint":"Where does the subtraction actually happen?"},{"id":"cp2-2-4","type":"spot_bottleneck","prompt":"Every write in your system takes this path. Where's the ceiling?","viz":{"nodes":[{"id":"n0","label":"Load Balancer","sub":"80k rps","col":0,"kind":"lb"},{"id":"n1","label":"App Servers","sub":"25k rps","col":1,"kind":"server"},{"id":"n2","label":"Leader","sub":"5k writes/s","col":2,"kind":"db"},{"id":"n3","label":"Followers","sub":"replay 9k/s","col":3,"kind":"db"}],"edges":[{"from":"n0","to":"n1"},{"from":"n1","to":"n2"},{"from":"n2","to":"n3"}]},"answer":2,"why":"A chain's throughput is its slowest link, and here that's the leader at 5,000 writes/s — everything upstream can deliver far more than it can take. Look at the box next to it before you move on. The followers replay at 9,000/s, so at the leader's ceiling they have only 4,000/s of slack — and that margin is what your replication lag lives in. Narrow it (a heavier write mix, a slow disk, a vacuum) and lag starts growing and doesn't shrink back on its own. Write capacity and replication lag are not independent numbers, which is why 'the leader can take 5k' is a more fragile claim than it looks.","hint":"Adding app servers can't help you past a number further down."},{"id":"cp2-2-5","type":"estimate","prompt":"A table has 1 billion rows. Its B-tree index has a fanout of about 500 (each node points at ~500 children). Roughly how many levels deep is the tree?","answer":4,"tolerance":1,"unit":"levels","why":"500³ = 125 million, which isn't enough; 500⁴ = 62.5 billion, which is plenty. So four levels covers a billion rows, and a lookup is about four page reads — most of which are cached, because the upper levels are tiny and get hit constantly. This is the number that should recalibrate you: growing from a million rows to a billion — a *thousandfold* — took the index from three levels to four. Depth grows logarithmically, so 'the table got huge, lookups must be slow now' is almost always wrong, and the real reason your query got slow is that it stopped using the index at all.","hint":"How many times do you multiply 500 by itself before you pass a billion?"},{"id":"cp2-2-6","type":"multiple_choice","prompt":"You arrived at this tier believing a database 'just works'. What has it actually shown you?","choices":["Databases are unreliable and you should avoid them","A database is a stack of promises you *configure* — durability, isolation, freshness — and every default trades one of them for speed","You should always use the strongest setting available","NoSQL avoids all of this"],"answer":1,"why":"Every hard thing in this tier was a dial someone had already set for you. In Postgres, isolation defaults to Read Committed, so your check-then-insert races. Durability can be relaxed until an acknowledged write is a lie. Replication defaults to asynchronous, so your own writes can vanish from your own screen. None of those are bugs — they're deliberate trades of correctness for speed, chosen by people who couldn't know your product. 'Always use the strongest setting' is the tempting wrong answer: turning everything to maximum means synchronous commits, Serializable retries and leader-only reads, which is a correct system nobody can afford to run. The skill isn't picking the strongest setting, it's knowing which promise you just sold and what you got for it.","hint":"Every default in this tier was someone choosing speed on your behalf."}]}]};
/* ---- 30-checkpoint-serving-scale.json ---- */
const UNIT30 = {"unitId":"checkpoint-serving-scale","title":"Checkpoint: Serving Scale","subtitle":"Mixing units 11–17 — every technique here buys capacity by selling something else","lessons":[{"id":"cp3-1","title":"Mixed recall","exercises":[{"id":"cp3-1-1","type":"multiple_choice","prompt":"You put three app servers behind a load balancer. Users start getting logged out at random. What did you forget?","choices":["The load balancer needs a bigger machine","Session state lives in one server's memory, so a request routed elsewhere doesn't recognise the user","Three is an unlucky number of servers","You need a second load balancer"],"answer":1,"why":"This is the tax on horizontal scaling, and it catches everyone once. Any state kept in a single server's memory turns that server into the only one who can serve you — so the moment the load balancer sends you to a peer, your session doesn't exist. Two ways out, and they're not equal: sticky sessions pin you to the server that has your data, which works until that server dies and takes your session with it, and quietly undoes the load balancing you were trying to do. Moving the session into shared storage — Redis, a signed cookie — makes every server interchangeable, which is what 'stateless' actually means and why it's the precondition for everything else in this tier.","hint":"What does server 1 know that server 2 doesn't?"},{"id":"cp3-1-2","type":"multi_select","prompt":"Which of these genuinely raise your cache HIT RATE? Select all.","choices":["A longer `TTL`","More cache memory, so fewer items get evicted","A faster cache server","Normalising cache keys, so `/products?a=1&b=2` and `/products?b=2&a=1` share one entry"],"answer":[0,1,3],"why":"Hit rate is about how often the answer is *there*, which is decided by how long you keep things and how many you can hold. A longer `TTL` keeps entries alive to be hit again — and buys staleness with the same move. More memory means less eviction. Key normalisation is the sleeper: two spellings of the same question are two entries, each half as likely to be hit, and this is a genuinely common bug — you can find caches in production running at half the hit rate they should because a query-string order or a trailing slash forked every key in two. A faster cache server makes hits *cheaper*, not more frequent; it's the one that improves latency without touching the rate.","hint":"Three of these change whether the answer is there. One changes how fast you get it."},{"id":"cp3-1-3","type":"multiple_choice","prompt":"You shard users across 16 databases by `user_id`. Product asks for 'every order placed today, across all users'. What does that query cost now?","choices":["The same as before — the shard router handles it","A scatter-gather: all 16 shards are queried, and you wait for the slowest one","It's impossible once you shard","One shard, because dates aren't sharded"],"answer":1,"why":"Sharding makes queries that name the shard key fast and everything else expensive. This query doesn't mention `user_id`, so there's no way to know where the answer lives except to ask all 16 and merge — and your latency becomes the *slowest* of 16, not the average. That's the part people miss: with a 99th-percentile latency on each shard, hitting 16 of them means you're now getting a p99-ish experience on roughly 15% of these queries, because 1 − 0.99¹⁶ ≈ 0.15. Fanning out doesn't average tails, it collects them. This is why choosing the shard key is the decision that outlives every other one you make here: it silently sorts your future queries into 'fast' and 'a report you run at 3am'.","hint":"The query doesn't mention the shard key. So which shard has the answer?"},{"id":"cp3-1-4","type":"match_pairs","prompt":"Match each load balancing strategy to what it actually does.","pairs":[{"left":"Round robin","right":"Next server in the list, every time"},{"left":"Least connections","right":"Whoever is currently handling the fewest"},{"left":"Consistent hashing","right":"Same key lands on the same server, and adding one moves few keys"},{"left":"Health checks","right":"Stop sending traffic to a server that stopped answering"}],"why":"Round robin assumes every request costs the same, which is false the moment one endpoint is a report and another is a health ping. Least connections adapts to that automatically and is the better default more often than people think. Consistent hashing is the one worth really understanding, because it's the same idea that makes sharding and distributed caches possible: with plain `hash % N`, changing N remaps almost every key at once — which empties your entire cache the moment you add a node. Health checks are the unglamorous one that decides whether your outage lasts seconds or hours.","hint":"One of these is about *stability* when the server count changes."},{"id":"cp3-1-5","type":"multiple_choice","prompt":"A user in Tokyo requests an image. The CDN edge in Tokyo doesn't have it. What does that miss actually cost?","choices":["The full original price — same as having no CDN at all","Less than no CDN: the user's TLS handshake still terminates in Tokyo, and the edge usually has a warm connection to the origin","Nothing — the CDN generates it","The request fails"],"answer":1,"why":"A miss isn't a bypass. The expensive part of a cold request is the handshake — several round trips to establish TCP and TLS — and those still happen against the Tokyo edge, milliseconds away, not against your origin in Virginia. The edge then fetches over a connection it already has open and often keeps warm, over network paths it has optimised. So the miss costs you one origin fetch, not the round trips a naive user would have paid. This is why CDNs help even for content that's never cached twice, and why 'our hit rate is low so the CDN isn't earning its keep' is usually the wrong conclusion.","hint":"What's slow about a first connection — and where does that part now happen?"},{"id":"cp3-1-6","type":"fill_blank","prompt":"A queue lets a slow consumer fall behind a fast producer without dropping work. The visible symptom of that is a growing queue ______.","choices":["depth","latency","throughput","partition"],"answer":0,"why":"Queue depth is the number that tells you the truth, and it's the one people forget to alarm on. A queue converts an availability problem into a latency problem: instead of the producer failing when the consumer can't keep up, work piles up and gets done late. That's usually the trade you want — but only if the pile is temporary. If producers are permanently faster than consumers, depth grows without bound, and eventually you're not running late, you're running out of disk. So the useful alert isn't 'the queue is deep', it's 'the queue is deeper than it was an hour ago and the trend doesn't turn around'.","hint":"It's a count, not a duration."}]},{"id":"cp3-2","title":"Connecting the units","exercises":[{"id":"cp3-2-1","type":"build_diagram","prompt":"Build the read path for a scaled web app: spread the traffic, then check for a saved answer, then fall back to the source of truth.","viz":{"nodes":[{"id":"c","label":"Clients","col":0,"kind":"client"},{"id":"h1","col":1,"hole":true},{"id":"s1","label":"App Server","col":2,"kind":"server"},{"id":"s2","label":"App Server","col":2,"kind":"server"},{"id":"h2","col":3,"hole":true},{"id":"h3","col":4,"hole":true}],"edges":[{"from":"c","to":"h1"},{"from":"h1","to":"s1"},{"from":"h1","to":"s2"},{"from":"s1","to":"h2"},{"from":"s2","to":"h2"},{"from":"h2","to":"h3"}]},"palette":["Load Balancer","Cache","Database","Message Queue"],"answer":{"h1":"Load Balancer","h2":"Cache","h3":"Database"},"why":"This is the shape most web systems converge on, and each box is one lesson from this tier: spread the load so no single server is the limit, keep the answer close so most reads never do the expensive work, and hold the truth in one place so there's something to be right about. Notice the ordering is not arbitrary. The load balancer is in front because it has to see every request. The cache is between the app and the database because its whole job is to be *in the way* of the expensive thing. Put the cache behind the database and you have a component that caches nothing; put it in front of the load balancer and you're caching before you know who's asking.","hint":"Each component has to be in the way of the thing it's protecting you from."},{"id":"cp3-2-2","type":"simulate","prompt":"Your origin serves 1,000 req/s before it dies. A launch sends 50,000 req/s of static assets at it. Drag the CDN hit rate to the *lowest* setting that keeps the origin alive.","viz":{"nodes":[{"id":"u","label":"Users","col":0,"kind":"client"},{"id":"cdn","label":"CDN Edge","col":1,"kind":"cdn"},{"id":"origin","label":"Origin","col":2,"kind":"server"}],"edges":[{"from":"u","to":"cdn"},{"from":"cdn","to":"origin"}]},"sim":{"input":50000,"inputLabel":"Incoming traffic","chain":["cdn","origin"],"capacity":{"cdn":500000,"origin":1000},"watch":"origin","watchLabel":"Reaching the origin","absorb":{"node":"cdn","label":"CDN hit rate","min":0,"max":100,"start":0,"unit":"%"}},"answerRange":[98,99],"why":"98%. Sit with that for a second, because it reframes what a CDN is. A 95% hit rate — a number that sounds like an unambiguous success, and that you'd happily put on a slide — sends 2,500 req/s at an origin that dies at 1,000. It isn't close. It's 2.5× over. The last three points of hit rate are doing more work than your entire origin fleet, which is why CDN hit rates get quoted to a decimal place and why one uncacheable `Set-Cookie` header on your logo can take a site down. The general lesson, and it's the one to carry out of this tier: when a component absorbs most of the load, your survival is decided entirely by the *miss* rate, and the miss rate is a small number that behaves violently.","hint":"The origin's limit is 2% of the traffic. So what has to be absorbed?"},{"id":"cp3-2-3","type":"spot_bottleneck","prompt":"You cached everything and added app servers. Traffic is 30k rps. Where's the ceiling now?","viz":{"nodes":[{"id":"n0","label":"Load Balancer","sub":"100k rps","col":0,"kind":"lb"},{"id":"n1","label":"App Servers","sub":"60k rps","col":1,"kind":"server"},{"id":"n2","label":"Cache","sub":"80k rps","col":2,"kind":"cache"},{"id":"n3","label":"Database","sub":"3k rps","col":3,"kind":"db"}],"edges":[{"from":"n0","to":"n1"},{"from":"n1","to":"n2"},{"from":"n2","to":"n3"}]},"answer":3,"why":"The database, at 3k — and the interesting part is that it might be *fine anyway*. At a 95% hit rate only 1,500 rps of that 30k reaches it, so you're comfortably inside the limit and nothing is on fire. That's exactly what makes this the dangerous shape: your true capacity is now 3,000 ÷ your miss rate, a number nobody has written down, and it moves whenever someone deploys a new query, shortens a `TTL`, or restarts Redis. The cache didn't remove the bottleneck, it *hid* it — which is the same thing right up until the moment the cache is cold, and then 30k rps arrives at a database that can take 3k. That's unit 13's cache-2-6 scenario — losing the cache multiplies the origin's load by twenty — and it's why 'we're fine, we have a cache' and 'we're one Redis restart from an outage' are frequently the same system.","hint":"Divide by the miss rate, then ask what happens when the cache is empty."},{"id":"cp3-2-4","type":"tradeoff_slider","prompt":"You're rate limiting an API. Set the limit strictly enough to protect the backend, loosely enough not to break legitimate bursty clients.","leftLabel":"Loose — never block a real user","rightLabel":"Strict — protect the backend at all costs","answerRange":[40,70],"why":"The honest answer sits in the middle, and lands there for a reason worth naming: rate limiting is the one technique in this tier that fails by hurting the people you built the thing for. Too loose and it isn't protection, it's a suggestion — the backend still falls over, just with a counter watching. Too strict and you've built an outage that only affects your best customers, because the mobile client that fires twelve parallel requests on app open looks exactly like abuse. What resolves it isn't the number, it's the shape: a token bucket lets a client burst and then throttles to a sustained rate, which is a fair description of what real clients actually do. And the failure mode you can't slider your way out of is per-server counters — 50 servers each allowing 100 rps is a limit of 5,000, which is why the counter has to be shared even though that puts Redis in the path of every request.","hint":"Which direction fails silently, and which fails loudly at your best customer?"},{"id":"cp3-2-5","type":"multiple_choice","prompt":"You put a queue between checkout and the payment service so checkout stays fast. Payments now happen asynchronously. What have you just made your problem?","choices":["Nothing — the queue guarantees delivery","Duplicates: at-least-once delivery means a retried message can charge the card twice, so the consumer has to be idempotent","The queue will lose messages","Payments become synchronous again"],"answer":1,"why":"Queues almost universally give you at-least-once, not exactly-once, and the reason is unavoidable rather than lazy: the consumer has to do the work and then acknowledge it, and if it dies in that gap the broker cannot tell 'never did it' from 'did it and crashed before saying so'. So it redelivers, and the card gets charged twice. Exactly-once as a *delivery* guarantee is essentially a marketing claim; what you can actually have is at-least-once delivery plus an idempotent consumer, which adds up to exactly-once *effects*. That means the payment carries a key the provider deduplicates on — and critically, that key must go to the provider, because a 'have I seen this?' table on your side is just the same race one layer up.","hint":"The broker can't tell 'never did it' from 'did it and crashed before saying so'."},{"id":"cp3-2-6","type":"multiple_choice","prompt":"Load balancing, caching, CDNs, sharding, queues. What do all five actually have in common?","choices":["They all make the system faster","Each buys capacity by selling a guarantee: a single place to look, a fresh answer, a simple query, or an immediate result","They're all optional","They all require more servers"],"answer":1,"why":"Every technique in this tier is the same move: give up something that was true of one small machine to get something you can't have on one small machine. Load balancing costs you 'any server can answer you' — hence statelessness. Caching and CDNs cost you 'the answer is current'. Sharding costs you 'any query is easy' — cross-shard joins and transactions get hard or impossible. Queues cost you 'it's done when I return' — and hand you duplicates and ordering to think about. Notice none of that is a downside to be managed; it's the *price*, and it's the whole reason these are engineering decisions rather than best practices. Anyone can list the five. The job is knowing what each one costs and whether your product can pay it — which is why the next tier is about the guarantees themselves.","hint":"Ask what each one takes away, not what it adds."}]}]};

const UNIT31 = {"unitId":"checkpoint-hard-truths","title":"Checkpoint: Hard Truths","subtitle":"Mixing units 18–22 — the guarantees you can't buy, and the ones you were sold","lessons":[{"id":"cp4-1","title":"Mixed recall","exercises":[{"id":"cp4-1-1","type":"multiple_choice","prompt":"The network between your two datacenters goes down. CAP says you must now choose. Choose what, exactly?","choices":["Between consistency, availability and partition tolerance — pick any two","Between refusing writes (staying consistent) and accepting them on both sides (staying available) — the partition isn't a choice, it's the weather","Between SQL and NoSQL","Between latency and throughput"],"answer":1,"why":"'Pick two' is the sentence everyone remembers and it's the wrong reading. You never *choose* partition tolerance — networks fail whether or not you consented, so P is a fact about the world. The theorem only bites during a partition, and then it offers exactly two options: refuse the write and stay correct, or take it on both sides and reconcile a mess later. The subtler point that survives past the interview: the rest of the time — which is nearly all the time — there's no partition and the real trade is latency against consistency, because a strongly consistent write still has to talk to a quorum before it can answer. That's PACELC, and it's the one that describes your p99 on a normal Tuesday.","hint":"Which of the three letters did you actually get a vote on?"},{"id":"cp4-1-2","type":"match_pairs","prompt":"Match each consistency model to what it actually promises.","pairs":[{"left":"Strong / linearizable","right":"Every read sees the latest committed write, as if there were one copy"},{"left":"Eventual","right":"Stop writing and the copies converge — with no promise about when"},{"left":"Read-your-writes","right":"You always see your own changes; other people's may lag"},{"left":"Monotonic reads","right":"You never see time go backwards"}],"why":"These aren't points on one line from bad to good — they're different promises to different observers, which is why 'strongly consistent' is a lazy requirement. Eventual is the weakest and the most honest about it: convergence, no deadline. Read-your-writes and monotonic reads are the two that users actually notice the absence of, because both failures look like the app is broken rather than slow — your edit vanishes, or a comment appears and then un-appears on refresh. Most products need those two and don't need linearizability anywhere except a couple of specific operations, which is a much cheaper system than 'make it strong'.","hint":"Two of these are about what *you* see; one is about everyone; one has no deadline."},{"id":"cp4-1-3","type":"multiple_choice","prompt":"A quorum system has N=5 replicas, W=3, R=3. W+R > N, so the read and write sets always overlap. Does that give you strong consistency?","choices":["Yes — overlap means a read always sees the latest write","No — overlap guarantees a read *touches* a replica that saw the write, but not that it can tell which value is newest, or that a half-finished write is resolved","Yes, as long as N is odd","Only if W = N"],"answer":1,"why":"Overlap is necessary and nowhere near sufficient, and this is the single most common over-claim about quorums. Your read set does contain a node that saw the write — but a write that reached only 2 of the 3 replicas it needed before the client crashed is now in limbo, visible to some readers and not others, and no one is obliged to finish it. Concurrent writes leave you holding two values and needing a rule to pick — last-write-wins, and now you're trusting clock skew. Even reading the newest value tells you nothing about whether a *later* read might see an older one. Real strong consistency needs a protocol that orders operations and repairs partial writes: read repair, anti-entropy, and in practice a consensus algorithm. W+R>N buys overlap. It does not buy linearizability.","hint":"What does the read set do with two different values it found?"},{"id":"cp4-1-4","type":"multiple_choice","prompt":"Raft elects a leader by majority vote. Why isn't 'won a majority' enough on its own to make someone leader?","choices":["It is enough — a majority is a majority","A majority could elect a candidate that's missing committed writes, so Raft additionally refuses to vote for anyone whose log is behind the voter's","Because elections can tie","Because the old leader might come back"],"answer":1,"why":"Counting votes gets you agreement on *who*, not on *what they know* — and a leader missing committed entries would silently erase acknowledged writes, which is the one thing consensus exists to prevent. So Raft adds the election restriction: a voter refuses any candidate whose log is less up-to-date than its own. Because a committed entry is by definition on a majority, and any winner needs a majority, the two majorities must overlap in at least one node — and that node won't vote for anyone missing the entry. That's the actual mechanism, and it's worth knowing precisely because 'majority vote' sounds complete and isn't. Quorum overlap keeps turning out to be the load-bearing idea in this tier while never being the whole answer.","hint":"Two majorities of the same set always share at least one member."},{"id":"cp4-1-5","type":"multi_select","prompt":"Which of these are genuinely idempotent — safe to retry with the same input? Select all.","choices":["`PUT /users/42` with a full user object","`POST /payments` with a client-supplied `Idempotency-Key` the provider deduplicates on","`POST /comments` with a body","`UPDATE accounts SET balance = balance - 10 WHERE id = 42`"],"answer":[0,1],"why":"`PUT` sets a resource to a state, so doing it five times leaves the same state — idempotent by construction. The keyed `POST` is idempotent by *agreement*: the key travels to whoever performs the side effect, and they promise to do it once. The last one is the instructive trap, because it looks safe — it's a single atomic statement with no read-modify-write race, so it survives concurrency fine. It just isn't idempotent: run it twice and you've withdrawn 20. Atomic and idempotent are different properties and the same statement can have one without the other. Note also where the key has to live: dedupe in *your* database and you've rebuilt the dual-write problem, because your table and the provider's charge can't be updated atomically.","hint":"One of these is perfectly atomic and still charges you twice."},{"id":"cp4-1-6","type":"multiple_choice","prompt":"Your dashboards are all green. Users are reporting the site is broken. What did your observability actually miss?","choices":["Nothing — the users are wrong","You're measuring what you predicted would break; this is a failure you didn't predict, so no dashboard was watching for it","The dashboards need a faster refresh","You need more dashboards"],"answer":1,"why":"A dashboard answers a question someone thought of in advance. That's monitoring, and it's good at the failures you've already had. Observability is the ability to ask a question you *didn't* anticipate — which needs high-cardinality data you can slice after the fact by user, region, version, endpoint. This is why the green dashboard is a genre of outage: your averages are fine because the failure is concentrated in one cohort — one region, one app version, one shard, customers whose IDs hash to a hot partition — and every aggregate you're watching dilutes it into invisibility. 'More dashboards' is the wrong reflex for the same reason: you'd be adding more pre-formed questions.","hint":"Who chose which questions your dashboard can answer, and when?"}]},{"id":"cp4-2","title":"Connecting the units","exercises":[{"id":"cp4-2-1","type":"order_steps","prompt":"Order a payment flow that survives the client retrying at the worst possible moment.","steps":["Client generates an idempotency key and sends it with the charge request","Server atomically reserves the key — insert-if-absent, so a concurrent duplicate loses the race","Server calls the payment provider, passing the same key onward","Server records the result against the key","Any retry with that key returns the stored result instead of charging again"],"why":"The order is the whole lesson, and getting it wrong is a double charge. The reservation has to come *first* and it has to be atomic — an insert-if-absent, a conditional write — because 'look up the key, and if it's missing do the work' is check-then-act, exactly the race this exists to kill. Two retries arriving together would both look, both find nothing, and both charge. Note step 3 as well: the key travels to the provider. If you only dedupe locally you have two systems that must agree and no transaction spanning them — crash between charging and recording, and your table says it never happened while the customer's statement disagrees. The key is the thread stitching the two together, which is why it's generated by the client and survives every hop.","hint":"One of these steps has to be atomic, and it has to be first."},{"id":"cp4-2-2","type":"multiple_choice","prompt":"Your service calls a flaky dependency. You add retries. The dependency now goes down completely for ten minutes instead of degrading. What did the retries do?","choices":["Nothing — retries are always safe","They multiplied load exactly when the dependency was weakest, turning a slowdown into a retry storm that finished it off","They fixed the problem","They caused a memory leak"],"answer":1,"why":"A dependency slows down, every caller's timeout fires, and every caller sends the request again — so a service already failing to serve X now receives 2X or 3X. That's a retry storm, and it's a genuine feedback loop: the fix amplifies the fault. Worse, retries stack multiplicatively through a call chain, so three layers each retrying three times is 27 requests at the bottom from one at the top. What makes it safe is the boring part nobody implements first: exponential backoff so you don't all come back at once, *jitter* so you don't all come back at the same instant a second later, a retry budget capping retries as a fraction of traffic, and a circuit breaker that stops calling entirely once you've established it's down. Retries without those aren't resilience, they're a load test you scheduled for your worst moment.","hint":"What does the dependency see, from every caller at once?"},{"id":"cp4-2-3","type":"multiple_choice","prompt":"A leader is partitioned from its followers but doesn't know it. The followers elect a new leader. The old one is still accepting writes. What is this, and what stops it?","choices":["Nothing stops it — this is unavoidable","Split brain: the old leader's writes need a quorum it no longer has, and leases/terms mean its acknowledgements aren't valid","The old leader shuts down automatically","The clients notice and switch"],"answer":1,"why":"Split brain is what consensus is *for*, and the defence is the same overlap argument as everywhere else in this tier. The old leader can accept requests all it likes; it cannot commit them, because committing needs acknowledgement from a majority and it's on the minority side of the partition. It also can't have been superseded in secret — the new leader carries a higher term, and any node that has seen that term rejects the old one's messages. The dangerous version is the one people build by hand: a leader that decides for itself that it's still the leader, based on its own clock, while a lease it can't see has expired. That's why real systems tie leadership to a lease shorter than the failure detector, and why 'just have the leader check if it's still leader' is a question the leader is structurally unable to answer alone.","hint":"Can the old leader actually *commit* anything?"},{"id":"cp4-2-4","type":"tradeoff_slider","prompt":"You're choosing consistency for a social feed's like counter — millions of writes, shown everywhere.","leftLabel":"Eventual — fast, may be briefly wrong","rightLabel":"Strong — always exact, coordinated","answerRange":[10,35],"why":"Lean hard eventual, and be able to say why in one sentence: nobody can tell. A like count of 14,203 shown as 14,201 for two seconds is invisible to every human who will ever see it, and the price of exactness is a coordinated write on the hottest key in your system — every like on a viral post serialised through one consensus round. That's not a small cost, it's the difference between a counter that scales and an outage. The discipline this tier is really teaching is that consistency is chosen *per operation*, not per system: the same product wants eventual for like counts, read-your-writes for your own comment appearing after you post it, and genuine linearizability for the balance on a payout. Asking 'is this system strongly consistent' is already the wrong question.","hint":"Who is harmed by a like count being two seconds stale?"},{"id":"cp4-2-5","type":"multi_select","prompt":"Which of these actually help you debug a failure you did not predict? Select all.","choices":["High-cardinality structured events you can slice by user, version, region after the fact","Distributed tracing that follows one request across every service it touched","A dashboard of average latency per service","Alerting on symptoms users feel (error rate, latency) rather than on causes (CPU)"],"answer":[0,1,3],"why":"The first two let you ask new questions of old data, which is the entire definition of observability — slice by dimension to find the cohort, then trace one of their requests to find the hop. The fourth is what keeps you from drowning: alert on CPU and you'll page someone for a busy machine that's serving fine, and miss the outage where CPU is low precisely *because* nothing is being served. Averages are the odd one out and the reason is now familiar: an average per service is a pre-chosen question with every useful dimension already thrown away, and it's actively misleading during exactly the partial failure you're trying to catch — one dead region among five barely moves the mean.","hint":"Three of these preserve information. One of them destroys it on purpose."},{"id":"cp4-2-6","type":"multiple_choice","prompt":"What's the honest summary of this tier?","choices":["Distributed systems are too hard; keep everything on one machine","Every distributed guarantee is bought with coordination, and coordination costs latency and availability — so the job is buying the fewest guarantees you can live with","Use a database that says it's strongly consistent and stop worrying","Eventual consistency is always fine"],"answer":1,"why":"Everything in this tier reduces to one exchange rate. Strong consistency means a quorum round trip before you can answer. Consensus means a majority must agree before anything is true. Exactly-once effects mean a shared key and someone doing a durable write to dedupe on. None of that is free, and none of it is optional if you actually need the guarantee — the skill is being precise about where you need it, because it's almost never everywhere. The trap worth naming is 'just pick a database that says it's strongly consistent': one advertising that hasn't repealed anything, it has *chosen* for you, and it's paying the same coordination cost in your p99 whether or not that operation needed it. The engineering isn't picking a system that promises the most. It's knowing what each promise costs and buying only the ones your product would actually notice losing.","hint":"What does every guarantee in this tier have to pay for?"}]}]};

const UNIT32 = {"unitId":"checkpoint-design-challenges","title":"Checkpoint: Design Challenges","subtitle":"Mixing units 23–27 — the five designs were one design, asked five ways","lessons":[{"id":"cp5-1","title":"Mixed recall","exercises":[{"id":"cp5-1-1","type":"multiple_choice","prompt":"A URL shortener. Someone proposes generating the short code by hashing the long URL. What breaks?","choices":["Nothing — hashing is the standard answer","Two different URLs can collide on one code, and worse, you can no longer give two people different codes for the same URL","Hashing is too slow","The codes would be too long"],"answer":1,"why":"Collisions are the answer people give and the smaller half of the problem — you can detect one and re-hash with a salt. The real damage is the property hashing forces on you for free: the same URL always produces the same code. That sounds like a feature until product asks for per-campaign analytics, and two customers shortening `example.com` need two codes with separate click counts, and you've architecturally forbidden it. A counter with a base-62 encoding gives you a fresh code per request and no collision to detect — though unit 23 then disqualifies the counter for a different reason entirely: sequential codes can be walked, so 'unlisted' links stop being unlisted, and you end up at random keys plus a unique constraint. The design question was never 'how do I avoid collisions', it was 'is a code a function of the URL, or a thing I hand out'.","hint":"What if two customers shorten the same URL and both want their own stats?"},{"id":"cp5-1-2","type":"multiple_choice","prompt":"A news feed. Fan-out-on-write pre-computes each follower's feed when you post. Where does that fall apart?","choices":["It never does — it's the standard design","A celebrity with 50 million followers turns one post into 50 million writes, so the very users you most want to keep are the ones that hurt most","Reads become slow","It uses too much CPU on read"],"answer":1,"why":"Fan-out-on-write makes reads trivial — your feed is already sitting there — by making writes proportional to your follower count. For almost everyone that's a fine trade, because almost everyone has a few hundred followers. Then one account has 50 million and a single post becomes 50 million writes, arriving as a spike, and your write path is now hostage to your most valuable user. The real answer in production is neither pure strategy but a hybrid: fan out on write for normal accounts, and for the handful of celebrities, don't — merge their posts in at read time, since anyone following a celebrity is following few enough of them that the merge is cheap. That shape is worth remembering beyond feeds: when a distribution has a long tail, the design that works for the body is often exactly wrong for the tail, and you handle them separately rather than compromise.","hint":"What does one post cost, and who has the most followers?"},{"id":"cp5-1-3","type":"multiple_choice","prompt":"A chat app. User A is connected to chat server 3. User B sends A a message and lands on chat server 7. How does server 7 find A?","choices":["It broadcasts to every chat server","A shared connection registry maps user → the server currently holding their socket, so 7 can hand the message to 3","It writes to the database and A polls","It can't — A must reconnect"],"answer":1,"why":"This is the problem persistent connections create and stateless HTTP never had. A WebSocket is *pinned* to one machine — that socket exists on server 3 and nowhere else — so 'which server can reach this user' becomes a question someone has to answer. A shared registry (Redis, typically) is the standard answer, and the interesting part is that it's now a small piece of hard state at the centre of your fan-out: it has to be fast, because it's consulted per message, and it has to be roughly right, because a stale entry means the message goes to a server that no longer holds that socket. Broadcasting works at ten servers and is a quadratic disaster at a thousand.","hint":"That socket physically exists on exactly one machine."},{"id":"cp5-1-4","type":"multiple_choice","prompt":"A distributed rate limiter across 50 API servers, limit 1,000 req/s per customer. Each server keeps its own counter. What's the real limit?","choices":["1,000 req/s","50,000 req/s — every server independently allows 1,000, so the limit you advertise isn't the limit you enforce","20 req/s","It depends on the load balancer"],"answer":1,"why":"Fifty servers each enforcing 1,000 is a limit of 50,000, and you'd never know from reading the config — it says 1,000. This is why rate limiting has an uncomfortable shape: the counter must be shared, which puts a network hop on the hot path of every single request, in front of the thing whose job is protecting you from load. That's the tension the whole unit lives in. The pragmatic answers all trade accuracy for that hop: each server takes a *lease* on a slice of the budget from Redis and spends it locally, or you accept approximate enforcement and reconcile periodically. Nobody who has looked closely runs an exact distributed counter per request — they decide how wrong they can afford to be.","hint":"Multiply."},{"id":"cp5-1-5","type":"multi_select","prompt":"Ride-sharing: matching a rider to nearby drivers. Which of these are real reasons a plain `SELECT ... WHERE lat BETWEEN ? AND ? AND lng BETWEEN ? AND ?` on your main database is the wrong tool? Select all.","choices":["Driver locations update every few seconds, so it's a write-heavy workload aimed at your source of truth","A B-tree on `(lat, lng)` can't answer 'near' efficiently — it orders by `lat` first, so a bounding box still scans a whole latitude band","Locations are worthless within a minute, so durability is largely wasted on them","Geographic queries are mathematically impossible in SQL"],"answer":[0,1,2],"why":"Three good reasons and one nonsense. The write rate is the first: a hundred thousand drivers each pinging every four seconds is 25,000 writes/s of data whose value expires in seconds, pointed at the database holding your trips and payments. The index reason is the one worth actually understanding — a composite B-tree sorts by `lat` and only then by `lng`, so a bounding box is a range scan over an entire latitude band with `lng` filtered afterwards, which is why real systems reach for geohashes, S2 cells or H3: they turn two dimensions into one ordered key, so 'near' becomes a prefix match. And durability is genuinely wasted here — a location you'd never replay after a crash doesn't need a write-ahead log. Postgres has PostGIS and it's excellent; the 'mathematically impossible' option is the distractor, and 'the database can't do it' is almost always a claim about the index, not the language.","hint":"One of these is false, and the other three are each independently sufficient."},{"id":"cp5-1-6","type":"fill_blank","prompt":"Every one of these five designs began the same way: before choosing a single component, you estimate the ______ — how many requests, how much data, what read/write ratio.","choices":["back-of-the-envelope numbers","database schema","programming language","team size"],"answer":0,"why":"The numbers come first because they are what turns a design conversation from taste into engineering. A shortener at 100 reads per write is a caching problem; at 1:1 it's a write problem. A feed for a thousand users is a `SELECT`; for a hundred million it's the fan-out question. A rate limiter for one server is a variable in memory. Same words, different systems — and the only thing that told them apart was an estimate someone did in thirty seconds. This is also the single most reliable tell in an interview, and more importantly on a real team: someone who reaches for a component before they have a number is choosing by fashion, and someone who says '20,000 writes a second, so one Postgres won't do it' has actually made an argument you can check.","hint":"It's the thing that tells you whether this is a hard problem at all."}]},{"id":"cp5-2","title":"Connecting the units","exercises":[{"id":"cp5-2-1","type":"estimate","prompt":"A URL shortener does 100 million redirects/day. Assume the busiest hour carries ~4× the average hour. Roughly how many redirects/second at that peak?","answer":4600,"tolerance":1500,"unit":"req/s","why":"100M ÷ 86,400 ≈ 1,160/s average, and ×4 for the peak hour ≈ 4,600/s. That number is the whole design conversation, which is why it comes first. Under 5,000 reads/s of tiny immutable rows is *nothing* — a single cached Postgres serves it without noticing, and the entire elaborate architecture people sketch for this problem is unnecessary. Notice what the peak multiplier did, though: it's the difference between provisioning for 1,160 and for 4,600, and traffic never arrives politely spread across the day. Getting this estimate wrong in either direction is expensive — build for the average and you fall over daily at lunchtime; build for 100× the peak and you've spent a year's budget on idle machines.","hint":"Seconds in a day is ~86,400. Then multiply by the peak factor."},{"id":"cp5-2-2","type":"build_diagram","prompt":"The shortener at that scale: reads must be cheap and the codes must come from somewhere that never repeats.","viz":{"nodes":[{"id":"c","label":"Clients","col":0,"kind":"client"},{"id":"svc","label":"Redirect Service","col":1,"kind":"server"},{"id":"h1","col":2,"hole":true},{"id":"h2","col":3,"hole":true}],"edges":[{"from":"c","to":"svc"},{"from":"svc","to":"h1"},{"from":"h1","to":"h2"}]},"palette":["Cache","Database","Message Queue","CDN"],"answer":{"h1":"Cache","h2":"Database"},"why":"The same read path as every other system in this course, which is the point of putting it here: a shortener is not a special problem, it's the standard shape with an unusually favourable read profile. Short codes are immutable — once `abc123` means a URL, it means that forever — so this is the easiest caching problem you will ever be handed. The mapping never goes stale, so there's no invalidation dance — the only reason you still want a `TTL` is that unit 23's links are allowed to *expire*, and a cache told to keep them forever will happily redirect one you deleted. A hit rate in the high nineties still falls out for free because link traffic is brutally skewed toward a few hot links. The database exists for the misses and for the one thing a cache can't do, which is guarantee that a code was never handed out twice.","hint":"Immutable data is the easiest thing in the world to cache."},{"id":"cp5-2-3","type":"multiple_choice","prompt":"Across all five designs, one component keeps appearing for one reason. Which pairing is right?","choices":["A message queue, because everything needs async","Redis — as the shortener's cache, the chat app's connection registry, the limiter's shared counter and the driver location store — because each design has a small amount of hot, shared, mostly-disposable state that the source of truth is the wrong place for","A load balancer, because everything needs traffic spread","A CDN, because everything serves static files"],"answer":1,"why":"Look at what Redis is actually doing in each of these and it's the same job wearing four hats: hot, shared, small, and cheap to lose. A cached redirect can be rebuilt from the database. A connection registry entry is worthless the moment the socket closes. A rate limit counter resets every window by design. A driver's location expires in seconds. In every case the data must be reachable by *every* server (so it can't live in one process's memory) and doesn't need to survive a crash (so it shouldn't be paying for a write-ahead log). That combination is the actual definition of the tool, and it's more useful than 'Redis is a cache' — because the chat registry and the rate counter aren't caches at all, and Redis is still right.","hint":"Ask what those four pieces of state have in common, not what they're called."},{"id":"cp5-2-4","type":"spot_bottleneck","prompt":"Ride-sharing at peak: 100k drivers pinging location every 4s. Where does this design break first?","viz":{"nodes":[{"id":"n0","label":"Drivers","sub":"25k pings/s","col":0,"kind":"client"},{"id":"n1","label":"Location Svc","sub":"80k rps","col":1,"kind":"server"},{"id":"n2","label":"Postgres","sub":"8k writes/s","col":2,"kind":"db"},{"id":"n3","label":"Matching Svc","sub":"50k rps","col":3,"kind":"server"}],"edges":[{"from":"n0","to":"n1"},{"from":"n1","to":"n2"},{"from":"n2","to":"n3"}]},"answer":2,"why":"100,000 ÷ 4 = 25,000 writes/s arriving at a Postgres that tops out around 8,000 — over by 3×, and it's the only component that isn't comfortable. What makes this the most instructive shape in the tier is that the fix isn't 'scale the database'. It's noticing that this data should never have been there: a driver's coordinates are worthless sixty seconds later, so every one of those 25,000 writes/s is paying for a write-ahead log, a durable fsync and replication to protect data you would never restore. Move it to an in-memory geo store with a `TTL` and the load doesn't get distributed, it gets *deleted* — the write volume was real, but the durability requirement was imaginary. The best scaling fix is regularly the realisation that you were storing something in the wrong kind of place.","hint":"Which of these numbers is the workload, and which is a limit you chose?"},{"id":"cp5-2-5","type":"multi_select","prompt":"You're 20 minutes into a design interview for 'design Twitter'. Which of these are actually good moves? Select all.","choices":["State your assumptions out loud — 300M users, 2 posts/day, 100:1 read/write — and design against those numbers","Name the one hard problem (celebrity fan-out) and go deep on it rather than sketching every box evenly","Say what your design gives up, and when it would stop working","List every AWS service that could be involved"],"answer":[0,1,2],"why":"The first three are the job and the fourth is the impression of the job. Numbers first, because 'design Twitter' is unanswerable until you decide whether it's a thousand users or three hundred million — and stating them out loud lets the interviewer correct you early instead of watching you build the wrong thing. Then go deep on the one thing that's genuinely hard, because every interesting system has a small number of decisions doing all the work, and even coverage of ten boxes signals you can't tell which. And naming what you gave up is the strongest move available: 'this is eventually consistent, so a user's own post could briefly not appear in their feed, and here's what I'd do about that' says you understand the trade rather than having stumbled into it. Naming services is the classic tell — it's vocabulary standing in for a decision, and this whole course has been one argument that those are different things.","hint":"Three of these are decisions. One is a word list."},{"id":"cp5-2-6","type":"multiple_choice","prompt":"Last question of the course. What is system design, actually?","choices":["Knowing which components to use","Choosing which guarantees to give up, in a specific order, for specific reasons you can defend with a number","Drawing boxes and arrows","Using microservices"],"answer":1,"why":"Every unit in this course has been the same lesson in different clothes. Caching gives up freshness. Replication gives up read-your-writes. Sharding gives up easy queries. Queues give up 'it's done when I return'. Eventual consistency gives up knowing. None of those are compromises you fell into — they're purchases, and the price is always a guarantee you used to have on one small machine. Which is why 'knowing the components' isn't the skill: everyone knows the components, they're on the first page of every blog post. The skill is that when someone says 'we should add a cache', you can ask what staleness the product can tolerate, and know that if the answer is none, the cache is not the tool. You are now a person who can ask that question — and asking it is the entire job.","hint":"What did every single technique in this course cost you?"}]}]};

/* Review mode: unlimited hearts, so a wrong answer never ends a lesson early.
   For reviewing 676 exercises you need to be able to answer badly on purpose.

   State lives in the URL fragment (#review), NOT localStorage: this page is
   opened over file://, where Safari throws SecurityError on localStorage and
   would take the whole script down with it. The fragment costs nothing, needs
   no API, survives a manual reload, and is visible + shareable. */
let unlimited = /(^|[#&])review\b/.test(location.hash);

/* Preferences persist in localStorage, but EVERY access is wrapped. A bare
   localStorage read at top level once killed this entire script: on file://
   Safari throws SecurityError, an uncaught throw takes the whole <script> down,
   and the page rendered blank. Guarded, with a memory fallback, it's safe —
   the preference just doesn't survive a reload in that one environment. */
const _mem = {};
function store(k, v){ try{ localStorage.setItem('sk_'+k, v); }catch(e){ _mem[k] = v; } }
function recall(k){ try{ const v = localStorage.getItem('sk_'+k); return v==null ? _mem[k] : v; }catch(e){ return _mem[k]; } }

/* Teaching is ON by default and stays available forever — a building has a ramp
   even though most people take the stairs, and low usage is not a reason to
   fail the people who need it. The learner who already knows this turns it off
   once, in one tap, from the card itself. Both paths, nobody asked to choose. */
let teach = recall('teach') !== '0';
function paintTeach(){
  const b = $('teachbtn'); if(!b) return;
  b.classList.toggle('off', !teach);
  b.title = teach ? 'Concept cards ON — tap to skip them from now on'
                  : 'Concept cards OFF — tap to bring them back';
}
function setTeach(v){ teach = v; store('teach', v ? '1' : '0'); paintTeach(); }
/* Advance past teaching cards when the learner has opted out. Skipping is done
   by stepping the index, not by filtering the array, so the content stays one
   list and the preference can flip mid-lesson without renumbering anything. */
function skipTeaching(){
  while(!teach && lesson.exercises[idx] && lesson.exercises[idx].type==='concept') idx++;
}
/* Counters ignore concept cards: "question 3 of 7" should count questions. */
function gradedLen(){ return lesson.exercises.filter(e=>e.type!=='concept').length; }
function gradedIdx(){ let n=0; for(let i=0;i<idx;i++) if(lesson.exercises[i].type!=='concept') n++; return n; }
function heartsLabel(){ return unlimited ? '∞' : hearts; }
function paintHearts(){

  $('heartbox').title = unlimited
    ? 'Unlimited hearts ON (review mode) — click to go back to 5'
    : 'Click for unlimited hearts — review mode';
}
function toggleUnlimited(){
  unlimited = !unlimited;
  try{ location.hash = unlimited ? 'review' : ''; }catch(e){/* fragment is a nicety, not a dependency */}
  if(unlimited && hearts===0) hearts=5;   // rescue a lesson already lost
  paintHearts();

  if(unlimited && checked) { const a=$('action'); if(a) a.textContent = idx+1<lesson.exercises.length?'Continue':'Finish'; }
}
const $=id=>document.getElementById(id);

/* Inline markdown for content strings: `code` and *emphasis*.
   Escapes first, so content is never parsed as HTML (unit 3's &limit=20, unit 8's `> value`).
   Emphasis requires a non-space adjacent to each asterisk, which leaves SQL's SELECT * alone.
   Only applies on innerHTML paths; textContent renderers (match_pairs, build_diagram) show raw. */
function md(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*(\S(?:[^*\n]*\S)?)\*/g,'<em>$1</em>');
}

function shuffle(a){ // deterministic-ish shuffle without Math.random dependency issues
  const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=(i*7+3)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];} return arr;
}

/* The bar counts every card the learner will actually see, so it doesn't jump
   when concept cards are switched off. */
function progress(){
  const seen=lesson.exercises.filter(e=>teach||e.type!=='concept').length;
  let done=0; for(let i=0;i<idx;i++) if(teach||lesson.exercises[i].type!=='concept') done++;
  $('bar').style.width=(done/Math.max(1,seen)*100)+'%';
}

function render(){

  /* A concept card is headed by a claim, not a question, and is not graded:

  const isCard = ex.type==='concept';
  const head   = isCard ? ex.title : ex.prompt;
  /* A checkpoint has no teaching card by design — it mixes units already taught.
     Say that in the kicker, or the learner meets a test with no lesson in front
     of it and concludes the teaching is missing rather than deliberately spent. */
  const cp     = isCheckpoint() ? '<span class="cp">Checkpoint</span>' : '';
  const kick   = isCard ? 'Concept' : `${cp}${lesson.title} · ${gradedIdx()+1}/${gradedLen()}`;
  s.innerHTML=`<div class="kicker">${kick}</div><p class="prompt">${md(head)}</p><div id="body"></div>`;
  ({multiple_choice:mc,fill_blank:mc,multi_select:ms,match_pairs:match,order_steps:order,

function enable(){ $('action').disabled=false; }

/* single-select (mc + fill_blank) */
function mc(){
  const opts=ex.type==='fill_blank'?ex.choices:ex.choices; current=null;
  const w=$('body'); const c=document.createElement('div'); c.className='choices';
