const UNIT25 = {"unitId":"design-chat-app","title":"Design a Chat App","subtitle":"The server has to talk first — and that changes everything","lessons":[{"id":"chat-1","title":"The server speaks first","exercises":[{"id":"chat-1-0","type":"concept","title":"Chat inverts HTTP: the event you need to hear about happens somewhere else","viz":{"nodes":[{"id":"b","label":"Bob sends a message","col":0,"kind":"client"},{"id":"s","label":"Chat server","col":1,"kind":"server"},{"id":"a","label":"Alice","sub":"asked nothing","col":2,"kind":"client"}],"edges":[{"from":"b","to":"s"},{"from":"s","to":"a"}]},"body":"Every system so far had the client ask first. Chat doesn't fit that shape. The event you need to know about — someone messaged *you* — doesn't happen where you are; it happens elsewhere, at a moment you didn't choose, and it arrives unprompted. Hold that against the request/response model you've used for twenty-four units and see what breaks.","note":"Short polling, long polling, Server-Sent Events, WebSocket — four points on one line, not four unrelated technologies. Work out what that line measures and they stop being a list to memorize."},{"id":"chat-1-1","type":"multiple_choice","prompt":"Everything so far has been request/response: the client asks, the server answers. Why doesn't that work for chat?","choices":["It's too slow","Because the interesting event happens on the SERVER — someone messaged you — and in request/response the server has no way to speak until you ask","Messages are too large","It needs a database"],"answer":1,"why":"HTTP's shape is that the client initiates, and chat inverts that: the thing you need to know about originates elsewhere and arrives unprompted. This is the first system in the course where the fundamental model from unit 2 doesn't fit — everything difficult about chat descends from the server needing to initiate."},{"id":"chat-1-2","type":"multiple_choice","prompt":"Simplest workaround: the client polls `GET /messages` every 2 seconds. What's wrong with it?","choices":["It's too complicated","It's both too slow and too expensive: messages are up to 2 seconds late, and you pay a request per client per interval whether anything happened or not","It doesn't work at all","Messages arrive out of order"],"answer":1,"why":"Polling makes you choose between latency and cost with no good answer — poll faster and the request volume explodes, poll slower and chat feels broken. At a million idle users, 2-second polling is 500,000 requests/sec almost all of which return 'nothing', so you're spending your entire capacity asking a question whose answer is usually no."},{"id":"chat-1-3","type":"match_pairs","prompt":"Match each approach to how it works.","pairs":[{"left":"Short polling","right":"Ask repeatedly; mostly get nothing"},{"left":"Long polling","right":"Ask, and the server holds the request open until there's news"},{"left":"Server-Sent Events","right":"One long-lived stream, server to client only"},{"left":"WebSocket","right":"One connection, both directions, stays open"}],"why":"They're four points on one line: how long does a connection live, and who may speak. Long polling was the clever hack that made real-time work over plain HTTP, SSE formalized the one-way stream, and WebSocket gives you a genuine two-way pipe — which is what chat actually wants, since both sides have things to say."},{"id":"chat-1-4","type":"multiple_choice","prompt":"Why is WebSocket the natural fit for chat specifically?","choices":["It's the newest","The connection stays open and either side can send at any moment — so a message pushes instantly with no request, and no per-message handshake cost","It's more secure","It compresses better"],"answer":1,"why":"Chat is bidirectional and bursty, which is exactly what a persistent duplex connection is for: you pay the handshake once and then messages cost almost nothing in either direction. Compare unit 2's connection reuse reasoning — the same logic, taken to its limit, since the connection now outlives every individual message."},{"id":"chat-1-5","type":"multiple_choice","prompt":"You hold a WebSocket open for every online user. What have you just given up?","choices":["Nothing","Statelessness: that user is now bound to one specific server for as long as they're connected, so your app tier stops being interchangeable","Message ordering","Encryption"],"answer":1,"why":"A persistent connection IS state living on one machine, which is precisely the property unit 11 said horizontal scaling depends on not having. Every hard problem in the rest of this unit — routing, deploys, failover — traces back to this moment: you traded statelessness for the ability to push, and it was worth it, and now you pay."},{"id":"chat-1-6","type":"estimate","prompt":"You have 10 million users online, each holding one WebSocket. If a server can hold about 100,000 connections, roughly how many servers do you need just to hold them?","answer":100,"tolerance":20,"unit":"servers","why":"10,000,000 ÷ 100,000 = 100 servers, holding connections before doing any work at all. That reframes the problem usefully: your fleet is sized by concurrent CONNECTIONS rather than by request rate, which is a completely different capacity model from every system so far."}]},{"id":"chat-2","title":"Finding the recipient","exercises":[{"id":"chat-2-0","type":"concept","title":"Delivering a message means finding one specific process on one specific machine","viz":{"nodes":[{"id":"a","label":"Alice","col":0,"kind":"client"},{"id":"s7","label":"Server 7","sub":"holds Alice","col":1,"kind":"server"},{"id":"s31","label":"Server 31","sub":"holds Bob","col":2,"kind":"server"},{"id":"b","label":"Bob","col":3,"kind":"client"}],"edges":[{"from":"a","to":"s7"},{"from":"s7","to":"s31","dash":true},{"from":"s31","to":"b"}]},"body":"A redirect could be served by any server. A feed read too. Bob's connection can't: it's an open socket on exactly one machine out of a hundred, so 'send Bob a message' first means finding out which one is holding him. Every server in your fleet is the wrong one except that server, and no load balancer knows which.","note":"That dashed arrow is the hop nobody has built yet. Whatever fills it gets consulted on every message and is wrong milliseconds after a phone enters a tunnel — so it's derived state you rebuild, not a record to mourn."},{"id":"chat-2-1","type":"multiple_choice","prompt":"Alice is connected to server 7. Bob is connected to server 31. Alice sends Bob a message. What's the problem?","choices":["Nothing — the database handles it","Server 7 holds Alice's connection but has no way to reach Bob's — it must discover that Bob is on server 31 and get the message there","They must be on the same server","The load balancer routes it"],"answer":1,"why":"The message has a specific destination that lives in another process on another machine, which no previous system in this course had to deal with — a redirect or a feed read could be served by any server. Now delivery means routing to one exact connection, so you need to know where it is."},{"id":"chat-2-2","type":"build_diagram","prompt":"Server 7 needs to know which server holds Bob's connection. Add the piece that tracks it.","viz":{"nodes":[{"id":"c","label":"Chat Servers","col":0,"kind":"server"},{"id":"h","sub":"look up Bob","col":1,"hole":true},{"id":"m","label":"Message Store","col":1,"kind":"db"}],"edges":[{"from":"c","to":"h"},{"from":"c","to":"m","dash":true}]},"palette":["Connection registry (Redis)","A CDN","A second load balancer"],"answer":{"h":"Connection registry (Redis)"},"why":"You need a shared map from user id to the server holding their connection, and every server must be able to read it — which is unit 5's answer exactly: state that all servers need goes in a shared store, not in any one server's memory. Redis fits because the lookup is by one key and the data is rebuildable when a connection drops."},{"id":"chat-2-3","type":"order_steps","prompt":"Order the delivery of Alice's message to Bob.","steps":["Alice's client sends the message over her WebSocket to server 7","Server 7 persists the message to the message store","Server 7 looks up Bob in the connection registry — he's on server 31","Server 7 forwards the message to server 31","Server 31 pushes it down Bob's open WebSocket"],"why":"Persist first, then route, then push — and the order matters enormously. Storing before delivering means a crash anywhere after that point loses a delivery attempt but never the message, so Bob can still fetch it later. Push first and you've built a system where a dropped connection destroys data."},{"id":"chat-2-4","type":"multiple_choice","prompt":"Why persist the message BEFORE trying to deliver it?","choices":["It's faster","Because delivery can fail — Bob may be offline or his server may die — and the message must survive that, so the store is the source of truth and delivery is best-effort on top","The database assigns the id","To keep the order correct"],"answer":1,"why":"Delivery over a connection is inherently unreliable and the message is not, so you split them: durable write first, then an attempt to push. This is unit 5's discipline again — the store holds the truth, the push is derived — which is what makes offline delivery a natural consequence rather than a separate feature."},{"id":"chat-2-5","type":"multiple_choice","prompt":"Bob is offline. What happens to the message?","choices":["It's dropped","Nothing special — it's already stored, so it simply sits there and Bob fetches it when he reconnects","It's queued in memory on server 7","Alice gets an error"],"answer":1,"why":"Because you persisted first, offline isn't a failure case needing new machinery — it's just a delivery that hasn't happened yet, and reconnection is a read. That's the payoff for getting the order right: 'Bob is offline' and 'Bob's server crashed mid-push' resolve identically, via the same fetch-on-reconnect path."},{"id":"chat-2-6","type":"multiple_choice","prompt":"Server 31 crashes. Bob's connection dies and he reconnects — landing on server 12. What must happen?","choices":["Bob loses his messages","The registry updates to say Bob is on server 12, and Bob fetches anything he missed since his last acknowledged message","The load balancer sends him back to server 31","His session is restored"],"answer":1,"why":"Connections are disposable even though they're stateful, so recovery is re-register plus catch-up rather than restoring anything. The catch-up needs Bob to tell the server where he got to — 'send me everything after message X' — which makes reconnection a cursor read, the same pattern from unit 3 and the feed."}]},{"id":"chat-3","title":"Delivery and ordering","exercises":[{"id":"chat-3-0","type":"concept","title":"Writing to a socket tells you the bytes left — not that anyone received them","viz":{"nodes":[{"id":"a","label":"Alice sends","col":0,"kind":"client"},{"id":"s","label":"Server stores it","col":1,"kind":"server"},{"id":"b","label":"Bob's client","col":2,"kind":"client"},{"id":"e","label":"Rendered on screen","col":3}],"edges":[{"from":"a","to":"s"},{"from":"s","to":"b"},{"from":"b","to":"e"}]},"body":"The only party who knows Bob has the message is Bob's client. Everything upstream — the socket accepted the write, nothing errored — is your own process reporting on itself, not evidence about Bob. So the ticks in a chat UI aren't decoration. They're the only honest thing it can show: each is somebody, somewhere, confirming something. Work out who, and what.","note":"And notice this only settles *whether* Bob got it, never *when* relative to anything else. Delivery and ordering are two separate problems, and solving one buys you nothing at all on the other."},{"id":"chat-3-1","type":"multiple_choice","prompt":"Server 31 pushes the message down Bob's socket. Is it delivered?","choices":["Yes — the socket accepted it","You don't know: the write succeeded locally, but the message may still be in flight, or his phone may have lost signal before rendering it","Yes, if there's no error","Only if he replies"],"answer":1,"why":"Writing to a socket means the bytes left your process, not that they arrived and were shown — this is unit 21's ambiguity in its purest form. Which is why every chat app has client acknowledgements: only Bob's client can say 'I have it', so the ticks you see in chat UIs are the protocol made visible."},{"id":"chat-3-2","type":"match_pairs","prompt":"Match each chat state to what it actually means.","pairs":[{"left":"Sent","right":"The server accepted and stored it"},{"left":"Delivered","right":"The recipient's client acknowledged receiving it"},{"left":"Read","right":"The recipient's client says it was displayed"},{"left":"Pending","right":"The sender's client hasn't heard back yet"}],"why":"Each tick is an acknowledgement from a different party, which is why they arrive at different times and why 'delivered' can sit there for hours. The UI is honestly reporting the only thing anyone can know: what the last party confirmed."},{"id":"chat-3-3","type":"multiple_choice","prompt":"Bob's client acknowledges, but the ack is lost. What happens?","choices":["The message is lost","The server thinks it wasn't delivered and pushes again — so Bob sees the message twice unless his client deduplicates by message id","Nothing","Alice is notified"],"answer":1,"why":"This is at-least-once delivery from unit 16, and the duplicate is the price of never losing anything — the alternative, acking before rendering, loses messages instead. So the client must be idempotent: track message ids it has already shown and discard repeats, which is unit 21's key applied on the phone."},{"id":"chat-3-4","type":"multiple_choice","prompt":"Alice sends 'A' then 'B'. Bob sees 'B' then 'A'. Why can that happen?","choices":["Bob's client is broken","The two messages took different paths or were processed concurrently, and nothing forced them into order — network delivery has no ordering guarantee across separate operations","The database sorted them wrong","Alice's clock is wrong"],"answer":1,"why":"Concurrency without a defined order is unit 16's lesson: two messages in flight finish whenever they finish. In chat this is far worse than a technicality because reordering changes meaning — a reply landing before its question is nonsense, which is precisely the causal violation unit 19 named."},{"id":"chat-3-5","type":"multiple_choice","prompt":"How do you order a conversation's messages without trusting anyone's clock?","choices":["Use the sender's timestamp","Assign a per-conversation sequence number on the server — one conversation is handled in one place, so it can hand out increasing numbers that clients sort by","Use the server's timestamp","Order by message id"],"answer":1,"why":"Unit 19 showed why timestamps fail: clocks disagree, so 'later' depends on whose watch you believe, and a phone with a skewed clock wins or loses every race. A per-conversation counter sidesteps clocks entirely — and note the scope is per-conversation rather than global, because you only need order where meaning lives, which is exactly unit 16's per-key partitioning."},{"id":"chat-3-6","type":"multiple_choice","prompt":"Why is per-conversation ordering enough — why not order all messages globally?","choices":["Global ordering is impossible","Because nobody can perceive the relative order of two messages in different conversations — global ordering would cost coordination across everything to guarantee something no user could ever notice","Conversations are independent tables","It would be too slow to sort"],"answer":1,"why":"Order only matters where causality does, and two unrelated chats have none — so a global sequence would serialize the entire system to protect a property with no observer. This is the same reasoning that made causal consistency cheaper than strong in unit 19: buy ordering exactly where meaning depends on it, and nowhere else."}]},{"id":"chat-4","title":"Presence and groups","exercises":[{"id":"chat-4-0","type":"concept","title":"A green dot costs you a fan-out every time someone walks into a tunnel","viz":{"nodes":[{"id":"u","label":"One phone","sub":"signal drops","col":0,"kind":"client"},{"id":"s","label":"Chat server","col":1,"kind":"server"},{"id":"c","label":"Everyone watching","sub":"must all be told","col":2,"kind":"client"}],"edges":[{"from":"u","to":"s"},{"from":"s","to":"c"}]},"body":"Presence looks free and isn't. Start with the data itself: it's high-churn and low-value — mobile connections flap constantly, every trip through a tunnel is a state change, and none of it matters much. Now ask who has to hear about each flap. That's the whole problem, and you already met it in unit 24 wearing a more glamorous costume.","note":"And presence is only the cheap version of this. Anything where one event has an audience bills you by the size of that audience — a sentence worth keeping, since it's now come up in three units under three names."},{"id":"chat-4-1","type":"multiple_choice","prompt":"You show a green dot when a user is online. What's the naive implementation, and why does it hurt?","choices":["Check the registry on each render — that's fine","Broadcasting every connect and disconnect to everyone who might care: a user with 1,000 contacts generates 1,000 notifications every time their train enters a tunnel","Poll every user every second","Store presence in the database"],"answer":1,"why":"Presence is deceptively expensive because it's high-churn, low-value data: mobile connections flap constantly, and each flap fans out to everyone watching. It's the celebrity problem again — cost scales with how many people care — for a green dot nobody will remember seeing."},{"id":"chat-4-2","type":"multi_select","prompt":"Which make presence affordable? Select all.","choices":["Only compute presence for contacts the user is actually looking at right now","Debounce — wait a few seconds before declaring someone offline, so brief drops don't fan out","Accept staleness: a green dot that's a few seconds wrong harms nobody","Store every presence change durably for audit"],"answer":[0,1,2],"why":"Compute it lazily for the handful of contacts on screen, debounce the flapping, and let it be a little wrong — presence is the definitive case where staleness costs nothing, so unit 19 says buy the weakest guarantee available. Durably auditing it is the opposite instinct: paying storage and writes for data whose value expires in seconds."},{"id":"chat-4-3","type":"multiple_choice","prompt":"A group chat has 100,000 members. Someone posts. What's the problem?","choices":["The message is too large","It's fan-out again: one message must reach 100,000 connections spread across your whole server fleet, so one send becomes a storm","The group is too large to store","Ordering breaks"],"answer":1,"why":"This is unit 24's celebrity problem wearing a different hat — the cost of one write scales with the audience — and the resolution rhymes: for huge groups, stop pushing to everyone and let clients pull on open, since most members aren't watching. Small groups fan out eagerly because it's cheap and instant matters."},{"id":"chat-4-4","type":"multiple_choice","prompt":"You're deploying. Restarting a server drops 100,000 WebSockets at once. What happens?","choices":["Clients reconnect smoothly","All 100,000 reconnect simultaneously — a thundering herd hitting your registry and catch-up reads at the same instant","The load balancer holds them","Nothing — deploys are seamless"],"answer":1,"why":"Persistent connections make deploys genuinely harder than the stateless case from unit 12: draining doesn't help much because the connections are meant to be long-lived, so a restart is a synchronized mass reconnection. The fixes are jittered reconnect backoff on the client (unit 17's lesson: never let clients agree on a moment) and rolling restarts small enough that the herd stays survivable."},{"id":"chat-4-5","type":"tradeoff_slider","prompt":"You're deciding how a mobile client gets messages while the app is backgrounded. Slide toward your approach.","leftLabel":"Keep the WebSocket alive in the background","rightLabel":"Drop it; use push notifications to wake the app","answerRange":[60,100],"why":"A backgrounded app can't reliably hold a socket anyway — mobile operating systems suspend processes and reclaim connections, and fighting that burns the user's battery for a connection the OS will kill regardless. Push notification services exist precisely because they hold one connection on behalf of every app, which is the same consolidation argument as a shared cache: one expensive resource, amortized."},{"id":"chat-4-6","type":"multiple_choice","prompt":"Summarize the chat design.","choices":["A REST API with fast polling","Persistent connections make servers stateful, so you need a registry to route to the right one, a durable store so delivery can fail safely, per-conversation sequence numbers for ordering, and client acks with dedup","A message queue between all users","A database with real-time triggers"],"answer":1,"why":"Every piece follows from one inversion: the server has to speak first, so connections persist, so servers hold state, so routing and reconnection become the design. And the reason it holds together is the discipline from unit 5 — persist first, treat the push as derived — which turns offline users, crashed servers, and lost acks into the same recoverable case."}]}]};

const UNIT26 = {"unitId":"design-rate-limiter","title":"Design a Rate Limiter","subtitle":"Build the thing that protects everything else — as a service, at scale","lessons":[{"id":"drl-1","title":"Specifying it","exercises":[{"id":"drl-1-0","type":"concept","title":"'Rate limit our API' is four questions, and the one people skip is how exact it must be","viz":{"nodes":[{"id":"c","label":"Every request","col":0,"kind":"client"},{"id":"l","label":"Rate limiter","col":1,"kind":"gw"},{"id":"a","label":"Your API","sub":"allowed","col":2,"kind":"server"},{"id":"r","label":"Rejected","sub":"429","col":2}],"edges":[{"from":"c","to":"l"},{"from":"l","to":"a"},{"from":"l","to":"r","dash":true}]},"body":"Ask for a rate limiter and you'll get a spec with three things. A fourth is almost never on the page: *how exact does this have to be?* 'Exactly 100, never 101' and 'roughly 100' are different systems at different prices — one buys a round trip on every request; the other doesn't. Unit 17 gave you the algorithm. Choosing what it may get wrong is the design.","note":"One honest observation: the limit number is nearly always invented. Somebody picked 1,000 because it's round. Fine, as long as you know it — *precision* of enforcement gets argued about far more than the number enforced."},{"id":"drl-1-1","type":"multiple_choice","prompt":"'Build a rate limiter for our API.' What must you pin down before designing anything?","choices":["Which algorithm to use","What's being limited (the key), the limit and window, what happens on breach, and how exact it has to be","Which database to use","How many servers you have"],"answer":1,"why":"Those four answers determine the whole design, and the fourth is the one people skip: 'exactly 100, never 101' and 'roughly 100' are different systems with different costs. Unit 17 gave you the algorithms; this unit is about the fact that the limiter is now a service that must survive your entire traffic volume."},{"id":"drl-1-2","type":"multiple_choice","prompt":"What makes a rate limiter unusual compared to every system so far?","choices":["It's write-heavy","It sits in front of everything, so it sees 100% of traffic and must be faster and more available than the service it protects — if it's slow, everything is slow","It needs strong consistency","It's stateless"],"answer":1,"why":"Every other component in this course served a slice of traffic; the limiter serves all of it, and it runs before you've decided whether the request is even worth serving. That inverts the usual reasoning — a protective component that fails takes down the thing it protects, so its own availability budget must exceed its dependents'."},{"id":"drl-1-3","type":"estimate","prompt":"Your API handles 500,000 requests/second. How many rate limit checks per second must the limiter perform?","answer":500000,"tolerance":1000,"unit":"checks/sec","why":"Every request is checked, so the limiter's load is exactly your total traffic — 500,000/sec, with no cache to soften it and no way to sample. That number is why the naive 'just use Redis' answer needs examining: it means half a million round trips per second to one store."},{"id":"drl-1-4","type":"multiple_choice","prompt":"Each check is a read and a write to a counter. Why can't you just add read replicas?","choices":["Replicas are too slow","Because the check-and-increment must see the current value: reading a lagging replica means two servers both see 99 and both allow — replication scales reads, and this is a write","Replicas don't support counters","You can"],"answer":1,"why":"A limiter check is fundamentally a read-modify-write, so unit 10's rule bites: replicas can't help because a stale read defeats the entire purpose. This is the same asymmetry as the write bottleneck in unit 15 — the only real options are to shard the counters or to stop being exact."},{"id":"drl-1-5","type":"multiple_choice","prompt":"What should happen when a request is rejected?","choices":["Drop the connection","Return 429 with `Retry-After`, plus headers showing the limit, what's remaining, and when it resets — so clients can self-regulate instead of discovering the limit by hitting it","Return 503","Queue it until capacity frees up"],"answer":1,"why":"The limiter's job isn't only to refuse, it's to teach clients to stop asking — a client that can read its remaining quota never trips the limit at all, which costs you nothing. Queueing is the wrong instinct entirely: holding a rejected request consumes exactly the resources you were trying to protect."},{"id":"drl-1-6","type":"multiple_choice","prompt":"Spec so far: token bucket, 1,000 requests/minute per API key, 429 on breach. What's still missing?","choices":["The programming language","The failure policy: when the counter store is unreachable, do you allow everything or block everything? That decision exists whether or not you make it","The number of servers","The cache size"],"answer":1,"why":"The store will be unreachable sometimes, and your code will do something — so 'we never decided' just means you'll discover your default during an incident. Fail-open lets a flood through exactly when you're already fragile; fail-closed turns a limiter outage into a total API outage. Choosing deliberately is the difference between a tradeoff and a surprise."}]},{"id":"drl-2","title":"The counter store","exercises":[{"id":"drl-2-0","type":"concept","title":"A limit is only a limit if there is one counter behind it","viz":{"nodes":[{"id":"c","label":"One API key","sub":"spread across all 50","col":0,"kind":"client"},{"id":"s1","label":"Server 1","sub":"counts only its own","col":1,"kind":"server"},{"id":"s2","label":"Server 2","sub":"counts only its own","col":1,"kind":"server"},{"id":"s3","label":"Server 50","sub":"counts only its own","col":1,"kind":"server"}],"edges":[{"from":"c","to":"s1"},{"from":"c","to":"s2"},{"from":"c","to":"s3"}]},"body":"Your 50 API servers are interchangeable — that's the property that let them scale in the first place. But a counter in each one's local memory isn't a count. It's 50 separate fragments of one, and each server enforces its own fragment against the whole limit, having never heard of the other 49. Unit 5's question, with a sharp edge on it.","note":"And the failure is silent. Nothing throws, no alert fires, your dashboard shows limits being enforced — the only party who ever learns the real number is the customer you were supposed to be stopping."},{"id":"drl-2-1","type":"multiple_choice","prompt":"Your limiter runs on 50 API servers, each keeping counters in local memory. What's the actual limit a client experiences?","choices":["The configured limit","Up to 50× it, because each server counts only what it saw — you configured 1,000 and shipped 50,000","1/50th of it","It depends on the algorithm"],"answer":1,"why":"This is unit 17's multiplication and unit 5's diagnosis: the counter is state, and state kept locally on interchangeable machines means each holds a fragment of the truth. Notice it fails silently — nothing errors, your dashboard shows limits being enforced, and clients quietly get 50× what you promised."},{"id":"drl-2-2","type":"build_diagram","prompt":"You need one shared count across all 50 API servers. Add the piece.","viz":{"nodes":[{"id":"a","label":"API Servers","sub":"×50","col":0,"kind":"server"},{"id":"h","sub":"1 · check","col":1,"hole":true},{"id":"b","label":"Backend Services","sub":"2 · if allowed","col":1,"kind":"server"}],"edges":[{"from":"a","to":"h"},{"from":"a","to":"b","dash":true}]},"palette":["Redis (shared counters)","A read replica","A message queue"],"answer":{"h":"Redis (shared counters)"},"why":"One shared, fast, atomic store is the only way 50 servers can agree on a count — and Redis fits because the operation is a single-key increment, which unit 7 identified as the cleanest key-value case there is. A replica can't help (stale reads defeat the check) and a queue is asynchronous, which is useless when you must decide right now."},{"id":"drl-2-3","type":"multiple_choice","prompt":"Your code does: GET count, check it's under the limit, `INCR`, allow. What's the bug?","choices":["GET is too slow","It's check-then-act: two concurrent requests both read 99, both decide they're fine, and both increment — you allowed 101","`INCR` isn't durable","Nothing"],"answer":1,"why":"This is unit 6's race living inside the mechanism meant to enforce limits, and it looks perfectly correct until traffic is concurrent — which is the only condition a rate limiter ever operates under. The check and the increment must be one atomic operation, or the limit is decorative at exactly the moment it matters."},{"id":"drl-2-4","type":"multiple_choice","prompt":"So how do you make the check atomic?","choices":["Use a database transaction per request","Do it in one operation at the store: increment and read the new value in a single atomic call, or run a small script server-side so the whole check happens in one round trip","Lock the key first","Retry on conflict"],"answer":1,"why":"Push the decision to where the data lives so there's no window between reading and acting — an atomic increment returns the new count, and you compare against the limit afterwards. A transaction per request at 500,000/sec would be absurd overhead, and taking a lock adds another round trip plus a lock to clean up when a client dies holding it."},{"id":"drl-2-5","type":"multiple_choice","prompt":"500,000 checks/sec is too much for one Redis instance. What do you do?","choices":["Add Redis replicas","Shard the counters by key — hash the API key to pick an instance, so each client's counter lives on exactly one node and the load spreads","Batch the checks","Cache the counts"],"answer":1,"why":"Unit 15 applies cleanly here because the workload is perfectly partitionable: a client's counter is only ever touched by that client's requests, so different keys never need to meet. And the shard key picks itself — it's the same key you're limiting on, which is exactly unit 15's rule about sharding by what your hot query filters on."},{"id":"drl-2-6","type":"multiple_choice","prompt":"A single enormous customer sends 200,000 requests/second by themselves. What breaks?","choices":["Nothing — they're limited","Their counter is one key on one shard, so that shard takes 200,000 ops/sec — the celebrity problem, and sharding can't split a single key","The limit is bypassed","Redis rejects them"],"answer":1,"why":"Hashing distributes keys, not load, and one key is indivisible — so your hottest customer concentrates on one node no matter how many you add. The escape is to give that key sub-counters (limit/N on each of N shards, chosen at random per request), which trades a little exactness for a load you can actually spread."}]},{"id":"drl-3","title":"When exactness costs too much","exercises":[{"id":"drl-3-0","type":"concept","title":"Exactness is bought with a network hop on every request you were going to serve anyway","viz":{"nodes":[{"id":"r","label":"Every request","col":0,"kind":"client"},{"id":"l","label":"Limiter","col":1,"kind":"gw"},{"id":"s","label":"Counter store","sub":"1 · +0.5ms","col":2,"kind":"cache"},{"id":"a","label":"Your API","sub":"2 · if allowed","col":2,"kind":"server"}],"edges":[{"from":"r","to":"l"},{"from":"l","to":"s"},{"from":"l","to":"a"}]},"body":"An exact check means asking a shared store, and asking is a network hop — unit 4's ladder prices one datacenter round trip at roughly 5,000 RAM reads. That's the price. The interesting question is who ends up paying it, and how often. Because exactness isn't free-and-obviously-right: it's a purchase, and its worth depends on what being wrong would cost you.","note":"And the bill gets stranger the further apart your servers are. Everything above assumed the shared store is next door. Put an ocean between them and 'exact' stops being merely expensive and starts being absurd."},{"id":"drl-3-1","type":"multiple_choice","prompt":"Every check is a Redis round trip — say 0.5ms. What have you added to every single API request?","choices":["Nothing measurable","0.5ms of latency and a hard dependency, on 100% of requests — including the ones you were going to serve anyway","Only on rejected requests","0.5ms on writes only"],"answer":1,"why":"Exactness is bought with a round trip you pay universally, and unit 4's ladder says that hop costs roughly 5,000 RAM reads — so you've made every request meaningfully slower to catch the rare one that's over. Whether that's worth it depends entirely on what being wrong costs, which is the question this whole lesson turns on."},{"id":"drl-3-2","type":"multiple_choice","prompt":"So how do you get most of the protection without paying that hop on every request?","choices":["Sample requests randomly","Check a local counter first: an obvious flood is rejected instantly with no network call, and only borderline traffic goes to the shared store for exact accounting","Increase the limit","Cache the decision"],"answer":1,"why":"A client sending 50,000/sec doesn't need precise accounting to be refused, so the local check kills the flood for free and the expensive path only sees traffic where precision changes the answer. That's a broadly reusable shape — a cheap approximate filter in front of an expensive exact one — and it's what unit 5's rate-limit slider was pointing at."},{"id":"drl-3-3","type":"tradeoff_slider","prompt":"You're limiting a paid API where every request over the plan is billable revenue. Slide toward your design.","leftLabel":"Local approximate (fast, can overshoot)","rightLabel":"Shared exact (precise, hop per request)","answerRange":[60,100],"why":"When the limit IS the billing boundary, overshooting means giving away product or overcharging a customer — both are real money and one is a support incident. That justifies the round trip, exactly as unit 5 argued. Run the same question on a generous free tier and you'd slide the other way, because there the only cost of overshoot is a bit of capacity nobody missed."},{"id":"drl-3-4","type":"multiple_choice","prompt":"Redis goes down. Your limiter can't check anything. What should happen?","choices":["Block all requests — safety first","It depends on what the limit protects: fail open if it guards against noisy neighbours, fail closed if it guards something that costs money or can be abused","Always fail open","Retry until Redis returns"],"answer":1,"why":"There's no universal answer because the two failures are asymmetric in ways that depend on the limit's purpose — failing closed on a courtesy limit turns a Redis blip into a full outage, while failing open on an abuse control invites exactly the flood you built it for. Retrying is the worst option: you add latency to every request during an incident and still have to decide."},{"id":"drl-3-5","type":"multiple_choice","prompt":"You run in three regions. A client's limit is 1,000/minute globally. Should the counter be global?","choices":["Yes — the limit is global, so the counter must be","Usually not: a global counter means every request pays a cross-region round trip, so most systems give each region a share and accept some imprecision","Yes, using consensus","No — limits should be per-region by policy"],"answer":1,"why":"A truly global counter needs cross-region coordination on every request, which is unit 20's warning and unit 4's physics — you'd add 100ms+ to every call to enforce a number to the digit. Splitting the budget per region keeps the check local, and the imprecision runs the opposite way from what you'd guess: give each of 3 regions 333/min, and a client sending all 900 of their requests to one region gets cut off at 333 while their budget in the other two sits unused. Lopsided traffic under-serves rather than over-serves, and the total can never exceed 1,000. Real systems soften that by letting regions borrow unused budget or rebalancing shares from observed demand. You'd only exceed the global limit the other way around — if each region enforced the full 1,000 and the traffic were evenly spread, a client could get 3,000."},{"id":"drl-3-6","type":"multiple_choice","prompt":"What's the honest way to describe a per-region split to a customer?","choices":["Say it's exactly 1,000","Publish it as approximately 1,000 per minute — because a limit you enforce approximately should be documented approximately, or the first support ticket will be about your own spec","Don't mention it","Tell them limits are per-region"],"answer":1,"why":"If your enforcement is approximate, an exact promise is a bug you wrote into the docs — and someone will measure it. Saying 'approximately 1,000' is both honest and useful: it tells clients not to build logic that depends on the exact boundary, which is the behaviour you wanted anyway."}]},{"id":"drl-4","title":"The edges","exercises":[{"id":"drl-4-0","type":"concept","title":"A request count only means something while requests cost the same","viz":{"nodes":[{"id":"c","label":"Two clients","sub":"same request rate","col":0,"kind":"client"},{"id":"l","label":"Limiter","sub":"counts requests","col":1,"kind":"gw"},{"id":"a","label":"`/cached`","sub":"2ms","col":2,"kind":"server"},{"id":"b","label":"`/report`","sub":"30s","col":2,"kind":"server"}],"edges":[{"from":"c","to":"l"},{"from":"l","to":"a"},{"from":"l","to":"b"}]},"body":"Your limiter counts requests, which quietly assumes a request is a unit of something. Look at what's behind the door, though. The endpoints your clients call are not interchangeable, not remotely, and the limiter can't see any of it, because it's counting the one thing every request has in common. Whether that's fine depends on a number you haven't checked.","note":"And cost-weighting has a trap of its own: you must charge before you serve, which means pricing a request you haven't run yet. Sometimes the only honest move is to charge on the way out and settle the difference after."},{"id":"drl-4-1","type":"multiple_choice","prompt":"Your limiter counts requests. One endpoint runs a 30-second report; another returns a cached string. What's wrong?","choices":["Nothing — a request is a request","A request count is a proxy for load, and it stops describing anything once requests differ by 15,000× in cost — a client burning your fleet looks identical to one fetching cached strings","The report endpoint needs its own service","The cached endpoint shouldn't be limited"],"answer":1,"why":"Counting requests is only meaningful while requests are roughly interchangeable, which is exactly unit 17's warning and unit 12's round-robin problem in a different costume. The fix is to charge by cost — expensive endpoints deduct more tokens — so the budget tracks the resource you're actually protecting rather than a number that happens to be easy to count."},{"id":"drl-4-2","type":"multi_select","prompt":"Your limiter is the front door for everything. Which properties does it need? Select all.","choices":["Higher availability than the services behind it","Latency low enough to be invisible in the request path","A defined behaviour when its own dependencies fail","Strong durability of the counters"],"answer":[0,1,2],"why":"It must be more available than what it protects, fast enough to disappear into the request, and explicit about its own failure — those follow from sitting in front of 100% of traffic. Durability is the one it doesn't need: losing counters means a brief window of unlimited traffic, and counters rebuild within a window, so it's derived state in unit 5's sense."},{"id":"drl-4-3","type":"multiple_choice","prompt":"Where should the limiter run?","choices":["Inside each service, after authentication","At the edge or gateway, before you've spent anything — the value of a rejection is proportional to how little it cost you","In the database layer","In the client SDK"],"answer":1,"why":"A rejection that happens after you've parsed a body, authenticated, and queried the database has already spent everything you were trying to save. The awkward part is that limiting by API key needs identity, so you want authentication early too — which is why gateways typically do both, cheaply, before any real work begins."},{"id":"drl-4-4","type":"multiple_choice","prompt":"10,000 clients get limited at once and all obey `Retry-After`: 60. What have you built?","choices":["A well-behaved system","A synchronized stampede: every client returns at the same instant because you told them all the same number — obedience produced the spike","Nothing harmful","A backlog"],"answer":1,"why":"Giving many clients an identical instruction about time schedules a thundering herd, and the clients did exactly what you asked — this is unit 17's trap and it's the same shape as unit 20's split votes. Jitter the value you hand out so retries spread across an interval, because any time you make clients agree on a moment, you've built a stampede."},{"id":"drl-4-5","type":"multiple_choice","prompt":"A single client's limit is enforced correctly — but 10,000 clients each at their limit still overwhelm you. What's missing?","choices":["Lower per-client limits","Per-client limits sum to no bound at all: you also need a global load-shedding layer that protects total capacity regardless of who's asking","More servers","A better algorithm"],"answer":1,"why":"Per-client limits answer 'is this client being unfair?' and say nothing about 'can we serve this much in total' — every client can be perfectly compliant while the sum exceeds your fleet. That's unit 17's composition problem at the top level, and it's why real front doors have both: fairness limits per client, and a global shed valve that doesn't care whose request it is."},{"id":"drl-4-6","type":"multiple_choice","prompt":"Summarize the rate limiter design.","choices":["A counter in Redis with a TTL","An atomic check on sharded counters, run at the edge before you spend anything — with a local approximate filter in front, a deliberate failure policy, cost-weighted charging, and a global shed valve behind it","A token bucket per user","A middleware that counts requests"],"answer":1,"why":"The algorithm was the easy part; what makes it a system is that it sees every request, so its own latency, availability, and failure mode become everyone's. Every hard decision came back to one question this course has asked since unit 5 — where does the counter live — and each answer traded exactness against latency, availability, and the cost of being wrong."}]}]};

const UNIT27 = {"unitId":"design-ride-sharing","title":"Design a Ride-Sharing Backend","subtitle":"The boss level — geography, matching, real-time, and money in one system","lessons":[{"id":"ride-1","title":"The location firehose","exercises":[{"id":"ride-1-0","type":"concept","title":"A driver's location is worthless four seconds after they send it","viz":{"nodes":[{"id":"d","label":"Driver location","sub":"every 4s","col":0,"kind":"client"},{"id":"n","label":"Where they are now","sub":"one fact, always changing","col":1},{"id":"h","label":"Trip trace","sub":"every fact, kept","col":1}],"edges":[{"from":"d","to":"n"},{"from":"d","to":"h"}]},"body":"Every driver reports where they are, constantly. Ask what one of those reports is actually worth, and for how long — because the next one is four seconds behind it, and the fact it describes will have moved on. Unit 5's question, the one about where state lives and why, is sitting right here, and it has never had a clearer answer.","note":"And 'location' is two requirements wearing one word: where a driver is *now*, and where they have *been*. Those two want opposite things from you in almost every respect. Design them as one and you'll get both wrong."},{"id":"ride-1-1","type":"estimate","prompt":"1 million drivers are online, each sending their location every 4 seconds. Roughly how many location writes per second?","answer":250000,"tolerance":50000,"unit":"writes/sec","why":"1,000,000 ÷ 4 = 250,000 updates/sec, continuously, just from drivers existing — before a single ride is requested. That number reframes the whole problem: this is a write-heavy real-time system, which almost nothing else in this course has been."},{"id":"ride-1-2","type":"multiple_choice","prompt":"Should each of those 250,000 updates/sec be a row written to your main database?","choices":["Yes — you need the location history","No: it would dwarf every other write in the system, and each update makes the previous one worthless — you only need where a driver is NOW","Yes, but batched","Only for drivers on a trip"],"answer":1,"why":"Current location is the definition of ephemeral state: the value has a lifespan of four seconds, and durably persisting something you're about to overwrite is paying for a guarantee with no beneficiary. Unit 5's question answers itself here — if you lost every driver's location, they'd all tell you again within four seconds."},{"id":"ride-1-3","type":"build_diagram","prompt":"Driver locations change constantly, are read constantly, and are worthless once stale. Add where they should live.","viz":{"nodes":[{"id":"l","label":"Location Service","col":0,"kind":"server"},{"id":"h","sub":"derived, hot","col":1,"hole":true},{"id":"t","label":"Trip Database","sub":"source of truth","col":1,"kind":"db"}],"edges":[{"from":"l","to":"h"},{"from":"l","to":"t","dash":true}]},"palette":["In-memory geo store (Redis)","Object storage","A message queue"],"answer":{"h":"In-memory geo store (Redis)"},"why":"Hot, tiny, constantly overwritten, and rebuildable in seconds — that's the exact profile for an in-memory store, and it keeps 250,000 writes/sec away from the database that holds the things you actually can't lose. Note the split: current location is derived state, while the trip record is the source of truth, and they get completely different treatment."},{"id":"ride-1-4","type":"multiple_choice","prompt":"You also want trip history for receipts, disputes, and analytics. How does that fit?","choices":["Write it all to the same in-memory store","Stream the location points to a queue and persist them asynchronously — history is durable but not urgent, so it never touches the live path","Don't keep history","Query the in-memory store later"],"answer":1,"why":"Two requirements hide inside 'location': a live position that must be fast and disposable, and a trip trace that must be durable but can arrive seconds late. Splitting them lets each be right — unit 16's queue carries the history off the critical path, exactly as analytics did in the URL shortener."},{"id":"ride-1-5","type":"multiple_choice","prompt":"Do all 250,000 updates/sec need to be processed at full fidelity?","choices":["Yes — precision matters","No: a driver parked at a red light is sending the same point repeatedly, so clients can throttle when stationary and send more often when moving fast","Yes, for safety","No — sample randomly"],"answer":1,"why":"The information content of an update is how much the driver moved, not that four seconds elapsed — so an adaptive rate cuts a large share of the firehose while improving the data you keep. This is the cheapest kind of scaling: not handling the load better, but noticing that much of it carried no information."},{"id":"ride-1-6","type":"multiple_choice","prompt":"Why is this system harder than the news feed, despite the feed having more users?","choices":["It has more data","The feed was read-heavy and could precompute; this is write-heavy, real-time, and geographic — you can't precompute 'who's near me' because the answer changes every second","It needs more servers","The database is bigger"],"answer":1,"why":"Every technique that saved the feed depended on the answer being stable long enough to cache, and here the underlying data moves continuously — the thing you'd cache is stale before you've written it. That's why this is the boss level: the read-heavy playbook, which has rescued nearly every system so far, simply doesn't apply."}]},{"id":"ride-2","title":"Finding who's nearby","exercises":[{"id":"ride-2-0","type":"concept","title":"An index that sorts one axis at a time cannot answer a two-dimensional question","viz":{"nodes":[{"id":"q","label":"Drivers within 2km","col":0,"kind":"client"},{"id":"b","label":"Index on `(lat, lng)`","sub":"lat first, then lng","col":1,"kind":"db"},{"id":"n","label":"Rows it narrows to","sub":"how many?","col":2}],"edges":[{"from":"q","to":"b"},{"from":"b","to":"n"}]},"body":"A composite index on `(lat, lng)` sorts by `lat` first, and by `lng` only *within* an identical `lat`. That's it — that's the whole mechanism, and it's just unit 8's leftmost-prefix rule you already know. Now draw a 2km box around a rider and trace what the index can actually do with it. The answer is worse than you'd like.","note":"Which is why geohashing and its relatives exist — Geohash, S2, H3, differing mainly in cell shape. They don't build a cleverer index. They change the question into one the index you already have was always good at."},{"id":"ride-2-1","type":"multiple_choice","prompt":"A rider opens the app. You need drivers within 2km. Why can't a normal B-tree index on (latitude, longitude) do this well?","choices":["It's too slow to sort","A B-tree orders on one dimension at a time — it can find a latitude range, but every driver at that latitude anywhere on Earth qualifies, so you'd filter a huge set by longitude afterwards","Coordinates can't be indexed","The index would be too large"],"answer":1,"why":"This is unit 8's leftmost-prefix rule biting in a new way: the index is sorted by latitude, then by longitude WITHIN each latitude, so a two-dimensional range query can only use the first dimension efficiently. Proximity is inherently 2D, and a structure that orders one axis at a time can't express it."},{"id":"ride-2-2","type":"multiple_choice","prompt":"So what's the core trick behind geospatial indexing?","choices":["Store coordinates as strings","Reduce two dimensions to one: divide the world into cells and give each a single id, so 'nearby' becomes 'same or adjacent cell' — a one-dimensional lookup a normal index can serve","Use a graph database","Precompute every distance"],"answer":1,"why":"Geohashing and its relatives all do the same thing — map a 2D position to a 1D key such that nearby points usually share a prefix — which turns proximity into the prefix lookup that B-trees are already excellent at. That's the whole insight: you didn't invent a new index, you reshaped the question into one the old index can answer."},{"id":"ride-2-3","type":"match_pairs","prompt":"Match each geospatial idea to what it does.","pairs":[{"left":"Geohash","right":"Encodes a location as a string; shared prefix means nearby"},{"left":"Cell size","right":"Shorter prefix = bigger area = more candidates"},{"left":"Neighbour cells","right":"Must be checked, or you miss drivers just over the border"},{"left":"Exact distance","right":"Computed at the end, on the small candidate set"}],"why":"The pattern is coarse filter then exact check: the cell lookup cheaply narrows millions of drivers to dozens, and only then do you compute real distances. That two-stage shape is everywhere in this course — the same 'cheap approximate filter in front of an expensive exact one' as the rate limiter."},{"id":"ride-2-4","type":"multiple_choice","prompt":"Two drivers are 50 metres apart but on opposite sides of a cell boundary. What happens?","choices":["Nothing — they're both found","A naive same-cell query misses one of them, because cell adjacency doesn't match real distance at the edges — so you must search the neighbouring cells too","The geohash is wrong","They're merged into one cell"],"answer":1,"why":"Cells are an arbitrary grid laid over continuous space, so being close and sharing a cell aren't the same thing — a rider standing at a boundary would see nobody despite drivers metres away. Every real implementation queries the surrounding cells as well, which is a good reminder that the discretization is a convenience rather than the truth."},{"id":"ride-2-5","type":"multiple_choice","prompt":"Cell size is fixed. Downtown has 5,000 drivers in one cell; a rural cell has 2. What's the problem?","choices":["Rural riders wait longer","Both ends break: the dense cell returns thousands of candidates to filter, and the sparse cell returns almost nobody — so a fixed grid can't serve both","The geohash is too long","Nothing"],"answer":1,"why":"Driver density varies by orders of magnitude across a city, so any single cell size is wrong somewhere — which is why real systems use variable precision, going finer downtown and coarser in the countryside. It's unit 15's hot shard in geographic form: uniform partitioning of non-uniform data concentrates load exactly where you're busiest."},{"id":"ride-2-6","type":"multiple_choice","prompt":"Should the geo index be sharded by driver id?","choices":["Yes — it spreads load evenly","No: every query asks 'who is near this point', so sharding by location keeps a query on one shard, while sharding by driver id would make every search hit every shard","Yes, for even distribution","It doesn't matter"],"answer":1,"why":"Unit 15's rule decides it: shard by what your hot query filters on, and the hot query filters on location. Driver id would distribute beautifully and force a scatter-gather on every single search — perfect balance, useless locality. The cost of choosing location is accepting the downtown hotspot, which is the trade you'd take."}]},{"id":"ride-3","title":"Matching","exercises":[{"id":"ride-3-0","type":"concept","title":"Assigning a driver isn't a write — it's a claim only one matcher may win","viz":{"nodes":[{"id":"r1","label":"Rider A","col":0,"kind":"client"},{"id":"r2","label":"Rider B","col":0,"kind":"client"},{"id":"m1","label":"Matcher 1","sub":"reads: free","col":1,"kind":"server"},{"id":"m2","label":"Matcher 2","sub":"reads: free","col":1,"kind":"server"},{"id":"d","label":"Driver 88","sub":"one car","col":2}],"edges":[{"from":"r1","to":"m1"},{"from":"r2","to":"m2"},{"from":"m1","to":"d"},{"from":"m2","to":"d"}]},"body":"Two riders, two matchers, one nearby driver. Both matchers look, and both see the same thing: available. You've met this shape before — unit 6, and again in the rate limiter — so you know how it ends. What's different is the blast radius. A lost counter increment is a number. This one is a real car pulling up to a kerb with two people standing at it.","note":"This is where the system stops being about data. A stale marker or a late receipt you fix quietly, and nobody finds out. An assignment leaves the building on four wheels, and no state management calls it back."},{"id":"ride-3-1","type":"multiple_choice","prompt":"Two riders request a ride simultaneously. Your matcher offers the same nearby driver to both. What have you built?","choices":["An efficient system","A double-booking: the classic race — both matchers read 'driver available', both decide, and one rider gets a driver who's already gone","Nothing harmful — the driver picks","A load balancing problem"],"answer":1,"why":"This is unit 6's check-then-act with a person on the other end: read-decide-write across two concurrent matchers, and the second write silently overwrites the first. Unlike a lost counter increment, this one is visible in the real world — someone's car arrives and there are two people expecting it."},{"id":"ride-3-2","type":"multiple_choice","prompt":"How do you make assignment safe?","choices":["Match more slowly","Make the claim atomic: a conditional update that only succeeds if the driver is still available, so exactly one matcher wins and the loser picks someone else","Use a queue per driver","Let the driver reject one"],"answer":1,"why":"You need compare-and-set semantics — 'set this driver to assigned IF they are currently available' — so the store adjudicates rather than your application logic guessing. That's unit 9's optimistic concurrency, and it's the right shape here because collisions are rare: most requests aren't fighting over the same driver, so locking everyone up front would tax the 99% for the 1%."},{"id":"ride-3-3","type":"multiple_choice","prompt":"Does this need a distributed consensus service like ZooKeeper?","choices":["Yes — it's a distributed lock","Usually not: a conditional update in a store you already run gives you the mutual exclusion, and unit 20's advice was to use consensus only where two answers is a catastrophe you can't reconcile","Yes, for correctness","No — races are acceptable here"],"answer":1,"why":"The claim is a single-key atomic operation, which any decent store does natively — pulling in a consensus system means operating another distributed system to solve a problem your database already solves. And a rare double-booking, while genuinely bad, is recoverable by reassigning; it's not the un-mergeable divergence that justifies consensus."},{"id":"ride-3-4","type":"multiple_choice","prompt":"Your matcher assigns the nearest available driver, instantly, every time. What's wrong with that as a strategy?","choices":["Nothing — nearest is optimal","Nearest-now is greedy: waiting a moment to batch requests and drivers together often produces better overall matches than each decision made in isolation","It's too slow","Distance is hard to compute"],"answer":1,"why":"A locally optimal choice per request can be globally poor — grabbing the closest driver for rider A may strand rider B whom that driver was much better placed for. Batching over a short window turns a series of greedy picks into an assignment problem you can actually optimize, at the cost of a small delay nobody notices."},{"id":"ride-3-5","type":"multiple_choice","prompt":"A driver is offered a ride and doesn't respond. How long do you wait?","choices":["Until they respond","A few seconds, then offer it to someone else — but you've just met the same undecidable question again: are they ignoring it, or is their phone on a bad connection?","Thirty seconds","Cancel the ride"],"answer":1,"why":"'Dead or just slow?' has followed this course from replication to failover to health checks, and here it's a person on a phone in a tunnel. You pick a timeout and accept both errors: too short and you snatch rides from drivers who were about to accept, too long and the rider stares at a spinner. There's no correct value, only a chosen failure mode."},{"id":"ride-3-6","type":"multiple_choice","prompt":"The driver accepts, but the acceptance is lost in flight. What must be true of your system?","choices":["It should retry the whole match","Accepting must be idempotent — the driver's client retries with the same ride id, and the second accept returns the same result rather than double-booking or erroring","The driver should tap again","The rider is notified of failure"],"answer":1,"why":"Unit 21 exactly: a timeout doesn't tell you whether the accept landed, so the client retries and the server must recognize the repeat as the same intent. Without that, a lost ack means either the driver appears not to have accepted a ride they did, or the retry creates a second assignment — both visible to real people in a car."}]},{"id":"ride-4","title":"The whole trip","exercises":[{"id":"ride-4-0","type":"concept","title":"One trip produces data with completely different costs of being wrong","viz":{"nodes":[{"id":"r","label":"One trip","col":0},{"id":"l","label":"Trip state + money","sub":"wrong for a second?","col":1,"kind":"db"},{"id":"m","label":"Car on the map","sub":"wrong for a second?","col":1,"kind":"cache"},{"id":"e","label":"Receipt email","sub":"wrong for a second?","col":1,"kind":"queue"}],"edges":[{"from":"r","to":"l"},{"from":"r","to":"m"},{"from":"r","to":"e"}]},"body":"One trip throws off several kinds of data, and the temptation is to treat them alike because they came from one event. Resist it. Ask of each what it costs you to be wrong about it for a second — the answers aren't close to each other, they're orders of magnitude apart. Unit 19's rule applies per *dataset*, not per company, and this is where you feel it.","note":"And when the money moves, your idempotency key has to travel *to the provider*. Keep it in a local dedup table and you've quietly rebuilt the exact dual-write problem you were avoiding, with real money in the gap."},{"id":"ride-4-1","type":"multiple_choice","prompt":"The trip is underway. Which parts of this system now need strong consistency?","choices":["All of it — it's a real-time system","The trip's state and the payment: those are money and commitments. The car's position on the map can be a second stale and nobody is harmed","None of it","Only the driver's location"],"answer":1,"why":"The same product contains data with completely different costs of being wrong: a trip charged twice is a refund and a complaint, while a marker lagging one second is invisible. Unit 19's rule applies per dataset rather than per company — buy strong guarantees for the ledger and let the map be eventually consistent."},{"id":"ride-4-2","type":"multiple_choice","prompt":"At trip end, you must charge the rider and credit the driver — across your database and an external payments provider. What's the problem?","choices":["It's a simple transaction","Atomicity stops at your database: your `ROLLBACK` can't un-charge a card, so you need a saga with compensating actions plus idempotency keys","The payment provider handles it","It needs two-phase commit"],"answer":1,"why":"Unit 9's boundary and unit 21's keys arrive together at the moment money moves: two systems can't commit as one, so you record intent, call the provider with an idempotency key, and reconcile — with a compensating refund if a later step fails. 2PC across a third party you don't control isn't available, which is why sagas exist."},{"id":"ride-4-3","type":"multiple_choice","prompt":"A concert ends and 20,000 people request rides in one neighbourhood within two minutes. What breaks first?","choices":["The payment system","The geo shard covering that neighbourhood — location sharding means the surge concentrates on exactly one shard, which is the hot shard you accepted when you chose the key","The location firehose","Nothing"],"answer":1,"why":"You chose to shard by location for query locality, and that decision hands you geographic hotspots as its structural cost — demand is never uniform across a city. Unit 15 warned that a shard key is a permanent bet: this is the bet being called, and the answers are finer cells downtown, replicas for hot cells, and shedding load rather than melting."},{"id":"ride-4-4","type":"multi_select","prompt":"Which parts of this system can degrade gracefully during that surge? Select all.","choices":["Showing fewer nearby drivers on the map","Updating the car's position every 8 seconds instead of every 2","Delaying receipt emails","Assigning the same driver to two riders"],"answer":[0,1,2],"why":"The first three shed cost with effects users barely register — a slightly laggier map and a late email are nothing next to the app failing. Double-booking is not degradation, it's incorrectness: it puts two people in a parking lot expecting one car. Knowing which is which, before the surge, is what makes graceful degradation possible."},{"id":"ride-4-5","type":"tradeoff_slider","prompt":"During the surge, your matcher is overloaded. Slide toward your response.","leftLabel":"Queue every request; everyone eventually matches","rightLabel":"Shed load: tell some riders 'no cars available, try again'","answerRange":[55,100],"why":"Queueing at a surge means riders wait five minutes to be matched with a driver who's now somewhere else, so you've spent capacity producing stale matches and a worse experience than an honest refusal. Unit 17's lesson holds here: a system that says no cleanly beats one that says yes slowly, and 'no cars right now' lets someone walk to the train instead of staring at a spinner."},{"id":"ride-4-6","type":"multiple_choice","prompt":"Summarize the ride-sharing design.","choices":["A geo database with real-time queries","Ephemeral location in memory with history streamed off the critical path; a geo-cell index turning 2D proximity into a 1D lookup; atomic conditional claims for matching; and strong consistency reserved for the trip and the money","A microservices architecture with a message bus","A graph of drivers and riders"],"answer":1,"why":"Every part came from asking what the data actually is: locations are disposable, so they live in memory; proximity is 2D, so you reshape it into a key an index can serve; an assignment is a commitment, so it's a compare-and-set; and money is irreversible, so it gets the strict path. The system is hard because it contains four different systems, and the skill is refusing to treat them the same."}]}]};

const UNIT28 = {"unitId":"checkpoint-foundations","title":"Checkpoint: Foundations","subtitle":"Mixing units 1–5 — can you still do this when nobody tells you which lesson it's from?","lessons":[{"id":"cp1-1","title":"Mixed recall","exercises":[{"id":"cp1-1-1","type":"multiple_choice","prompt":"Your API server responds in 3ms. A user in Sydney says the app is slow. Your servers are in Virginia. What's the dominant cost?","choices":["The server needs optimizing","The network round trip — physics puts a floor under Virginia↔Sydney that no server speed can beat","The database","The user's browser"],"answer":1,"why":"A 3ms server against a round trip of roughly 200ms means the server is a rounding error — you're paying the speed of light, which unit 1 established and unit 4 quantified. The only lever left is to stop making them cross the planet, which is why the answer to this problem is geographic rather than algorithmic."},{"id":"cp1-1-2","type":"fill_blank","prompt":"An operation is ______ if performing it many times has the same effect as performing it once.","choices":["idempotent","atomic","stateless","cached"],"answer":0,"why":"Idempotent. It's the property that makes retries safe — and since a timed-out request is genuinely ambiguous (did it happen?), retries are unavoidable, which makes this the backbone of reliability rather than a nicety."},{"id":"cp1-1-3","type":"multi_select","prompt":"Which of these are STATE — things the system must remember? Select all.","choices":["A user's session","An uploaded file","A pure function that formats a date","A message sitting in a queue, not yet processed"],"answer":[0,1,3],"why":"Sessions, files, and in-flight work are all things that would be LOST if every server restarted right now — which is unit 5's test for what counts as state. The date formatter isn't state: same input, same output, nothing retained. The queued message catches people out, but work-in-progress is state, which is exactly why real queues persist to disk and wait for an ack."},{"id":"cp1-1-4","type":"multiple_choice","prompt":"Which HTTP status code tells a client 'your request was fine, but you've sent too many'?","choices":["`503 Service Unavailable`","`429 Too Many Requests`","`403 Forbidden`","`500 Internal Server Error`"],"answer":1,"why":"`429` is the rate-limit signal, and it matters that it's distinct from `503`: `429` says *you* should slow down, while `503` says *the service* is unwell. Pair it with `Retry-After` and a well-behaved client knows exactly how long to wait instead of guessing."},{"id":"cp1-1-5","type":"match_pairs","prompt":"Match each foundation to the unit idea it belongs to.","pairs":[{"left":"DNS","right":"Turns a name into an IP address"},{"left":"Statelessness","right":"Any server can handle any request"},{"left":"Cursor pagination","right":"Inserts can't shift your window"},{"left":"p99","right":"The worst 1% — your unhappiest users"}],"why":"Four ideas from four units, and each is load-bearing later: DNS is the first cache you met, statelessness is what makes horizontal scaling possible, cursors are why feeds don't show duplicates, and p99 is why averages lie."},{"id":"cp1-1-6","type":"multiple_choice","prompt":"Why is `GET` safe to retry, cache, and prefetch — but `POST` isn't?","choices":["`GET` is faster","`GET` only reads, so repeating it changes nothing; `POST` creates something new each time it runs","`POST` requires authentication","`GET` responses are smaller"],"answer":1,"why":"`GET` is *safe* — it doesn't change server state — which is precisely what lets crawlers, browsers, and CDNs fire it freely. That single property is why the web can cache so aggressively, and it's why hiding a delete behind a `GET` is dangerous: a crawler following links would happily wipe your data."}]},{"id":"cp1-2","title":"Connecting the units","exercises":[{"id":"cp1-2-1","type":"multiple_choice","prompt":"Unit 5 said 'every copy costs you a consistency question.' Which of these is NOT a copy in that sense?","choices":["A CDN edge holding your logo","A cache holding a computed value","The single database row that is the source of truth","A read replica"],"answer":2,"why":"The source of truth is the original — it's what the copies are copies OF, and it can't disagree with itself. Everything else on that list is derived, which means each one buys speed and hands you the question of what happens when it drifts. Spotting which thing is authoritative is the first move in almost every design discussion."},{"id":"cp1-2-2","type":"multiple_choice","prompt":"You cache a user's profile for 60 seconds. What have you actually bought and sold?","choices":["Bought speed, sold nothing","Bought speed and reduced load; sold freshness — for up to 60 seconds a reader can see the past","Bought correctness, sold speed","Nothing changed"],"answer":1,"why":"That TTL is you naming a price: 60 seconds of possible staleness in exchange for fast reads and less database load. Stating it that way is the useful habit — a cache isn't a performance trick you add, it's a consistency policy you're choosing, and the only question is whether 60 seconds of wrong costs less than the speed is worth."},{"id":"cp1-2-3","type":"spot_bottleneck","prompt":"Every request flows left to right. Each component's capacity is shown. Tap the one that limits the whole system.","nodes":["DNS — 100k rps","Load Balancer — 40k rps","App servers — 6k rps","Cache — 80k rps"],"answer":2,"why":"A chain is limited by its slowest stage, so the app servers at 6k rps cap the whole system at 6k — everything downstream is capacity you're paying for and can't reach. The corollary is the one people ignore: making the cache faster buys exactly nothing, because it was never the constraint. Measure first, then fix the actual limit."},{"id":"cp1-2-4","type":"multiple_choice","prompt":"Your app has 10,000 requests/second and a 99.9% success rate. How worried should you be?","choices":["Not at all — 99.9% is excellent","That's 10 failures every second, roughly 864,000 a day — convert percentages to rates before deciding they're fine","It depends on the endpoint","Only if users complain"],"answer":1,"why":"Percentages feel small and rates feel real: 0.1% of 10,000/sec is 10 people per second having a bad time. This is unit 4's move — always multiply out before accepting a number, because 'three nines' sounds like success and looks like a support queue."},{"id":"cp1-2-5","type":"multiple_choice","prompt":"A teammate wants to store the shopping cart in server memory 'because it's fastest.' What's the one question that settles it?","choices":["How much memory do we have?","If this server died right now, what would we lose — and who else needs to read this?","Is the cart big?","Which framework are we using?"],"answer":1,"why":"Those two halves decide durability and sharing, and those two decide the place — which is unit 5's entire lens in one sentence. Run it here: the cart is lost on restart (bad), and the user expects it on their laptop too (so another machine must read it). Both answers point away from local memory, and you never had to argue about speed."},{"id":"cp1-2-6","type":"multiple_choice","prompt":"What connects DNS caching, a CDN, a read replica, and a browser cache?","choices":["They all use HTTP","They're all copies kept near the reader — each buys speed and each can be stale","They're all databases","They all require configuration"],"answer":1,"why":"Four different names for one idea: put a copy closer to whoever's asking. That's why they share a failure mode — every one of them can serve you the past — and why the same question governs all four: what does being out of date cost here? Seeing the pattern once means you already understand caching layers you haven't met yet."}]}]};
