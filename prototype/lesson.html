 {"type":"multiple_choice","prompt":"You store the shopping cart's total price in a cookie on the client. What's the danger?","choices":["Cookies are too slow","The client controls it and can edit it — so a user could set their total to $0","Cookies expire too quickly","There's no danger; it saves a database call"],"answer":1,"why":"Anything living on the client is under the user's control. They can open dev tools and change it. Client state is never trustworthy for anything involving money, permissions, or security.","goDeeper":"The rule: client-held state is a convenience or a cache — never the source of truth for anything that matters. If you must put something sensitive there, sign it so tampering is detectable. That's precisely what a JWT's signature is for: the client carries the data, but can't forge it."},
 {"type":"multi_select","prompt":"Which are good reasons to put state in a shared cache like Redis instead of the database? Select all.","choices":["It's far faster — memory instead of disk","It takes read load off the database","It's the safest place for the only copy of critical data","It's shared, so every app server sees the same value"],"answer":[0,1,3],"why":"Redis is fast and shared — excellent reasons. But it's typically volatile, so it is emphatically not the place for the only copy of data you can't afford to lose.","goDeeper":"Caches should hold derived state — rebuildable from the source of truth. The moment data exists ONLY in your cache, you've turned your cache into a database, without any of a database's durability guarantees. Teams discover this during the first unplanned Redis restart."},
 {"type":"multiple_choice","prompt":"A message sitting in a queue waiting to be processed — is that state?","choices":["No, it's just a message in transit","Yes — it's in-flight state the system must not lose","Only if the message is large","Only if it's been there over a minute"],"answer":1,"why":"Work-in-progress is state. If the queue loses that message, the work simply vanishes — an order never ships, an email never sends, and nothing errors.","goDeeper":"This is exactly why real queues (Kafka, SQS) persist messages to disk and wait for an explicit acknowledgement before deleting them. 'At-least-once delivery' exists because in-flight state is state — and it's why consumers must be idempotent, the property you met in Unit 2. The pieces connect."},
 {"type":"multiple_choice","prompt":"What's the first question to ask about any new piece of state?","choices":["What programming language will read it?","If we lost it, what breaks — and who else needs to read it?","How many bytes is it?","Is it JSON or binary?"],"answer":1,"why":"Those two questions — what's lost, and who must read it — decide durability and sharing, and those two decide the place. Everything else is detail.","goDeeper":"Run it on examples. A rebuildable computed value nobody else needs? Local memory is perfect. A payment record? Durable, replicated, shared. Same question, opposite answers — and you got there without a single technology name."}
]},
{"id":"state-3","title":"Copies and the truth","exercises":[
 {"type":"multiple_choice","prompt":"The moment you cache a value so it exists in two places, what problem have you created?","choices":["None — you just made it faster","The two copies can disagree — you now own a consistency problem","Only extra storage cost","Only extra latency"],"answer":1,"why":"One copy can't disagree with itself. Two copies can drift apart, and now you must decide what happens when they do — and who wins.","goDeeper":"Generalize it: every performance optimization built on copies — caches, read replicas, CDNs, denormalization — buys speed with consistency. There is no copy without a consistency question attached to it. When someone proposes a cache, they're proposing a consistency policy, whether they've noticed or not."},
 {"type":"fill_blank","prompt":"The one authoritative copy of a piece of data is called the source of ______.","choices":["truth","record","data","origin"],"answer":0,"why":"The source of truth is the copy that wins any argument. If two places disagree, it's right by definition — everything else is derived from it.","goDeeper":null},
 {"type":"match_pairs","prompt":"Match each kind of copy to what it is.","pairs":[{"left":"Source of truth","right":"The authoritative copy — if in doubt, ask it"},{"left":"Cache","right":"A fast copy that may be stale"},{"left":"Replica","right":"A copy kept in sync, for reads or failover"},{"left":"Stale","right":"A copy that no longer matches the truth"}],"why":"Each copy has a job and a failure mode. Being explicit about which is which is what keeps a design honest.","goDeeper":"In a design discussion, the sharpest question you can ask is: 'which of these is the source of truth?' Surprisingly often, nobody knows — and that ambiguity is where the worst bugs live."},
 {"type":"multiple_choice","prompt":"There's a famous joke: 'There are only two hard things in Computer Science: cache invalidation and naming things.' Why is cache invalidation genuinely hard?","choices":["Deleting keys is computationally expensive","Knowing WHEN a cached copy became wrong requires knowing every possible thing that could have changed it","Caches don't support deletion","It isn't hard — it's just a joke"],"answer":1,"why":"The cache has no idea the truth changed. Someone has to tell it, or it has to guess. Both are imperfect, and the knowledge of 'what invalidates this?' is scattered across every write path in your system.","goDeeper":"The two strategies: TTL (expire after N seconds — dead simple, but you knowingly serve stale data for up to N seconds) or explicit invalidation (delete the key when the data changes — precise, but you must find every write path forever, including the one a teammate adds next year without knowing your cache exists). Most real systems use both, because both are inadequate alone."},
 {"type":"multiple_choice","prompt":"Your entire cache is accidentally wiped. Is that an outage?","choices":["Always a catastrophe — the data is gone","It depends: if it held derived state, it rebuilds from the source of truth — painful but recoverable. If it held the only copy, the data is gone","Never a problem — caches don't matter","Only if it was more than 1GB"],"answer":1,"why":"The question for any copy is: can I rebuild this? Derived state can be recomputed from the truth. If the cache was the only home, there's nothing to rebuild from.","goDeeper":"Be religious about this distinction. A wiped cache of derived state = a bad afternoon (every request stampedes the database at once until it refills — the 'thundering herd'). A wiped source of truth = a company-ending event. You should always know, without thinking, which one each store is."},
 {"type":"tradeoff_slider","prompt":"You're displaying a user's account balance in a banking app. Slide toward how aggressively you'd cache it.","leftLabel":"Read the source of truth (correct, slower)","rightLabel":"Cache aggressively (fast, may be stale)","answerRange":[0,35],"why":"Showing someone the wrong balance is unacceptable — it's the one number they came to see, and being stale here looks like a bug or a theft. Pay the latency and read the truth.","goDeeper":"The governing question is always: what does staleness cost? For a like count, essentially nothing — cache it hard. For a balance, or for inventory during checkout, staleness is a real defect (you just oversold an item). Same technique, opposite decision, decided entirely by the cost of being wrong."}
]},
{"id":"state-4","title":"Deciding where state goes","exercises":[
 {"type":"multiple_choice","prompt":"Where should an e-commerce shopping cart live?","choices":["Server RAM — it's the fastest option","It depends on the promise: if users expect their cart on their phone AND laptop, it must be in a database tied to their account","Always in a cookie — it saves database load","In the load balancer"],"answer":1,"why":"The answer flows from the product promise, not from technology. Cart on every device = a database keyed to the account. Nothing else can deliver that guarantee.","goDeeper":"Notice the decisive question wasn't technical at all — it was 'what did we promise?' Where state lives is chosen by the guarantee you need first, and the performance you can afford second. Reversing that order is how teams end up with fast systems that break their own promises."},
 {"type":"build_diagram","prompt":"Uploaded photos are saved on one app server's local disk — so only that server can serve them, and they die with it. Where should they live?","slots":["App Server 1","App Server 2","?"],"palette":["Object storage (S3)","A bigger local disk","A cookie"],"answer":"Object storage (S3)","why":"Files on local disk are state trapped inside one server: peers can't serve them, and the machine can't be safely replaced. Move them to shared object storage and your app servers become disposable again.","goDeeper":"This is one of the most common real-world migrations there is. 'It works on one server' quietly means state is hiding in the filesystem. The day you add a second server, uploads mysteriously 404 half the time — because a load balancer sent the read to the machine that doesn't have the file."},
 {"type":"multi_select","prompt":"Your app servers must be disposable — any one can die at any moment. Which of these violate that? Select all.","choices":["Storing uploaded files on local disk","Keeping user sessions in local memory","Writing logs to stdout to be collected elsewhere","Caching a computed value in local memory that can be recomputed"],"answer":[0,1],"why":"Local files and local sessions die with the server and can't be served by peers — that's lost data and broken users. Logs to stdout are shipped away, and a rebuildable local cache costs only a recompute if lost.","goDeeper":"The test isn't 'is there anything in memory?' — plenty of state in memory is fine. It's 'if this server vanished right now, would anything be LOST or become unavailable?' A local cache fails safe. A local session fails the user."},
 {"type":"multiple_choice","prompt":"To make POST /payments safely retryable, the server stores each idempotency key and its result. What have you just created?","choices":["Nothing — it's just a lookup","New state: the server must now durably remember keys, share them across servers, and eventually expire them","A cache, which needs no thought","A queue"],"answer":1,"why":"Idempotency isn't free — it's implemented WITH state. That key store must be durable (survive a crash mid-payment), shared (any server might receive the retry), and garbage-collected (or it grows forever).","goDeeper":"A lovely illustration of a general truth: 'make it reliable' almost always means 'add state, in exactly the right place.' Nothing is free — you're always moving the difficulty somewhere, and the skill is choosing somewhere that can handle it."},
 {"type":"tradeoff_slider","prompt":"You're rate-limiting a paid API where exceeding the limit costs you real money. Slide toward where the counter should live.","leftLabel":"Local memory per server (fast, approximate)","rightLabel":"Shared store (exact, adds a network hop)","answerRange":[55,100],"why":"With per-server counters and 10 servers, a user can get roughly 10× the intended limit — each server only counts what it personally saw. That's tolerable for crude abuse protection, but unacceptable when the limit is a billing boundary.","goDeeper":"Real systems often do both: a fast local pre-filter that sheds obvious abuse without paying a network hop, plus a shared store for exact accounting. Note what just happened — 'where does this counter live?' turned into a correctness-vs-latency decision. That's this unit's lens, and you'll meet it again in the rate limiting unit."},
 {"type":"multiple_choice","prompt":"Which state placement survives an entire datacenter losing power?","choices":["Redis running in that datacenter","A database on disk in that datacenter","Data replicated to a database in another region","Server RAM"],"answer":2,"why":"Durability has levels. On-disk survives a process crash — not a building losing power. Only replication to another region survives losing the region.","goDeeper":"And each rung costs you. Cross-region replication can mean a write waits for an acknowledgement from far away — that ~150ms from the latency unit, now sitting inside your write path. This is exactly where 'where does state live' collides with physics, and it's the road that leads to CAP."},
 {"type":"multiple_choice","prompt":"A teammate says: 'let's just keep it in memory for now — it's faster.' What single question should decide it?","choices":["Is memory cheap enough?","'If this server died right now, what would we lose — and who else needs to read this?'","How large is the object?","Which library are we using?"],"answer":1,"why":"Those two halves — what's lost, and who must read it — determine every state placement decision in this unit. Local memory is perfect for rebuildable, private data, and catastrophic for durable, shared data. Same sentence, opposite verdicts.","goDeeper":"This is the lens, and it scales further than you'd think. Replication is 'who else needs to read it?' at scale. Sharding is 'it no longer fits in one place.' CAP is 'what happens when the copies can't talk?' Every hard thing ahead of you is this one question, asked louder."}
]}
]};

/* ---- content (from content/06-what-a-database-is.json) ---- */
const UNIT6 = {"unitId":"what-a-database-is","title":"What a Database Is","lessons":[
{"id":"db-1","title":"Why not just use a file?","exercises":[
 {"type":"multiple_choice","prompt":"You store users in users.txt. Two people sign up at the exact same instant and both write to the file. What happens?","choices":["Both are saved correctly — the OS handles it","The writes can interleave or overwrite each other, and one signup is silently lost","The file locks itself automatically","The second write is queued perfectly"],"answer":1,"why":"A plain file has no concurrency control. Two writers can clobber each other, and you lose data with no error at all. Handling concurrent writers safely is one of the main reasons databases exist.","goDeeper":"This is the first thing everyone rediscovers when they 'just use a file.' It works flawlessly with one user and breaks the moment there are two — and the silence is the dangerous part. Nothing crashes, nothing logs. A signup simply never happened."},
 {"type":"multi_select","prompt":"What does a database give you that a plain file does not? Select all.","choices":["Safe concurrent access for many readers and writers","Finding one record without reading the whole file","Surviving a crash in the middle of a write","Storing bytes on a disk"],"answer":[0,1,2],"why":"Storing bytes is the one thing a file already does perfectly well. Everything else — concurrency, querying, crash safety — is what you're actually buying.","goDeeper":"Worth stating plainly: a database is not 'a fancy file.' It's a concurrency system, a query engine, and a crash-recovery system that happens to keep bytes on a disk. Those three problems are why it's the most complex component you'll run."},
 {"type":"multiple_choice","prompt":"Your process is killed halfway through writing a record to a file. What state is the file in?","choices":["Clean — the OS finishes the write for you","Possibly half-written and corrupt, with no record of what was in progress","It automatically rolls back to the previous version","Completely unchanged"],"answer":1,"why":"Nothing protects a partial write. You can be left with half a record and no way to know what was meant to happen — corrupt data that looks like real data.","goDeeper":"A database refuses to leave you there. It uses a log of intended changes so that after a crash it can recover to a clean state — either the change fully happened or it fully didn't. You'll see exactly how in this unit's last lesson."},
 {"type":"multiple_choice","prompt":"users.txt has 10 million lines. You need the user with email x@y.com. What must you do?","choices":["Jump directly to that line","Read lines one by one until you find it — up to 10 million reads","Ask the operating system to find it instantly","Nothing — files are searchable by default"],"answer":1,"why":"A file has no idea what's inside it. Finding anything means scanning everything. A database can jump straight to a record — and that difference is the entire game at scale.","goDeeper":"How it jumps is the subject of the Indexes unit. For now, hold the shape of the problem: 'scan everything' versus 'go straight there' is a difference of a million times, not a few percent."},
 {"type":"fill_blank","prompt":"A ______ is a program built to store data safely and let many users query and change it at once.","choices":["database","filesystem","cache","compiler"],"answer":0,"why":"Storage is the least interesting part of the definition. Safety under concurrency and the ability to query are the point.","goDeeper":null},
 {"type":"multiple_choice","prompt":"So what's the honest one-sentence reason databases exist?","choices":["Disks are hard to write to directly","Because storing data is easy, but querying it, sharing it between many concurrent users, and not losing it in a crash are all hard","They compress data better","They're required by web frameworks"],"answer":1,"why":"Every feature of a database traces back to one of those three hard problems: find it fast, share it safely, never lose it.","goDeeper":"Keep this frame. When you later evaluate any storage technology — SQL, NoSQL, a cache, object storage — you're really asking which of those three it does well, and which it quietly gives up."}
]},
{"id":"db-2","title":"Tables, rows, and keys","exercises":[
 {"type":"multiple_choice","prompt":"You're storing users and their orders. Why put them in two separate tables instead of one big table?","choices":["Two tables are always faster","So each fact lives in exactly one place — a user's email is stored once, not repeated on every order","There's no real reason; it's convention","To use less disk space overall"],"answer":1,"why":"If you repeat a user's email on all 500 of their orders, you now have 500 places to update when it changes — and 500 opportunities for them to disagree with each other.","goDeeper":"This is normalization, and it's the core idea of the relational model: every fact lives in exactly one place. Later you'll learn when to deliberately break this rule (denormalization) to buy speed — but you break it knowingly, accepting the update problem you just re-created."},
 {"type":"match_pairs","prompt":"Match each piece of the relational model to what it is.","pairs":[{"left":"Table","right":"A collection of rows of the same shape"},{"left":"Row","right":"One record — one user"},{"left":"Column","right":"One field — email"},{"left":"Schema","right":"The agreed shape of the data"}],"why":"Tables hold rows, rows have columns, and the schema is the contract describing what shape every row must take.","goDeeper":"Notice 'schema' is the same idea as an API contract from unit 3 — an agreement about shape that many parties depend on. And it has the same property: changing it once people depend on it is the hard part."},
 {"type":"multiple_choice","prompt":"What is a primary key?","choices":["The first column in the table","A value that uniquely identifies one row — no two rows can share it","The password protecting the table","The largest column"],"answer":1,"why":"The primary key is a row's identity. It's the handle you use to find, reference, and link that exact row.","goDeeper":"Which is why using an email as a primary key is a trap: everything else about a row can change, but identity shouldn't. People change emails — and now every table that referenced them must change too. Prefer a meaningless, stable id."},
 {"type":"multiple_choice","prompt":"The orders table has a user_id column pointing at users.id — a foreign key. What does that buy you?","choices":["Nothing beyond documentation","It links the order to its user AND lets the database refuse to create an order for a user who doesn't exist","Faster queries only","Automatic encryption of the column"],"answer":1,"why":"A foreign key is a relationship and a guarantee at once. The database itself refuses to create orphan rows — orders belonging to nobody.","goDeeper":"That's a constraint: a rule the database enforces no matter who writes to it — your API, a migration script, a colleague's one-off query at 2am, an intern with psql. Rules in application code get bypassed by the next writer. Rules in the database cannot be."},
 {"type":"multi_select","prompt":"Why is having a schema useful? Select all.","choices":["The database rejects malformed data before it's ever stored","Anyone reading the table knows exactly what to expect","It lets the database store and read the data efficiently","It makes changing the shape of your data effortless"],"answer":[0,1,2],"why":"A schema buys you enforcement, shared understanding, and efficient storage. What it emphatically does not buy is easy change — altering a schema on a huge live table is genuinely hard.","goDeeper":"And that last point is the real tradeoff, not a footnote. Schema gives you guarantees today and friction tomorrow. That exact tension is the seed of the SQL vs NoSQL argument you'll meet in the very next unit — it's a debate about when structure is worth its cost."},
 {"type":"fill_blank","prompt":"The ______ key uniquely identifies a row; a foreign key points at another table's row.","choices":["primary","secondary","index","search"],"answer":0,"why":"Primary key = this row's identity. Foreign key = a reference to some other row's identity. Together they're how the relational model links data without duplicating it.","goDeeper":null}
]},
{"id":"db-3","title":"How the database finds your data","exercises":[
 {"type":"multiple_choice","prompt":"You run: SELECT * FROM users WHERE email = 'x@y.com' — on 10 million rows, with no index on email. What does the database do?","choices":["Jumps straight to the matching row","Reads all 10 million rows, checking each one — a full table scan","Asks the operating system to find it","Refuses to run the query"],"answer":1,"why":"Without an index, the database does exactly what your text file did: reads everything. Writing SQL doesn't make something fast — it just makes it possible.","goDeeper":"Critical mental model: SQL is a request, not a promise about speed. The same query can take 1ms or 10 seconds depending entirely on whether a suitable index exists. People are shocked by this because the query text looks identical either way."},
 {"type":"multiple_choice","prompt":"Now: SELECT * FROM users WHERE id = 42, where id is the primary key. Fast or slow?","choices":["Slow — same as scanning every row","Fast — the primary key is automatically indexed, so the database jumps straight there","Slow, because it uses the disk","It depends on the table's size, always"],"answer":1,"why":"Primary keys come with an index for free. That's why looking up by id is instant while looking up by an unindexed email is a scan.","goDeeper":"This is why so many systems feel fine in development. Everyone looks things up by id at first, which is always fast. The scans arrive later — with the features that search by email, by name, by status."},
 {"type":"match_pairs","prompt":"Match each concept to what it means.","pairs":[{"left":"Query","right":"A question you ask of the data"},{"left":"Full table scan","right":"Reading every row to find matches"},{"left":"Join","right":"Combining rows from two tables via a link"},{"left":"Query planner","right":"The database's decision about HOW to run your query"}],"why":"You ask a question; the planner decides the strategy; a scan is the brute-force one; a join reassembles data you deliberately split apart.","goDeeper":"Joins are the payoff for normalizing: store each fact once, reassemble views of it on demand. But reassembly isn't free — and joining huge tables is precisely where the relational model starts to hurt at scale. That pain is a major reason NoSQL and denormalization exist."},
 {"type":"multiple_choice","prompt":"Why is SQL called a 'declarative' language?","choices":["Because it's verbose and hard to read","You declare WHAT data you want; the database decides HOW to fetch it","Because you declare variables before using them","It's just a historical name"],"answer":1,"why":"You describe the result you want. The query planner chooses the strategy — which index to use, which table to read first, how to join.","goDeeper":"This is both a superpower and a landmine. Superpower: the planner has statistics about your data and can optimize better than you'd hand-code. Landmine: a small change in the data distribution can make the planner pick a different plan, and your query falls off a performance cliff with zero code changes. 'Nothing changed, but it got slow' is usually this."},
 {"type":"estimate","prompt":"A full scan must check 10 million rows. If the database can check roughly 1 million rows per second, about how many seconds does that one query take?","answer":10,"tolerance":2,"unit":"seconds","why":"10 million ÷ 1 million per second = about 10 seconds — for a single query. Now picture 100 users running it at once.","goDeeper":"This is why 'scan vs indexed lookup' isn't a nice-to-have optimization. It's the difference between a product and an outage: those 100 concurrent scans saturate your database, queue up (remember unit 4), and take down every other query too — including the fast ones."},
 {"type":"multi_select","prompt":"Which of these actually make a query faster? Select all.","choices":["An index on the column you filter by","Fetching only the columns you actually need","Using SELECT * on a huge table","Filtering in the database instead of in your application code"],"answer":[0,1,3],"why":"Index the column you filter on, ask for less data, and let the database do the filtering. SELECT * on a wide table is the opposite — it drags columns you'll never read across the network.","goDeeper":"'Filter in the database, not in the app' deserves special emphasis: pulling a million rows over the network to filter them down to ten in Python is the single most common performance sin in web development. Move the work to the data — the data is heavy and the answer is light."}
]},
{"id":"db-4","title":"What a database actually promises","exercises":[
 {"type":"multiple_choice","prompt":"You INSERT a row and the database returns success. Then the power dies. Is your row there when it comes back up?","choices":["No — it was still in memory","Yes — 'success' means the database durably recorded it before answering","Only if it was small","Only if you waited a few seconds"],"answer":1,"why":"That's the promise, and it's the whole point of the word 'committed': it survives a crash. If commit didn't mean that, it would mean nothing at all.","goDeeper":"The trick is the write-ahead log (WAL). Before touching the real data, the database appends a record of what it's about to do to a sequential log and forces THAT to disk. After a crash it replays the log. That's how you get durability without paying for a slow random disk write on every single change."},
 {"type":"multiple_choice","prompt":"Why is the write-ahead log fast, even though it forces data onto disk before returning?","choices":["It's kept in memory only","It's a sequential append — and appending is dramatically faster than writing randomly across the disk","It's compressed","It isn't fast; it's just a necessary cost"],"answer":1,"why":"The log is append-only. The disk writes one continuous stream instead of hopping around to update scattered data pages — and sequential beats random by a huge margin.","goDeeper":"Sequential vs random access is one of the largest performance facts in all of storage, and databases are engineered around it rather than pretending disk behaves like RAM. Once you notice it, you see it everywhere: log-structured storage, Kafka, SSD write patterns."},
 {"type":"multiple_choice","prompt":"Two requests read a counter (value 10), each adds 1 in application code, and each writes back 11. What just happened?","choices":["The counter is 12 — correct","The counter is 11 — one increment vanished silently","The database throws an error","The counter stays at 10"],"answer":1,"why":"This is a lost update. Both read 10, both computed 11, both wrote 11. One user's increment simply disappeared — with no error anywhere.","goDeeper":"It's the users.txt problem again, wearing a database costume. The fix is to stop doing read-modify-write in your app and let the database do it atomically (UPDATE counters SET n = n + 1), or use a transaction with proper isolation — the subject of the Transactions & ACID unit. The lesson that matters right now: concurrency bugs don't crash, they quietly corrupt."},
 {"type":"multi_select","prompt":"Which of these are guarantees the DATABASE should enforce, rather than your application code? Select all.","choices":["Uniqueness — no two users with the same email","Referential integrity — no order without a real user","Crash-safe durability of committed data","Business rules like 'premium users get 20% off'"],"answer":[0,1,2],"why":"Constraints and durability belong in the database — it enforces them for every writer, forever. Business policy doesn't: it changes with the product and belongs in the app.","goDeeper":"The test: 'would this rule still be true no matter which app, script, or human writes to this table?' If yes, it's a data invariant — put it in the database where it can't be bypassed. If it's policy that marketing might change next quarter, keep it in the application."},
 {"type":"multiple_choice","prompt":"Your signup code checks 'does this email already exist?' and then INSERTs if not. Two signups for the same email race each other. What breaks?","choices":["Nothing — the check handles it","Both checks pass before either insert runs, so you get two users with the same email","The database deadlocks","The second request is automatically rejected"],"answer":1,"why":"Check-then-act is a race, always. Between your check and your insert, the other request slips through — and both believe they're the first.","goDeeper":"The only reliable fix is a UNIQUE constraint in the database, letting one insert fail and handling that error. This is why the database is the last line of defense: it's the single point every writer must pass through. Application checks are advisory; database constraints are law."},
 {"type":"tradeoff_slider","prompt":"You're recording analytics events at enormous volume — billions per day. Slide toward how strictly each write must be durable.","leftLabel":"Every event durably committed (safe, slow)","rightLabel":"Batched / fire-and-forget (fast, may lose a few)","answerRange":[55,100],"why":"Losing a handful of events out of billions changes no decision anyone will ever make. Throughput matters vastly more here than perfect durability — so batch hard and accept a little loss.","goDeeper":"This is unit 5's 'what does it cost to be wrong?' applied to durability. Not all data deserves the same promises: a payment must never vanish; an analytics ping can. Paying for guarantees you don't need is exactly how you build a system that's slow AND expensive."},
 {"type":"multiple_choice","prompt":"Why is the database usually the hardest part of a system to scale?","choices":["It's written in a low-level language","It's the stateful source of truth — app servers are disposable clones, but copies of data must agree with each other","Because it uses a disk","Because the software is old"],"answer":1,"why":"Your app servers are interchangeable and you scale them by adding boxes. The database holds the truth — and the moment you want a second copy of the truth for scale, you inherit replication, consistency, and conflict.","goDeeper":"This is unit 5's lens at its sharpest. You deliberately concentrated your state here, which makes the database simultaneously your most valuable component and your bottleneck. Everything ahead — indexes, replication, sharding, CAP, consistency models — is a consequence of that one decision."}
]}
]};

/* ---- content (from content/07-sql-vs-nosql.json) ---- */
const UNIT7 = {"unitId":"sql-vs-nosql","title":"SQL vs NoSQL","lessons":[
{"id":"nosql-1","title":"What NoSQL actually means","exercises":[
 {"type":"multiple_choice","prompt":"What does 'NoSQL' actually mean?","choices":["Databases with no query language at all","'Not only SQL' — an umbrella for non-relational databases that made different tradeoffs","Databases that are always faster than SQL ones","Databases that have no schema"],"answer":1,"why":"NoSQL isn't an anti-SQL movement. It's a loose family of stores that gave up parts of the relational model to get something else — usually easier horizontal scaling or a more natural data shape.","goDeeper":"The name is genuinely terrible and has fuelled a decade of confused arguments. Plenty of 'NoSQL' databases have rich query languages, and some now literally speak SQL. The useful question is never 'SQL or NoSQL' — it's 'what did this database give up, and what did it buy with it?'"},
 {"type":"multiple_choice","prompt":"Is NoSQL inherently faster than a relational database?","choices":["Yes — it's newer and better engineered","No — it's faster at certain access patterns because it does less: no joins, no cross-node transactions, fewer guarantees","No — it's actually always slower","They're identical in performance"],"answer":1,"why":"Speed here isn't magic, it's subtraction. A key-value store is blisteringly fast at 'give me the value at this key' precisely because that's all it promises to do.","goDeeper":"Generalize this instinct: whenever one system is dramatically faster than another at a similar task, ask what it stopped promising. Performance almost always comes from removing a guarantee, not from writing better code. That question will serve you for your whole career."},
 {"type":"multiple_choice","prompt":"A document database is often called 'schemaless.' So where did the schema go?","choices":["There genuinely isn't one — the data has no shape","Into your application code — every reader must now handle every historical shape of the data","Into the operating system","It's generated automatically at runtime"],"answer":1,"why":"Your data always has a shape. 'Schemaless' only means the database stopped enforcing it — so the enforcement moved into your code, where it's optional and easy to forget.","goDeeper":"The real terms are schema-on-write (SQL: the database rejects malformed data at insert) versus schema-on-read (accept anything; readers cope). Schema-on-read feels liberating in month one and painful in year three, when one collection holds five generations of shape and every reader needs branches for all of them."},
 {"type":"fill_blank","prompt":"SQL enforces the shape of data when you ______; many NoSQL stores leave it to be interpreted when you read.","choices":["write","delete","connect","backup"],"answer":0,"why":"Schema-on-write catches bad data at the door, before it's stored. Schema-on-read lets it in and makes every future reader deal with it.","goDeeper":null},
 {"type":"multi_select","prompt":"Which of these are TRUE of relational databases? Select all.","choices":["They enforce structure and relationships for you","They're built around joining normalized tables","They cannot handle large scale under any circumstances","They give strong transactional guarantees"],"answer":[0,1,3],"why":"Structure, joins, and strong transactions are real. 'Can't handle scale' is the myth — a single well-tuned Postgres routinely serves workloads far beyond what most companies ever reach.","goDeeper":"This myth has cost the industry enormous pain. Teams adopt a distributed NoSQL store at 5,000 users to prepare for a scale they never hit, and pay the cost of losing joins and transactions every single day in between."},
 {"type":"multiple_choice","prompt":"So what's the genuinely useful question when picking a database?","choices":["Is it SQL or NoSQL?","What will I ask of this data, what must never be wrong, and what does this database give up?","Which one is newest?","Which one does my favourite company use?"],"answer":1,"why":"Access patterns and required guarantees decide the answer. The SQL/NoSQL label is a category, not a decision.","goDeeper":"Notice that this question doesn't mention a single product name. If you can't answer it, no amount of benchmarking will save you — you'll just pick fast software that's wrong for your problem."}
]},
{"id":"nosql-2","title":"The four families","exercises":[
 {"type":"match_pairs","prompt":"Match each NoSQL family to the shape it's built for.","pairs":[{"left":"Key-value (Redis, DynamoDB)","right":"Get/put a value by one key"},{"left":"Document (MongoDB)","right":"Self-contained JSON documents"},{"left":"Wide-column (Cassandra)","right":"Huge tables, queried by partition key"},{"left":"Graph (Neo4j)","right":"The relationships ARE the data"}],"why":"'NoSQL' isn't one thing — it's four very different answers to four very different problems. Lumping them together is most of why the debate is so muddled.","goDeeper":"These families have less in common with each other than any of them has with Postgres. A graph database and a key-value store are about as similar as a spreadsheet and a hammer — they only share a name because of a marketing accident."},
 {"type":"multiple_choice","prompt":"You need to store user sessions: looked up only by session id, never queried any other way. Which shape fits?","choices":["Key-value","Graph","Wide-column","Relational with 6 tables"],"answer":0,"why":"One access pattern, one key. A key-value store does exactly this and nothing else — which is why it's so fast at it.","goDeeper":"Don't buy a relational engine to do a hashmap's job. This is the cleanest, least controversial NoSQL win there is: when your access pattern really is 'get the thing at this key,' everything else is overhead."},
 {"type":"build_diagram","prompt":"Sessions are read millions of times a second by one key, and can be rebuilt if lost. Add the right store, keeping Postgres as the source of truth.","slots":["App Servers","?","Postgres (source of truth)"],"palette":["Redis (key-value)","Neo4j (graph)","A second Postgres"],"answer":"Redis (key-value)","why":"Sessions are a single-key, rebuildable, extremely hot access pattern — exactly a key-value store's job. Postgres keeps the durable truth; Redis absorbs the volume.","goDeeper":"Notice you didn't choose SQL OR NoSQL — you used both, each for what it's good at. That's polyglot persistence, and it's what most real systems actually look like. The question was never either/or."},
 {"type":"multiple_choice","prompt":"You're storing a product catalog where every type has wildly different attributes — a book has an author, a shirt has a size, a laptop has RAM. Which fits most naturally?","choices":["Key-value","Document","Graph","One relational table with 200 mostly-null columns"],"answer":1,"why":"Documents are self-contained and can legitimately differ in shape from each other, which is exactly what a heterogeneous catalog is.","goDeeper":"This is the strongest honest case for document stores: varied, self-contained entities you fetch whole. But be clear-eyed about the cost you just accepted — nothing now guarantees that shirts have sizes. That check moved into your code, forever."},
 {"type":"multiple_choice","prompt":"You need 'friends of friends who like X, within 3 hops.' In SQL that's a self-join per hop. What's built for this?","choices":["Key-value","Document","Graph","Wide-column"],"answer":2,"why":"Graph databases store relationships as first-class citizens, so traversals don't explode into ever-deeper joins as you add hops.","goDeeper":"The tell for a graph problem: your queries are about the CONNECTIONS, not the entities. If you find yourself joining a table to itself repeatedly and adding a level each time the product team asks for one more hop, you may have a graph problem wearing a relational costume."},
 {"type":"multiple_choice","prompt":"Cassandra can absorb enormous write volume across many nodes. What's the catch?","choices":["There isn't one — it's strictly better","You must know your query patterns up front: tables are designed around the partition key, and ad-hoc queries are painful or impossible","It can't actually write quickly","It only works on one machine"],"answer":1,"why":"Wide-column stores buy their scale by making you commit to your access patterns in advance. The table is shaped around the query, so a new question can mean a new table.","goDeeper":"This is the trade in its purest form. Cassandra will happily take a million writes a second across a hundred nodes — but the day a product manager asks a question you didn't design for, the answer may genuinely be 'we'd have to rewrite how the data is stored.'"}
]},
{"id":"nosql-3","title":"Model the data vs model the queries","exercises":[
 {"type":"multiple_choice","prompt":"What's the deepest difference between relational and most NoSQL modeling?","choices":["The syntax you type","SQL: model the data correctly, then query it however you like later. NoSQL: model your queries first, then shape the storage to serve them","How fast they read from disk","One uses JSON and one doesn't"],"answer":1,"why":"This is the actual mental shift, and it's the thing people get wrong. Relational lets you decide the questions later; most NoSQL requires you to decide them first.","goDeeper":"In relational, normalize now and you can still answer questions you haven't thought of yet — the join is your escape hatch. In NoSQL you often can't join, so you must know the questions in advance and physically store the answers in the shape you'll read them."},
 {"type":"multiple_choice","prompt":"In DynamoDB you can't join. To show an order together with its customer's name, what do you typically do?","choices":["Run two queries and join in your app","Duplicate the customer's name into the order record itself","Give up and use SQL","Store a pointer and follow it"],"answer":1,"why":"You store the answer, not the ingredients. The order record carries the customer name so one read returns everything the screen needs.","goDeeper":"That's denormalization. It makes reads a single fast lookup — but the name now lives in two places, which is exactly unit 5's copies problem. You've traded a consistency guarantee for read speed, on purpose."},
 {"type":"multiple_choice","prompt":"You denormalized a user's display name into all 10,000 of their posts. They change their name. What now?","choices":["One update — the database handles the rest","You must update 10,000 records, and until you finish, the system displays two different names","Nothing — old posts keep the old name and that's correct","The database refuses the change"],"answer":1,"why":"You moved the work from read-time to write-time. Reads became one fast lookup; that single rename became an enormous, slow, partially-visible operation.","goDeeper":"Here's the fundamental exchange rate of data modeling: normalized = cheap writes, expensive reads (you join). Denormalized = cheap reads, expensive writes plus a consistency risk. Neither side is free. You are only ever choosing which side pays."},
 {"type":"tradeoff_slider","prompt":"A social feed: 99% reads, 1% writes. Slide toward your modeling choice.","leftLabel":"Normalize (join at read time)","rightLabel":"Denormalize (store the answer, pay at write time)","answerRange":[60,100],"why":"With a 99:1 read-to-write ratio, paying at write time is obviously right: do the work once when someone posts, so that millions of reads are single cheap lookups.","goDeeper":"The rule to carry: put the work where the traffic isn't. Read-heavy → precompute and denormalize. Write-heavy → normalize and compute at read time. You'll meet this exact reasoning again, by a different name, in the news feed capstone: fan-out on write vs fan-out on read."},
 {"type":"multi_select","prompt":"What are the real costs of denormalizing? Select all.","choices":["Copies can disagree with each other","Writes get more expensive","Reads get slower","You must know your access patterns in advance"],"answer":[0,1,3],"why":"Reads get FASTER — that's the entire point of doing it. The costs are drifting copies, heavier writes, and committing to your query patterns early.","goDeeper":"Notice that two of those three costs are the same cost wearing different hats: once data lives in many places, both writing it and trusting it get harder. Duplication is never just a storage decision."},
 {"type":"multiple_choice","prompt":"Your NoSQL data model can answer every question your product asks today. What's the risk?","choices":["There's no risk — it works","Tomorrow's question may not fit the shape you committed to, and reshaping stored data is far harder than writing a new query","It will run out of disk","It can't be backed up"],"answer":1,"why":"Modeling for your queries means your storage encodes today's questions. A new question can require reshaping the data itself — not just writing new SQL.","goDeeper":"This is the asymmetry that decides most real arguments: in relational, a new question costs you a query. In query-modeled NoSQL, a new question can cost you a migration. Early products change their questions constantly — which is a strong hint about what to default to."}
]},
{"id":"nosql-4","title":"Choosing, honestly","exercises":[
 {"type":"multiple_choice","prompt":"Why is a relational database genuinely hard to scale across many machines?","choices":["The software is old and poorly written","Joins and ACID transactions across machines require network coordination — which is slow and complex. Many NoSQL stores scale easily precisely because they dropped those","Because it writes to disk","Licensing restrictions"],"answer":1,"why":"This is the honest technical reason, not marketing. A join is cheap when both tables sit on one machine and brutal when the rows live on different servers across a network.","goDeeper":"So 'NoSQL scales better' really means: 'we removed the features that are hard to distribute.' That's a genuine engineering achievement AND a genuine loss. Just be certain you know which half you're buying — people usually notice the achievement and discover the loss later."},
 {"type":"multi_select","prompt":"Which are legitimate reasons to reach for NoSQL? Select all.","choices":["One well-known access pattern at massive scale","Data that's naturally self-contained documents","Relational feels old-fashioned","You need writes distributed across many nodes and don't need cross-node transactions"],"answer":[0,1,3],"why":"Known access patterns at scale, document-shaped data, and distributed writes without cross-node transactions are all real reasons. Fashion is not a reason.","goDeeper":"Note what all three real reasons have in common: they're statements about your workload, not about the technology. Every good database decision is really a description of your problem."},
 {"type":"multiple_choice","prompt":"New product. You don't yet know what queries you'll need, and you have 1,000 users. Sane default?","choices":["Cassandra, to be ready for scale later","A relational database — flexible about questions you haven't thought of, constraints for free, and far more headroom than you need","MongoDB, because JSON is convenient","A graph database, since everything is connected"],"answer":1,"why":"At 1,000 users your bottleneck isn't the database — it's not yet knowing what you're building. Relational lets you change your questions cheaply, which is precisely what early products do constantly.","goDeeper":"'You're not Google' isn't an insult, it's an engineering fact. A single well-tuned Postgres routinely handles tens of thousands of transactions per second and terabytes of data. Most teams who chose NoSQL 'for scale' hit the pain of losing joins years before they'd have hit Postgres's ceiling."},
 {"type":"multiple_choice","prompt":"Which statement is TRUE about the SQL/NoSQL landscape today?","choices":["NoSQL databases never support transactions","The lines have blurred: Postgres stores and indexes JSON, MongoDB added transactions, and NewSQL systems aim for relational semantics with horizontal scale","SQL databases cannot store JSON","The two worlds remain completely separate"],"answer":1,"why":"The clean 2010s dichotomy has largely dissolved. Both sides absorbed the other's best ideas, and NewSQL (Spanner, CockroachDB) explicitly chases both at once.","goDeeper":"Which is why the honest modern answer is rarely 'SQL or NoSQL.' It's: what access patterns, what guarantees, what scale — and can my boring default already handle it? Most real systems end up polyglot anyway: Postgres for truth, Redis for hot reads, S3 for blobs. It's a toolbox, not a religion."},
 {"type":"multiple_choice","prompt":"A team picked NoSQL 'for scale.' A year later they need a report that requires joining across two collections. What happens?","choices":["It's trivial — they just write the query","They must denormalize (taking on the update burden), join in application code (slow, N+1), or migrate — the flexibility they gave up is exactly what they now need","The database adds joins automatically","Nothing changes"],"answer":1,"why":"This is the most common real-world regret in database choice. They optimized for a scale problem they might have, and gave up flexibility for a problem they definitely had.","goDeeper":"Joining in application code is the worst of all worlds: you get unit 3's N+1 problem, over a network, with no query optimizer helping you — and you rebuild, badly, the exact feature you chose to give up."},
 {"type":"tradeoff_slider","prompt":"You're storing financial transactions for a bank. Slide toward your choice.","leftLabel":"Relational (constraints + ACID)","rightLabel":"NoSQL (flexible + horizontal scale)","answerRange":[0,35],"why":"Money needs invariants the database itself enforces and multi-row transactions that genuinely hold. Here correctness dwarfs scale — and being wrong isn't a bug, it's a regulator.","goDeeper":"Contrast with the social feed slider two lessons ago, which went the opposite way. Same question, opposite answers — because the cost of being wrong is completely different. That cost, not the technology, is what's actually choosing."},
 {"type":"multiple_choice","prompt":"What's the honest way to choose a database?","choices":["Pick whatever's trending this year","Start from access patterns and required guarantees; default to relational unless a specific need pushes you off it — and know exactly what you're giving up","Always NoSQL — it's the future","Always SQL — NoSQL is a fad"],"answer":1,"why":"Start from the problem: what will you ask, and what must never be wrong. Then pick the boring default unless something concrete — scale profile, data shape, write distribution — forces you off it, consciously.","goDeeper":"Look back at this whole unit: every answer reduced to the same two questions — what will you ask of the data, and what must never be wrong? Technology names came last, every single time. That ordering is the actual skill; everything else is trivia."}
]}
]};

/* ---- content (from content/08-indexes.json) ---- */
const UNIT8 = {"unitId":"indexes","title":"Indexes","lessons":[
{"id":"idx-1","title":"The book index","exercises":[
 {"type":"multiple_choice","prompt":"A 1,000-page book. You want every page mentioning 'sharding.' You could read all 1,000 pages — or flip to the index at the back. What does that index give you?","choices":["A summary of the book","A sorted list of terms, each with page numbers — so you jump straight there","A faster way to read every page","Nothing you couldn't get by reading"],"answer":1,"why":"That's literally what a database index is: a sorted structure mapping values to locations, so you go straight to what you want instead of reading everything.","goDeeper":"Notice three properties of that book index, because all three matter: it's SEPARATE from the content, it's SORTED (the content isn't), and it's SMALLER than the book. Those are exactly the properties that make a database index work."},
 {"type":"multiple_choice","prompt":"So what IS a database index?","choices":["A faster copy of the whole table","A separate, sorted data structure mapping column values to row locations","A cache of recent query results","A compressed version of the table"],"answer":1,"why":"It's a separate structure holding one (or a few) columns, kept sorted, with pointers to where the full rows live — maintained automatically by the database.","goDeeper":"Redundant and derived should ring a bell from unit 5: an index is rebuildable state. It contains nothing that isn't already in the table. That's precisely why you can DROP an index and rebuild it without losing a single byte of data."},
 {"type":"multiple_choice","prompt":"Finding a value among 1 million unsorted rows takes up to 1 million checks. Using a sorted index structure, roughly how many steps?","choices":["1 million","About 1,000","About 20","Exactly 1"],"answer":2,"why":"Each step halves the remaining search space, so it's log₂(1,000,000) ≈ 20 steps. Twenty, versus a million.","goDeeper":"And it gets better as you grow, which is the genuinely magical part. A BILLION rows is only ~30 steps. Doubling your data adds exactly ONE step. That's why indexed lookups stay fast forever while scans fall off a cliff — they scale completely differently."},
 {"type":"estimate","prompt":"Roughly how many steps does an index need to find one row among 1 billion? (It's log₂ of a billion.)","answer":30,"tolerance":5,"unit":"steps","why":"2³⁰ ≈ 1.07 billion, so about 30 steps. A billion rows, thirty comparisons.","goDeeper":"Sit with the gap: 30 steps versus 1,000,000,000. This is not an optimization — it's a different category of thing. Almost every 'the database got slow' story is really 'we started scanning where we used to jump.'"},
 {"type":"fill_blank","prompt":"Without a useful index, the database performs a full table ______; with one, it jumps straight to the rows.","choices":["scan","backup","commit","join"],"answer":0,"why":"Full table scan = read every row and check it. That's the default when no index can serve your query.","goDeeper":null},
 {"type":"multiple_choice","prompt":"An index is derived data — everything in it also exists in the table. What follows from that?","choices":["You can drop and rebuild an index without losing any data","Dropping an index deletes the underlying rows","The index is the source of truth","Indexes must be backed up separately or data is lost"],"answer":0,"why":"Indexes are pure optimization: rebuildable, droppable, and safe to experiment with. No data lives only in an index.","goDeeper":"Operationally this is liberating — you can tune performance by adding and removing indexes without risking data. It's also exactly why teams add too many of them: they feel free. The next lesson is about the bill."}
]},
{"id":"idx-2","title":"How it actually works","exercises":[
 {"type":"multiple_choice","prompt":"Databases use B-trees for indexes rather than simple binary trees. Why?","choices":["Tradition — binary trees came later","A B-tree node holds hundreds of keys, matching how disks read in big blocks — so one disk read gets you hundreds of keys instead of one","B-trees use less memory","Binary trees can't stay sorted"],"answer":1,"why":"Disks read in pages (say 8KB). A binary tree would cost one disk read per comparison — brutal. A B-tree is wide and shallow: each node is a page holding hundreds of keys, so even a billion rows is only ~3–4 disk reads deep.","goDeeper":"This is a gorgeous example of a data structure shaped by hardware. In RAM, a binary tree is perfectly fine. On disk — where a read costs ~100µs (unit 4's ladder) — you must minimize READS, not comparisons. The B-tree exists because disks read blocks, not bytes."},
 {"type":"multiple_choice","prompt":"You create an index on the `email` column. What does the index actually store?","choices":["A complete copy of every row","The email values, kept sorted, each with a pointer to where the full row lives","Only a list of emails, with no way back to the row","A hash of the entire row"],"answer":1,"why":"Sorted values plus pointers. That's why it's small (one column, not the whole row) and why it can find you the row once it locates the value.","goDeeper":"That pointer matters more than it looks. Finding the value in the index is fast — but then fetching the actual row is a separate, random read. Hold that thought; it explains the planner's behaviour in the next lesson."},
 {"type":"multiple_choice","prompt":"Why can an index on `created_at` efficiently answer 'all rows from last week'?","choices":["It can't — indexes only do exact matches","Because the index is SORTED: once you find the start of the range, the rest sit right next to each other","Because dates are small","It scans, but quickly"],"answer":1,"why":"Sortedness is what gives you ranges. Find the start, then read sequentially — you never search again.","goDeeper":"This is why sorted beats hashed for most database work. A hash index is O(1) for `= value` but completely useless for `> value` or ORDER BY, because hashing deliberately destroys order. B-trees give you equality AND ranges AND sorting from one structure — which is why they're the default everywhere."},
 {"type":"match_pairs","prompt":"Match each approach to what it gives you.","pairs":[{"left":"B-tree index","right":"Sorted: equality, ranges, and ORDER BY"},{"left":"Hash index","right":"Equality only — order is destroyed"},{"left":"Full table scan","right":"Read every row and check it"},{"left":"Index lookup","right":"Jump via a sorted structure"}],"why":"Different structures make different promises. The B-tree's sortedness is what makes it the versatile default.","goDeeper":"Hash indexes aren't useless — for pure key-value equality lookups they're faster and smaller. They're just too narrow to be a default, because real queries want ranges and ordering sooner or later."},
 {"type":"multiple_choice","prompt":"Your query ends with ORDER BY created_at, and there's an index on created_at. What's the bonus?","choices":["Nothing — indexes only help filtering","The index is already in sorted order, so the database can skip the sort step entirely","It makes the sort slower","The rows come back in random order"],"answer":1,"why":"An index doesn't just find rows — it can hand them over already in order, eliminating an expensive sort.","goDeeper":"Sorting a large result set can dominate a query's cost, and if it doesn't fit in memory it spills to disk and collapses. A surprising share of 'nothing changed, but it got slow' incidents are a query that quietly started sorting on disk as the data grew."},
 {"type":"multiple_choice","prompt":"What's the essential property that makes an index fast?","choices":["It's stored in RAM","It's sorted, so the database can eliminate most of the data with each step instead of checking rows one by one","It's compressed","It's written in C"],"answer":1,"why":"Order is the whole trick. Sortedness lets you discard half (or, in a B-tree, the vast majority) of the remaining candidates at every step.","goDeeper":"Which is also the clue to every index's limitation: an index can only help when your query aligns with the order it's stored in. Ask it a question that doesn't match its ordering and it may as well not exist — the theme of lesson 4."}
]},
{"id":"idx-3","title":"Indexes aren't free","exercises":[
 {"type":"multiple_choice","prompt":"You add 5 indexes to a table to make reads fast. What happens to writes?","choices":["Nothing — indexes only affect reads","Every INSERT, UPDATE, and DELETE must now update all 5 indexes too, so writes get slower","Writes get faster too","Only INSERTs are affected"],"answer":1,"why":"An index is a copy that must be kept in sync. Every write to the table pays to maintain every index on it.","goDeeper":"This is the central tradeoff of the unit: indexes buy read speed with write speed and disk. A table with 15 indexes can be several times slower to write than the same table with two. There is no free lookup — you're moving the cost, not removing it."},
 {"type":"multi_select","prompt":"What does each additional index cost you? Select all.","choices":["Slower writes","More disk space","More memory — indexes compete for cache","Slower reads on the indexed column"],"answer":[0,1,2],"why":"Writes, disk, and memory pressure. Reads on that column get FASTER — that's the entire point of paying the other three.","goDeeper":"The memory one is quietly important. Your indexes compete with your data for the database's cache. Enough unnecessary indexes and you evict the hot data you actually needed — so a pile of 'harmless' indexes can slow down reads they have nothing to do with."},
 {"type":"multiple_choice","prompt":"A team adds an index on every column, 'just in case.' Result?","choices":["Every query is now fast","Writes crawl, disk balloons, the planner has more ways to choose wrong — and most of those indexes are never used at all","No measurable effect","The database refuses"],"answer":1,"why":"Unused indexes are pure cost: maintained on every single write, read by nobody. 'Just in case' is a bill you pay forever for a benefit you never collect.","goDeeper":"Real databases track index usage statistics. Finding and dropping dead indexes is a classic, high-value, low-risk cleanup — it's common to find tables where half the indexes have never been used since the day they were created."},
 {"type":"multiple_choice","prompt":"You have an index on `country`. For WHERE country = 'US', where 90% of rows are US, the planner does a full scan anyway. Why?","choices":["It's a bug in the planner","Reading 90% of the table via an index means randomly jumping to nearly every row — streaming the whole table sequentially is genuinely faster","The index is corrupt","Indexes don't work on text columns"],"answer":1,"why":"The index gives you a pointer, then you pay a random read to fetch each row. Doing that for 90% of the table is far slower than just reading the table straight through.","goDeeper":"It's sequential-vs-random again — the same physics behind unit 6's write-ahead log. The planner is right and your intuition is wrong. It also reveals the rule that governs lesson 4: an index only helps when it's SELECTIVE — when it narrows to a small fraction of the table."},
 {"type":"multiple_choice","prompt":"Which is cheaper to use as an indexed primary key: an auto-incrementing id, or a random UUID?","choices":["They're identical","The auto-incrementing id — new values always append at the end of the index, while random UUIDs scatter writes across the whole structure","The random UUID — randomness spreads load evenly","Neither can be indexed"],"answer":1,"why":"Sequential ids append to one hot spot at the end of the index. Random UUIDs land anywhere, forcing the B-tree to split pages all over and destroying cache locality.","goDeeper":"This is a famous, real performance problem — random UUID primary keys can dramatically slow inserts on large tables. It's exactly why UUIDv7 (time-ordered) was standardized: you keep global uniqueness but restore write locality. A great example of a 'neutral' id choice quietly being a storage decision."},
 {"type":"tradeoff_slider","prompt":"A write-heavy audit log: billions of appends, queried only during rare investigations. Slide toward how many indexes you'd add.","leftLabel":"Few or none (fast writes)","rightLabel":"Many (fast reads)","answerRange":[0,35],"why":"Write-heavy and read-rarely means indexes are almost pure cost — you'd pay on every one of billions of writes to speed up a query someone runs twice a year.","goDeeper":"Same rule as the social feed, pointed the other way: put the work where the traffic isn't. Here the traffic is writes, so keep the write path lean and accept that the rare investigation takes a slow scan. That's the correct trade, not a compromise."}
]},
{"id":"idx-4","title":"Designing indexes","exercises":[
 {"type":"multiple_choice","prompt":"You index a boolean `is_active` column where 95% of rows are true. Does it help WHERE is_active = true?","choices":["Yes — indexes always help","Barely — it matches 95% of rows, so it isn't selective, and the planner will likely scan anyway","Yes, because booleans are small","It makes the query fail"],"answer":1,"why":"An index earns its keep by NARROWING. Matching 95% of the table narrows nothing, so you pay the write cost for essentially no read benefit.","goDeeper":"Rule of thumb: index high-cardinality columns (many distinct values — email, user_id). Indexing a boolean is usually cargo cult. But note the subtlety: the SAME column can be worth indexing for the opposite query — WHERE is_active = false matches only 1% of rows, so it's highly selective and an index genuinely helps. Selectivity is a property of the QUERY, not just the column. And if that rare case is all you ever query, reach for a partial index: one defined with its own WHERE clause (CREATE INDEX ... WHERE is_active = false) so it physically contains only those 1% of rows — far smaller, and cheaper to maintain on every write."},
 {"type":"multiple_choice","prompt":"You have a composite index on (last_name, first_name). Which query can use it?","choices":["WHERE first_name = 'Ada'","WHERE last_name = 'Lovelace'","Both work equally well","Neither"],"answer":1,"why":"A composite index sorts by the first column, then the second — exactly like a phone book sorted by last name, then first. You can find all the Lovelaces instantly. You cannot find all the Adas, because they're scattered across every last name.","goDeeper":"This is the leftmost prefix rule, and it's one of the most misunderstood things in databases. An index on (a, b, c) serves queries on a, on (a, b), and on (a, b, c) — but NOT on b alone, c alone, or (b, c). The column ORDER in a composite index is a real design decision, not a formality."},
 {"type":"multi_select","prompt":"Given an index on (a, b, c), which queries can use it? Select all.","choices":["WHERE a = 1","WHERE a = 1 AND b = 2","WHERE b = 2","WHERE a = 1 AND b = 2 AND c = 3"],"answer":[0,1,3],"why":"Leftmost prefix: you must start at `a`. Anything that begins with a can use the index; b on its own can't, because the index isn't sorted by b — it's sorted by b only within each a.","goDeeper":"Practical consequence: one well-ordered composite index on (a, b, c) can replace separate indexes on a and on (a, b) — three queries served, one index maintained. Getting the order right is how you get fast reads without drowning your writes."},
 {"type":"multiple_choice","prompt":"Query: SELECT email FROM users WHERE email = 'x@y.com', with an index on email. How many times must the database touch the actual table?","choices":["Once, to fetch the row","Zero — the index already contains email, so the query is answered entirely from the index","Twice","Once per matching row"],"answer":1,"why":"The index holds email values. The query only wants an email. So the answer is already in the index — the database never fetches the row at all.","goDeeper":"This is a covering index (an index-only scan), and it's a bigger deal than it sounds: you skip the random read to fetch the row, which is often the expensive half. It's why engineers sometimes add a column to an index they never filter on — purely so the index can answer the whole query alone."},
 {"type":"multiple_choice","prompt":"How do you find out whether your query is actually using an index?","choices":["Time it and compare","Run EXPLAIN — the database shows you the plan it chose","Read the database source code","You can't know for sure"],"answer":1,"why":"Don't guess — ask. EXPLAIN shows the plan: whether you got a sequential scan or an index lookup, and what it estimates the cost to be.","goDeeper":"This is arguably the highest-leverage database skill for an average engineer. A huge share of 'the database is slow' turns out to be one missing index, and EXPLAIN finds it in about ten seconds. Learning to read a query plan pays for itself in a week."},
 {"type":"multiple_choice","prompt":"A query filters WHERE user_id = 42 AND status = 'open', then sorts ORDER BY created_at. Which single composite index best serves it?","choices":["(created_at)","(user_id, status, created_at)","(status)","(created_at, user_id, status)"],"answer":1,"why":"Equality columns first (user_id, status) to narrow hard, then the sort column (created_at). The index jumps to user 42's open rows, and they're already in created_at order — so the sort step disappears too.","goDeeper":"The general recipe: equality columns first, then your range/sort column. Get the order right and one index does the filtering AND the sorting. Get it backwards — (created_at, user_id, status) — and it's nearly useless here, because you'd have to scan every date to find user 42. Same columns, opposite outcome."},
 {"type":"multiple_choice","prompt":"What's the honest one-sentence summary of indexing?","choices":["Index every column so every query is fast","An index is a derived, sorted copy that trades write speed and disk for read speed — so index deliberately: for real queries, on selective columns, in the right order, and verify with EXPLAIN","Avoid indexes; they slow down writes","Let the database figure it out automatically"],"answer":1,"why":"Both extremes are wrong. Indexes are a deliberate purchase: you're spending write throughput and disk to buy read latency, and it's only a good deal when the index actually serves a query you really run.","goDeeper":"Step back and notice this is unit 5's lesson wearing new clothes: an index is a derived copy that buys speed and costs consistency work. The only difference is the database does the syncing for you — and bills you on every write. Same bargain, all the way down."}
]}
]};

/* ---- content (from content/09-transactions-and-acid.json) ---- */
const UNIT9 = {"unitId":"transactions-and-acid","title":"Transactions & ACID","lessons":[
{"id":"txn-1","title":"All or nothing","exercises":[
 {"type":"multiple_choice","prompt":"Transfer $100: subtract from account A, then add to account B. The server crashes between the two steps. What happened?","choices":["Nothing — the crash undid both","$100 vanished — it left A and never arrived at B","The money doubled","The database retries automatically"],"answer":1,"why":"Two writes that must both happen or neither. Crash in the middle and you've destroyed money — with no error, and no way for either account to know.","goDeeper":"This is the canonical example for a reason: it's the clearest case where 'half done' is strictly worse than 'not done at all.' A failed transfer is an inconvenience. A half transfer is a corrupted ledger, and nobody can tell by looking at it."},
 {"type":"fill_blank","prompt":"A ______ groups multiple operations so they all succeed together or all fail together.","choices":["transaction","migration","query","connection"],"answer":0,"why":"A transaction turns many operations into one indivisible unit — the database's answer to 'half done.'","goDeeper":null},
 {"type":"multiple_choice","prompt":"What does COMMIT actually mean?","choices":["Save the data to memory","Make every change in the transaction permanent — all of them, together","Close the connection","Write to a log file for later"],"answer":1,"why":"COMMIT is the moment your work becomes permanent, all at once. ROLLBACK is the opposite: discard everything since BEGIN, as though it never happened.","goDeeper":"The load-bearing word is 'together': at COMMIT every change lands as one unit, so there's no instant where half your writes are permanent and half aren't. That's atomicity, and notice it's a claim about what SURVIVES. It says nothing at all about who can SEE your work — that's a different property called isolation, and it's lesson 3."},
 {"type":"multiple_choice","prompt":"You're 5 of 10 writes into a transaction when it hits an error and rolls back. What happens to those 5 writes?","choices":["They stay — they already succeeded","All 5 are undone: the database rewinds to the state at BEGIN","Only the most recent one is undone","The database pauses and asks you what to do"],"answer":1,"why":"That's atomicity: the transaction is indivisible, so a failure anywhere undoes everything since BEGIN. You can never be left with a half-finished transfer sitting in the data.","goDeeper":"Be careful with a related-but-different question: could OTHER transactions have seen those 5 writes before you committed? That is NOT atomicity — that's isolation, and the answer depends on the isolation level you're running. At Read Uncommitted they genuinely could (a 'dirty read'). Atomicity governs what survives failure; isolation governs what others can see. Lesson 3 is entirely about that second question."},
 {"type":"order_steps","prompt":"Order the life of a transaction.","steps":["BEGIN","Debit account A","Credit account B","COMMIT","All the changes become permanent together"],"why":"Open it, do the work, commit — and only at COMMIT do all the changes become permanent, as one unit. Anything before that point can still be undone.","goDeeper":"If anything fails between BEGIN and COMMIT — an error, a crash, a ROLLBACK — the database rewinds to the state at BEGIN. That rewind is exactly what the write-ahead log from unit 6 makes possible."},
 {"type":"multiple_choice","prompt":"Why is a transaction the right tool for a bank transfer, but overkill for logging one analytics event?","choices":["Transactions only work on money","A transfer has an invariant spanning two rows that must never break; a lone analytics insert has nothing to be atomic with","Analytics data is too large","Transactions are always the right tool"],"answer":1,"why":"Atomicity matters when several changes must hold together. A single independent insert is already all-or-nothing by itself — wrapping it in a transaction buys you nothing.","goDeeper":"Good instinct to build: reach for a transaction when there's an invariant across multiple writes. The question is never 'is this important data?' — it's 'is there a rule that would break if only some of this landed?'"}
]},
{"id":"txn-2","title":"ACID, honestly","exercises":[
 {"type":"match_pairs","prompt":"Match each letter of ACID to what it promises.","pairs":[{"left":"Atomicity","right":"All or nothing"},{"left":"Consistency","right":"Your declared rules are never violated"},{"left":"Isolation","right":"Concurrent transactions don't corrupt each other"},{"left":"Durability","right":"Committed means it survives a crash"}],"why":"Four promises: indivisible, rule-abiding, non-interfering, and permanent.","goDeeper":"They're not equally interesting, which the acronym hides. Two of them are essentially on/off, one is barely the database's doing, and one is a dial you're probably turning without realising. The rest of this lesson sorts out which is which."},
 {"type":"multiple_choice","prompt":"Durability: you commit, and a microsecond later the power dies. Your data?","choices":["Lost — it was still in memory","There — commit meant it was durably recorded before the database answered you","Partially there","Recovered only if you had a backup"],"answer":1,"why":"That's the D, and it's the promise you met in unit 6: the write-ahead log is forced to disk before COMMIT returns.","goDeeper":"Which is why COMMIT isn't instant — it's waiting on physics. Every 'why are my writes slow?' question eventually arrives at this: you asked for a guarantee that requires the disk to confirm."},
 {"type":"multiple_choice","prompt":"Which letter of ACID is really about YOUR rules rather than the database's own machinery?","choices":["Atomicity","Consistency — it just means the constraints you declared (unique, foreign keys, checks) hold before and after","Isolation","Durability"],"answer":1,"why":"A, I, and D are properties the engine provides. C only says: the database won't let you violate the constraints you defined. If you declared no constraints, C promises approximately nothing.","goDeeper":"Plenty of practitioners argue the C is a bit of a cheat — it's really 'the database enforces your declared invariants,' which is just... constraints. The genuinely hard letters are A, I, and D. And watch out: the C in CAP means something completely different, a collision of names that has confused engineers for twenty years."},
 {"type":"multiple_choice","prompt":"Which ACID property do you actually have to make decisions about?","choices":["Atomicity — you configure how atomic it is","Isolation — it's a dial with several settings, each trading correctness for speed","Durability — you pick how durable","Consistency — you tune it per query"],"answer":1,"why":"Atomicity and durability are essentially on or off — you get them. Isolation is a spectrum you configure, and the setting decides which concurrency bugs remain possible.","goDeeper":"Here's the uncomfortable part: most engineers cannot tell you what isolation level their production database runs at. They're relying on guarantees they've never looked up — and the defaults are not the strongest ones. That's the next lesson."},
 {"type":"multi_select","prompt":"Which of these statements are TRUE? Select all.","choices":["Atomicity is about all-or-nothing","Durability is about surviving crashes","Isolation is a single fixed guarantee every database provides identically","The C in ACID means something different from the C in CAP"],"answer":[0,1,3],"why":"Isolation is the odd one — it's configurable, and databases differ in both their defaults and what their level names actually mean.","goDeeper":"That last point is a genuine trap: two databases can both say 'Repeatable Read' and give you materially different guarantees. The label is not the specification."},
 {"type":"multiple_choice","prompt":"A colleague says 'we use Postgres, so we're ACID — concurrency bugs are impossible.' What's wrong?","choices":["Nothing — that's correct","ACID doesn't mean 'maximum isolation.' The default level still permits real anomalies; you have to opt into stronger guarantees","Postgres isn't ACID","ACID only applies to reads"],"answer":1,"why":"'ACID compliant' is not a force field. The I in ACID is whatever level you're running — and the default is not serializable.","goDeeper":"This misconception causes real bugs. Teams assume the database is protecting an invariant it was never asked to protect, then find corrupted data months later with no error in any log. Concurrency bugs don't crash — they quietly lie."}
]},
{"id":"txn-3","title":"Isolation is a dial","exercises":[
 {"type":"multiple_choice","prompt":"Why don't databases just always use the strictest isolation?","choices":["They do","Stricter isolation costs performance — more locking or coordination and more aborted transactions — so you get to choose","Strict isolation is less correct","It's a licensing restriction"],"answer":1,"why":"Isolation is bought with throughput. The stricter you go, the more the database must coordinate or abort, so it lets you pick your point on the curve.","goDeeper":"And the defaults are NOT the strictest. Postgres defaults to Read Committed; MySQL's InnoDB defaults to Repeatable Read. Neither is serializable. So unless you changed it deliberately, you are running with known anomalies permitted — right now, in production."},
