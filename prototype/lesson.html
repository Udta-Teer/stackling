 {"type":"multiple_choice","prompt":"You store the shopping cart's total price in a cookie on the client. What's the danger?","choices":["Cookies are too slow","The client controls it and can edit it — so a user could set their total to $0","Cookies expire too quickly","There's no danger; it saves a database call"],"answer":1,"why":"Anything living on the client is under the user's control. They can open dev tools and change it. Client state is never trustworthy for anything involving money, permissions, or security.","goDeeper":"The rule: client-held state is a convenience or a cache — never the source of truth for anything that matters. If you must put something sensitive there, sign it so tampering is detectable. That's precisely what a JWT's signature is for: the client carries the data, but can't forge it."},
 {"type":"multi_select","prompt":"Which are good reasons to put state in a shared cache like Redis instead of the database? Select all.","choices":["It's far faster — memory instead of disk","It takes read load off the database","It's the safest place for the only copy of critical data","It's shared, so every app server sees the same value"],"answer":[0,1,3],"why":"Redis is fast and shared — excellent reasons. But it's typically volatile, so it is emphatically not the place for the only copy of data you can't afford to lose.","goDeeper":"Caches should hold derived state — rebuildable from the source of truth. The moment data exists ONLY in your cache, you've turned your cache into a database, without any of a database's durability guarantees. Teams discover this during the first unplanned Redis restart."},
 {"type":"multiple_choice","prompt":"A message sitting in a queue waiting to be processed — is that state?","choices":["No, it's just a message in transit","Yes — it's in-flight state the system must not lose","Only if the message is large","Only if it's been there over a minute"],"answer":1,"why":"Work-in-progress is state. If the queue loses that message, the work simply vanishes — an order never ships, an email never sends, and nothing errors.","goDeeper":"This is exactly why real queues (Kafka, SQS) persist messages to disk and wait for an explicit acknowledgement before deleting them. 'At-least-once delivery' exists because in-flight state is state — and it's why consumers must be idempotent, the property you met in Unit 2. The pieces connect."},
 {"type":"multiple_choice","prompt":"What's the first question to ask about any new piece of state?","choices":["What programming language will read it?","If we lost it, what breaks — and who else needs to read it?","How many bytes is it?","Is it JSON or binary?"],"answer":1,"why":"Those two questions — what's lost, and who must read it — decide durability and sharing, and those two decide the place. Everything else is detail.","goDeeper":"Run it on examples. A rebuildable computed value nobody else needs? Local memory is perfect. A payment record? Durable, replicated, shared. Same question, opposite answers — and you got there without a single technology name."}
]},
{"id":"state-3","title":"Copies and the truth","exercises":[
 {"type":"multiple_choice","prompt":"The moment you cache a value so it exists in two places, what problem have you created?","choices":["None — you just made it faster","The two copies can disagree — you now own a consistency problem","Only extra storage cost","Only extra latency"],"answer":1,"why":"One copy can't disagree with itself. Two copies can drift apart, and now you must decide what happens when they do — and who wins.","goDeeper":"Generalize it: every performance optimization built on copies — caches, read replicas, CDNs, denormalization — buys speed with consistency. There is no copy without a consistency question attached to it. When someone proposes a cache, they're proposing a consistency policy, whether they've noticed or not."},
 {"type":"fill_blank","prompt":"The one authoritative copy of a piece of data is called the source of ______.","choices":["truth","record","data","origin"],"answer":0,"why":"The source of truth is the copy that wins any argument. If two places disagree, it's right by definition — everything else is derived from it.","goDeeper":null},
 {"type":"match_pairs","prompt":"Match each kind of copy to what it is.","pairs":[{"left":"Source of truth","right":"The authoritative copy — if in doubt, ask it"},{"left":"Cache","right":"A fast copy that may be stale"},{"left":"Replica","right":"A copy kept in sync, for reads or failover"},{"left":"Stale","right":"A copy that no longer matches the truth"}],"why":"Each copy has a job and a failure mode. Being explicit about which is which is what keeps a design honest.","goDeeper":"In a design discussion, the sharpest question you can ask is: 'which of these is the source of truth?' Surprisingly often, nobody knows — and that ambiguity is where the worst bugs live."},
 {"type":"multiple_choice","prompt":"There's a famous joke: 'There are only two hard things in Computer Science: cache invalidation and naming things.' Why is cache invalidation genuinely hard?","choices":["Deleting keys is computationally expensive","Knowing WHEN a cached copy became wrong requires knowing every possible thing that could have changed it","Caches don't support deletion","It isn't hard — it's just a joke"],"answer":1,"why":"The cache has no idea the truth changed. Someone has to tell it, or it has to guess. Both are imperfect, and the knowledge of 'what invalidates this?' is scattered across every write path in your system.","goDeeper":"The two strategies: TTL (expire after N seconds — dead simple, but you knowingly serve stale data for up to N seconds) or explicit invalidation (delete the key when the data changes — precise, but you must find every write path forever, including the one a teammate adds next year without knowing your cache exists). Most real systems use both, because both are inadequate alone."},
 {"type":"multiple_choice","prompt":"Your entire cache is accidentally wiped. Is that an outage?","choices":["Always a catastrophe — the data is gone","It depends: if it held derived state, it rebuilds from the source of truth — painful but recoverable. If it held the only copy, the data is gone","Never a problem — caches don't matter","Only if it was more than 1GB"],"answer":1,"why":"The question for any copy is: can I rebuild this? Derived state can be recomputed from the truth. If the cache was the only home, there's nothing to rebuild from.","goDeeper":"Be religious about this distinction. A wiped cache of derived state = a bad afternoon (every request stampedes the database at once until it refills — the 'thundering herd'). A wiped source of truth = a company-ending event. You should always know, without thinking, which one each store is."},
 {"type":"tradeoff_slider","prompt":"You're displaying a user's account balance in a banking app. Slide toward how aggressively you'd cache it.","leftLabel":"Read the source of truth (correct, slower)","rightLabel":"Cache aggressively (fast, may be stale)","answerRange":[0,35],"why":"Showing someone the wrong balance is unacceptable — it's the one number they came to see, and being stale here looks like a bug or a theft. Pay the latency and read the truth.","goDeeper":"The governing question is always: what does staleness cost? For a like count, essentially nothing — cache it hard. For a balance, or for inventory during checkout, staleness is a real defect (you just oversold an item). Same technique, opposite decision, decided entirely by the cost of being wrong."}
]},
{"id":"state-4","title":"Deciding where state goes","exercises":[
 {"type":"multiple_choice","prompt":"Where should an e-commerce shopping cart live?","choices":["Server RAM — it's the fastest option","It depends on the promise: if users expect their cart on their phone AND laptop, it must be in a database tied to their account","Always in a cookie — it saves database load","In the load balancer"],"answer":1,"why":"The answer flows from the product promise, not from technology. Cart on every device = a database keyed to the account. Nothing else can deliver that guarantee.","goDeeper":"Notice the decisive question wasn't technical at all — it was 'what did we promise?' Where state lives is chosen by the guarantee you need first, and the performance you can afford second. Reversing that order is how teams end up with fast systems that break their own promises."},
 {"type":"build_diagram","prompt":"Uploaded photos are saved on one app server's local disk — so only that server can serve them, and they die with it. Where should they live?","slots":["App Server 1","App Server 2","?"],"palette":["Object storage (S3)","A bigger local disk","A cookie"],"answer":"Object storage (S3)","why":"Files on local disk are state trapped inside one server: peers can't serve them, and the machine can't be safely replaced. Move them to shared object storage and your app servers become disposable again.","goDeeper":"This is one of the most common real-world migrations there is. 'It works on one server' quietly means state is hiding in the filesystem. The day you add a second server, uploads mysteriously 404 half the time — because a load balancer sent the read to the machine that doesn't have the file."},
 {"type":"multi_select","prompt":"Your app servers must be disposable — any one can die at any moment. Which of these violate that? Select all.","choices":["Storing uploaded files on local disk","Keeping user sessions in local memory","Writing logs to stdout to be collected elsewhere","Caching a computed value in local memory that can be recomputed"],"answer":[0,1],"why":"Local files and local sessions die with the server and can't be served by peers — that's lost data and broken users. Logs to stdout are shipped away, and a rebuildable local cache costs only a recompute if lost.","goDeeper":"The test isn't 'is there anything in memory?' — plenty of state in memory is fine. It's 'if this server vanished right now, would anything be LOST or become unavailable?' A local cache fails safe. A local session fails the user."},
 {"type":"multiple_choice","prompt":"To make POST /payments safely retryable, the server stores each idempotency key and its result. What have you just created?","choices":["Nothing — it's just a lookup","New state: the server must now durably remember keys, share them across servers, and eventually expire them","A cache, which needs no thought","A queue"],"answer":1,"why":"Idempotency isn't free — it's implemented WITH state. That key store must be durable (survive a crash mid-payment), shared (any server might receive the retry), and garbage-collected (or it grows forever).","goDeeper":"A lovely illustration of a general truth: 'make it reliable' almost always means 'add state, in exactly the right place.' Nothing is free — you're always moving the difficulty somewhere, and the skill is choosing somewhere that can handle it."},
 {"type":"tradeoff_slider","prompt":"You're rate-limiting a paid API where exceeding the limit costs you real money. Slide toward where the counter should live.","leftLabel":"Local memory per server (fast, approximate)","rightLabel":"Shared store (exact, adds a network hop)","answerRange":[55,100],"why":"With per-server counters and 10 servers, a user can get roughly 10× the intended limit — each server only counts what it personally saw. That's tolerable for crude abuse protection, but unacceptable when the limit is a billing boundary.","goDeeper":"Real systems often do both: a fast local pre-filter that sheds obvious abuse without paying a network hop, plus a shared store for exact accounting. Note what just happened — 'where does this counter live?' turned into a correctness-vs-latency decision. That's this unit's lens, and you'll meet it again in the rate limiting unit."},
 {"type":"multiple_choice","prompt":"Which state placement survives an entire datacenter losing power?","choices":["Redis running in that datacenter","A database on disk in that datacenter","Data replicated to a database in another region","Server RAM"],"answer":2,"why":"Durability has levels. On-disk survives a process crash — not a building losing power. Only replication to another region survives losing the region.","goDeeper":"And each rung costs you. Cross-region replication can mean a write waits for an acknowledgement from far away — that ~150ms from the latency unit, now sitting inside your write path. This is exactly where 'where does state live' collides with physics, and it's the road that leads to CAP."},
 {"type":"multiple_choice","prompt":"A teammate says: 'let's just keep it in memory for now — it's faster.' What single question should decide it?","choices":["Is memory cheap enough?","'If this server died right now, what would we lose — and who else needs to read this?'","How large is the object?","Which library are we using?"],"answer":1,"why":"Those two halves — what's lost, and who must read it — determine every state placement decision in this unit. Local memory is perfect for rebuildable, private data, and catastrophic for durable, shared data. Same sentence, opposite verdicts.","goDeeper":"This is the lens, and it scales further than you'd think. Replication is 'who else needs to read it?' at scale. Sharding is 'it no longer fits in one place.' CAP is 'what happens when the copies can't talk?' Every hard thing ahead of you is this one question, asked louder."}
]}
]};

/* ---- content (from content/06-what-a-database-is.json) ---- */
const UNIT6 = {"unitId":"what-a-database-is","title":"What a Database Is","lessons":[
{"id":"db-1","title":"Why not just use a file?","exercises":[
 {"type":"multiple_choice","prompt":"You store users in users.txt. Two people sign up at the exact same instant and both write to the file. What happens?","choices":["Both are saved correctly — the OS handles it","The writes can interleave or overwrite each other, and one signup is silently lost","The file locks itself automatically","The second write is queued perfectly"],"answer":1,"why":"A plain file has no concurrency control. Two writers can clobber each other, and you lose data with no error at all. Handling concurrent writers safely is one of the main reasons databases exist.","goDeeper":"This is the first thing everyone rediscovers when they 'just use a file.' It works flawlessly with one user and breaks the moment there are two — and the silence is the dangerous part. Nothing crashes, nothing logs. A signup simply never happened."},
 {"type":"multi_select","prompt":"What does a database give you that a plain file does not? Select all.","choices":["Safe concurrent access for many readers and writers","Finding one record without reading the whole file","Surviving a crash in the middle of a write","Storing bytes on a disk"],"answer":[0,1,2],"why":"Storing bytes is the one thing a file already does perfectly well. Everything else — concurrency, querying, crash safety — is what you're actually buying.","goDeeper":"Worth stating plainly: a database is not 'a fancy file.' It's a concurrency system, a query engine, and a crash-recovery system that happens to keep bytes on a disk. Those three problems are why it's the most complex component you'll run."},
 {"type":"multiple_choice","prompt":"Your process is killed halfway through writing a record to a file. What state is the file in?","choices":["Clean — the OS finishes the write for you","Possibly half-written and corrupt, with no record of what was in progress","It automatically rolls back to the previous version","Completely unchanged"],"answer":1,"why":"Nothing protects a partial write. You can be left with half a record and no way to know what was meant to happen — corrupt data that looks like real data.","goDeeper":"A database refuses to leave you there. It uses a log of intended changes so that after a crash it can recover to a clean state — either the change fully happened or it fully didn't. You'll see exactly how in this unit's last lesson."},
 {"type":"multiple_choice","prompt":"users.txt has 10 million lines. You need the user with email x@y.com. What must you do?","choices":["Jump directly to that line","Read lines one by one until you find it — up to 10 million reads","Ask the operating system to find it instantly","Nothing — files are searchable by default"],"answer":1,"why":"A file has no idea what's inside it. Finding anything means scanning everything. A database can jump straight to a record — and that difference is the entire game at scale.","goDeeper":"How it jumps is the subject of the Indexes unit. For now, hold the shape of the problem: 'scan everything' versus 'go straight there' is a difference of a million times, not a few percent."},
 {"type":"fill_blank","prompt":"A ______ is a program built to store data safely and let many users query and change it at once.","choices":["database","filesystem","cache","compiler"],"answer":0,"why":"Storage is the least interesting part of the definition. Safety under concurrency and the ability to query are the point.","goDeeper":null},
 {"type":"multiple_choice","prompt":"So what's the honest one-sentence reason databases exist?","choices":["Disks are hard to write to directly","Because storing data is easy, but querying it, sharing it between many concurrent users, and not losing it in a crash are all hard","They compress data better","They're required by web frameworks"],"answer":1,"why":"Every feature of a database traces back to one of those three hard problems: find it fast, share it safely, never lose it.","goDeeper":"Keep this frame. When you later evaluate any storage technology — SQL, NoSQL, a cache, object storage — you're really asking which of those three it does well, and which it quietly gives up."}
]},
{"id":"db-2","title":"Tables, rows, and keys","exercises":[
 {"type":"multiple_choice","prompt":"You're storing users and their orders. Why put them in two separate tables instead of one big table?","choices":["Two tables are always faster","So each fact lives in exactly one place — a user's email is stored once, not repeated on every order","There's no real reason; it's convention","To use less disk space overall"],"answer":1,"why":"If you repeat a user's email on all 500 of their orders, you now have 500 places to update when it changes — and 500 opportunities for them to disagree with each other.","goDeeper":"This is normalization, and it's the core idea of the relational model: every fact lives in exactly one place. Later you'll learn when to deliberately break this rule (denormalization) to buy speed — but you break it knowingly, accepting the update problem you just re-created."},
 {"type":"match_pairs","prompt":"Match each piece of the relational model to what it is.","pairs":[{"left":"Table","right":"A collection of rows of the same shape"},{"left":"Row","right":"One record — one user"},{"left":"Column","right":"One field — email"},{"left":"Schema","right":"The agreed shape of the data"}],"why":"Tables hold rows, rows have columns, and the schema is the contract describing what shape every row must take.","goDeeper":"Notice 'schema' is the same idea as an API contract from unit 3 — an agreement about shape that many parties depend on. And it has the same property: changing it once people depend on it is the hard part."},
 {"type":"multiple_choice","prompt":"What is a primary key?","choices":["The first column in the table","A value that uniquely identifies one row — no two rows can share it","The password protecting the table","The largest column"],"answer":1,"why":"The primary key is a row's identity. It's the handle you use to find, reference, and link that exact row.","goDeeper":"Which is why using an email as a primary key is a trap: everything else about a row can change, but identity shouldn't. People change emails — and now every table that referenced them must change too. Prefer a meaningless, stable id."},
 {"type":"multiple_choice","prompt":"The orders table has a user_id column pointing at users.id — a foreign key. What does that buy you?","choices":["Nothing beyond documentation","It links the order to its user AND lets the database refuse to create an order for a user who doesn't exist","Faster queries only","Automatic encryption of the column"],"answer":1,"why":"A foreign key is a relationship and a guarantee at once. The database itself refuses to create orphan rows — orders belonging to nobody.","goDeeper":"That's a constraint: a rule the database enforces no matter who writes to it — your API, a migration script, a colleague's one-off query at 2am, an intern with psql. Rules in application code get bypassed by the next writer. Rules in the database cannot be."},
 {"type":"multi_select","prompt":"Why is having a schema useful? Select all.","choices":["The database rejects malformed data before it's ever stored","Anyone reading the table knows exactly what to expect","It lets the database store and read the data efficiently","It makes changing the shape of your data effortless"],"answer":[0,1,2],"why":"A schema buys you enforcement, shared understanding, and efficient storage. What it emphatically does not buy is easy change — altering a schema on a huge live table is genuinely hard.","goDeeper":"And that last point is the real tradeoff, not a footnote. Schema gives you guarantees today and friction tomorrow. That exact tension is the seed of the SQL vs NoSQL argument you'll meet in the very next unit — it's a debate about when structure is worth its cost."},
 {"type":"fill_blank","prompt":"The ______ key uniquely identifies a row; a foreign key points at another table's row.","choices":["primary","secondary","index","search"],"answer":0,"why":"Primary key = this row's identity. Foreign key = a reference to some other row's identity. Together they're how the relational model links data without duplicating it.","goDeeper":null}
]},
{"id":"db-3","title":"How the database finds your data","exercises":[
 {"type":"multiple_choice","prompt":"You run: SELECT * FROM users WHERE email = 'x@y.com' — on 10 million rows, with no index on email. What does the database do?","choices":["Jumps straight to the matching row","Reads all 10 million rows, checking each one — a full table scan","Asks the operating system to find it","Refuses to run the query"],"answer":1,"why":"Without an index, the database does exactly what your text file did: reads everything. Writing SQL doesn't make something fast — it just makes it possible.","goDeeper":"Critical mental model: SQL is a request, not a promise about speed. The same query can take 1ms or 10 seconds depending entirely on whether a suitable index exists. People are shocked by this because the query text looks identical either way."},
 {"type":"multiple_choice","prompt":"Now: SELECT * FROM users WHERE id = 42, where id is the primary key. Fast or slow?","choices":["Slow — same as scanning every row","Fast — the primary key is automatically indexed, so the database jumps straight there","Slow, because it uses the disk","It depends on the table's size, always"],"answer":1,"why":"Primary keys come with an index for free. That's why looking up by id is instant while looking up by an unindexed email is a scan.","goDeeper":"This is why so many systems feel fine in development. Everyone looks things up by id at first, which is always fast. The scans arrive later — with the features that search by email, by name, by status."},
 {"type":"match_pairs","prompt":"Match each concept to what it means.","pairs":[{"left":"Query","right":"A question you ask of the data"},{"left":"Full table scan","right":"Reading every row to find matches"},{"left":"Join","right":"Combining rows from two tables via a link"},{"left":"Query planner","right":"The database's decision about HOW to run your query"}],"why":"You ask a question; the planner decides the strategy; a scan is the brute-force one; a join reassembles data you deliberately split apart.","goDeeper":"Joins are the payoff for normalizing: store each fact once, reassemble views of it on demand. But reassembly isn't free — and joining huge tables is precisely where the relational model starts to hurt at scale. That pain is a major reason NoSQL and denormalization exist."},
 {"type":"multiple_choice","prompt":"Why is SQL called a 'declarative' language?","choices":["Because it's verbose and hard to read","You declare WHAT data you want; the database decides HOW to fetch it","Because you declare variables before using them","It's just a historical name"],"answer":1,"why":"You describe the result you want. The query planner chooses the strategy — which index to use, which table to read first, how to join.","goDeeper":"This is both a superpower and a landmine. Superpower: the planner has statistics about your data and can optimize better than you'd hand-code. Landmine: a small change in the data distribution can make the planner pick a different plan, and your query falls off a performance cliff with zero code changes. 'Nothing changed, but it got slow' is usually this."},
 {"type":"estimate","prompt":"A full scan must check 10 million rows. If the database can check roughly 1 million rows per second, about how many seconds does that one query take?","answer":10,"tolerance":2,"unit":"seconds","why":"10 million ÷ 1 million per second = about 10 seconds — for a single query. Now picture 100 users running it at once.","goDeeper":"This is why 'scan vs indexed lookup' isn't a nice-to-have optimization. It's the difference between a product and an outage: those 100 concurrent scans saturate your database, queue up (remember unit 4), and take down every other query too — including the fast ones."},
 {"type":"multi_select","prompt":"Which of these actually make a query faster? Select all.","choices":["An index on the column you filter by","Fetching only the columns you actually need","Using SELECT * on a huge table","Filtering in the database instead of in your application code"],"answer":[0,1,3],"why":"Index the column you filter on, ask for less data, and let the database do the filtering. SELECT * on a wide table is the opposite — it drags columns you'll never read across the network.","goDeeper":"'Filter in the database, not in the app' deserves special emphasis: pulling a million rows over the network to filter them down to ten in Python is the single most common performance sin in web development. Move the work to the data — the data is heavy and the answer is light."}
]},
{"id":"db-4","title":"What a database actually promises","exercises":[
 {"type":"multiple_choice","prompt":"You INSERT a row and the database returns success. Then the power dies. Is your row there when it comes back up?","choices":["No — it was still in memory","Yes — 'success' means the database durably recorded it before answering","Only if it was small","Only if you waited a few seconds"],"answer":1,"why":"That's the promise, and it's the whole point of the word 'committed': it survives a crash. If commit didn't mean that, it would mean nothing at all.","goDeeper":"The trick is the write-ahead log (WAL). Before touching the real data, the database appends a record of what it's about to do to a sequential log and forces THAT to disk. After a crash it replays the log. That's how you get durability without paying for a slow random disk write on every single change."},
 {"type":"multiple_choice","prompt":"Why is the write-ahead log fast, even though it forces data onto disk before returning?","choices":["It's kept in memory only","It's a sequential append — and appending is dramatically faster than writing randomly across the disk","It's compressed","It isn't fast; it's just a necessary cost"],"answer":1,"why":"The log is append-only. The disk writes one continuous stream instead of hopping around to update scattered data pages — and sequential beats random by a huge margin.","goDeeper":"Sequential vs random access is one of the largest performance facts in all of storage, and databases are engineered around it rather than pretending disk behaves like RAM. Once you notice it, you see it everywhere: log-structured storage, Kafka, SSD write patterns."},
 {"type":"multiple_choice","prompt":"Two requests read a counter (value 10), each adds 1 in application code, and each writes back 11. What just happened?","choices":["The counter is 12 — correct","The counter is 11 — one increment vanished silently","The database throws an error","The counter stays at 10"],"answer":1,"why":"This is a lost update. Both read 10, both computed 11, both wrote 11. One user's increment simply disappeared — with no error anywhere.","goDeeper":"It's the users.txt problem again, wearing a database costume. The fix is to stop doing read-modify-write in your app and let the database do it atomically (UPDATE counters SET n = n + 1), or use a transaction with proper isolation — the subject of the Transactions & ACID unit. The lesson that matters right now: concurrency bugs don't crash, they quietly corrupt."},
 {"type":"multi_select","prompt":"Which of these are guarantees the DATABASE should enforce, rather than your application code? Select all.","choices":["Uniqueness — no two users with the same email","Referential integrity — no order without a real user","Crash-safe durability of committed data","Business rules like 'premium users get 20% off'"],"answer":[0,1,2],"why":"Constraints and durability belong in the database — it enforces them for every writer, forever. Business policy doesn't: it changes with the product and belongs in the app.","goDeeper":"The test: 'would this rule still be true no matter which app, script, or human writes to this table?' If yes, it's a data invariant — put it in the database where it can't be bypassed. If it's policy that marketing might change next quarter, keep it in the application."},
 {"type":"multiple_choice","prompt":"Your signup code checks 'does this email already exist?' and then INSERTs if not. Two signups for the same email race each other. What breaks?","choices":["Nothing — the check handles it","Both checks pass before either insert runs, so you get two users with the same email","The database deadlocks","The second request is automatically rejected"],"answer":1,"why":"Check-then-act is a race, always. Between your check and your insert, the other request slips through — and both believe they're the first.","goDeeper":"The only reliable fix is a UNIQUE constraint in the database, letting one insert fail and handling that error. This is why the database is the last line of defense: it's the single point every writer must pass through. Application checks are advisory; database constraints are law."},
 {"type":"tradeoff_slider","prompt":"You're recording analytics events at enormous volume — billions per day. Slide toward how strictly each write must be durable.","leftLabel":"Every event durably committed (safe, slow)","rightLabel":"Batched / fire-and-forget (fast, may lose a few)","answerRange":[55,100],"why":"Losing a handful of events out of billions changes no decision anyone will ever make. Throughput matters vastly more here than perfect durability — so batch hard and accept a little loss.","goDeeper":"This is unit 5's 'what does it cost to be wrong?' applied to durability. Not all data deserves the same promises: a payment must never vanish; an analytics ping can. Paying for guarantees you don't need is exactly how you build a system that's slow AND expensive."},
 {"type":"multiple_choice","prompt":"Why is the database usually the hardest part of a system to scale?","choices":["It's written in a low-level language","It's the stateful source of truth — app servers are disposable clones, but copies of data must agree with each other","Because it uses a disk","Because the software is old"],"answer":1,"why":"Your app servers are interchangeable and you scale them by adding boxes. The database holds the truth — and the moment you want a second copy of the truth for scale, you inherit replication, consistency, and conflict.","goDeeper":"This is unit 5's lens at its sharpest. You deliberately concentrated your state here, which makes the database simultaneously your most valuable component and your bottleneck. Everything ahead — indexes, replication, sharding, CAP, consistency models — is a consequence of that one decision."}
]}
]};

const COURSE = [UNIT1, UNIT2, UNIT3, UNIT4, UNIT5, UNIT6];
const TIERLABEL = ["Foundations","Foundations","Foundations","Foundations","Foundations","Storing Data"];

/* ---- engine ---- */
let uidx=0, UNIT=COURSE[0];
let hearts=5, xp=0, correct=0, total=0, idx=0, ex=null, lesson=null, checked=false, current=null;
const $=id=>document.getElementById(id);

function shuffle(a){ // deterministic-ish shuffle without Math.random dependency issues
  const arr=a.slice(); for(let i=arr.length-1;i>0;i--){const j=(i*7+3)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];} return arr;
}

function bootUnits(){
  const t=$('unittabs'); t.innerHTML='';
  COURSE.forEach((u,i)=>{
    const b=document.createElement('button'); b.className='utab'+(i===uidx?' on':'');
    b.textContent=`${i+1}. ${u.title}`;
    b.onclick=()=>{ uidx=i; UNIT=COURSE[i]; bootUnits(); boot(); };
    t.appendChild(b);
  });
}
function boot(){
  $('pk-kicker').textContent=`${TIERLABEL[uidx]} · Unit ${uidx+1}`;
  $('pk-title').textContent=UNIT.title;
  const lp=$('lessonpick'); lp.innerHTML='';
  UNIT.lessons.forEach((l,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<span class="k">${i+1}</span> ${l.title}`;
    b.onclick=()=>startLesson(i); lp.appendChild(b);
  });
}
function startLesson(i){
  lesson=UNIT.lessons[i]; idx=0; correct=0; total=0; hearts=5; xp=0;
  $('hearts').textContent=hearts;
  $('picker').classList.add('hidden'); $('complete').classList.add('hidden');
  $('stage').classList.remove('hidden'); $('foot').classList.remove('hidden');
  render();
}
function progress(){ $('bar').style.width=(idx/lesson.exercises.length*100)+'%'; }

function render(){
  checked=false; ex=lesson.exercises[idx]; progress();
  $('feedback').innerHTML=''; $('feedback').className='';
  const a=$('action'); a.className='btn'; a.textContent='Check'; a.disabled=true; a.onclick=check;
  const s=$('stage'); s.className='stage';
  s.innerHTML=`<div class="kicker">${lesson.title} · ${idx+1}/${lesson.exercises.length}</div><p class="prompt">${ex.prompt}</p><div id="body"></div>`;
  ({multiple_choice:mc,fill_blank:mc,multi_select:ms,match_pairs:match,order_steps:order,build_diagram:diagram,estimate:estimate,tradeoff_slider:slider})[ex.type]();
}
function enable(){ $('action').disabled=false; }

/* single-select (mc + fill_blank) */
function mc(){
  const opts=ex.type==='fill_blank'?ex.choices:ex.choices; current=null;
  const w=$('body'); const c=document.createElement('div'); c.className='choices';
  opts.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<span class="k">${String.fromCharCode(65+i)}</span> ${t}`;
    b.onclick=()=>{ if(checked)return; current=i; [...c.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); enable(); };
    c.appendChild(b);
  });
  w.appendChild(c);
}
/* multi-select */
function ms(){
  current=new Set(); const w=$('body'); const c=document.createElement('div'); c.className='choices';
  ex.choices.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<span class="k">${String.fromCharCode(65+i)}</span> ${t}`;
    b.onclick=()=>{ if(checked)return; if(current.has(i)){current.delete(i);b.classList.remove('sel');}else{current.add(i);b.classList.add('sel');} $('action').disabled=current.size===0; };
    c.appendChild(b);
  });
  w.appendChild(c);
}
/* match pairs */
function match(){
  const w=$('body'); current={sel:null,map:{}};
  const lefts=ex.pairs.map(p=>p.left), rights=shuffle(ex.pairs.map(p=>p.right));
  const grid=document.createElement('div'); grid.className='match';
  const cl=document.createElement('div'); cl.className='col'; const cr=document.createElement('div'); cr.className='col';
  const lb={},rb={};
  lefts.forEach(l=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.style.textAlign='left';lb[l]=b;
    b.onclick=()=>{if(checked)return;current.sel={side:'l',v:l};highlight();};cl.appendChild(b);});
  rights.forEach(r=>{const b=document.createElement('button');b.className='chip';b.textContent=r;b.style.textAlign='left';rb[r]=b;
    b.onclick=()=>{if(checked)return;current.sel={side:'r',v:r};highlight();};cr.appendChild(b);});
  function highlight(){
    Object.values(lb).forEach(b=>b.classList.remove('sel'));Object.values(rb).forEach(b=>b.classList.remove('sel'));
    const s=current.sel; if(!s)return;
    (s.side==='l'?lb[s.v]:rb[s.v]).classList.add('sel');
    // try pairing: if one of each selected across clicks
    if(current._pending && current._pending.side!==s.side){
      const l=s.side==='l'?s.v:current._pending.v, r=s.side==='r'?s.v:current._pending.v;
      current.map[l]=r; lb[l].classList.add('used'); rb[r].classList.add('used'); current._pending=null; current.sel=null;
      Object.values(lb).forEach(b=>b.classList.remove('sel'));Object.values(rb).forEach(b=>b.classList.remove('sel'));
      if(Object.keys(current.map).length===lefts.length) enable();
    } else { current._pending=s; }
  }
  grid.appendChild(cl); grid.appendChild(cr); w.appendChild(grid);
}
/* order steps */
function order(){
  const w=$('body'); current=shuffle(ex.steps.map((s,i)=>({s,i}))); enable();
  function draw(){
    const list=document.createElement('div'); list.className='order';
    current.forEach((it,pos)=>{
      const r=document.createElement('div'); r.className='row';
      r.innerHTML=`<span class="num">${pos+1}</span> <span>${it.s}</span>`;
      const ar=document.createElement('div'); ar.className='arrows';
      const up=document.createElement('button'); up.textContent='↑'; up.onclick=()=>{if(checked||pos===0)return;[current[pos-1],current[pos]]=[current[pos],current[pos-1]];refresh();};
      const dn=document.createElement('button'); dn.textContent='↓'; dn.onclick=()=>{if(checked||pos===current.length-1)return;[current[pos+1],current[pos]]=[current[pos],current[pos+1]];refresh();};
      ar.appendChild(up);ar.appendChild(dn); r.appendChild(ar); list.appendChild(r);
    });
    w.innerHTML=''; w.appendChild(list);
  }
  function refresh(){draw();}
  draw();
}
/* build diagram */
function diagram(){
  const w=$('body'); current=null;
  const d=document.createElement('div'); d.className='diagram';
  ex.slots.forEach((sl,i)=>{
    if(i>0) d.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');
    if(sl==='?'){ const slot=document.createElement('div'); slot.className='slot'; slot.id='slot'; slot.textContent='?'; d.appendChild(slot); }
    else { const n=document.createElement('div'); n.className='node fixed'; n.textContent=sl; d.appendChild(n); }
  });
  w.appendChild(d);
  const chips=document.createElement('div'); chips.className='chips'; chips.style.justifyContent='center';
  shuffle(ex.palette).forEach(p=>{
    const c=document.createElement('button'); c.className='chip'; c.textContent=p;
    c.onclick=()=>{ if(checked)return; current=p; const slot=$('slot'); slot.textContent=p; slot.classList.add('filled');
      [...chips.children].forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); enable(); };
    chips.appendChild(c);
  });
  w.appendChild(chips);
}
/* estimate */
function estimate(){
  const w=$('body'); current=null;
  const box=document.createElement('div'); box.className='est';
  const inp=document.createElement('input'); inp.type='number'; inp.placeholder='?';
  inp.oninput=()=>{ current=parseFloat(inp.value); $('action').disabled=isNaN(current); };
  box.appendChild(inp); const u=document.createElement('span'); u.className='unit'; u.textContent=ex.unit||''; box.appendChild(u);
  w.appendChild(box);
}
/* tradeoff slider */
function slider(){
  const w=$('body'); current=50;
  const wrap=document.createElement('div'); wrap.className='slider-wrap';
  wrap.innerHTML=`<div class="slider-labels"><span>◀ ${ex.leftLabel}</span><span>${ex.rightLabel} ▶</span></div>`;
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=100; r.value=50;
  const val=document.createElement('div'); val.className='slider-val'; val.textContent='50 / 50';
  r.oninput=()=>{ current=+r.value; val.textContent=`${100-current} / ${current}`; };
  wrap.appendChild(r); wrap.appendChild(val); w.appendChild(wrap); enable();
}

/* ---- checking ---- */
function check(){
  checked=true; total++;
  let ok=false;
  const body=$('body');
  if(ex.type==='multiple_choice'||ex.type==='fill_blank'){
    ok=current===ex.answer;
    const btns=body.querySelectorAll('.choice');
    btns[ex.answer].classList.add('ok'); if(!ok&&current!=null) btns[current].classList.add('bad');
  } else if(ex.type==='multi_select'){
    const want=new Set(ex.answer); ok=current.size===want.size&&[...current].every(x=>want.has(x));
    const btns=body.querySelectorAll('.choice');
    ex.answer.forEach(i=>btns[i].classList.add('ok'));
    [...current].forEach(i=>{if(!want.has(i))btns[i].classList.add('bad');});
  } else if(ex.type==='order_steps'){
    ok=current.every((it,pos)=>it.i===pos);
  } else if(ex.type==='match_pairs'){
    ok=ex.pairs.every(p=>current.map[p.left]===p.right);
  } else if(ex.type==='build_diagram'){
    ok=current===ex.answer; const slot=$('slot'); slot.classList.remove('filled'); slot.classList.add(ok?'filled':'');
    slot.style.borderColor=ok?'var(--green)':'var(--red)'; slot.style.background=ok?'var(--green-soft)':'var(--red-soft)';
  } else if(ex.type==='estimate'){
    ok=Math.abs(current-ex.answer)<=(ex.tolerance||0);
  } else if(ex.type==='tradeoff_slider'){
    ok=current>=ex.answerRange[0]&&current<=ex.answerRange[1];
  }
  if(ok){correct++; xp+=10;} else {hearts=Math.max(0,hearts-1); $('hearts').textContent=hearts;}
  showFeedback(ok);
}
function showFeedback(ok){
  const f=$('feedback'); f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=`<h4>${ok?'✓ Nice!':'✗ Not quite'}</h4><p>${ex.why}</p>`+
    (ex.goDeeper?`<div class="deeper"><b>Go deeper:</b> ${ex.goDeeper}</div>`:'');
  const a=$('action'); a.textContent = idx+1<lesson.exercises.length?'Continue':'Finish'; a.disabled=false;
  a.className='btn'+(ok?'':' '); a.onclick=next;
  if(hearts===0){ a.textContent='Out of hearts — Finish'; }
}
function next(){
  if(hearts===0){ return finish(); }
  idx++;
  if(idx>=lesson.exercises.length) return finish();
  render();
}
function finish(){
  $('bar').style.width='100%';
  $('stage').classList.add('hidden'); $('foot').classList.add('hidden');
  $('complete').classList.remove('hidden');
  $('xp').textContent=xp; $('acc').textContent=Math.round(correct/Math.max(1,total)*100)+'%'; $('hleft').textContent=hearts;
}
bootUnits(); boot();
</script>
</body>
</html>
