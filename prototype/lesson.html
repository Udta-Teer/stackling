<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackling — How the Internet Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Stackling brand — "blueprint at night" */
  :root{
    --disp:'Bricolage Grotesque',-apple-system,system-ui,sans-serif;
    --body:'Inter',-apple-system,system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --bg:#071522; --card:#0d2438; --card2:#12314b;
    --ink:#eaf1f8; --muted:#9db4cc; --line:rgba(76,176,255,.16);
    --blueprint:#1e5aa8; --blueprint-dk:#12406f; --blue:#4cb0ff;
    --signal:#ffb020;
    --green:#35d0a5; --green-dark:#35d0a5; --green-soft:rgba(53,208,165,.15);
    --red:#ff5c7a; --red-soft:rgba(255,92,122,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(76,176,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(76,176,255,.05) 1px,transparent 1px);background-size:28px 28px;}
  .mark{width:var(--s,32px);height:var(--s,32px);flex:none}
  .brand{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink);}
  .app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px;}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
  .close{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;}
  .bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .3s ease;}
  .hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-size:18px;
    background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:8px;font-family:inherit;transition:.08s;}
  .hearts:hover{background:rgba(255,92,122,.12);}
  .hearts.inf{color:var(--signal);}
  .hearts.inf:hover{background:rgba(255,176,32,.12);}
  /* teaching toggle — the stairs next to the ramp */
  .teachbtn{background:none;border:none;cursor:pointer;color:var(--blue);padding:5px 6px;border-radius:8px;
    display:grid;place-items:center;transition:.08s;flex:none;}
  .teachbtn:hover{background:rgba(76,176,255,.12);}
  .teachbtn.off{color:var(--line);}
  .teachbtn.off:hover{color:var(--muted);}
  /* body */
  .stage{flex:1;display:flex;flex-direction:column;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:400;margin-bottom:8px;}
  .prompt{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1.3;letter-spacing:-.01em;margin:0 0 22px;}
  /* inline markdown from content strings — see md() */
  code{font-family:var(--mono);font-size:.86em;background:var(--card2);color:var(--blue);
    padding:.1em .36em;border-radius:5px;border:1px solid var(--line);}
  em{font-style:italic;color:var(--signal);}
  /* choices */
  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:2px solid var(--line);
    border-bottom-width:4px;border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:700;
    cursor:pointer;transition:.08s;}
  .choice:hover{background:rgba(28,176,246,.06);}
  .choice.sel{border-color:var(--blue);background:rgba(28,176,246,.1);}
  .choice.ok{border-color:var(--green);background:var(--green-soft);}
  .choice.bad{border-color:var(--red);background:var(--red-soft);}
  .choice .k{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:13px;color:var(--muted);}
  /* The option text must be ONE flex item. Without this wrapper, md() output
     (text + <code> + text) makes every fragment its own flex item — each gapped
     12px apart and squeezed into a narrow column, so any option containing a
     code span shattered into pieces. */
  .choice .txt{flex:1;min-width:0;line-height:1.45;}
  .choice.sel .k{border-color:var(--blue);color:var(--blue);}
  /* generic tiles / chips */
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:12px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);
    color:var(--ink);font-weight:700;cursor:pointer;transition:.08s;}
  .chip:hover{border-color:var(--blue);}
  .chip.used{opacity:.35;pointer-events:none;}
  .chip.sel{border-color:var(--blue);background:rgba(76,176,255,.14);}
  .chip.ok{border-color:var(--green);background:var(--green-soft);opacity:1;}
  /* A paired chip in match_pairs: clearly spoken for, but still clickable so the
     pair can be broken. Distinct from .used, which is a spent component. */
  .chip.paired{opacity:.5;border-color:var(--blue);border-style:dashed;}
  .chip.paired:hover{opacity:.85;background:rgba(76,176,255,.08);}
  /* order list */
  .order{display:flex;flex-direction:column;gap:10px;}
  .order .row{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);font-weight:700;}
  .order .row .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;}
  .order .arrows{margin-left:auto;display:flex;gap:6px;}
  .order .arrows button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:800;}
  /* match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .match .col{display:flex;flex-direction:column;gap:10px;}
  /* the answer, revealed after checking — one row per correct pair */
  .match.revealed{display:flex;flex-direction:column;gap:8px;}
  .mrow{border:2px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:10px 12px;}
  .mrow.ok{border-color:var(--green);background:var(--green-soft);}
  .mrow.bad{border-color:var(--red);background:var(--red-soft);}
  /* .mpair is flex, so each half must be its own element — md() output as a
     direct flex child shatters into one item per fragment (see .choice .txt) */
  .mpair{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;line-height:1.35;}
  .mpair .marr{color:var(--muted);flex:none;font-weight:900;}
  .mpair .ml,.mpair .mr{flex:1;min-width:0;}
  .myours{font-size:12px;color:var(--red);margin-top:7px;font-weight:600;line-height:1.4;}
  /* checkpoint: the absence of a teaching card is deliberate, so say so */
  .kicker .cp{color:var(--signal);border:1px solid rgba(255,176,32,.4);border-radius:99px;
    padding:1px 7px;margin-right:7px;font-size:11px;}
  .picksub{margin:-8px 0 4px;color:var(--muted);font-weight:500;font-size:14px;line-height:1.5;}
  /* ── diagram engine ───────────────────────────────────────────────────
     ONE data-driven renderer, shared by concept / build_diagram /
     spot_bottleneck / simulate. Content supplies nodes (each with a `col`)
     and edges; layout is derived, never authored.

     Nodes are real HTML, not SVG <text>: SVG can't wrap a line, and every
     node label goes through md(). Edges are an SVG layer underneath.
     NOTE: .vn is a flex container, so a label must always be wrapped in .vl
     — md() output as a direct flex child shatters into one item per fragment. */
  .vizwrap{overflow-x:auto;overflow-y:hidden;display:flex;justify-content:center;padding:2px 0 8px;margin-bottom:16px;}
  .viz{position:relative;flex:none;}
  .viz .edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:0;}
  .vn{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:5px 7px;border:2px solid var(--line);border-bottom-width:3px;border-radius:11px;
    background:var(--card);font-size:11.5px;font-weight:700;line-height:1.24;text-align:center;
    overflow:hidden;transition:border-color .18s,background .18s,transform .12s;}
  .vn .vl{max-width:100%;}
  /* relative, so it tracks the node's adaptive font-size — including the .sub
     that simulate() creates at runtime, which has no inline size of its own */
  .vn .sub{font-family:var(--mono);font-size:.82em;font-weight:400;color:var(--muted);letter-spacing:.02em;}
  /* kinds — colour carries meaning, so the same component reads the same everywhere */
  .vn.k-client{background:var(--card2);border-color:rgba(157,180,204,.32);color:var(--muted);}
  .vn.k-lb,.vn.k-dns,.vn.k-cdn,.vn.k-gw{border-color:var(--blue);background:rgba(76,176,255,.12);color:var(--blue);}
  .vn.k-db,.vn.k-storage{border-color:var(--blueprint);background:rgba(30,90,168,.3);}
  .vn.k-cache{border-color:var(--signal);background:rgba(255,176,32,.13);color:var(--signal);}
  .vn.k-queue{border-color:var(--green);background:var(--green-soft);color:var(--green);}
  .vn.ok{border-color:var(--green)!important;background:var(--green-soft)!important;color:var(--ink)!important;}
  .vn.bad{border-color:var(--red)!important;background:var(--red-soft)!important;color:var(--ink)!important;}
  .vn.pick{cursor:pointer;}
  .vn.pick:hover{border-color:var(--blue);transform:translateY(-1px);}
  .vn.pick.sel{border-color:var(--blue);background:rgba(76,176,255,.16);}
  /* drop targets */
  .vn.hole{border-style:dashed;border-color:var(--muted);color:var(--muted);background:rgba(255,255,255,.02);}
  .vn.hole.over{border-color:var(--blue);background:rgba(76,176,255,.18);color:var(--blue);transform:scale(1.06);}
  .vn.hole.full{border-style:solid;border-color:var(--blue);background:rgba(76,176,255,.12);color:var(--ink);cursor:pointer;}
  /* simulate: a node over capacity is the whole point — make it unmissable */
  .vn.melt{border-color:var(--red);background:var(--red-soft);animation:melt .6s ease-in-out infinite;}
  @keyframes melt{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .edges path{stroke:rgba(157,180,204,.45);stroke-width:1.6;fill:none;}
  .edges path.live{stroke:var(--blue);stroke-width:2.2;stroke-dasharray:5 4;animation:flow .7s linear infinite;}
  .edges path.dead{stroke:var(--red);}
  @keyframes flow{to{stroke-dashoffset:-18}}
  /* dragging a component into a slot — pointer events, so touch works too */
  .chip.drag{touch-action:none;-webkit-user-select:none;user-select:none;}
  .chip.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.95;margin:0;
    transform:translate(-50%,-50%) rotate(-2.5deg);box-shadow:0 14px 30px rgba(0,0,0,.5);border-color:var(--blue);}
  .vhint{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);text-align:center;margin:2px 0 12px;}
  /* ── concept card — the teaching beat ────────────────────────────────
     Deliberately small. goDeeper died because it was an unbounded prose
     field; the validator hard-caps `body` so this can't become goDeeper 2.0. */
  .cbody{font-size:15.5px;line-height:1.55;font-weight:500;color:var(--ink);
    border-left:3px solid var(--blue);padding-left:14px;margin:0;}
  .cnote{margin-top:14px;font-size:13.5px;line-height:1.5;color:var(--muted);font-weight:500;}
  .cskip{max-width:290px;margin:22px auto 0;display:block;}
  /* ── simulate readouts ─────────────────────────────────────────────── */
  .simbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:-4px 0 14px;}
  .simbar .m{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--card);
    font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;min-width:104px;}
  .simbar .m b{display:block;font-family:var(--disp);font-size:17px;font-weight:800;color:var(--ink);margin-top:2px;}
  .simbar .m.good b{color:var(--green);} .simbar .m.bad b{color:var(--red);}
  /* estimate */
  .est{display:flex;align-items:center;gap:10px;}
  .est input{font-size:22px;font-weight:800;padding:12px;width:130px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);}
  .est .unit{font-weight:800;color:var(--muted);}
  /* slider */
  .slider-wrap{margin:10px 0 4px;}
  .slider-labels{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:10px;gap:10px;}
  input[type=range]{width:100%;accent-color:var(--blue);height:8px;}
  .slider-val{text-align:center;font-weight:800;margin-top:8px;color:var(--blue);}
  /* footer */
  .foot{position:sticky;bottom:0;padding-top:16px;background:var(--bg);}
  .btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.02em;
    text-transform:uppercase;cursor:pointer;color:#fff;background:var(--blueprint);border-bottom:4px solid var(--blueprint-dk);transition:.08s;}
  .btn:disabled{background:var(--line);color:var(--muted);border-bottom-color:var(--line);cursor:not-allowed;}
  .btn.grey{background:var(--line);color:var(--muted);border-bottom-color:var(--line);}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);border-bottom-width:1px;
    margin-top:10px;font-size:14px;text-transform:none;letter-spacing:0;}
  .btn.ghost:hover{color:var(--ink);border-color:var(--blue);}
  .feedback{border-radius:16px 16px 0 0;margin:16px -16px -16px;padding:18px 16px 22px;}
  .feedback.ok{background:var(--green-soft);}
  .feedback.bad{background:var(--red-soft);}
  .feedback h4{margin:0 0 6px;font-family:var(--disp);font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .feedback.ok h4{color:var(--green-dark);}
  .feedback.bad h4{color:var(--red);}
  .feedback p{margin:0 0 10px;font-weight:600;line-height:1.45;}
  .deeper{background:rgba(28,176,246,.14);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.45;}
  .deeper b{color:var(--blue);}
  /* complete */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .done .big{font-size:64px;}
  .done h2{margin:0;font-family:var(--disp);font-size:28px;font-weight:800;}
  .stat{display:flex;gap:12px;margin-top:10px;}
  .stat .box{border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-family:var(--disp);font-weight:800;font-size:20px;background:var(--card);}
  .stat .box.xp{color:var(--signal);}
  .stat .box small{display:block;color:var(--muted);font-family:var(--mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
  /* field task — optional, post-reward, never blocks the loop */
  .ftask{border:1px dashed var(--line);border-radius:14px;padding:16px 18px;margin-top:22px;
    background:var(--card);text-align:left;max-width:460px;}
  .ftask .ft-top{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .ftask .ft-tag{color:var(--signal);border:1px solid rgba(255,176,32,.4);border-radius:99px;padding:2px 8px;}
  .ftask .ft-do{font-family:var(--mono);font-size:14px;color:var(--blue);background:var(--card2);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;word-break:break-word;}
  .ftask .ft-alt{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  .ftask .ft-notice{font-size:13.5px;line-height:1.45;margin:0;color:var(--ink);}
  .lessonpick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .utabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .utab{font-family:var(--mono);font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);cursor:pointer;transition:.08s;}
  .utab.on{border-color:var(--blue);color:var(--blue);background:rgba(76,176,255,.12);}
  .hidden{display:none!important;}
</style>
</head>
<body>

<!-- Stackling mark: two base layers + a big-faced amber head (logo = mascot) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="stack" viewBox="0 0 100 100">
    <rect x="16" y="66" width="68" height="15" rx="5" fill="#1e5aa8"/>
    <rect x="25" y="47" width="50" height="15" rx="5" fill="#4cb0ff"/>
    <rect x="30" y="12" width="40" height="30" rx="9" fill="#ffb020"/>
    <circle cx="43" cy="27" r="4.4" fill="#071522"/>
    <circle cx="57" cy="27" r="4.4" fill="#071522"/>
    <circle cx="44.4" cy="25.6" r="1.4" fill="#fff"/>
    <circle cx="58.4" cy="25.6" r="1.4" fill="#fff"/>
  </symbol>
</svg>

<div class="app">
  <div class="top">
    <button class="close" id="closebtn" title="Exit to lessons">✕</button>
    <svg class="mark" style="--s:26px"><use href="#stack"/></svg>
    <div class="bar"><i id="bar"></i></div>
    <button class="teachbtn" id="teachbtn" title="Concept cards ON — tap to skip them from now on" aria-label="Toggle concept cards">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 7h8M8 11h5"/>
      </svg>
    </button>
    <button class="hearts" id="heartbox" title="Click for unlimited hearts — review mode">♥ <span id="hearts">5</span></button>
  </div>

  <!-- lesson picker -->
  <div id="picker" class="stage">
    <svg class="mark" style="--s:76px;margin-bottom:14px"><use href="#stack"/></svg>
    <div class="utabs" id="unittabs"></div>
    <div class="kicker" id="pk-kicker">Foundations · Unit 1</div>
    <h1 class="prompt" id="pk-title">How the Internet Works</h1>
    <p class="picksub hidden" id="pk-sub"></p>
    <p style="margin-top:6px;color:var(--muted);font-weight:500;">Pick a lesson to play the prototype.</p>
    <div class="lessonpick" id="lessonpick"></div>
  </div>

  <!-- exercise -->
  <div id="stage" class="stage hidden"></div>

  <!-- complete -->
  <div id="complete" class="stage hidden">
    <div class="done">
      <div class="big"><svg class="mark" style="--s:104px"><use href="#stack"/></svg></div>
      <h2>Lesson complete!</h2>
      <div class="stat">
        <div class="box xp"><small>XP</small><span id="xp">0</span></div>
        <div class="box"><small>Accuracy</small><span id="acc">0%</span></div>
        <div class="box"><small>Hearts left</small><span id="hleft">5</span></div>
      </div>
      <div id="ftask-host"></div>
      <button class="btn" id="nextbtn" style="max-width:280px;margin-top:18px">Next lesson</button>
      <button class="btn ghost" id="backbtn" style="max-width:280px">Back to lessons</button>
    </div>
  </div>

  <div id="foot" class="foot hidden">
    <div id="feedback"></div>
    <button id="action" class="btn" disabled>Check</button>
  </div>
</div>

<script>
/* === GENERATED BY scripts/build-prototype.py — DO NOT EDIT BY HAND === */
/* ---- 01-how-the-internet-works.json ---- */
const UNIT1 = {"unitId":"how-internet-works","title":"How the Internet Works","subtitle":"The internet is just computers passing notes","lessons":[{"id":"hiw-1","title":"It's just computers passing notes","exercises":[{"id":"hiw-1-0","type":"concept","title":"Nothing connects your laptop to the server — your data is passed hand to hand","viz":{"nodes":[{"id":"you","label":"Your laptop","col":0,"kind":"client"},{"id":"r1","label":"Router","col":1},{"id":"r2","label":"Router","sub":"many hops","col":2},{"id":"r3","label":"Router","col":3},{"id":"s","label":"Server","col":4,"kind":"server"}],"edges":[{"from":"you","to":"r1"},{"from":"r1","to":"r2"},{"from":"r2","to":"r3"},{"from":"r3","to":"s"}]},"body":"There is no wire from your laptop to Google. Your data is chopped into small chunks called *packets*, each stamped with the destination's IP address — a number like `142.250.72.14` that identifies one machine on the internet. A packet carries an address but no map. It's handed to a router, then another, then another, until it arrives.","note":"It's post, not a phone call. Each packet is addressed and travels alone, so two packets from the same page can take different routes and show up out of order."},{"id":"hiw-1-1","type":"multiple_choice","prompt":"You open a website. Roughly how many separate computers might your request pass through before it reaches the server?","choices":["Just 1 — mine and theirs","About 3","Often 10–20","Exactly 100"],"answer":2,"why":"Your data hops through many routers along the way — often 10 to 20 — each one passing it a step closer to the destination. Nothing about this is theoretical: your computer can list those hops for you, one line each, and you'll do exactly that in a moment."},{"id":"hiw-1-2","type":"fill_blank","prompt":"Data doesn't travel as one big blob. It's broken into small chunks called ______.","choices":["packets","pixels","cookies","threads"],"answer":0,"why":"The internet splits your data into small packets, sends them independently, and reassembles them at the other end. Because they travel independently, packets can take *different routes* and arrive out of order — so something has to put them back in sequence, which is TCP's job in lesson 4."},{"id":"hiw-1-3","type":"multiple_choice","prompt":"Every device on the internet needs one of these to be found. What is it?","choices":["A username","An IP address","A password","A phone number"],"answer":1,"why":"An IP address (like `142.250.72.14`) is a device's location on the internet — data can't be delivered without one. There aren't enough of the old IPv4 addresses (~4.3 billion) for the world, which is exactly why IPv6 exists with an address space large enough that running out stops being a concern."},{"id":"hiw-1-4","type":"match_pairs","prompt":"Match each piece to what it does.","pairs":[{"left":"Packet","right":"A small chunk of your data"},{"left":"IP address","right":"A device's location on the internet"},{"left":"Router","right":"Passes packets toward their destination"}],"why":"Packets carry the data, IP addresses say where it's going, and routers move it hop by hop. The surprising part is that no router knows the whole path — each one only knows the *next best hop*, so the internet has no central map of itself."},{"id":"hiw-1-5","type":"multiple_choice","prompt":"There's no master computer running the internet. So how do packets find their way?","choices":["A central server in the US decides every route","Each router just forwards to the next-best hop toward the target","Packets are sent to every computer until one matches","Your ISP pre-computes the full path"],"answer":1,"why":"The internet is decentralized: each router makes a local decision — *who gets me closer?* — and no single machine is in charge. That's precisely why it's so resilient; knock out a router and traffic routes around it. Worth killing a myth attached to this, because you will hear it repeated: ARPANET was not built to survive a nuclear war. Its own directors said so — it was built to share a handful of very expensive research computers. The survivability motive belongs to Paul Baran's separate RAND work on distributed networks, which did feed the design. The resilience is real; the origin story usually told about it isn't."}],"fieldTask":{"where":"Terminal","seconds":20,"do":"traceroute google.com","alt":"On Windows, it's `tracert google.com`","notice":"Every numbered line is one router your packets actually passed through. Count them — that's the 10–20 hops from this lesson, and they're real machines in real buildings between you and Google."}},{"id":"hiw-2","title":"DNS: the internet's phonebook","exercises":[{"id":"hiw-2-0","type":"concept","title":"`google.com` is not an address — it's a name that has to be looked up first","viz":{"nodes":[{"id":"b","label":"Browser","col":0,"kind":"client"},{"id":"d","label":"DNS","sub":"1 · what IP?","col":1,"kind":"dns"},{"id":"s","label":"Server","sub":"2 · connect","col":1,"kind":"server"}],"edges":[{"from":"b","to":"d"},{"from":"b","to":"s"}]},"body":"Routers move packets toward numbers, not names. So before your browser can connect to `google.com`, something has to turn that name into an IP address. That something is DNS — the Domain Name System, the internet's phonebook. Give it a name, it hands back a number. Every connection you make starts with this translation.","note":"The indirection is the feature: because you connect to a name, the company behind it can swap machines, add servers, or point you at a nearer one — and your browser simply gets a different number back."},{"id":"hiw-2-1","type":"multiple_choice","prompt":"You type `google.com`, but computers route by IP address. Who turns the name into the number?","choices":["Your keyboard","DNS","The CPU","Your Wi-Fi router alone"],"answer":1,"why":"DNS (Domain Name System) is the internet's phonebook — it looks up `google.com` and returns its IP address. Humans remember names and machines need numbers, so DNS is the translation layer that lets us live in a world of words."},{"id":"hiw-2-2","type":"fill_blank","prompt":"DNS translates a human-friendly ______ into a machine-friendly IP address.","choices":["domain name","password","packet","port"],"answer":0,"why":"A domain name like `netflix.com` is for humans; DNS converts it to the IP address machines actually use to route packets."},{"id":"hiw-2-3","type":"order_steps","prompt":"Put a DNS lookup in order (simplified).","steps":["Browser asks: what's the IP for `example.com`?","Check the local cache — seen it recently?","If not cached, ask a DNS resolver","Resolver returns the IP address","Browser connects to that IP"],"why":"DNS checks the fastest source first (the local cache) before asking a resolver, then hands the browser an IP to connect to. Results get cached at many levels — browser, operating system, resolver — each honouring a TTL (time to live), which is why a DNS change can take hours to reach everyone."},{"id":"hiw-2-4","type":"multiple_choice","prompt":"In October 2016, a company called Dyn was attacked. Suddenly Twitter, Spotify, Reddit, and Netflix all went dark at once — even though those companies were fine. What had been knocked out?","choices":["A single giant server","A major DNS provider","The undersea cables","Everyone's Wi-Fi"],"answer":1,"why":"Dyn was a big DNS provider, and taking out DNS means users can't translate names to IPs — so the sites become unreachable while running perfectly. DNS is a quiet single point of failure for huge chunks of the web, which is why serious systems use multiple DNS providers."},{"id":"hiw-2-5","type":"multi_select","prompt":"Why does DNS cache results instead of looking up every time? Select all that apply.","choices":["Lookups take time — caching makes pages load faster","It reduces load on DNS servers","It makes the answer more accurate","The same names are requested over and over"],"answer":[0,1,3],"why":"Caching is about speed and load: popular names are requested constantly, so remembering the answer avoids a repeat round trip. It does NOT make answers more accurate — a stale cache can happily serve an outdated IP. This is your first taste of caching, a theme you'll meet everywhere: keep the hot answer close, and accept that it might be behind."}]},{"id":"hiw-3","title":"The journey of a request","exercises":[{"id":"hiw-3-0","type":"concept","title":"A request can't start until it knows where it's going","body":"The order of a page load isn't a convention — it's forced. Each step can only run on what the step before it produced, so the chain can't be shuffled or skipped: nothing can be sent to an address you don't have yet, and nothing can be answered before it's been asked. And nothing paints on your screen until the answer has finished travelling back.","note":"Distance gets charged more than once. A fresh HTTPS connection can spend round trips on a DNS lookup, then the TCP handshake, then the TLS handshake — all before one byte of your actual page is sent."},{"id":"hiw-3-1","type":"multiple_choice","prompt":"Before your browser can send an HTTP request to a server, what does it need first?","choices":["The server's IP address","The server's password","A faster CPU","More RAM"],"answer":0,"why":"You can't send data anywhere without a destination address, so DNS supplies the server's IP first — and only then can the request travel."},{"id":"hiw-3-2","type":"order_steps","prompt":"Order what happens when you visit `example.com`.","steps":["DNS resolves `example.com` to an IP address","Browser opens a connection to that IP","Browser sends an HTTP request","Server processes the request","Server sends back an HTTP response","Browser renders the page"],"why":"Every page load is this dance: name → IP → connect → ask → process → answer → render. On a real HTTPS site there's also a TLS handshake right after connecting, which encrypts everything — that's the *s* in `https`."},{"id":"hiw-3-3","type":"build_diagram","prompt":"Place the missing piece: your browser needs to turn `example.com` into an IP before reaching the server.","viz":{"nodes":[{"id":"b","label":"Browser","col":0,"kind":"client"},{"id":"h","col":1,"hole":true},{"id":"w","label":"Web Server","col":2,"kind":"server"}],"edges":[{"from":"b","to":"h"},{"from":"h","to":"w"}]},"palette":["DNS","Database","Cache"],"answer":{"h":"DNS"},"why":"DNS sits between you and the server on that first step, translating the name so your browser knows where to connect."},{"id":"hiw-3-4","type":"estimate","prompt":"Light travels fast, but not instantly. A round trip from New York to a server in London and back takes roughly how many milliseconds in practice?","answer":70,"tolerance":30,"unit":"ms","why":"New York to London is about 5,570 km, so there and back is ~11,140 km. Light in fibre travels at roughly two-thirds of its vacuum speed — about 200,000 km/s — which puts the floor near 56ms. Real cables don't run in straight lines and every switch adds a little, so what you actually measure is ~70-80ms. Physics sets a floor no amount of engineering beats: you can't outrun light, so you shorten the distance instead. That is the entire reason companies put servers close to users rather than trying to make the trip faster."},{"id":"hiw-3-5","type":"multiple_choice","prompt":"Your page felt slow. The server responded in 5ms, but the total was 300ms. Where did the time most likely go?","choices":["The server was slow","Network round-trips across distance","The database was down","Your CPU was busy"],"answer":1,"why":"If the server itself only took 5ms, the other 295ms was the network — the round trips of getting data there and back. A useful rule of thumb: the *network*, not the server, is often your latency bottleneck, so measure before you optimize."}]},{"id":"hiw-4","title":"TCP vs UDP: reliable vs fast","exercises":[{"id":"hiw-4-0","type":"concept","title":"The internet doesn't promise your packets will arrive — TCP does, UDP doesn't","viz":{"nodes":[{"id":"app","label":"Your app","col":0,"kind":"client"},{"id":"t","label":"TCP","sub":"ordered","col":1},{"id":"u","label":"UDP","sub":"fire, forget","col":1},{"id":"n","label":"IP / routers","sub":"may drop","col":2}],"edges":[{"from":"app","to":"t"},{"from":"app","to":"u"},{"from":"t","to":"n"},{"from":"u","to":"n"}]},"body":"Routers drop packets when they're overloaded, and packets arrive out of order. The network itself doesn't care. So you pick a protocol on top. TCP — Transmission Control Protocol — numbers every packet, notices what went missing, re-sends it, and hands your app the bytes in order. UDP — User Datagram Protocol — does none of that.","note":"The obvious way to be reliable would be: send a chunk, wait for the *ack*, send the next. TCP doesn't. It keeps a whole window of packets in flight at once, which is how it's reliable without crawling."},{"id":"hiw-4-1","type":"multiple_choice","prompt":"You're loading a bank statement. Every byte must arrive, in order, no errors. Which protocol fits?","choices":["UDP","TCP","Neither","Both equally"],"answer":1,"why":"TCP (Transmission Control Protocol) guarantees delivery and order — it re-sends lost packets and reassembles them correctly, which is what you want for data you can't afford to lose. It manages that with acknowledgements and a sliding window: the receiver confirms what arrived, but the sender keeps many segments in flight instead of waiting for each one — which is exactly why TCP can be both reliable and fast. So reliability doesn't cost you a round trip per chunk; it costs you the handshake before you start, and a re-send whenever something is genuinely lost."},{"id":"hiw-4-2","type":"multiple_choice","prompt":"You're on a live video call. A dropped frame is fine, but a 2-second delay to re-send it is not. Which protocol fits?","choices":["TCP","UDP","Neither","Always TCP for video"],"answer":1,"why":"UDP (User Datagram Protocol) just fires packets and doesn't wait for confirmation. For live audio and video, a missing frame beats a laggy one — speed matters more than perfection. This is a classic tradeoff you'll make again and again: reliability against latency."},{"id":"hiw-4-3","type":"match_pairs","prompt":"Match the use case to the better protocol.","pairs":[{"left":"Downloading a file","right":"TCP"},{"left":"Live game / video call","right":"UDP"},{"left":"Loading a web page","right":"TCP"},{"left":"DNS lookup (small, fast)","right":"UDP"}],"why":"TCP for anything that must arrive complete and correct; UDP for small or real-time traffic where speed beats perfection. DNS traditionally uses UDP because a lookup is tiny — if it's lost, just ask again — while encrypted DNS wraps the lookup in TLS so your network can't read it — DNS-over-HTTPS rides TCP, DNS-over-QUIC is back on UDP. The privacy comes from the encryption, not from the transport."},{"id":"hiw-4-4","type":"tradeoff_slider","prompt":"You're designing a multiplayer game's networking. Slide toward what you'd prioritize for player-movement updates.","leftLabel":"Guaranteed delivery (TCP)","rightLabel":"Lowest latency (UDP)","answerRange":[65,100],"why":"For fast-moving player positions, low latency wins: a slightly stale position that arrives NOW beats a perfect one that arrives late. Games send fresh position updates constantly, so a lost one is instantly replaced — meaning TCP's re-sending of old positions would actually make gameplay feel *worse*."},{"id":"hiw-4-5","type":"fill_blank","prompt":"The core tradeoff between TCP and UDP: TCP gives you reliability, UDP gives you ______.","choices":["speed","security","storage","encryption"],"answer":0,"why":"TCP trades speed for guaranteed, ordered delivery; UDP trades those guarantees for raw speed. Neither is 'better' — the right choice depends entirely on what your system values most, and making that judgment *is* system design."},{"id":"hiw-4-6","type":"multiple_choice","prompt":"You've now traced a request end to end. Which statement best captures how the internet moves your data?","choices":["One connection sends the whole file at once with no addressing","Data is split into packets, addressed by IP, routed hop-by-hop, and reassembled","A central server copies data directly to your screen","The browser stores everything locally and never contacts a server"],"answer":1,"why":"That's the whole picture: split into packets, addressed with IPs (found via DNS), routed hop-by-hop by routers, and reassembled — reliably with TCP or fast with UDP. Everything else in this course — caching, load balancing, databases — is built on this foundation."}]}]};

const UNIT2 = {"unitId":"client-server-http","title":"Client–Server & HTTP","subtitle":"How your app talks to a server — and why it scales","lessons":[{"id":"csh-1","title":"Ask and answer","exercises":[{"id":"csh-1-0","type":"concept","title":"Your phone owns almost none of the app — it just knows how to ask","viz":{"nodes":[{"id":"p1","label":"Your phone","col":0,"kind":"client"},{"id":"p2","label":"A laptop","col":0,"kind":"client"},{"id":"p3","label":"Someone else","col":0,"kind":"client"},{"id":"s","label":"Server","sub":"for millions","col":1,"kind":"server"}],"edges":[{"from":"p1","to":"s"},{"from":"p2","to":"s"},{"from":"p3","to":"s"}]},"body":"The app on your phone is mostly a way of asking. It holds the buttons and the layout; the posts, the likes and the follower counts live on someone else's machine. Open the app and it sends a *request* across the network; a server sends back a *response* carrying the data. The machine that asks is the client. The machine that answers is the server.","note":"Client and server are roles, not machines. Your own server becomes a client the second it calls a payments service — the roles nest, all the way down."},{"id":"csh-1-1","type":"multiple_choice","prompt":"You open a social app and your feed appears. Where did that data physically come from the instant you opened it?","choices":["It was already fully stored on your phone","Your phone asked a server, and the server answered","Another user's phone sent it straight to you","The app store pushed it"],"answer":1,"why":"This is the client–server model: your phone (the client) sends a request, and a server sends back a response. Your phone stores almost none of the data — it just knows how to ask. One server answers millions of clients, and that asymmetry — few servers, many clients — is the shape of almost every system you'll design."},{"id":"csh-1-2","type":"fill_blank","prompt":"The machine that asks is the ______; the machine that answers is the server.","choices":["client","router","cache","proxy"],"answer":0,"why":"Client = asks, server = answers. They're roles rather than fixed machines: a 'server' is itself a 'client' of another server whenever it calls one, so your API server calling a payments API is a client in that conversation. The roles nest."},{"id":"csh-1-3","type":"match_pairs","prompt":"Match each part of an HTTP request to its job.","pairs":[{"left":"Method","right":"What you want to do (`GET`, `POST`)"},{"left":"Path","right":"Which resource (`/users/42`)"},{"left":"Headers","right":"Metadata about the request"},{"left":"Body","right":"The data you're sending"}],"why":"Every request is: a method (the verb), a path (the noun), headers (context), and an optional body (the payload). A `GET` usually has no body — it just names what it wants — while a `POST` carries its data in the body. HTTP/1.1 is plain text under the hood, so you could type a request by hand; HTTP/2 and HTTP/3 pack those same four parts into binary frames instead, which you couldn't. The anatomy doesn't change — only the encoding does."},{"id":"csh-1-4","type":"order_steps","prompt":"Order one request/response round trip.","steps":["Client builds an HTTP request","Client sends it to the server","Server processes the request","Server builds a response","Client receives and renders it"],"why":"Ask, travel, process, answer, render — the loop behind every screen you've ever loaded. The 'travel' step includes the network round trips from unit 1, and on HTTPS a TLS handshake happens first to encrypt everything."},{"id":"csh-1-5","type":"multiple_choice","prompt":"You send one request, then another. By default, does the server remember your first request when handling the second?","choices":["Yes — servers always remember","No — each HTTP request is independent (stateless)","Only if both are `GET` requests","Only if they're within one second"],"answer":1,"why":"HTTP is stateless: by default each request stands entirely on its own, and the server doesn't inherently remember the last one. So how does staying logged in work? The client re-sends proof — a cookie or token — on every single request. State lives with the client or in a shared store, *not* in one server's memory, and that fact is this unit's boss lesson."},{"id":"csh-1-6","type":"multiple_choice","prompt":"Which statement best captures what HTTP is?","choices":["A database that stores your data","A stateless request/response protocol for clients and servers to talk","A programming language for servers","A type of physical cable"],"answer":1,"why":"HTTP is the agreed language of the web: a stateless protocol where clients make requests and servers return responses."}]},{"id":"csh-2","title":"The verbs: HTTP methods","exercises":[{"id":"csh-2-0","type":"concept","title":"Every request says what it wants done in one word, before it says to what","body":"An HTTP request opens with a verb, and only then says what it's for: `GET /users/42`, `POST /users`, `PUT /users/42`, `DELETE /users/42`. The path names the thing; the method declares your intent toward it. That verb isn't decoration — browsers, caches and crawlers all decide how to treat a request by reading it alone.","note":"`GET` is meant to be *safe* — read-only — so the web fires them at you unasked: crawlers, prefetchers, link previews. Hide a delete behind a `GET` and something will eventually crawl your data away."},{"id":"csh-2-1","type":"multiple_choice","prompt":"You want to fetch a user's profile without changing anything. Which method?","choices":["`GET`","`POST`","`DELETE`","`PUT`"],"answer":0,"why":"`GET` reads data and shouldn't change anything on the server — it's the default 'just show me' verb. Because `GET` is *safe*, crawlers and browser prefetchers fire them freely, which is why you must never hide a state-changing action (like `/delete?id=42`) behind a `GET`. A crawler following links could wipe your data, and this has genuinely happened to real companies."},{"id":"csh-2-2","type":"match_pairs","prompt":"Match each method to its intent.","pairs":[{"left":"`GET`","right":"Read a resource"},{"left":"`POST`","right":"Create a new resource"},{"left":"`PUT`","right":"Replace a resource"},{"left":"`DELETE`","right":"Remove a resource"}],"why":"`GET` reads, `POST` creates, `PUT` replaces, `DELETE` removes — the method tells the server your intent. `PUT` replaces the whole resource while `PATCH` updates just part of it, and choosing precisely is what makes an API predictable."},{"id":"csh-2-3","type":"multi_select","prompt":"Which of these methods are expected to change state on the server? Select all.","choices":["`GET`","`POST`","`PUT`","`DELETE`"],"answer":[1,2,3],"why":"`POST`, `PUT`, and `DELETE` modify server state, while `GET` (and `HEAD`, `OPTIONS`) are *safe* — they only read. Because `GET` is safe, it's cacheable and retryable with zero risk, and that single property is why the web can cache so aggressively."},{"id":"csh-2-4","type":"multiple_choice","prompt":"Your `DELETE /users/42` request times out and you don't know if it worked. Is it safe to just send it again?","choices":["Yes — deleting twice leaves the same result as deleting once","No — you might delete two different users","No — `DELETE` can never be retried","Only if you switch to `GET` first"],"answer":0,"why":"`DELETE` is *idempotent*: `DELETE /users/42` twice still leaves user 42 gone, so the end state is the same and retrying is safe. Idempotent means doing it again lands you in the same state — `GET`, `PUT`, and `DELETE` qualify; `POST` doesn't. This is the backbone of reliable distributed systems, because networks fail mid-request constantly and retries are unavoidable."},{"id":"csh-2-5","type":"multiple_choice","prompt":"A `POST /payments` request times out. You don't know if the charge went through. Retrying blindly risks charging the customer twice. What's the fix?","choices":["Just retry — it's probably fine","Send an idempotency key so the server recognizes the retry and doesn't repeat the charge","Never retry payments, ever","Change it to a `GET` request"],"answer":1,"why":"An idempotency key is a unique id the client attaches to the request: if the server sees the same key twice, it returns the original result instead of charging again — making an unsafe `POST` safe to retry. This is exactly how Stripe works, via an `Idempotency-Key` header, and any system with money or side effects needs the pattern."},{"id":"csh-2-6","type":"fill_blank","prompt":"An operation is ______ if performing it many times has the same effect as performing it once.","choices":["idempotent","stateless","asynchronous","encrypted"],"answer":0,"why":"Idempotent operations are safe to retry — critical, because in a distributed system retries are not optional."}]},{"id":"csh-3","title":"Reading status codes","exercises":[{"id":"csh-3-0","type":"concept","title":"The first digit of a status code tells you whose fault it is","body":"Every HTTP response opens with a three-digit verdict, and you read the first digit rather than memorize the rest. `2xx`: it worked. `3xx`: go look somewhere else. `4xx`: your request was wrong. `5xx`: the server broke trying. Learn those four classes and you can read a code you've never seen before — the last two digits only narrow down the reason.","note":"That first digit is a blame line, and monitoring lives on it: a spike in `5xx` wakes an engineer at 3am, while a spike in `4xx` means your callers are confused, misconfigured — or attacking you."},{"id":"csh-3-1","type":"multiple_choice","prompt":"A server replies with `200`. At a glance, what does that number tell you?","choices":["The response size","The request succeeded","The user's id","The latency in ms"],"answer":1,"why":"Status codes are the server's one-glance verdict on your request: `200` = OK, it worked. The first digit is everything — `2xx` success, `3xx` redirect, `4xx` you (the client) messed up, `5xx` I (the server) messed up. Learn the classes and you can read any code you've never seen."},{"id":"csh-3-2","type":"match_pairs","prompt":"Match each status code to its meaning.","pairs":[{"left":"`200 OK`","right":"Success"},{"left":"`301 Moved Permanently`","right":"Redirect to a new URL"},{"left":"`404 Not Found`","right":"That resource doesn't exist"},{"left":"`500 Internal Server Error`","right":"The server broke"}],"why":"One code from each class: `2xx` worked, `3xx` go elsewhere, `4xx` your request was wrong, `5xx` the server failed. Two more you'll use constantly: `201 Created` (a `POST` made something new) and `204 No Content` (success, nothing to return — perfect for a `DELETE`)."},{"id":"csh-3-3","type":"multi_select","prompt":"Which of these are CLIENT errors (the caller's fault)? Select all.","choices":["`400 Bad Request`","`401 Unauthorized`","`404 Not Found`","`503 Service Unavailable`"],"answer":[0,1,2],"why":"`4xx` codes blame the request; `5xx` codes blame the server, and `503` is a server-side 'I can't handle this right now'. Don't confuse `401` and `403`: `401 Unauthorized` really means *I don't know who you are* (not authenticated), while `403 Forbidden` means *I know who you are, and you're not allowed*."},{"id":"csh-3-4","type":"multiple_choice","prompt":"Your service is getting hammered with more traffic than it can handle. Which status code politely tells clients to slow down?","choices":["`404 Not Found`","`429 Too Many Requests`","`200 OK`","`301 Moved Permanently`"],"answer":1,"why":"`429 Too Many Requests` is the rate-limiting signal, and well-behaved clients back off when they see it — often honouring a `Retry-After` header you send. Pair it with exponential backoff on the client (wait 1s, then 2s, then 4s), because without backoff clients retry instantly in unison and create a thundering herd that keeps the service down."},{"id":"csh-3-5","type":"multiple_choice","prompt":"Your app sits behind a load balancer. Users start seeing `502` and `504` errors. Where is the problem most likely?","choices":["In the users' browsers","Downstream of the load balancer — the app servers are failing or too slow","In DNS","In the users' wifi"],"answer":1,"why":"`502 Bad Gateway` means the load balancer got a broken response from the app behind it; `504 Gateway Timeout` means the app didn't respond in time. Both point downstream — the app or database, not the balancer or the client. This is why status codes are gold during an incident: `502`/`504` → look at the app tier, `503` → the service is shedding load, `500` → an unhandled crash in your code."},{"id":"csh-3-6","type":"multiple_choice","prompt":"A user requests `GET /orders/99999`, but no such order exists. What should the server return?","choices":["`200 OK` with an empty body","`404 Not Found`","`500 Internal Server Error`","`403 Forbidden`"],"answer":1,"why":"The resource genuinely doesn't exist and the client's request was well-formed — a textbook `404`. Returning `200` for a missing resource lies to the client and breaks caching and error handling. The honest code matters because monitoring, retries, and caches all make decisions from it: a `500` here would page an engineer for a non-bug, and a `200` would hide a real 'not found'."}],"fieldTask":{"where":"Browser","seconds":30,"do":"Right-click any page → Inspect → Network tab → reload","alt":"Click any row to see its status code, method, and headers","notice":"You're watching real requests: dozens per page, each with a method and a status code. Look for a `200`, then hunt for a `304` — that's the browser being told 'you already have this', which is why the reload felt instant."}},{"id":"csh-4","title":"Stateless HTTP at scale","exercises":[{"id":"csh-4-0","type":"concept","title":"HTTP forgets you between every single request","viz":{"nodes":[{"id":"c","label":"You","col":0,"kind":"client"},{"id":"lb","label":"Load balancer","col":1,"kind":"lb"},{"id":"s1","label":"App Server 1","col":2,"kind":"server"},{"id":"s2","label":"App Server 2","col":2,"kind":"server"},{"id":"s3","label":"App Server 3","col":2,"kind":"server"}],"edges":[{"from":"c","to":"lb"},{"from":"lb","to":"s1"},{"from":"lb","to":"s2"},{"from":"lb","to":"s3"}]},"body":"Each HTTP request arrives as a complete stranger. The server reads it, answers it, and keeps no memory of the conversation — everything it needed to answer was inside the request itself. That's what *stateless* means. It sounds like a limitation. It's the opposite: it's the property that decides how far a system can grow.","note":"Which raises the obvious question: if the server forgets you the instant it replies, how are you still logged in? Something has to re-prove who you are on *every* request — and it can't be the server's memory."},{"id":"csh-4-1","type":"multiple_choice","prompt":"A big service runs thousands of identical web servers behind one load balancer, and each of your requests may hit a different server — yet everything works. Why is that possible?","choices":["The servers share one block of memory","HTTP is stateless, so any server can handle any request","Your requests secretly always hit the same server","The load balancer copies your data to every server"],"answer":1,"why":"Because each request carries everything needed to serve it (like an auth token), any interchangeable server can handle it — statelessness is what makes horizontal scaling possible. The moment a server stores your session in its own local memory, servers stop being interchangeable: now the load balancer must pin you to that one machine, and if it dies, your session dies with it."},{"id":"csh-4-2","type":"multiple_choice","prompt":"If servers remember nothing between requests, where does your logged-in session actually live?","choices":["Nowhere — you re-login every request","In the client (a cookie/token it re-sends), or in a shared store like Redis","Inside the load balancer","In DNS"],"answer":1,"why":"State moves out of the server: either the client carries it (a token sent on every request) or it lives in a shared store all servers can read — never in one server's local RAM. The two common patterns are a self-contained token (JWT) the client carries, or a session id the client carries that servers look up in a shared cache. Both keep the servers stateless and interchangeable."},{"id":"csh-4-3","type":"build_diagram","prompt":"Place the missing piece so any app server can serve any request without losing the user's session.","viz":{"nodes":[{"id":"a1","label":"App Server 1","col":0,"kind":"server"},{"id":"a2","label":"App Server 2","col":0,"kind":"server"},{"id":"h","col":1,"hole":true}],"edges":[{"from":"a1","to":"h"},{"from":"a2","to":"h"}]},"palette":["Shared Cache (Redis)","A bigger CPU","A second load balancer"],"answer":{"h":"Shared Cache (Redis)"},"why":"A shared store that every app server reads from keeps sessions out of local memory, so the servers stay stateless and interchangeable. This is the standard fix for 'randomly logged out' bugs: move session state to a shared cache and it stops mattering which server you land on."},{"id":"csh-4-4","type":"multi_select","prompt":"Opening a fresh TCP + TLS connection for every single request is expensive. Which of these reduce that cost? Select all.","choices":["Keep-alive: reuse one connection for many requests","HTTP/2 multiplexing: many requests in flight on one connection","Opening a brand-new connection for every image","HTTP/3 over QUIC: avoids TCP-level head-of-line blocking"],"answer":[0,1,3],"why":"Reusing connections (keep-alive) and multiplexing (HTTP/2, HTTP/3) amortize the handshake cost across many requests; opening a fresh connection each time is the problem, not a fix. In practice HTTP/1.1 handles one request at a time per connection — the spec does define pipelining, but responses still have to come back in order, so browsers disable it — and a slow response blocked everything queued behind it (head-of-line blocking). HTTP/2 multiplexes many over one connection, and HTTP/3 moves to QUIC over UDP to fix blocking that still happened at the TCP layer."},{"id":"csh-4-5","type":"multiple_choice","prompt":"Your API serves a user avatar that rarely changes. How do you avoid re-sending the same bytes on every request?","choices":["You can't — you must resend it each time","Use `Cache-Control` + an `ETag`: the client asks 'still current?' and the server can reply `304 Not Modified` with no body","Make the image smaller each time","Serve it over `POST`"],"answer":1,"why":"With an `ETag` (a fingerprint of the content), the client sends 'I have version X — changed?' and the server can answer `304 Not Modified` with an empty body, so the same bytes are never re-sent. Those `304` responses are a huge part of why repeat page loads feel instant — the browser revalidates cheaply and skips the download entirely."},{"id":"csh-4-6","type":"tradeoff_slider","prompt":"Auth for a high-security banking app. Self-contained JWTs let any server validate locally (great for scale) but are hard to revoke before they expire. Redis-backed sessions are instantly revocable but every request hits the store. Slide toward your default here.","leftLabel":"JWT (scales, hard to revoke)","rightLabel":"Redis sessions (revocable, central)","answerRange":[55,100],"why":"For high-security, instant revocation usually wins — if a token is stolen you must be able to kill it NOW, and a central session store gives you that at the cost of a lookup per request. Many real systems combine both: short-lived JWTs (minutes) plus a revocation check, getting most of JWT's scale while limiting how long a stolen token stays valid."},{"id":"csh-4-7","type":"multiple_choice","prompt":"Users randomly get logged out, but only during high traffic. The setup: app servers store sessions in their own local memory, behind a round-robin load balancer. What's happening, and what's the fix?","choices":["DNS is misconfigured — flush the cache","Round-robin sends you to servers that don't have your in-memory session → move sessions to a shared store so servers are stateless","The database ran out of disk — add storage","The users' tokens expired — shorten the timeout"],"answer":1,"why":"Under load the balancer spreads you across many servers, and whenever you land on one that doesn't hold your in-memory session you appear logged out — making the servers stateless fixes it permanently. The band-aid is sticky sessions (pin each user to one server), but that undermines load balancing and fails when a server dies. Stateless servers plus a shared session store is the scalable cure, and it's why stateless HTTP is what lets systems grow."}]}]};

const UNIT3 = {"unitId":"apis","title":"APIs","subtitle":"The contract programs use to talk — and how it survives strangers","lessons":[{"id":"api-1","title":"The contract","exercises":[{"id":"api-1-0","type":"concept","title":"Your app doesn't own the weather — it borrows it, one request at a time","viz":{"nodes":[{"id":"a","label":"Your app","col":0,"kind":"client"},{"id":"api","label":"Weather API","sub":"the contract","col":1,"kind":"server"},{"id":"db","label":"Their database","sub":"hidden","col":2,"kind":"db"}],"edges":[{"from":"a","to":"api"},{"from":"api","to":"db"}]},"body":"A weather app owns no satellites. A checkout page doesn't run a bank. They work by asking someone else's server, over the network, in a format that server has agreed to accept. That agreement is the API — Application Programming Interface: a published list of what you may ask, how to ask it, and what comes back. A contract between two programs.","note":"The contract is the part they can't take back. Once strangers build on it, it stops being yours to edit — an API you published in 2015 is an API you are still honouring today, bug for bug."},{"id":"api-1-1","type":"multiple_choice","prompt":"Your weather app shows tomorrow's forecast. It doesn't own any weather satellites. How does it get the data?","choices":["It guesses from your location","It calls someone else's API and asks for it","The data ships inside the app","It reads the weather company's database directly"],"answer":1,"why":"An API (Application Programming Interface) is a defined way for one program to ask another for data or actions — the weather app asks, a weather service answers. You use dozens of APIs a day without noticing: every app showing a map, taking a payment, or offering 'Sign in with Google' is calling someone else's API behind the scenes."},{"id":"api-1-2","type":"fill_blank","prompt":"An API is essentially a ______ between two programs: ask me this way, and I'll answer that way.","choices":["contract","database","cable","password"],"answer":0,"why":"An API is a contract: it defines what you can ask, how to ask it, and what you'll get back. The contract IS the product — the moment other people build on it, changing it breaks them, which is why API design decisions haunt you for years."},{"id":"api-1-3","type":"multiple_choice","prompt":"Why doesn't the weather company just let your app read their database directly?","choices":["Direct database access would be faster and better","An API hides their internals, enforces rules, and lets them change their database without breaking you","Databases physically can't be read by other programs","There's no real reason — it's just tradition"],"answer":1,"why":"The API is a boundary: it exposes what you may do and hides how it's done, and that freedom to change internals without breaking callers is the entire point. It's encapsulation at system scale — if clients touched the database directly, the provider could never change their schema, add authentication, or throttle abuse. The API is both the contract and the control point where you enforce auth, limits, and validation."},{"id":"api-1-4","type":"match_pairs","prompt":"Match each piece of an API to its job.","pairs":[{"left":"Endpoint","right":"A specific address you can call"},{"left":"JSON","right":"How the data is formatted"},{"left":"API key","right":"Proves who is calling"},{"left":"Documentation","right":"The contract, written down"}],"why":"An endpoint is where you ask, JSON is the shape of the answer, the key says who you are, and the docs are the contract made readable. Undocumented APIs get used wrong and then can never be changed, because nobody knows who depends on what — docs aren't a nicety, they're how the contract stays enforceable."},{"id":"api-1-5","type":"order_steps","prompt":"Order what happens in one API call.","steps":["App calls `GET /v1/weather?city=Pune`","Server checks the API key and validates the request","Server fetches the data it needs","Server returns JSON","App renders the forecast"],"why":"Ask at an endpoint → get authenticated and validated → the work happens → JSON comes back → the screen updates. Notice auth and validation happen *before* any real work: rejecting a bad or unauthorized request cheaply, before it touches your database, is a load-shedding tactic you'll reuse constantly."},{"id":"api-1-6","type":"multiple_choice","prompt":"Why did JSON become the default format for web APIs, beating XML?","choices":["It's a compact binary format","It's human-readable and maps directly onto data structures most languages already have","It's encrypted by default","It's much older and more established"],"answer":1,"why":"JSON is readable by humans and parses straight into objects, dicts, or maps in nearly every language — low friction beat XML's ceremony. But JSON is text, so it's easy rather than efficient: high-performance internal APIs often use binary formats like Protocol Buffers, which are far smaller and faster to parse at the cost of being unreadable to humans."}]},{"id":"api-2","title":"REST: designing around resources","exercises":[{"id":"api-2-0","type":"concept","title":"In REST the URL is a noun, because the verb is already in the method","body":"`GET /invoices/7`. The method says what you're doing; the path says what you're doing it to. That split is the whole idea of REST: give every *resource* an address, then let the HTTP verbs act on it. Put the action back into the path and you've said it twice — the method already carried the verb, and now the URL names nothing.","note":"A small fixed set of verbs, unlimited nouns. That's why a good REST API is guessable: see one resource addressed properly and you can work out the rest of them without opening the docs."},{"id":"api-2-1","type":"multiple_choice","prompt":"Which URL is the better-designed way to fetch user 42?","choices":["`/getUser?id=42`","`/users/42`","`/api/doGetUserData/42`","`/user/get/42`"],"answer":1,"why":"REST models nouns (resources), not verbs — the HTTP method already says what you're doing, so `GET /users/42` reads it and putting 'get' in the URL duplicates what `GET` already told us. The rule of thumb: URLs are nouns, methods are verbs. If your URL contains a verb, you're probably reinventing HTTP."},{"id":"api-2-2","type":"match_pairs","prompt":"Match each request to what it should do.","pairs":[{"left":"`GET /users`","right":"List users"},{"left":"`POST /users`","right":"Create a user"},{"left":"`GET /users/42`","right":"Fetch one user"},{"left":"`DELETE /users/42`","right":"Delete that user"}],"why":"One resource, four operations, separated purely by the HTTP method — that's REST in a nutshell. It's why REST scales as a mental model: a small fixed set of verbs applied to unlimited nouns, so learn the pattern once and you can guess any well-designed REST API."},{"id":"api-2-3","type":"multiple_choice","prompt":"You want to list the orders belonging to user 42. Which is the RESTful design?","choices":["`/getOrdersForUser?user=42`","`/users/42/orders`","`/orders/user/42/list`","`/fetchOrders?u=42`"],"answer":1,"why":"Nesting expresses the relationship — the orders that belong to user 42 — and it reads like the data model. But don't over-nest: `/users/42/orders/7/items/3/reviews` is a maintenance nightmare that couples your URLs to a rigid hierarchy. Two levels is a good ceiling; past that, expose the resource at its own top-level path and link by id."},{"id":"api-2-4","type":"multi_select","prompt":"Which of these are good REST practices? Select all.","choices":["Use plural nouns for collections (`/users`)","Put the action verb in the URL (`/createUser`)","Use HTTP methods to express the action","Return accurate HTTP status codes"],"answer":[0,2,3],"why":"Plural nouns, methods-as-verbs, and honest status codes are the core conventions; verbs in URLs are the anti-pattern because they duplicate the method. Conventions matter more than cleverness here — a predictable API is one a stranger can guess without reading docs, and guessability is a real feature."},{"id":"api-2-5","type":"multiple_choice","prompt":"REST APIs are stateless. What does that demand of every single request?","choices":["Nothing in particular","Each request must carry everything needed to serve it — the server remembers nothing from prior calls","Every request must be a `GET`","Requests must stay under 1KB"],"answer":1,"why":"Statelessness means each request stands alone: it carries its own auth and parameters, and the server holds no memory of your last call. It's the same property from unit 2, and it's why you can drop a REST API behind a load balancer with 500 interchangeable servers — statelessness isn't a REST nicety, it's what makes REST scale."},{"id":"api-2-6","type":"fill_blank","prompt":"In REST, URLs name ______, and HTTP methods express the action.","choices":["resources","functions","servers","errors"],"answer":0,"why":"Resources (nouns) live at URLs; methods (verbs) act on them. Separating the two is the whole design."}]},{"id":"api-3","title":"Pagination, versioning, and errors","exercises":[{"id":"api-3-0","type":"concept","title":"An endpoint that returns 'all of them' is fine right up until there are a lot of them","body":"`GET /users` looks harmless. It's one line, it takes no parameters, and it sails through review. What it actually promises is: *however many users exist, I will return all of them.* None of the code changes as your table grows. Only the size of the data does — and that's the shape of most scale bugs.","note":"Which is exactly why it ships. Your dev database has 100 rows and production has 50 million, so the endpoint passes every test it will ever face before it meets the data that kills it."},{"id":"api-3-1","type":"multiple_choice","prompt":"`GET /users` tries to return all 50 million users in one response. What breaks?","choices":["Nothing — it's just a big response","Almost everything: a huge payload, a brutal database query, timeouts, and memory blowups on both ends","Only the client's screen","Only DNS"],"answer":1,"why":"Unbounded collections are a production landmine — the query is slow, the payload enormous, the request times out, and both server and client can run out of memory. This is a classic incident shape: the endpoint was fine with 100 rows in dev and fell over at 10M in production. Rule: never expose an endpoint whose response size grows with your data."},{"id":"api-3-2","type":"multiple_choice","prompt":"So how do you return a large list safely?","choices":["Return it all but compress it","Paginate: return a bounded page plus a way to ask for the next one","Ask clients to be patient","Only allow admins to call it"],"answer":1,"why":"Pagination bounds the work per request: a fixed-size page plus a pointer to get the next one, so cost per call stays predictable no matter how big the dataset grows. Always enforce a maximum page size on the server — if a client can send `?limit=1000000`, you haven't actually bounded anything, you've just asked nicely."},{"id":"api-3-3","type":"multiple_choice","prompt":"Your feed paginates with `?offset=1000000&limit=20`. Two real problems appear at scale. Which describes them?","choices":["Offset pagination is always faster but uses more memory","Deep offsets get slow (the database must walk past every skipped row), and new inserts shift rows so users see duplicates or miss items","Offsets break encryption","There are no problems — offset is the standard"],"answer":1,"why":"`OFFSET` isn't free: to skip 1,000,000 rows the database generally has to traverse them, so deep pages get progressively slower — and if rows are inserted while you're paging, everything shifts and you re-see items or skip them entirely. The fix is cursor (keyset) pagination: instead of 'skip a million', you say 'give me 20 items after `id=X`'. The database jumps straight there using an index, so page 50,000 costs the same as page 1 — which is why every large feed hands you an opaque cursor instead of a page number."},{"id":"api-3-4","type":"multiple_choice","prompt":"You need to change what a field means in your public API. Third-party apps depend on it. What do you do?","choices":["Change it — clients will adapt","Version the API (`/v2`) or add a new field, while keeping the old behavior working","Delete the endpoint and start over","Change it, but email everyone first"],"answer":1,"why":"Once strangers depend on your contract, mutating it breaks their software with no warning — so you add alongside (a new field or version) and migrate people over time. The governing rule: you can add, you can't take away. Additive changes are safe because old clients ignore what they don't know about, and that asymmetry drives almost every real API evolution strategy."},{"id":"api-3-5","type":"multi_select","prompt":"Which of these changes would BREAK existing clients? Select all.","choices":["Adding a new optional field to the response","Removing a field","Renaming a field","Changing a field's type from string to number"],"answer":[1,2,3],"why":"Adding an optional field is safe — old clients simply ignore it — while removing, renaming, or retyping breaks anyone parsing it, instantly and silently. This is why the *expand, migrate, contract* pattern exists: first ADD the new field, then move clients over, and only remove the old one much later once nobody reads it. The contract step is the one teams forget to ever finish."},{"id":"api-3-6","type":"multiple_choice","prompt":"Your API returns `200 OK`, with `{\"error\": \"user not found\"}` in the body. Why is that a bad idea?","choices":["It isn't — the error is right there in the body","It lies: caches, monitoring, retries, and client error handling all key off the status code, so a `200` hides the failure","JSON can't represent errors","It's slower to parse"],"answer":1,"why":"The status code is the machine-readable verdict: saying `200` means success, so caches may store it, dashboards show healthy, and clients take the success path — while the request actually failed. Do both: return the honest status (`404`) AND a consistent error body like `{code, message}`. Consistency matters as much as correctness, because if every endpoint shapes errors differently, clients must write custom handling for each one."}]},{"id":"api-4","title":"APIs at scale","exercises":[{"id":"api-4-0","type":"concept","title":"A list is one call — then the screen needs one more for every row in it","viz":{"nodes":[{"id":"m","label":"Mobile app","col":0,"kind":"client"},{"id":"p","label":"`GET /posts`","sub":"1 · the list","col":1},{"id":"u","label":"`GET /users/{id}`","sub":"2 · once per row","col":1}],"edges":[{"from":"m","to":"p"},{"from":"m","to":"u"}]},"body":"A REST endpoint has a fixed shape, and a screen rarely wants exactly that shape. `GET /posts` returns posts — not the author names you need to draw beside them. So the app fetches the list, then fetches each author separately: 1 call becomes 1 + N. It has a name, the *N+1 problem*, and it's why a simple-looking mobile screen can feel slow.","note":"Every one of those calls can be fast and the screen still crawls. The cost isn't the work, it's the trips — so the fix usually starts with making fewer round trips, not quicker ones."},{"id":"api-4-1","type":"multiple_choice","prompt":"A mobile screen shows 20 posts, each with its author's name. The app calls `GET /posts`, then `GET /users/{id}` for each post. How many requests is that?","choices":["1","2","21","20"],"answer":2,"why":"One request for the list, plus one per post = 21. This is the N+1 problem. Fire those 20 author calls one after another on a mobile network with ~100ms round trips and you wait over two seconds before anything renders. Fire them in parallel — which any decent client does — and you escape most of the waiting, but you still pay 20× the requests, 20× the server work, and the slowest one sets what the user feels. Chattiness is the number one killer of mobile API performance, and the fix is to let the server do the joining and return posts *with* their authors in one response."},{"id":"api-4-2","type":"multiple_choice","prompt":"Your `/users` endpoint returns a 40-field object, but the mobile list screen only needs name and avatar. What's the problem called?","choices":["Under-fetching","Over-fetching — you're burning bandwidth and battery shipping fields nobody uses","Caching","Sharding"],"answer":1,"why":"Over-fetching means the response carries far more than the caller needs — on mobile that's wasted bandwidth, slower parsing, and real battery cost. REST endpoints have fixed shapes, so the same endpoint is simultaneously too big for one screen and too small for another (forcing extra calls — under-fetching). That exact tension is precisely why GraphQL was invented."},{"id":"api-4-3","type":"match_pairs","prompt":"Match each API style to what it's best at.","pairs":[{"left":"REST","right":"Simple, cacheable, fixed response shapes"},{"left":"GraphQL","right":"Client asks for exactly the fields it needs"},{"left":"gRPC","right":"Fast binary protocol for service-to-service calls"}],"why":"REST is the simple, cacheable default; GraphQL solves over/under-fetching by letting clients specify the shape; gRPC trades human-readability for speed between your own services. None is 'best' — they're answers to different questions: REST for public APIs, GraphQL when different clients need wildly different slices of data, gRPC for internal hops where nobody's reading the payload and latency is the whole game."},{"id":"api-4-4","type":"tradeoff_slider","prompt":"You're designing a PUBLIC API for third-party developers you've never met. Slide toward the style you'd default to.","leftLabel":"REST (simple, cacheable)","rightLabel":"GraphQL (flexible queries)","answerRange":[0,40],"why":"For a public API consumed by strangers, REST usually wins: trivial to learn, works with HTTP caching and CDNs, and easy to rate-limit per endpoint. GraphQL's flexibility becomes a liability — arbitrary nested queries are hard to cache, hard to rate-limit, and easy to weaponize into an expensive query. GitHub famously offers both, and the split is instructive: GraphQL shines for FIRST-party clients you control, where flexibility pays for itself."},{"id":"api-4-5","type":"multi_select","prompt":"Your public API has to survive third-party developers. Which of these protect you? Select all.","choices":["Rate limiting per client","Pagination on every collection","Versioning the contract","Letting clients request unlimited nested data"],"answer":[0,1,2],"why":"Limits, bounded pages, and a versioned contract are your seatbelts; unlimited nested queries are the opposite — they hand callers a way to make you do unbounded work. An API is a promise made to strangers, and every unbounded thing you expose will eventually be abused, usually by accident via someone's runaway retry loop long before any malice shows up."},{"id":"api-4-6","type":"build_diagram","prompt":"Your mobile app makes 21 chatty calls per screen. Add the piece that lets it make ONE call and get a tailored response.","viz":{"nodes":[{"id":"m","label":"Mobile App","col":0,"kind":"client"},{"id":"h","col":1,"hole":true},{"id":"p","label":"Posts svc","col":2,"kind":"server"},{"id":"u","label":"Users svc","col":2,"kind":"server"}],"edges":[{"from":"m","to":"h"},{"from":"h","to":"p"},{"from":"h","to":"u"}]},"palette":["API Gateway / BFF","Another database","A second mobile app"],"answer":{"h":"API Gateway / BFF"},"why":"A gateway (or Backend-for-Frontend) sits in front, makes the many internal calls server-side, and returns one response shaped for that screen — turning 21 phone round trips into 1. The internal calls still happen, but over a fast datacenter network instead of a phone's 100ms hops. That's the BFF pattern: a thin server-side layer shaped for one specific client, giving you GraphQL-like tailoring while keeping plain REST services underneath."},{"id":"api-4-7","type":"multiple_choice","prompt":"Your public REST API is slow for mobile and partners complain payloads are huge — but you cannot break the thousands of existing integrations. What's the best move?","choices":["Change the response shape to be leaner — clients will adapt","Add a new tailored endpoint (new version, or a BFF for mobile) while leaving the existing contract untouched","Remove the unused fields to slim it down","Migrate every client to GraphQL immediately"],"answer":1,"why":"You can't mutate a contract that strangers depend on — slimming fields or reshaping responses is a breaking change no matter how much better the new shape is. You add alongside: a versioned endpoint or a BFF tailored for mobile, and migrate gradually. This is the whole unit in one decision: an API is a contract, the contract outlives your opinions about it, and evolving it without breaking anyone is the actual senior skill."}]}]};
