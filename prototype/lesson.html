const UNIT10 = {"unitId":"replication","title":"Replication","subtitle":"Copies of the database — what they buy, and what they charge","lessons":[{"id":"rep-1","title":"Why copy the database?","exercises":[{"id":"rep-1-0","type":"concept","title":"A read can be answered by any copy; a write has to be applied by all of them","viz":{"nodes":[{"id":"a","label":"App","col":0,"kind":"server"},{"id":"d1","label":"Database","sub":"writes","col":1,"kind":"db"},{"id":"d2","label":"Copy","sub":"reads","col":2,"kind":"db"},{"id":"d3","label":"Copy","sub":"reads","col":2,"kind":"db"}],"edges":[{"from":"a","to":"d1"},{"from":"a","to":"d2"},{"from":"a","to":"d3"},{"from":"d1","to":"d2","dash":true},{"from":"d1","to":"d3","dash":true}]},"body":"*Replication* means keeping full copies of your database on other machines. A read is a question, and any complete copy can answer it. A write is a change, and every copy must apply it or it stops being a copy. That asymmetry is the whole of replication: reading is work you can spread out, writing is work you have to repeat.","note":"There's a second reason to keep copies, and it has nothing to do with capacity: a copy is a machine that still has your data after the first stops existing. Read scaling is why replicas get added; that is why they stay."},{"id":"rep-1-1","type":"multiple_choice","prompt":"Your app does 100 reads for every write, and your single database is drowning in reads. What's the structural fix?","choices":["Buy a bigger machine, forever","Add copies (replicas) that serve reads, leaving the original to handle writes","Delete old data","Add more indexes"],"answer":1,"why":"Reads can be served from any copy, so adding read replicas multiplies your read capacity without changing how writes work at all. This only pays off because reads outnumber writes so heavily — happily true of most applications — which makes the read:write ratio the first number to establish before proposing replication: at 100:1 it's transformative, at 1:1 it buys you almost nothing."},{"id":"rep-1-2","type":"multiple_choice","prompt":"The second reason to keep copies: your database machine dies at 3am. What does having a replica let you do?","choices":["Nothing — you still restore from backup","Promote a replica to take over, so you stay online instead of waiting on a restore","Automatically prevent the failure","Recover data faster from the dead disk"],"answer":1,"why":"A replica is already running and already has (nearly) all the data, so promoting it takes seconds while restoring a backup takes hours. Backups and replicas solve different problems and don't substitute for each other: a replica protects you from a machine dying, while a backup protects you from someone running `DELETE` without a `WHERE` clause — because a replica would have faithfully replicated that too, instantly."},{"id":"rep-1-3","type":"multi_select","prompt":"What does replication actually buy you? Select all.","choices":["More read capacity","Survival when a machine dies","More write capacity","Serving users from a geographically closer copy"],"answer":[0,1,3],"why":"Reads, survival, and locality — yes. Write capacity — no: every write still has to be applied on every copy, so copies never reduce the write load. That asymmetry is the most important fact about replication and the reason sharding exists as a separate idea: if your bottleneck is writes, adding replicas makes things slightly worse, because you've added machines that all have to do every write and none that do fewer."},{"id":"rep-1-4","type":"fill_blank","prompt":"Replication scales ______; it does nothing for write capacity.","choices":["reads","writes","storage","backups"],"answer":0,"why":"Any copy can answer a read. Every copy must perform every write."},{"id":"rep-1-5","type":"multiple_choice","prompt":"The moment you have two copies of the database, what have you inherited?","choices":["Nothing — it's a pure win","The copies can disagree, so you now own a consistency problem","Only extra storage cost","Slower reads"],"answer":1,"why":"One copy can't disagree with itself; two can drift apart, and now you must decide what happens when a reader lands on the copy that's behind. This is unit 5's rule — every copy costs you a consistency question — arriving at industrial scale, and everything difficult in the rest of this unit is that one bill being itemized."},{"id":"rep-1-6","type":"multiple_choice","prompt":"When is replication the WRONG tool for your scaling problem?","choices":["When you have lots of reads","When writes are your bottleneck, or your dataset no longer fits on one machine","When you need high availability","When users are spread across regions"],"answer":1,"why":"Replication addresses read volume and machine failure — it doesn't reduce write load, and it doesn't make the data smaller, since every copy holds the whole dataset. Both of those limits point at the same successor idea: splitting the data across machines rather than duplicating it. That's sharding, and it's the other half of the scaling story."}]},{"id":"rep-2","title":"Leader and followers","exercises":[{"id":"rep-2-0","type":"concept","title":"There is no arbiter, so somebody has to be the authority","viz":{"nodes":[{"id":"c","label":"Writes","col":0,"kind":"client"},{"id":"l","label":"Leader","sub":"only writer","col":1,"kind":"db"},{"id":"log","label":"Replication log","sub":"ordered","col":2},{"id":"f1","label":"Follower","sub":"read-only","col":3,"kind":"db"},{"id":"f2","label":"Follower","sub":"read-only","col":3,"kind":"db"}],"edges":[{"from":"c","to":"l"},{"from":"l","to":"log"},{"from":"log","to":"f1"},{"from":"log","to":"f2"}]},"body":"Every copy in a replicated system is equally real and equally ignorant: it knows what it was told, and nothing about what the others were told at the same instant. Nobody can referee. So the standard design doesn't referee — it removes the need for one. Nominate one copy, the *leader*, as the only one allowed to accept a write; the rest are *followers*.","note":"Postgres ships its write-ahead log, the crash-recovery log it already had to write. MySQL writes a *separate* binlog purely for replication — an extra write per transaction. Same idea, different bill."},{"id":"rep-2-1","type":"multiple_choice","prompt":"Suppose any copy could accept writes. What breaks?","choices":["Nothing — it'd be faster","Two copies could accept conflicting writes to the same row, and there'd be no single right answer","Reads would slow down","The copies would run out of disk"],"answer":1,"why":"Two writers, one row, two different values — and nothing to arbitrate between them, so someone has to be the authority. Which is why the standard design nominates exactly one copy to accept writes: the leader. Single-leader replication is the default in Postgres, MySQL, and most systems precisely because it dodges write conflicts by construction — with one writer, there is nothing to conflict."},{"id":"rep-2-2","type":"match_pairs","prompt":"Match each piece of single-leader replication to its role.","pairs":[{"left":"Leader","right":"The only copy that accepts writes"},{"left":"Follower","right":"A read-only copy kept in sync"},{"left":"Replication log","right":"The stream of changes the leader ships"},{"left":"Failover","right":"Promoting a follower when the leader dies"}],"why":"One writer, many readers, a stream of changes between them, and a plan for when the writer dies. Notice the shape: the leader is a single point of failure for WRITES but not for reads, and that asymmetry drives everything in lesson 4 — losing the leader is an emergency, losing a follower is a Tuesday."},{"id":"rep-2-3","type":"multiple_choice","prompt":"How does a follower stay in sync with the leader?","choices":["It re-runs the application code","The leader ships its stream of changes — its log — and the follower applies them in the same order","It copies the database files every night","It queries the leader constantly"],"answer":1,"why":"The leader sends an ordered stream of changes and the follower replays them in that exact order, arriving at the same state. In Postgres that's the write-ahead log from unit 6 doing a second job: it exists for crash recovery, but an ordered record of every change turns out to be exactly what you'd want to ship to another machine — so replication rides on a log the database already had to write anyway."},{"id":"rep-2-4","type":"order_steps","prompt":"Order a write under asynchronous single-leader replication.","steps":["Client sends the write to the leader","Leader records the change in its log","Leader responds 'done' to the client","Followers stream the log and apply the change","Followers can now serve the new data"],"why":"Under asynchronous replication the leader answers the client before the followers have caught up — the client's write is done while the copies are still catching up. Look closely at step 3 landing before step 4: that ordering is the entire source of the next two lessons, because it's why followers can be stale, and why a leader dying at exactly that moment can lose a write it already called successful."},{"id":"rep-2-5","type":"multiple_choice","prompt":"The leader can wait for a follower to confirm before telling the client 'done' (synchronous), or reply immediately and let followers catch up (asynchronous). What does synchronous buy and cost?","choices":["It's faster and safer — strictly better","The write exists on two machines before you're told it succeeded — but every write now waits for the follower, and if that follower is down, writes stall","It only affects reads","It buys nothing; it's a legacy option"],"answer":1,"why":"You're buying the guarantee that an acknowledged write exists in two places, and paying with latency on every write plus a dependency on the follower being alive. This is why fully synchronous replication to ALL followers is rare — one slow or dead follower would halt every write. The usual compromise is semi-synchronous: one follower synchronous, so that *while it's healthy* an acknowledged write has already reached a second machine, with the rest asynchronous. Read that 'while it's healthy' literally — implementations typically fall back to async if the synchronous follower goes away, which is exactly when you'd have wanted it."},{"id":"rep-2-6","type":"multiple_choice","prompt":"Why is single-leader replication so common, despite the leader being a bottleneck for writes?","choices":["It's the fastest possible design","Because having exactly one writer removes write conflicts entirely — a huge simplification for a cost most apps can afford","Because it uses less disk","It's the only design that exists"],"answer":1,"why":"It trades write scalability — which most apps don't need — for the elimination of an entire category of problem, which is usually a superb deal. Keep this pattern in view: a huge amount of system design is buying simplicity with a constraint you can afford. One writer is a real limit, and it's also why you never have to answer 'which of these two conflicting values is correct?'"}]},{"id":"rep-3","title":"Replication lag","exercises":[{"id":"rep-3-0","type":"concept","title":"A follower always shows you the past — the only question is how far back","viz":{"nodes":[{"id":"u","label":"User","col":0,"kind":"client"},{"id":"l","label":"Leader","sub":"has the write","col":1,"kind":"db"},{"id":"f","label":"Follower","sub":"not yet","col":2,"kind":"db"}],"edges":[{"from":"u","to":"l"},{"from":"l","to":"f","dash":true},{"from":"u","to":"f"}]},"body":"Under asynchronous replication the leader answers the client *before* the followers have the change. So every write opens a window: for some interval the leader has it and the followers don't. A read routed to a follower inside that window is answered by a database that hasn't heard the news. That window is *replication lag*.","note":"Lag isn't a constant you can look up or a number you can design around. It's a race between how fast the leader produces changes and how fast a follower applies them — so it isn't the number it was a minute ago."},{"id":"rep-3-1","type":"multiple_choice","prompt":"A user updates their profile (write goes to the leader), the page reloads, and the read is served by a follower that hasn't caught up yet. What do they see?","choices":["Their new profile","Their OLD profile — their own change appears to have vanished","An error","A blank page"],"answer":1,"why":"The follower is behind, so it answers with the state from before their write and the user's own change seems not to have saved. This is the most common replication bug there is, and it's maddening because it only reproduces under load — when lag is large enough to notice. The usual mitigation is read-your-writes routing: for a short window after a user writes, send THAT user's reads to the leader. Hold it as a mitigation rather than a guarantee — it works while the leader stays the leader, and if a failover lands inside that window an async setup may have lost the write outright, and no routing rule can show someone a write that no longer exists (lesson 4)."},{"id":"rep-3-2","type":"fill_blank","prompt":"The delay between a write landing on the leader and appearing on a follower is called replication ______.","choices":["lag","latency","drift","skew"],"answer":0,"why":"Replication lag is the size of the window in which followers are answering with the past."},{"id":"rep-3-3","type":"multiple_choice","prompt":"A user refreshes twice. The first read hits a caught-up follower and shows a new comment. The second hits a lagging follower and the comment is gone. What broke?","choices":["The comment was deleted","Monotonic reads — for that user, time appeared to run backwards","The leader failed","Their session expired"],"answer":1,"why":"Two reads, two replicas, two different amounts of lag — so the second read returned an older state than the first. Nothing was deleted; the user just travelled backwards. The usual mitigation is to pin each user to one replica (say by hashing their user id) so that *for as long as the pin holds*, their reads come from one copy that only ever moves forward. That clause is the whole caveat: the pin breaks when the replica dies, or when you pull it from rotation for lagging, and the user gets re-pinned to a copy that may be further behind — jumping them backwards anyway. Pinning narrows the window; it doesn't close it."},{"id":"rep-3-4","type":"multiple_choice","prompt":"When is replication lag at its worst?","choices":["At random, unpredictably","Exactly when write load is heaviest — the busiest moment, with the most people watching","Overnight, during backups","When there are few writes"],"answer":1,"why":"Lag grows when the leader produces changes faster than followers can apply them, and peak write traffic is precisely when that happens. That's the cruel part: your staleness window is widest exactly when the most users are looking, so a system that looks perfectly in sync in testing can be seconds behind during a spike — which is also when a support ticket becomes ten thousand support tickets."},{"id":"rep-3-5","type":"multi_select","prompt":"Which of these genuinely help with replication lag problems? Select all.","choices":["Route a user's reads to the leader right after they write","Pin each user to a single replica","Monitor lag and pull badly-lagging replicas out of rotation","Add more followers"],"answer":[0,1,2],"why":"Routing, pinning, and monitoring all attack the problem; adding followers doesn't, because each new follower must apply the very same stream of writes, so it lags too — and it adds load to the leader that's shipping to it. That last point catches people out: 'we're stale, add replicas' is the wrong reflex, since you've added more copies of the staleness rather than less of it. Lag is mostly a function of write throughput versus apply speed, and more followers usually changes neither. The exception is worth knowing: if replicas lag because read traffic is starving them of CPU, spreading that load across more of them can cut lag — but then your problem was replica load, not replication itself."},{"id":"rep-3-6","type":"multiple_choice","prompt":"You read from an asynchronous follower. What are you actually getting?","choices":["A guarantee the data is current","An answer that's correct as of some moment in the past — possibly right now, possibly seconds ago","A random value","An error if it's out of date"],"answer":1,"why":"A follower always gives you a real, valid state of the database — just not necessarily the latest one. It's a photograph, not a live feed. That distinction matters: a stale read isn't corrupt or wrong, it's late — which means the design question is never 'is this allowed to be wrong?' but 'how old is too old for this screen?', a question the product usually answers better than the engineer."}]},{"id":"rep-4","title":"Failover and the hard parts","exercises":[{"id":"rep-4-0","type":"concept","title":"Failover is decided by two facts you don't get to change","body":"The leader dies; you promote a follower. That's *failover*, and two facts you can't change decide everything about it. First: under asynchronous replication, \"the leader said done\" and \"a follower has it\" are different statements, separated by the lag window. Second: a dead leader and a merely slow one send you the same signal, which is none.","note":"So a failover policy is a timeout, and a timeout is a guess dressed as a config value. It's the same guess in every distributed system you'll touch: how long is too long to wait for something that might never answer?"},{"id":"rep-4-1","type":"multiple_choice","prompt":"Your leader dies and you promote a follower. With ASYNCHRONOUS replication, what might be lost?","choices":["Nothing — the follower has everything","Any writes the leader had already acknowledged but not yet shipped — those are simply gone","The entire database","Only reads in flight"],"answer":1,"why":"Asynchronous means the leader said 'done' before followers had the change, so if it dies in that window those acknowledged writes die with it. This is the under-appreciated asterisk in most setups: surviving a crash OF that machine is not the same as surviving the LOSS of that machine. Async replication is fast because it doesn't wait — and 'doesn't wait' is exactly what you're relying on not to matter at the worst possible moment."},{"id":"rep-4-2","type":"multiple_choice","prompt":"The leader isn't actually dead — it's just unreachable for 30 seconds. You promote a follower. Then the old leader comes back, still believing it's the leader. What now?","choices":["It automatically becomes a follower","Split brain: two leaders both accepting writes, producing conflicting data with no arbiter","Nothing — the network fixes it","The database refuses all writes"],"answer":1,"why":"Two nodes both convinced they're in charge, both taking writes — now you have two divergent versions of the truth and no principled way to merge them. This is why failover systems use fencing: forcibly locking the old leader out (sometimes by literally cutting its power) before promoting anyone. The reason it's necessary is uncomfortable — from the outside you genuinely cannot distinguish 'dead' from 'slow', so you can only pick a timeout and accept being wrong sometimes."},{"id":"rep-4-3","type":"multiple_choice","prompt":"So how should you set the failover timeout?","choices":["As short as possible — recover fast","As long as possible — never risk a false promotion","You're choosing which mistake to make: too short promotes during a harmless blip (risking split brain), too long leaves you down during a real failure","It doesn't matter"],"answer":2,"why":"There's no setting that's right in both directions, because the question 'is it dead or just slow?' has no answer from outside — you're picking which way you'd rather be wrong. Get comfortable with this shape, because it recurs constantly in distributed systems: when a decision is genuinely undecidable, engineering stops being about finding the right answer and starts being about choosing your failure mode deliberately, rather than discovering it during an incident."},{"id":"rep-4-4","type":"tradeoff_slider","prompt":"A financial ledger, where a write you've acknowledged must never be lost. Slide toward your replication mode.","leftLabel":"Synchronous (no lost writes, slower)","rightLabel":"Asynchronous (fast, may lose acked writes)","answerRange":[0,35],"why":"If losing an acknowledged write is unacceptable, the write has to exist on a second machine before you say 'done' — that's what synchronous means, and there's no way to have the guarantee without the wait. Notice you didn't get to have both: either the write waits for a second machine or it doesn't, and that's networks and physics rather than a setting someone forgot to optimize. Anyone promising you both is selling you an async system with a confident voice."},{"id":"rep-4-5","type":"multiple_choice","prompt":"Why not just let two datacenters each run a leader that accepts writes?","choices":["It's impossible","You can — but now two leaders can accept conflicting writes to the same row, and you must decide how to resolve those conflicts","It's free and strictly better","Only one datacenter can hold data"],"answer":1,"why":"Multi-leader buys write availability and local latency in each region, and pays for it with conflicts — the exact problem single-leader was designed to avoid. Which is why multi-leader stays rare for a single source of truth, and shows up where conflicts are naturally rare or genuinely resolvable: data partitioned per region, or collaborative editing where merging two edits is a solved problem rather than a coin flip."},{"id":"rep-4-6","type":"multiple_choice","prompt":"Users report that data they just saved disappears — but only during peak hours. Setup: writes go to the leader, reads are load-balanced across 3 async followers. Diagnosis?","choices":["The database is corrupt","Replication lag under peak write load — reads are landing on followers that are behind. Route reads to the leader for a window after a user writes","A DNS problem","The users' browsers are caching"],"answer":1,"why":"Peak write load widens the lag window, so a read right after a write is likely to hit a follower that hasn't applied it yet — nothing is lost, the follower is just answering from the past. The 'only during peak hours' detail is the tell, and it's worth learning to hear: a bug that appears only under load is usually a timing window that's always been there, finally grown wide enough to be visible."},{"id":"rep-4-7","type":"multiple_choice","prompt":"What's the honest summary of replication?","choices":["Replicas make you faster and safer, for free","Copies buy read capacity and survival, and charge you in lag, in writes lost on async failover, and in the risk of split brain","Replication is obsolete","Always replicate synchronously to everything"],"answer":1,"why":"Real benefits, real bill — and each cost is a direct consequence of the copy existing at all rather than a defect you can engineer away. Unit 5 said every copy costs you a consistency question; replication is that bill, itemized: lag is the question while the copy is catching up, failover is the question at the worst possible moment, and split brain is the question with two confident answers."}]}]};

const UNIT11 = {"unitId":"scaling-vertical-vs-horizontal","title":"Scaling: Vertical vs Horizontal","subtitle":"A bigger machine, or more of them — and what each one costs you","lessons":[{"id":"scale-1","title":"Two ways to grow","exercises":[{"id":"scale-1-0","type":"concept","title":"There are exactly two ways to make a system bigger","viz":{"nodes":[{"id":"now","label":"Your Server","sub":"at capacity","col":0,"kind":"server"},{"id":"up","label":"One Bigger Server","sub":"scale up","col":1,"kind":"server"},{"id":"o1","label":"Server","sub":"scale out","col":2,"kind":"server"},{"id":"o2","label":"Server","col":2,"kind":"server"},{"id":"o3","label":"Server","col":2,"kind":"server"}],"edges":[{"from":"now","to":"up","dash":true},{"from":"now","to":"o1","dash":true},{"from":"now","to":"o2","dash":true},{"from":"now","to":"o3","dash":true}]},"body":"One server, out of room. You get two moves. Replace it with a bigger machine — more cores, more RAM, still one box — and that's *vertical* scaling, or scaling up. Run more copies of the machine you already have and that's *horizontal* scaling, or scaling out. Same goal, opposite work: scaling up is a purchase, scaling out is a redesign.","note":"The words trip people up because both just mean *more*. Up = the machine grew. Out = the count grew. One of those you can do this afternoon; the other changes how you write software permanently."},{"id":"scale-1-1","type":"multiple_choice","prompt":"Your server is at capacity. Option A: replace it with a machine that has 4× the CPU and RAM. Option B: run 4 copies of the machine you already have. What are these called?","choices":["Upgrading and downgrading","Vertical scaling (scale up) and horizontal scaling (scale out)","Replication and sharding","Caching and load balancing"],"answer":1,"why":"Vertical = one machine, made bigger. Horizontal = more machines, each the same size. Same goal, completely different engineering — and the names are worth internalizing because they map to two different kinds of work: scaling up is a purchase, scaling out is a redesign. One of those you can do this afternoon; the other changes how you build software permanently."},{"id":"scale-1-2","type":"match_pairs","prompt":"Match each term to what it means.","pairs":[{"left":"Vertical scaling","right":"A bigger machine (scale up)"},{"left":"Horizontal scaling","right":"More machines (scale out)"},{"left":"Vertical's ceiling","right":"The biggest machine money can buy"},{"left":"Horizontal's ceiling","right":"Effectively none — you can add another"}],"why":"Up has a wall you can reach; out doesn't, since you can always add one more box. But 'effectively none' is carrying weight there: you can always add a machine, and whether your SYSTEM goes faster depends entirely on whether the work can actually be split apart. That's lesson 3, and it's where the free lunch ends."},{"id":"scale-1-3","type":"fill_blank","prompt":"Buying a bigger machine is ______ scaling; running more machines is horizontal scaling.","choices":["vertical","lateral","elastic","linear"],"answer":0,"why":"Up the machine (vertical), or out across machines (horizontal)."},{"id":"scale-1-4","type":"multiple_choice","prompt":"Which can you usually do today, with no code changes at all?","choices":["Horizontal — just start more copies","Vertical — resize the box and your code neither knows nor cares","Neither — both need a rewrite","Both are equally easy"],"answer":1,"why":"Resizing a machine is a config change: your application runs exactly as it did, with more room, and that's the entire appeal. Which is why scaling up is almost always the right FIRST move, and why dismissing it as unsophisticated is a mistake — a config change that buys you twelve months is worth more than an architecture change that buys you five years you may never need."},{"id":"scale-1-5","type":"multiple_choice","prompt":"Your app runs on one server. You start a second copy. What has to be true for that to work?","choices":["The servers must share their memory","Any request must be servable by either machine — so nothing a user needs can live only on one of them","They must have different code","The database must be replicated"],"answer":1,"why":"Horizontal scaling assumes machines are interchangeable, and the moment a request needs something that exists on only one machine, they aren't. That's unit 5's lesson arriving with a deadline: everything difficult about scaling out reduces to this one requirement, and lesson 3 is a tour of every place it quietly isn't true."},{"id":"scale-1-6","type":"multi_select","prompt":"Which of these are true of VERTICAL scaling? Select all.","choices":["It's usually a config or hardware change, not a code change","It has a hard physical ceiling","It leaves you with a single point of failure","It requires your application to be stateless"],"answer":[0,1,2],"why":"Simple, capped, and still just one machine — statelessness is horizontal's demand, since vertical scaling doesn't care how much state you keep in memory, which is exactly why it's so easy. Notice that last one is the whole trade in miniature: vertical asks nothing of your architecture, while horizontal asks you to give up local state, and that's a bill you pay in code rather than dollars."}]},{"id":"scale-2","title":"Why vertical runs out","exercises":[{"id":"scale-2-0","type":"concept","title":"Every instance family is a ladder, and every ladder has a top step","viz":{"nodes":[{"id":"s","label":"Server","sub":"2 vCPU","col":0,"kind":"server"},{"id":"m","label":"Bigger","sub":"8 vCPU","col":1,"kind":"server"},{"id":"l","label":"Biggest `m5`","sub":"96 vCPU","col":2,"kind":"server"},{"id":"x","label":"The largest made","sub":"then nothing","col":3,"kind":"server"}],"edges":[{"from":"s","to":"m"},{"from":"m","to":"l"},{"from":"l","to":"x"}]},"body":"Cloud compute comes in families of fixed sizes, each with a published price. AWS `m5` runs from `m5.large` — 2 vCPU, about $0.10/hr on demand — up to `m5.24xlarge` at 96 vCPU, about $4.61/hr. Then it stops: there is no `m5.48xlarge`. Other families climb higher, and every one of those stops too. Scaling up is walking a ladder someone else built.","note":"The whole price list is public and the arithmetic is one division. Worth doing yourself before you accept received wisdom about what large machines cost — it's a number repeated far more often than it's checked."},{"id":"scale-2-1","type":"multiple_choice","prompt":"Folklore says a machine with twice the cores costs more than twice as much. Is that true today?","choices":["Yes — large machines are always disproportionately expensive","Mostly no: within a mainstream cloud instance family, price is close to linear — 2× the size costs about 2× the money","No — larger machines are always cheaper per core","It depends on the operating system"],"answer":1,"why":"Mainstream cloud instance families are priced roughly linearly per vCPU: step up one size and you roughly double both the machine and the bill. The 'big iron costs a fortune' rule came from an era of proprietary large machines and doesn't describe how most people buy compute now — which is worth un-learning, because it removes a folklore argument for distributing EARLY. Across the mainstream range, ten small boxes and one ten-times-bigger box land in roughly the same place. The premium is real at the top of the range, where the largest specialty tiers do get disproportionately expensive per unit — and notice when that bites: it's the same moment the ceiling does. The price *premium* and the ceiling arrive together, at the top — which makes the per-core premium a late argument for scaling out, not an early one. Idle capacity is a separate cost argument and it bites at any size; that one's coming."},{"id":"scale-2-2","type":"match_pairs","prompt":"Match each limit of vertical scaling to what it means.","pairs":[{"left":"Hard ceiling","right":"There is a biggest machine, and you can reach it"},{"left":"Idle capacity","right":"One box is sized for your peak, and idle the rest of the time"},{"left":"Single point of failure","right":"One machine dying means a total outage"},{"left":"Upgrade downtime","right":"Resizing usually means a restart"}],"why":"Four separate limits, and only the first is about running out of capacity — the other three bite well before you reach the ceiling. They have different deadlines too: idle capacity bills you continuously, downtime hurts at every upgrade, and the single point of failure hurts you once, badly, on a day you didn't choose. Note which cost complaint this is: at ordinary sizes, where per-unit pricing is roughly flat, you're paying for peak you aren't using rather than a price premium."},{"id":"scale-2-3","type":"multiple_choice","prompt":"You're already on the largest instance your cloud offers, and you're still at capacity. What are your vertical options?","choices":["Wait for a bigger instance type","None — you've run out of road, and there's no incremental step left","Add more RAM to it","Restart it"],"answer":1,"why":"That's the ceiling: there is no 'slightly bigger' option left, so vertical scaling has nothing more to offer. The dangerous part isn't that the ceiling exists — it's WHEN you meet it. You hit it under load, at your busiest moment, with no incremental option and a migration you haven't started. Horizontal degrades gracefully; vertical hits a wall at full speed."},{"id":"scale-2-4","type":"multiple_choice","prompt":"You have one very large machine serving everything. It dies. What's your availability?","choices":["Unaffected — it's a big machine","Zero — you're down until it comes back or you rebuild","Degraded but fine","Depends on the CPU"],"answer":1,"why":"Vertical scaling buys capacity; it never buys redundancy, because one machine is one machine however large. This is the argument people forget when defending the big box: even if one machine could serve all your traffic forever, you'd still want a second one, because one is a single point of failure. Capacity and availability are two separate reasons to add machines, and only one of them is about load."},{"id":"scale-2-5","type":"multiple_choice","prompt":"Resizing a machine to a larger instance usually requires what?","choices":["Nothing — it's seamless and instant","A restart, so you need either a maintenance window or a failover to something else","A full data migration","Rewriting the application"],"answer":1,"why":"The machine has to stop being the old size and start being the new one — that's a restart, which means downtime unless something else can serve traffic meanwhile. There's a quiet irony here: the clean way to upgrade a machine with no downtime is to have a second machine to fail over to, so even scaling up gracefully tends to require the redundancy that scaling out gives you."},{"id":"scale-2-6","type":"multi_select","prompt":"Why does vertical scaling eventually stop being the answer? Select all.","choices":["There is a largest machine, and you can reach it","One box can't shrink at 3am, so you pay for your peak around the clock","One machine is a single point of failure","It forces you to rewrite your application"],"answer":[0,1,2],"why":"Ceiling, inflexible capacity, and fragility. It emphatically does NOT force a rewrite — needing no rewrite is precisely what makes it attractive right up until it fails you. That combination is what makes the ceiling sneak up on people: vertical scaling asks nothing of you, so nobody plans for the day it stops working, and then that day is the day you need to have already planned."}]},{"id":"scale-3","title":"What horizontal demands","exercises":[{"id":"scale-3-0","type":"concept","title":"Horizontal scaling assumes your machines are interchangeable","viz":{"nodes":[{"id":"c","label":"Client","col":0,"kind":"client"},{"id":"lb","label":"Load Balancer","col":1,"kind":"lb"},{"id":"a","label":"Server A","sub":"has their file","col":2,"kind":"server"},{"id":"b","label":"Server B","sub":"doesn't","col":2,"kind":"server"}],"edges":[{"from":"c","to":"lb"},{"from":"lb","to":"a"},{"from":"lb","to":"b"}]},"body":"A second server only helps if either machine can serve any request. That holds right up until something a user needs exists on only one box — the file they uploaded, sitting on that machine's local disk. Now half their requests land on a stranger. The machines aren't interchangeable, and *add another box* quietly stops working.","note":"Which is why 1 → 2 is the hardest scaling step there is, and it's the first one. Every assumption you made about there being one machine surfaces at once, and nobody ever wrote them down. 2 → 200 is boring after it."},{"id":"scale-3-1","type":"multiple_choice","prompt":"You add a second app server behind a load balancer. Immediately, users start getting randomly logged out. Why?","choices":["The load balancer is misconfigured","Sessions live in one server's local memory, so requests landing on the other machine don't find them","The database can't handle two servers","The second server has old code"],"answer":1,"why":"Two machines, one of which holds your session — land on the other and you're a stranger, so the servers aren't interchangeable and horizontal scaling doesn't work yet. Going from one machine to two is the hardest scaling step there is, and it's not close: it's where every hidden assumption of single-machine-ness surfaces at once, and you'd been relying on all of them without ever writing them down."},{"id":"scale-3-2","type":"multi_select","prompt":"Going from 1 server to 2 tends to break which hidden assumptions? Select all.","choices":["Sessions kept in local memory","Uploaded files written to local disk","A scheduled job that now runs on every machine instead of once","The database schema"],"answer":[0,1,2],"why":"Local sessions vanish, local files become invisible to peers, and that nightly cron now fires once per machine — so your billing job runs twice. The schema is untouched; it never assumed anything about how many servers existed. The cron one catches people hardest because it fails silently and in the wrong direction: nothing errors, you just charged everyone twice. Single-machine assumptions rarely announce themselves — they just quietly start doing everything N times."},{"id":"scale-3-3","type":"build_diagram","prompt":"You now run 3 identical app servers. Add the piece that spreads incoming traffic across them.","viz":{"nodes":[{"id":"c","label":"Clients","col":0,"kind":"client"},{"id":"h","col":1,"hole":true},{"id":"s1","label":"App Server","col":2,"kind":"server"},{"id":"s2","label":"App Server","col":2,"kind":"server"},{"id":"s3","label":"App Server","col":2,"kind":"server"}],"edges":[{"from":"c","to":"h"},{"from":"h","to":"s1"},{"from":"h","to":"s2"},{"from":"h","to":"s3"}]},"palette":["Load Balancer","A bigger app server","A cache"],"answer":{"h":"Load Balancer"},"why":"Something has to decide which machine each request goes to — that's a load balancer's entire job, and it's the piece that makes 'more machines' visible to the outside world as one service. Notice horizontal scaling immediately required a new component you didn't need before: that's the pattern, since scaling out doesn't remove work, it relocates it."},{"id":"scale-3-4","type":"multiple_choice","prompt":"You split work across 10 machines, but every one of them must update the same shared counter. What happens?","choices":["You get a 10× speedup","The shared counter becomes the bottleneck — you added machines, but the contended part didn't get any faster","The counter is automatically split","Nothing changes at all"],"answer":1,"why":"Horizontal scaling only helps to the extent the work is genuinely independent — anything all ten machines must touch is a queue with ten machines waiting in it. Any point where every machine must agree is a serialization point, and it caps your speedup no matter how many machines you add. This is unit 4's bottleneck rule with a distributed accent: adding capacity to the parts that weren't the constraint changes nothing."},{"id":"scale-3-5","type":"multiple_choice","prompt":"Which workload scales horizontally most easily?","choices":["One where every request must see the results of every other request","One where requests are independent of each other — like resizing uploaded images","One with a single shared lock","One that writes to the same row constantly"],"answer":1,"why":"Independent work splits cleanly: two machines can handle two images and never speak to each other, while the others all require coordination — and coordination is what doesn't scale. Here's the tell to carry: can two requests be handled by two machines that never talk to each other? If yes, horizontal scaling is nearly free. If no, you're not really buying machines — you're buying coordination, and that's the expensive part."},{"id":"scale-3-6","type":"multiple_choice","prompt":"So what does horizontal scaling actually demand in return?","choices":["More expensive hardware","Interchangeable machines and work that can be split without constant coordination","A faster network only","Nothing — that's why it's better"],"answer":1,"why":"Two demands: nothing a user needs may live on only one machine, and the work must divide without every machine needing to agree with every other one. Neither demand is about hardware, which is the surprise — scaling out is cheap to buy and expensive to qualify for, because the money is trivial next to the architectural conditions you have to meet first."}]},{"id":"scale-4","title":"Choosing, honestly","exercises":[{"id":"scale-4-0","type":"concept","title":"One of these two moves you can undo; the other one you cannot","body":"Resize a box and you can resize it back on Friday — nothing else in your system noticed it happened. Split the work across machines and there is no undo: the split is now in your code, your tests, your deploys and your on-call rotation, permanently. Two options that look equally reasonable on a diagram are not equally reasonable when only one is reversible.","note":"So the bar for going out is evidence, and evidence has a shape: a constraint you can name and a number that says so. Anything you can't measure isn't a reason — it's a preference that learned to sound like one."},{"id":"scale-4-1","type":"multiple_choice","prompt":"A startup with 5,000 users builds for horizontal scale from day one: six services, a message bus, the works. Likely outcome?","choices":["They're ready for anything","They pay distributed-systems costs — coordination, partial failure, debugging across services — for a scale they don't have, and move slower than one box would have let them","It costs the same as one server","Their users notice the improvement"],"answer":1,"why":"Distributed systems aren't free: you buy scale with complexity, so if you don't need the scale yet you've simply bought the complexity. The cost is mostly invisible on an architecture diagram and brutal in daily life — every bug is now a distributed bug, every local test needs six things running, and every outage is a scavenger hunt. That tax is charged daily; the scale benefit arrives someday, maybe."},{"id":"scale-4-2","type":"multiple_choice","prompt":"How far can a single modern machine actually take you?","choices":["A few hundred users at most","Much further than most people assume — large servers can carry hundreds of cores and terabytes of RAM","Exactly one service","It depends only on the programming language"],"answer":1,"why":"Hardware got enormous while everyone was learning to distribute — a single large box today would have been a datacenter fifteen years ago. Plenty of well-known products ran on a handful of machines far longer than their engineers expected, so the useful planning question isn't 'will we outgrow one machine?' but 'when — and what will we know by then that we don't know now?' Deciding later with real data beats deciding now with a guess."},{"id":"scale-4-3","type":"tradeoff_slider","prompt":"New product, 2,000 users, growing steadily, small team. Slide toward your scaling strategy.","leftLabel":"Scale up (bigger box, stay simple)","rightLabel":"Scale out (distribute now)","answerRange":[0,35],"why":"At this size a bigger box is a config change and distributing is a project, so buy the simple thing — you'll learn where your real bottleneck is long before you're forced to commit to an architecture. The deciding factor is asymmetry rather than size: scaling up is reversible and cheap to try, while distributing is a one-way door that changes how you test, deploy, and debug forever. When one option is reversible and the other isn't, take the reversible one until you have evidence you must not."},{"id":"scale-4-4","type":"multiple_choice","prompt":"One machine has plenty of capacity for your traffic — but you need 99.99% uptime. Do you still need more machines?","choices":["No — capacity is what matters","Yes — one machine is a single point of failure, and no amount of capacity fixes that","Only if traffic grows","Only during business hours"],"answer":1,"why":"Redundancy and capacity are unrelated: a machine that's only 10% busy still takes your whole service down when it dies. This is the split people miss — there are two independent reasons to go horizontal, and most only think about load. If your uptime target is serious, you're going horizontal even when one box would be fast enough, and you'll inherit every interchangeability requirement from lesson 3 along with it."},{"id":"scale-4-5","type":"multi_select","prompt":"Which are genuine signals that it's time to scale out? Select all.","choices":["You're approaching the largest machine available","Your uptime target requires redundancy","Traffic is spiky, and you want to add and remove capacity dynamically","Someone on the team read an article about microservices"],"answer":[0,1,2],"why":"Ceiling, redundancy, and elasticity are all real, evidence-backed reasons; fashion is not — and it's the most expensive reason on the list. Elasticity is the one people under-rate: if your traffic is 10× at noon and quiet at 3am, many small machines let you pay for what you use, while one big machine is sized for your worst hour and idle the rest of the time. That's a cost argument for scaling out even before you're near the ceiling."},{"id":"scale-4-6","type":"multiple_choice","prompt":"Your app servers are stateless and CPU-bound. Traffic doubles. Your database sits at 30% and is perfectly happy. What do you scale?","choices":["The database — it's the important part","The app tier, horizontally — it's the bottleneck, and being stateless is exactly what makes that cheap","Everything, to be safe","Nothing — 30% is fine"],"answer":1,"why":"Scale the bottleneck rather than the comfortable part (unit 4) — and you're in luck, because a stateless CPU-bound tier is the one place where 'just add machines' genuinely works. This is the happy case, and it's precisely why the industry pushed state out of the app tier so hard: stateless compute is the one component that really does scale by adding boxes, while every other tier makes you negotiate."},{"id":"scale-4-7","type":"multiple_choice","prompt":"What's the honest summary of scaling?","choices":["Distribute from day one — you'll need it eventually","Scale up first: it's simple, reversible, and goes further than people think. Scale out when you hit the ceiling, need redundancy, or need elasticity — knowing you're buying complexity","Never distribute; one machine is always enough","Whichever is cheaper this month"],"answer":1,"why":"Both dogmas are wrong: scaling up is the cheap, reversible default, and scaling out is a deliberate purchase you make for a named reason — capacity ceiling, availability, or elasticity. Notice horizontal scaling didn't actually solve a problem by itself anywhere in this unit; it relocated problems into interchangeability, traffic distribution, and coordination. The units ahead are what you buy to manage that relocation, and it's worth seeing them as consequences rather than upgrades."}]}]};

const UNIT12 = {"unitId":"load-balancing","title":"Load Balancing","subtitle":"One address, many machines — and who decides where your request goes","lessons":[{"id":"lb-1","title":"The traffic cop","exercises":[{"id":"lb-1-0","type":"concept","title":"What a load balancer really sells is indirection","viz":{"nodes":[{"id":"c","label":"Clients","col":0,"kind":"client"},{"id":"lb","label":"Load Balancer","sub":"one address","col":1,"kind":"lb"},{"id":"s1","label":"App Server","col":2,"kind":"server"},{"id":"s2","label":"App Server","col":2,"kind":"server"},{"id":"s3","label":"App Server","col":2,"kind":"server"}],"edges":[{"from":"c","to":"lb"},{"from":"lb","to":"s1"},{"from":"lb","to":"s2"},{"from":"lb","to":"s3"}]},"body":"Users can't be asked to know your machines. So one thing sits out front, owns the single address the world talks to, and hands each request to a server behind it. That's a load balancer. The distribution is the obvious part; the valuable part is that the outside now talks to one stable thing instead of to your servers.","note":"The address is where your promises to the world stop and your freedom starts. Outside it, one name that never changes. Inside it, an arrangement that is nobody's business but yours."},{"id":"lb-1-1","type":"multiple_choice","prompt":"You now run 3 identical app servers. Your users only know one address. What has to exist?","choices":["Nothing — browsers try all three","Something in front that receives every request and picks a server to hand it to","The servers must merge into one machine","Each user must be given a different address"],"answer":1,"why":"Users can't be asked to know your machines, so something must present one address to the world and route each request behind it. That's a load balancer — and what it really sells is indirection: because the outside world talks to one stable thing, you can add, remove, restart, and replace machines behind it all day without anyone noticing. Every machine becoming disposable is what horizontal scaling actually cashes in."},{"id":"lb-1-2","type":"fill_blank","prompt":"A ______ balancer presents one address to clients and distributes requests across many servers.","choices":["load","packet","cache","session"],"answer":0,"why":"One front door, many rooms behind it — and the clients never learn how many rooms there are."},{"id":"lb-1-3","type":"match_pairs","prompt":"Match each thing a load balancer gives you.","pairs":[{"left":"One address","right":"Clients don't know or care how many servers exist"},{"left":"Distribution","right":"Requests spread across the pool"},{"left":"Health checking","right":"Dead servers stop receiving traffic"},{"left":"Draining","right":"A server can finish its work before leaving"}],"why":"Distribution is the obvious job, but the other three are what you'll actually think about day to day. Most people describe a load balancer as 'it spreads traffic'; in practice it's the stable address, the removal of dead machines, and graceful departure that let you deploy on a Tuesday afternoon without anyone noticing."},{"id":"lb-1-4","type":"multiple_choice","prompt":"Beyond spreading load, what does a load balancer let you do that's arguably more valuable day to day?","choices":["Compress responses","Take a server out of rotation — to deploy, patch, or replace it — without downtime","Store user sessions","Speed up the database"],"answer":1,"why":"If traffic can be moved off a machine at will, that machine can be upgraded or destroyed whenever you like, so deploys become routine instead of events. This is why balancers appear even in systems whose traffic one server could handle: you're often not buying capacity at all, you're buying the ability to take a machine away safely."},{"id":"lb-1-5","type":"multiple_choice","prompt":"Your load balancer sends requests to 3 servers. One is much slower than the others — but it's not down. What does the LB do about it?","choices":["Nothing automatically — 'slow' isn't 'dead', and a basic health check only asks whether it responds","It removes the server immediately","It speeds the server up","It sends the request to all three"],"answer":0,"why":"A basic health check asks a yes/no question — are you answering? — and a server answering slowly passes it and keeps taking traffic. That gap between 'up' and 'healthy' is where a lot of real pain lives: a machine responding in 8 seconds is often worse for users than one that's cleanly dead, because a dead one gets removed and a slow one keeps accepting their requests."},{"id":"lb-1-6","type":"multiple_choice","prompt":"What does adding a load balancer NOT do?","choices":["Give you one address for many servers","Make an individual request faster","Let you remove a server without downtime","Stop sending traffic to a dead server"],"answer":1,"why":"It routes; it doesn't compute. A single request does exactly the work it always did, plus one extra network hop to get there — so you've slightly increased latency to buy capacity and disposable machines. That's unit 4's throughput-versus-latency trade, made concrete in a box."}]},{"id":"lb-2","title":"How it chooses","exercises":[{"id":"lb-2-0","type":"concept","title":"Every balancing algorithm is an assumption about your traffic wearing a name","viz":{"nodes":[{"id":"lb","label":"Load Balancer","sub":"round robin","col":0,"kind":"lb"},{"id":"a","label":"Server A","sub":"req 1, 4","col":1,"kind":"server"},{"id":"b","label":"Server B","sub":"req 2, 5","col":1,"kind":"server"},{"id":"c","label":"Server C","sub":"req 3, 6","col":1,"kind":"server"}],"edges":[{"from":"lb","to":"a"},{"from":"lb","to":"b"},{"from":"lb","to":"c"}]},"body":"Something must pick a server for every request, and no rule for picking is neutral — each one is a bet about your traffic, made once in a config file and then never looked at again. *Round robin* is the plain one: A, then B, then C, then A. It takes turns, so it spreads request COUNTS across the pool perfectly evenly. Perfectly.","note":"So the useful question about an algorithm isn't what it does — that's one sentence — it's what it refuses to look at. Round robin looks at nothing: not the server, not the request, not its own last decision. It counts."},{"id":"lb-2-1","type":"multiple_choice","prompt":"The simplest algorithm: send request 1 to server A, request 2 to B, request 3 to C, then back to A. What's it called, and what does it quietly assume?","choices":["Least connections — it assumes servers are identical","Round robin — it assumes every request costs about the same","Random — it assumes nothing","Hashing — it assumes users are evenly spread"],"answer":1,"why":"Round robin takes turns, which distributes request COUNTS evenly — and that only distributes LOAD evenly when requests cost about the same. If one request in fifty is a report that takes 30 seconds while the rest take 5ms, taking turns will cheerfully deal three reports onto one machine while the others idle."},{"id":"lb-2-2","type":"match_pairs","prompt":"Match each algorithm to what it does.","pairs":[{"left":"Round robin","right":"Take turns, in order"},{"left":"Least connections","right":"Send to whoever is currently least busy"},{"left":"Weighted","right":"Bigger servers get a larger share"},{"left":"Hash the key","right":"The same key always lands on the same server"}],"why":"Four strategies for four situations: uniform requests, uneven requests, uneven servers, and requests that need to land somewhere specific. Notice only the last is about WHERE a request goes rather than how busy a server is — hashing exists for when the destination matters, which is a different problem from balancing."},{"id":"lb-2-3","type":"multiple_choice","prompt":"Your requests vary wildly: most take 5ms, some take 30 seconds. Which algorithm handles that better?","choices":["Round robin — simple and fair","Least connections — it notices a server is still busy with a slow request and routes around it","Random — variance averages out","Weighted round robin"],"answer":1,"why":"Least connections uses live evidence: a machine stuck on a 30-second request still shows an open connection, so it stops receiving new work, while round robin has no idea and keeps dealing it cards. The general principle is that round robin is open-loop — it never looks at the result — and least-connections is closed-loop. Uniform workloads make that feedback nearly worthless; the more variance you have, the more it's worth."},{"id":"lb-2-4","type":"multiple_choice","prompt":"Your fleet has a mix: some machines have 8 cores, some have 32. Which approach fits?","choices":["Round robin — treat them equally","Weighted — give the bigger machines a proportionally larger share","Hashing","Remove the small machines"],"answer":1,"why":"Equal shares to unequal machines overloads the small ones while the big ones coast, so weights let you say 'this one takes four times as much.' The catch is that a weight is a number a human guessed and then forgot, and it drifts out of date as hardware and workloads change — which is a real part of why homogeneous fleets are popular. Uniformity isn't elegant, it just deletes a config nobody maintains."},{"id":"lb-2-5","type":"multiple_choice","prompt":"Why might you hash a user's id to pick their server, instead of balancing by load?","choices":["It's faster to compute","Because you want that user to land on the same server repeatedly — for a warm local cache, say","It spreads load more evenly than round robin","It's more secure"],"answer":1,"why":"Hashing trades load-balancing quality for predictable placement: the same key reaches the same server every time, so whatever that server cached for them is still there. The cost is that you've deliberately made servers non-interchangeable — the very property unit 11 said horizontal scaling depends on — so losing a server now loses something, and adding one reshuffles who goes where."},{"id":"lb-2-6","type":"multiple_choice","prompt":"Which algorithm is 'best'?","choices":["Least connections — it's the smartest","Round robin — it's the simplest","None: it depends on whether requests cost the same, whether servers are the same, and whether placement matters","Whichever your cloud defaults to"],"answer":2,"why":"Three questions decide it — are requests uniform, are servers uniform, does it matter where a request lands — and once you answer them the algorithm mostly picks itself. Round robin is a very common default and a reasonable one, since uniform-ish requests on uniform servers is genuinely common; just know it was chosen for simplicity rather than as a verdict about your workload, so it's the first thing to revisit when your request costs get lumpy."}]},{"id":"lb-3","title":"Health checks","exercises":[{"id":"lb-3-0","type":"concept","title":"A dead server can't tell you it died, so the balancer never stops asking","viz":{"nodes":[{"id":"lb","label":"Load Balancer","sub":"GET /health","col":0,"kind":"lb"},{"id":"a","label":"Server A","sub":"200 OK","col":1,"kind":"server"},{"id":"b","label":"Server B","sub":"200 OK","col":1,"kind":"server"},{"id":"c","label":"Server C","sub":"no reply","col":1,"kind":"server"}],"edges":[{"from":"lb","to":"a"},{"from":"lb","to":"b"},{"from":"lb","to":"c","dash":true}]},"body":"Nothing announces its own crash. So the balancer probes every server on a schedule — a `GET /health` every few seconds — and pulls whichever stop answering out of rotation. That's an *active* health check. The passive alternative watches real traffic and notices the failures, which costs no probes but only ever learns by hurting real users first.","note":"The probe asks a yes/no question: are you answering? So a server replying in 800ms passes and keeps taking your users' requests. *Up* and *healthy* are not the same word, and that gap is where this lesson lives."},{"id":"lb-3-1","type":"multiple_choice","prompt":"How does the load balancer know a server has died?","choices":["The server tells it before crashing","It checks — periodically asking each server whether it's alive, and removing those that fail","The operating system notifies it","It doesn't; an engineer has to remove it"],"answer":1,"why":"Dead machines can't announce anything, so the balancer has to keep asking. That's an active health check — probing an endpoint like `/health` on a schedule. The alternative is passive: watch real traffic and notice failures, which costs nothing extra but only learns by hurting real users first, whereas active spends probes to find out before anyone gets hurt."},{"id":"lb-3-2","type":"multiple_choice","prompt":"Your `/health` endpoint just returns `200 OK` unconditionally. What's the problem?","choices":["Nothing — it proves the server is up","It proves the web server can answer, not that the app can do its job — a server with a dead database connection passes happily","200 is the wrong status code","It's too slow"],"answer":1,"why":"A hardcoded 200 tests one thing: the process is running and can serve a route. It says nothing about whether this server can fulfil a real request. So a good check exercises the dependencies the server truly needs — but don't over-swing, because if your check queries the database then one database blip fails the check on every server at once and the balancer dutifully removes your entire fleet. Too shallow keeps broken servers; too deep takes everything out together."},{"id":"lb-3-3","type":"multiple_choice","prompt":"Under heavy load your servers get slow, so health checks start timing out. The LB removes those servers. What happens next?","choices":["The problem resolves itself","The remaining servers get the same traffic across fewer machines, so they get slower and fail checks too — the fleet unravels one machine at a time","Traffic drops automatically","The LB adds new servers"],"answer":1,"why":"You removed capacity from an overloaded system: the load didn't leave, it redistributed onto fewer machines and pushed them over the same line, one after another. That's a cascading failure, and the bitter part is the health check did exactly what it was told — a slow-but-working server was worth keeping, and the check couldn't tell 'overloaded' from 'broken.' Some balancers guard against this with a floor that never removes more than a set fraction of the pool, precisely because 'everything looks unhealthy at once' more often means overload than mass death."},{"id":"lb-3-4","type":"multi_select","prompt":"Which are real risks of health check configuration? Select all.","choices":["Too shallow: broken servers keep serving traffic","Too deep: one shared dependency failing removes the entire fleet at once","Too aggressive: brief slowness under load evicts healthy machines","Too many servers to check"],"answer":[0,1,2],"why":"Shallow, deep, and aggressive are all real failure modes, and they pull against each other — so you're tuning between them rather than eliminating them. Checking many servers is just work the balancer does. Every one of these is the same 'is it dead or just slow?' question from the replication unit in different clothes: you can't answer it from outside, so you're choosing which mistake to make — keep a broken server, or evict a healthy one."},{"id":"lb-3-5","type":"multiple_choice","prompt":"You're deploying. You want to stop sending new requests to a server but let it finish the ones it's already handling. What's that called?","choices":["Draining (graceful shutdown)","Load shedding","Failover","Sharding"],"answer":0,"why":"Draining stops new traffic while in-flight requests complete, so nobody eats an error just because you deployed. Skipping it is why so many deploys produce a small spike of 502s — the machine vanished mid-request — and it's the difference between deploys nobody notices and deploys that quietly fail a few hundred people every time, for years, because nobody looks at a spike that small."},{"id":"lb-3-6","type":"multiple_choice","prompt":"A server that failed its health check recovers and rejoins the pool. What's the risk?","choices":["It gets no traffic","It can be handed a rush of traffic before it's warmed up — cold caches, empty connection pools — and immediately fall over again","It stays broken","There's no risk"],"answer":1,"why":"A freshly-started server looks identical to a warm one from outside, but nothing's cached and nothing's connected — so a full share dealt instantly can buckle it straight back out of the pool. The mitigation is slow start: ramp a returning server's share up over some seconds instead of dealing it a full hand, which turns a flapping loop of join-die-join-die into an uneventful recovery."}]},{"id":"lb-4","title":"The hard parts","exercises":[{"id":"lb-4-0","type":"concept","title":"A single point of failure is something you relocate, not something you delete","viz":{"nodes":[{"id":"c","label":"Clients","col":0,"kind":"client"},{"id":"lb","label":"Load Balancer","sub":"everything","col":1,"kind":"lb"},{"id":"s1","label":"App Server","col":2,"kind":"server"},{"id":"s2","label":"App Server","col":2,"kind":"server"},{"id":"s3","label":"App Server","col":2,"kind":"server"}],"edges":[{"from":"c","to":"lb"},{"from":"lb","to":"s1"},{"from":"lb","to":"s2"},{"from":"lb","to":"s3"}]},"body":"Every request now flows through one box. Real setups run several balancers and share the address between them — DNS handing out multiple IPs, a floating IP that jumps to a standby, or anycast. None of those deletes the last shared thing; they shrink it and shorten how long it's broken. The question is never *whether*, but *where, and how fast it's replaced*.","note":"Notice where those mitigations live: not one of them is inside the balancer. Each pushes the shared thing further out — into DNS, into a routing table — until what's left is small and dumb enough to be trusted."},{"id":"lb-4-1","type":"multiple_choice","prompt":"You put a load balancer in front of your servers so no single machine can take you down. Then the load balancer dies. What have you built?","choices":["A resilient system","A new single point of failure — you moved it rather than removed it","Nothing has changed","A faster system"],"answer":1,"why":"Everything now flows through one box, so its death is total — precisely the property you added it to fix. The honest framing is that you don't remove single points of failure so much as push them somewhere you can afford: real setups run multiple balancers, via DNS handing out several addresses, a floating IP that moves between them, or anycast. The question is never 'is there a SPOF?' but 'where is it, and how fast can it be replaced?'"},{"id":"lb-4-2","type":"match_pairs","prompt":"Match each load balancer type to what it can do.","pairs":[{"left":"Layer 4 (transport)","right":"Routes by IP and port, without reading the request"},{"left":"Layer 7 (application)","right":"Reads the HTTP request — can route by path or header"},{"left":"L4's advantage","right":"Less work per connection"},{"left":"L7's advantage","right":"Smarter routing decisions"}],"why":"L4 moves packets between addresses without opening them; L7 understands HTTP, so it can send /api one way and /images another, and pays overhead for the privilege of understanding. The tell for which you need: are you routing on anything INSIDE the request — path, host, header, cookie? That's L7, because L4 literally cannot see those. If you're just spreading connections across identical servers, L4 does it with less machinery."},{"id":"lb-4-3","type":"multiple_choice","prompt":"Sessions live in each server's local memory, so users break when they land on a different machine. Someone suggests sticky sessions — pinning each user to one server. Is that a fix?","choices":["Yes — problem solved","It's a workaround: it hides the symptom by making your servers non-interchangeable, which is the property you were relying on","No, it does nothing","Yes, and it also improves load distribution"],"answer":1,"why":"Sticky sessions work by giving up interchangeability — the session still exists in exactly one place, you've just arranged for the user to keep going back to it. So you inherit what that implies: that server dying logs those users out, load distributes worse because a machine with heavy users stays hot, and draining for a deploy pushes people off their sessions anyway. Moving session state out of local memory (unit 5) fixes the cause instead of the symptom."},{"id":"lb-4-4","type":"tradeoff_slider","prompt":"Your app keeps sessions in local server memory and it's hurting. Slide toward your approach.","leftLabel":"Sticky sessions (quick, keeps the coupling)","rightLabel":"Move sessions to a shared store (real fix, more work)","answerRange":[55,100],"why":"Sticky sessions buy you today at the cost of every day after: servers stay non-interchangeable, so deploys, failures, and autoscaling all keep hurting. They're defensible as a deliberate stopgap while you do the real work, or for something genuinely local and cheap to lose. What makes them a smell is being load-bearing forever — at that point your architecture has quietly decided machines aren't disposable, and everything downstream gets harder."},{"id":"lb-4-5","type":"multiple_choice","prompt":"A load balancer distributes traffic across servers. So can it protect you from a traffic spike bigger than your whole fleet can handle?","choices":["Yes — that's what balancing means","No — it spreads load; it doesn't reduce it. Distributing 10× traffic across 3 servers just overloads all 3 evenly","Yes, it queues the extra requests forever","Yes, if you use least connections"],"answer":1,"why":"Balancing decides who does the work, not how much work exists — so if the total exceeds your fleet's capacity, spreading it perfectly still exceeds your fleet's capacity. Protection from too much load is a different tool entirely: shedding it (rejecting early with a 429, unit 2), limiting it, or adding capacity. Confusing 'balanced' with 'protected' is a common and expensive mistake, because an evenly overloaded fleet is still an overloaded fleet."},{"id":"lb-4-6","type":"multiple_choice","prompt":"Users report intermittent errors during every deploy. You use round robin, no draining, and health checks every 30 seconds. What's the most likely cause?","choices":["Round robin is the wrong algorithm","Servers are being killed mid-request, and for up to 30 seconds the LB keeps sending traffic to machines that are already gone","The database is too slow","Users have stale DNS"],"answer":1,"why":"Two gaps compound: no draining means in-flight requests die with the process, and a 30-second interval means the balancer keeps confidently routing to a dead machine until its next probe. The interval is a tradeoff you're making whether you notice or not — probe often and you spend requests while risking eviction on a blip; probe rarely and you feed traffic to corpses. Draining is what makes the interval mostly stop mattering, because the machine leaves on purpose instead of being discovered missing."},{"id":"lb-4-7","type":"multiple_choice","prompt":"What's the honest summary of load balancing?","choices":["It makes your system fast and highly available automatically","It gives you one address and disposable machines — and hands you new decisions: which algorithm, how to check health, and where the single point of failure moved to","It's only needed above a million users","It removes the need for health checks"],"answer":1,"why":"It's the component that makes a fleet usable as one service, and it doesn't reduce load, speed up requests, or remove failure — it relocates and manages them. Look at what it actually delivered: not capacity (the servers did that) and not speed (nothing got faster), but indirection, which bought disposable machines. Almost every operational nicety you like about running a fleet traces back to that one thing."}]}]};
