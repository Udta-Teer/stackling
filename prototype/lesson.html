/* match pairs */
/* Buttons are tracked by INDEX, never by their text. Keying by text breaks the
   moment two options read the same — e.g. matching four use cases onto TCP/UDP
   gives a right column of TCP,TCP,UDP,UDP, where the second button of each pair
   silently overwrote the first, so clicking one lit up or greyed out another.
   Duplicate values are legitimate content, so the renderer handles them:
   matching a left item to EITHER button with the right text is correct. */
function match(){
  const w=$('body');
  const lefts  = ex.pairs.map(p=>p.left);
  const rights = shuffle(ex.pairs.map(p=>p.right));
  current = { pending:null, map:{}, rights };   // map: leftIndex -> rightIndex
  const grid=document.createElement('div'); grid.className='match';
  const cl=document.createElement('div'); cl.className='col';
  const cr=document.createElement('div'); cr.className='col';
  const lb=[], rb=[];

  const takenR = ()=> new Set(Object.values(current.map));
  function paint(){
    const p=current.pending, taken=takenR();
    // `paired`, not `used`: .chip.used sets pointer-events:none, which is right
    // for a component spent into a diagram slot and wrong here — a paired chip
    // must stay clickable so the pair can be broken.
    lb.forEach((b,i)=>{ b.classList.toggle('sel', !!p && p.side==='l' && p.i===i);
                        b.classList.toggle('paired', i in current.map); });
    rb.forEach((b,j)=>{ b.classList.toggle('sel', !!p && p.side==='r' && p.i===j);
                        b.classList.toggle('paired', taken.has(j)); });
  }
  /* Breaking a pair has to be possible. Matching four things means committing to
     the first pair before you've seen how the rest shake out, so a wrong guess
     is normal — and until now it was permanent: both chips went inert and the
     only way forward was to submit the answer you knew was wrong and lose a
     heart for it. Tapping either half now releases the pair. */
  function unpair(side,i){
    const li = side==='l' ? String(i)
             : Object.keys(current.map).find(k=>current.map[k]===i);
    if(li===undefined) return;
    delete current.map[li];
    current.pending=null;
    $('action').disabled=true;        // no longer a complete answer
    paint();
  }
  function pick(side,i){
    if(checked) return;
    if(side==='l' && (i in current.map)) return unpair('l',i);
    if(side==='r' && takenR().has(i))   return unpair('r',i);
    const p=current.pending;
    if(p && p.side!==side){
      const li = side==='l' ? i : p.i;
      const ri = side==='r' ? i : p.i;
      current.map[li]=ri;
      current.pending=null;
      if(Object.keys(current.map).length===lefts.length) enable();
    } else {
      current.pending={side,i};
    }
    paint();
  }
  lefts.forEach((l,i)=>{ const b=document.createElement('button'); b.className='chip';
    b.innerHTML=md(l); b.style.textAlign='left'; b.onclick=()=>pick('l',i); lb.push(b); cl.appendChild(b); });
  rights.forEach((r,j)=>{ const b=document.createElement('button'); b.className='chip';
    b.innerHTML=md(r); b.style.textAlign='left'; b.onclick=()=>pick('r',j); rb.push(b); cr.appendChild(b); });
  grid.appendChild(cl); grid.appendChild(cr); w.appendChild(grid);
}
/* order steps */
function order(){
  const w=$('body'); current=shuffle(ex.steps.map((s,i)=>({s,i}))); enable();
  function draw(){
    const list=document.createElement('div'); list.className='order';
    current.forEach((it,pos)=>{
      const r=document.createElement('div'); r.className='row';
      r.innerHTML=`<span class="num">${pos+1}</span> <span>${md(it.s)}</span>`;
      const ar=document.createElement('div'); ar.className='arrows';
      const up=document.createElement('button'); up.textContent='↑'; up.onclick=()=>{if(checked||pos===0)return;[current[pos-1],current[pos]]=[current[pos],current[pos-1]];refresh();};
      const dn=document.createElement('button'); dn.textContent='↓'; dn.onclick=()=>{if(checked||pos===current.length-1)return;[current[pos+1],current[pos]]=[current[pos],current[pos+1]];refresh();};
      ar.appendChild(up);ar.appendChild(dn); r.appendChild(ar); list.appendChild(r);
    });
    w.innerHTML=''; w.appendChild(list);
  }
  function refresh(){draw();}
  draw();
}
/* spot the bottleneck — tap the component that constrains the pipeline */
/* ══ diagram engine ═══════════════════════════════════════════════════
   Content authors nodes — {id, label, col, kind?, sub?, hole?} — and edges
   — {from, to, dash?}. Geometry, arrows and centring are DERIVED here, so a
   diagram can never drift from its data and content stays authorable as JSON.

   `col` is the only layout input: nodes sharing a column stack vertically and
   centre against the tallest column. That covers essentially every system
   diagram we teach (client → LB → app ×3 → db is literally columns) without
   dragging in a layout library, and it expresses fan-out directly — which the
   old string-chain model could not, hence hacks like '[ App Server ×3 ]'. */
/* Node size adapts to column count so a diagram fits a phone instead of
   scrolling. A 430px phone leaves ~398px inside the app's padding; at a fixed
   106px node even FOUR columns needs 544px, so "just cap the columns" was never
   going to work — the geometry had to give. Text shrinks with it, which is the
   honest trade: a legible 5-column diagram beats a swipeable one. */
const VIZ_GY=13;
function vizMetrics(ncols){
  if(ncols<=3) return {NW:106, NH:56, GX:40, FS:11.5, SF:9.5};   // 3 -> 398px
  if(ncols===4) return {NW:83,  NH:58, GX:21, FS:10,   SF:8.5};  // 4 -> 395px
  return             {NW:68,  NH:60, GX:14, FS:9,    SF:7.5};    // 5 -> 396px
}

function layoutViz(viz){
  const cols={};
  viz.nodes.forEach(n=>{ const c=n.col||0; (cols[c]=cols[c]||[]).push(n); });
  const keys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const m=vizMetrics(keys.length);
  const rows=Math.max(...keys.map(c=>cols[c].length));
  const H=rows*m.NH+(rows-1)*VIZ_GY;
  const W=keys.length*m.NW+(keys.length-1)*m.GX;
  const pos={};
  keys.forEach((c,ci)=>{
    const list=cols[c], colH=list.length*m.NH+(list.length-1)*VIZ_GY, y0=(H-colH)/2;
    list.forEach((n,ri)=>{ pos[n.id]={x:ci*(m.NW+m.GX), y:y0+ri*(m.NH+VIZ_GY)}; });
  });
  return {pos,W,H,m};
}

function renderViz(viz){
  const {pos,W,H,m}=layoutViz(viz);
  const VIZ_NW=m.NW, VIZ_NH=m.NH;
  const wrap=document.createElement('div'); wrap.className='vizwrap';
  const box=document.createElement('div'); box.className='viz';
  box.style.width=W+'px'; box.style.height=H+'px';
  const paths=(viz.edges||[]).map((e,i)=>{
    const a=pos[e.from], b=pos[e.to]; if(!a||!b) return '';
    const x1=a.x+VIZ_NW, y1=a.y+VIZ_NH/2, x2=b.x, y2=b.y+VIZ_NH/2, mx=(x1+x2)/2;
    const d=Math.abs(y1-y2)<1 ? `M${x1} ${y1}H${x2-6}`
                              : `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}`;
    return `<path d="${d}" data-e="${i}"${e.dash?' stroke-dasharray="4 4"':''} marker-end="url(#ah)"/>`;
  }).join('');
  box.insertAdjacentHTML('beforeend',
    `<svg class="edges" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`+
    `<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto">`+
    `<path d="M0 0 L6 2.5 L0 5 z" fill="rgba(157,180,204,.5)" stroke="none"/></marker></defs>${paths}</svg>`);
  const els={};
  viz.nodes.forEach(n=>{
    const p=pos[n.id], el=document.createElement('div');
    el.className='vn'+(n.kind?' k-'+n.kind:'')+(n.hole?' hole':'');
    el.dataset.id=n.id;
    el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${VIZ_NW}px;height:${VIZ_NH}px;font-size:${m.FS}px`;
    el.innerHTML=`<div class="vl">${n.hole?'?':md(n.label)}</div>`+
                 (n.sub?`<div class="sub">${md(n.sub)}</div>`:'');
    els[n.id]=el; box.appendChild(el);
  });
  wrap.appendChild(box);
  return {wrap, els};
}
/* Terse chains stay terse in JSON: a plain labels array becomes a viz. */
function vizFromChain(labels){
  return {nodes:labels.map((l,i)=>({id:'n'+i,label:l,col:i})),
          edges:labels.slice(1).map((_,i)=>({from:'n'+i,to:'n'+(i+1)}))};
}
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ── concept: the teaching beat. Not graded, costs no heart, earns no XP,
      and never touches `total` so it can't dilute accuracy. */
function concept(){
  const w=$('body');
  if(ex.viz) w.appendChild(renderViz(ex.viz).wrap);
  const p=document.createElement('p'); p.className='cbody'; p.innerHTML=md(ex.body); w.appendChild(p);
  if(ex.note){ const n=document.createElement('p'); n.className='cnote'; n.innerHTML=md(ex.note); w.appendChild(n); }
  /* The way out, offered at the exact moment someone realises they don't need
     this — one tap skips this card AND every future one. It's reversible from
     the header, so nothing is lost by trying it. (The field-task skip button
     was cut for being purposeless; this one has a job: it is the stairs.) */
  const skip=document.createElement('button');
  skip.className='btn ghost cskip'; skip.id='cskip';
  skip.textContent='I know this — skip concept cards';
  skip.onclick=()=>{ setTeach(false); next(); };
  w.appendChild(skip);
}

/* ── spot_bottleneck: tap the constraint. */
function bottleneck(){
  const w=$('body'); current=null;
  const viz=ex.viz||vizFromChain(ex.nodes);
  const {wrap,els}=renderViz(viz); w.appendChild(wrap);
  const ids=viz.nodes.map(n=>n.id);
  ids.forEach((id,i)=>{
    const el=els[id];
    /* Strip the kind colour here, and only here. Everywhere else colour carries
       meaning — a cache is always amber, a database always blueprint-blue — and
       that's worth keeping. But this exercise asks the learner to READ THE
       CAPACITIES and find the smallest, and colour was answering it for them:
       in cp5-2-4 the lone `db` node was the one blue box among grey servers, and
       it was also the graded answer. The odd one out reads as the answer before
       you've looked at a single number. Uniform boxes, numbers do the work.

       Remove only the kind classes rather than overwriting className: rebuilding
       the whole list by hand silently drops anything else renderViz sets, and
       having to keep two places in sync by hand is exactly what left check()
       querying a class the renderer had stopped emitting. */
    [...el.classList].filter(c=>c.startsWith('k-')).forEach(c=>el.classList.remove(c));
    el.classList.add('pick');
    el.onclick=()=>{ if(checked)return; current=i;
      ids.forEach(x=>els[x].classList.remove('sel')); el.classList.add('sel'); enable(); };
  });
  const h=document.createElement('p'); h.className='vhint'; h.textContent='tap the constraint'; w.appendChild(h);
}

/* ── build_diagram: drag a component into the hole(s).
   Pointer events, not HTML5 drag-and-drop — the latter does not fire on touch,
   and this ships to phones. Tap-to-select is kept as an equal path: drag-only
   is a trap for anyone on a trackpad, with a motor impairment, or in a hurry. */
function diagram(){
  const w=$('body');
  const {wrap,els}=renderViz(ex.viz); w.appendChild(wrap);
  const holes=ex.viz.nodes.filter(n=>n.hole).map(n=>n.id);
  current={};                                  // holeId -> chosen label
  const h=document.createElement('p'); h.className='vhint';
  const HINT_EMPTY = holes.length>1?'drag a component into each slot':'drag a component into the slot';
  h.textContent=HINT_EMPTY;
  w.appendChild(h);

  const chips=document.createElement('div'); chips.className='chips'; chips.style.justifyContent='center';
  const chipOf={}; let sel=null;

  const holeUnder=(x,y)=>holes.find(id=>{
    const r=els[id].getBoundingClientRect();
    return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  })||null;

  function refresh(){
    holes.forEach(id=>{ const lab=current[id];
      els[id].classList.toggle('full',!!lab);
      els[id].querySelector('.vl').innerHTML = lab?md(lab):'?'; });
    const used=new Set(Object.values(current));
    Object.keys(chipOf).forEach(l=>chipOf[l].classList.toggle('used',used.has(l)));
    $('action').disabled = holes.some(id=>!current[id]);
    /* Tapping a filled slot has always cleared it — but the hint only ever said
       "drag a component in", so nobody knew, and a wrong guess felt permanent.
       The mechanism wasn't broken; it was invisible. Say it the moment it's
       relevant, which is the moment something is actually in a slot. */
    h.textContent = used.size ? 'tap a filled slot to take it back' : HINT_EMPTY;
  }
  function place(id,label){
    if(!id||!label) return;
    for(const k of holes) if(current[k]===label) delete current[k];  // a component is used once
    current[id]=label; sel=null;
    [...chips.children].forEach(c=>c.classList.remove('sel'));
    refresh();
  }

  shuffle(ex.palette).forEach(label=>{
    const c=document.createElement('button'); c.className='chip drag';
    c.innerHTML=`<span class="txt">${md(label)}</span>`;
    c.dataset.label=label;                       // grading reads this, never textContent
    chipOf[label]=c;
    let drag=null;
    c.addEventListener('pointerdown',e=>{
      if(checked||c.classList.contains('used'))return;
      drag={id:e.pointerId,moved:false,ghost:null};
      try{ c.setPointerCapture(e.pointerId); }catch(_){}
    });
    c.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.id)return;
      if(!drag.moved){ drag.moved=true;
        const g=c.cloneNode(true); g.className='chip ghost'; document.body.appendChild(g); drag.ghost=g; }
      drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
      const over=holeUnder(e.clientX,e.clientY);
      holes.forEach(id=>els[id].classList.toggle('over',id===over));
    });
    c.addEventListener('pointerup',e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const moved=drag.moved, tgt=moved?holeUnder(e.clientX,e.clientY):null;
      if(drag.ghost) drag.ghost.remove();
      holes.forEach(id=>els[id].classList.remove('over'));
      drag=null; if(checked)return;
      if(moved){ if(tgt) place(tgt,label); return; }
      if(holes.length===1) return place(holes[0],label);       // one hole: a tap is unambiguous
      if(sel===label){ sel=null; c.classList.remove('sel'); return; }
      sel=label; [...chips.children].forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
    });
    c.addEventListener('pointercancel',()=>{
      if(drag&&drag.ghost)drag.ghost.remove(); drag=null;
      holes.forEach(id=>els[id].classList.remove('over'));
    });
    chips.appendChild(c);
  });
  holes.forEach(id=>els[id].addEventListener('click',()=>{
    if(checked)return;
    if(sel) place(id,sel);
    else if(current[id]){ delete current[id]; refresh(); }        // tap a filled slot to clear
  }));
  w.appendChild(chips); refresh();
}

/* ── simulate: the consequence engine.
   Load enters at `input` and flows down `chain`; the `absorb` node removes a
   share the learner controls; every node shows load against its capacity and
   visibly melts when it exceeds it. This is the one exercise where the learner
   discovers the answer instead of recalling it — you cannot argue with a
   database going red at 85% and green at 90%. */
/* Load is rounded at each hop, for two reasons that turn out to be the same one.
   Requests/sec are whole requests. And without it the knife edge is decided by
   float error: 50000*(1-0.98) is 1000.0000000000009, so an origin capped at
   1000 "melts" at exactly its limit while the label reads 1,000/1,000 — the
   number on screen and the verdict disagreeing, which reads as a broken app.
   fmt() already rounds for display; rounding here keeps the model honest with it. */
function simCompute(sim,pct){
  const load={}; let cur=sim.input;
  sim.chain.forEach(id=>{ load[id]=cur;
    if(sim.absorb&&sim.absorb.node===id) cur=Math.round(cur*(1-pct/100)); });
  return load;
}
function simulate(){
  const w=$('body'), sim=ex.sim;
  const {wrap,els}=renderViz(ex.viz); w.appendChild(wrap);
  /* Every node on the chain reports its load, so it needs a .sub to report
     into. renderViz only builds one when the CONTENT supplies a `sub`, and sim
     nodes don't — the number is computed, not authored. Without this the whole
     simulation rendered silently blank. */
  sim.chain.forEach(id=>{
    const el=els[id];
    if(el && !el.querySelector('.sub')){
      const s=document.createElement('div'); s.className='sub'; el.appendChild(s);
    }
  });
  const bar=document.createElement('div'); bar.className='simbar'; w.appendChild(bar);
  const box=document.createElement('div'); box.className='slider-wrap';
  box.innerHTML=`<div class="slider-labels"><span>${md(sim.absorb.label)}</span></div>`;
  const r=document.createElement('input'); r.type='range';
  r.min=sim.absorb.min; r.max=sim.absorb.max; r.value=sim.absorb.start;
  const val=document.createElement('div'); val.className='slider-val';
  box.appendChild(r); box.appendChild(val); w.appendChild(box);

  function paint(){
    const pct=+r.value; current=pct;
    val.textContent=pct+(sim.absorb.unit||'%');
    const load=simCompute(sim,pct);
    sim.chain.forEach(id=>{
      const el=els[id]; if(!el) return;
      const cap=(sim.capacity||{})[id], l=load[id], over=cap!=null&&l>cap;
      el.querySelector('.sub').textContent=cap!=null?`${fmt(l)}/${fmt(cap)}`:fmt(l);
      el.classList.toggle('melt',!!over);
    });
    const watch=sim.watch, cap=(sim.capacity||{})[watch], l=load[watch], ok=cap==null||l<=cap;
    // Two readouts, not three: the watched node already prints load/capacity, so
    // a separate "limit" box was redundant AND wrapped to its own row on a phone.
    bar.innerHTML=
      `<div class="m">${md(sim.inputLabel||'Traffic in')}<b>${fmt(sim.input)}</b></div>`+
      `<div class="m ${ok?'good':'bad'}">${md(sim.watchLabel||'Reaching origin')}`+
      `<b>${fmt(l)}${cap!=null?` <span style="opacity:.5">/ ${fmt(cap)}</span>`:''}</b></div>`;
    // live edges only where traffic still flows
    const svg=wrap.querySelector('.edges');
    (ex.viz.edges||[]).forEach((e,i)=>{
      const p=svg.querySelector(`[data-e="${i}"]`); if(!p) return;
      const l2=load[e.to];
      p.classList.toggle('live', l2>0);
      p.classList.toggle('dead', (sim.capacity||{})[e.to]!=null && l2>(sim.capacity||{})[e.to]);
    });
  }
  r.addEventListener('input',paint);
  paint(); enable();
}
/* estimate */
function estimate(){
  const w=$('body'); current=null;
  const box=document.createElement('div'); box.className='est';
  const inp=document.createElement('input'); inp.type='number'; inp.placeholder='?';
  inp.oninput=()=>{ current=parseFloat(inp.value); $('action').disabled=isNaN(current); };
  box.appendChild(inp); const u=document.createElement('span'); u.className='unit'; u.textContent=ex.unit||''; box.appendChild(u);
  w.appendChild(box);
}
/* tradeoff slider */
function slider(){
  const w=$('body'); current=50;
  const wrap=document.createElement('div'); wrap.className='slider-wrap';
  wrap.innerHTML=`<div class="slider-labels"><span>◀ ${md(ex.leftLabel)}</span><span>${md(ex.rightLabel)} ▶</span></div>`;
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=100; r.value=50;
  const val=document.createElement('div'); val.className='slider-val'; val.textContent='50 / 50';
  r.oninput=()=>{ current=+r.value; val.textContent=`${100-current} / ${current}`; };
  wrap.appendChild(r); wrap.appendChild(val); w.appendChild(wrap); enable();
}

/* ---- checking ---- */
function check(){
  /* Re-entry guard. `checked=true; total++` used to run before any of the
     type-specific work below, so when a renderer branch threw, showFeedback()
     never ran, #action stayed bound to check(), and every further click
     incremented `total` again while `correct` never moved — quietly wrecking
     the accuracy score on the completion screen. The branch bug is fixed, but
     the guard is what stops the NEXT one from corrupting state on the way out. */
  if(checked) return;
  checked=true; total++;
  let ok=false;
  const body=$('body');
  if(ex.type==='multiple_choice'||ex.type==='fill_blank'){
    ok=current===ex.answer;
    const btns=body.querySelectorAll('.choice');
    btns[ex.answer].classList.add('ok'); if(!ok&&current!=null) btns[current].classList.add('bad');
  } else if(ex.type==='multi_select'){
    const want=new Set(ex.answer); ok=current.size===want.size&&[...current].every(x=>want.has(x));
    const btns=body.querySelectorAll('.choice');
    ex.answer.forEach(i=>btns[i].classList.add('ok'));
    [...current].forEach(i=>{if(!want.has(i))btns[i].classList.add('bad');});
  } else if(ex.type==='order_steps'){
    ok=current.every((it,pos)=>it.i===pos);
  } else if(ex.type==='match_pairs'){
    // Grade on the VALUE the chosen slot holds, so either duplicate is accepted.
    ok=ex.pairs.every((p,i)=>current.rights[current.map[i]]===p.right);
    /* Reveal the correct pairing. This branch used to grade and stop: every other
       type shows its answer — mc greens the right option, build_diagram greens
       the right chips — and match_pairs alone showed nothing. You got a red
       banner over the wrong pairing you'd just built, and never found out what
       the right one was. That's the one moment a learner is most willing to be
       taught, and we were spending it telling them only that they'd failed. */
    const host=body.querySelector('.match');
    host.className='match revealed';
    host.innerHTML=ex.pairs.map((p,i)=>{
      const j=current.map[i];
      const chose = j==null ? null : current.rights[j];
      const good  = chose===p.right;
      return `<div class="mrow ${good?'ok':'bad'}">`+
             `<div class="mpair"><span class="ml">${md(p.left)}</span>`+
             `<span class="marr">→</span><span class="mr">${md(p.right)}</span></div>`+
             // md() formats CONTENT; 'nothing' is interface copy and must not
             // go through it. (Unreachable today — Check is disabled until every
             // left is paired — so this is belt-and-braces, not a live branch.)
             (good?'':`<div class="myours">you paired it with ${chose?md(chose):'nothing'}</div>`)+
             `</div>`;
    }).join('');
  } else if(ex.type==='spot_bottleneck'){
    /* `.vn.pick`, not `.node.pick`. bottleneck() was rewritten onto renderViz,
       which emits `vn` — this selector was left behind pointing at the retired
       class, matched nothing, and `nodes[ex.answer]` threw on every Check. All
       four spot_bottleneck exercises were unplayable and shipped that way. The
       dead `.node` CSS is now deleted too, so a dangling selector like this one
       can't look plausible to the next reader. */
    ok=current===ex.answer;
    const nodes=body.querySelectorAll('.vn.pick');
    nodes[ex.answer].classList.add('ok');
    if(!ok&&current!=null) nodes[current].classList.add('bad');
  } else if(ex.type==='build_diagram'){
    /* answer maps holeId -> label, so a diagram grades as a topology rather
       than as a single chip. Every hole must be right for the shape to be right. */
    const want=ex.answer;
    ok=Object.keys(want).every(h=>current[h]===want[h]);
    Object.keys(want).forEach(h=>{
      const el=body.querySelector(`.vn[data-id="${h}"]`); if(!el) return;
      el.classList.remove('hole','full');
      el.classList.add(current[h]===want[h]?'ok':'bad');
    });
    // Reveal which components belonged, the way mc() greens the right option.
    // Keyed on dataset.label, never on textContent — matching chips by their
    // text is what made duplicate labels unreachable in match_pairs.
    const wanted=new Set(Object.values(want));
    body.querySelectorAll('.chip').forEach(c=>{ if(wanted.has(c.dataset.label)) c.classList.add('ok'); });
  } else if(ex.type==='estimate'){
    ok=Math.abs(current-ex.answer)<=(ex.tolerance||0);
  } else if(ex.type==='tradeoff_slider'||ex.type==='simulate'){
    ok=current>=ex.answerRange[0]&&current<=ex.answerRange[1];
  }
  if(ok){correct++; xp+=10;} else { if(!unlimited) hearts=Math.max(0,hearts-1); paintHearts(); }
  showFeedback(ok);
}
function showFeedback(ok){
  const f=$('feedback'); f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=`<h4>${ok?'✓ Nice!':'✗ Not quite'}</h4><p>${md(ex.why)}</p>`;
  const a=$('action'); a.textContent = idx+1<lesson.exercises.length?'Continue':'Finish'; a.disabled=false;
  a.className='btn'+(ok?'':' '); a.onclick=next;
  if(hearts===0 && !unlimited){ a.textContent='Out of hearts — Finish'; }
}
function next(){
  if(hearts===0 && !unlimited){ return finish(); }
  idx++;
  skipTeaching();
  if(idx>=lesson.exercises.length) return finish();
  render();
}
/* Leaving a lesson must NOT reload the page: a reload resets uidx to 0 and
   dumps you back on unit 1, so finishing a lesson in unit 20 lost your place
   every time. Just swap the screens. */
function exitToPicker(){
  $('stage').classList.add('hidden');
  $('foot').classList.add('hidden');
  $('complete').classList.add('hidden');
  $('picker').classList.remove('hidden');
  $('bar').style.width='0';
  boot();
}

/* Where "next" goes: the next lesson, else the first lesson of the next unit,
   else nowhere (end of course). */
function nextTarget(){
  if(lidx+1 < UNIT.lessons.length) return {kind:'lesson', label:'Next lesson'};
  if(uidx+1 < COURSE.length)       return {kind:'unit',   label:'Next unit: '+COURSE[uidx+1].title};
  return null;
}

function goNext(){
  const t=nextTarget();
  if(!t) return exitToPicker();
  if(t.kind==='lesson') return startLesson(lidx+1);
  uidx++; UNIT=COURSE[uidx]; bootUnits(); boot(); startLesson(0);
}

function finish(){
  $('bar').style.width='100%';
  $('stage').classList.add('hidden'); $('foot').classList.add('hidden');
  $('complete').classList.remove('hidden');
  $('xp').textContent=xp; $('acc').textContent=Math.round(correct/Math.max(1,total)*100)+'%'; $('hleft').textContent=heartsLabel();
  renderFieldTask();

  // Primary action is to keep going — never make them navigate back to advance.
  const t=nextTarget(), nb=$('nextbtn');
  if(t){ nb.textContent=t.label; nb.classList.remove('hidden'); }
  else { nb.classList.add('hidden'); }
}

/* A field task sends the learner out of the app, so it only ever appears AFTER
   the lesson is done and the XP is banked — never mid-loop, never blocking.
   It's optional and dismissible; the primary action stays "Back to lessons". */
function renderFieldTask(){
  const host=$('ftask-host'); host.innerHTML='';
  const t=lesson.fieldTask;
  if(!t) return;
  const el=document.createElement('div'); el.className='ftask';
  el.innerHTML=
    `<div class="ft-top"><span class="ft-tag">optional</span>`+
    `<span>${md(t.where)} · ~${t.seconds}s</span></div>`+
    `<div class="ft-do">${md(t.do)}</div>`+
    (t.alt?`<p class="ft-alt">${md(t.alt)}</p>`:'')+
    `<p class="ft-notice">${md(t.notice)}</p>`;
  host.appendChild(el);
}

$('heartbox').onclick = toggleUnlimited;
$('nextbtn').onclick  = goNext;
$('backbtn').onclick  = exitToPicker;
$('closebtn').onclick = exitToPicker;
/* Toggling teaching back ON mid-lesson should show the card for the exercise
   you're standing on, not wait until the next lesson — otherwise the control
   looks broken to the person who just changed their mind. */
$('teachbtn').onclick = ()=>{
  setTeach(!teach);
  if(lesson && !checked){
    if(!teach) skipTeaching();
    else while(idx>0 && lesson.exercises[idx-1].type==='concept') idx--;
    if(idx<lesson.exercises.length) render();
  }
};
paintHearts(); paintTeach();
bootUnits(); boot();
</script>
</body>
</html>
