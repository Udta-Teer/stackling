const UNIT8 = {"unitId":"indexes","title":"Indexes","lessons":[{"id":"idx-1","title":"The book index","exercises":[{"type":"multiple_choice","prompt":"A 1,000-page book. You want every page mentioning 'sharding.' You could read all 1,000 pages — or flip to the index at the back. What does that index give you?","choices":["A summary of the book","A sorted list of terms, each with page numbers — so you jump straight there","A faster way to read every page","Nothing you couldn't get by reading"],"answer":1,"why":"That's literally what a database index is: a sorted structure mapping values to locations, so you go straight to what you want instead of reading everything.","goDeeper":"Notice three properties of that book index, because all three matter: it's SEPARATE from the content, it's SORTED (the content isn't), and it's SMALLER than the book. Those are exactly the properties that make a database index work."},{"type":"multiple_choice","prompt":"So what IS a database index?","choices":["A faster copy of the whole table","A separate, sorted data structure mapping column values to row locations","A cache of recent query results","A compressed version of the table"],"answer":1,"why":"It's a separate structure holding one (or a few) columns, kept sorted, with pointers to where the full rows live — maintained automatically by the database.","goDeeper":"Redundant and derived should ring a bell from unit 5: an index is rebuildable state. It contains nothing that isn't already in the table. That's precisely why you can DROP an index and rebuild it without losing a single byte of data."},{"type":"multiple_choice","prompt":"Finding a value among 1 million unsorted rows takes up to 1 million checks. Using a sorted index structure, roughly how many steps?","choices":["1 million","About 1,000","About 20","Exactly 1"],"answer":2,"why":"Each step halves the remaining search space, so it's log₂(1,000,000) ≈ 20 steps. Twenty, versus a million.","goDeeper":"And it gets better as you grow, which is the genuinely magical part. A BILLION rows is only ~30 steps. Doubling your data adds exactly ONE step. That's why indexed lookups stay fast forever while scans fall off a cliff — they scale completely differently."},{"type":"estimate","prompt":"Roughly how many steps does an index need to find one row among 1 billion? (It's log₂ of a billion.)","answer":30,"tolerance":5,"unit":"steps","why":"2³⁰ ≈ 1.07 billion, so about 30 steps. A billion rows, thirty comparisons.","goDeeper":"Sit with the gap: 30 steps versus 1,000,000,000. This is not an optimization — it's a different category of thing. Almost every 'the database got slow' story is really 'we started scanning where we used to jump.'"},{"type":"fill_blank","prompt":"Without a useful index, the database performs a full table ______; with one, it jumps straight to the rows.","choices":["scan","backup","commit","join"],"answer":0,"why":"Full table scan = read every row and check it. That's the default when no index can serve your query.","goDeeper":null},{"type":"multiple_choice","prompt":"An index is derived data — everything in it also exists in the table. What follows from that?","choices":["You can drop and rebuild an index without losing any data","Dropping an index deletes the underlying rows","The index is the source of truth","Indexes must be backed up separately or data is lost"],"answer":0,"why":"Indexes are pure optimization: rebuildable, droppable, and safe to experiment with. No data lives only in an index.","goDeeper":"Operationally this is liberating — you can tune performance by adding and removing indexes without risking data. It's also exactly why teams add too many of them: they feel free. The next lesson is about the bill."}]},{"id":"idx-2","title":"How it actually works","exercises":[{"type":"multiple_choice","prompt":"Databases use B-trees for indexes rather than simple binary trees. Why?","choices":["Tradition — binary trees came later","A B-tree node holds hundreds of keys, matching how disks read in big blocks — so one disk read gets you hundreds of keys instead of one","B-trees use less memory","Binary trees can't stay sorted"],"answer":1,"why":"Disks read in pages (say 8KB). A binary tree would cost one disk read per comparison — brutal. A B-tree is wide and shallow: each node is a page holding hundreds of keys, so even a billion rows is only ~3–4 disk reads deep.","goDeeper":"This is a gorgeous example of a data structure shaped by hardware. In RAM, a binary tree is perfectly fine. On disk — where a read costs ~100µs (unit 4's ladder) — you must minimize READS, not comparisons. The B-tree exists because disks read blocks, not bytes."},{"type":"multiple_choice","prompt":"You create an index on the `email` column. What does the index actually store?","choices":["A complete copy of every row","The email values, kept sorted, each with a pointer to where the full row lives","Only a list of emails, with no way back to the row","A hash of the entire row"],"answer":1,"why":"Sorted values plus pointers. That's why it's small (one column, not the whole row) and why it can find you the row once it locates the value.","goDeeper":"That pointer matters more than it looks. Finding the value in the index is fast — but then fetching the actual row is a separate, random read. Hold that thought; it explains the planner's behaviour in the next lesson."},{"type":"multiple_choice","prompt":"Why can an index on `created_at` efficiently answer 'all rows from last week'?","choices":["It can't — indexes only do exact matches","Because the index is SORTED: once you find the start of the range, the rest sit right next to each other","Because dates are small","It scans, but quickly"],"answer":1,"why":"Sortedness is what gives you ranges. Find the start, then read sequentially — you never search again.","goDeeper":"This is why sorted beats hashed for most database work. A hash index is O(1) for `= value` but completely useless for `> value` or ORDER BY, because hashing deliberately destroys order. B-trees give you equality AND ranges AND sorting from one structure — which is why they're the default everywhere."},{"type":"match_pairs","prompt":"Match each approach to what it gives you.","pairs":[{"left":"B-tree index","right":"Sorted: equality, ranges, and ORDER BY"},{"left":"Hash index","right":"Equality only — order is destroyed"},{"left":"Full table scan","right":"Read every row and check it"},{"left":"Index lookup","right":"Jump via a sorted structure"}],"why":"Different structures make different promises. The B-tree's sortedness is what makes it the versatile default.","goDeeper":"Hash indexes aren't useless — for pure key-value equality lookups they're faster and smaller. They're just too narrow to be a default, because real queries want ranges and ordering sooner or later."},{"type":"multiple_choice","prompt":"Your query ends with ORDER BY created_at, and there's an index on created_at. What's the bonus?","choices":["Nothing — indexes only help filtering","The index is already in sorted order, so the database can skip the sort step entirely","It makes the sort slower","The rows come back in random order"],"answer":1,"why":"An index doesn't just find rows — it can hand them over already in order, eliminating an expensive sort.","goDeeper":"Sorting a large result set can dominate a query's cost, and if it doesn't fit in memory it spills to disk and collapses. A surprising share of 'nothing changed, but it got slow' incidents are a query that quietly started sorting on disk as the data grew."},{"type":"multiple_choice","prompt":"What's the essential property that makes an index fast?","choices":["It's stored in RAM","It's sorted, so the database can eliminate most of the data with each step instead of checking rows one by one","It's compressed","It's written in C"],"answer":1,"why":"Order is the whole trick. Sortedness lets you discard half (or, in a B-tree, the vast majority) of the remaining candidates at every step.","goDeeper":"Which is also the clue to every index's limitation: an index can only help when your query aligns with the order it's stored in. Ask it a question that doesn't match its ordering and it may as well not exist — the theme of lesson 4."}]},{"id":"idx-3","title":"Indexes aren't free","exercises":[{"type":"multiple_choice","prompt":"You add 5 indexes to a table to make reads fast. What happens to writes?","choices":["Nothing — indexes only affect reads","Every INSERT, UPDATE, and DELETE must now update all 5 indexes too, so writes get slower","Writes get faster too","Only INSERTs are affected"],"answer":1,"why":"An index is a copy that must be kept in sync. Every write to the table pays to maintain every index on it.","goDeeper":"This is the central tradeoff of the unit: indexes buy read speed with write speed and disk. A table with 15 indexes can be several times slower to write than the same table with two. There is no free lookup — you're moving the cost, not removing it."},{"type":"multi_select","prompt":"What does each additional index cost you? Select all.","choices":["Slower writes","More disk space","More memory — indexes compete for cache","Slower reads on the indexed column"],"answer":[0,1,2],"why":"Writes, disk, and memory pressure. Reads on that column get FASTER — that's the entire point of paying the other three.","goDeeper":"The memory one is quietly important. Your indexes compete with your data for the database's cache. Enough unnecessary indexes and you evict the hot data you actually needed — so a pile of 'harmless' indexes can slow down reads they have nothing to do with."},{"type":"multiple_choice","prompt":"A team adds an index on every column, 'just in case.' Result?","choices":["Every query is now fast","Writes crawl, disk balloons, the planner has more ways to choose wrong — and most of those indexes are never used at all","No measurable effect","The database refuses"],"answer":1,"why":"Unused indexes are pure cost: maintained on every single write, read by nobody. 'Just in case' is a bill you pay forever for a benefit you never collect.","goDeeper":"Real databases track index usage statistics. Finding and dropping dead indexes is a classic, high-value, low-risk cleanup — it's common to find tables where half the indexes have never been used since the day they were created."},{"type":"multiple_choice","prompt":"You have an index on `country`. For WHERE country = 'US', where 90% of rows are US, the planner does a full scan anyway. Why?","choices":["It's a bug in the planner","Reading 90% of the table via an index means randomly jumping to nearly every row — streaming the whole table sequentially is genuinely faster","The index is corrupt","Indexes don't work on text columns"],"answer":1,"why":"The index gives you a pointer, then you pay a random read to fetch each row. Doing that for 90% of the table is far slower than just reading the table straight through.","goDeeper":"It's sequential-vs-random again — the same physics behind unit 6's write-ahead log. The planner is right and your intuition is wrong. It also reveals the rule that governs lesson 4: an index only helps when it's SELECTIVE — when it narrows to a small fraction of the table."},{"type":"multiple_choice","prompt":"Which is cheaper to use as an indexed primary key: an auto-incrementing id, or a random UUID?","choices":["They're identical","The auto-incrementing id — new values always append at the end of the index, while random UUIDs scatter writes across the whole structure","The random UUID — randomness spreads load evenly","Neither can be indexed"],"answer":1,"why":"Sequential ids append to one hot spot at the end of the index. Random UUIDs land anywhere, forcing the B-tree to split pages all over and destroying cache locality.","goDeeper":"This is a famous, real performance problem — random UUID primary keys can dramatically slow inserts on large tables. It's exactly why UUIDv7 (time-ordered) was standardized: you keep global uniqueness but restore write locality. A great example of a 'neutral' id choice quietly being a storage decision."},{"type":"tradeoff_slider","prompt":"A write-heavy audit log: billions of appends, queried only during rare investigations. Slide toward how many indexes you'd add.","leftLabel":"Few or none (fast writes)","rightLabel":"Many (fast reads)","answerRange":[0,35],"why":"Write-heavy and read-rarely means indexes are almost pure cost — you'd pay on every one of billions of writes to speed up a query someone runs twice a year.","goDeeper":"Same rule as the social feed, pointed the other way: put the work where the traffic isn't. Here the traffic is writes, so keep the write path lean and accept that the rare investigation takes a slow scan. That's the correct trade, not a compromise."}]},{"id":"idx-4","title":"Designing indexes","exercises":[{"type":"multiple_choice","prompt":"You index a boolean `is_active` column where 95% of rows are true. Does it help WHERE is_active = true?","choices":["Yes — indexes always help","Barely — it matches 95% of rows, so it isn't selective, and the planner will likely scan anyway","Yes, because booleans are small","It makes the query fail"],"answer":1,"why":"An index earns its keep by NARROWING. Matching 95% of the table narrows nothing, so you pay the write cost for essentially no read benefit.","goDeeper":"Rule of thumb: index high-cardinality columns (many distinct values — email, user_id). Indexing a boolean is usually cargo cult. But note the subtlety: the SAME column can be worth indexing for the opposite query — WHERE is_active = false matches only 1% of rows, so it's highly selective and an index genuinely helps. Selectivity is a property of the QUERY, not just the column. And if that rare case is all you ever query, reach for a partial index: one defined with its own WHERE clause (CREATE INDEX ... WHERE is_active = false) so it physically contains only those 1% of rows — far smaller, and cheaper to maintain on every write."},{"type":"multiple_choice","prompt":"You have a composite index on (last_name, first_name). Which query can use it?","choices":["WHERE first_name = 'Ada'","WHERE last_name = 'Lovelace'","Both work equally well","Neither"],"answer":1,"why":"A composite index sorts by the first column, then the second — exactly like a phone book sorted by last name, then first. You can find all the Lovelaces instantly. You cannot find all the Adas, because they're scattered across every last name.","goDeeper":"This is the leftmost prefix rule, and it's one of the most misunderstood things in databases. An index on (a, b, c) serves queries on a, on (a, b), and on (a, b, c) — but NOT on b alone, c alone, or (b, c). The column ORDER in a composite index is a real design decision, not a formality."},{"type":"multi_select","prompt":"Given an index on (a, b, c), which queries can use it? Select all.","choices":["WHERE a = 1","WHERE a = 1 AND b = 2","WHERE b = 2","WHERE a = 1 AND b = 2 AND c = 3"],"answer":[0,1,3],"why":"Leftmost prefix: you must start at `a`. Anything that begins with a can use the index; b on its own can't, because the index isn't sorted by b — it's sorted by b only within each a.","goDeeper":"Practical consequence: one well-ordered composite index on (a, b, c) can replace separate indexes on a and on (a, b) — three queries served, one index maintained. Getting the order right is how you get fast reads without drowning your writes."},{"type":"multiple_choice","prompt":"Query: SELECT email FROM users WHERE email = 'x@y.com', with an index on email. Why might the database answer this without reading the table at all?","choices":["Because the query is short","Because the index already contains every column the query asks for","Because email values are unique","It can't — it always has to read the row"],"answer":1,"why":"The index holds email values, and an email is all the query wants. When every column a query needs is already in the index, the database can answer from the index alone and skip fetching the row — an index-only scan.","goDeeper":"This is a covering index (an index-only scan), and it's a bigger deal than it sounds: you skip the random read to fetch the row, which is often the expensive half. It's why engineers sometimes add a column to an index purely so it can answer a whole query alone, without ever filtering on that column. One caveat worth carrying: Postgres still consults its visibility map and will fetch the row anyway if the page isn't marked all-visible — so 'index-only' is a best case, not a promise."},{"type":"multiple_choice","prompt":"How do you find out whether your query is actually using an index?","choices":["Time it and compare","Run EXPLAIN — the database shows you the plan it chose","Read the database source code","You can't know for sure"],"answer":1,"why":"Don't guess — ask. EXPLAIN shows the plan: whether you got a sequential scan or an index lookup, and what it estimates the cost to be.","goDeeper":"This is arguably the highest-leverage database skill for an average engineer. A huge share of 'the database is slow' turns out to be one missing index, and EXPLAIN finds it in about ten seconds. Learning to read a query plan pays for itself in a week."},{"type":"multiple_choice","prompt":"A query filters WHERE user_id = 42 AND status = 'open', then sorts ORDER BY created_at. Which single composite index best serves it?","choices":["(created_at)","(user_id, status, created_at)","(status)","(created_at, user_id, status)"],"answer":1,"why":"Equality columns first (user_id, status) to narrow hard, then the sort column (created_at). The index jumps to user 42's open rows, and they're already in created_at order — so the sort step disappears too.","goDeeper":"The general recipe: equality columns first, then your range/sort column. Get the order right and one index does the filtering AND the sorting. Get it backwards — (created_at, user_id, status) — and it's nearly useless here, because you'd have to scan every date to find user 42. Same columns, opposite outcome."},{"type":"multiple_choice","prompt":"What's the honest one-sentence summary of indexing?","choices":["Index every column so every query is fast","An index is a derived, sorted copy that trades write speed and disk for read speed — so index deliberately: for real queries, on selective columns, in the right order, and verify with EXPLAIN","Avoid indexes; they slow down writes","Let the database figure it out automatically"],"answer":1,"why":"Both extremes are wrong. Indexes are a deliberate purchase: you're spending write throughput and disk to buy read latency, and it's only a good deal when the index actually serves a query you really run.","goDeeper":"Step back and notice this is unit 5's lesson wearing new clothes: an index is a derived copy that buys speed and costs consistency work. The only difference is the database does the syncing for you — and bills you on every write. Same bargain, all the way down."}]}]};

const UNIT9 = {"unitId":"transactions-and-acid","title":"Transactions & ACID","lessons":[{"id":"txn-1","title":"All or nothing","exercises":[{"type":"multiple_choice","prompt":"Transfer $100: subtract from account A, then add to account B. The server crashes between the two steps. What happened?","choices":["Nothing — the crash undid both","$100 vanished — it left A and never arrived at B","The money doubled","The database retries automatically"],"answer":1,"why":"Two writes that must both happen or neither. Crash in the middle and you've destroyed money — with no error, and no way for either account to know.","goDeeper":"This is the canonical example for a reason: it's the clearest case where 'half done' is strictly worse than 'not done at all.' A failed transfer is an inconvenience. A half transfer is a corrupted ledger, and nobody can tell by looking at it."},{"type":"fill_blank","prompt":"A ______ groups multiple operations so they all succeed together or all fail together.","choices":["transaction","migration","query","connection"],"answer":0,"why":"A transaction turns many operations into one indivisible unit — the database's answer to 'half done.'","goDeeper":null},{"type":"multiple_choice","prompt":"What does COMMIT actually mean?","choices":["Save the data to memory","Apply every change in the transaction — all of them, together","Close the connection","Write to a log file for later"],"answer":1,"why":"COMMIT applies your whole transaction as one unit: either the whole thing takes effect, or none of it does. ROLLBACK is the opposite — discard everything since BEGIN, as though it never happened.","goDeeper":null},{"type":"multiple_choice","prompt":"You're 5 of 10 writes into a transaction when it hits an error and rolls back. What happens to those 5 writes?","choices":["They stay — they already succeeded","All 5 are undone: the database rewinds to the state at BEGIN","Only the most recent one is undone","The database pauses and asks you what to do"],"answer":1,"why":"That's atomicity: the transaction is indivisible, so a failure anywhere undoes everything since BEGIN. You can never be left with a half-finished transfer sitting in the data.","goDeeper":"Be careful with a related-but-different question: could OTHER transactions have seen those 5 writes before you committed? That is NOT atomicity — it's isolation, and the answer depends on the isolation level you're running (at Read Uncommitted they genuinely could — a 'dirty read'). Atomicity is only about whether you can be left half-done. Lesson 3 takes isolation apart properly."},{"type":"order_steps","prompt":"Order the life of a transaction.","steps":["BEGIN","Debit account A","Credit account B","COMMIT","All the changes take effect together"],"why":"Open it, do the work, commit — and only at COMMIT do all the changes take effect, as one unit. Anything before that point can still be undone.","goDeeper":"If anything fails between BEGIN and COMMIT — an error, a crash, a ROLLBACK — the database rewinds to the state at BEGIN. That rewind is exactly what the write-ahead log from unit 6 makes possible."},{"type":"multiple_choice","prompt":"Why is a transaction the right tool for a bank transfer, but overkill for logging one analytics event?","choices":["Transactions only work on money","A transfer has an invariant spanning two rows that must never break; a lone analytics insert has nothing to be atomic with","Analytics data is too large","Transactions are always the right tool"],"answer":1,"why":"Atomicity matters when several changes must hold together. A single independent insert is already all-or-nothing by itself — wrapping it in a transaction buys you nothing.","goDeeper":"Good instinct to build: reach for a transaction when there's an invariant across multiple writes. The question is never 'is this important data?' — it's 'is there a rule that would break if only some of this landed?'"}]},{"id":"txn-2","title":"ACID, honestly","exercises":[{"type":"match_pairs","prompt":"Match each letter of ACID to what it promises.","pairs":[{"left":"Atomicity","right":"All or nothing"},{"left":"Consistency","right":"Your declared rules are never violated"},{"left":"Isolation","right":"Concurrent transactions don't corrupt each other"},{"left":"Durability","right":"Committed means it survives a crash"}],"why":"Four promises: indivisible, rule-abiding, non-interfering, and permanent.","goDeeper":"They're not equally interesting, which the acronym hides. Two of them are essentially on/off, one is barely the database's doing, and one is a dial you're probably turning without realising. The rest of this lesson sorts out which is which."},{"type":"multiple_choice","prompt":"Durability: you commit, and a microsecond later the power dies. Your data?","choices":["Lost — it was still in memory","There — commit meant it was durably recorded before the database answered you","Partially there","Recovered only if you had a backup"],"answer":1,"why":"That's the D, and it's the promise you met in unit 6: the write-ahead log is forced to disk before COMMIT returns.","goDeeper":"Which is why COMMIT isn't instant — it's waiting on physics. Every 'why are my writes slow?' question eventually arrives at this: you asked for a guarantee that requires the disk to confirm."},{"type":"multiple_choice","prompt":"Which letter of ACID is really about YOUR rules rather than the database's own machinery?","choices":["Atomicity","Consistency — it just means the constraints you declared (unique, foreign keys, checks) hold before and after","Isolation","Durability"],"answer":1,"why":"A, I, and D are properties the engine provides. C only says: the database won't let you violate the constraints you defined. If you declared no constraints, C promises approximately nothing.","goDeeper":"Plenty of practitioners argue the C is a bit of a cheat — it's really 'the database enforces your declared invariants,' which is just... constraints. The genuinely hard letters are A, I, and D. And watch out: the C in CAP means something completely different, a collision of names that has confused engineers for twenty years."},{"type":"multiple_choice","prompt":"Which ACID property do you actually have to make decisions about?","choices":["Atomicity — you configure how atomic it is","Isolation — it's a dial with several settings, each trading correctness for speed","Durability — you pick how durable","Consistency — you tune it per query"],"answer":1,"why":"Atomicity and durability are essentially on or off — you get them. Isolation is a spectrum you configure, and the setting decides which concurrency bugs remain possible.","goDeeper":"Here's the uncomfortable part: most engineers cannot tell you what isolation level their production database runs at. They're relying on guarantees they've never looked up — and the defaults are not the strongest ones. That's the next lesson."},{"type":"multi_select","prompt":"Which of these statements are TRUE? Select all.","choices":["Atomicity is about all-or-nothing","Durability is about surviving crashes","Isolation is a single fixed guarantee every database provides identically","The C in ACID means something different from the C in CAP"],"answer":[0,1,3],"why":"Isolation is the odd one — it's configurable, and databases differ in both their defaults and what their level names actually mean.","goDeeper":"That last point is a genuine trap: two databases can both say 'Repeatable Read' and give you materially different guarantees. The label is not the specification."},{"type":"multiple_choice","prompt":"A colleague says 'we use Postgres, so we're ACID — concurrency bugs are impossible.' What's wrong?","choices":["Nothing — that's correct","ACID doesn't mean 'maximum isolation.' The default level still permits real anomalies; you have to opt into stronger guarantees","Postgres isn't ACID","ACID only applies to reads"],"answer":1,"why":"'ACID compliant' is not a force field. The I in ACID is whatever level you're running — and the default is not serializable.","goDeeper":"This misconception causes real bugs. Teams assume the database is protecting an invariant it was never asked to protect, then find corrupted data months later with no error in any log. Concurrency bugs don't crash — they quietly lie."}]},{"id":"txn-3","title":"Isolation is a dial","exercises":[{"type":"multiple_choice","prompt":"Why don't databases just always use the strictest isolation?","choices":["They do","Stricter isolation costs performance — more locking or coordination and more aborted transactions — so you get to choose","Strict isolation is less correct","It's a licensing restriction"],"answer":1,"why":"Isolation is bought with throughput. The stricter you go, the more the database must coordinate or abort, so it lets you pick your point on the curve.","goDeeper":"And the defaults are NOT the strictest. Postgres defaults to Read Committed; MySQL's InnoDB defaults to Repeatable Read. Neither is serializable. So unless you changed it deliberately, you are running with known anomalies permitted — right now, in production."},{"type":"match_pairs","prompt":"Match each concurrency anomaly to what goes wrong.","pairs":[{"left":"Dirty read","right":"You read data another transaction hasn't committed"},{"left":"Non-repeatable read","right":"You read the same row twice and get different values"},{"left":"Phantom read","right":"You re-run a range query and new rows appear"},{"left":"Lost update","right":"Two read-modify-writes; one is silently overwritten"}],"why":"Each isolation level is defined by which of these it forbids. Knowing the anomalies is how you read the levels.","goDeeper":"You already met lost update in unit 6 — the counter that went from 10 to 11 instead of 12. It wasn't a database bug; it was an isolation level doing exactly what it promised, which was less than you assumed."},{"type":"order_steps","prompt":"Order the isolation levels from weakest to strongest.","steps":["Read Uncommitted","Read Committed","Repeatable Read","Serializable"],"why":"Each rung forbids more anomalies and costs more coordination. Read Uncommitted allows dirty reads; Read Committed stops them; Repeatable Read stops non-repeatable reads; Serializable stops everything.","goDeeper":"Read Uncommitted is almost never worth using — you get dirty reads for a performance win that modern engines barely deliver. The real decision in practice is between Read Committed, Repeatable Read, and Serializable."},{"type":"multiple_choice","prompt":"What does Serializable actually guarantee?","choices":["Transactions literally run one at a time, so it's very slow","The RESULT is as if they'd run one at a time in some order — even though they ran concurrently","That no transaction ever fails","That reads are always fast"],"answer":1,"why":"It's a promise about the outcome, not the schedule. The database may run everything concurrently, as long as the final state matches SOME serial order.","goDeeper":"That 'as if' does enormous work. The engine may let transactions run in parallel and then ABORT one when it spots a conflict that couldn't have arisen serially. Which means under Serializable your transaction can fail through no fault of its own — and your code must be ready to retry. Correctness didn't become free; it moved into your error handling."},{"type":"multiple_choice","prompt":"Two doctors are on call. Each opens a transaction, checks 'is at least one OTHER doctor on call?', sees yes, and books themselves off. Both commit. Now nobody is on call — though each transaction was individually valid. What is this?","choices":["A dirty read","Write skew — they read overlapping data but wrote to different rows, so nothing conflicted","A phantom read","A deadlock"],"answer":1,"why":"No two transactions touched the same row, so most isolation levels see no conflict at all. Yet together they broke an invariant that neither broke alone.","goDeeper":"This is the anomaly that snapshot isolation — which is what Postgres's 'Repeatable Read' actually is — still permits, and that Serializable prevents. It's subtle precisely BECAUSE nothing overlapped: the bug lives in a rule spanning rows, not in any single row. If your correctness depends on an invariant across multiple rows, Read Committed and Repeatable Read will not save you."},{"type":"multiple_choice","prompt":"Your correctness depends on an invariant spanning multiple rows that must never break. What do you do?","choices":["Hope — it's rare","Use Serializable and handle retries, take an explicit lock, or restructure so the invariant lives in a single row","Add an index","Switch to NoSQL"],"answer":1,"why":"Three real options: pay for Serializable (and be ready to retry), lock explicitly so conflicts are visible, or reshape the data so the rule is enforceable in one place.","goDeeper":"That third option is underrated. If the invariant can be expressed as a single row — a counter, a constraint, a unique key — the database can enforce it cheaply and unconditionally. Often the best fix for a hard concurrency problem is a better data model, not a stronger isolation level."}]},{"id":"txn-4","title":"Transactions in the real world","exercises":[{"type":"multiple_choice","prompt":"Transaction 1 locks row A and then wants row B. Transaction 2 locks row B and then wants row A. What happens?","choices":["They both wait forever, silently","Deadlock — the database detects the cycle, kills one, and that one gets an error and must retry","They merge into one transaction","The database crashes"],"answer":1,"why":"Each holds what the other needs. Real databases detect the cycle and abort a victim rather than hanging forever — so one transaction gets an error out of nowhere.","goDeeper":"The classic prevention is to always acquire locks in a consistent order — e.g. always lock the lower account id first, so a cycle can't form. Deadlocks aren't a database defect; they're an emergent property of concurrent code, and your app must be prepared to retry."},{"type":"multiple_choice","prompt":"You open a transaction and hold it for 10 minutes while calling an external payment API inside it. What's the damage?","choices":["None — the transaction just waits","You hold locks the whole time, block other transactions, and force the database to retain old row versions — bloating storage and slowing everything","It makes the payment faster","The database ignores idle transactions"],"answer":1,"why":"A held transaction holds locks and pins old versions of rows. Everyone who needs those rows queues behind you — for as long as a third party takes to answer.","goDeeper":"The rule: never do network I/O inside a transaction. This is one of the most common real production outages there is — the slow API call holds locks, waiting transactions pile up (unit 4's queueing), the connection pool exhausts, and a payments hiccup becomes a total site outage. Do the I/O first, then open a short transaction to record the result."},{"type":"match_pairs","prompt":"Match each concurrency strategy to what it is.","pairs":[{"left":"Pessimistic locking","right":"Lock up front — assume conflict is likely"},{"left":"Optimistic concurrency","right":"Proceed, detect conflict at commit, retry"},{"left":"Version number check","right":"How optimistic concurrency spots a conflict"},{"left":"Deadlock","right":"Two transactions each holding what the other wants"}],"why":"Two philosophies: prevent conflicts by excluding others, or allow them and detect collisions at the end.","goDeeper":"Optimistic concurrency is usually a version column: read version 7, write only if it's still 7. If someone else got there first it's now 8, your update matches nothing, and you retry. It's just compare-and-set, applied to a row."},{"type":"multiple_choice","prompt":"Your workload has rare conflicts — users almost never edit the same row simultaneously. Which strategy usually wins?","choices":["Pessimistic locking — safety first","Optimistic concurrency — conflicts are rare, so occasionally retrying beats making everyone wait","Neither works","It makes no difference"],"answer":1,"why":"If collisions are rare, locking everyone up front taxes the 99% of transactions that would never have conflicted. Let them run and pay only when you actually collide.","goDeeper":"And the inverse matters just as much: under HIGH contention, optimistic degenerates — everyone retries, collides again, and you burn capacity making no progress. Pessimistic is calmer there. Choose from how often you actually collide, not from which sounds more sophisticated."},{"type":"multiple_choice","prompt":"You must charge a credit card (an external service) AND create an order (your database) atomically. Can a database transaction do this?","choices":["Yes — wrap both in BEGIN/COMMIT","No — a database transaction only covers its own database; the card charge is a separate system that knows nothing about your COMMIT or ROLLBACK","Yes, if you use Serializable","Yes, with the right driver"],"answer":1,"why":"Atomicity stops at the database boundary. Your ROLLBACK can rewind your rows — it cannot un-charge someone's card.","goDeeper":"This is where people get badly burned, because the code LOOKS atomic. The real patterns are: two-phase commit (a coordinator asks every participant to prepare, then commit — correct, but slow, and it blocks if the coordinator dies mid-flight), or a saga (do the steps, and if a later one fails, run compensating actions — issue a refund). Most modern systems choose sagas plus idempotency (unit 2) over 2PC."},{"type":"tradeoff_slider","prompt":"Microservices: an order service and a payment service, each with its own database. Slide toward your approach for keeping them consistent.","leftLabel":"Two-phase commit (strict atomicity)","rightLabel":"Saga (compensating actions, eventual)","answerRange":[55,100],"why":"Across services, 2PC's blocking behaviour and coordinator failure modes are usually worse than the complexity of writing compensating actions. Most real distributed systems choose sagas.","goDeeper":"But be honest about what you just gave up: there's now a window where the payment succeeded and the order doesn't exist yet. You accepted a temporarily inconsistent state plus a compensation path — because the alternative, a distributed lock spanning services, is worse. That acceptance is the road to eventual consistency, and it's where Tier 3 begins."},{"type":"multiple_choice","prompt":"What's the honest summary of transactions?","choices":["Always use Serializable and never think about it again","A transaction buys atomicity and a chosen isolation level within ONE database — so know your level, keep transactions short, and remember the guarantee stops at the database boundary","Transactions are legacy; use eventual consistency everywhere","Transactions make concurrency bugs impossible"],"answer":1,"why":"Powerful, bounded, and configurable. The power is real; the boundary and the dial are what people forget.","goDeeper":"Three things most engineers get wrong, in order of damage: (1) they don't know their isolation level, (2) they hold transactions open across network calls, (3) they assume atomicity extends across services. Fix those three and you're ahead of most working engineers — and you're ready for what happens when the copies can't talk to each other."}]}]};
