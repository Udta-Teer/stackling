const UNIT13 = {"unitId":"caching","title":"Caching","subtitle":"Keep the hot answers close — and pay for the second copy","lessons":[{"id":"cache-1","title":"Keep the answer close","exercises":[{"id":"cache-1-0","type":"concept","title":"A cache is a bet that you'll be asked the same question twice","viz":{"nodes":[{"id":"a","label":"App Server","col":0,"kind":"server"},{"id":"c","label":"Cache","sub":"~1ms","col":1,"kind":"cache"},{"id":"d","label":"Database","sub":"~100ms","col":2,"kind":"db"}],"edges":[{"from":"a","to":"c"},{"from":"c","to":"d"}]},"body":"A cache sits in front of expensive work — a slow database query, an API call, a disk read — and keeps a copy of the answer. Ask the same question again and it replies from memory instead of redoing the work. That is the entire mechanism. Notice what it is not: nothing got faster and no work got cheaper. You just stopped doing it.","note":"So the bet only pays off if the question really does repeat. Cache something asked once and you have bought a component, a failure mode and a whole new way to be wrong — for nothing."},{"id":"cache-1-1","type":"multiple_choice","prompt":"Your product page runs the same expensive database query 10,000 times a second. Every single run returns an identical result. What's the cheapest fix?","choices":["Buy a faster database","Run the query once, keep the answer somewhere fast, and hand out that copy","Add more application servers","Ask users to refresh less often"],"answer":1,"why":"Nothing about that query got cheaper — you just stopped running it 9,999 times. That's the whole idea: the fastest work is work you skip. Notice the other options scale the waste instead of removing it — a faster database runs the same pointless query faster, and more app servers generate more copies of it. And caching only pays off because the answer gets reused: if all 10,000 requests wanted different results, there'd be nothing to hand out."},{"id":"cache-1-2","type":"fill_blank","prompt":"A ______ stores the result of expensive work so the next request gets the answer without redoing it.","choices":["cache","queue","replica","index"],"answer":0,"why":"Store the answer, skip the work. It's worth seeing what a cache is NOT, since the other three are real things you'll meet: a replica (unit 10) is a full copy kept deliberately in sync, and an index (unit 8) makes the work itself cheaper. A cache does neither. It just remembers a result it happened to see, and it's allowed to forget it at any moment."},{"id":"cache-1-3","type":"multiple_choice","prompt":"Your database holds 50 million products. Your cache holds 50,000 — one thousandth of them. Why isn't that hopeless?","choices":["Because the cache is faster, so it makes up the difference","Because requests aren't spread evenly — a small set of products gets asked for constantly, and that set fits","Because the cache compresses the data","Because 50,000 is enough for most databases"],"answer":1,"why":"Real traffic is wildly lopsided: a handful of products — the front page, the viral one, today's deal — absorb a huge share of requests, and that hot set is small enough to fit. Caching is a bet on that skew, which means whether it works is a property of your TRAFFIC, not your cache. Flip it around to feel it: if all 50 million products were requested uniformly at random, a 50,000-item cache would hit about 0.1% of the time, and you'd have added a network hop, a config, and a staleness bug for nothing."},{"id":"cache-1-4","type":"match_pairs","prompt":"Match each read to roughly what it costs (order-of-magnitude, not precise).","pairs":[{"left":"Local memory, same process","right":"~100 nanoseconds"},{"left":"Cache over the network, same datacenter","right":"~0.5–1 millisecond"},{"left":"Indexed database query on SSD","right":"~1–10 milliseconds"},{"left":"Round trip New York → London","right":"~70 milliseconds"}],"why":"The jump that surprises people is the second one. A Redis lookup isn't fast because memory is fast — it's roughly 5,000× slower than the memory in your own process, because you're paying a network round trip (unit 4) and barely touching the memory at all. It only looks fast next to the thing it replaced. That gap is exactly why an in-process cache and a shared cache are two different tools rather than the same tool in two sizes."},{"id":"cache-1-5","type":"multi_select","prompt":"Which of these are good things to cache? Select all.","choices":["A product page that changes twice a year and is viewed a million times a day","A slow report that every user on the dashboard requests","A user's current account balance, read to decide whether a transfer clears","A 'trending now' feed that's expensive to compute and fine a minute out of date"],"answer":[0,1,3],"why":"The pattern is three conditions at once: expensive to produce, read far more than written, and tolerant of being slightly stale. The balance fails the third — and it fails for the reader's sake rather than because it changes often; unit 5 already settled that a balance is the one number the user came to see. But cacheability really is a property of the READ rather than of the data, and stock count shows it cleanly: '12 left' on a browse page can be a minute stale and nobody is harmed, while the same number checked at checkout must be exact or you've just oversold the item."},{"id":"cache-1-6","type":"multiple_choice","prompt":"You add a cache. What have you unavoidably introduced?","choices":["A second copy of the data that is allowed to disagree with the source of truth","A slower system","A new database","Nothing — it's a pure win"],"answer":0,"why":"A cache is a copy, so unit 5's rule applies the moment you add one: truth now lives in two places, they can disagree, and you own the question of how wrong you'll let the copy get. Every hard part of this unit — invalidation, TTLs, the races in lesson 4 — is the bill for that one sentence. Caching gets pitched as free speed. It isn't: you bought latency with correctness, and the only question left is how much correctness you're spending."}]},{"id":"cache-2","title":"How it's wired","exercises":[{"id":"cache-2-0","type":"concept","title":"In cache-aside, your application owns the cache — the database has never heard of it","viz":{"nodes":[{"id":"a","label":"App Server","col":0,"kind":"server"},{"id":"c","label":"Cache","sub":"1 · ask first","col":1,"kind":"cache"},{"id":"d","label":"Database","sub":"2 · only on miss","col":1,"kind":"db"}],"edges":[{"from":"a","to":"c"},{"from":"a","to":"d"}]},"body":"The app asks the cache first. On a miss it reads the database itself, then writes the answer back into the cache itself. Both arrows start at the app — the database has no idea the cache exists. That is why cache-aside works with any store, and why every cache bug is yours: your code decides what to cache, for how long, and when to throw it away.","note":"Read-through looks identical on a whiteboard but is not: there the cache calls the database for you. Who makes that second call is the whole distinction."},{"id":"cache-2-1","type":"order_steps","prompt":"Order a cache-aside read — the most common wiring.","steps":["App asks the cache for key 'product:42'","Cache misses — it doesn't have it","App queries the database","App writes the result into the cache","App returns the result to the user"],"why":"The app orchestrates every step here, which is exactly what 'aside' means: in this pattern the cache is a dumb box that stores what it's told and never talks to the database itself. That buys a property worth noticing — if the cache is empty or dead, this path still works, it's just slow. Being able to degrade to 'merely slow' rather than 'broken' is a large part of why cache-aside dominates in practice."},{"id":"cache-2-2","type":"fill_blank","prompt":"Cache-aside is also called ______ loading, because an item only enters the cache when someone actually asks for it.","choices":["lazy","eager","write","bulk"],"answer":0,"why":"Populate on demand. The upside is that you never spend memory on data nobody has asked for, so real traffic shapes the cache's contents with no guesswork from you — though note that's a weaker promise than it sounds, since anything that was popular once keeps its slot until eviction gets around to it. The downside is the mirror image of the upside: every item's first request is guaranteed to miss, so a freshly-started cache misses everything at once, which is why 'just restart the cache' is a sentence that has taken down real sites."},{"id":"cache-2-3","type":"match_pairs","prompt":"Match each caching pattern to how it works.","pairs":[{"left":"Cache-aside","right":"App checks the cache, and on a miss loads from the DB itself"},{"left":"Read-through","right":"App only talks to the cache; the cache loads from the DB on a miss"},{"left":"Write-through","right":"Writes go to cache and DB together, before the write is acknowledged"},{"left":"Write-behind","right":"Writes land in the cache and flush to the DB later"}],"why":"The two read patterns differ only in who does the fetching on a miss — the app or the cache — which is a question about where complexity lives, not about what the user experiences. The write patterns are the ones with teeth: write-through pays latency on every single write to keep the cache warm and avoid a first-read miss, while write-behind makes writes feel instant by acknowledging data that isn't durable yet. Note what write-through does NOT buy — correctness under concurrency. It's still update-on-write, so two writers can land in the cache in the opposite order they landed in the database, exactly as lesson 4 shows."},{"id":"cache-2-4","type":"multiple_choice","prompt":"Write-behind acknowledges a write as soon as it's in the cache, then flushes to the database a moment later. What did you just trade away?","choices":["Read speed","Durability — you told the user 'saved' while the only copy sat in memory that can vanish","The ability to cache reads","Nothing — the flush always succeeds eventually"],"answer":1,"why":"You moved the acknowledgement earlier than the persistence, and everything in that window is a promise you can't keep. If the cache node dies before the flush, the data is gone AND the user was told it was saved — the worst pairing available, because nobody retries something they believe succeeded. This is unit 9's D in ACID, handed over deliberately in exchange for speed. Defensible for view counts and metrics; indefensible for an order."},{"id":"cache-2-5","type":"build_diagram","prompt":"Build the read path: the app should check for a saved answer *before* doing the expensive work.","viz":{"nodes":[{"id":"a","label":"App Server","col":0,"kind":"server"},{"id":"h1","sub":"1 · ask first","col":1,"hole":true},{"id":"h2","sub":"2 · only on miss","col":1,"hole":true}],"edges":[{"from":"a","to":"h1"},{"from":"a","to":"h2","dash":true}]},"palette":["Cache","Database","Message Queue","Load Balancer"],"answer":{"h1":"Cache","h2":"Database"},"why":"A cache goes on the read path, in front of whatever you want to do less of — that's the general shape, and it's why you'll see caches at every layer of a real system rather than at one 'correct' spot. The position is what makes it useful and dangerous at the same time: reads now consult a component that is explicitly allowed to be out of date."},{"id":"cache-2-6","type":"multiple_choice","prompt":"You use cache-aside at a 95% hit rate. Your Redis cluster dies completely, at peak traffic. What happens?","choices":["Every request goes straight to the database — which suddenly takes 20× its normal read load and may fall over","The app crashes","Writes fail","Nothing changes"],"answer":0,"why":"The code degrades correctly — a miss just means 'ask the database' — so nothing is logically broken. The trap is capacity. At a 95% hit rate your database was quietly serving 5% of reads, so losing the cache multiplies its load by twenty in an instant, and unless someone deliberately sized it for the uncached load, twenty times is not a margin much survives. The cache wasn't an optimization, it was load-bearing, and the database has no idea it was being protected. This is why 'the cache is just a speedup' is a dangerous thing to believe."},{"id":"cache-2-7","type":"multiple_choice","prompt":"You cache in each app server's own memory instead of a shared Redis. What's the catch?","choices":["It's slower than a shared cache","Each server has its own copy — so they can disagree with each other, and every server must warm up separately","It can't store structured objects","There's no catch"],"answer":1,"why":"In-process caching is genuinely appealing: roughly 5,000× faster per hit by lesson 1's ladder, with no network hop to fail. What you pay is consistency and warmth. N servers means N copies means N versions of the truth, so a user hitting refresh can bounce between two different answers depending on where the load balancer (unit 12) sends them. You also multiply memory by N, and every deploy throws all of it away at once. A shared cache trades a network hop for one answer everybody agrees on."}]},{"id":"cache-3","title":"Eviction & the hit rate that matters","exercises":[{"id":"cache-3-0","type":"concept","title":"A cache doesn't reduce traffic — it splits it","viz":{"nodes":[{"id":"a","label":"App Servers","sub":"10k req/s","col":0,"kind":"server"},{"id":"c","label":"Cache","sub":"9.5k hits","col":1,"kind":"cache"},{"id":"d","label":"Database","sub":"500 misses","col":1,"kind":"db"}],"edges":[{"from":"a","to":"c"},{"from":"a","to":"d"}]},"body":"10,000 reads a second arrive. At a 95% hit rate, 9,500 are answered from memory and 500 continue, unchanged — same query, same cost, just fewer of them. Whatever sits behind the cache only ever has to survive that leftover. So *is my cache good enough* was never a question about the cache. It's a question about what the leftover does to the thing behind it.","note":"A cache is smaller than the data behind it, often by a factor of a thousand — and everything else in this lesson follows from that one inconvenient ratio."},{"id":"cache-3-sim","type":"simulate","prompt":"Read traffic is 20,000 req/s. Your database tops out at 2,000 req/s before it falls over. Drag the hit rate to the *lowest* setting that keeps it alive.","viz":{"nodes":[{"id":"a","label":"App Servers","col":0,"kind":"server"},{"id":"cache","label":"Cache","col":1,"kind":"cache"},{"id":"db","label":"Database","col":1,"kind":"db"}],"edges":[{"from":"a","to":"cache"},{"from":"a","to":"db","dash":true}]},"sim":{"input":20000,"inputLabel":"Read traffic","chain":["cache","db"],"capacity":{"cache":100000,"db":2000},"watch":"db","watchLabel":"Hitting the database","absorb":{"node":"cache","label":"Cache hit rate","min":0,"max":100,"start":0,"unit":"%"}},"answerRange":[90,92],"why":"90% exactly: 20,000 × 10% miss = 2,000, right on the edge. Now notice what the slider did on the way there — the number that reaches your database is set by the MISS rate, not the hit rate. Going 90% → 99% sounds like a 9-point tweak and is really 2,000 → 200: a 10× cut. Going 99% → 99.9% is another 10×. That is why hit rate is quoted in nines, and why the last fraction of a percent is worth fighting for while the first 50% is nearly free."},{"id":"cache-3-1","type":"multiple_choice","prompt":"Your cache's memory fills up. A new item needs to go in. What has to happen?","choices":["Something already in the cache gets thrown out to make room","The cache grows itself to fit","The item is stored on disk instead","The oldest item moves back to the database"],"answer":0,"why":"A cache is finite on purpose — something that held everything wouldn't be a cache, it'd be a copy of your database with no durability guarantee. So it lives in a permanent state of deciding what to forget, and that decision is the entire game: identical hardware can give you a 60% hit rate or a 95% one depending purely on what it chooses to throw away."},{"id":"cache-3-2","type":"match_pairs","prompt":"Match each eviction policy to what it throws out.","pairs":[{"left":"`LRU` (least recently used)","right":"Whatever hasn't been touched for the longest"},{"left":"LFU (least frequently used)","right":"Whatever gets asked for least often"},{"left":"`TTL` (time to live)","right":"Anything past its expiry, popular or not"},{"left":"Random","right":"An arbitrary victim"}],"why":"`LRU` is the default nearly everywhere because recency is a cheap and decent predictor of the near future. LFU beats it when popularity is stable, but it clings to items that were huge last month and are dead now, unless you age the counts. `TTL` is the odd one out and it's worth seeing why: `LRU` throws things out because you ran out of room, `TTL` throws them out because you stopped trusting them — space versus correctness, two different problems wearing the same clothes. Random sounds like a joke and isn't: it needs no bookkeeping and performs respectably."},{"id":"cache-3-3","type":"multiple_choice","prompt":"Your `LRU` cache holds the 50,000 hottest products at a 96% hit rate. A nightly job starts reading all 50 million products once, in order. What happens?","choices":["Nothing — the job's reads get cached too","The hit rate collapses: every scanned item counts as 'recently used', so the scan evicts the entire hot set for data nobody will ask for again","It improves — more data is now cached","The cache rejects the job's reads"],"answer":1,"why":"`LRU` assumes recently-used predicts soon-to-be-used, and a sequential scan violates that assumption perfectly: every item it touches is maximally recent and minimally likely to be needed again. So the scan flushes your hot set, users start hitting the database, and the cache sits there full of garbage. That's cache pollution, and it's why a batch job can take down a site it never queries — the damage is entirely collateral. The fixes are to keep scans off the cache path, or to use a policy that makes an item earn its place with a second access."},{"id":"cache-3-4","type":"estimate","prompt":"A cache hit takes 1ms. A miss costs 100ms all-in. At a 95% hit rate, what's the average read latency in milliseconds?","answer":6,"tolerance":2,"unit":"ms","why":"0.95 × 1ms + 0.05 × 100ms = 5.95ms. Now look at where that number came from: the 5% that miss contribute 5ms of the 5.95, so about 84% of your average latency is produced by one request in twenty. That's the shape of every cache — the misses own the average and the hits are nearly irrelevant to it, which is why tuning the hit path is almost always the wrong place to spend your afternoon."},{"id":"cache-3-5","type":"multiple_choice","prompt":"Your hit rate is 90%. You tune it to 99%. That's only 9 points. Why is it actually enormous?","choices":["It isn't — 9% is marginal","Because the misses are what cost you: 10% → 1% is one tenth as many misses, so one tenth the database load","Because the cache got faster","Because 99% is a round number"],"answer":1,"why":"Always read the miss rate, not the hit rate — 'hit rate' is a vanity framing that squashes the entire interesting range into a sliver at the top. Said properly, 90 → 99 removed 90% of your remaining misses, so your database's read load dropped 10×. In this lesson's numbers the average read falls from 10.9ms to 1.99ms. And the logic keeps going: 99% → 99.9% is another 10× cut, which is exactly why teams up here fight over fractions of a percent that sound absurd from the outside."},{"id":"cache-3-6","type":"multi_select","prompt":"Which of these actually raise your hit RATE? Select all.","choices":["More cache memory, so the hot set fits","A longer `TTL`, so entries live long enough to be reused","Keeping batch scans off the cache so they can't evict the hot set","A faster network to the cache"],"answer":[0,1,2],"why":"Three things decide hit rate: whether the hot set fits, whether entries survive long enough to be reused, and whether anything is polluting the cache. A faster network makes each hit cheaper — that's hit LATENCY, a different axis entirely, and it does nothing to the rate. Keep them separate, because 'the cache is slow' and 'the cache is missing' have opposite fixes and the second is nearly always the bigger number. Note the second option isn't free either: every extra second of `TTL` is another second you've agreed to be wrong."},{"id":"cache-3-7","type":"multiple_choice","prompt":"You set a 60-second `TTL` on a cached value. What have you actually decided?","choices":["That the value takes 60 seconds to compute","That you're willing to serve data up to 60 seconds out of date","That the value will be refreshed every 60 seconds","That the cache holds 60 seconds of data"],"answer":1,"why":"A `TTL` is a correctness decision wearing a performance costume: you're stating the maximum lag you'll tolerate between the source of truth and what users see. That's what makes it the pragmatic escape from invalidation (lesson 4) — rather than tracking every change perfectly, you promise to be wrong for at most 60 seconds. And it's a ceiling, not a schedule: with lazy loading nothing refreshes on a timer, the entry simply expires, and the next reader — whenever they show up, in a second or an hour — pays to rebuild it."}]},{"id":"cache-4","title":"The hard parts","exercises":[{"id":"cache-4-0","type":"concept","title":"Your data flows into cache keys, and nothing in your system can trace it back","viz":{"nodes":[{"id":"w","label":"One price changes","sub":"1 write","col":0},{"id":"k1","label":"Product page","sub":"now stale","col":1,"kind":"cache"},{"id":"k2","label":"Category list","sub":"now stale","col":1,"kind":"cache"},{"id":"k3","label":"Search result","sub":"now stale","col":1,"kind":"cache"},{"id":"k4","label":"Homepage deals","sub":"now stale","col":1,"kind":"cache"}],"edges":[{"from":"w","to":"k1"},{"from":"w","to":"k2"},{"from":"w","to":"k3"},{"from":"w","to":"k4"}]},"body":"Your code turns source data into cached values all day: read the product row, render the page, store it under a key. That derivation only ever runs forwards. Nothing records which rows fed which keys — no index, no log, no foreign key. There is a list, it lives in one engineer's head, and it was accurate once.","note":"And the list decays. Every new feature reading that row adds a key, and nothing links the new read to the old invalidation code — so a cache that was right on Tuesday is wrong by Friday, and nobody touched the caching."},{"id":"cache-4-1","type":"multiple_choice","prompt":"Phil Karlton's famous line: 'There are only two hard things in Computer Science: cache invalidation and naming things.' Why is invalidation genuinely hard?","choices":["Deleting a key is computationally expensive","Knowing WHICH keys a change affects — and finding all of them — is the hard part, and getting it wrong is silent","Caches don't support deletion","It requires taking the cache offline"],"answer":1,"why":"Deleting a key is trivial; the hard part is the question that comes before it. One product's price changing might invalidate the product page, three category listings, a search result, and a homepage module — and nothing in your system tells you that. What makes it vicious is the failure mode: a missed invalidation throws no error and appears in no log. It just serves a wrong answer, confidently, until something else happens to evict it. Bugs that page you are easy. Bugs that quietly lie for a week are hard."},{"id":"cache-4-2","type":"multiple_choice","prompt":"On a write, should you update the cached value or just delete it?","choices":["Update it — that keeps the cache warm","Usually delete it: updating computes a value nobody asked for, and races with other writers over whose version lands last","Neither — let the `TTL` handle it","Both, for safety"],"answer":1,"why":"Deleting is safe precisely because it isn't a claim about anything — it says 'I don't know', and the next reader rebuilds from the source of truth. Updating asserts a value, so two concurrent writers can land their updates in the cache in the opposite order they landed them in the database, leaving the cache permanently disagreeing with the DB and no error raised anywhere. You also pay to compute a value that may never be read. Delete is the humbler operation, and humility buys a lot here."},{"id":"cache-4-3","type":"multiple_choice","prompt":"One extremely popular key — your homepage feed, 10,000 requests/sec — hits its `TTL` and expires. What happens in the next instant?","choices":["The cache rebuilds it automatically before anyone notices","All 10,000 requests miss at once, and every one of them runs the expensive rebuild against the database simultaneously","One request rebuilds it and the rest wait","The requests queue up behind the first one"],"answer":1,"why":"Nothing coordinates them. Each request independently checks the cache, sees nothing, and does exactly what it was told: go rebuild it. So a query your database saw zero times per second now arrives 10,000 times in the same instant — and the more popular the key, the harder the hit, which means your best-cached content is your biggest liability. This is a cache stampede (or thundering herd), and it's a favourite way for a site to die at a moment when nothing was wrong: no traffic spike, no deploy, no failure. Just a timer expiring."},{"id":"cache-4-4","type":"multi_select","prompt":"Which of these actually help against a cache stampede? Select all.","choices":["A lock, so only the first request rebuilds and the others wait for it","Serve the stale value while one request refreshes it in the background","Add jitter to TTLs so a batch of keys doesn't all expire in the same instant","Shorten the `TTL` so it happens more often but costs less each time"],"answer":[0,1,2],"why":"The first two attack the herd directly: let exactly one request through, and either make the rest wait or hand them slightly-stale data — usually the nicer option, since nobody experiences a stall at all. Jitter attacks a related killer, where keys cached together (everything warmed at deploy, say) expire together, turning one expiry into a synchronized fleet-wide miss. Shortening the `TTL` makes both problems worse: more stampedes, and no reduction in the size of any one herd. Facebook's memcache team hit this hard enough at scale to invent leases for it, described in their 2013 paper."},{"id":"cache-4-5","type":"multiple_choice","prompt":"Two things happen at once. Request A misses and reads value V1 from the database. Before A writes it back, request B writes V2 to the database and deletes the cache key — which is already empty, so that's a no-op. Then A writes V1 into the cache. What's the state?","choices":["The cache holds V2 — correct","The cache holds V1 while the database holds V2, and the invalidation already happened, so nothing will fix it until the `TTL` expires","The cache is empty","A's write fails"],"answer":1,"why":"Neither request did anything wrong. A read a value that was true when it read it and wrote it back a moment later; B wrote and dutifully invalidated. But B's invalidation landed in the gap between A's read and A's write, so it deleted nothing, and then A resurrected a dead value on top of it. The cache is now confidently wrong and no future event will correct it — only the `TTL` will, which is why even a perfectly-invalidated cache still needs one as a backstop. This is the race Facebook's leases exist to close: A takes a lease on the miss, B's write voids it, and A's stale set gets rejected. Take the general lesson too — a cache plus a database is two copies with no coordination between them, so you're doing distributed systems now whether you signed up for it or not."},{"id":"cache-4-6","type":"tradeoff_slider","prompt":"You're picking a `TTL` for a product's price, shown on a page viewed a million times a day. Slide toward your choice.","leftLabel":"Long `TTL` (fewer misses, more staleness)","rightLabel":"Short `TTL` (fresher, more load)","answerRange":[45,85],"why":"Prices are the classic case where staleness has a bill attached — show $8, charge $10, and you have a support problem and possibly a legal one — so this leans short. But the question is a little bit of a trap: `TTL` is your worst tool here. A price change is an EVENT you already know about, so invalidate on the write and the cache is correct within milliseconds no matter what the `TTL` says, which frees the `TTL` to do what it's genuinely good at — backstopping the invalidations you'll inevitably miss, including the race in the previous exercise. Reach for a very long `TTL` only when you're confident invalidation is airtight, and a very short one only when you can't detect the change at all and you're reduced to polling."},{"id":"cache-4-7","type":"multiple_choice","prompt":"What's the honest summary of caching?","choices":["It makes your system fast for free","It buys latency and backend relief by keeping a second copy that's allowed to be wrong — and hands you invalidation, eviction, stampedes, and a component your system now secretly depends on","It's only needed above millions of users","It removes the need for a fast database"],"answer":1,"why":"Caching is the highest-leverage move in this tier — a 95% hit rate takes 20× the read load off your database for the price of some memory — and it's sold as free speed, which is the lie. Look at what you actually took on: a second copy of the truth (unit 5), a race you can't reliably test your way out of, a component whose loss multiplies your database load 20× at the worst possible moment, and a class of bug that never raises an error. Cache when the read is expensive, reused, and tolerant of being stale — and when you do, decide out loud how wrong you'll let it be, because a `TTL` you didn't think about is still an answer to that question."}]}]};

const UNIT14 = {"unitId":"cdns","title":"CDNs","subtitle":"You can't outrun light — so move the content closer","lessons":[{"id":"cdn-1","title":"Distance is the enemy","exercises":[{"id":"cdn-1-0","type":"concept","title":"You cannot outrun the speed of light, so the only lever left is distance","viz":{"nodes":[{"id":"u","label":"User","col":0,"kind":"client"},{"id":"o","label":"Your Server","sub":"every 1,000 km ≈ 10ms","col":1,"kind":"server"}],"edges":[{"from":"u","to":"o"}]},"body":"Light in fibre moves at about 200,000 km a second — roughly two thirds of its speed in vacuum, and not a setting anyone can change. That is about 10ms of round trip for every 1,000 km between your user and your server, paid before a single line of your code runs. Real routes bend around oceans and exchange points, so the true figure runs worse.","note":"Which makes distance the one term in your latency budget that no deploy touches. Drive your server's own time to zero and a far-away user cannot tell. The only way to shorten the trip is to shorten the trip."},{"id":"cdn-1-1","type":"multiple_choice","prompt":"Your servers are in Virginia. A user in Sydney loads your site. Your server responds in 5ms. Why does the page still feel slow?","choices":["The server is underpowered","The request has to cross the planet and back — physics puts a floor under that round trip that no server speed can fix","Sydney has bad internet","The database is slow"],"answer":1,"why":"A Virginia–Sydney round trip is on the order of 200ms through fibre, so a 5ms server response is a rounding error next to the journey. This is the wall from unit 4: you can optimize your code to zero and the user still waits, because you're paying the speed of light. The only lever left is to stop making them cross the planet."},{"id":"cdn-1-2","type":"fill_blank","prompt":"A ______ is a network of servers spread around the world that keep copies of your content close to users.","choices":["CDN","VPN","LAN","DNS"],"answer":0,"why":"Content Delivery Network — the name is literal. It's copies of your content, delivered from somewhere near the person asking for it."},{"id":"cdn-1-3","type":"multiple_choice","prompt":"So what does a CDN actually do about the Sydney problem?","choices":["It makes your Virginia server faster","It keeps a copy of your content in Sydney, so the user's request never crosses the ocean","It compresses the response so it travels faster","It upgrades the user's connection"],"answer":1,"why":"A CDN shortens the distance rather than speeding up the trip. The user hits an edge server a few milliseconds away that already has your logo, and the ocean crossing simply doesn't happen. Notice this is unit 5's lesson at planetary scale: a CDN is a cache, so it's a derived copy, and every consequence in this unit follows from that."},{"id":"cdn-1-4","type":"multiple_choice","prompt":"A CDN edge server in Sydney doesn't have the file a user asks for. What happens?","choices":["The user gets a 404","The edge fetches it from your origin server, serves it, and keeps a copy so the next Sydney user is fast","The request fails and retries","The CDN generates the file itself"],"answer":1,"why":"That's a cache miss, and the first Sydney user waits while the edge crosses the ocean on their behalf. They still get something — their TLS handshake terminates at the nearby edge, and the edge reuses an already-warm connection to your origin, so a miss is meaningfully cheaper than going direct — but they get none of the *cache's* benefit. They're the one who warms it for everyone after them, which is why a CDN's value depends entirely on how often the next person asks for the same thing."},{"id":"cdn-1-5","type":"match_pairs","prompt":"Match each CDN term to what it means.","pairs":[{"left":"Edge / PoP","right":"A CDN server near users"},{"left":"Origin","right":"Your actual server, the source of truth"},{"left":"Cache hit","right":"The edge already had it"},{"left":"Cache miss","right":"The edge had to ask the origin"}],"why":"Edges are the copies, the origin is the truth, and every request is one of two outcomes. Almost every CDN decision you'll make is really about moving requests from the second column into the first."},{"id":"cdn-1-6","type":"multiple_choice","prompt":"Besides latency, what does serving from the edge also reduce?","choices":["Nothing else","Load on your origin — requests served at the edge never reach your servers at all","The size of your files","Your database's storage"],"answer":1,"why":"Every cache hit is a request your origin never sees, so a CDN is capacity relief as well as a speed win. For a site whose traffic is mostly images, scripts, and video, the CDN can absorb the overwhelming majority of requests — which means your origin only has to be sized for the small fraction that genuinely needs it."}]},{"id":"cdn-2","title":"What belongs at the edge","exercises":[{"id":"cdn-2-0","type":"concept","title":"A stored copy is only worth storing if it gets handed out again","viz":{"nodes":[{"id":"u1","label":"User","col":0,"kind":"client"},{"id":"u2","label":"User","col":0,"kind":"client"},{"id":"u3","label":"User","col":0,"kind":"client"},{"id":"e","label":"Edge","sub":"1 copy","col":1,"kind":"cdn"},{"id":"o","label":"Origin","sub":"only on miss","col":2,"kind":"server"}],"edges":[{"from":"u1","to":"e"},{"from":"u2","to":"e"},{"from":"u3","to":"e"},{"from":"e","to":"o","dash":true}]},"body":"An edge holds one copy and hopes to serve it a thousand times — that ratio is the business model. Fetch once, deliver often, and the origin trip amortizes to nothing. Fetch once, deliver once, and you've added a hop and a component in exchange for nothing. Then a second question lands: how far behind the truth may this copy fall before someone is hurt?","note":"The two questions aren't equal partners. Fail the first and a CDN is merely pointless — a hop that saves nobody anything. Fail the second and it's actively wrong, and it's wrong in a few hundred places at once."},{"id":"cdn-2-1","type":"multiple_choice","prompt":"Which of these is the easiest thing to serve from a CDN?","choices":["A user's personalized dashboard","Your logo image — identical for every user, changes almost never","A bank balance","A live chat message"],"answer":1,"why":"The logo is the ideal case because it's identical for everyone and rarely changes, so one cached copy serves millions of people and being slightly stale costs nothing. The dashboard and balance are personal, and the chat message is live — caching any of them at the edge would show someone another person's data or the past."},{"id":"cdn-2-2","type":"multiple_choice","prompt":"What actually decides whether something can be cached at the edge?","choices":["Whether it's an image or a script","Whether many people ask for the identical thing, and whether being slightly out of date is acceptable","Its file size","Whether it's compressed"],"answer":1,"why":"Cacheability isn't about file type, it's about shared-ness and staleness tolerance. 'Static assets' is a rule of thumb that works only because images and scripts happen to be identical for everyone — but an HTML page that's the same for all logged-out visitors caches beautifully, while a personalized SVG cannot cache at all."},{"id":"cdn-2-3","type":"multi_select","prompt":"Which of these can usually be served from a CDN? Select all.","choices":["Your JavaScript bundle","A product image","A public blog post's HTML","A page showing the logged-in user's name"],"answer":[0,1,2],"why":"The bundle, the image, and the public post are identical for every visitor, so one copy serves everyone. The personalized page is different for each user — caching it at the edge risks the classic catastrophe of serving one user's page to another, which is how sites leak accounts to strangers."},{"id":"cdn-2-4","type":"multiple_choice","prompt":"How does the edge know how long it may keep a copy?","choices":["It guesses","Your origin tells it, using cache headers like `Cache-Control` with a max-age","It always keeps things for 24 hours","The user's browser decides"],"answer":1,"why":"The origin sets the policy and the edge obeys it — `Cache-Control` max-age is you saying how long a copy stays fresh. This is the same mechanism from unit 2 doing a bigger job: the headers you send aren't decoration, they're instructions to every cache between you and the user, and setting them badly is how you end up either with no caching at all or with a mistake pinned in place for a year."},{"id":"cdn-2-5","type":"multiple_choice","prompt":"You set max-age to 1 year on a file you might need to change. Reckless?","choices":["Yes — you can never update it","No, provided the filename changes whenever the content does: `app.a3f9c1.js` is cached forever precisely because a new build produces a new name","Yes — a year is always too long","No, because you can always purge"],"answer":1,"why":"A content-hashed filename makes the URL and the bytes inseparable, so that URL's content can never change and caching it forever is safe rather than reckless. Updating means shipping a new filename that nothing has cached, and the old one simply stops being referenced — which is why this pattern is everywhere in modern builds. You get permanent caching and instant updates at once, by never reusing a name."},{"id":"cdn-2-6","type":"multiple_choice","prompt":"Why is the `index.html` that references those hashed files usually cached for a very short time — or not at all?","choices":["HTML is too big to cache","Because it's the one file whose name never changes, so it's the only place that can tell browsers which new hashed files to fetch","HTML can't be cached by CDNs","It's personalized"],"answer":1,"why":"Something has to be the entry point with a stable name, and that file is the pointer to everything else — cache it hard and users keep fetching the old bundle no matter how many times you deploy. So the shape is: a short-lived pointer naming immutable assets, giving you fast repeat loads and deploys that actually reach people."}]},{"id":"cdn-3","title":"Getting rid of stale copies","exercises":[{"id":"cdn-3-0","type":"concept","title":"The edges are still obeying the instruction you gave them yesterday","viz":{"nodes":[{"id":"u","label":"Users","col":0,"kind":"client"},{"id":"e1","label":"Edge","sub":"fresh for 24h","col":1,"kind":"cdn"},{"id":"e2","label":"Edge","sub":"fresh for 24h","col":1,"kind":"cdn"},{"id":"e3","label":"Edge ×300","sub":"fresh for 24h","col":1,"kind":"cdn"},{"id":"o","label":"Origin","sub":"file changed","col":2,"kind":"server"}],"edges":[{"from":"u","to":"e1"},{"from":"u","to":"e2"},{"from":"u","to":"e3"},{"from":"e1","to":"o","dash":true},{"from":"e2","to":"o","dash":true},{"from":"e3","to":"o","dash":true}]},"body":"`Cache-Control: max-age=86400` isn't a hint — it's you telling every edge this file is good for 24 hours, and they believe you. The instruction travelled with the copy. Change the file at your origin now and nothing in HTTP reaches back to correct them: a cache only ever learns by asking, and you told a few hundred of them not to ask for a day.","note":"Notice what you did when you typed that number: you signed a contract with a few hundred machines you don't administer, on behalf of every future version of the file. The copies aren't broken. They're obedient."},{"id":"cdn-3-1","type":"multiple_choice","prompt":"You publish a typo, then fix it. But the wrong version is cached at 300 edge locations with a 24-hour max-age. What's the problem?","choices":["Nothing — the fix deploys instantly","Your fix is live at the origin, but users keep getting the typo from the edge until those copies expire","The edges will notice the change automatically","Only Sydney users see the typo"],"answer":1,"why":"The edges have no idea anything changed — they hold a copy they were told is fresh for 24 hours, and they'll serve it confidently for 24 hours. This is unit 5's invalidation problem spread across 300 machines you don't control: the copy isn't wrong from the cache's point of view, it's doing exactly what you told it to."},{"id":"cdn-3-2","type":"match_pairs","prompt":"Match each way of dealing with stale edge copies.","pairs":[{"left":"TTL expiry","right":"Wait it out — the copy dies on schedule"},{"left":"Purge","right":"Tell the CDN to drop it now"},{"left":"Versioned URL","right":"Change the name so nothing is stale"},{"left":"Revalidation","right":"Edge asks the origin: still current?"}],"why":"Four options with very different costs: waiting is free but slow, purging is fast but is an operation you must remember to run, versioning sidesteps the problem entirely, and revalidation trades a small origin request for confidence."},{"id":"cdn-3-3","type":"multiple_choice","prompt":"Why do versioned URLs beat purging as a default strategy?","choices":["Purging is slower to propagate","Purging is an action someone must remember to perform correctly every time, while a new filename makes staleness impossible by construction","CDNs charge for purges","Versioned URLs are shorter"],"answer":1,"why":"Purging is a process that depends on humans and pipelines doing the right thing under pressure, and the failure mode is silent — you think you shipped, users see the old thing. Versioned URLs remove the decision: a new build produces a new name, nothing has it cached, and there's no stale copy to hunt down. Prefer designs where the bad state can't exist over designs where you clean it up."},{"id":"cdn-3-4","type":"multiple_choice","prompt":"When is purging genuinely the right tool?","choices":["Never","When the URL must stay the same and the content changed — a published article being corrected, say","For every deploy","Only for images"],"answer":1,"why":"Some URLs are the product and can't be renamed — an article's link is shared, bookmarked, and indexed, so you can't ship a correction by shipping a new URL. That's exactly when purging earns its place: you accept the operational burden because the alternative, changing the address, would break the thing that makes it valuable."},{"id":"cdn-3-5","type":"multiple_choice","prompt":"Your CDN supports '`stale-while-revalidate`': serve the cached copy immediately, and refresh it in the background. What are you buying?","choices":["Perfect freshness","Speed for the user right now, at the cost of that one response being slightly out of date","Lower storage costs","Fewer purges"],"answer":1,"why":"Nobody waits on the origin — the edge answers instantly from its copy and refreshes afterwards, so the next visitor gets the update. You've decided this content's staleness costs less than its latency, which is the same question from unit 5 asked at the edge: what does being a few seconds behind actually cost here?"},{"id":"cdn-3-6","type":"tradeoff_slider","prompt":"You're serving a news homepage that updates every few minutes and gets enormous traffic. Slide toward your caching policy.","leftLabel":"Very short TTL (fresh, more origin load)","rightLabel":"Long TTL (fast + cheap, can be minutes stale)","answerRange":[30,70],"why":"Neither extreme fits: no caching hands enormous traffic straight to your origin, and a long TTL means a breaking story sits invisible for an hour. A short TTL of seconds-to-a-minute collapses millions of requests into one origin fetch per interval while keeping the page current enough for news — and `stale-while-revalidate` makes even that refresh invisible to users."}]},{"id":"cdn-4","title":"The hard parts","exercises":[{"id":"cdn-4-0","type":"concept","title":"A CDN can only hit on a key it has already seen","viz":{"nodes":[{"id":"r1","label":"Request","sub":"key A","col":0,"kind":"client"},{"id":"r2","label":"Request","sub":"key A","col":0,"kind":"client"},{"id":"r3","label":"Request","sub":"key B","col":0,"kind":"client"},{"id":"e","label":"Edge","sub":"one object per key","col":1,"kind":"cdn"},{"id":"o","label":"Origin","sub":"one fetch per key","col":2,"kind":"server"}],"edges":[{"from":"r1","to":"e"},{"from":"r2","to":"e"},{"from":"r3","to":"e"},{"from":"e","to":"o"}]},"body":"An edge files a response under a key: your URL, every character of it, plus whatever your `Vary` header said also matters. The next request hits only if it builds that identical key — and only if the edge was permitted to file the response at all. Plenty of ordinary-looking habits break one of those two conditions, and none of them looks like a caching bug.","note":"And read the miss column, not the hit column. A hit ratio flatters — the number that actually bills you is how many requests still reach your origin, and that's a subtraction you have to do yourself."},{"id":"cdn-4-1","type":"multiple_choice","prompt":"Your CDN reports a 60% cache hit ratio. Is that good?","choices":["Yes — most requests are cached","It depends what's in the other 40%, but for static assets it's poor: 40% of requests are still crossing to your origin","It's perfect","Hit ratio doesn't matter"],"answer":1,"why":"For a static asset workload, mature CDN configurations typically run far higher, so 60% usually means something is defeating the cache — cache-busting query strings, missing headers, or `Vary` headers fragmenting one file into many variants. The number worth watching is what fraction of ORIGIN load you removed, because that's what the CDN was bought for."},{"id":"cdn-4-2","type":"multiple_choice","prompt":"A popular file expires at 300 edge locations at the same moment, and traffic is heavy. What happens to your origin?","choices":["Nothing — the edges handle it","Up to 300 simultaneous fetches for the same file hit your origin at once — a thundering herd","The CDN blocks the requests","The file serves stale forever"],"answer":1,"why":"Every edge independently discovers the copy expired and independently goes to fetch it, so your origin gets hit by a synchronized stampede for a file it thought the CDN was handling. The defenses come in two parts, and you need both. Request coalescing at the edge collapses many waiting users into one origin fetch — but that's one fetch *per edge*, so 300 edges still means 300 fetches. Origin shielding is what closes it: a designated edge fronts the origin, and the other 299 ask it instead."},{"id":"cdn-4-3","type":"multiple_choice","prompt":"What is origin shielding?","choices":["A firewall in front of your origin","One designated edge that fronts the origin, so other edges fetch from it rather than all going to you","Encrypting traffic to the origin","A backup origin server"],"answer":1,"why":"It's a cache in front of your cache: a shield edge that other edges treat as the origin, turning 300 potential origin fetches into one. The cost is an extra hop for misses and one more thing that can be down — and it's the same hierarchy idea a CPU uses with L1 and L2, applied to the planet."},{"id":"cdn-4-4","type":"multi_select","prompt":"Which of these quietly destroy your cache hit ratio? Select all.","choices":["Appending a unique tracking parameter like ?t=1234 to asset URLs","A `Vary` header that splits one file into many per-browser variants","Forgetting `Cache-Control`, so the CDN won't cache at all","Serving the same file to every user"],"answer":[0,1,2],"why":"Unique query strings make every request a distinct URL and therefore a guaranteed miss; an over-broad `Vary` shatters one cached object into dozens of near-identical copies that each have to be warmed; and no `Cache-Control` means the CDN often declines to cache at all. Serving everyone the identical file is the opposite — it's precisely the condition that makes caching work."},{"id":"cdn-4-5","type":"multiple_choice","prompt":"Your API returns per-user data and is slow. Will a CDN fix it?","choices":["Yes — CDNs speed everything up","No — the responses are unique per user, so there's nothing to share and every request goes to your origin anyway","Yes, with a long TTL","Yes, if you purge often"],"answer":1,"why":"A CDN's entire economics rest on many people wanting the identical bytes, and per-user responses have an audience of one — so you'd add a hop and cache nothing. A CDN can still terminate TLS closer to the user and hold a warm connection back to your origin, which helps a little, but the slow API needs the fixes from unit 4: less work, or the work done nearer the user."},{"id":"cdn-4-6","type":"multiple_choice","prompt":"You deploy a fix. Some users see it, some still see the bug, and refreshing sometimes helps. What's the most likely explanation?","choices":["The deploy failed","Different caches are at different stages — some edges hold the old copy, and some browsers hold their own copy too","The users are on old devices","A database replication issue"],"answer":1,"why":"There isn't one cache between you and a user, there's a chain — browser, possibly a corporate proxy, the edge, maybe a shield — and each holds its own copy on its own schedule. That's why 'it works for me' is meaningless during a cache incident and why versioned URLs are such a relief: with a new name, none of those layers has anything stale to serve."},{"id":"cdn-4-7","type":"multiple_choice","prompt":"What's the honest summary of a CDN?","choices":["It makes your whole site faster automatically","It's a cache near your users: it shortens distance and absorbs origin load for content many people share — and it hands you invalidation across machines you don't control","It replaces your servers","It only helps with images"],"answer":1,"why":"It buys latency and origin relief for shared content, and charges you in staleness you now have to manage across hundreds of locations. Every rule in this unit came from the same source: a CDN is a copy, so unit 5's bill arrives — freshness, invalidation, and the question of what being out of date costs — just spread across the planet."}]}]};

const UNIT15 = {"unitId":"sharding","title":"Sharding / Partitioning","subtitle":"Splitting the data across machines — and what you give up to do it","lessons":[{"id":"shard-1","title":"When copies aren't enough","exercises":[{"id":"shard-1-0","type":"concept","title":"Replication gives every machine all of the data; sharding gives each one a slice","viz":{"nodes":[{"id":"a","label":"App Server","col":0,"kind":"server"},{"id":"r","label":"Router","col":1,"kind":"gw","sub":"key → shard"},{"id":"s1","label":"Shard 1","col":2,"kind":"db","sub":"users A–H"},{"id":"s2","label":"Shard 2","col":2,"kind":"db","sub":"users I–P"},{"id":"s3","label":"Shard 3","col":2,"kind":"db","sub":"users Q–Z"}],"edges":[{"from":"a","to":"r"},{"from":"r","to":"s1"},{"from":"r","to":"s2"},{"from":"r","to":"s3"}]},"body":"A replica is a full copy. Every copy must therefore apply every write — that is what makes it a copy, and it is why adding replicas adds machines without dividing the writing. Sharding does the other thing: each machine holds only its own slice of the rows, and only ever hears the traffic that names its keys. Work out what that divides, and what it doesn't.","note":"It is also the decision you can't quietly undo. The shard key isn't a setting you tune later — it is the rule that decides which machine every row physically sits on, and everything downstream inherits that choice."},{"id":"shard-1-1","type":"multiple_choice","prompt":"Your database is drowning in WRITES. You add five read replicas. Does it help?","choices":["Yes — five more machines share the work","No — every replica must apply every write, so you've added five machines that each do all the writing and none that do less","Yes, if you route writes to the replicas","Only during peak hours"],"answer":1,"why":"Replication scales reads because any copy can answer a read, but every copy must perform every write — so a write bottleneck is untouched, and you've slightly worsened it by giving the leader five more followers to ship changes to. This is the asymmetry from unit 10 collecting its debt: copies cannot reduce write load, which leaves exactly one option — stop making every machine hold everything."},{"id":"shard-1-2","type":"fill_blank","prompt":"______ splits your data across machines so each one holds only a subset of it.","choices":["Sharding","Replication","Caching","Indexing"],"answer":0,"why":"Replication copies the whole dataset onto each machine; sharding divides it so each machine owns a slice. Copies versus slices — that one distinction is the whole difference between units 10 and 15."},{"id":"shard-1-3","type":"match_pairs","prompt":"Match each approach to what it does.","pairs":[{"left":"Replication","right":"Every machine holds all the data"},{"left":"Sharding","right":"Each machine holds a slice of the data"},{"left":"Replication scales","right":"Reads, and survival"},{"left":"Sharding scales","right":"Writes, reads, and total data size"}],"why":"They solve different problems and compose rather than compete: shard to divide the write load and the data, then replicate each shard so losing a machine doesn't lose that slice. Real systems at scale do both, because sharding alone gives you no redundancy — it just gives you more single points of failure."},{"id":"shard-1-4","type":"multi_select","prompt":"Which problems does sharding actually solve? Select all.","choices":["Write throughput beyond one machine","A dataset too large to fit on one machine","Surviving a machine dying","Read throughput"],"answer":[0,1,3],"why":"Splitting the data means each machine takes only its share of the writes, stores only its share of the bytes, AND answers only its share of the reads — so all three scale past one box. Survival is the one it doesn't buy: lose a shard and that slice is simply gone unless you also replicated it. Reads deserve a footnote though — sharding genuinely scales them, but it's rarely the right *tool* for them, because caching and read replicas buy the same relief without cross-shard queries, distributed transactions, or a shard key you can never change. The exception is when the working set outgrows one machine's memory, where replicas don't help (every copy has the same undersized cache) and only splitting the data does."},{"id":"shard-1-5","type":"multiple_choice","prompt":"You shard users across 4 machines. Where does user 12345 live?","choices":["On whichever machine is least busy","Wherever the shard key says — a rule maps that user's id to exactly one shard, and everyone applies the same rule","On all four","The load balancer decides"],"answer":1,"why":"Sharding needs a deterministic rule mapping each row to one shard, because otherwise nobody could find it again — every reader and writer must independently compute the same answer. That rule's input is the shard key, and choosing it is the single most consequential decision in this unit: it decides where every row lives, forever, and it is brutally hard to change later."},{"id":"shard-1-6","type":"multiple_choice","prompt":"Why is 'don't shard until you have to' such common advice?","choices":["Sharding is expensive in hardware","Because it permanently costs you cross-shard queries, cross-shard transactions, and painful resharding — costs you pay daily, for a scale you may not have","Because sharding is unreliable","Because databases can't be sharded safely"],"answer":1,"why":"Sharding is a one-way door that changes what your database can do: queries spanning shards get slow, transactions spanning shards get hard, and the shard key becomes an assumption baked into everything. Those bills arrive every day from the moment you shard, while the benefit only arrives when one machine genuinely can't cope — so the order matters enormously. Scale up, cache, and replicate first; shard when the ceiling is actually in sight."}]},{"id":"shard-2","title":"Choosing how to split","exercises":[{"id":"shard-2-0","type":"concept","title":"Your shard key does two jobs at once: spread the load, and keep your queries on one machine","viz":{"nodes":[{"id":"u","label":"Router","col":0,"kind":"gw","sub":"reads the key"},{"id":"a","label":"Shard A","col":1,"kind":"db","sub":"ids 1–1M"},{"id":"b","label":"Shard B","col":1,"kind":"db","sub":"ids 1M–2M"},{"id":"c","label":"Shard C","col":1,"kind":"db","sub":"ids 2M–3M"}],"edges":[{"from":"u","to":"a"},{"from":"u","to":"b"},{"from":"u","to":"c"}]},"body":"The shard key is the column the rule reads to decide where a row lives. Two ways to map it. *Range*: ids 1–1M on shard A, 1M–2M on B, and so on — the rule preserves the key's order. *Hash*: hash the key and take the remainder — the rule deliberately throws that order away. Every bill either one sends you is a consequence of that single difference.","note":"And the choice between them matters less than the column you feed them. Range or hash decides *how* a key is mapped; the key itself decides which questions your system can still answer cheaply, and which it can't."},{"id":"shard-2-1","type":"multiple_choice","prompt":"You shard by user_id using ranges: users 1–1M on shard A, 1M–2M on B, and so on. Your ids auto-increment. What happens?","choices":["Load spreads evenly across shards","Every new signup lands on the newest shard, so all your write traffic hammers one machine while the others idle","Old shards get all the writes","The database rebalances automatically"],"answer":1,"why":"Sequential ids mean today's users all fall in the same range, so range-partitioning on them sends every insert to whichever shard owns the highest range — you built four machines and kept a one-machine write bottleneck. The general trap: range partitioning on any value that increases with time concentrates all new writes on one shard, which is exactly what you sharded to avoid."},{"id":"shard-2-2","type":"match_pairs","prompt":"Match each partitioning strategy to its behaviour.","pairs":[{"left":"Range partitioning","right":"Ordered slices — keeps range queries fast"},{"left":"Hash partitioning","right":"Scatters keys evenly — destroys ordering"},{"left":"Range's risk","right":"Sequential keys create a hot shard"},{"left":"Hash's cost","right":"'All rows between X and Y' now hits every shard"}],"why":"It's the same tradeoff as B-trees versus hashing from unit 8, promoted to the level of machines: ordering buys you range scans and risks hotspots, while hashing buys you even distribution by deliberately destroying the order you'd need for ranges."},{"id":"shard-2-3","type":"multiple_choice","prompt":"You hash user_id to pick a shard. What did that fix, and what did it break?","choices":["Nothing changed","Writes now spread evenly across shards — but 'give me all users created last week' must now ask every shard, because related rows are deliberately scattered","It fixed everything with no cost","It broke writes but fixed reads"],"answer":1,"why":"Hashing spreads keys uniformly regardless of what the values mean, which is precisely why the hot shard disappears — and precisely why ordering does too. Rows that are adjacent in time or alphabet now sit on different machines by design, so any query defined by a range has to fan out to all of them and combine the results."},{"id":"shard-2-4","type":"multiple_choice","prompt":"A chat app shards messages by hash(message_id). Loading one conversation is now slow. Why?","choices":["The hash is slow to compute","A conversation's messages are scattered across every shard, so reading one chat means querying all of them","Messages are too large","The shard key is too long"],"answer":1,"why":"The shard key decided the physical layout, and hashing by message_id scattered messages that belong together — so the app's single most common query became a fan-out to every machine. Sharding by conversation_id instead would put a whole conversation on one shard and turn that query back into a single-shard read. The lesson: shard by whatever your hottest query filters on, so that query stays local."},{"id":"shard-2-5","type":"multiple_choice","prompt":"So what's the rule for choosing a shard key?","choices":["Always use the primary key","Pick something with many distinct values that spreads load evenly AND matches how you query, so your common reads stay on one shard","Always hash a random value","Pick the smallest column"],"answer":1,"why":"You're satisfying two demands at once: even distribution (or one machine becomes the bottleneck again) and query locality (or every read fans out). A random key nails the first and destroys the second; a sequential key does the reverse — the art is finding a key with high cardinality that also happens to be what your hot queries filter on."},{"id":"shard-2-6","type":"multiple_choice","prompt":"You shard a multi-tenant SaaS app by tenant_id. What should worry you?","choices":["Nothing — tenants are naturally separate","Tenants aren't the same size: one enormous customer can outgrow a single shard, and no amount of rebalancing splits one tenant","Tenant ids are too long","Queries will be slow"],"answer":1,"why":"Sharding by tenant gives beautiful query locality since almost every query is scoped to one tenant anyway — but it also means a tenant is indivisible, so your biggest customer must fit on one machine. That's usually a great trade right up until you land a whale, and then the fix is a composite key that can split a giant tenant further, which is much easier to design now than to retrofit."}]},{"id":"shard-3","title":"Hot shards and moving data","exercises":[{"id":"shard-3-0","type":"concept","title":"Splitting the rows evenly does not split the traffic evenly","viz":{"nodes":[{"id":"c","label":"One popular key","col":0,"kind":"client","sub":"most of the reads"},{"id":"o","label":"Everything else","col":0,"kind":"client"},{"id":"s1","label":"Shard 1","col":1,"kind":"db","sub":"⅓ of rows"},{"id":"s2","label":"Shard 2","col":1,"kind":"db","sub":"⅓ of rows"},{"id":"s3","label":"Shard 3","col":1,"kind":"db","sub":"⅓ of rows"}],"edges":[{"from":"c","to":"s3"},{"from":"o","to":"s1"},{"from":"o","to":"s2"},{"from":"o","to":"s3"}]},"body":"A hash spreads *rows* evenly. It promises nothing whatsoever about how often those rows get asked for. And rows are never equally popular — traffic follows attention, and attention has never been uniformly distributed. So an immaculate split of the data can sit underneath a grotesque split of the work, with no hash function able to prevent it.","note":"You can't rebalance your way out, either. The key put that row on that machine, and no reshuffle splits a single key. The fixes differ in kind — cache the hot row, or make the key finer so one hot thing becomes many."},{"id":"shard-3-1","type":"multiple_choice","prompt":"You shard a social app by user_id. One user has 200 million followers. What breaks?","choices":["Nothing — it's one row","Everything about that user lives on one shard, so that machine takes a wildly disproportionate share of traffic — a hot shard","The user can't post","All shards slow down equally"],"answer":1,"why":"Even a perfect hash spreads KEYS evenly, not LOAD — and load follows popularity, which is never uniform. This is the celebrity problem, and it's why real systems special-case their outliers: caching that user's data aggressively, or splitting their activity across a composite key. Any sharding scheme that assumes keys are equally busy will eventually meet a key that isn't."},{"id":"shard-3-2","type":"multiple_choice","prompt":"You have 4 shards, assigned by hash(key) % 4. You add a fifth machine, making it % 5. What happens?","choices":["Only the new shard's data moves","Almost every key now maps somewhere new, so the vast majority of your data has to move at once","Nothing moves","Only 20% moves"],"answer":1,"why":"Changing the modulus changes the answer for nearly every key, so adding one machine triggers a near-total reshuffle of the dataset — while serving traffic. That's why naive modulo sharding is a trap you only discover on the day you need to grow, which is the worst possible day to discover it."},{"id":"shard-3-3","type":"multiple_choice","prompt":"What does consistent hashing fix about that?","choices":["It makes hashing faster","Adding or removing a node only remaps the keys near it, so roughly 1/n of the data moves instead of nearly all of it","It removes the need for a shard key","It prevents hot shards"],"answer":1,"why":"Keys and nodes are placed on the same ring, and each key belongs to the next node clockwise — so adding a node only steals the arc between it and its predecessor, leaving every other key exactly where it was. It makes growth incremental rather than catastrophic, which is the entire point. Note what it doesn't fix: a celebrity key is still one key, and the ring will happily hand it to one node."},{"id":"shard-3-4","type":"multiple_choice","prompt":"Consistent hashing with few nodes distributes data unevenly. What's the standard fix?","choices":["Add more physical machines","Virtual nodes — place each machine at many points on the ring, so the averaging smooths out the arcs","Use a different hash function","Sort the keys first"],"answer":1,"why":"With three machines you get three arcs, and arcs land wherever the hash puts them — so one machine can easily own twice its share. Giving each machine hundreds of positions on the ring means it owns hundreds of small arcs whose sizes average out, and it also means a departing machine's load is inherited by many peers rather than dumped entirely on its one neighbour."},{"id":"shard-3-5","type":"multiple_choice","prompt":"How does an application know which shard to talk to?","choices":["It tries each one","It computes the rule itself, or asks a routing layer or directory that knows the current mapping","The database broadcasts","The load balancer decides"],"answer":1,"why":"Either every client embeds the rule — fast, but now the mapping is duplicated in every deploy and changing it means coordinating a fleet — or a routing tier owns it, which costs a hop and becomes something that must itself be replicated. A directory adds flexibility, letting you move individual shards without redeploying clients, at the price of one more component in the request path that must never be wrong."},{"id":"shard-3-6","type":"tradeoff_slider","prompt":"You need to move a shard's data to new machines while staying online. Slide toward your approach.","leftLabel":"Big-bang cutover (fast, risky)","rightLabel":"Dual-write + backfill + verify (slow, safer)","answerRange":[55,100],"why":"A big-bang move is short but has no safe abort: if the copy is wrong you discover it with live traffic on the new machines and no clean way back. The incremental path — write to both, backfill history, verify they agree, then shift reads — is longer and lets you stop at any step with the old shard still authoritative. When the thing you're moving is the source of truth, reversibility is worth far more than speed."}]},{"id":"shard-4","title":"What sharding costs","exercises":[{"id":"shard-4-0","type":"concept","title":"A query that doesn't name the shard key has to ask every shard, and wait for the slowest","viz":{"nodes":[{"id":"a","label":"App Server","col":0,"kind":"server"},{"id":"r","label":"Router","col":1,"kind":"gw","sub":"waits: 310ms"},{"id":"s1","label":"Shard 1","col":2,"kind":"db","sub":"9ms"},{"id":"s2","label":"Shard 2","col":2,"kind":"db","sub":"11ms"},{"id":"s3","label":"Shard 3","col":2,"kind":"db","sub":"310ms"},{"id":"s4","label":"Shard 4","col":2,"kind":"db","sub":"12ms"}],"edges":[{"from":"a","to":"r"},{"from":"r","to":"s1"},{"from":"r","to":"s2"},{"from":"r","to":"s3"},{"from":"r","to":"s4"}]},"body":"A query naming the shard key goes to one machine. A query that doesn't — *which accounts are over quota?* — can't be routed, so the router asks every shard and merges what comes back. That's a *scatter-gather*, and its cost isn't the average shard's latency: you can't finish until the last one replies. Every shard you add is another draw from the tail.","note":"Which is why the key is chosen from your read patterns and not from your data model. The key is the only thing that lets the router skip a machine, so every query that doesn't carry one pays for all of them."},{"id":"shard-4-1","type":"multiple_choice","prompt":"Your users are sharded across 16 machines. You run: 'count all users who signed up today.' What happens?","choices":["One shard answers","All 16 are queried and the results combined — a scatter-gather, as slow as the slowest shard","It's rejected","The router knows the answer"],"answer":1,"why":"The data for that question is spread across every machine, so the query has to visit all of them and merge — and it can't finish until the slowest one replies. That's unit 4's tail-latency problem arriving through your shard count: with 16 shards you draw 16 samples from the latency distribution every time, so the typical query now waits on roughly your p96 shard, and about one query in seven waits on a p99 one. Push the fan-out to 100 and the majority of queries wait on a p99 — the effect scales with how many shards you touch, which is another reason to keep queries on one."},{"id":"shard-4-2","type":"multiple_choice","prompt":"You need to transfer money between two users who live on different shards, atomically. How hard is that?","choices":["Easy — wrap it in a transaction","Hard: a normal transaction covers one database, so spanning shards needs distributed coordination — two-phase commit or a saga","Impossible","The router handles it"],"answer":1,"why":"Unit 9's boundary is exactly the shard: `BEGIN/COMMIT` protects one machine's data and knows nothing about the other shard, so atomicity across them needs the machinery you hoped to avoid — a coordinator that can block, or compensating actions and eventual consistency. This is why people shard so that transactions stay within a shard: put things that change together on the same machine, and the hard problem never arises."},{"id":"shard-4-3","type":"multi_select","prompt":"Which get harder once you shard? Select all.","choices":["Queries that span shards","Transactions across shards","Joins between tables on different shards","Looking up a single row by shard key"],"answer":[0,1,2],"why":"Anything requiring data from more than one machine becomes coordination — fan out and merge, or a distributed protocol. The single-key lookup is the one that stays easy, and in fact gets faster, since each shard is smaller. That asymmetry is the whole design principle: sharding rewards you for asking questions that live on one machine, and punishes every question that doesn't."},{"id":"shard-4-4","type":"multiple_choice","prompt":"A year in, you realize you sharded by the wrong key. How bad is that?","choices":["Minor — just change the config","Severe: the key determined where every row physically lives, so changing it means relocating the entire dataset while serving traffic","Impossible to fix","Only affects new data"],"answer":1,"why":"The shard key isn't a setting, it's the physical layout of your data — so changing it is a full migration of everything, live, with application code that assumes the old key threaded throughout. This is why the choice deserves real thought before you make it: sharding is a one-way door, and the key is the hinge."},{"id":"shard-4-5","type":"multiple_choice","prompt":"Your app is read-heavy, fits comfortably on one machine, but reads are overwhelming it. Should you shard?","choices":["Yes — sharding is how you scale","No — the data fits and writes are fine, so caching and read replicas solve this without any of sharding's costs","Yes, shard by user_id","Only if you have more than a million users"],"answer":1,"why":"Sharding addresses write throughput and data size, and you have neither problem — so you'd take on cross-shard queries, distributed transactions, and a permanent key decision to fix something a cache handles for free. Match the tool to the actual bottleneck: reads want caching and replicas, writes and size want sharding."},{"id":"shard-4-6","type":"multiple_choice","prompt":"What's the honest summary of sharding?","choices":["It's how real systems scale, so do it early","It's the only way past one machine's write and storage limits — and it costs you cross-shard queries, cross-shard transactions, and a key you can't easily change","It's obsolete now that machines are large","It's the same as replication"],"answer":1,"why":"It's the last tool you reach for, because it's the only one that solves the write and size ceilings — and the only one whose costs are permanent and structural rather than tunable. Everything hard in this unit traced back to one fact: your data no longer lives in one place, so every question spanning it becomes coordination, which is precisely what unit 11 warned you that scaling out buys."}]}]};
