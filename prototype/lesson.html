const UNIT4 = {"unitId":"latency-vs-throughput","title":"Latency vs Throughput","lessons":[{"id":"lat-1","title":"Two different speeds","exercises":[{"type":"multiple_choice","prompt":"Think of a pipe carrying water. Latency is how long one drop takes to travel it; throughput is how much water flows per second. Which change raises throughput but does NOT improve latency?","choices":["Making the pipe shorter","Making the pipe wider","Both do both","Neither changes anything"],"answer":1,"why":"A wider pipe carries more water per second (throughput), but a single drop still takes exactly as long to travel end to end (latency) — only shortening the pipe cuts that. This is the whole unit in one image, and it's why 'we added more servers but my page is still slow' is such a common surprise: more servers widened the pipe, they didn't shorten it."},{"type":"fill_blank","prompt":"______ is the time for one request to complete; throughput is how many complete per second.","choices":["Latency","Bandwidth","Uptime","Concurrency"],"answer":0,"why":"Latency = time per operation. Throughput = operations per unit time. They're different axes, and improving one can even hurt the other."},{"type":"match_pairs","prompt":"Match each term to its meaning.","pairs":[{"left":"Latency","right":"Time for one request (ms)"},{"left":"Throughput","right":"Requests handled per second"},{"left":"Bandwidth","right":"Max data per second the link can carry"},{"left":"Round trip (RTT)","right":"There and back again"}],"why":"Latency is per-request time, throughput is completed work per second, bandwidth is the ceiling the physical link imposes, and RTT is the there-and-back time that dominates network latency. Bandwidth and throughput get confused constantly: bandwidth is the pipe's capacity, throughput is what you actually achieve through it — you can have a fat pipe and terrible throughput if something else is the bottleneck."},{"type":"multi_select","prompt":"Which of these actually reduce LATENCY for a single request? Select all.","choices":["Caching the result so the work is already done","Adding more servers","Moving the server geographically closer to the user","Optimizing the slow database query"],"answer":[0,2,3],"why":"Latency falls when you shorten the work or the distance: cache it, move closer, make the query faster. Adding servers adds capacity to run more requests at once — it doesn't make any single request's work finish sooner. Internalize this split and you'll diagnose faster than most engineers: latency problems are solved by doing less work or travelling less distance, throughput problems by adding parallel capacity, and reaching for the wrong lever is the classic wasted quarter."},{"type":"multiple_choice","prompt":"You double your server count. Users still say each page takes 2 seconds. Why didn't it get faster?","choices":["The new servers need a restart","More servers add throughput (capacity to serve more users), not lower per-request latency","Servers always fix latency — something is misconfigured","DNS is caching the old servers"],"answer":1,"why":"Scaling out lets you handle MORE simultaneous requests; it does nothing to shorten the work inside any one request, so each user still waits 2 seconds. There's one exception that proves the rule: if servers were overloaded and queueing, adding capacity removes the waiting — which is exactly what this unit's boss lesson is about."},{"type":"multiple_choice","prompt":"Your API serves 10,000 requests per second, and each one takes 200ms. Which is the throughput?","choices":["200ms","10,000 requests/second","2,000","50 requests"],"answer":1,"why":"Throughput is the rate of completed work: 10,000 requests/second. The 200ms is the latency of one request. Notice these two numbers coexist happily — a system can be high-throughput AND high-latency at once (a huge batch pipeline), or low-throughput and low-latency (a tiny, snappy service)."}]},{"id":"lat-2","title":"The numbers worth memorizing","exercises":[{"type":"multiple_choice","prompt":"Roughly how much slower is reading from main memory (RAM) than from the CPU's L1 cache?","choices":["About 2× slower","About 10× slower","About 100× slower","They're the same speed"],"answer":2,"why":"L1 cache is roughly 1 nanosecond; RAM is roughly 100 nanoseconds — about 100×, and RAM is the thing we usually call 'fast'. The memory hierarchy is a ladder of ~100× cliffs: cache → RAM → SSD → network → cross-continent. Knowing roughly where each rung sits is what lets you reason about performance without measuring."},{"type":"estimate","prompt":"Reading from main memory (RAM) takes roughly how many nanoseconds?","answer":100,"tolerance":90,"unit":"ns","why":"A main-memory reference is on the order of 100 nanoseconds. These figures are order-of-magnitude rather than precise — the point is the scale, not the digits. Compare L1 cache at ~1ns: even a RAM hit, which feels instant, is ~100 cache misses' worth of time, which is why cache-friendly data layouts can make code several times faster without changing the algorithm."},{"type":"estimate","prompt":"A network round trip between two servers in the SAME datacenter takes roughly how many microseconds?","answer":500,"tolerance":400,"unit":"µs","why":"A same-datacenter round trip is on the order of 500 microseconds — about half a millisecond. Fast by human standards, enormously slow by CPU standards: it's already ~5,000× slower than a RAM read, and you haven't even left the building. Leaving the building costs another ~300×, landing around 150ms."},{"type":"match_pairs","prompt":"Match each operation to its rough order of magnitude.","pairs":[{"left":"L1 cache reference","right":"~1 nanosecond"},{"left":"Main memory (RAM) read","right":"~100 nanoseconds"},{"left":"SSD random read","right":"~100 microseconds"},{"left":"Cross-continent round trip","right":"~150 milliseconds"}],"why":"The ladder: 1 ns → 100 ns → 100 µs → 150 ms. From cache to a cross-continent hop is roughly 100 million times slower. Worth noticing: an SSD read (~100 µs) is FASTER than a same-datacenter network round trip (~500 µs) — reading from your own disk can beat asking a neighbouring server, which inverts a lot of people's intuitions about 'just put it in another service'."},{"type":"multiple_choice","prompt":"A RAM read is ~100ns. A same-datacenter network call is ~0.5ms. Roughly how many RAM reads fit inside ONE network call?","choices":["About 5","About 500","About 5,000","About 5,000,000"],"answer":2,"why":"0.5ms = 500,000ns, divided by 100ns per RAM read = about 5,000. One 'cheap' internal network hop costs roughly five thousand memory reads. This is the number that should haunt every microservice design: adding one service hop to a request path isn't a rounding error, it's thousands of times more expensive than doing the work locally — and chatty service meshes die of exactly this, one innocent-looking call at a time."},{"type":"multiple_choice","prompt":"Why bother memorizing these order-of-magnitude numbers at all?","choices":["To impress people in code review","To do back-of-envelope math and reject a bad design in seconds — without building it","They're required by the HTTP spec","They're only useful for embedded programming"],"answer":1,"why":"Rough numbers let you kill a bad design with arithmetic instead of a three-month build: 'that's 10,000 serial network calls at 0.5ms — five seconds. No.' That takes 30 seconds and saves a quarter. It's the single most transferable skill in system design, and the reason estimation questions appear in every interview — you're not being tested on digits, but on whether you can reason about scale before committing to it."}]},{"id":"lat-3","title":"The average is a lie","exercises":[{"type":"multiple_choice","prompt":"Your dashboard says average latency is 100ms — healthy. Users are furious that the app is slow. How can both be true?","choices":["The users are exaggerating","The average hides the tail: a small share of requests could be taking 5+ seconds","The dashboard is broken","Averages can't be wrong"],"answer":1,"why":"Averages smear outliers away: if 95% of requests take 50ms and 5% take 2 seconds, the average still looks fine while 1 in 20 users has a terrible time. Average latency is arguably the most misleading metric in all of systems — nobody experiences the average, everybody experiences one specific request, and the unhappy ones are living in your tail."},{"type":"match_pairs","prompt":"Match each metric to what it actually tells you.","pairs":[{"left":"p50 (median)","right":"Half of requests are faster than this"},{"left":"p95","right":"95% are faster; the slowest 5% are worse"},{"left":"p99","right":"The worst 1% — your unhappiest users"},{"left":"Average","right":"Easily skewed by outliers"}],"why":"Percentiles describe the distribution instead of collapsing it: p50 is the typical experience, p99 is the bad one you promised not to inflict. Teams often watch p50 and feel great — but your most valuable users, the ones with the most data and the longest histories, usually live in the p99. The tail isn't random; it's often systematically your heaviest users."},{"type":"multiple_choice","prompt":"Your p99 latency is 2 seconds. What does that mean?","choices":["Every request takes 2 seconds","99% of requests are faster than 2 seconds; the slowest 1% are worse","99 requests took 2 seconds","The average is 2 seconds"],"answer":1,"why":"p99 is the value 99% of requests come in under — the remaining 1% are slower, and 2s is the floor of their pain rather than the ceiling. 1% sounds negligible until you multiply: at 10,000 requests/second that's 100 bad experiences every second, roughly 8.6 million a day. 'Rare' at scale is a full-time disaster."},{"type":"estimate","prompt":"At 10,000 requests/second, how many requests per second land in your p99 tail (the slowest 1%)?","answer":100,"tolerance":10,"unit":"req/sec","why":"1% of 10,000 = 100 requests every second hitting your worst-case latency. Percentages feel small; rates feel real. Always convert percentages into absolute rates before deciding something is acceptable — '99.9% success' at 10k rps is still 10 failures per second, or 864,000 a day."},{"type":"multiple_choice","prompt":"A page makes 100 parallel calls to internal services. Each has p99 = 100ms (so each has a 1% chance of being slow). Roughly what fraction of page loads hit AT LEAST ONE slow call?","choices":["About 1%","About 10%","About 63%","100%"],"answer":2,"why":"Each call is fast 99% of the time, so all 100 being fast = 0.99^100 ≈ 37% — meaning about 63% of page loads hit at least one slow call. A 1-in-100 event becomes the majority experience. This is Google's famous *tail at scale*: when you fan out, your dependencies' p99 becomes your page's p50, and it's the mathematical reason microservice architectures feel mysteriously slow while nobody's service is broken."},{"type":"multi_select","prompt":"Which of these genuinely help tame tail latency? Select all.","choices":["Hedged requests: send a duplicate and take whichever answers first","Timeouts with a sensible fallback","Reducing fan-out (make fewer calls)","Running servers at 100% CPU utilization"],"answer":[0,1,2],"why":"Hedging routes around a straggler, timeouts stop one slow dependency holding the page hostage, and less fan-out means fewer chances to draw a slow call — while 100% utilization is a tail-latency generator. Hedged requests feel wasteful since you're deliberately duplicating work, but a few percent extra load can cut p99 dramatically: trading a little throughput for a lot of tail is often a superb deal."},{"type":"multiple_choice","prompt":"You're writing a latency SLA for your service. Which metric should it be written against?","choices":["The average — it's the most representative","A high percentile like p95 or p99 — it bounds the worst experience users actually hit","The minimum — it shows what's possible","The maximum — the absolute worst case"],"answer":1,"why":"An SLA is a promise about the bad case, not the typical one: percentiles bound real user pain while averages hide it. The max is usually useless — a single GC pause or network blip owns it forever — so p99 (or p99.9 at big scale) is the honest, actionable promise."}]},{"id":"lat-4","title":"When the system gets busy","exercises":[{"type":"multiple_choice","prompt":"Your server handles requests comfortably at 50ms when it's half busy. You push it to 99% utilization. What happens to latency?","choices":["It stays around 50ms — the work per request didn't change","It drops, because the CPU is warmed up","It explodes: requests queue behind each other, and wait time grows non-linearly","It becomes zero"],"answer":2,"why":"The work per request didn't change, but now requests WAIT — and as utilization approaches 100%, queueing delay grows non-linearly, so at 99% busy latency can be tens of times worse than at 50%. This is queueing theory, and it's the bridge between throughput and latency. Rule of thumb: keep utilization meaningfully below 100%, often around 70% — that 'wasted' headroom is what you're buying low latency with. A server at 100% utilization isn't efficient, it's one hiccup from a meltdown."},{"type":"multiple_choice","prompt":"Little's Law says: concurrency = throughput × latency. Your service handles 500 requests/second, each taking 0.2 seconds. How many requests are in flight at any moment?","choices":["100","500","2,500","0.4"],"answer":0,"why":"500 requests/sec × 0.2 sec = 100 requests in flight — that's how many are being worked on simultaneously. This tiny formula tells you how many threads, connections, or workers you need, and it has teeth: if latency doubles because a dependency slowed down, in-flight requests double with zero change in traffic. That's how you exhaust a connection pool and turn one slow dependency into a full outage."},{"type":"estimate","prompt":"Little's Law again: 200 requests/second, each taking 0.5 seconds. How many requests are in flight?","answer":100,"tolerance":5,"unit":"requests","why":"200 × 0.5 = 100 in flight. Throughput × latency = concurrency, every time. Run it backwards to size a pool: if you want 1,000 rps at 50ms latency, you need 1,000 × 0.05 = 50 concurrent workers — capacity planning in one multiplication."},{"type":"multiple_choice","prompt":"You batch 100 database writes together instead of writing them one at a time. What happens?","choices":["Both latency and throughput improve","Throughput goes up, but an individual write's latency goes up — it waits for the batch to fill","Both get worse","Nothing measurable changes"],"answer":1,"why":"Batching spreads fixed per-operation costs across many items, so total throughput rises — but each individual write now waits for the batch to assemble, so its own latency gets worse. You trade the individual's speed for the system's capacity. This tradeoff is everywhere once you see it: Kafka batching, database group commit, Nagle's algorithm in TCP. It's the purest example that latency and throughput aren't just different — they're often in direct opposition."},{"type":"tradeoff_slider","prompt":"You're designing 'send message' in a real-time chat app. Slide toward what you'd optimize.","leftLabel":"Low latency (send immediately)","rightLabel":"High throughput (batch aggressively)","answerRange":[0,35],"why":"A human is staring at the screen waiting for their message to appear, so latency wins decisively — batching would add delay to the one thing the user is watching. The question to always ask: *is a human waiting?* If yes, optimize latency. If no — logs, analytics, nightly ETL, ingestion pipelines — optimize throughput and batch hard. Same system, opposite answers, decided entirely by who's on the other end."},{"type":"multiple_choice","prompt":"Your pipeline: Load Balancer (10k rps) → App servers (2k rps) → Cache (50k rps) → Database (5k rps). What's the maximum throughput of the whole system?","choices":["50k rps","10k rps","5k rps","2k rps"],"answer":3,"why":"A chain is limited by its slowest stage — the app servers at 2k rps — and everything downstream is idle capacity you're paying for and can't use. The corollary is brutal and constantly ignored: optimizing a NON-bottleneck yields exactly zero improvement, so making the cache twice as fast here changes nothing. Measure first, find the actual constraint, then fix that; anything else is theatre."},{"type":"multiple_choice","prompt":"Users report the site is slow. Average latency looks fine at 80ms. CPU sits at 95%. p99 latency is 4 seconds. Diagnosis?","choices":["Nothing's wrong — the average is healthy","The servers are near saturation, so queueing is exploding the tail: most requests are fine, but the p99 is brutal. Add headroom or cut work per request","It's a DNS problem","The users have bad wifi"],"answer":1,"why":"95% CPU puts you deep in the queueing danger zone: the average hides it because most requests still sail through, but the ones arriving during a burst wait behind a queue — and that's your 4-second p99. The fix is headroom or less work per request, not a micro-optimization. This ties the whole unit together: latency and throughput are different, you need the numbers to reason, averages lie so you watch percentiles, and utilization is the hidden variable connecting them all."}]}]};
/* ---- 05-where-state-lives.json ---- */
const UNIT5 = {"unitId":"where-state-lives","title":"Where State Lives","lessons":[{"id":"state-1","title":"State is the hard part","exercises":[{"type":"multiple_choice","prompt":"You have two services: one resizes images (input in, output out, remembers nothing) and one stores user profiles. Which is trivially easy to run as 100 copies?","choices":["The profile store","The image resizer — it remembers nothing, so any copy can do any job","Both are equally easy","Neither can be copied"],"answer":1,"why":"The resizer is stateless: every copy is interchangeable, you can add or kill them freely, and no copy needs to agree with any other — while the profile store holds data, so its copies must somehow agree on the truth. Here's the thesis of the whole unit: almost every hard problem in system design is a state problem. Scaling stateless compute is boring — you add machines. Scaling state is where replication, sharding, consistency, and CAP all come from."},{"type":"fill_blank","prompt":"A component is ______ if it keeps no memory between requests — so any copy can handle any request.","choices":["stateless","idempotent","cached","sharded"],"answer":0,"why":"Stateless = no memory between requests = interchangeable copies, and that interchangeability is what makes horizontal scaling easy."},{"type":"multi_select","prompt":"Which of these are STATE (something the system must remember)? Select all.","choices":["A user's shopping cart","A function that adds two numbers","An uploaded profile photo","The number of likes on a post"],"answer":[0,2,3],"why":"Carts, photos, and like counts are all data the system must remember; pure computation isn't state, since the same inputs always give the same output and nothing is retained. The practical test: if you restarted every server in your fleet right this second, what would be lost? That is your state — everything else is just compute, and compute is the easy part."},{"type":"match_pairs","prompt":"Match each term to its meaning.","pairs":[{"left":"Stateless","right":"Any copy can serve any request"},{"left":"Stateful","right":"Copies must agree on the data"},{"left":"Source of truth","right":"The one authoritative copy"},{"left":"Derived copy","right":"Can be rebuilt from the truth"}],"why":"These four words carry most of the unit: stateless scales freely, stateful needs coordination, the source of truth is authoritative, and derived copies are rebuildable. *Can it be rebuilt?* is the question separating a bad afternoon from a company-ending event — hold onto it, because lesson 3 is built on it."},{"type":"multiple_choice","prompt":"Architects often say 'push state to the edges.' What does that mean?","choices":["Put servers physically near users","Keep the middle tier stateless and interchangeable, concentrating state in a few systems built to handle it","State should be avoided entirely","Move all data to the client"],"answer":1,"why":"You want a thin, stateless middle you can scale at will, with state concentrated in a small number of specialists (databases, caches) designed for the hard parts. This is why the classic 3-tier architecture exists at all: a stateless web/app tier you scale by adding boxes, plus a stateful data tier that's difficult, expensive, and carefully managed. The entire shape of the architecture is organized around quarantining state."},{"type":"multiple_choice","prompt":"Why is a stateless app tier so much easier to operate than a stateful one?","choices":["It uses less memory","Any instance can be added, killed, restarted, or replaced at any time with no coordination and nothing lost","It doesn't need a network","It's written in a different language"],"answer":1,"why":"Disposability is the superpower: deploys, autoscaling, crashes, and rolling restarts all become non-events when no instance holds anything anyone needs. Every ops practice you like — blue/green deploys, autoscaling, chaos testing, spot instances — quietly depends on instances being disposable, and the moment state sneaks into an instance, all of it gets harder at once."}]},{"id":"state-2","title":"The places state can live","exercises":[{"type":"multiple_choice","prompt":"You restart every server in your fleet. Which survives?","choices":["Data held in server RAM","Data written to a database on disk","Both survive","Neither survives"],"answer":1,"why":"RAM is volatile — a restart wipes it instantly — while disk is durable, so the database still has the data. This is the very first question to ask about any state: does it need to survive a crash? Durability is a spectrum you pay for: RAM is fastest and dies on restart; local disk survives a process crash but not a dead machine; replicated disk survives a machine; cross-region replication survives a whole datacenter. Every rung costs you."},{"type":"match_pairs","prompt":"Match each place state can live to its defining property.","pairs":[{"left":"Client (cookie/token)","right":"Travels with the user, can't be trusted"},{"left":"Server RAM","right":"Fastest, lost on restart"},{"left":"Shared cache (Redis)","right":"Fast, shared by all servers, usually volatile"},{"left":"Database (disk)","right":"Durable source of truth, slowest"}],"why":"Four places, four personalities — and the whole design skill is matching the state to the place whose tradeoffs you can live with. Notice the ladder running through it: speed, durability, shared-ness, trust, and no option gives you all four. There is no place that is fast, durable, shared, and free, so choosing means giving something up on purpose."},{"type":"multiple_choice","prompt":"You store the shopping cart's total price in a cookie on the client. What's the danger?","choices":["Cookies are too slow","The client controls it and can edit it — so a user could set their total to $0","Cookies expire too quickly","There's no danger; it saves a database call"],"answer":1,"why":"Anything living on the client is under the user's control — they can open dev tools and change it — so client state is never trustworthy for anything involving money, permissions, or security. The rule: client-held state is a convenience or a cache, never the source of truth for anything that matters. If you must put something sensitive there, sign it so tampering is detectable, which is precisely what a JWT's signature is for: the client carries the data but can't forge it."},{"type":"multi_select","prompt":"Which are good reasons to put state in a shared cache like Redis instead of the database? Select all.","choices":["It's far faster — memory instead of disk","It takes read load off the database","It's the safest place for the only copy of critical data","It's shared, so every app server sees the same value"],"answer":[0,1,3],"why":"Redis is fast and shared — excellent reasons — but it's typically volatile, so it is emphatically not the place for the only copy of data you can't afford to lose. Caches should hold derived state, rebuildable from the source of truth: the moment data exists ONLY in your cache, you've turned your cache into a database without any of a database's durability guarantees, and teams discover this during the first unplanned Redis restart."},{"type":"multiple_choice","prompt":"A message sitting in a queue waiting to be processed — is that state?","choices":["No, it's just a message in transit","Yes — it's in-flight state the system must not lose","Only if the message is large","Only if it's been there over a minute"],"answer":1,"why":"Work-in-progress is state: if the queue loses that message, the work simply vanishes — an order never ships, an email never sends, and nothing errors. This is exactly why real queues persist messages to disk and wait for an explicit acknowledgement before deleting them. At-least-once delivery exists because in-flight state is state, and it's why consumers must be idempotent, the property you met in unit 2."},{"type":"multiple_choice","prompt":"What's the first question to ask about any new piece of state?","choices":["What programming language will read it?","If we lost it, what breaks — and who else needs to read it?","How many bytes is it?","Is it JSON or binary?"],"answer":1,"why":"Those two questions — what's lost, and who must read it — decide durability and sharing, and those two decide the place; everything else is detail. Run it on examples: a rebuildable computed value nobody else needs? Local memory is perfect. A payment record? Durable, replicated, shared. Same question, opposite answers, and you got there without a single technology name."}]},{"id":"state-3","title":"Copies and the truth","exercises":[{"type":"multiple_choice","prompt":"The moment you cache a value so it exists in two places, what problem have you created?","choices":["None — you just made it faster","The two copies can disagree — you now own a consistency problem","Only extra storage cost","Only extra latency"],"answer":1,"why":"One copy can't disagree with itself; two copies can drift apart, and now you must decide what happens when they do and who wins. Generalize it: every performance optimization built on copies — caches, read replicas, CDNs, denormalization — buys speed with consistency. There is no copy without a consistency question attached, so when someone proposes a cache, they're proposing a consistency policy whether they've noticed or not."},{"type":"fill_blank","prompt":"The one authoritative copy of a piece of data is called the source of ______.","choices":["truth","record","data","origin"],"answer":0,"why":"The source of truth is the copy that wins any argument: if two places disagree, it's right by definition and everything else is derived from it."},{"type":"match_pairs","prompt":"Match each kind of copy to what it is.","pairs":[{"left":"Source of truth","right":"The authoritative copy — if in doubt, ask it"},{"left":"Cache","right":"A fast copy that may be stale"},{"left":"Replica","right":"A copy kept in sync, for reads or failover"},{"left":"Stale","right":"A copy that no longer matches the truth"}],"why":"Each copy has a job and a failure mode, and being explicit about which is which keeps a design honest. In a design discussion, the sharpest question you can ask is 'which of these is the source of truth?' — surprisingly often nobody knows, and that ambiguity is where the worst bugs live."},{"type":"multiple_choice","prompt":"There's a famous joke: 'There are only two hard things in Computer Science: cache invalidation and naming things.' Why is cache invalidation genuinely hard?","choices":["Deleting keys is computationally expensive","Knowing WHEN a cached copy became wrong requires knowing every possible thing that could have changed it","Caches don't support deletion","It isn't hard — it's just a joke"],"answer":1,"why":"The cache has no idea the truth changed — someone has to tell it, or it has to guess, and both are imperfect while the knowledge of 'what invalidates this?' is scattered across every write path in your system. The two strategies: TTL (expire after N seconds — dead simple, but you knowingly serve stale data for up to N seconds) or explicit invalidation (delete the key when the data changes — precise, but you must find every write path forever, including the one a teammate adds next year without knowing your cache exists). Most real systems use both, because both are inadequate alone."},{"type":"multiple_choice","prompt":"Your entire cache is accidentally wiped. Is that an outage?","choices":["Always a catastrophe — the data is gone","It depends: if it held derived state, it rebuilds from the source of truth — painful but recoverable. If it held the only copy, the data is gone","Never a problem — caches don't matter","Only if it was more than 1GB"],"answer":1,"why":"The question for any copy is: can I rebuild this? Derived state can be recomputed from the truth; if the cache was the only home, there's nothing to rebuild from. Be religious about this distinction — a wiped cache of derived state is a bad afternoon (every request stampedes the database at once until it refills, the *thundering herd*), while a wiped source of truth is a company-ending event. You should always know, without thinking, which one each store is."},{"type":"tradeoff_slider","prompt":"You're displaying a user's account balance in a banking app. Slide toward how aggressively you'd cache it.","leftLabel":"Read the source of truth (correct, slower)","rightLabel":"Cache aggressively (fast, may be stale)","answerRange":[0,35],"why":"Showing someone the wrong balance is unacceptable — it's the one number they came to see, and being stale here looks like a bug or a theft, so pay the latency and read the truth. The governing question is always *what does staleness cost?* For a like count, essentially nothing — cache it hard. For a balance, or inventory during checkout, staleness is a real defect: you just oversold an item. Same technique, opposite decision, decided entirely by the cost of being wrong."}]},{"id":"state-4","title":"Deciding where state goes","exercises":[{"type":"multiple_choice","prompt":"Where should an e-commerce shopping cart live?","choices":["Server RAM — it's the fastest option","It depends on the promise: if users expect their cart on their phone AND laptop, it must be in a database tied to their account","Always in a cookie — it saves database load","In the load balancer"],"answer":1,"why":"The answer flows from the product promise rather than from technology: cart on every device means a database keyed to the account, because nothing else can deliver that guarantee. Notice the decisive question wasn't technical at all — it was *what did we promise?* Where state lives is chosen by the guarantee you need first, and the performance you can afford second; reversing that order is how teams end up with fast systems that break their own promises."},{"type":"build_diagram","prompt":"Uploaded photos are saved on one app server's local disk — so only that server can serve them, and they die with it. Where should they live?","slots":["App Server 1","App Server 2","?"],"palette":["Object storage (S3)","A bigger local disk","A cookie"],"answer":"Object storage (S3)","why":"Files on local disk are state trapped inside one server: peers can't serve them, and the machine can't be safely replaced — move them to shared object storage and your app servers become disposable again. This is one of the most common real-world migrations there is: 'it works on one server' quietly means state is hiding in the filesystem, and the day you add a second server, uploads mysteriously 404 half the time because the load balancer sent the read to the machine that doesn't have the file."},{"type":"multi_select","prompt":"Your app servers must be disposable — any one can die at any moment. Which of these violate that? Select all.","choices":["Storing uploaded files on local disk","Keeping user sessions in local memory","Writing logs to stdout to be collected elsewhere","Caching a computed value in local memory that can be recomputed"],"answer":[0,1],"why":"Local files and local sessions die with the server and can't be served by peers — lost data and broken users. Logs to stdout are shipped away, and a rebuildable local cache costs only a recompute if lost. The test isn't 'is there anything in memory?' — plenty of state in memory is fine. It's 'if this server vanished right now, would anything be LOST or become unavailable?' A local cache fails safe; a local session fails the user."},{"type":"multiple_choice","prompt":"To make `POST /payments` safely retryable, the server stores each idempotency key and its result. What have you just created?","choices":["Nothing — it's just a lookup","New state: the server must now durably remember keys, share them across servers, and eventually expire them","A cache, which needs no thought","A queue"],"answer":1,"why":"Idempotency isn't free — it's implemented WITH state: that key store must be durable (survive a crash mid-payment), shared (any server might receive the retry), and garbage-collected, or it grows forever. It's a lovely illustration of a general truth: 'make it reliable' almost always means 'add state, in exactly the right place'. Nothing is free — you're always moving the difficulty somewhere, and the skill is choosing somewhere that can handle it."},{"type":"tradeoff_slider","prompt":"You're rate-limiting a paid API where exceeding the limit costs you real money. Slide toward where the counter should live.","leftLabel":"Local memory per server (fast, approximate)","rightLabel":"Shared store (exact, adds a network hop)","answerRange":[55,100],"why":"With per-server counters and 10 servers, a user can get roughly 10× the intended limit — each server only counts what it personally saw. That's tolerable for crude abuse protection and unacceptable when the limit is a billing boundary. Real systems often do both: a fast local pre-filter that sheds obvious abuse without a network hop, plus a shared store for exact accounting. Note what just happened — 'where does this counter live?' turned into a correctness-vs-latency decision, which is this unit's lens."},{"type":"multiple_choice","prompt":"Which state placement survives an entire datacenter losing power?","choices":["Redis running in that datacenter","A database on disk in that datacenter","Data replicated to a database in another region","Server RAM"],"answer":2,"why":"Durability has levels: on-disk survives a process crash but not a building losing power, and only replication to another region survives losing the region. Each rung costs you — cross-region replication can mean a write waits for an acknowledgement from far away, that ~150ms from the latency unit now sitting inside your write path. This is exactly where 'where does state live' collides with physics, and it's the road that leads to CAP."},{"type":"multiple_choice","prompt":"A teammate says: 'let's just keep it in memory for now — it's faster.' What single question should decide it?","choices":["Is memory cheap enough?","'If this server died right now, what would we lose — and who else needs to read this?'","How large is the object?","Which library are we using?"],"answer":1,"why":"Those two halves — what's lost, and who must read it — determine every state placement decision in this unit: local memory is perfect for rebuildable private data and catastrophic for durable shared data, from the same sentence. And the lens scales further than you'd think: replication is 'who else needs to read it?' at scale, sharding is 'it no longer fits in one place', and CAP is 'what happens when the copies can't talk?' Every hard thing ahead of you is this one question, asked louder."}]}]};
/* ---- 06-what-a-database-is.json ---- */
const UNIT6 = {"unitId":"what-a-database-is","title":"What a Database Is","lessons":[{"id":"db-1","title":"Why not just use a file?","exercises":[{"type":"multiple_choice","prompt":"You store users in users.txt. Two people sign up at the exact same instant and both write to the file. What happens?","choices":["Both are saved correctly — the OS handles it","The writes can interleave or overwrite each other, and one signup is silently lost","The file locks itself automatically","The second write is queued perfectly"],"answer":1,"why":"A plain file has no concurrency control. Two writers can clobber each other, and you lose data with no error at all. Handling concurrent writers safely is one of the main reasons databases exist.","goDeeper":"This is the first thing everyone rediscovers when they 'just use a file.' It works flawlessly with one user and breaks the moment there are two — and the silence is the dangerous part. Nothing crashes, nothing logs. A signup simply never happened."},{"type":"multi_select","prompt":"What does a database give you that a plain file does not? Select all.","choices":["Safe concurrent access for many readers and writers","Finding one record without reading the whole file","Surviving a crash in the middle of a write","Storing bytes on a disk"],"answer":[0,1,2],"why":"Storing bytes is the one thing a file already does perfectly well. Everything else — concurrency, querying, crash safety — is what you're actually buying.","goDeeper":"Worth stating plainly: a database is not 'a fancy file.' It's a concurrency system, a query engine, and a crash-recovery system that happens to keep bytes on a disk. Those three problems are why it's the most complex component you'll run."},{"type":"multiple_choice","prompt":"Your process is killed halfway through writing a record to a file. What state is the file in?","choices":["Clean — the OS finishes the write for you","Possibly half-written and corrupt, with no record of what was in progress","It automatically rolls back to the previous version","Completely unchanged"],"answer":1,"why":"Nothing protects a partial write. You can be left with half a record and no way to know what was meant to happen — corrupt data that looks like real data.","goDeeper":"A database refuses to leave you there. It uses a log of intended changes so that after a crash it can recover to a clean state — either the change fully happened or it fully didn't. You'll see exactly how in this unit's last lesson."},{"type":"multiple_choice","prompt":"users.txt has 10 million lines. You need the user with email x@y.com. What must you do?","choices":["Jump directly to that line","Read lines one by one until you find it — up to 10 million reads","Ask the operating system to find it instantly","Nothing — files are searchable by default"],"answer":1,"why":"A file has no idea what's inside it. Finding anything means scanning everything. A database can jump straight to a record — and that difference is the entire game at scale.","goDeeper":"How it jumps is the subject of the Indexes unit. For now, hold the shape of the problem: 'scan everything' versus 'go straight there' is a difference of a million times, not a few percent."},{"type":"fill_blank","prompt":"A ______ is a program built to store data safely and let many users query and change it at once.","choices":["database","filesystem","cache","compiler"],"answer":0,"why":"Storage is the least interesting part of the definition. Safety under concurrency and the ability to query are the point.","goDeeper":null},{"type":"multiple_choice","prompt":"So what's the honest one-sentence reason databases exist?","choices":["Disks are hard to write to directly","Because storing data is easy, but querying it, sharing it between many concurrent users, and not losing it in a crash are all hard","They compress data better","They're required by web frameworks"],"answer":1,"why":"Every feature of a database traces back to one of those three hard problems: find it fast, share it safely, never lose it.","goDeeper":"Keep this frame. When you later evaluate any storage technology — SQL, NoSQL, a cache, object storage — you're really asking which of those three it does well, and which it quietly gives up."}]},{"id":"db-2","title":"Tables, rows, and keys","exercises":[{"type":"multiple_choice","prompt":"You're storing users and their orders. Why put them in two separate tables instead of one big table?","choices":["Two tables are always faster","So each fact lives in exactly one place — a user's email is stored once, not repeated on every order","There's no real reason; it's convention","To use less disk space overall"],"answer":1,"why":"If you repeat a user's email on all 500 of their orders, you now have 500 places to update when it changes — and 500 opportunities for them to disagree with each other.","goDeeper":"This is normalization, and it's the core idea of the relational model: every fact lives in exactly one place. Later you'll learn when to deliberately break this rule (denormalization) to buy speed — but you break it knowingly, accepting the update problem you just re-created."},{"type":"match_pairs","prompt":"Match each piece of the relational model to what it is.","pairs":[{"left":"Table","right":"A collection of rows of the same shape"},{"left":"Row","right":"One record — one user"},{"left":"Column","right":"One field — email"},{"left":"Schema","right":"The agreed shape of the data"}],"why":"Tables hold rows, rows have columns, and the schema is the contract describing what shape every row must take.","goDeeper":"Notice 'schema' is the same idea as an API contract from unit 3 — an agreement about shape that many parties depend on. And it has the same property: changing it once people depend on it is the hard part."},{"type":"multiple_choice","prompt":"What is a primary key?","choices":["The first column in the table","A value that uniquely identifies one row — no two rows can share it","The password protecting the table","The largest column"],"answer":1,"why":"The primary key is a row's identity. It's the handle you use to find, reference, and link that exact row.","goDeeper":"Which is why using an email as a primary key is a trap: everything else about a row can change, but identity shouldn't. People change emails — and now every table that referenced them must change too. Prefer a meaningless, stable id."},{"type":"multiple_choice","prompt":"The orders table has a user_id column pointing at users.id — a foreign key. What does that buy you?","choices":["Nothing beyond documentation","It links the order to its user AND lets the database refuse to create an order for a user who doesn't exist","Faster queries only","Automatic encryption of the column"],"answer":1,"why":"A foreign key is a relationship and a guarantee at once. The database itself refuses to create orphan rows — orders belonging to nobody.","goDeeper":"That's a constraint: a rule the database enforces no matter who writes to it — your API, a migration script, a colleague's one-off query at 2am, an intern with psql. Rules in application code get bypassed by the next writer. Rules in the database cannot be."},{"type":"multi_select","prompt":"Why is having a schema useful? Select all.","choices":["The database rejects malformed data before it's ever stored","Anyone reading the table knows exactly what to expect","It lets the database store and read the data efficiently","It makes changing the shape of your data effortless"],"answer":[0,1,2],"why":"A schema buys you enforcement, shared understanding, and efficient storage. What it emphatically does not buy is easy change — altering a schema on a huge live table is genuinely hard.","goDeeper":"And that last point is the real tradeoff, not a footnote. Schema gives you guarantees today and friction tomorrow. That exact tension is the seed of the SQL vs NoSQL argument you'll meet in the very next unit — it's a debate about when structure is worth its cost."},{"type":"fill_blank","prompt":"The ______ key uniquely identifies a row; a foreign key points at another table's row.","choices":["primary","secondary","index","search"],"answer":0,"why":"Primary key = this row's identity. Foreign key = a reference to some other row's identity. Together they're how the relational model links data without duplicating it.","goDeeper":null}]},{"id":"db-3","title":"How the database finds your data","exercises":[{"type":"multiple_choice","prompt":"You run: SELECT * FROM users WHERE email = 'x@y.com' — on 10 million rows, with no index on email. What does the database do?","choices":["Jumps straight to the matching row","Reads all 10 million rows, checking each one — a full table scan","Asks the operating system to find it","Refuses to run the query"],"answer":1,"why":"Without an index, the database does exactly what your text file did: reads everything. Writing SQL doesn't make something fast — it just makes it possible.","goDeeper":"Critical mental model: SQL is a request, not a promise about speed. The same query can take 1ms or 10 seconds depending entirely on whether a suitable index exists. People are shocked by this because the query text looks identical either way."},{"type":"multiple_choice","prompt":"Now: SELECT * FROM users WHERE id = 42, where id is the primary key. Fast or slow?","choices":["Slow — same as scanning every row","Fast — the primary key is automatically indexed, so the database jumps straight there","Slow, because it uses the disk","It depends on the table's size, always"],"answer":1,"why":"Primary keys come with an index for free. That's why looking up by id is instant while looking up by an unindexed email is a scan.","goDeeper":"This is why so many systems feel fine in development. Everyone looks things up by id at first, which is always fast. The scans arrive later — with the features that search by email, by name, by status."},{"type":"match_pairs","prompt":"Match each concept to what it means.","pairs":[{"left":"Query","right":"A question you ask of the data"},{"left":"Full table scan","right":"Reading every row to find matches"},{"left":"Join","right":"Combining rows from two tables via a link"},{"left":"Query planner","right":"The database's decision about HOW to run your query"}],"why":"You ask a question; the planner decides the strategy; a scan is the brute-force one; a join reassembles data you deliberately split apart.","goDeeper":"Joins are the payoff for normalizing: store each fact once, reassemble views of it on demand. But reassembly isn't free — and joining huge tables is precisely where the relational model starts to hurt at scale. That pain is a major reason NoSQL and denormalization exist."},{"type":"multiple_choice","prompt":"Why is SQL called a 'declarative' language?","choices":["Because it's verbose and hard to read","You declare WHAT data you want; the database decides HOW to fetch it","Because you declare variables before using them","It's just a historical name"],"answer":1,"why":"You describe the result you want. The query planner chooses the strategy — which index to use, which table to read first, how to join.","goDeeper":"This is both a superpower and a landmine. Superpower: the planner has statistics about your data and can optimize better than you'd hand-code. Landmine: a small change in the data distribution can make the planner pick a different plan, and your query falls off a performance cliff with zero code changes. 'Nothing changed, but it got slow' is usually this."},{"type":"estimate","prompt":"A full scan must check 10 million rows. If the database can check roughly 1 million rows per second, about how many seconds does that one query take?","answer":10,"tolerance":2,"unit":"seconds","why":"10 million ÷ 1 million per second = about 10 seconds — for a single query. Now picture 100 users running it at once.","goDeeper":"This is why 'scan vs indexed lookup' isn't a nice-to-have optimization. It's the difference between a product and an outage: those 100 concurrent scans saturate your database, queue up (remember unit 4), and take down every other query too — including the fast ones."},{"type":"multi_select","prompt":"Which of these actually make a query faster? Select all.","choices":["An index on the column you filter by","Fetching only the columns you actually need","Using SELECT * on a huge table","Filtering in the database instead of in your application code"],"answer":[0,1,3],"why":"Index the column you filter on, ask for less data, and let the database do the filtering. SELECT * on a wide table is the opposite — it drags columns you'll never read across the network.","goDeeper":"'Filter in the database, not in the app' deserves special emphasis: pulling a million rows over the network to filter them down to ten in Python is the single most common performance sin in web development. Move the work to the data — the data is heavy and the answer is light."}]},{"id":"db-4","title":"What a database actually promises","exercises":[{"type":"multiple_choice","prompt":"You INSERT a row and the database returns success. Then the power dies. Is your row there when it comes back up?","choices":["No — it was still in memory","Yes — 'success' means the database durably recorded it before answering","Only if it was small","Only if you waited a few seconds"],"answer":1,"why":"That's the promise, and it's the whole point of the word 'committed': it survives a crash. If commit didn't mean that, it would mean nothing at all.","goDeeper":"The trick is the write-ahead log (WAL). Before touching the real data, the database appends a record of what it's about to do to a sequential log and forces THAT to disk. After a crash it replays the log. That's how you get durability without paying for a slow random disk write on every single change."},{"type":"multiple_choice","prompt":"Why is the write-ahead log fast, even though it forces data onto disk before returning?","choices":["It's kept in memory only","It's a sequential append — and appending is dramatically faster than writing randomly across the disk","It's compressed","It isn't fast; it's just a necessary cost"],"answer":1,"why":"The log is append-only. The disk writes one continuous stream instead of hopping around to update scattered data pages — and sequential beats random by a huge margin.","goDeeper":"Sequential vs random access is one of the largest performance facts in all of storage, and databases are engineered around it rather than pretending disk behaves like RAM. Once you notice it, you see it everywhere: log-structured storage, Kafka, SSD write patterns."},{"type":"multiple_choice","prompt":"Two requests read a counter (value 10), each adds 1 in application code, and each writes back 11. What just happened?","choices":["The counter is 12 — correct","The counter is 11 — one increment vanished silently","The database throws an error","The counter stays at 10"],"answer":1,"why":"This is a lost update. Both read 10, both computed 11, both wrote 11. One user's increment simply disappeared — with no error anywhere.","goDeeper":"It's the users.txt problem again, wearing a database costume. The fix is to stop doing read-modify-write in your app and let the database do it atomically (UPDATE counters SET n = n + 1), or use a transaction with proper isolation — the subject of the Transactions & ACID unit. The lesson that matters right now: concurrency bugs don't crash, they quietly corrupt."},{"type":"multi_select","prompt":"Which of these are guarantees the DATABASE should enforce, rather than your application code? Select all.","choices":["Uniqueness — no two users with the same email","Referential integrity — no order without a real user","Crash-safe durability of committed data","Business rules like 'premium users get 20% off'"],"answer":[0,1,2],"why":"Constraints and durability belong in the database — it enforces them for every writer, forever. Business policy doesn't: it changes with the product and belongs in the app.","goDeeper":"The test: 'would this rule still be true no matter which app, script, or human writes to this table?' If yes, it's a data invariant — put it in the database where it can't be bypassed. If it's policy that marketing might change next quarter, keep it in the application."},{"type":"multiple_choice","prompt":"Your signup code checks 'does this email already exist?' and then INSERTs if not. Two signups for the same email race each other. What breaks?","choices":["Nothing — the check handles it","Both checks pass before either insert runs, so you get two users with the same email","The database deadlocks","The second request is automatically rejected"],"answer":1,"why":"Check-then-act is a race, always. Between your check and your insert, the other request slips through — and both believe they're the first.","goDeeper":"The only reliable fix is a UNIQUE constraint in the database, letting one insert fail and handling that error. This is why the database is the last line of defense: it's the single point every writer must pass through. Application checks are advisory; database constraints are law."},{"type":"tradeoff_slider","prompt":"You're recording analytics events at enormous volume — billions per day. Slide toward how strictly each write must be durable.","leftLabel":"Every event durably committed (safe, slow)","rightLabel":"Batched / fire-and-forget (fast, may lose a few)","answerRange":[55,100],"why":"Losing a handful of events out of billions changes no decision anyone will ever make. Throughput matters vastly more here than perfect durability — so batch hard and accept a little loss.","goDeeper":"This is unit 5's 'what does it cost to be wrong?' applied to durability. Not all data deserves the same promises: a payment must never vanish; an analytics ping can. Paying for guarantees you don't need is exactly how you build a system that's slow AND expensive."},{"type":"multiple_choice","prompt":"Why is the database usually the hardest part of a system to scale?","choices":["It's written in a low-level language","It's the stateful source of truth — app servers are disposable clones, but copies of data must agree with each other","Because it uses a disk","Because the software is old"],"answer":1,"why":"Your app servers are interchangeable and you scale them by adding boxes. The database holds the truth — and the moment you want a second copy of the truth for scale, you inherit replication, consistency, and conflict.","goDeeper":"This is unit 5's lens at its sharpest. You deliberately concentrated your state here, which makes the database simultaneously your most valuable component and your bottleneck. Everything ahead — indexes, replication, sharding, CAP, consistency models — is a consequence of that one decision."}]}]};
/* ---- 07-sql-vs-nosql.json ---- */
const UNIT7 = {"unitId":"sql-vs-nosql","title":"SQL vs NoSQL","lessons":[{"id":"nosql-1","title":"What NoSQL actually means","exercises":[{"type":"multiple_choice","prompt":"What does 'NoSQL' actually mean?","choices":["Databases with no query language at all","'Not only SQL' — an umbrella for non-relational databases that made different tradeoffs","Databases that are always faster than SQL ones","Databases that have no schema"],"answer":1,"why":"NoSQL isn't an anti-SQL movement. It's a loose family of stores that gave up parts of the relational model to get something else — usually easier horizontal scaling or a more natural data shape.","goDeeper":"The name is genuinely terrible and has fuelled a decade of confused arguments. Plenty of 'NoSQL' databases have rich query languages, and some now literally speak SQL. The useful question is never 'SQL or NoSQL' — it's 'what did this database give up, and what did it buy with it?'"},{"type":"multiple_choice","prompt":"Is NoSQL inherently faster than a relational database?","choices":["Yes — it's newer and better engineered","No — it's faster at certain access patterns because it does less: no joins, no cross-node transactions, fewer guarantees","No — it's actually always slower","They're identical in performance"],"answer":1,"why":"Speed here isn't magic, it's subtraction. A key-value store is blisteringly fast at 'give me the value at this key' precisely because that's all it promises to do.","goDeeper":"Generalize this instinct: whenever one system is dramatically faster than another at a similar task, ask what it stopped promising. Performance almost always comes from removing a guarantee, not from writing better code. That question will serve you for your whole career."},{"type":"multiple_choice","prompt":"A document database is often called 'schemaless.' So where did the schema go?","choices":["There genuinely isn't one — the data has no shape","Into your application code — every reader must now handle every historical shape of the data","Into the operating system","It's generated automatically at runtime"],"answer":1,"why":"Your data always has a shape. 'Schemaless' only means the database stopped enforcing it — so the enforcement moved into your code, where it's optional and easy to forget.","goDeeper":"The real terms are schema-on-write (SQL: the database rejects malformed data at insert) versus schema-on-read (accept anything; readers cope). Schema-on-read feels liberating in month one and painful in year three, when one collection holds five generations of shape and every reader needs branches for all of them."},{"type":"fill_blank","prompt":"SQL enforces the shape of data when you ______; many NoSQL stores leave it to be interpreted when you read.","choices":["write","delete","connect","backup"],"answer":0,"why":"Schema-on-write catches bad data at the door, before it's stored. Schema-on-read lets it in and makes every future reader deal with it.","goDeeper":null},{"type":"multi_select","prompt":"Which of these are TRUE of relational databases? Select all.","choices":["They enforce structure and relationships for you","They're built around joining normalized tables","They cannot handle large scale under any circumstances","They give strong transactional guarantees"],"answer":[0,1,3],"why":"Structure, joins, and strong transactions are real. 'Can't handle scale' is the myth — a single well-tuned Postgres routinely serves workloads far beyond what most companies ever reach.","goDeeper":"This myth has cost the industry enormous pain. Teams adopt a distributed NoSQL store at 5,000 users to prepare for a scale they never hit, and pay the cost of losing joins and transactions every single day in between."},{"type":"multiple_choice","prompt":"So what's the genuinely useful question when picking a database?","choices":["Is it SQL or NoSQL?","What will I ask of this data, what must never be wrong, and what does this database give up?","Which one is newest?","Which one does my favourite company use?"],"answer":1,"why":"Access patterns and required guarantees decide the answer. The SQL/NoSQL label is a category, not a decision.","goDeeper":"Notice that this question doesn't mention a single product name. If you can't answer it, no amount of benchmarking will save you — you'll just pick fast software that's wrong for your problem."}]},{"id":"nosql-2","title":"The four families","exercises":[{"type":"match_pairs","prompt":"Match each NoSQL family to the shape it's built for.","pairs":[{"left":"Key-value (Redis, DynamoDB)","right":"Get/put a value by one key"},{"left":"Document (MongoDB)","right":"Self-contained JSON documents"},{"left":"Wide-column (Cassandra)","right":"Huge tables, queried by partition key"},{"left":"Graph (Neo4j)","right":"The relationships ARE the data"}],"why":"'NoSQL' isn't one thing — it's four very different answers to four very different problems. Lumping them together is most of why the debate is so muddled.","goDeeper":"These families have less in common with each other than any of them has with Postgres. A graph database and a key-value store are about as similar as a spreadsheet and a hammer — they only share a name because of a marketing accident."},{"type":"multiple_choice","prompt":"You need to store user sessions: looked up only by session id, never queried any other way. Which shape fits?","choices":["Key-value","Graph","Wide-column","Relational with 6 tables"],"answer":0,"why":"One access pattern, one key. A key-value store does exactly this and nothing else — which is why it's so fast at it.","goDeeper":"Don't buy a relational engine to do a hashmap's job. This is the cleanest, least controversial NoSQL win there is: when your access pattern really is 'get the thing at this key,' everything else is overhead."},{"type":"build_diagram","prompt":"Sessions are read millions of times a second by one key, and can be rebuilt if lost. Add the right store, keeping Postgres as the source of truth.","slots":["App Servers","?","Postgres (source of truth)"],"palette":["Redis (key-value)","Neo4j (graph)","A second Postgres"],"answer":"Redis (key-value)","why":"Sessions are a single-key, rebuildable, extremely hot access pattern — exactly a key-value store's job. Postgres keeps the durable truth; Redis absorbs the volume.","goDeeper":"Notice you didn't choose SQL OR NoSQL — you used both, each for what it's good at. That's polyglot persistence, and it's what most real systems actually look like. The question was never either/or."},{"type":"multiple_choice","prompt":"You're storing a product catalog where every type has wildly different attributes — a book has an author, a shirt has a size, a laptop has RAM. Which fits most naturally?","choices":["Key-value","Document","Graph","One relational table with 200 mostly-null columns"],"answer":1,"why":"Documents are self-contained and can legitimately differ in shape from each other, which is exactly what a heterogeneous catalog is.","goDeeper":"This is the strongest honest case for document stores: varied, self-contained entities you fetch whole. But be clear-eyed about the cost you just accepted — nothing now guarantees that shirts have sizes. That check moved into your code, forever."},{"type":"multiple_choice","prompt":"You need 'friends of friends who like X, within 3 hops.' In SQL that's a self-join per hop. What's built for this?","choices":["Key-value","Document","Graph","Wide-column"],"answer":2,"why":"Graph databases store relationships as first-class citizens, so traversals don't explode into ever-deeper joins as you add hops.","goDeeper":"The tell for a graph problem: your queries are about the CONNECTIONS, not the entities. If you find yourself joining a table to itself repeatedly and adding a level each time the product team asks for one more hop, you may have a graph problem wearing a relational costume."},{"type":"multiple_choice","prompt":"Cassandra can absorb enormous write volume across many nodes. What's the catch?","choices":["There isn't one — it's strictly better","You must know your query patterns up front: tables are designed around the partition key, and ad-hoc queries are painful or impossible","It can't actually write quickly","It only works on one machine"],"answer":1,"why":"Wide-column stores buy their scale by making you commit to your access patterns in advance. The table is shaped around the query, so a new question can mean a new table.","goDeeper":"This is the trade in its purest form. Cassandra will happily take a million writes a second across a hundred nodes — but the day a product manager asks a question you didn't design for, the answer may genuinely be 'we'd have to rewrite how the data is stored.'"}]},{"id":"nosql-3","title":"Model the data vs model the queries","exercises":[{"type":"multiple_choice","prompt":"What's the deepest difference between relational and most NoSQL modeling?","choices":["The syntax you type","SQL: model the data correctly, then query it however you like later. NoSQL: model your queries first, then shape the storage to serve them","How fast they read from disk","One uses JSON and one doesn't"],"answer":1,"why":"This is the actual mental shift, and it's the thing people get wrong. Relational lets you decide the questions later; most NoSQL requires you to decide them first.","goDeeper":"In relational, normalize now and you can still answer questions you haven't thought of yet — the join is your escape hatch. In NoSQL you often can't join, so you must know the questions in advance and physically store the answers in the shape you'll read them."},{"type":"multiple_choice","prompt":"In DynamoDB you can't join. To show an order together with its customer's name, what do you typically do?","choices":["Run two queries and join in your app","Duplicate the customer's name into the order record itself","Give up and use SQL","Store a pointer and follow it"],"answer":1,"why":"You store the answer, not the ingredients. The order record carries the customer name so one read returns everything the screen needs.","goDeeper":"That's denormalization. It makes reads a single fast lookup — but the name now lives in two places, which is exactly unit 5's copies problem. You've traded a consistency guarantee for read speed, on purpose."},{"type":"multiple_choice","prompt":"You denormalized a user's display name into all 10,000 of their posts. They change their name. What now?","choices":["One update — the database handles the rest","You must update 10,000 records, and until you finish, the system displays two different names","Nothing — old posts keep the old name and that's correct","The database refuses the change"],"answer":1,"why":"You moved the work from read-time to write-time. Reads became one fast lookup; that single rename became an enormous, slow, partially-visible operation.","goDeeper":"Here's the fundamental exchange rate of data modeling: normalized = cheap writes, expensive reads (you join). Denormalized = cheap reads, expensive writes plus a consistency risk. Neither side is free. You are only ever choosing which side pays."},{"type":"tradeoff_slider","prompt":"A social feed: 99% reads, 1% writes. Slide toward your modeling choice.","leftLabel":"Normalize (join at read time)","rightLabel":"Denormalize (store the answer, pay at write time)","answerRange":[60,100],"why":"With a 99:1 read-to-write ratio, paying at write time is obviously right: do the work once when someone posts, so that millions of reads are single cheap lookups.","goDeeper":"The rule to carry: put the work where the traffic isn't. Read-heavy → precompute and denormalize. Write-heavy → normalize and compute at read time. You'll meet this exact reasoning again, by a different name, in the news feed capstone: fan-out on write vs fan-out on read."},{"type":"multi_select","prompt":"What are the real costs of denormalizing? Select all.","choices":["Copies can disagree with each other","Writes get more expensive","Reads get slower","You must know your access patterns in advance"],"answer":[0,1,3],"why":"Reads get FASTER — that's the entire point of doing it. The costs are drifting copies, heavier writes, and committing to your query patterns early.","goDeeper":"Notice that two of those three costs are the same cost wearing different hats: once data lives in many places, both writing it and trusting it get harder. Duplication is never just a storage decision."},{"type":"multiple_choice","prompt":"Your NoSQL data model can answer every question your product asks today. What's the risk?","choices":["There's no risk — it works","Tomorrow's question may not fit the shape you committed to, and reshaping stored data is far harder than writing a new query","It will run out of disk","It can't be backed up"],"answer":1,"why":"Modeling for your queries means your storage encodes today's questions. A new question can require reshaping the data itself — not just writing new SQL.","goDeeper":"This is the asymmetry that decides most real arguments: in relational, a new question costs you a query. In query-modeled NoSQL, a new question can cost you a migration. Early products change their questions constantly — which is a strong hint about what to default to."}]},{"id":"nosql-4","title":"Choosing, honestly","exercises":[{"type":"multiple_choice","prompt":"Why is a relational database genuinely hard to scale across many machines?","choices":["The software is old and poorly written","Joins and ACID transactions across machines require network coordination — which is slow and complex. Many NoSQL stores scale easily precisely because they dropped those","Because it writes to disk","Licensing restrictions"],"answer":1,"why":"This is the honest technical reason, not marketing. A join is cheap when both tables sit on one machine and brutal when the rows live on different servers across a network.","goDeeper":"So 'NoSQL scales better' really means: 'we removed the features that are hard to distribute.' That's a genuine engineering achievement AND a genuine loss. Just be certain you know which half you're buying — people usually notice the achievement and discover the loss later."},{"type":"multi_select","prompt":"Which are legitimate reasons to reach for NoSQL? Select all.","choices":["One well-known access pattern at massive scale","Data that's naturally self-contained documents","Relational feels old-fashioned","You need writes distributed across many nodes and don't need cross-node transactions"],"answer":[0,1,3],"why":"Known access patterns at scale, document-shaped data, and distributed writes without cross-node transactions are all real reasons. Fashion is not a reason.","goDeeper":"Note what all three real reasons have in common: they're statements about your workload, not about the technology. Every good database decision is really a description of your problem."},{"type":"multiple_choice","prompt":"New product. You don't yet know what queries you'll need, and you have 1,000 users. Sane default?","choices":["Cassandra, to be ready for scale later","A relational database — flexible about questions you haven't thought of, constraints for free, and far more headroom than you need","MongoDB, because JSON is convenient","A graph database, since everything is connected"],"answer":1,"why":"At 1,000 users your bottleneck isn't the database — it's not yet knowing what you're building. Relational lets you change your questions cheaply, which is precisely what early products do constantly.","goDeeper":"'You're not Google' isn't an insult, it's an engineering fact. A single well-tuned Postgres routinely handles tens of thousands of transactions per second and terabytes of data. Most teams who chose NoSQL 'for scale' hit the pain of losing joins years before they'd have hit Postgres's ceiling."},{"type":"multiple_choice","prompt":"Which statement is TRUE about the SQL/NoSQL landscape today?","choices":["NoSQL databases never support transactions","The lines have blurred: Postgres stores and indexes JSON, MongoDB added transactions, and NewSQL systems aim for relational semantics with horizontal scale","SQL databases cannot store JSON","The two worlds remain completely separate"],"answer":1,"why":"The clean 2010s dichotomy has largely dissolved. Both sides absorbed the other's best ideas, and NewSQL (Spanner, CockroachDB) explicitly chases both at once.","goDeeper":"Which is why the honest modern answer is rarely 'SQL or NoSQL.' It's: what access patterns, what guarantees, what scale — and can my boring default already handle it? Most real systems end up polyglot anyway: Postgres for truth, Redis for hot reads, S3 for blobs. It's a toolbox, not a religion."},{"type":"multiple_choice","prompt":"A team picked NoSQL 'for scale.' A year later they need a report that requires joining across two collections. What happens?","choices":["It's trivial — they just write the query","They must denormalize (taking on the update burden), join in application code (slow, N+1), or migrate — the flexibility they gave up is exactly what they now need","The database adds joins automatically","Nothing changes"],"answer":1,"why":"This is the most common real-world regret in database choice. They optimized for a scale problem they might have, and gave up flexibility for a problem they definitely had.","goDeeper":"Joining in application code is the worst of all worlds: you get unit 3's N+1 problem, over a network, with no query optimizer helping you — and you rebuild, badly, the exact feature you chose to give up."},{"type":"tradeoff_slider","prompt":"You're storing financial transactions for a bank. Slide toward your choice.","leftLabel":"Relational (constraints + ACID)","rightLabel":"NoSQL (flexible + horizontal scale)","answerRange":[0,35],"why":"Money needs invariants the database itself enforces and multi-row transactions that genuinely hold. Here correctness dwarfs scale — and being wrong isn't a bug, it's a regulator.","goDeeper":"Contrast with the social feed slider two lessons ago, which went the opposite way. Same question, opposite answers — because the cost of being wrong is completely different. That cost, not the technology, is what's actually choosing."},{"type":"multiple_choice","prompt":"What's the honest way to choose a database?","choices":["Pick whatever's trending this year","Start from access patterns and required guarantees; default to relational unless a specific need pushes you off it — and know exactly what you're giving up","Always NoSQL — it's the future","Always SQL — NoSQL is a fad"],"answer":1,"why":"Start from the problem: what will you ask, and what must never be wrong. Then pick the boring default unless something concrete — scale profile, data shape, write distribution — forces you off it, consciously.","goDeeper":"Look back at this whole unit: every answer reduced to the same two questions — what will you ask of the data, and what must never be wrong? Technology names came last, every single time. That ordering is the actual skill; everything else is trivia."}]}]};
