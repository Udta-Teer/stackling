<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackling — How the Internet Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Stackling brand — "blueprint at night" */
  :root{
    --disp:'Bricolage Grotesque',-apple-system,system-ui,sans-serif;
    --body:'Inter',-apple-system,system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --bg:#071522; --card:#0d2438; --card2:#12314b;
    --ink:#eaf1f8; --muted:#9db4cc; --line:rgba(76,176,255,.16);
    --blueprint:#1e5aa8; --blueprint-dk:#12406f; --blue:#4cb0ff;
    --signal:#ffb020;
    --green:#35d0a5; --green-dark:#35d0a5; --green-soft:rgba(53,208,165,.15);
    --red:#ff5c7a; --red-soft:rgba(255,92,122,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(76,176,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(76,176,255,.05) 1px,transparent 1px);background-size:28px 28px;}
  .mark{width:var(--s,32px);height:var(--s,32px);flex:none}
  .brand{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink);}
  .app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px;}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
  .close{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;}
  .bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .3s ease;}
  .hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-size:18px;}
  /* body */
  .stage{flex:1;display:flex;flex-direction:column;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:400;margin-bottom:8px;}
  .prompt{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1.3;letter-spacing:-.01em;margin:0 0 22px;}
  /* inline markdown from content strings — see md() */
  code{font-family:var(--mono);font-size:.86em;background:var(--card2);color:var(--blue);
    padding:.1em .36em;border-radius:5px;border:1px solid var(--line);}
  em{font-style:italic;color:var(--signal);}
  /* choices */
  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:2px solid var(--line);
    border-bottom-width:4px;border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:700;
    cursor:pointer;transition:.08s;}
  .choice:hover{background:rgba(28,176,246,.06);}
  .choice.sel{border-color:var(--blue);background:rgba(28,176,246,.1);}
  .choice.ok{border-color:var(--green);background:var(--green-soft);}
  .choice.bad{border-color:var(--red);background:var(--red-soft);}
  .choice .k{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:13px;color:var(--muted);}
  .choice.sel .k{border-color:var(--blue);color:var(--blue);}
  /* generic tiles / chips */
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:12px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);
    color:var(--ink);font-weight:700;cursor:pointer;transition:.08s;}
  .chip:hover{border-color:var(--blue);}
  .chip.used{opacity:.35;pointer-events:none;}
  .bank{min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;margin-bottom:16px;}
  /* order list */
  .order{display:flex;flex-direction:column;gap:10px;}
  .order .row{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);font-weight:700;}
  .order .row .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;}
  .order .arrows{margin-left:auto;display:flex;gap:6px;}
  .order .arrows button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:800;}
  /* match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .match .col{display:flex;flex-direction:column;gap:10px;}
  /* diagram slots */
  .diagram{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
  .node{padding:14px 16px;border-radius:12px;font-weight:800;border:2px solid var(--line);background:var(--card);}
  .node.fixed{background:rgba(28,176,246,.12);border-color:var(--blue);}
  .slot{min-width:90px;text-align:center;padding:14px 12px;border:2px dashed var(--muted);border-radius:12px;font-weight:800;color:var(--muted);}
  .slot.filled{border-style:solid;border-color:var(--green);color:var(--ink);background:var(--green-soft);}
  .arrow{color:var(--muted);font-size:20px;font-weight:900;}
  /* estimate */
  .est{display:flex;align-items:center;gap:10px;}
  .est input{font-size:22px;font-weight:800;padding:12px;width:130px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);}
  .est .unit{font-weight:800;color:var(--muted);}
  /* slider */
  .slider-wrap{margin:10px 0 4px;}
  .slider-labels{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:10px;gap:10px;}
  input[type=range]{width:100%;accent-color:var(--blue);height:8px;}
  .slider-val{text-align:center;font-weight:800;margin-top:8px;color:var(--blue);}
  /* footer */
  .foot{position:sticky;bottom:0;padding-top:16px;background:var(--bg);}
  .btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.02em;
    text-transform:uppercase;cursor:pointer;color:#fff;background:var(--blueprint);border-bottom:4px solid var(--blueprint-dk);transition:.08s;}
  .btn:disabled{background:var(--line);color:var(--muted);border-bottom-color:var(--line);cursor:not-allowed;}
  .btn.grey{background:var(--line);color:var(--muted);border-bottom-color:var(--line);}
  .feedback{border-radius:16px 16px 0 0;margin:16px -16px -16px;padding:18px 16px 22px;}
  .feedback.ok{background:var(--green-soft);}
  .feedback.bad{background:var(--red-soft);}
  .feedback h4{margin:0 0 6px;font-family:var(--disp);font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .feedback.ok h4{color:var(--green-dark);}
  .feedback.bad h4{color:var(--red);}
  .feedback p{margin:0 0 10px;font-weight:600;line-height:1.45;}
  .deeper{background:rgba(28,176,246,.14);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.45;}
  .deeper b{color:var(--blue);}
  /* complete */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .done .big{font-size:64px;}
  .done h2{margin:0;font-family:var(--disp);font-size:28px;font-weight:800;}
  .stat{display:flex;gap:12px;margin-top:10px;}
  .stat .box{border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-family:var(--disp);font-weight:800;font-size:20px;background:var(--card);}
  .stat .box.xp{color:var(--signal);}
  .stat .box small{display:block;color:var(--muted);font-family:var(--mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
  .lessonpick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .utabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .utab{font-family:var(--mono);font-size:12px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);cursor:pointer;transition:.08s;}
  .utab.on{border-color:var(--blue);color:var(--blue);background:rgba(76,176,255,.12);}
  .hidden{display:none!important;}
</style>
</head>

    <rect x="30" y="12" width="40" height="30" rx="9" fill="#ffb020"/>
    <circle cx="43" cy="27" r="4.4" fill="#071522"/>
    <circle cx="57" cy="27" r="4.4" fill="#071522"/>
    <circle cx="44.4" cy="25.6" r="1.4" fill="#fff"/>
    <circle cx="58.4" cy="25.6" r="1.4" fill="#fff"/>

</svg>

<div class="app">
  <div class="top">
    <button class="close" onclick="location.reload()">✕</button>

  <!-- lesson picker -->
  <div id="picker" class="stage">

  <!-- exercise -->
  <div id="stage" class="stage hidden"></div>

      </div>
      <button class="btn" style="max-width:260px;margin-top:18px" onclick="location.reload()">Back to lessons</button>
    </div>
  </div>

  <div id="foot" class="foot hidden">
    <div id="feedback"></div>
    <button id="action" class="btn" disabled>Check</button>
  </div>
</div>

<script>
/* === GENERATED BY scripts/build-prototype.py — DO NOT EDIT BY HAND === */
/* ---- 01-how-the-internet-works.json ---- */
const UNIT1 = {"unitId":"how-internet-works","title":"How the Internet Works","lessons":[{"id":"hiw-1","title":"It's just computers passing notes","exercises":[{"type":"multiple_choice","prompt":"You open a website. Roughly how many separate computers might your request pass through before it reaches the server?","choices":["Just 1 — mine and theirs","About 3","Often 10–20","Exactly 100"],"answer":2,"why":"Your data hops through many routers along the way — often 10 to 20 — each one passing it a step closer to the destination. You can watch this happen yourself: run `traceroute google.com` (or `tracert` on Windows) and it prints every hop your packets take across the world."},{"type":"fill_blank","prompt":"Data doesn't travel as one big blob. It's broken into small chunks called ______.","choices":["packets","pixels","cookies","threads"],"answer":0,"why":"The internet splits your data into small packets, sends them independently, and reassembles them at the other end. Because they travel independently, packets can take *different routes* and arrive out of order — so something has to put them back in sequence, which is TCP's job in lesson 4."},{"type":"multiple_choice","prompt":"Every device on the internet needs one of these to be found. What is it?","choices":["A username","An IP address","A password","A phone number"],"answer":1,"why":"An IP address (like `142.250.72.14`) is a device's location on the internet — data can't be delivered without one. There aren't enough of the old IPv4 addresses (~4.3 billion) for the world, which is exactly why IPv6 exists with an address space large enough that running out stops being a concern."},{"type":"match_pairs","prompt":"Match each piece to what it does.","pairs":[{"left":"Packet","right":"A small chunk of your data"},{"left":"IP address","right":"A device's location on the internet"},{"left":"Router","right":"Passes packets toward their destination"}],"why":"Packets carry the data, IP addresses say where it's going, and routers move it hop by hop. The surprising part is that no router knows the whole path — each one only knows the *next best hop*, so the internet has no central map of itself."},{"type":"multiple_choice","prompt":"There's no master computer running the internet. So how do packets find their way?","choices":["A central server in the US decides every route","Each router just forwards to the next-best hop toward the target","Packets are sent to every computer until one matches","Your ISP pre-computes the full path"],"answer":1,"why":"The internet is decentralized: each router makes a local decision — *who gets me closer?* — and no single machine is in charge. That's precisely why it's so resilient. Knock out a router and traffic simply routes around it, which was a design goal from its Cold-War-era origins rather than a happy accident."}]},{"id":"hiw-2","title":"DNS: the internet's phonebook","exercises":[{"type":"multiple_choice","prompt":"You type `google.com`, but computers route by IP address. Who turns the name into the number?","choices":["Your keyboard","DNS","The CPU","Your Wi-Fi router alone"],"answer":1,"why":"DNS (Domain Name System) is the internet's phonebook — it looks up `google.com` and returns its IP address. Humans remember names and machines need numbers, so DNS is the translation layer that lets us live in a world of words."},{"type":"fill_blank","prompt":"DNS translates a human-friendly ______ into a machine-friendly IP address.","choices":["domain name","password","packet","port"],"answer":0,"why":"A domain name like `netflix.com` is for humans; DNS converts it to the IP address machines actually use to route packets."},{"type":"order_steps","prompt":"Put a DNS lookup in order (simplified).","steps":["Browser asks: what's the IP for `example.com`?","Check the local cache — seen it recently?","If not cached, ask a DNS resolver","Resolver returns the IP address","Browser connects to that IP"],"why":"DNS checks the fastest source first (the local cache) before asking a resolver, then hands the browser an IP to connect to. Results get cached at many levels — browser, operating system, resolver — each honouring a TTL (time to live), which is why a DNS change can take hours to reach everyone."},{"type":"multiple_choice","prompt":"In October 2016, a company called Dyn was attacked. Suddenly Twitter, Spotify, Reddit, and Netflix all went dark at once — even though those companies were fine. What had been knocked out?","choices":["A single giant server","A major DNS provider","The undersea cables","Everyone's Wi-Fi"],"answer":1,"why":"Dyn was a big DNS provider, and taking out DNS means users can't translate names to IPs — so the sites become unreachable while running perfectly. DNS is a quiet single point of failure for huge chunks of the web, which is why serious systems use multiple DNS providers."},{"type":"multi_select","prompt":"Why does DNS cache results instead of looking up every time? Select all that apply.","choices":["Lookups take time — caching makes pages load faster","It reduces load on DNS servers","It makes the answer more accurate","The same names are requested over and over"],"answer":[0,1,3],"why":"Caching is about speed and load: popular names are requested constantly, so remembering the answer avoids a repeat round trip. It does NOT make answers more accurate — a stale cache can happily serve an outdated IP. This is your first taste of caching, a theme you'll meet everywhere: keep the hot answer close, and accept that it might be behind."}]},{"id":"hiw-3","title":"The journey of a request","exercises":[{"type":"multiple_choice","prompt":"Before your browser can send an HTTP request to a server, what does it need first?","choices":["The server's IP address","The server's password","A faster CPU","More RAM"],"answer":0,"why":"You can't send data anywhere without a destination address, so DNS supplies the server's IP first — and only then can the request travel."},{"type":"order_steps","prompt":"Order what happens when you visit `example.com`.","steps":["DNS resolves `example.com` to an IP address","Browser opens a connection to that IP","Browser sends an HTTP request","Server processes the request","Server sends back an HTTP response","Browser renders the page"],"why":"Every page load is this dance: name → IP → connect → ask → process → answer → render. On a real HTTPS site there's also a TLS handshake right after connecting, which encrypts everything — that's the *s* in `https`."},{"type":"build_diagram","prompt":"Place the missing piece: your browser needs to turn `example.com` into an IP before reaching the server.","slots":["Browser","?","Web Server"],"palette":["DNS","Database","Cache"],"answer":"DNS","why":"DNS sits between you and the server on that first step, translating the name so your browser knows where to connect."},{"type":"estimate","prompt":"Light travels fast, but not instantly. A round trip from New York to a server in London and back is roughly how many milliseconds — at the physical minimum?","answer":70,"tolerance":30,"unit":"ms","why":"Even at the speed of light through fibre, a New York–London round trip takes roughly 70ms. Physics sets a floor on latency that no amount of engineering can beat — which is why companies put servers *close to users* rather than trying to make the trip faster. You can't outrun light, so you shorten the distance."},{"type":"multiple_choice","prompt":"Your page felt slow. The server responded in 5ms, but the total was 300ms. Where did the time most likely go?","choices":["The server was slow","Network round-trips across distance","The database was down","Your CPU was busy"],"answer":1,"why":"If the server itself only took 5ms, the other 295ms was the network — the round trips of getting data there and back. A useful rule of thumb: the *network*, not the server, is often your latency bottleneck, so measure before you optimize."}]},{"id":"hiw-4","title":"TCP vs UDP: reliable vs fast","exercises":[{"type":"multiple_choice","prompt":"You're loading a bank statement. Every byte must arrive, in order, no errors. Which protocol fits?","choices":["UDP","TCP","Neither","Both equally"],"answer":1,"why":"TCP (Transmission Control Protocol) guarantees delivery and order — it re-sends lost packets and reassembles them correctly, which is what you want for data you can't afford to lose. It manages that with acknowledgements: the receiver confirms each chunk, and anything unconfirmed gets re-sent, so reliability costs you extra round trips."},{"type":"multiple_choice","prompt":"You're on a live video call. A dropped frame is fine, but a 2-second delay to re-send it is not. Which protocol fits?","choices":["TCP","UDP","Neither","Always TCP for video"],"answer":1,"why":"UDP (User Datagram Protocol) just fires packets and doesn't wait for confirmation. For live audio and video, a missing frame beats a laggy one — speed matters more than perfection. This is a classic tradeoff you'll make again and again: reliability against latency."},{"type":"match_pairs","prompt":"Match the use case to the better protocol.","pairs":[{"left":"Downloading a file","right":"TCP"},{"left":"Live game / video call","right":"UDP"},{"left":"Loading a web page","right":"TCP"},{"left":"DNS lookup (small, fast)","right":"UDP"}],"why":"TCP for anything that must arrive complete and correct; UDP for small or real-time traffic where speed beats perfection. DNS traditionally uses UDP because a lookup is tiny — if it's lost, just ask again — while modern DNS-over-HTTPS uses TCP for privacy."},{"type":"tradeoff_slider","prompt":"You're designing a multiplayer game's networking. Slide toward what you'd prioritize for player-movement updates.","leftLabel":"Guaranteed delivery (TCP)","rightLabel":"Lowest latency (UDP)","answerRange":[65,100],"why":"For fast-moving player positions, low latency wins: a slightly stale position that arrives NOW beats a perfect one that arrives late. Games send fresh position updates constantly, so a lost one is instantly replaced — meaning TCP's re-sending of old positions would actually make gameplay feel *worse*."},{"type":"fill_blank","prompt":"The core tradeoff between TCP and UDP: TCP gives you reliability, UDP gives you ______.","choices":["speed","security","storage","encryption"],"answer":0,"why":"TCP trades speed for guaranteed, ordered delivery; UDP trades those guarantees for raw speed. Neither is 'better' — the right choice depends entirely on what your system values most, and making that judgment *is* system design."},{"type":"multiple_choice","prompt":"You've now traced a request end to end. Which statement best captures how the internet moves your data?","choices":["One connection sends the whole file at once with no addressing","Data is split into packets, addressed by IP, routed hop-by-hop, and reassembled","A central server copies data directly to your screen","The browser stores everything locally and never contacts a server"],"answer":1,"why":"That's the whole picture: split into packets, addressed with IPs (found via DNS), routed hop-by-hop by routers, and reassembled — reliably with TCP or fast with UDP. Everything else in this course — caching, load balancing, databases — is built on this foundation."}]}]};
/* ---- 02-client-server-http.json ---- */
const UNIT2 = {"unitId":"client-server-http","title":"Client–Server & HTTP","lessons":[{"id":"csh-1","title":"Ask and answer","exercises":[{"type":"multiple_choice","prompt":"You open a social app and your feed appears. Where did that data physically come from the instant you opened it?","choices":["It was already fully stored on your phone","Your phone asked a server, and the server answered","Another user's phone sent it straight to you","The app store pushed it"],"answer":1,"why":"This is the client–server model: your phone (the client) sends a request, and a server sends back a response. Your phone stores almost none of the data — it just knows how to ask. One server answers millions of clients, and that asymmetry — few servers, many clients — is the shape of almost every system you'll design."},{"type":"fill_blank","prompt":"The machine that asks is the ______; the machine that answers is the server.","choices":["client","router","cache","proxy"],"answer":0,"why":"Client = asks, server = answers. They're roles rather than fixed machines: a 'server' is itself a 'client' of another server whenever it calls one, so your API server calling a payments API is a client in that conversation. The roles nest."},{"type":"match_pairs","prompt":"Match each part of an HTTP request to its job.","pairs":[{"left":"Method","right":"What you want to do (`GET`, `POST`)"},{"left":"Path","right":"Which resource (`/users/42`)"},{"left":"Headers","right":"Metadata about the request"},{"left":"Body","right":"The data you're sending"}],"why":"Every request is: a method (the verb), a path (the noun), headers (context), and an optional body (the payload). A `GET` usually has no body — it just names what it wants — while a `POST` carries its data in the body. HTTP is plain text under the hood, so you could type a request by hand."},{"type":"order_steps","prompt":"Order one request/response round trip.","steps":["Client builds an HTTP request","Client sends it to the server","Server processes the request","Server builds a response","Client receives and renders it"],"why":"Ask, travel, process, answer, render — the loop behind every screen you've ever loaded. The 'travel' step includes the network round trips from unit 1, and on HTTPS a TLS handshake happens first to encrypt everything."},{"type":"multiple_choice","prompt":"You send one request, then another. By default, does the server remember your first request when handling the second?","choices":["Yes — servers always remember","No — each HTTP request is independent (stateless)","Only if both are `GET` requests","Only if they're within one second"],"answer":1,"why":"HTTP is stateless: by default each request stands entirely on its own, and the server doesn't inherently remember the last one. So how does staying logged in work? The client re-sends proof — a cookie or token — on every single request. State lives with the client or in a shared store, *not* in one server's memory, and that fact is this unit's boss lesson."},{"type":"multiple_choice","prompt":"Which statement best captures what HTTP is?","choices":["A database that stores your data","A stateless request/response protocol for clients and servers to talk","A programming language for servers","A type of physical cable"],"answer":1,"why":"HTTP is the agreed language of the web: a stateless protocol where clients make requests and servers return responses."}]},{"id":"csh-2","title":"The verbs: HTTP methods","exercises":[{"type":"multiple_choice","prompt":"You want to fetch a user's profile without changing anything. Which method?","choices":["`GET`","`POST`","`DELETE`","`PUT`"],"answer":0,"why":"`GET` reads data and shouldn't change anything on the server — it's the default 'just show me' verb. Because `GET` is *safe*, crawlers and browser prefetchers fire them freely, which is why you must never hide a state-changing action (like `/delete?id=42`) behind a `GET`. A crawler following links could wipe your data, and this has genuinely happened to real companies."},{"type":"match_pairs","prompt":"Match each method to its intent.","pairs":[{"left":"`GET`","right":"Read a resource"},{"left":"`POST`","right":"Create a new resource"},{"left":"`PUT`","right":"Replace a resource"},{"left":"`DELETE`","right":"Remove a resource"}],"why":"`GET` reads, `POST` creates, `PUT` replaces, `DELETE` removes — the method tells the server your intent. `PUT` replaces the whole resource while `PATCH` updates just part of it, and choosing precisely is what makes an API predictable."},{"type":"multi_select","prompt":"Which of these methods are expected to change state on the server? Select all.","choices":["`GET`","`POST`","`PUT`","`DELETE`"],"answer":[1,2,3],"why":"`POST`, `PUT`, and `DELETE` modify server state, while `GET` (and `HEAD`, `OPTIONS`) are *safe* — they only read. Because `GET` is safe, it's cacheable and retryable with zero risk, and that single property is why the web can cache so aggressively."},{"type":"multiple_choice","prompt":"Your `DELETE /users/42` request times out and you don't know if it worked. Is it safe to just send it again?","choices":["Yes — deleting twice leaves the same result as deleting once","No — you might delete two different users","No — `DELETE` can never be retried","Only if you switch to `GET` first"],"answer":0,"why":"`DELETE` is *idempotent*: `DELETE /users/42` twice still leaves user 42 gone, so the end state is the same and retrying is safe. Idempotent means doing it again lands you in the same state — `GET`, `PUT`, and `DELETE` qualify; `POST` doesn't. This is the backbone of reliable distributed systems, because networks fail mid-request constantly and retries are unavoidable."},{"type":"multiple_choice","prompt":"A `POST /payments` request times out. You don't know if the charge went through. Retrying blindly risks charging the customer twice. What's the fix?","choices":["Just retry — it's probably fine","Send an idempotency key so the server recognizes the retry and doesn't repeat the charge","Never retry payments, ever","Change it to a `GET` request"],"answer":1,"why":"An idempotency key is a unique id the client attaches to the request: if the server sees the same key twice, it returns the original result instead of charging again — making an unsafe `POST` safe to retry. This is exactly how Stripe works, via an `Idempotency-Key` header, and any system with money or side effects needs the pattern."},{"type":"fill_blank","prompt":"An operation is ______ if performing it many times has the same effect as performing it once.","choices":["idempotent","stateless","asynchronous","encrypted"],"answer":0,"why":"Idempotent operations are safe to retry — critical, because in a distributed system retries are not optional."}]},{"id":"csh-3","title":"Reading status codes","exercises":[{"type":"multiple_choice","prompt":"A server replies with `200`. At a glance, what does that number tell you?","choices":["The response size","The request succeeded","The user's id","The latency in ms"],"answer":1,"why":"Status codes are the server's one-glance verdict on your request: `200` = OK, it worked. The first digit is everything — `2xx` success, `3xx` redirect, `4xx` you (the client) messed up, `5xx` I (the server) messed up. Learn the classes and you can read any code you've never seen."},{"type":"match_pairs","prompt":"Match each status code to its meaning.","pairs":[{"left":"`200 OK`","right":"Success"},{"left":"`301 Moved Permanently`","right":"Redirect to a new URL"},{"left":"`404 Not Found`","right":"That resource doesn't exist"},{"left":"`500 Internal Server Error`","right":"The server broke"}],"why":"One code from each class: `2xx` worked, `3xx` go elsewhere, `4xx` your request was wrong, `5xx` the server failed. Two more you'll use constantly: `201 Created` (a `POST` made something new) and `204 No Content` (success, nothing to return — perfect for a `DELETE`)."},{"type":"multi_select","prompt":"Which of these are CLIENT errors (the caller's fault)? Select all.","choices":["`400 Bad Request`","`401 Unauthorized`","`404 Not Found`","`503 Service Unavailable`"],"answer":[0,1,2],"why":"`4xx` codes blame the request; `5xx` codes blame the server, and `503` is a server-side 'I can't handle this right now'. Don't confuse `401` and `403`: `401 Unauthorized` really means *I don't know who you are* (not authenticated), while `403 Forbidden` means *I know who you are, and you're not allowed*."},{"type":"multiple_choice","prompt":"Your service is getting hammered with more traffic than it can handle. Which status code politely tells clients to slow down?","choices":["`404 Not Found`","`429 Too Many Requests`","`200 OK`","`301 Moved Permanently`"],"answer":1,"why":"`429 Too Many Requests` is the rate-limiting signal, and well-behaved clients back off when they see it — often honouring a `Retry-After` header you send. Pair it with exponential backoff on the client (wait 1s, then 2s, then 4s), because without backoff clients retry instantly in unison and create a thundering herd that keeps the service down."},{"type":"multiple_choice","prompt":"Your app sits behind a load balancer. Users start seeing `502` and `504` errors. Where is the problem most likely?","choices":["In the users' browsers","Downstream of the load balancer — the app servers are failing or too slow","In DNS","In the users' wifi"],"answer":1,"why":"`502 Bad Gateway` means the load balancer got a broken response from the app behind it; `504 Gateway Timeout` means the app didn't respond in time. Both point downstream — the app or database, not the balancer or the client. This is why status codes are gold during an incident: `502`/`504` → look at the app tier, `503` → the service is shedding load, `500` → an unhandled crash in your code."},{"type":"multiple_choice","prompt":"A user requests `GET /orders/99999`, but no such order exists. What should the server return?","choices":["`200 OK` with an empty body","`404 Not Found`","`500 Internal Server Error`","`403 Forbidden`"],"answer":1,"why":"The resource genuinely doesn't exist and the client's request was well-formed — a textbook `404`. Returning `200` for a missing resource lies to the client and breaks caching and error handling. The honest code matters because monitoring, retries, and caches all make decisions from it: a `500` here would page an engineer for a non-bug, and a `200` would hide a real 'not found'."}]},{"id":"csh-4","title":"Stateless HTTP at scale","exercises":[{"type":"multiple_choice","prompt":"A big service runs thousands of identical web servers behind one load balancer, and each of your requests may hit a different server — yet everything works. Why is that possible?","choices":["The servers share one block of memory","HTTP is stateless, so any server can handle any request","Your requests secretly always hit the same server","The load balancer copies your data to every server"],"answer":1,"why":"Because each request carries everything needed to serve it (like an auth token), any interchangeable server can handle it — statelessness is what makes horizontal scaling possible. The moment a server stores your session in its own local memory, servers stop being interchangeable: now the load balancer must pin you to that one machine, and if it dies, your session dies with it."},{"type":"multiple_choice","prompt":"If servers remember nothing between requests, where does your logged-in session actually live?","choices":["Nowhere — you re-login every request","In the client (a cookie/token it re-sends), or in a shared store like Redis","Inside the load balancer","In DNS"],"answer":1,"why":"State moves out of the server: either the client carries it (a token sent on every request) or it lives in a shared store all servers can read — never in one server's local RAM. The two common patterns are a self-contained token (JWT) the client carries, or a session id the client carries that servers look up in a shared cache. Both keep the servers stateless and interchangeable."},{"type":"build_diagram","prompt":"Place the missing piece so any app server can serve any request without losing the user's session.","slots":["App Server 1","App Server 2","?"],"palette":["Shared Cache (Redis)","A bigger CPU","A second load balancer"],"answer":"Shared Cache (Redis)","why":"A shared store that every app server reads from keeps sessions out of local memory, so the servers stay stateless and interchangeable. This is the standard fix for 'randomly logged out' bugs: move session state to a shared cache and it stops mattering which server you land on."},{"type":"multi_select","prompt":"Opening a fresh TCP + TLS connection for every single request is expensive. Which of these reduce that cost? Select all.","choices":["Keep-alive: reuse one connection for many requests","HTTP/2 multiplexing: many requests in flight on one connection","Opening a brand-new connection for every image","HTTP/3 over QUIC: avoids TCP-level head-of-line blocking"],"answer":[0,1,3],"why":"Reusing connections (keep-alive) and multiplexing (HTTP/2, HTTP/3) amortize the handshake cost across many requests; opening a fresh connection each time is the problem, not a fix. HTTP/1.1 could only handle one request at a time per connection — a slow response blocked everything behind it (head-of-line blocking). HTTP/2 multiplexes many over one connection, and HTTP/3 moves to QUIC over UDP to fix blocking that still happened at the TCP layer."},{"type":"multiple_choice","prompt":"Your API serves a user avatar that rarely changes. How do you avoid re-sending the same bytes on every request?","choices":["You can't — you must resend it each time","Use `Cache-Control` + an `ETag`: the client asks 'still current?' and the server can reply `304 Not Modified` with no body","Make the image smaller each time","Serve it over `POST`"],"answer":1,"why":"With an `ETag` (a fingerprint of the content), the client sends 'I have version X — changed?' and the server can answer `304 Not Modified` with an empty body, so the same bytes are never re-sent. Those `304` responses are a huge part of why repeat page loads feel instant — the browser revalidates cheaply and skips the download entirely."},{"type":"tradeoff_slider","prompt":"Auth for a high-security banking app. Self-contained JWTs let any server validate locally (great for scale) but are hard to revoke before they expire. Redis-backed sessions are instantly revocable but every request hits the store. Slide toward your default here.","leftLabel":"JWT (scales, hard to revoke)","rightLabel":"Redis sessions (revocable, central)","answerRange":[55,100],"why":"For high-security, instant revocation usually wins — if a token is stolen you must be able to kill it NOW, and a central session store gives you that at the cost of a lookup per request. Many real systems combine both: short-lived JWTs (minutes) plus a revocation check, getting most of JWT's scale while limiting how long a stolen token stays valid."},{"type":"multiple_choice","prompt":"Users randomly get logged out, but only during high traffic. The setup: app servers store sessions in their own local memory, behind a round-robin load balancer. What's happening, and what's the fix?","choices":["DNS is misconfigured — flush the cache","Round-robin sends you to servers that don't have your in-memory session → move sessions to a shared store so servers are stateless","The database ran out of disk — add storage","The users' tokens expired — shorten the timeout"],"answer":1,"why":"Under load the balancer spreads you across many servers, and whenever you land on one that doesn't hold your in-memory session you appear logged out — making the servers stateless fixes it permanently. The band-aid is sticky sessions (pin each user to one server), but that undermines load balancing and fails when a server dies. Stateless servers plus a shared session store is the scalable cure, and it's why stateless HTTP is what lets systems grow."}]}]};

const UNIT3 = {"unitId":"apis","title":"APIs","lessons":[{"id":"api-1","title":"The contract","exercises":[{"type":"multiple_choice","prompt":"Your weather app shows tomorrow's forecast. It doesn't own any weather satellites. How does it get the data?","choices":["It guesses from your location","It calls someone else's API and asks for it","The data ships inside the app","It reads the weather company's database directly"],"answer":1,"why":"An API (Application Programming Interface) is a defined way for one program to ask another for data or actions — the weather app asks, a weather service answers. You use dozens of APIs a day without noticing: every app showing a map, taking a payment, or offering 'Sign in with Google' is calling someone else's API behind the scenes."},{"type":"fill_blank","prompt":"An API is essentially a ______ between two programs: ask me this way, and I'll answer that way.","choices":["contract","database","cable","password"],"answer":0,"why":"An API is a contract: it defines what you can ask, how to ask it, and what you'll get back. The contract IS the product — the moment other people build on it, changing it breaks them, which is why API design decisions haunt you for years."},{"type":"multiple_choice","prompt":"Why doesn't the weather company just let your app read their database directly?","choices":["Direct database access would be faster and better","An API hides their internals, enforces rules, and lets them change their database without breaking you","Databases physically can't be read by other programs","There's no real reason — it's just tradition"],"answer":1,"why":"The API is a boundary: it exposes what you may do and hides how it's done, and that freedom to change internals without breaking callers is the entire point. It's encapsulation at system scale — if clients touched the database directly, the provider could never change their schema, add authentication, or throttle abuse. The API is both the contract and the control point where you enforce auth, limits, and validation."},{"type":"match_pairs","prompt":"Match each piece of an API to its job.","pairs":[{"left":"Endpoint","right":"A specific address you can call"},{"left":"JSON","right":"How the data is formatted"},{"left":"API key","right":"Proves who is calling"},{"left":"Documentation","right":"The contract, written down"}],"why":"An endpoint is where you ask, JSON is the shape of the answer, the key says who you are, and the docs are the contract made readable. Undocumented APIs get used wrong and then can never be changed, because nobody knows who depends on what — docs aren't a nicety, they're how the contract stays enforceable."},{"type":"order_steps","prompt":"Order what happens in one API call.","steps":["App calls `GET /v1/weather?city=Pune`","Server checks the API key and validates the request","Server fetches the data it needs","Server returns JSON","App renders the forecast"],"why":"Ask at an endpoint → get authenticated and validated → the work happens → JSON comes back → the screen updates. Notice auth and validation happen *before* any real work: rejecting a bad or unauthorized request cheaply, before it touches your database, is a load-shedding tactic you'll reuse constantly."},{"type":"multiple_choice","prompt":"Why did JSON become the default format for web APIs, beating XML?","choices":["It's a compact binary format","It's human-readable and maps directly onto data structures most languages already have","It's encrypted by default","It's much older and more established"],"answer":1,"why":"JSON is readable by humans and parses straight into objects, dicts, or maps in nearly every language — low friction beat XML's ceremony. But JSON is text, so it's easy rather than efficient: high-performance internal APIs often use binary formats like Protocol Buffers, which are far smaller and faster to parse at the cost of being unreadable to humans."}]},{"id":"api-2","title":"REST: designing around resources","exercises":[{"type":"multiple_choice","prompt":"Which URL is the better-designed way to fetch user 42?","choices":["`/getUser?id=42`","`/users/42`","`/api/doGetUserData/42`","`/user/get/42`"],"answer":1,"why":"REST models nouns (resources), not verbs — the HTTP method already says what you're doing, so `GET /users/42` reads it and putting 'get' in the URL duplicates what `GET` already told us. The rule of thumb: URLs are nouns, methods are verbs. If your URL contains a verb, you're probably reinventing HTTP."},{"type":"match_pairs","prompt":"Match each request to what it should do.","pairs":[{"left":"`GET /users`","right":"List users"},{"left":"`POST /users`","right":"Create a user"},{"left":"`GET /users/42`","right":"Fetch one user"},{"left":"`DELETE /users/42`","right":"Delete that user"}],"why":"One resource, four operations, separated purely by the HTTP method — that's REST in a nutshell. It's why REST scales as a mental model: a small fixed set of verbs applied to unlimited nouns, so learn the pattern once and you can guess any well-designed REST API."},{"type":"multiple_choice","prompt":"You want to list the orders belonging to user 42. Which is the RESTful design?","choices":["`/getOrdersForUser?user=42`","`/users/42/orders`","`/orders/user/42/list`","`/fetchOrders?u=42`"],"answer":1,"why":"Nesting expresses the relationship — the orders that belong to user 42 — and it reads like the data model. But don't over-nest: `/users/42/orders/7/items/3/reviews` is a maintenance nightmare that couples your URLs to a rigid hierarchy. Two levels is a good ceiling; past that, expose the resource at its own top-level path and link by id."},{"type":"multi_select","prompt":"Which of these are good REST practices? Select all.","choices":["Use plural nouns for collections (`/users`)","Put the action verb in the URL (`/createUser`)","Use HTTP methods to express the action","Return accurate HTTP status codes"],"answer":[0,2,3],"why":"Plural nouns, methods-as-verbs, and honest status codes are the core conventions; verbs in URLs are the anti-pattern because they duplicate the method. Conventions matter more than cleverness here — a predictable API is one a stranger can guess without reading docs, and guessability is a real feature."},{"type":"multiple_choice","prompt":"REST APIs are stateless. What does that demand of every single request?","choices":["Nothing in particular","Each request must carry everything needed to serve it — the server remembers nothing from prior calls","Every request must be a `GET`","Requests must stay under 1KB"],"answer":1,"why":"Statelessness means each request stands alone: it carries its own auth and parameters, and the server holds no memory of your last call. It's the same property from unit 2, and it's why you can drop a REST API behind a load balancer with 500 interchangeable servers — statelessness isn't a REST nicety, it's what makes REST scale."},{"type":"fill_blank","prompt":"In REST, URLs name ______, and HTTP methods express the action.","choices":["resources","functions","servers","errors"],"answer":0,"why":"Resources (nouns) live at URLs; methods (verbs) act on them. Separating the two is the whole design."}]},{"id":"api-3","title":"Pagination, versioning, and errors","exercises":[{"type":"multiple_choice","prompt":"`GET /users` tries to return all 50 million users in one response. What breaks?","choices":["Nothing — it's just a big response","Almost everything: a huge payload, a brutal database query, timeouts, and memory blowups on both ends","Only the client's screen","Only DNS"],"answer":1,"why":"Unbounded collections are a production landmine — the query is slow, the payload enormous, the request times out, and both server and client can run out of memory. This is a classic incident shape: the endpoint was fine with 100 rows in dev and fell over at 10M in production. Rule: never expose an endpoint whose response size grows with your data."},{"type":"multiple_choice","prompt":"So how do you return a large list safely?","choices":["Return it all but compress it","Paginate: return a bounded page plus a way to ask for the next one","Ask clients to be patient","Only allow admins to call it"],"answer":1,"why":"Pagination bounds the work per request: a fixed-size page plus a pointer to get the next one, so cost per call stays predictable no matter how big the dataset grows. Always enforce a maximum page size on the server — if a client can send `?limit=1000000`, you haven't actually bounded anything, you've just asked nicely."},{"type":"multiple_choice","prompt":"Your feed paginates with `?offset=1000000&limit=20`. Two real problems appear at scale. Which describes them?","choices":["Offset pagination is always faster but uses more memory","Deep offsets get slow (the database must walk past every skipped row), and new inserts shift rows so users see duplicates or miss items","Offsets break encryption","There are no problems — offset is the standard"],"answer":1,"why":"`OFFSET` isn't free: to skip 1,000,000 rows the database generally has to traverse them, so deep pages get progressively slower — and if rows are inserted while you're paging, everything shifts and you re-see items or skip them entirely. The fix is cursor (keyset) pagination: instead of 'skip a million', you say 'give me 20 items after `id=X`'. The database jumps straight there using an index, so page 50,000 costs the same as page 1 — which is why every large feed hands you an opaque cursor instead of a page number."},{"type":"multiple_choice","prompt":"You need to change what a field means in your public API. Third-party apps depend on it. What do you do?","choices":["Change it — clients will adapt","Version the API (`/v2`) or add a new field, while keeping the old behavior working","Delete the endpoint and start over","Change it, but email everyone first"],"answer":1,"why":"Once strangers depend on your contract, mutating it breaks their software with no warning — so you add alongside (a new field or version) and migrate people over time. The governing rule: you can add, you can't take away. Additive changes are safe because old clients ignore what they don't know about, and that asymmetry drives almost every real API evolution strategy."},{"type":"multi_select","prompt":"Which of these changes would BREAK existing clients? Select all.","choices":["Adding a new optional field to the response","Removing a field","Renaming a field","Changing a field's type from string to number"],"answer":[1,2,3],"why":"Adding an optional field is safe — old clients simply ignore it — while removing, renaming, or retyping breaks anyone parsing it, instantly and silently. This is why the *expand, migrate, contract* pattern exists: first ADD the new field, then move clients over, and only remove the old one much later once nobody reads it. The contract step is the one teams forget to ever finish."},{"type":"multiple_choice","prompt":"Your API returns `200 OK`, with `{\"error\": \"user not found\"}` in the body. Why is that a bad idea?","choices":["It isn't — the error is right there in the body","It lies: caches, monitoring, retries, and client error handling all key off the status code, so a `200` hides the failure","JSON can't represent errors","It's slower to parse"],"answer":1,"why":"The status code is the machine-readable verdict: saying `200` means success, so caches may store it, dashboards show healthy, and clients take the success path — while the request actually failed. Do both: return the honest status (`404`) AND a consistent error body like `{code, message}`. Consistency matters as much as correctness, because if every endpoint shapes errors differently, clients must write custom handling for each one."}]},{"id":"api-4","title":"APIs at scale","exercises":[{"type":"multiple_choice","prompt":"A mobile screen shows 20 posts, each with its author's name. The app calls `GET /posts`, then `GET /users/{id}` for each post. How many requests is that?","choices":["1","2","21","20"],"answer":2,"why":"One request for the list, plus one per post = 21. This is the N+1 problem, and on a mobile network with ~100ms round trips it's over two seconds of pure waiting before anything renders. Chattiness is the number one killer of mobile API performance, and the fix is to let the server do the joining and return posts *with* their authors in one response."},{"type":"multiple_choice","prompt":"Your `/users` endpoint returns a 40-field object, but the mobile list screen only needs name and avatar. What's the problem called?","choices":["Under-fetching","Over-fetching — you're burning bandwidth and battery shipping fields nobody uses","Caching","Sharding"],"answer":1,"why":"Over-fetching means the response carries far more than the caller needs — on mobile that's wasted bandwidth, slower parsing, and real battery cost. REST endpoints have fixed shapes, so the same endpoint is simultaneously too big for one screen and too small for another (forcing extra calls — under-fetching). That exact tension is precisely why GraphQL was invented."},{"type":"match_pairs","prompt":"Match each API style to what it's best at.","pairs":[{"left":"REST","right":"Simple, cacheable, fixed response shapes"},{"left":"GraphQL","right":"Client asks for exactly the fields it needs"},{"left":"gRPC","right":"Fast binary protocol for service-to-service calls"}],"why":"REST is the simple, cacheable default; GraphQL solves over/under-fetching by letting clients specify the shape; gRPC trades human-readability for speed between your own services. None is 'best' — they're answers to different questions: REST for public APIs, GraphQL when different clients need wildly different slices of data, gRPC for internal hops where nobody's reading the payload and latency is the whole game."},{"type":"tradeoff_slider","prompt":"You're designing a PUBLIC API for third-party developers you've never met. Slide toward the style you'd default to.","leftLabel":"REST (simple, cacheable)","rightLabel":"GraphQL (flexible queries)","answerRange":[0,40],"why":"For a public API consumed by strangers, REST usually wins: trivial to learn, works with HTTP caching and CDNs, and easy to rate-limit per endpoint. GraphQL's flexibility becomes a liability — arbitrary nested queries are hard to cache, hard to rate-limit, and easy to weaponize into an expensive query. GitHub famously offers both, and the split is instructive: GraphQL shines for FIRST-party clients you control, where flexibility pays for itself."},{"type":"multi_select","prompt":"Your public API has to survive third-party developers. Which of these protect you? Select all.","choices":["Rate limiting per client","Pagination on every collection","Versioning the contract","Letting clients request unlimited nested data"],"answer":[0,1,2],"why":"Limits, bounded pages, and a versioned contract are your seatbelts; unlimited nested queries are the opposite — they hand callers a way to make you do unbounded work. An API is a promise made to strangers, and every unbounded thing you expose will eventually be abused, usually by accident via someone's runaway retry loop long before any malice shows up."},{"type":"build_diagram","prompt":"Your mobile app makes 21 chatty calls per screen. Add the piece that lets it make ONE call and get a tailored response.","slots":["Mobile App","?","[ Posts svc, Users svc ]"],"palette":["API Gateway / BFF","Another database","A second mobile app"],"answer":"API Gateway / BFF","why":"A gateway (or Backend-for-Frontend) sits in front, makes the many internal calls server-side, and returns one response shaped for that screen — turning 21 phone round trips into 1. The internal calls still happen, but over a fast datacenter network instead of a phone's 100ms hops. That's the BFF pattern: a thin server-side layer shaped for one specific client, giving you GraphQL-like tailoring while keeping plain REST services underneath."},{"type":"multiple_choice","prompt":"Your public REST API is slow for mobile and partners complain payloads are huge — but you cannot break the thousands of existing integrations. What's the best move?","choices":["Change the response shape to be leaner — clients will adapt","Add a new tailored endpoint (new version, or a BFF for mobile) while leaving the existing contract untouched","Remove the unused fields to slim it down","Migrate every client to GraphQL immediately"],"answer":1,"why":"You can't mutate a contract that strangers depend on — slimming fields or reshaping responses is a breaking change no matter how much better the new shape is. You add alongside: a versioned endpoint or a BFF tailored for mobile, and migrate gradually. This is the whole unit in one decision: an API is a contract, the contract outlives your opinions about it, and evolving it without breaking anyone is the actual senior skill."}]}]};
