const UNIT22 = {"unitId":"observability","title":"Observability","subtitle":"You can't fix what you can't see — and you can't see what you didn't instrument","lessons":[{"id":"obs-1","title":"Three different questions","exercises":[{"id":"obs-1-0","type":"concept","title":"Metrics, logs and traces aren't three formats — they're three different questions","viz":{"nodes":[{"id":"c","label":"Client","col":0,"kind":"client"},{"id":"g","label":"Gateway","sub":"trace id","col":1,"kind":"gw"},{"id":"a","label":"Auth","sub":"6ms","col":2,"kind":"server"},{"id":"i","label":"Inventory","sub":"2,800ms","col":2,"kind":"server"},{"id":"p","label":"Pricing","sub":"9ms","col":2,"kind":"server"}],"edges":[{"from":"c","to":"g"},{"from":"g","to":"a"},{"from":"g","to":"i"},{"from":"g","to":"p"}]},"body":"These are not three formats of the same data. One is a number that has already been aggregated. One is a full record of a single event. One is a single id stitched through every hop of a request. Each exists because it answers a question the other two answer badly — and each shape falls straight out of its question. Read the shape backwards to the question.","note":"All three are blind to whatever you never instrumented. Which makes a green graph a weaker statement than it looks: it can only ever speak about the one thing it measures. Absence of a signal is not evidence of absence."},{"id":"obs-1-1","type":"multiple_choice","prompt":"Your service is slow. Your CPU graph looks fine. What does that actually tell you?","choices":["The service isn't slow","Only that CPU isn't the constraint — you're waiting on something you haven't instrumented, and you can't see it","The problem is the database","The metric is broken"],"answer":1,"why":"A healthy graph tells you what ISN'T wrong, which is progress and not an answer — the slowness lives in whatever you never measured, whether that's a lock, a dependency, or a queue. This is the whole premise of observability: your system is only as debuggable as your instrumentation, and unmeasured things are invisible rather than absent."},{"id":"obs-1-2","type":"match_pairs","prompt":"Match each signal to the question it answers.","pairs":[{"left":"Metrics","right":"Is something wrong, and how much?"},{"left":"Logs","right":"What exactly happened in this one case?"},{"left":"Traces","right":"Where did the time go across services?"},{"left":"All three together","right":"Alert, then investigate, then locate"}],"why":"They aren't three formats of the same thing, they're three different questions — metrics are cheap aggregates that tell you something changed, logs are expensive detail about individual events, and traces show one request's journey across services. The workflow is the point: a metric wakes you, a trace narrows it to a service, a log tells you what that service actually did."},{"id":"obs-1-3","type":"multiple_choice","prompt":"Why can't you just log everything and skip metrics?","choices":["Logs are less accurate","Logs cost roughly per event, so at high traffic the volume and bill explode — and answering 'what's my error rate?' means scanning them, while a metric already knows","Logs can't record errors","Metrics are more detailed"],"answer":1,"why":"A metric is a pre-aggregated number that costs about the same whether you serve ten requests or ten million, whereas logs scale linearly with traffic in both storage and money. So they trade off exactly opposite ways: metrics are cheap and lose the detail, logs keep everything and get expensive precisely when traffic is high — which is when you need them."},{"id":"obs-1-4","type":"multiple_choice","prompt":"A request passes through 6 microservices and takes 3 seconds. Which signal finds the slow one?","choices":["Logs from each service","A trace — one request id followed across all six, showing how long each span took","CPU metrics","The load balancer's access log"],"answer":1,"why":"Each service's own logs show it was fine, because each service WAS fine — the time is in the gaps and the waiting, which nobody sees locally. A trace stitches the request together with one id so you can look at the whole journey at once, which is the only view where 'service D waited 2.8s on service E' is visible."},{"id":"obs-1-5","type":"multiple_choice","prompt":"Why does distributed tracing require every service to cooperate?","choices":["For security","Because the trace id must be passed along in every call — one service that drops it breaks the chain, and everything downstream becomes invisible","To reduce overhead","Because traces are stored locally"],"answer":1,"why":"A trace is only a chain of spans sharing an id, so propagation is the whole mechanism — a service that receives the id and doesn't forward it silently orphans everything it calls. That's why tracing tends to be all-or-nothing infrastructure: partial adoption produces traces that end abruptly at exactly the boundary you were trying to see across."},{"id":"obs-1-6","type":"multiple_choice","prompt":"What's the actual difference between 'monitoring' and 'observability'?","choices":["They're the same thing","Monitoring answers questions you thought of in advance; observability is having enough signal to answer questions you didn't","Observability is just monitoring with more dashboards","Monitoring is for infrastructure, observability for apps"],"answer":1,"why":"A dashboard shows the failures you predicted, which are the ones you've usually already fixed — real incidents are the ones nobody anticipated, so the question is whether your data can answer something you're inventing at 3am. That's the practical test: can you ask a new question of yesterday's data without shipping code first?"}]},{"id":"obs-2","title":"What the dashboard hides","exercises":[{"id":"obs-2-0","type":"concept","title":"Nobody experiences your average","body":"Ninety-five requests at 30ms and five at 1 second average out to 78ms. Under a 100ms target the dashboard is green. But one user in twenty waited a full second — and 78ms is equally compatible with *everyone* getting 78ms, which is a completely different product. `p99`, the number 99% come in under, is 1 second here.","note":"The mean isn't lying to you, it's *averaging* — and one number cannot say whether the spread is tight or horrible. Percentiles aren't a refinement of the mean. They're the thing you wanted all along."},{"id":"obs-2-1","type":"multiple_choice","prompt":"Your dashboard shows average latency: a healthy 90ms. Users are complaining. What are you missing?","choices":["Nothing — check their connection","The average is hiding the tail: p99 could be 6 seconds and the mean would barely move","The dashboard is broken","You need more replicas"],"answer":1,"why":"Averages compress a distribution into one number and lose exactly the part that hurts — this is unit 4's lesson, now as an instrumentation failure rather than a reasoning one. Nobody experiences your average; they experience one request. A dashboard showing only means is a dashboard that structurally cannot show you an outage that affects 1% of traffic."},{"id":"obs-2-2","type":"multiple_choice","prompt":"Your service returns `200 OK` for every request, including ones where the internal work failed. What did that cost you?","choices":["Nothing — the errors are in the logs","Your error rate metric reads 0% during a real outage, so monitoring, alerting, and every retry policy all believe you're healthy","Slightly less accurate metrics","Only a logging problem"],"answer":1,"why":"Unit 3 warned that lying with status codes breaks caches and clients; here it also blinds your own instrumentation, because the error rate is computed from what you reported rather than what happened. Honest signals are load-bearing infrastructure — everything downstream, including the human deciding whether to page someone, is reasoning from numbers you generated."},{"id":"obs-2-3","type":"multi_select","prompt":"Which make an incident harder to diagnose? Select all.","choices":["Only recording averages, not percentiles","Logs without a request id to correlate them","Reporting 200 for failed operations","Recording p50, p95, and p99"],"answer":[0,1,2],"why":"Averages hide the tail, uncorrelated logs can't be assembled into a story, and dishonest status codes corrupt every derived signal. Percentiles are the fix rather than a problem — and the request id is the humblest and most valuable item on the list, because logs you can't join are a pile of sentences rather than an account of what happened."},{"id":"obs-2-4","type":"multiple_choice","prompt":"What are the four 'golden signals' worth measuring on any service?","choices":["CPU, memory, disk, network","Latency, traffic, errors, and saturation — how slow, how much, how broken, how full","Uptime, downtime, deploys, rollbacks","Requests, users, revenue, cost"],"answer":1,"why":"Those four describe the service as its users experience it, whereas CPU and memory describe the machine — and unit 4 showed a machine can look fine while queueing destroys the tail. Saturation is the one people skip and the one that predicts: it's how close you are to the cliff, which is the difference between noticing at 70% and discovering at 100%."},{"id":"obs-2-5","type":"multiple_choice","prompt":"Why is saturation the signal that warns you EARLY?","choices":["It's measured more often","Because latency and errors only degrade once you're near the limit, while saturation is rising the whole way there — it tells you you're heading for the cliff before you're on it","It's easier to alert on","It's more accurate"],"answer":1,"why":"Unit 4's queueing curve is flat and then vertical, so latency stays fine at 60% and 70% and then explodes — by the time latency tells you, you're already over. Saturation moves smoothly and gives you the warning that the outcome metrics can't, which is why 'we're at 78% of connection pool' is worth an alert and 'latency is up' is worth a page."},{"id":"obs-2-6","type":"multiple_choice","prompt":"Your metrics say the service is healthy. Users say it's broken. Who's right?","choices":["The metrics — they're objective","The users, always — if they're suffering and your graphs are green, your instrumentation is measuring the wrong thing","It depends on how many users","Neither; check the logs"],"answer":1,"why":"Metrics are a model of reality and users ARE reality, so a disagreement is a defect in the model rather than in the customers. Treat the gap as the most valuable signal you'll get all quarter: it names precisely which question your instrumentation can't answer, and closing it is worth more than any dashboard you'd have built otherwise."}]},{"id":"obs-3","title":"What it costs","exercises":[{"id":"obs-3-0","type":"concept","title":"A metric's price is the number of distinct label combinations, not the number of requests","body":"A metric is pre-aggregated, which is why it costs about the same at ten requests or ten million. But the aggregation happens per label combination, and each distinct combination is its own series — kept forever, scraped forever. So the question to ask of a new label isn't \"is this useful?\" It's \"how many distinct values can it take?\" Multiply. Then decide.","note":"And labels multiply rather than add: 5 endpoints × 4 statuses × 3 regions × 20 versions is 1,200 series from four innocent-looking dimensions. Nobody adds a cardinality explosion on purpose. They add a fourth label."},{"id":"obs-3-1","type":"multiple_choice","prompt":"You add user_id as a label on your latency metric. You have 10 million users. What just happened?","choices":["Better visibility per user","A cardinality explosion: your metric system now stores a separate time series per user, which can be orders of magnitude more expensive than the service it monitors","Nothing — labels are cheap","The metric becomes more accurate"],"answer":1,"why":"A metric's cost scales with the number of distinct label combinations, so a high-cardinality label like user_id multiplies one series into millions — teams have genuinely taken down their monitoring, or their budget, with a single well-intentioned label. The rule is that metrics want low-cardinality dimensions like endpoint or status; per-user detail belongs in logs or traces, which are built for it."},{"id":"obs-3-2","type":"multiple_choice","prompt":"So where does high-cardinality detail like user_id belong?","choices":["Nowhere — don't record it","In logs and traces, which are per-event by nature and priced accordingly — you look them up when investigating rather than aggregating them continuously","In a separate metrics system","In the database"],"answer":1,"why":"The split follows from how each is stored: metrics pre-aggregate, so every dimension multiplies the series count, while logs and traces record events you query on demand and never pay for combinations you don't ask about. That's the division of labour — metrics tell you 1% of requests are slow, traces tell you which ones, logs tell you what happened inside them."},{"id":"obs-3-3","type":"multiple_choice","prompt":"Tracing every request at high volume is too expensive. You sample 1%. What did you lose?","choices":["Nothing meaningful","The rare event — a 1-in-10,000 failure is now almost certainly not in your sample, which is precisely the request you needed","Only some latency data","The ability to alert"],"answer":1,"why":"Uniform sampling keeps a representative picture of the typical and systematically discards the exceptional, so it's optimized against the thing you actually investigate. Tail-based sampling inverts it: buffer the trace, and keep it if it was slow or errored — you keep 100% of the interesting traces and 0.1% of the boring ones, which is the same information for a fraction of the bill."},{"id":"obs-3-4","type":"multi_select","prompt":"Which are real costs of observability? Select all.","choices":["Storage and ingest bills that can rival the service's own cost","Instrumentation overhead in the request path","Engineer time maintaining dashboards and alerts nobody reads","Slower database queries"],"answer":[0,1,2],"why":"The bill, the overhead, and the maintenance are all real, and the third is the one nobody budgets for — dashboards rot, alerts accumulate, and a wall of graphs nobody trusts is worse than none because it looks like coverage. Observability doesn't slow your queries; it's an operating cost you pay for the ability to understand your own system."},{"id":"obs-3-5","type":"tradeoff_slider","prompt":"You're deciding log retention for a service handling a billion requests a day. Slide toward your policy.","leftLabel":"Log everything, keep 90 days","rightLabel":"Sample + structured events, keep 7 days hot","answerRange":[55,100],"why":"At a billion requests a day, full logs for 90 days is a bill that can exceed the service's own infrastructure, spent mostly on lines nobody will ever read. Keeping a short hot window plus retained samples and structured events covers the investigations you actually run — most incidents are debugged with data from the last few hours — while compliance data, which is a genuinely different requirement, goes to cheap cold storage."},{"id":"obs-3-6","type":"multiple_choice","prompt":"Why are structured logs worth more than free-text ones?","choices":["They're smaller","Because they're queryable: 'all errors for user 42 on checkout in the last hour' is a filter over fields, not a regex over prose","They're easier to read","They compress better"],"answer":1,"why":"A log line's value is realized when you search it under pressure, and free text forces you to write regexes against sentences that different engineers phrased differently. Structured events with consistent fields turn logs into a queryable dataset — which is what makes answering a question you didn't anticipate possible at all, and that was the definition of observability."}]},{"id":"obs-4","title":"Alerting without going mad","exercises":[{"id":"obs-4-0","type":"concept","title":"Alert on what users feel, not on what you guessed would hurt them","body":"A page is an interrupt on someone's life at 2am, so it had better be earned. The distinction that does the earning is between a *cause* and a *symptom*. A cause is a condition that might hurt someone. A symptom is someone actually being hurt. Only one of those is visible from outside your system, and only one of them is, by itself, worth waking a human for.","note":"Every false page teaches the on-call that the pager lies. Alert fatigue isn't weakness — it's the rational response to a noisy signal, and it's how the one real alert gets lost among fifty that weren't."},{"id":"obs-4-1","type":"multiple_choice","prompt":"You alert on 'CPU above 80%'. It fires at 2am. The service is serving users perfectly. What did you do wrong?","choices":["The threshold was too low","You alerted on a cause rather than a symptom — high CPU isn't a problem unless users feel it, so you woke someone for a number","You should alert at 90%","CPU shouldn't be monitored"],"answer":1,"why":"CPU is a possible cause of problems, not a problem, so alerting on it pages you for every busy-but-fine moment — and each false page teaches the on-call that alerts are noise. Alert on what users experience: latency, errors, and failed requests. If CPU is high and nobody is suffering, the correct response is genuinely nothing."},{"id":"obs-4-2","type":"multiple_choice","prompt":"What's the test for whether something deserves to page a human at 3am?","choices":["Whether it's unusual","Whether a human must act NOW to stop users being harmed — if it can wait until morning, it's a ticket, not a page","Whether it's in the runbook","Whether it happened before"],"answer":1,"why":"A page is an interrupt on someone's life, and it's only justified by urgent, actionable harm — everything else is a ticket or a dashboard. The failure mode is alerting on anything interesting: the on-call learns to ignore the pager, and the one real alert arrives among fifty that weren't. Alert fatigue isn't a personal weakness, it's what any rational human does with a noisy signal."},{"id":"obs-4-3","type":"multi_select","prompt":"Which are good pages? Select all.","choices":["Error rate above 5% for 5 minutes","p99 latency above the SLO for 10 minutes","Disk will be full in 4 hours","A single request returned 500"],"answer":[0,1,2],"why":"Sustained errors and sustained latency are users being harmed right now, and imminent disk exhaustion is urgent and actionable with a deadline — all three need a human tonight. One 500 is noise: at any real traffic level, individual errors happen constantly and they're what error-rate metrics are for. Pages need a duration, or you're paging on jitter."},{"id":"obs-4-4","type":"multiple_choice","prompt":"Why do good alerts have a duration — '5% errors for 5 minutes' rather than '5% errors'?","choices":["To reduce alerting costs","Because a momentary spike is normal and self-correcting: requiring it to persist filters out the noise that would otherwise page you constantly","Because metrics are delayed","To give the system time to fix itself"],"answer":1,"why":"Any metric sampled finely enough crosses any threshold sometimes — a deploy, a GC pause, one bad client — and paging on the instant means paging on jitter. The duration encodes what you actually meant: not 'errors touched 5%' but 'errors are STAYING at 5%', which is a real condition rather than a blip that resolved before anyone opened a laptop."},{"id":"obs-4-5","type":"multiple_choice","prompt":"One database goes down, and 40 alerts fire across 12 services. What's the problem?","choices":["Not enough alerts","Every service alerted on its own symptom, so the on-call must reconstruct one root cause from 40 messages — alerting on causes at the source would have said it once","The database needs monitoring","The alerts are too slow"],"answer":1,"why":"Forty alerts is one incident wearing forty costumes, and the human's first ten minutes go to realising that instead of fixing anything. This is the honest counterweight to 'alert on symptoms': symptoms are right for detection, and when one dependency fails everything downstream is a symptom — so you also want dependency-aware grouping, so the page says 'the database is down' rather than reading out its consequences."},{"id":"obs-4-6","type":"multiple_choice","prompt":"What's the honest summary of observability?","choices":["More dashboards and more alerts mean more reliability","It's the ability to answer questions you didn't anticipate — metrics to know something's wrong, traces to find where, logs to see what — bought with real money and real engineer time, and ruined by dishonest signals and noisy alerts","It's a monitoring tool you install","It's only needed for microservices"],"answer":1,"why":"Observability isn't a product you buy but a property you build, and the whole unit came down to two things: your system is only as visible as you instrumented it, and every signal you emit dishonestly — a 200 on a failure, an average hiding a tail — corrupts every decision made downstream of it, including yours at 3am."}]}]};

const UNIT23 = {"unitId":"design-url-shortener","title":"Design a URL Shortener","subtitle":"The hello world of system design — and it's deeper than it looks","lessons":[{"id":"urls-1","title":"Requirements and numbers","exercises":[{"id":"urls-1-0","type":"concept","title":"A design prompt is deliberately under-specified — your first move is to make it specific","viz":{"nodes":[{"id":"p","label":"'Design a URL shortener'","col":0},{"id":"r","label":"Requirements","sub":"what it does","col":1},{"id":"n","label":"Numbers","sub":"reads:writes","col":1},{"id":"d","label":"Every later decision","col":2}],"edges":[{"from":"p","to":"r"},{"from":"p","to":"n"},{"from":"r","to":"d"},{"from":"n","to":"d"}]},"body":"'Design a URL shortener' is not a spec. It's an invitation to guess, and guessing is where people lose. A shortener at 100 links a day and one at 100 million share a name and nothing else — different stores, different problems. So before you name a single technology, turn that sentence into something with numbers in it. Everything downstream follows.","note":"Estimation isn't a warm-up ritual — it's how you find out which problems are imaginary. Most of what gets over-built here is defence against a bottleneck the numbers would have ruled out in thirty seconds."},{"id":"urls-1-1","type":"multiple_choice","prompt":"'Design a URL shortener.' What's the first move?","choices":["Choose a database","Pin down requirements and scale: what must it do, how many writes, how many reads, and what's the read:write ratio","Draw the architecture","Pick a hashing algorithm"],"answer":1,"why":"Every later decision is downstream of those numbers — a shortener at 100 links a day and one at 100 million are different systems, and you can't defend a cache or a shard without knowing the shape of the load. The read:write ratio in particular decides almost everything here, which is why it's worth extracting before you name a single technology."},{"id":"urls-1-2","type":"multi_select","prompt":"Which are the core functional requirements? Select all.","choices":["Given a long URL, return a short one","Given a short URL, redirect to the long one","Links may expire","Real-time collaborative editing of links"],"answer":[0,1,2],"why":"Shorten, redirect, and optionally expire — that's the product. Collaborative editing is invented scope, and noticing what's NOT required is as valuable as listing what is: every requirement you accept has to be defended in the design, so smuggling in extras costs you real complexity for imaginary users."},{"id":"urls-1-3","type":"estimate","prompt":"100 million new links per day. Roughly how many writes per second on average?","answer":1160,"tolerance":400,"unit":"writes/sec","why":"There are ~86,400 seconds in a day, so 100M ÷ 86,400 ≈ 1,160/sec. That's a modest number — well within one well-tuned database — which is the first genuinely useful finding: the write path is not where the difficulty lives, and peaks will run several times the average, so size for maybe 3–5× this."},{"id":"urls-1-4","type":"multiple_choice","prompt":"Reads are 100× writes. So ~116,000 redirects/second. What does that ratio tell you about the design?","choices":["You need to shard immediately","It's overwhelmingly a read system — so caching and replicas carry the design, and the write path can stay simple","You need a NoSQL database","You need multiple regions"],"answer":1,"why":"A 100:1 ratio means the redirect is the product and everything else is bookkeeping, so your effort belongs in serving reads cheaply — cache, replicas, and a CDN-friendly redirect. It also means unit 7's rule applies directly: put the work where the traffic isn't, and the traffic is reads."},{"id":"urls-1-5","type":"estimate","prompt":"Each link record is roughly 500 bytes. Storing 100 million links per day for 5 years — roughly how many terabytes?","answer":91,"tolerance":30,"unit":"TB","why":"100M × 500 bytes = 50GB/day; × 365 × 5 ≈ 91TB. Big enough that one machine's disk is a real question, small enough that it isn't frightening — which is exactly the kind of finding that decides whether unit 15's sharding is on the table or premature."},{"id":"urls-1-6","type":"multiple_choice","prompt":"Your estimates say ~1,200 writes/sec and ~91TB over five years. What have you learned?","choices":["You need a massive distributed system","Writes are easy and storage is the growth problem — so the design questions are the read path and how the data is partitioned over time, not write throughput","One server is enough","You need to shard by user"],"answer":1,"why":"The arithmetic just told you which problems are real: 1,200 writes/sec doesn't justify exotic machinery, while 91TB means you'll be splitting data eventually and should choose a key that doesn't fight you. This is why estimation comes first — thirty seconds of division stopped you from designing for a bottleneck you don't have."}]},{"id":"urls-2","title":"Generating the key","exercises":[{"id":"urls-2-0","type":"concept","title":"A short code is something you hand out, not something you compute from the URL","viz":{"nodes":[{"id":"u","label":"Long URL","col":0},{"id":"h","label":"Hash it","sub":"deterministic","col":1},{"id":"c","label":"Counter","sub":"next unused","col":1},{"id":"s","label":"Short code","sub":"7 × base62","col":2}],"edges":[{"from":"u","to":"h"},{"from":"h","to":"s"},{"from":"c","to":"s"}]},"body":"Two families. Hash the long URL and keep 7 characters: the code is now a *function* of the input. Or keep a counter and hand out the next number, written in base62: the code is an *identity* you assign. Notice what the diagram is missing — no arrow from the URL to the counter. The counter never looks at what you're shortening.","note":"Collisions get all the attention, but determinism is the objection with no escape: the same URL always yields the same code, so two customers shortening one link are handed the same one — sharing it, analytics and all."},{"id":"urls-2-1","type":"multiple_choice","prompt":"Your short code is 7 characters from [a-zA-Z0-9] — 62 possibilities per character. How many links can that address?","choices":["About 62 million","62^7 ≈ 3.5 trillion","About 7 billion","About 500 million"],"answer":1,"why":"62^7 ≈ 3.5 trillion, which at 100M links/day is roughly 95 years of headroom — so 7 characters is a defensible choice you can justify with arithmetic rather than taste. That's the useful move: the length of the code is a capacity decision, and 6 characters (~57 billion) would run out in under two years at this rate."},{"id":"urls-2-2","type":"multiple_choice","prompt":"Approach A: hash the long URL (say MD5) and take the first 7 characters. What's the problem?","choices":["Hashing is too slow","Truncating a hash produces collisions — two different URLs can map to the same 7 characters, so you must detect that and handle it on every write","MD5 is insecure for this","The output isn't URL-safe"],"answer":1,"why":"Any function mapping unlimited inputs into 3.5 trillion outputs must collide eventually, and by the birthday paradox it starts happening far earlier than intuition suggests. So hashing doesn't remove the problem, it just means every insert needs a uniqueness check and a retry strategy — which is workable, and it's real complexity on the write path."},{"id":"urls-2-3","type":"multiple_choice","prompt":"Approach B: use an auto-incrementing counter and encode the number in base62. What does that buy?","choices":["Nothing over hashing","No collisions ever, by construction — each number is used once, and base62 just changes how you write it down","Shorter codes","Better security"],"answer":1,"why":"Uniqueness comes free from the counter rather than being checked for, so the write path has no collision logic at all — and base62 is purely a rendering of the same integer, not a hash. Codes also stay short early on, since link one is 'b' rather than seven random characters."},{"id":"urls-2-4","type":"multi_select","prompt":"What are the real downsides of the counter approach? Select all.","choices":["Codes are sequential, so anyone can enumerate every link ever created","It reveals roughly how many links you've made — a business metric you may not want public","A single global counter is a coordination point that must be unique across all servers","It produces collisions"],"answer":[0,1,2],"why":"Guessability is the serious one: sequential codes mean a scraper can walk your entire corpus, and 'unlisted' links stop being unlisted. It also leaks your growth rate, and the counter itself becomes something every server must agree on. What it never does is collide — that was the whole point."},{"id":"urls-2-5","type":"multiple_choice","prompt":"So how do you get a counter without every write hitting one coordination point?","choices":["Use a random number instead","Hand each server a pre-allocated range — server A gets 1–10,000, B gets 10,001–20,000 — so servers only coordinate once per block, not once per link","Use a timestamp","Let each server keep its own counter"],"answer":1,"why":"Range allocation amortizes the coordination: one agreement buys ten thousand IDs, so the shared counter is touched once per block instead of 1,200 times a second. This is a genuinely reusable trick — batch the coordination rather than eliminating it — and the cost is gaps in the sequence when a server dies holding an unused block, which nobody cares about."},{"id":"urls-2-6","type":"tradeoff_slider","prompt":"Your product promises that unlisted links can't be discovered by strangers. Slide toward your key scheme.","leftLabel":"Sequential counter (no collisions, enumerable)","rightLabel":"Random key + uniqueness check (unguessable, must retry)","answerRange":[60,100],"why":"You just promised unguessability, and a sequential code makes enumeration trivial — so the counter's elegance is disqualified by the requirement rather than by engineering. Random keys plus a unique constraint cost you a retry when you draw an occupied one: by year five you've stored ~182 billion links in a 3.5-trillion space, so about 5% of inserts collide and redraw. Cheap, but a real loop rather than a rounding error. And note why redrawing works here but not for the truncated hash: the hash of a given URL is always the same value, so a collision recurs forever unless you add a salt or counter, whereas a random key just draws again and moves on. Same collision odds, very different escape route."}]},{"id":"urls-3","title":"Serving the redirect","exercises":[{"id":"urls-3-0","type":"concept","title":"The mapping never changes, and that one fact hands you the entire read path","viz":{"nodes":[{"id":"c","label":"Clients","sub":"116k/sec","col":0,"kind":"client"},{"id":"a","label":"App server","col":1,"kind":"server"},{"id":"d","label":"Link store","sub":"every read","col":2,"kind":"db"}],"edges":[{"from":"c","to":"a"},{"from":"a","to":"d"}]},"body":"A short code points at one long URL forever. Not usually, not mostly — forever. That one property is the most consequential fact in this design, and it's worth stopping to work out exactly what it buys you before you draw anything at all. So the question was never *how* to serve 116,000 redirects a second. It's what you'd have to give up to make them cheap.","note":"Immutability was a choice, not luck: you decided a code points at one URL for life rather than letting people re-target a link later. Shorteners that sell an editable destination hand this whole chapter back."},{"id":"urls-3-1","type":"build_diagram","prompt":"116,000 redirects/sec, and the same popular links are requested constantly. Add the piece that absorbs that read load.","viz":{"nodes":[{"id":"r","label":"Redirect Service","col":0,"kind":"server"},{"id":"h","col":1,"hole":true},{"id":"d","label":"Database","sub":"source of truth","col":2,"kind":"db"}],"edges":[{"from":"r","to":"h"},{"from":"h","to":"d"}]},"palette":["Cache","Message Queue","A second load balancer"],"answer":{"h":"Cache"},"why":"Link mappings are perfect cache material: immutable once created, tiny, and massively skewed — a small number of links take most of the traffic. A cache in front of the database turns 116,000 database reads/sec into a few thousand, and the database keeps being the source of truth for everything that misses."},{"id":"urls-3-2","type":"multiple_choice","prompt":"Why are these mappings unusually good cache candidates?","choices":["They're small","They never change: a short code maps to one long URL forever, so a cached entry can't go stale — which deletes unit 5's invalidation problem entirely","They're requested rarely","They're stored as text"],"answer":1,"why":"Cache invalidation is hard because copies drift from a truth that keeps moving — and here the truth never moves, so the whole category of problem evaporates. Immutable data is the easiest thing in system design, which is worth noticing as a design lever: making data immutable, where you can, buys you caching for free."},{"id":"urls-3-3","type":"multiple_choice","prompt":"Should the redirect return 301 (permanent) or 302 (temporary)?","choices":["301 always — the mapping is permanent","It's a real tradeoff: 301 lets browsers cache the redirect so subsequent clicks never reach you at all, which is great for load and destroys your click analytics","302 always — it's safer","It doesn't matter"],"answer":1,"why":"A 301 is the best possible caching outcome and the worst possible analytics outcome, because a browser that remembers the redirect stops telling you the click happened. So the choice is decided by the product: if click counts are the business, you take 302 and eat the traffic; if they're decoration, 301 makes most of your load disappear."},{"id":"urls-3-4","type":"multiple_choice","prompt":"Your cache holds the hot links. A brand-new viral link is created and instantly gets 50,000 requests/second. What happens?","choices":["The cache serves it","The first requests all miss simultaneously and stampede the database for the same key — a thundering herd on one row","The database rejects them","The link is rate limited"],"answer":1,"why":"A cold key under sudden load means thousands of concurrent misses each dutifully going to the database for the identical value, which is unit 14's stampede at the row level. The fix is request coalescing: let one miss fetch while the rest wait for its result, so each server makes one query instead of thousands. Be precise about what that buys, though — coalescing is per-process, so the database sees one query per SERVER rather than one overall, and a fleet serving 116,000 rps is many servers. Getting to a single fetch needs a shared lease, or a shielding tier in front of the store — exactly the move unit 14 makes with origin shielding when 300 edges each coalesce and the origin still sees 300."},{"id":"urls-3-5","type":"multiple_choice","prompt":"Which database fits this workload?","choices":["It must be relational for the transactions","Almost anything: the access pattern is a key-value lookup by short code, so a KV store fits perfectly — and it's the access pattern, not fashion, that says so","It must be NoSQL for the scale","A graph database"],"answer":1,"why":"The system does exactly one read: give me the long URL for this code. That's a hashmap, which is unit 7's cleanest case — no joins, no transactions, no ad-hoc queries. Postgres would serve this happily too; what makes the KV store defensible is that the workload genuinely has one access pattern, and that's the honest reasoning rather than 'NoSQL scales'."},{"id":"urls-3-6","type":"multiple_choice","prompt":"How would you shard 91TB of links?","choices":["By creation date","By hash of the short code — it's the only thing every read has, and hashing spreads the hot codes across shards","By long URL","By user id"],"answer":1,"why":"Unit 15's rule is to shard by what your hot query filters on, and every redirect arrives knowing exactly one thing: the short code. Sharding by date would send all of today's traffic to today's shard — the sequential-key hotspot — and sharding by user would mean the redirect, which has no user, can't find its row without a scan."}]},{"id":"urls-4","title":"The edges","exercises":[{"id":"urls-4-0","type":"concept","title":"You only built one map, and every feature you add later lands in it","viz":{"nodes":[{"id":"g","label":"Generator","sub":"next base62","col":0},{"id":"a","label":"Custom alias","sub":"user-chosen","col":0},{"id":"m","label":"One namespace","sub":"code → URL","col":1,"kind":"db"}],"edges":[{"from":"g","to":"m"},{"from":"a","to":"m"}]},"body":"A custom alias isn't a separate feature with its own storage. It's a row in the same map as every generated code — a key somebody chose rather than drew. So two parties now write into one namespace with no idea the other exists: your generator, minting codes at 1,200 a second, and your users, picking words they like. Work out what that costs you.","note":"Your own product lives in that namespace too: `/about`, `/pricing`, `/api`. A generator that emits one of those doesn't collide with a customer — it collides with your website. That's what reserved prefixes are for."},{"id":"urls-4-1","type":"multiple_choice","prompt":"A user wants the custom alias `/launch`. How does that interact with your generated keys?","choices":["Keep them in separate systems","They share one namespace, so a custom alias can collide with a generated one — you need a uniqueness constraint over both, and generated keys ideally shouldn't land on nice words","Custom aliases can't be supported","Generate the custom alias by hashing it"],"answer":1,"why":"Both are just keys in the same map, so `/launch` is only free if nothing generated it first — and a unique constraint in the database is the only enforcement that can't be raced (unit 6). Real systems often generate from a reduced alphabet or reserve a prefix space, so generated codes and human-chosen words rarely compete for the same string."},{"id":"urls-4-2","type":"multiple_choice","prompt":"Links can expire. How do you delete 100 million expired links a day?","choices":["A nightly DELETE query across the table","Don't delete on read paths — either let the store expire them by TTL, or sweep in small batches, because one enormous DELETE will lock and lag everything","Delete them as they're requested","Never delete them"],"answer":1,"why":"A single mass DELETE is a long-running transaction touching millions of rows, which is unit 9's advice violated at scale — it holds locks, bloats storage, and lags your replicas exactly when it runs. A TTL that the store enforces, or small idempotent batches, keeps the work bounded and interruptible, which is what makes it safe to run on a live system."},{"id":"urls-4-3","type":"multiple_choice","prompt":"You want click analytics, but writing a row per click means 116,000 writes/sec — 100× your link writes. What do you do?","choices":["Write each click synchronously","Fire the click onto a queue and aggregate asynchronously — the redirect must not wait for analytics, and approximate counts are fine","Skip analytics","Store clicks in the cache"],"answer":1,"why":"Analytics would be the single largest write load in the system, and it's the least important data — so it must never sit on the redirect's critical path (unit 16). Queue the event, batch the aggregation, and accept that a few lost clicks change no decision anyone will ever make, which is exactly the durability tradeoff unit 6 described."},{"id":"urls-4-4","type":"multi_select","prompt":"Which parts of this system genuinely need strong consistency? Select all.","choices":["The uniqueness of a short code","The click counter","The mapping visible immediately after creation, to the creator","Analytics dashboards"],"answer":[0,2],"why":"Uniqueness is non-negotiable — two long URLs behind one code is corruption you can't undo — and the creator seeing their own new link immediately is unit 19's read-your-writes, which is what they'd notice. The counter and the dashboards can be seconds or minutes stale and nobody is harmed, so paying for coordination there buys a guarantee nobody would miss."},{"id":"urls-4-5","type":"multiple_choice","prompt":"Someone shortens a malicious URL and it spreads. What have you built without meaning to?","choices":["Nothing — you just store strings","An anonymizer: your trusted domain now launders links whose destination nobody can see before clicking","A caching problem","A rate limiting problem"],"answer":1,"why":"The product's core feature — hiding the destination behind your domain — is exactly what makes it useful for phishing, so abuse isn't a bolt-on concern but a direct consequence of the design. That's why real shorteners check destinations against blocklists, rate limit creation, and offer a preview: the mitigation belongs in the design, because the vulnerability came from the requirements."},{"id":"urls-4-6","type":"multiple_choice","prompt":"Summarize the design in one line.","choices":["A distributed database with complex sharding","A key-value lookup that's overwhelmingly read-heavy and immutable — so the design is a cache in front of a KV store, and the interesting decisions are key generation, analytics, and abuse","A microservices architecture with a message bus","A relational database with heavy indexing"],"answer":1,"why":"The arithmetic said writes were easy and reads were everything, and immutability said caching is free — so the core is genuinely simple, and pretending otherwise is how people over-engineer this in interviews. All the real difficulty sits at the edges: how you mint keys, how you count clicks without drowning, and what happens when people misuse it."}]}]};

const UNIT24 = {"unitId":"design-news-feed","title":"Design a News Feed","subtitle":"Fan-out on write vs read — and why the answer is both","lessons":[{"id":"feed-1","title":"The shape of the problem","exercises":[{"id":"feed-1-0","type":"concept","title":"No two people have the same feed, so there is no one answer to cache","viz":{"nodes":[{"id":"c","label":"You refresh","col":0,"kind":"client"},{"id":"s","label":"Feed service","sub":"sort + page","col":1,"kind":"server"},{"id":"d","label":"Posts by everyone you follow","sub":"×500 authors","col":2,"kind":"db"}],"edges":[{"from":"c","to":"s"},{"from":"s","to":"d"}]},"body":"The shortener worked because one cached answer served everybody. A feed has no shared answer: 300 million users, 300 million different lists, and each person refreshes far more often than they post. Sit with what that does to your toolkit — it quietly kills the playbook that rescued every system so far. One lever is left: *when* you build the list.","note":"There are only two possible answers, and the lever tells you why — a list can be built at exactly two moments. This unit is the argument between them. Worth guessing now which wins, because the honest answer is neither."},{"id":"feed-1-1","type":"multiple_choice","prompt":"'Design a news feed.' What's the defining characteristic of this workload?","choices":["Writes are enormous","It's brutally read-heavy and personalized: everyone's feed is different, and people refresh far more than they post","It needs strong consistency","It's a graph problem"],"answer":1,"why":"Two facts drive the entire design: reads massively outnumber writes, and every read is unique to one person — so you can't just cache 'the feed' the way you'd cache a homepage. Personalization is what makes this harder than the URL shortener, where one cached answer served everybody."},{"id":"feed-1-2","type":"estimate","prompt":"300 million daily users each open the feed about 10 times a day. Roughly how many feed reads per second on average?","answer":34700,"tolerance":12000,"unit":"reads/sec","why":"300M × 10 = 3 billion reads/day ÷ 86,400 ≈ 34,700/sec on average, and peaks will run several times that. That's the number that disqualifies the naive design: whatever a feed read costs, you're paying it tens of thousands of times a second, so it must be close to a single cheap lookup."},{"id":"feed-1-3","type":"multiple_choice","prompt":"The obvious approach: when a user opens the feed, query for all posts by everyone they follow, sorted by time. Why won't that survive?","choices":["It returns the wrong posts","You'd run a huge multi-follow query, sort it, and paginate it — tens of thousands of times a second, and the cost scales with how many people each user follows","The database can't sort","It's not personalized enough"],"answer":1,"why":"The query is correct and impossibly expensive: a user following 500 accounts makes the database gather and sort across 500 sources for every refresh. Multiply by 34,700/sec and no amount of indexing saves you — the work per read is the problem, not the speed of any one step."},{"id":"feed-1-4","type":"fill_blank","prompt":"Building each feed at read time is called fan-out on ______.","choices":["read","write","demand","query"],"answer":0,"why":"You fan out across everyone the user follows at the moment they ask — the work happens when the read arrives, which is exactly when you have the least time to spend."},{"id":"feed-1-5","type":"multiple_choice","prompt":"Given the 100:1-ish read:write ratio, what does unit 7's rule tell you to do?","choices":["Optimize the read query harder","Put the work where the traffic isn't — do it at write time, so a read becomes one cheap lookup","Add read replicas","Cache the query results"],"answer":1,"why":"When reads outnumber writes 100:1, doing work once per post beats doing it 100 times per post — that's the whole logic of precomputation. So the move is to build feeds when someone posts rather than when someone looks, converting an expensive read into an expensive-but-rare write."},{"id":"feed-1-6","type":"multiple_choice","prompt":"So what does 'fan-out on write' actually do?","choices":["It writes the post to a queue","When you post, it immediately inserts that post's id into the precomputed feed list of every one of your followers","It replicates the post to every server","It caches the post"],"answer":1,"why":"The feed is materialized in advance: each user has a ready-made list, and posting means pushing your post id into everyone else's list. A read then becomes 'fetch my list', which is a single lookup — precisely the cheap read you need at 34,700/sec."}]},{"id":"feed-2","title":"Fan-out on write","exercises":[{"id":"feed-2-0","type":"concept","title":"Fan-out on write makes a post cost whatever the author's follower count happens to be","viz":{"nodes":[{"id":"a","label":"Author posts","col":0,"kind":"client"},{"id":"s","label":"Post service","col":1,"kind":"server"},{"id":"p","label":"Posts table","sub":"stored once","col":2,"kind":"db"},{"id":"q","label":"Fan-out queue","col":2,"kind":"queue"},{"id":"f","label":"Feed lists ×200","sub":"post id only","col":3,"kind":"cache"}],"edges":[{"from":"a","to":"s"},{"from":"s","to":"p"},{"from":"s","to":"q"},{"from":"q","to":"f"}]},"body":"Posting stops being one write. The post is stored once, then its *id* is appended to the ready-made feed list of every follower — 200 followers, 200 appends. A read collapses to 'fetch my list': one lookup. You bought that with a write whose size is somebody else's follower count, and nobody chose that number.","note":"The queue isn't decoration. Ask who is actually waiting on those 200 appends. Not the followers — they aren't looking yet. And work nobody is waiting on has no business sitting on the critical path of someone who is."},{"id":"feed-2-1","type":"order_steps","prompt":"Order what happens when a user with 200 followers posts, using fan-out on write.","steps":["User submits the post","Post is stored once, in the posts table","Server responds — the user's post is live","A worker looks up the author's 200 followers","The post id is appended to each of those 200 feed lists"],"why":"The post is stored once and referenced 200 times, and the response goes out before the fan-out finishes — the user isn't waiting on 200 list writes. That's unit 16 doing its job: the fan-out is real work that nobody is watching, so it belongs behind a queue."},{"id":"feed-2-2","type":"multiple_choice","prompt":"Why store the post ONCE and push only its id into follower feeds, rather than copying the post itself?","choices":["Ids are faster to sort","Copying the post 200 times means 200 places to update when it's edited or deleted — the id keeps one source of truth and makes the feed a list of pointers","It saves nothing","Ids compress better"],"answer":1,"why":"This is unit 5's source-of-truth discipline applied under pressure: the feed lists are derived, rebuildable pointers, while the post itself has exactly one home. Denormalizing the post body into every feed would buy one fewer lookup and cost you the edit-and-delete problem across millions of copies."},{"id":"feed-2-3","type":"multiple_choice","prompt":"A user with 200 million followers posts. What does fan-out on write do?","choices":["Handles it the same way","Attempts 200 million list writes for one post — a single action becomes hours of work and a massive write storm","Rejects the post","Fans out only to active followers"],"answer":1,"why":"The cost of a post is proportional to the author's follower count, so the model that made ordinary posting cheap makes celebrity posting catastrophic — one tap generating 200 million writes. This is unit 15's celebrity problem in its most famous form, and it's exactly where fan-out on write breaks."},{"id":"feed-2-4","type":"multiple_choice","prompt":"Beyond the write storm, what's the second-order damage from a celebrity fan-out?","choices":["Nothing else","It's not instant — followers at the end of the queue see the post minutes after followers at the front, so the feed becomes visibly unfair","The post is duplicated","The database runs out of space"],"answer":1,"why":"Fan-out takes as long as it takes, so 'who sees it first' is decided by queue position rather than anything meaningful — and for a live event, minutes of skew is a product failure people notice and complain about. The write storm is the technical problem; the skew is the one users feel."},{"id":"feed-2-5","type":"multi_select","prompt":"What does fan-out on write cost you? Select all.","choices":["Write amplification proportional to follower count","Storage for every user's materialized feed list","Wasted work for inactive users who never read their feed","Slow feed reads"],"answer":[0,1,2],"why":"You pay in amplified writes, in storage for millions of lists, and in work done for accounts that haven't logged in for a year. Reads are the one thing that got FASTER — that was the entire trade, and it's unit 7's exchange rate: cheap reads bought with expensive writes."},{"id":"feed-2-6","type":"multiple_choice","prompt":"How do you stop fanning out to users who never read their feed?","choices":["Delete inactive accounts","Only fan out to recently-active users, and build the feed on demand for anyone who returns after a long absence","Fan out more slowly","You can't"],"answer":1,"why":"Most of a large platform's registered users aren't active, so most fan-out work is materializing feeds nobody will ever open — skipping them removes a huge fraction of the write load for free. The returning user pays a one-off expensive read, which is a fine trade because they're rare and they've just spent time away anyway."}]},{"id":"feed-3","title":"The hybrid","exercises":[{"id":"feed-3-0","type":"concept","title":"The two models fail at opposite ends, so production runs both at once","viz":{"nodes":[{"id":"u","label":"You open the feed","col":0,"kind":"client"},{"id":"s","label":"Feed service","sub":"merge + rank","col":1,"kind":"server"},{"id":"l","label":"Your feed list","sub":"precomputed","col":2,"kind":"cache"},{"id":"c","label":"Posts by celebrities you follow","sub":"queried live","col":2,"kind":"db"}],"edges":[{"from":"u","to":"s"},{"from":"s","to":"l"},{"from":"s","to":"c"}]},"body":"Fan-out on write dies on huge follower counts. Fan-out on read dies on ordinary read volume. Now notice *where* each one dies — not the same place, not even close, and neither failure reaches into the other's healthy range. Two tools, each excellent exactly where the other is hopeless. There's an obvious move here, and refusing to pick is most of it.","note":"And it only works because of an accident of the follower distribution: accounts big enough to break fan-out are rare enough that you follow a handful, not five hundred. Change that fact and the hybrid stops being cheap."},{"id":"feed-3-1","type":"multiple_choice","prompt":"Fan-out on write breaks for celebrities. Fan-out on read breaks for everyone. What's the actual answer?","choices":["Pick the lesser evil","Both: fan out on write for ordinary accounts, and fan out on read for the handful of celebrities — merging the two at read time","Fan-out on read with a bigger cache","Shard the feed"],"answer":1,"why":"The two approaches fail at opposite ends — write fan-out dies on huge follower counts, read fan-out dies on ordinary read volume — so you route each account to the model that suits it. A user's feed becomes their precomputed list merged with a live query for the few celebrities they follow, which is cheap because that number is small."},{"id":"feed-3-2","type":"order_steps","prompt":"Order how a hybrid feed read assembles.","steps":["Fetch the user's precomputed feed list","Fetch recent posts from the few celebrities they follow","Merge the two sets","Rank the merged set","Return one page of results"],"why":"One cheap lookup plus a small live query, merged and ranked — the live part stays affordable because almost nobody follows more than a handful of accounts big enough to be excluded from fan-out. The threshold is a tuning knob: too low and you do too many live queries, too high and you're back to write storms."},{"id":"feed-3-3","type":"multiple_choice","prompt":"Where do you set the celebrity threshold — the follower count above which you stop fanning out?","choices":["Exactly 1 million","Wherever the fan-out cost stops being worth it, judged from your own distribution — it's an operational number you tune, not a constant","It should be dynamic per post","There shouldn't be a threshold"],"answer":1,"why":"The right value depends on your follower distribution, write capacity, and how much read-time merging you'll tolerate — so it's a dial you set from measurements rather than a number anyone can hand you. What matters in a design discussion is knowing that the threshold exists and what it trades: write amplification against read-time work."},{"id":"feed-3-4","type":"multiple_choice","prompt":"Where should each user's precomputed feed list actually live?","choices":["In the main database","In a fast store like Redis, capped at a few hundred entries — it's derived data, rebuildable from posts and follows, so it doesn't need the durability of the source of truth","In the CDN","In each app server's memory"],"answer":1,"why":"The list is exactly unit 5's derived state: lose it and you can rebuild it, so it belongs somewhere fast rather than somewhere durable. Capping it matters too — nobody scrolls to post 5,000, so storing an unbounded list per user is paying to materialize something nobody reads."},{"id":"feed-3-5","type":"multiple_choice","prompt":"Your feed lists are in Redis. Redis restarts and loses everything. How bad?","choices":["Catastrophic — the feeds are gone","Recoverable but painful: feeds rebuild from posts and follows, so nothing is truly lost — but every read now falls through to expensive rebuilds at once","No impact","Only new users are affected"],"answer":1,"why":"This is why derived-versus-authoritative was worth being religious about: no data was destroyed, so it's a bad afternoon rather than a company-ending event. But 34,700 reads/sec all missing simultaneously is unit 13's thundering herd at full scale, so the recovery plan matters as much as the fact that recovery is possible."},{"id":"feed-3-6","type":"multiple_choice","prompt":"A user follows someone new. What has to happen to their feed?","choices":["Nothing — new posts will fan out to them","New posts arrive naturally, but the new followee's EXISTING posts aren't in the list — so you either backfill them or accept the feed only fills in going forward","The whole feed must be rebuilt","The follow is queued"],"answer":1,"why":"Fan-out only pushes at post time, so a follow made afterwards inherits nothing historical — the list has a start date. Backfilling means merging that account's recent posts into the list, which is a small job for one follow and a large one when someone imports a thousand. Most products just let the feed fill forward, which users barely notice."}]},{"id":"feed-4","title":"Ranking, paging, and lies","exercises":[{"id":"feed-4-0","type":"concept","title":"Fan-out doesn't build your feed — it builds a shortlist someone still has to rank","viz":{"nodes":[{"id":"f","label":"Fan-out list","sub":"write time","col":0,"kind":"cache"},{"id":"c","label":"Celebrity posts","sub":"read time","col":0,"kind":"db"},{"id":"k","label":"Candidate set","sub":"a few hundred","col":1},{"id":"r","label":"Rank for this reader","sub":"right now","col":2,"kind":"server"},{"id":"p","label":"One page","sub":"~20 posts","col":3}],"edges":[{"from":"f","to":"k"},{"from":"c","to":"k"},{"from":"k","to":"r"},{"from":"r","to":"p"}]},"body":"Ask what kind of thing an ordering is. Chronological order lives in the posts themselves — two posts have a fixed order and always will. Relevance doesn't live in the posts at all. It lives in *you, right now*: this session, what you just scrolled past, what's happening this minute. Two different kinds of fact, and only one of them can be settled in advance.","note":"Ranking at read time sounds like the expensive work you spent the unit avoiding. It isn't, and the reason is the candidate set: a few hundred posts, not millions. What ranking costs depends on how much you had to rank."},{"id":"feed-4-1","type":"multiple_choice","prompt":"Your feed is ranked by relevance, not time. What does that break about fan-out on write?","choices":["Nothing","The precomputed list was ordered at write time, but relevance depends on the reader and the moment — so you can no longer bake the final order in advance","It makes fan-out cheaper","It requires a graph database"],"answer":1,"why":"Chronological order is a property of the posts, so it can be materialized; relevance is a property of the reader right now, so it can't. The usual resolution is to keep fan-out as a candidate-generation step — it decides WHICH posts you might see — and rank those candidates at read time, which is affordable because the candidate set is a few hundred rather than millions."},{"id":"feed-4-2","type":"multiple_choice","prompt":"Your feed uses ?offset=40&limit=20 for the third page. New posts arrive while the user scrolls. What do they see?","choices":["The next 20 posts correctly","Duplicates: new posts shifted everything down, so items they already saw are pushed into the next page","Nothing changes","An error"],"answer":1,"why":"Offset counts from the top of a list that keeps growing at the top, so every new post shifts the window and re-serves items the user already read. This is exactly unit 3's offset-pagination flaw, and a feed is its worst case: the insert rate is high and the insertions are precisely at the boundary offset depends on."},{"id":"feed-4-3","type":"multiple_choice","prompt":"So how do feeds paginate correctly?","choices":["Cache the first page","Cursor pagination — 'give me 20 items after this specific post' — so new arrivals at the top can't shift the window","Freeze the feed while scrolling","Use bigger pages"],"answer":1,"why":"A cursor names a position in the data rather than a count from a moving edge, so inserts above it are irrelevant to what comes next. That's why every real feed hands you an opaque cursor instead of a page number — and it's the same reasoning that made cursors right for the API unit, arriving here with much higher stakes."},{"id":"feed-4-4","type":"multi_select","prompt":"Which parts of a feed can be eventually consistent? Select all.","choices":["A followee's post appearing in your feed a few seconds late","The like count on a post","Your own post appearing in your own profile immediately after posting","A blocked user's posts continuing to appear"],"answer":[0,1],"why":"Nobody can tell whether a friend's post arrived instantly or three seconds ago, and an approximate like count harms nobody. Your own post is unit 19's read-your-writes — its absence looks like data loss and you'll be told about it. And a block that doesn't take effect isn't staleness, it's a safety failure that can put someone in danger, so it needs to be correct immediately."},{"id":"feed-4-5","type":"tradeoff_slider","prompt":"A user deletes a post that's already been fanned out to 200,000 feed lists. Slide toward your approach.","leftLabel":"Purge it from all 200,000 lists now","rightLabel":"Leave the ids; filter deleted posts at read time","answerRange":[55,100],"why":"The lists hold ids rather than content, so a deleted post is already just a dangling pointer — you're hydrating posts at read time anyway, and skipping a missing one is nearly free. Chasing 200,000 lists is a huge write storm to save a filter. The caveat that decides the other direction: if deletion is a safety or legal matter, 'filtered at read time' isn't good enough, because a missed filter is a leak."},{"id":"feed-4-6","type":"multiple_choice","prompt":"Summarize the news feed design.","choices":["Query posts from followees at read time, cached","Precompute feeds on write for ordinary users, query live for celebrities, merge and rank at read time — with cursor pagination and derived lists you can rebuild","A graph database traversal per read","Fan out everything to everyone"],"answer":1,"why":"The whole design is one tradeoff resolved twice: reads dominate, so precompute — except where precomputing explodes, so query live there instead. Everything else follows from that hybrid: the lists are derived and rebuildable, ranking has to happen at read time because it depends on the reader, and cursors exist because the list you're paging through keeps growing at the top."}]}]};
